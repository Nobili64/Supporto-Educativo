:"Sostituisci nella formula","do":"Usa unità coerenti e conserva l’ordine del rapporto.","help":"m/V non è V/m."},{"title":"Ricostruisci un dato","do":"Moltiplica il risultato per il denominatore e interpreta la media.","help":"Una velocità media non descrive ogni istante."}],"transfer":{"task":"Un campione ha massa 90 g e volume 30 cm³. Un oggetto percorre 240 m in 60 s. Calcola densità e velocità medie e verifica.","check":"d = 90/30 = 3 g/cm³; v = 240/60 = 4 m/s. Controlli: 3 × 30 = 90 g; 4 × 60 = 240 m."},"checks":["I dati hanno simboli e unità","Il rapporto ha l’ordine corretto","La verifica ricostruisce il dato iniziale"],"error":{"wrong":"Densità = 40/120 = 1/3 cm³/g.","why":"Hai invertito la formula e ottenuto un’altra grandezza.","fix":"Usa massa/volume: 120/40 = 3 g/cm³."},"home":["Per il tuo problema quantitativo conserva dati e verifica nella stessa pagina.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Etichetta le grandezze","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa una scheda dati-formula-sostituzione-unità; lascia calcolatrice e formulario disponibili per concentrarti sul significato.","preserve":"Risolvere un problema quantitativo con grandezze e unità coerenti.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Chiedi che cosa è stato osservato e che cosa è una spiegazione. Riduci le domande guida, mantenendo gli strumenti di lettura e registrazione utili. Gli esempi non sostituiscono procedure di laboratorio autorizzate; evita esperimenti con calore, corrente di rete o sostanze non previste.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M10-11","goal":"Collegare un principio scientifico a una scelta di salute o ambiente senza conclusioni eccessive.","materials":["carta e matita","testo e dati riportati nella consegna"],"techniques":[{"name":"Catena scelta-effetto","how":"Scrivi scelta → processo → effetto e aggiungi una condizione.","why":"Trasforma uno slogan in una spiegazione controllabile."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Il collegamento cita un meccanismo; La scelta è concreta; Sono evitati “sempre”, “zero impatto” o garanzie assolute. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Dati didattici: una borraccia riutilizzabile evita bottiglie monouso quando è usata molte volte; va pulita secondo le istruzioni. Un rubinetto aperto durante la spazzolatura consuma più acqua che chiuderlo mentre non serve. Collega scelta, meccanismo e limite.","work":["Borraccia: riuso → minore richiesta di bottiglie monouso per quelle bevande; considero pulizia e durata.","Rubinetto: chiusura quando non serve → minore tempo di flusso → meno acqua consumata a parità di portata.","Non concludo che qualsiasi borraccia abbia sempre impatto zero; produzione, uso e pulizia hanno effetti."],"result":"Due collegamenti motivati: riuso riduce monouso; ridurre il tempo del rubinetto riduce il consumo. Pulizia resta necessaria secondo le istruzioni del prodotto."},"steps":[{"title":"Identifica il principio","do":"Nel testo scolastico trova il meccanismo: riuso, rimozione, flusso o consumo.","help":"Non basta scrivere “fa bene”."},{"title":"Collega una scelta","do":"Indica un comportamento concreto e come cambia il processo.","help":"Chiudere il rubinetto cambia il tempo di flusso."},{"title":"Mantieni il limite","do":"Scrivi una condizione o ciò che la scelta non garantisce.","help":"Un esempio di salute non è una diagnosi o consiglio individuale."}],"transfer":{"task":"Dati: lavare le mani secondo le indicazioni scolastiche aiuta a ridurre la trasmissione di alcuni microrganismi; spegnere una luce inutilizzata riduce il suo consumo elettrico. Spiega un collegamento per salute e uno per ambiente, con un limite.","check":"Salute: lavaggio → rimozione di parte dei microrganismi → riduzione del rischio di alcune trasmissioni, senza garantire assenza di malattia. Ambiente: spegnimento → minore tempo acceso → minor consumo di quella luce; il risparmio totale dipende anche da potenza e durata."},"checks":["Il collegamento cita un meccanismo","La scelta è concreta","Sono evitati “sempre”, “zero impatto” o garanzie assolute"],"error":{"wrong":"Lavare le mani impedisce ogni malattia.","why":"La prevenzione riduce alcuni rischi senza azzerarli tutti.","fix":"Scrivi “aiuta a ridurre la trasmissione di alcuni microrganismi”."},"home":["Per un argomento di salute o ambiente del tuo libro scrivi un collegamento motivato e un limite.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Identifica il principio","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa una catena con tre caselle e una quarta “limite”; leggi il testo in brevi parti senza chiedere dati sanitari personali.","preserve":"Collegare un principio scientifico a una scelta di salute o ambiente senza conclusioni eccessive.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Chiedi che cosa è stato osservato e che cosa è una spiegazione. Riduci le domande guida, mantenendo gli strumenti di lettura e registrazione utili. Gli esempi non sostituiscono procedure di laboratorio autorizzate; evita esperimenti con calore, corrente di rete o sostanze non previste.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M11-01","goal":"Ricavare chi, quando e dove da un breve ascolto in inglese.","materials":["carta e penna","copione riportato qui; persona che lo legga per le attività di ascolto","dizionario o modello linguistico quando utile"],"techniques":[{"name":"Ascolto orientato","how":"Prepara cinque caselle e cerca le parole che rispondono a quelle domande.","why":"Riduce il numero di informazioni da inseguire insieme."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Il copione non è visibile durante l’ascolto; Le risposte riguardano i dati ascoltati; Le incertezze sono segnate prima del confronto. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Fai leggere due volte, senza vedere il testo durante l’ascolto: “Hi, I’m Ben. On Friday I go to the library at four. I meet my friend Amy there.” Domande: chi parla? Quale giorno? Dove e a che ora? Chi incontra?","work":["Prima lettura: riconosco il tema, un incontro in biblioteca.","Seconda lettura: annoto Ben, Friday, library, four, Amy nei cinque spazi delle domande.","Dopo l’ascolto confronto con il copione: “at four” indica le quattro, non quattro amici."],"result":"Ben; Friday; at the library; at four; Amy."},"steps":[{"title":"Prepara le domande","do":"Sul tuo ascolto scrivi chi, quando, dove e attività prima di iniziare.","help":"Non cercare ogni parola al primo ascolto."},{"title":"Ascolta in due giri","do":"Nel primo identifica il tema; nel secondo completa i dati.","help":"Lascia un trattino dove non hai colto l’informazione."},{"title":"Verifica i punti incerti","do":"Chiedi una ripetizione mirata e confronta con il testo solo dopo.","help":"Non trasformare una parola non sentita in una risposta inventata."}],"transfer":{"task":"Copione da far leggere due volte: “Hello, I’m Mia. On Tuesday I play tennis in the park at five. I play with Leo.” Chi? Giorno? Attività? Luogo? Ora? Con chi?","check":"Mia; Tuesday; tennis; in the park; at five; Leo. Chi ascolta non deve avere il copione visibile. Se lo legge da solo, la prova riguarda comprensione scritta."},"checks":["Il copione non è visibile durante l’ascolto","Le risposte riguardano i dati ascoltati","Le incertezze sono segnate prima del confronto"],"error":{"wrong":"Rispondo Monday perché è il giorno che conosco meglio.","why":"La parola deve provenire dall’ascolto, non dalla familiarità.","fix":"Lascia la casella incerta e riascolta il tratto sul giorno."},"home":["Usa un breve ascolto del corso con quattro caselle; senza lettore disponibile ripassa il lessico, ma non chiamarlo prova orale.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Prepara le domande","difficulty":"Perdo le informazioni mentre ascolto","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Concorda una lettura chiara con pause fra le frasi e una tabella di domande; evita di mostrare in anticipo le risposte.","preserve":"Ricavare chi, quando e dove da un breve ascolto in inglese.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Modella una frase e riduci progressivamente i suggerimenti sul suo contenuto; mantieni dizionario, scaletta e strumenti compensativi. Valuta separatamente comprensione, produzione e correttezza. Il copione scritto non verifica la comprensione orale: per quella serve una lettura realmente ascoltata.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M11-02","goal":"Comprendere un testo inglese usando indizi e informazioni esplicite.","materials":["carta e penna","copione riportato qui; persona che lo legga per le attività di ascolto","dizionario o modello linguistico quando utile"],"techniques":[{"name":"Lettura con evidenza","how":"Abbina ogni risposta a un frammento preciso del testo.","why":"Tiene la comprensione ancorata alle informazioni disponibili."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Ogni risposta ha una frase di supporto; I pronomi hanno un referente corretto; La negazione è conservata. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Leggi: “Sara lives near a small park. Every Saturday she rides her bike there with her brother. They take water but they do not take food.” Dove vive? Quando va al parco? Con chi? Che cosa portano e non portano?","work":["Cerco “lives near”: Sara abita vicino a un piccolo parco.","Collego “Every Saturday” all’attività e “with her brother” alla persona.","La negazione “do not” riguarda food: portano acqua, non cibo."],"result":"Near a small park; every Saturday; with her brother; they take water, but they do not take food."},"steps":[{"title":"Leggi la domanda","do":"Nel tuo testo sottolinea le parole della domanda che indicano il dato da cercare.","help":"“When?” chiede il tempo, “Who with?” una persona."},{"title":"Trova la frase prova","do":"Accanto a ogni risposta copia poche parole del testo che la sostengono.","help":"Non basta una risposta plausibile sulla vita di Sara."},{"title":"Controlla pronomi e no","do":"Verifica a chi si riferiscono he/she/they e quale parte è negata.","help":"“They do not take food” non nega l’acqua."}],"transfer":{"task":"Leggi: “Tom visits his aunt on Sundays. She has two cats. Tom brings a book, but he does not bring his phone.” Quando visita la zia? Quanti gatti ha lei? Che cosa porta e non porta Tom?","check":"On Sundays; two cats; a book, not his phone. “She” indica la zia."},"checks":["Ogni risposta ha una frase di supporto","I pronomi hanno un referente corretto","La negazione è conservata"],"error":{"wrong":"They take food perché ho visto la parola food.","why":"La negazione cambia la frase.","fix":"Leggi tutto il gruppo “do not take food”."},"home":["Su un breve testo del corso segna il frammento che giustifica ogni risposta.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Leggi la domanda","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Fornisci il testo in righe brevi con spazio fra le frasi; usa un segnariga o lettura audio mantenendo visibili le domande.","preserve":"Comprendere un testo inglese usando indizi e informazioni esplicite.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Modella una frase e riduci progressivamente i suggerimenti sul suo contenuto; mantieni dizionario, scaletta e strumenti compensativi. Valuta separatamente comprensione, produzione e correttezza. Il copione scritto non verifica la comprensione orale: per quella serve una lettura realmente ascoltata.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M11-03","goal":"Scambiare informazioni in una conversazione breve e chiedere chiarimenti.","materials":["carta e penna","copione riportato qui; persona che lo legga per le attività di ascolto","dizionario o modello linguistico quando utile"],"techniques":[{"name":"Prova a ruoli","how":"Alterna A e B usando prima una carta con intenzioni e poi una sola parola per turno.","why":"Allena domanda, risposta e adattamento al compagno."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Le risposte seguono la domanda; Entrambi hanno turni; Compare una richiesta di chiarimento pertinente. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Con un compagno rappresenta: A vuole sapere quale sport piace a B e in quale giorno lo pratica. B ama tennis e gioca il sabato. A non sente il giorno e chiede di ripeterlo.","work":["A apre con “What sport do you like?”; B risponde “I like tennis.”","A chiede “When do you play?”; B risponde “On Saturdays.”","A chiede “Sorry, can you repeat that?”; B ripete “On Saturdays.”; A chiude “Thanks!”"],"result":"Dialogo: “What sport do you like?” “I like tennis.” “When do you play?” “On Saturdays.” “Sorry, can you repeat that?” “On Saturdays.” “Thanks!”"},"steps":[{"title":"Prepara due intenzioni","do":"Per il tuo dialogo scrivi che cosa vuoi chiedere e che cosa devi rispondere.","help":"Non preparare solo un monologo."},{"title":"Scambia un turno","do":"Ascolta la domanda e rispondi al dato richiesto prima di continuare.","help":"What sport? non richiede subito il giorno."},{"title":"Ripara l’incomprensione","do":"Usa una frase per chiedere ripetizione e riprendi lo scambio.","help":"Non fingere di capire: “Can you repeat that?” è parte del compito."}],"transfer":{"task":"A chiede a B quale cibo piace e dove lo mangia. B ama pizza e la mangia a casa. A chiede di ripetere il luogo. Scrivi e prova il dialogo.","check":"Una soluzione: “What food do you like?” “I like pizza.” “Where do you eat it?” “At home.” “Can you repeat that, please?” “At home.” “Thank you.” Controlla scambio di turni e riparazione dell’incomprensione."},"checks":["Le risposte seguono la domanda","Entrambi hanno turni","Compare una richiesta di chiarimento pertinente"],"error":{"wrong":"A chiede Where? e B risponde On Saturdays.","why":"La domanda chiede un luogo, non un giorno.","fix":"Rispondi con il luogo e riserva il giorno a When?."},"home":["Prova il tuo dialogo cambiando un solo dato e alternando i ruoli.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Prepara due intenzioni","difficulty":"Dimentico che cosa devo chiedere quando arriva il mio turno","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa carte con “chiedi sport”, “rispondi”, “chiedi giorno”, “ripeti”; concedi qualche secondo di preparazione.","preserve":"Scambiare informazioni in una conversazione breve e chiedere chiarimenti.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Modella una frase e riduci progressivamente i suggerimenti sul suo contenuto; mantieni dizionario, scaletta e strumenti compensativi. Valuta separatamente comprensione, produzione e correttezza. Il copione scritto non verifica la comprensione orale: per quella serve una lettura realmente ascoltata.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M11-04","goal":"Organizzare una presentazione e un breve racconto orale con un ordine chiaro.","materials":["carta e penna","copione riportato qui; persona che lo legga per le attività di ascolto","dizionario o modello linguistico quando utile"],"techniques":[{"name":"Scaletta e recupero orale","how":"Passa da frasi modello a parole guida, poi prova a ricostruire le frasi.","why":"Sostiene l’ordine senza dipendere dalla lettura integrale."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: La presentazione contiene i dati richiesti; Il racconto segnala il tempo passato; Gli eventi sono ordinati. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Prepara due mini-interventi: presenta Nora, 12 anni, appassionata di disegno; racconta la sua domenica passata: visita alla nonna e partita a carte.","work":["Presentazione al presente: “This is Nora. She is twelve. She likes drawing.”","Racconto al passato: “Last Sunday she visited her grandmother. Then she played cards.”","Uso una scaletta “who/age/interest” e una “when/first/then”; le leggo solo come parole guida."],"result":"Presentazione: “This is Nora. She is twelve and she likes drawing.” Racconto: “Last Sunday she visited her grandmother. Then she played cards.”"},"steps":[{"title":"Separa i due scopi","do":"Sul tuo compito scegli se presenti una persona o racconti eventi.","help":"Una presentazione può essere al presente; un racconto passato va marcato."},{"title":"Costruisci la scaletta","do":"Scrivi tre parole per presentare e tre per raccontare.","help":"Usa then per legare due eventi senza memorizzare un blocco unico."},{"title":"Prova e ascolta","do":"Pronuncia l’intervento e controlla dati, tempi e ordine con un ascoltatore.","help":"Una pausa per guardare la scaletta è consentita durante l’apprendimento."}],"transfer":{"task":"Presenta Leo, 13 anni, amante della musica. Racconta il suo sabato scorso: pulizia della camera e ascolto di musica. Prova senza leggere frasi intere.","check":"“This is Leo. He is thirteen. He likes music. Last Saturday he cleaned his room. Then he listened to music.” Criteri: dati completi, separazione presente/passato, ordine temporale; sono possibili frasi equivalenti."},"checks":["La presentazione contiene i dati richiesti","Il racconto segnala il tempo passato","Gli eventi sono ordinati"],"error":{"wrong":"Last Sunday she visit her grandmother.","why":"L’indicazione è passata, ma il verbo è al presente.","fix":"Usa visited nel racconto e visits per un’abitudine."},"home":["Sul tuo argomento orale prepara una scaletta e prova separatamente presentazione e racconto.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Separa i due scopi","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa due riquadri distinti con parole guida; consenti una pausa fra presentazione e racconto e la scaletta compensativa.","preserve":"Organizzare una presentazione e un breve racconto orale con un ordine chiaro.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Modella una frase e riduci progressivamente i suggerimenti sul suo contenuto; mantieni dizionario, scaletta e strumenti compensativi. Valuta separatamente comprensione, produzione e correttezza. Il copione scritto non verifica la comprensione orale: per quella serve una lettura realmente ascoltata.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M11-05","goal":"Scrivere messaggio, e-mail, descrizione e racconto adattando contenuto e forma.","materials":["carta e penna","copione riportato qui; persona che lo legga per le attività di ascolto","dizionario o modello linguistico quando utile"],"techniques":[{"name":"Pianificazione per genere","how":"Prepara quattro riquadri con scopo e dati prima di scrivere.","why":"Rende esplicite le differenze fra produzioni richieste."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Le quattro varianti sono riconoscibili; Giorno e ora sono corretti negli inviti; Descrizione e racconto usano tempi coerenti. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Usa questi dati: incontro sabato alle 15 al parco; amica Eva; luogo con due alberi e una panchina; ieri pioveva e il gruppo è rimasto a casa. Scrivi quattro testi brevi: messaggio, e-mail, descrizione, racconto.","work":["Messaggio essenziale: “Hi Eva! Let’s meet in the park on Saturday at three.” E-mail con apertura e chiusura: “Dear Eva, Let’s meet in the park on Saturday at three. See you soon, Alex.”","Descrizione al presente: “The park has two trees and a bench.”","Racconto al passato: “Yesterday it rained. We stayed at home.” Controllo che ieri non diventi sabato."],"result":"I quattro testi sopra sono completi per i dati assegnati: messaggio/e-mail propongono l’incontro; descrizione presenta il luogo; racconto riferisce eventi passati."},"steps":[{"title":"Scegli forma e destinatario","do":"Nel tuo compito indica chi legge e se inviti, descrivi o racconti.","help":"Non copiare un racconto dentro una descrizione senza segnare il passato."},{"title":"Distribuisci i dati","do":"Assegna ogni dato al testo che ne ha bisogno.","help":"E-mail e messaggio condividono l’invito; solo e-mail richiede qui apertura e firma."},{"title":"Rivedi in due giri","do":"Prima controlla informazioni e forma, poi verbi, maiuscole e punteggiatura.","help":"Non correggere tutte le parole mentre stai ancora decidendo il contenuto."}],"transfer":{"task":"Dati nuovi: incontro lunedì alle 16 in biblioteca; amico Sam; biblioteca con tre tavoli; ieri visita a uno zio. Scrivi le stesse quattro forme.","check":"Possibile soluzione: messaggio “Hi Sam! Let’s meet at the library on Monday at four.” E-mail “Dear Sam, Let’s meet at the library on Monday at four. See you soon, Alex.” Descrizione “The library has three tables.” Racconto “Yesterday I visited my uncle.” Controlla destinatario, luogo, giorno/ora e tempi."},"checks":["Le quattro varianti sono riconoscibili","Giorno e ora sono corretti negli inviti","Descrizione e racconto usano tempi coerenti"],"error":{"wrong":"Yesterday I visit my uncle.","why":"Il racconto riguarda ieri, quindi richiede un tempo passato.","fix":"Scrivi visited; controlla poi che l’invito resti al tempo adatto."},"home":["Per il tuo testo prepara destinatario, scopo e tre informazioni prima della bozza.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Scegli forma e destinatario","difficulty":"Conosco la frase ma nella scrittura perdo lettere o desinenze","categories":["disortografia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa una lista breve di controllo ortografico e dizionario; se la scrittura è faticosa, detta prima il contenuto e correggi un tipo di errore alla volta.","preserve":"Scrivere messaggio, e-mail, descrizione e racconto adattando contenuto e forma.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Modella una frase e riduci progressivamente i suggerimenti sul suo contenuto; mantieni dizionario, scaletta e strumenti compensativi. Valuta separatamente comprensione, produzione e correttezza. Il copione scritto non verifica la comprensione orale: per quella serve una lettura realmente ascoltata.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M11-06","goal":"Applicare una regola grammaticale e distinguere affermazione, negazione e domanda.","materials":["carta e penna","copione riportato qui; persona che lo legga per le attività di ascolto","dizionario o modello linguistico quando utile"],"techniques":[{"name":"Confronto di strutture","how":"Metti affermativa, negativa e domanda in tre righe evidenziando plays/play e does.","why":"Mostra dove compare il segnale della terza persona."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Soggetto e forma sono riconosciuti; Dopo does il verbo è alla base; La domanda ha ordine e punto interrogativo. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Al present simple trasforma “She plays tennis” in negativa e interrogativa. Spiega che cosa accade alla -s.","work":["Affermazione: she richiede plays con -s.","Negativa: “She does not play tennis.” Dopo does il verbo torna alla forma base play.","Domanda: “Does she play tennis?” Does precede she; play non ha -s."],"result":"She plays tennis. She does not play tennis. Does she play tennis?"},"steps":[{"title":"Identifica soggetto e forma","do":"Nel tuo esercizio segna persona e richiesta: affermativa, negativa o domanda.","help":"She è terza persona singolare; they no."},{"title":"Applica la struttura","do":"Scrivi soggetto + does not + base oppure does + soggetto + base.","help":"Il segnale grammaticale è già in does."},{"title":"Confronta le tre frasi","do":"Verifica che significato lessicale e oggetto restino uguali.","help":"Cambiano struttura e polarità, non lo sport."}],"transfer":{"task":"Trasforma “He reads books” in negativa e domanda. Scrivi anche la forma affermativa con They.","check":"He does not read books. Does he read books? They read books. La -s resta solo nell’affermativa alla terza persona singolare."},"checks":["Soggetto e forma sono riconosciuti","Dopo does il verbo è alla base","La domanda ha ordine e punto interrogativo"],"error":{"wrong":"Does she plays tennis?","why":"La -s è stata marcata due volte.","fix":"Usa Does she play tennis?."},"home":["Su tre frasi del tuo corso cambia la forma e controlla il verbo dopo does.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Identifica soggetto e forma","difficulty":"Perdo l’ordine dei passaggi","categories":["disortografia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Tieni una tabella affermativa/negativa/domanda e una carta “dopo does: base”; controlla una struttura alla volta.","preserve":"Applicare una regola grammaticale e distinguere affermazione, negazione e domanda.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Modella una frase e riduci progressivamente i suggerimenti sul suo contenuto; mantieni dizionario, scaletta e strumenti compensativi. Valuta separatamente comprensione, produzione e correttezza. Il copione scritto non verifica la comprensione orale: per quella serve una lettura realmente ascoltata.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M11-07","goal":"Imparare lessico in espressioni utili e recuperarlo dal significato.","materials":["carta e penna","copione riportato qui; persona che lo legga per le attività di ascolto","dizionario o modello linguistico quando utile"],"techniques":[{"name":"Recupero in contesto","how":"Usa carte italiano/inglese con espressioni complete e poi frasi a spazio vuoto.","why":"Allena a richiamare parole utilizzabili nella produzione."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: L’espressione è completa; La frase mantiene il significato; La risposta è tentata prima del confronto. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Associa significato ed espressione: fare colazione = have breakfast; prendere l’autobus = take the bus; fare i compiti = do homework. Completa “I ___ breakfast at seven. I ___ the bus at eight. I ___ homework in the afternoon.”","work":["Imparo i tre gruppi interi, non traduco solo i verbi isolati.","Completo have, take, do seguendo l’espressione.","Copro l’inglese e ricostruisco ogni gruppo dal significato italiano; poi li inserisco nelle frasi."],"result":"I have breakfast at seven. I take the bus at eight. I do homework in the afternoon."},"steps":[{"title":"Raccogli gruppi utili","do":"Nel tuo elenco scrivi verbo e parole che lo accompagnano.","help":"Listen to music include to."},{"title":"Crea una frase","do":"Usa ogni gruppo in una situazione breve e chiara.","help":"Una frase aiuta a ricordare l’uso, non soltanto la traduzione."},{"title":"Recupera e controlla","do":"Copri l’inglese, prova dal significato e scopri solo dopo.","help":"Segna i gruppi non recuperati per il ripasso."}],"transfer":{"task":"Nuovi gruppi: andare a letto = go to bed; ascoltare musica = listen to music; giocare a calcio = play football. Completa “I ___ at ten. I ___ after school. I ___ on Saturdays.”","check":"I go to bed at ten. I listen to music after school. I play football on Saturdays. Devono comparire anche to nei primi due gruppi quando richiesto."},"checks":["L’espressione è completa","La frase mantiene il significato","La risposta è tentata prima del confronto"],"error":{"wrong":"I make homework.","why":"Il modello dato usa do homework, non make.","fix":"Ripeti e usa il gruppo intero do homework in una frase."},"home":["Dal tuo lessico scegli tre gruppi frequenti e costruisci tre frasi di recupero.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Raccogli gruppi utili","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Limita il blocco a tre espressioni, con significato e frase leggibili; usa audio del corso se la lettura interferisce.","preserve":"Imparare lessico in espressioni utili e recuperarlo dal significato.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Modella una frase e riduci progressivamente i suggerimenti sul suo contenuto; mantieni dizionario, scaletta e strumenti compensativi. Valuta separatamente comprensione, produzione e correttezza. Il copione scritto non verifica la comprensione orale: per quella serve una lettura realmente ascoltata.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M11-08","goal":"Usare un modello ascoltato per distinguere pronuncia e intonazione.","materials":["carta e penna","copione riportato qui; persona che lo legga per le attività di ascolto","dizionario o modello linguistico quando utile"],"techniques":[{"name":"Ascolto-imitazione-confronto","how":"Alterna modello e produzione su una sola coppia e verifica la parola riconosciuta.","why":"Fornisce un controllo esterno dell’intelligibilità."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: È stato ascoltato un modello reale; La differenza è controllata dall’ascoltatore; Non si usa una trascrizione italiana come prova. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Un lettore competente o audio del corso pronuncia “I can swim.” e “Can you swim?”. Ascolta, segna le parole su cui senti rilievo e ripeti. Confronta anche ship e sheep come coppia, senza trascrizioni italiane.","work":["Distinguo l’affermazione dalla domanda prima di imitare il modello. In una domanda sì/no isolata il modello può usare una salita finale, non è una regola di ogni domanda.","Per ship/sheep ascolto la qualità vocalica e la durata nel modello; non riduco la differenza solo a “i breve/lunga”.","Ripeto un elemento per volta e chiedo al lettore quale parola ha riconosciuto; correggo dal modello sonoro, non dall’ortografia italiana."],"result":"Produzione esemplificativa: affermazione e domanda riconoscibili nel modello scelto; ship e sheep riconosciute come parole diverse dall’ascoltatore. Senza ascolto reale non si dichiara la pronuncia verificata."},"steps":[{"title":"Ascolta prima di leggere","do":"Nel tuo esercizio confronta un breve modello sonoro e il testo.","help":"Non inventare la pronuncia da una scrittura italiana approssimata."},{"title":"Imita un segmento","do":"Ripeti una parola o un gruppo, poi la frase.","help":"Concentrati su una sola differenza per volta."},{"title":"Chiedi riconoscimento","do":"Fai scegliere all’ascoltatore fra due parole senza mostrargli la tua scelta.","help":"Se non distingue, riascolta e riprova invece di aumentare solo il volume."}],"transfer":{"task":"Con un modello competente ascolta e ripeti “I can dance.” e “Can you dance?”. Prova sit e seat. L’ascoltatore deve indicare quale parola sente senza vederla.","check":"Criteri: affermazione/domanda distinte per struttura e intonazione coerente con il modello; sit/seat riconoscibili con qualità vocalica diversa. Una verifica scritta dei quattro testi non basta; registra esito dell’ascoltatore, anche “non ancora distinto”."},"checks":["È stato ascoltato un modello reale","La differenza è controllata dall’ascoltatore","Non si usa una trascrizione italiana come prova"],"error":{"wrong":"Sheep è solo ship pronunciato più forte.","why":"L’accento di volume non sostituisce la distinzione vocalica.","fix":"Confronta la vocale nel modello e chiedi riconoscimento senza testo visibile."},"home":["Riprendi una sola coppia dal tuo corso con un modello reale; se manca, prepara le parole ma rinvia il controllo sonoro.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Ascolta prima di leggere","difficulty":"Non riesco a distinguere due suoni ascoltandoli una sola volta","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Concedi più riascolti brevi e testo separato dal momento di ascolto; non valutare la velocità di ripetizione.","preserve":"Usare un modello ascoltato per distinguere pronuncia e intonazione.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Modella una frase e riduci progressivamente i suggerimenti sul suo contenuto; mantieni dizionario, scaletta e strumenti compensativi. Valuta separatamente comprensione, produzione e correttezza. Il copione scritto non verifica la comprensione orale: per quella serve una lettura realmente ascoltata.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M11-09","goal":"Confrontare una pratica culturale descritta senza trasformarla in stereotipo.","materials":["carta e penna","copione riportato qui; persona che lo legga per le attività di ascolto","dizionario o modello linguistico quando utile"],"techniques":[{"name":"Confronto contestualizzato","how":"Usa le colonne “nel testo”, “nel contesto che confronto”, “non so”.","why":"Aiuta a separare informazione e generalizzazione."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Il contesto è nominato; Some/others non diventano everyone; La domanda confronta una pratica precisa. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Testo didattico originale, su una scuola immaginaria: “At River School, some pupils eat a packed lunch. Others buy lunch in the school canteen. Lessons start at nine.” Elenca tre dati e formula una domanda di confronto con la tua scuola, senza generalizzare a tutto un Paese.","work":["Rilevo some e others: esistono almeno due modalità di pranzo nella scuola descritta.","Registro orario: le lezioni iniziano alle nove.","Domanda di confronto: “Where do pupils eat lunch in our school?” Limito le conclusioni a River School, non a tutte le scuole anglofone."],"result":"Dati: alcuni portano il pranzo; altri lo comprano in mensa; in quella scuola le lezioni iniziano alle nove. Domanda pertinente sul pranzo nella propria scuola."},"steps":[{"title":"Identifica la fonte e il luogo","do":"Nel testo culturale scrivi a chi o a quale luogo si riferisce.","help":"L’esempio è immaginario: non è una descrizione di un sistema nazionale."},{"title":"Cerca somiglianze e differenze","do":"Confronta una pratica precisa, non il valore delle persone.","help":"Pranzo portato e mensa possono coesistere."},{"title":"Limita la conclusione","do":"Conserva parole come some e in this school.","help":"Una pratica di un gruppo non descrive tutti gli abitanti."}],"transfer":{"task":"Testo originale su un club immaginario: “At Lake Club, children borrow books on Thursdays. Some read stories; others choose comics.” Scrivi due dati e una domanda di confronto; indica che cosa non puoi concludere.","check":"Dati: prestito il giovedì; alcuni scelgono racconti, altri fumetti. Domanda: “What books do children choose in our library?” Non puoi concludere che tutti i bambini di un Paese leggano fumetti o che il prestito sia sempre giovedì."},"checks":["Il contesto è nominato","Some/others non diventano everyone","La domanda confronta una pratica precisa"],"error":{"wrong":"Tutti gli inglesi portano il pranzo da casa.","why":"Il testo è immaginario e parla solo di alcuni alunni di una scuola.","fix":"Scrivi “In River School, some pupils…” e cerca fonti specifiche per domande reali."},"home":["Sul testo culturale assegnato indica il contesto e una conclusione che non è giustificata.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Identifica la fonte e il luogo","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Metti luogo e parole di quantità in un riquadro; usa una tabella di confronto con una riga per ogni pratica.","preserve":"Confrontare una pratica culturale descritta senza trasformarla in stereotipo.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Modella una frase e riduci progressivamente i suggerimenti sul suo contenuto; mantieni dizionario, scaletta e strumenti compensativi. Valuta separatamente comprensione, produzione e correttezza. Il copione scritto non verifica la comprensione orale: per quella serve una lettura realmente ascoltata.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M11-10","goal":"Tradurre frasi per significato controllando persona, tempo e negazione.","materials":["carta e penna","copione riportato qui; persona che lo legga per le attività di ascolto","dizionario o modello linguistico quando utile"],"techniques":[{"name":"Traduzione per unità di senso","how":"Prepara blocchi soggetto/azione/tempo e ricostruisci la frase inglese.","why":"Evita la copia dell’ordine italiano quando la struttura cambia."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Soggetto e azione sono mantenuti; Tempo e negazione restano corretti; Il verbo segue la struttura inglese. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Traduci: “Mia sorella non gioca a tennis il lunedì.” e “Ieri abbiamo visitato un museo.”","work":["Prima frase: soggetto my sister; abitudine al presente; negazione con does not; verbo base play.","Scrivo “My sister does not play tennis on Mondays.”","Seconda frase: ieri indica passato; “Yesterday we visited a museum.” Rileggo in italiano per controllare i dati."],"result":"My sister does not play tennis on Mondays. Yesterday we visited a museum."},"steps":[{"title":"Scomponi il significato","do":"Nella tua frase indica chi, azione, tempo e presenza di negazione.","help":"Non tradurre una parola isolata prima di sapere la struttura."},{"title":"Costruisci l’inglese","do":"Scegli prima il tempo e poi l’ordine delle parole.","help":"Con does not usa il verbo base."},{"title":"Ritraduci per controllo","do":"Rileggi il significato italiano della frase ottenuta.","help":"Controlla che ieri non diventi oggi e che non sia sparita la negazione."}],"transfer":{"task":"Traduci “Mio fratello non legge fumetti la domenica.” e “Ieri ho ascoltato musica.”","check":"My brother does not read comics on Sundays. Yesterday I listened to music. Accettabili doesn’t e una formulazione equivalente che mantenga soggetto, negazione e tempo."},"checks":["Soggetto e azione sono mantenuti","Tempo e negazione restano corretti","Il verbo segue la struttura inglese"],"error":{"wrong":"My sister not plays tennis.","why":"Manca l’ausiliare della negativa al present simple.","fix":"Usa My sister does not play tennis."},"home":["Per due frasi del tuo compito registra tempo e negazione prima di tradurre.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Scomponi il significato","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa quattro caselle di significato e un modello di struttura; dizionario disponibile senza chiedere traduzione parola per parola.","preserve":"Tradurre frasi per significato controllando persona, tempo e negazione.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Modella una frase e riduci progressivamente i suggerimenti sul suo contenuto; mantieni dizionario, scaletta e strumenti compensativi. Valuta separatamente comprensione, produzione e correttezza. Il copione scritto non verifica la comprensione orale: per quella serve una lettura realmente ascoltata.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M11-11","goal":"Rappresentare un dialogo con ruoli, obiettivo e risposta comprensibile.","materials":["carta e penna","copione riportato qui; persona che lo legga per le attività di ascolto","dizionario o modello linguistico quando utile"],"techniques":[{"name":"Copione funzionale","how":"Accanto a ogni battuta scrivi a che cosa serve e usa quelle etichette nella seconda prova.","why":"Collega le frasi allo scopo comunicativo."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Ogni battuta risponde alla precedente; Oggetto e prezzo sono coerenti; Entrambi i ruoli sono rappresentati. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Scena in libreria: cliente chiede un quaderno blu; venditore lo offre a 3 euro; cliente compra e ringrazia. Scrivi e rappresenta sei battute.","work":["Definisco ruoli e scopo: acquisto di un quaderno, non una conversazione libera.","Cliente: “Hello. A blue notebook, please.” Venditore: “Here you are.” Cliente: “How much is it?”","Venditore: “It’s three euros.” Cliente: “I’ll take it. Thank you.” Venditore: “You’re welcome.” Controllo oggetto, colore e prezzo."],"result":"Sei battute nell’ordine mostrato; vendita conclusa con notebook blu e prezzo di 3 euro."},"steps":[{"title":"Definisci la scena","do":"Per il tuo dialogo assegna i ruoli e la richiesta da soddisfare.","help":"Segna chi conosce il prezzo."},{"title":"Scrivi le battute","do":"Metti una funzione per turno: saluto/richiesta/offerta/domanda/risposta/chiusura.","help":"Una risposta di prezzo deve seguire How much?."},{"title":"Rappresenta e cambia","do":"Prova con il testo, poi con carte di funzione e inverti i ruoli.","help":"La recitazione non richiede memorizzare tutto senza aiuti."}],"transfer":{"task":"Scena al bar: cliente chiede un succo d’arancia; cameriere lo offre a 2 euro; cliente accetta e ringrazia. Scrivi sei battute e poi cambia i ruoli.","check":"“Hello. An orange juice, please.” “Here you are.” “How much is it?” “It’s two euros.” “I’ll take it. Thank you.” “You’re welcome.” Varianti cortesi equivalenti ammesse; oggetto e prezzo devono rimanere quelli della consegna."},"checks":["Ogni battuta risponde alla precedente","Oggetto e prezzo sono coerenti","Entrambi i ruoli sono rappresentati"],"error":{"wrong":"How much is it? — It is blue.","why":"La domanda chiede il prezzo, non il colore.","fix":"Rispondi It’s three euros; usa blue nella richiesta."},"home":["Ripeti un dialogo scolastico cambiando un oggetto e un prezzo, poi scambia i ruoli.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Definisci la scena","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Dai una carta per ruolo con parole chiave e numero del turno; lascia visibili le formule cortesi.","preserve":"Rappresentare un dialogo con ruoli, obiettivo e risposta comprensibile.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Modella una frase e riduci progressivamente i suggerimenti sul suo contenuto; mantieni dizionario, scaletta e strumenti compensativi. Valuta separatamente comprensione, produzione e correttezza. Il copione scritto non verifica la comprensione orale: per quella serve una lettura realmente ascoltata.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M12-01","goal":"Comprendere brevi ascolti e testi nella seconda lingua cercando dati precisi.","materials":["carta e penna","testi nelle tre lingue riportati qui: lavora nella lingua che studi","persona che legga il copione per l’ascolto; dizionario quando utile"],"techniques":[{"name":"Comprensione orientata","how":"Usa quattro domande uguali e le espressioni della lingua studiata per localizzare i dati.","why":"Rende il compito specifico e confrontabile."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: La modalità ascolto/lettura è esplicita; I quattro dati seguono il testo scelto; L’età non è tradotta con una struttura trasferita a caso. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Scegli la lingua che studi. Per ascolto fai leggere due volte senza vedere il copione; per testo leggi tu. FR: “Je m’appelle Zoé. J’ai douze ans. Je vais à la piscine le samedi.” ES: “Me llamo Ana. Tengo doce años. Voy a la piscina los sábados.” DE: “Ich heiße Lina. Ich bin zwölf Jahre alt. Ich gehe samstags ins Schwimmbad.” Trova nome, età, luogo e giorno.","work":["Preparo quattro caselle prima di leggere o ascoltare.","FR: Zoé, douze, piscine, samedi. ES: Ana, doce, piscina, sábados. DE: Lina, zwölf, Schwimmbad, samstags.","Controllo l’età: francese e spagnolo usano avoir/tener; tedesco usa sein nella formulazione data. Non trasferisco automaticamente la struttura fra lingue."],"result":"FR: Zoé, 12 anni, piscina, sabato. ES: Ana, 12 anni, piscina, sabati. DE: Lina, 12 anni, piscina, sabati. Le tre versioni sono alternative."},"steps":[{"title":"Scegli lingua e modalità","do":"Nel tuo esercizio indica se ascolti o leggi e prepara le caselle.","help":"Lavora in una sola lingua per volta."},{"title":"Cerca i quattro dati","do":"Prima identifica il tema, poi nome, età, luogo e giorno.","help":"Non serve tradurre ogni parola."},{"title":"Confronta con il testo","do":"Dopo il tentativo controlla il dato incerto nel copione.","help":"In ascolto non anticipare il testo; in lettura cerca la frase prova."}],"transfer":{"task":"Nuovi copioni/testi. FR: “Je m’appelle Louis. J’ai treize ans. Je vais au parc le dimanche.” ES: “Me llamo Luis. Tengo trece años. Voy al parque los domingos.” DE: “Ich heiße Lukas. Ich bin dreizehn Jahre alt. Ich gehe sonntags in den Park.” Cerca gli stessi quattro dati nella lingua scelta.","check":"FR Louis, ES Luis, DE Lukas; 13 anni; parco; domenica/domeniche. Per l’ascolto il copione resta nascosto e il confronto si fa dopo; letto autonomamente verifica solo comprensione scritta."},"checks":["La modalità ascolto/lettura è esplicita","I quattro dati seguono il testo scelto","L’età non è tradotta con una struttura trasferita a caso"],"error":{"wrong":"Ich habe zwölf Jahre per dire l’età nel modello tedesco.","why":"È un calco dalla struttura di altre lingue e non è la formula data.","fix":"Usa Ich bin zwölf Jahre alt; in francese J’ai douze ans e in spagnolo Tengo doce años."},"home":["Sul tuo breve testo prepara nome, età, luogo e tempo; distingui sul quaderno lettura e ascolto.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Scegli lingua e modalità","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa una tabella di quattro domande e, nell’ascolto, una lettura con pause fra le frasi; nella lettura usa il segnariga.","preserve":"Comprendere brevi ascolti e testi nella seconda lingua cercando dati precisi.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Scegli la lingua effettivamente studiata e un modello di pronuncia del corso. Riduci i suggerimenti sul contenuto, mantenendo dizionario e scaletta utili. Non richiedere le tre lingue insieme: sono alternative. Il testo scritto non è una verifica dell’ascolto né della pronuncia.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M12-02","goal":"Associare vocaboli a immagini e richiamarli con articolo nella lingua studiata.","materials":["carta e penna","testi nelle tre lingue riportati qui: lavora nella lingua che studi","persona che legga il copione per l’ascolto; dizionario quando utile"],"techniques":[{"name":"Associazione e recupero","how":"Dopo l’abbinamento inverti la direzione: immagine → articolo e parola.","why":"Verifica il richiamo, oltre il riconoscimento fra alternative."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Ogni immagine ha l’etichetta giusta; L’articolo appartiene alla lingua scelta; Il recupero avviene prima del confronto. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Tre immagini sono descritte integralmente: A animale che miagola; B oggetto legato di fogli da leggere; C sedile con schienale. Associa le parole. FR: le livre, la chaise, le chat. ES: la silla, el gato, el libro. DE: die Katze, das Buch, der Stuhl.","work":["Riconosco i significati delle tre immagini prima delle etichette.","FR: A le chat, B le livre, C la chaise. ES: A el gato, B el libro, C la silla. DE: A die Katze, B das Buch, C der Stuhl.","Copro le parole e le recupero dalla descrizione, mantenendo l’articolo; il genere grammaticale può cambiare fra lingue."],"result":"Associazioni A/B/C come sopra; gli articoli fanno parte delle etichette da imparare."},"steps":[{"title":"Identifica l’immagine","do":"Nel tuo compito nomina l’oggetto in italiano o descrivilo prima di scegliere.","help":"Un dettaglio decorativo non cambia l’oggetto."},{"title":"Abbina con articolo","do":"Collega ogni immagine al gruppo articolo + nome della tua lingua.","help":"DE richiede der/die/das; non scegliere dal genere italiano."},{"title":"Recupera senza elenco","do":"Copri le etichette e ripeti da immagine o descrizione.","help":"Scopri dopo e correggi il gruppo completo."}],"transfer":{"task":"Immagini descritte: D animale che abbaia; E tavolo con quattro gambe; F automobile. FR: la voiture, le chien, la table. ES: la mesa, el coche, el perro. DE: der Hund, das Auto, der Tisch. Associa e recupera dalla descrizione.","check":"FR D le chien, E la table, F la voiture. ES D el perro, E la mesa, F el coche. DE D der Hund, E der Tisch, F das Auto. Disegni stilizzati o descrizioni valgono se identificano gli stessi oggetti."},"checks":["Ogni immagine ha l’etichetta giusta","L’articolo appartiene alla lingua scelta","Il recupero avviene prima del confronto"],"error":{"wrong":"In tedesco scrivo die Buch perché libro in un’altra lingua ha un altro genere.","why":"Il genere non si ricava trasferendo quello di un’altra lingua.","fix":"Impara das Buch come gruppo."},"home":["Per tre immagini del tuo corso prepara etichette con articolo e prova il richiamo dopo averle coperte.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Identifica l’immagine","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Disponi una sola immagine e tre parole per volta, con etichette ampie e articolo visibile; puoi ascoltare la parola modello.","preserve":"Associare vocaboli a immagini e richiamarli con articolo nella lingua studiata.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Scegli la lingua effettivamente studiata e un modello di pronuncia del corso. Riduci i suggerimenti sul contenuto, mantenendo dizionario e scaletta utili. Non richiedere le tre lingue insieme: sono alternative. Il testo scritto non è una verifica dell’ascolto né della pronuncia.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M12-03","goal":"Presentarsi con nome, età e provenienza nella lingua studiata.","materials":["carta e penna","testi nelle tre lingue riportati qui: lavora nella lingua che studi","persona che legga il copione per l’ascolto; dizionario quando utile"],"techniques":[{"name":"Sostituzione guidata","how":"Mantieni tre formule e cambia nome, numero e città, poi prova senza frasi complete.","why":"Allena una presentazione trasferibile a nuovi dati."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Tutti e tre i dati sono presenti; L’età usa la formula della lingua scelta; La prima persona resta coerente. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Personaggio inventato: Sofia, 12 anni, abita a Roma. Presentala in prima persona nella tua seconda lingua.","work":["FR: nome con “Je m’appelle Sofia”, età con “J’ai douze ans”, luogo con “J’habite à Rome”.","ES: “Me llamo Sofia. Tengo doce años. Vivo en Roma.”","DE: “Ich heiße Sofia. Ich bin zwölf Jahre alt. Ich wohne in Rom.” Scelgo solo la versione della lingua studiata."],"result":"FR: Je m’appelle Sofia. J’ai douze ans. J’habite à Rome. ES: Me llamo Sofia. Tengo doce años. Vivo en Roma. DE: Ich heiße Sofia. Ich bin zwölf Jahre alt. Ich wohne in Rom."},"steps":[{"title":"Prepara i dati fittizi","do":"Sul tuo compito scrivi nome, età e luogo del personaggio.","help":"Non devi raccontare dati personali per imparare la struttura."},{"title":"Scegli tre formule","do":"Usa il modello della tua lingua e sostituisci un dato alla volta.","help":"FR/ES hanno “avere” nell’età; DE “essere”."},{"title":"Presenta e controlla","do":"Pronuncia le tre frasi da una carta con parole chiave e verifica i dati.","help":"La carta può restare disponibile come strumento."}],"transfer":{"task":"Personaggio inventato: Marco, 13 anni, abita a Milano. Presentalo in prima persona; non usare dati personali reali.","check":"FR: Je m’appelle Marco. J’ai treize ans. J’habite à Milan. ES: Me llamo Marco. Tengo trece años. Vivo en Milán. DE: Ich heiße Marco. Ich bin dreizehn Jahre alt. Ich wohne in Mailand. Si accetta il nome locale della città usato dal corso se coerente."},"checks":["Tutti e tre i dati sono presenti","L’età usa la formula della lingua scelta","La prima persona resta coerente"],"error":{"wrong":"Je suis douze ans.","why":"La formula francese dell’età usa avoir.","fix":"Scrivi J’ai douze ans; non copiare la struttura tedesca."},"home":["Presenta un personaggio del tuo libro con tre parole guida e controlla la formula dell’età.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Prepara i dati fittizi","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa tre carte nome/età/luogo e un modello breve per ciascuna; puoi rispondere a domande prima di unire le frasi.","preserve":"Presentarsi con nome, età e provenienza nella lingua studiata.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Scegli la lingua effettivamente studiata e un modello di pronuncia del corso. Riduci i suggerimenti sul contenuto, mantenendo dizionario e scaletta utili. Non richiedere le tre lingue insieme: sono alternative. Il testo scritto non è una verifica dell’ascolto né della pronuncia.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M12-04","goal":"Gestire una richiesta quotidiana con formula cortese e risposta.","materials":["carta e penna","testi nelle tre lingue riportati qui: lavora nella lingua che studi","persona che legga il copione per l’ascolto; dizionario quando utile"],"techniques":[{"name":"Dialogo per funzioni","how":"Metti richiesta, domanda, prezzo e ringraziamento in quattro carte.","why":"Sostiene l’interazione anche cambiando l’oggetto."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Richiesta e prezzo corrispondono; La formula cortese è presente; Articoli e segni seguono la lingua scelta. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Scena: vuoi un succo, il prezzo è 2 euro. Scrivi e prova richiesta e domanda sul prezzo. FR: jus; ES: zumo; DE: Saft.","work":["FR: “Un jus, s’il vous plaît.” “Combien ça coûte ?” Risposta: “Deux euros.”","ES: “Un zumo, por favor.” “¿Cuánto cuesta?” Risposta: “Dos euros.”","DE: “Einen Saft, bitte.” “Wie viel kostet das?” Risposta: “Zwei Euro.” In tedesco einen segnala l’accusativo maschile della richiesta ellittica."],"result":"Tre mini-dialoghi alternativi con richiesta, prezzo e cortesia. Chiusure: Merci / Gracias / Danke."},"steps":[{"title":"Definisci la richiesta","do":"Sul tuo esercizio scrivi oggetto, prezzo e chi chiede o risponde.","help":"Non devi acquistare davvero: prova su carta."},{"title":"Usa la formula cortese","do":"Adatta l’oggetto al modello della tua lingua.","help":"ES ha ¿ all’inizio della domanda; DE può cambiare l’articolo."},{"title":"Scambia i ruoli","do":"Prova richiesta, prezzo e ringraziamento, poi inverti cliente e venditore.","help":"Controlla che il prezzo risponda alla domanda."}],"transfer":{"task":"Scena nuova: vuoi un panino a 3 euro. Parole e forma richiesta: FR un sandwich; ES un bocadillo; DE ein Sandwich (neutro). Scrivi richiesta, domanda sul prezzo e risposta nella tua lingua.","check":"FR “Un sandwich, s’il vous plaît. Combien ça coûte ?” “Trois euros.” ES “Un bocadillo, por favor. ¿Cuánto cuesta?” “Tres euros.” DE “Ein Sandwich, bitte. Wie viel kostet das?” “Drei Euro.” Aggiungi Merci/Gracias/Danke."},"checks":["Richiesta e prezzo corrispondono","La formula cortese è presente","Articoli e segni seguono la lingua scelta"],"error":{"wrong":"In tedesco chiedo Ein Saft, bitte usando lo stesso articolo del soggetto.","why":"Nel modello di richiesta l’oggetto maschile è all’accusativo.","fix":"Usa Einen Saft, bitte; confronta il neutro Ein Sandwich."},"home":["Nel tuo dialogo quotidiano cambia un oggetto e il prezzo, mantenendo le formule cortesi.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Definisci la richiesta","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Lascia disponibili formule e articolo del nome; usa carte di ruolo anziché un copione da ricordare interamente.","preserve":"Gestire una richiesta quotidiana con formula cortese e risposta.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Scegli la lingua effettivamente studiata e un modello di pronuncia del corso. Riduci i suggerimenti sul contenuto, mantenendo dizionario e scaletta utili. Non richiedere le tre lingue insieme: sono alternative. Il testo scritto non è una verifica dell’ascolto né della pronuncia.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M12-05","goal":"Scrivere cartolina, messaggio ed e-mail con dati, destinatario e registro adatti.","materials":["carta e penna","testi nelle tre lingue riportati qui: lavora nella lingua che studi","persona che legga il copione per l’ascolto; dizionario quando utile"],"techniques":[{"name":"Modelli per genere","how":"Confronta tre testi con gli stessi dati e conserva solo le parti pertinenti a ciascuno.","why":"Mostra come il formato cambia l’organizzazione del contenuto."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Cartolina, messaggio ed e-mail sono distinti; Gli inviti conservano luogo e giorno; Le convenzioni della lingua sono controllate. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Personaggio Alex è a Roma, gli piace la città, invita l’amico Luca al parco sabato. Scrivi cartolina, messaggio e breve e-mail nella lingua studiata.","work":["Cartolina descrittiva: FR “Salut Luca ! Je suis à Rome. J’aime la ville. À bientôt, Alex.” ES “¡Hola, Luca! Estoy en Roma. Me gusta la ciudad. Hasta pronto, Alex.” DE “Hallo Luca! Ich bin in Rom. Die Stadt gefällt mir. Bis bald, Alex.”","Messaggio d’invito: FR “Salut Luca ! On va au parc samedi ?” ES “¡Hola, Luca! ¿Vamos al parque el sábado?” DE “Hallo Luca! Gehen wir am Samstag in den Park?”","E-mail: uso la stessa domanda del messaggio, apertura e firma; oggetto FR “Samedi”, ES “El sábado”, DE “Samstag”."],"result":"E-mail esemplificative: FR “Salut Luca, On va au parc samedi ? À bientôt, Alex.” ES “Hola, Luca: ¿Vamos al parque el sábado? Hasta pronto, Alex.” DE “Hallo Luca, gehen wir am Samstag in den Park? Bis bald, Alex.” Cartolina e messaggio sono quelli dei passaggi; l’e-mail contiene anche un oggetto."},"steps":[{"title":"Scegli lo scopo","do":"Per il tuo testo segna cartolina descrittiva oppure invito in messaggio/e-mail.","help":"Una cartolina qui dice dove sei; l’invito dice luogo e giorno."},{"title":"Inserisci dati e formule","do":"Sostituisci persona, città, luogo e giorno nel modello della tua lingua.","help":"Non mescolare le tre lingue nella stessa frase."},{"title":"Rivedi la forma","do":"Controlla oggetto dell’e-mail, apertura, dati e chiusura.","help":"FR conserva accenti; ES usa segni iniziali; DE scrive i nomi con maiuscola."}],"transfer":{"task":"Personaggio Sara è a Milano, le piace la città, invita l’amica Eva in biblioteca domenica. Scrivi le tre forme. Lessico: FR bibliothèque; ES biblioteca; DE Bibliothek.","check":"Cartolina: FR “Salut Eva ! Je suis à Milan. J’aime la ville. À bientôt, Sara.” ES “¡Hola, Eva! Estoy en Milán. Me gusta la ciudad. Hasta pronto, Sara.” DE “Hallo Eva! Ich bin in Mailand. Die Stadt gefällt mir. Bis bald, Sara.” Invito: FR “On va à la bibliothèque dimanche ?” ES “¿Vamos a la biblioteca el domingo?” DE “Gehen wir am Sonntag in die Bibliothek?” Messaggio con saluto; e-mail con oggetto, saluto, invito e firma. Le tre forme devono essere riconoscibili."},"checks":["Cartolina, messaggio ed e-mail sono distinti","Gli inviti conservano luogo e giorno","Le convenzioni della lingua sono controllate"],"error":{"wrong":"In spagnolo scrivo Me gusto la ciudad per “mi piace la città”.","why":"Nel modello il soggetto grammaticale è la città: gusta.","fix":"Usa Me gusta la ciudad e confronta la frase modello."},"home":["Per il tuo scritto prepara prima destinatario, scopo e dati; usa il modello del genere richiesto.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Scegli lo scopo","difficulty":"Perdo l’ordine dei passaggi","categories":["disortografia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Tieni un modello per la sola lingua studiata e una lista di due controlli ortografici pertinenti; correggi dopo la bozza.","preserve":"Scrivere cartolina, messaggio ed e-mail con dati, destinatario e registro adatti.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Scegli la lingua effettivamente studiata e un modello di pronuncia del corso. Riduci i suggerimenti sul contenuto, mantenendo dizionario e scaletta utili. Non richiedere le tre lingue insieme: sono alternative. Il testo scritto non è una verifica dell’ascolto né della pronuncia.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M12-06","goal":"Coniugare una frase semplice e negarla con la struttura della lingua studiata.","materials":["carta e penna","testi nelle tre lingue riportati qui: lavora nella lingua che studi","persona che legga il copione per l’ascolto; dizionario quando utile"],"techniques":[{"name":"Trasformazione affermativa-negativa","how":"Affianca due righe e marca posizione del verbo e parole di negazione.","why":"Fa vedere la struttura invece di memorizzare frasi isolate."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: La prima persona è corretta; La negazione segue la lingua scelta; Gli altri dati restano invariati. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Trasforma alla prima persona e poi in negativa: FR “Elle aime la musique”; ES “Ella habla español”; DE “Sie spielt Tennis”. Lavora nella lingua del tuo corso.","work":["FR: “J’aime la musique.” Negativa scritta standard: “Je n’aime pas la musique.” n’ precede aime e pas segue il verbo.","ES: “Hablo español.” Negativa: “No hablo español.” Il soggetto yo può essere espresso, ma qui è omesso.","DE: “Ich spiele Tennis.” Negativa: “Ich spiele nicht Tennis.” Per negare l’attività indicata uso nicht; nella frase dichiarativa il verbo coniugato è in seconda posizione."],"result":"FR J’aime / Je n’aime pas la musique. ES Hablo / No hablo español. DE Ich spiele / Ich spiele nicht Tennis."},"steps":[{"title":"Identifica persona e verbo","do":"Nel tuo esercizio segna il verbo e il soggetto richiesto.","help":"FR/ES/DE hanno desinenze diverse: usa la tabella della tua lingua."},{"title":"Coniuga e nega","do":"Costruisci prima l’affermativa, poi aggiungi la negazione nel posto previsto.","help":"Non mettere no in tedesco o nicht in francese."},{"title":"Rileggi il significato","do":"Controlla persona, oggetto e informazione negata.","help":"La frase negativa non deve perdere il resto dei dati."}],"transfer":{"task":"Prima persona e negativa: FR “Elle habite à Paris”; ES “Ella estudia francés”; DE “Sie wohnt in Berlin”.","check":"FR “J’habite à Paris. Je n’habite pas à Paris.” ES “Estudio francés. No estudio francés.” DE “Ich wohne in Berlin. Ich wohne nicht in Berlin.” La negazione deve riguardare l’informazione data; non cambia la città o la lingua."},"checks":["La prima persona è corretta","La negazione segue la lingua scelta","Gli altri dati restano invariati"],"error":{"wrong":"Je aime no la musique.","why":"Manca l’elisione e la negazione è trasferita da un’altra lingua.","fix":"Usa J’aime e, nella negativa standard scritta, Je n’aime pas la musique."},"home":["Trasforma tre frasi del tuo corso e confronta solo persona e negazione nel primo controllo.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Identifica persona e verbo","difficulty":"Perdo l’ordine dei passaggi","categories":["disortografia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa un modello con spazi per soggetto, verbo e negazione; lascia visibile la tabella del verbo studiato.","preserve":"Coniugare una frase semplice e negarla con la struttura della lingua studiata.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Scegli la lingua effettivamente studiata e un modello di pronuncia del corso. Riduci i suggerimenti sul contenuto, mantenendo dizionario e scaletta utili. Non richiedere le tre lingue insieme: sono alternative. Il testo scritto non è una verifica dell’ascolto né della pronuncia.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M12-07","goal":"Confrontare pronuncia e ortografia senza usare equivalenze fra lingue come regole.","materials":["carta e penna","testi nelle tre lingue riportati qui: lavora nella lingua che studi","persona che legga il copione per l’ascolto; dizionario quando utile"],"techniques":[{"name":"Confronto suono-segno","how":"Affianca parola modello e produzione scritta dopo un ascolto reale.","why":"Distingue riconoscimento del suono e conservazione della grafia."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Accenti, ñ o umlaut sono conservati; Le maiuscole tedesche sono controllate; La pronuncia è valutata solo con ascolto reale. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Scegli la tua lingua e ascolta un modello competente. FR: “chat”, “chats”, “école”; ES: “hola”, “niño”, “mañana”; DE: “Schule”, “schön”, “Buch”. Osserva le grafie e ripeti i gruppi senza trascriverli con lettere italiane.","work":["FR: in questi nomi isolati il plurale scritto chats non aggiunge una s pronunciata; é di école è un segno da conservare.","ES: h di hola non si pronuncia nel modello standard; ñ di niño/mañana è una lettera distinta da n.","DE: sch di Schule corrisponde al suono iniziale modellato; ö di schön non equivale a o; i nomi Buch e Schule si scrivono con iniziale maiuscola. Confronto sempre col suono reale."],"result":"Controllo scritto: chats, école; hola, niño, mañana; Schule, schön, Buch. Controllo orale: l’ascoltatore riconosce le parole nella lingua scelta; senza modello e ascoltatore si verifica solo la grafia."},"steps":[{"title":"Scegli il modello","do":"Usa il parlante o audio del tuo corso e seleziona due parole.","help":"Non mescolare accenti o lingue per la stessa prova."},{"title":"Confronta suono e grafia","do":"Ascolta, poi segna il dettaglio scritto che non puoi dedurre dall’italiano.","help":"Un accento o un umlaut non è una decorazione."},{"title":"Ripeti e ricopia","do":"Verifica oralmente con ascoltatore e graficamente con la parola modello, in due controlli separati.","help":"Un controllo corretto non garantisce automaticamente l’altro."}],"transfer":{"task":"Nuove parole da un modello competente: FR “amis”, “été”; ES “hombre”, “año”; DE “Fisch”, “Tür”. Copia correttamente, ascolta e ripeti; spiega un tratto della tua lingua.","check":"FR conserva é in été; la s finale di amis non si pronuncia nella parola isolata del modello standard (non estendere a ogni contesto di liaison). ES h di hombre muta, ñ di año distinta da n. DE sch in Fisch, ü in Tür distinta da u, nomi con maiuscola. Pronuncia da verificare realmente nel modello, non dal solo testo."},"checks":["Accenti, ñ o umlaut sono conservati","Le maiuscole tedesche sono controllate","La pronuncia è valutata solo con ascolto reale"],"error":{"wrong":"Scrivo ano al posto di año pensando che n e ñ siano equivalenti.","why":"In spagnolo sono lettere diverse e possono cambiare la parola.","fix":"Confronta año col modello e conserva ñ."},"home":["Su due parole del tuo corso separa un controllo di ascolto da un controllo ortografico.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Scegli il modello","difficulty":"Perdo l’ordine dei passaggi","categories":["disortografia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Disponi due parole per volta con dettaglio grafico evidenziato; usa tastiera o caratteri già disponibili se tracciare il segno ostacola il controllo.","preserve":"Confrontare pronuncia e ortografia senza usare equivalenze fra lingue come regole.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Scegli la lingua effettivamente studiata e un modello di pronuncia del corso. Riduci i suggerimenti sul contenuto, mantenendo dizionario e scaletta utili. Non richiedere le tre lingue insieme: sono alternative. Il testo scritto non è una verifica dell’ascolto né della pronuncia.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M12-08","goal":"Ricavare aspetti culturali da un testo delimitato e confrontarli senza stereotipi.","materials":["carta e penna","testi nelle tre lingue riportati qui: lavora nella lingua che studi","persona che legga il copione per l’ascolto; dizionario quando utile"],"techn
