.","aid":"Usa due colonne per i metodi e confronta una riga alla volta; puoi spiegare a voce invece di scrivere tutta la motivazione.","preserve":"Spiegare e confrontare due procedimenti corretti per lo stesso calcolo.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Mostra una riga, poi fai scegliere al ragazzo il prossimo passaggio e chiedi di spiegarlo. Riduci i suggerimenti sulla procedura; mantieni calcolatrice, formulario e altri strumenti compensativi utili. Correttezza di un esempio non dimostra padronanza di ogni problema.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M08-11","goal":"Individuare la prima riga errata e correggerne la regola.","materials":["carta a quadretti","matita","calcolatrice o formulario se utili al tuo compito"],"techniques":[{"name":"Analisi dell’errore","how":"Segna la prima trasformazione non equivalente e riscrivi solo da lì.","why":"Evita di attribuire l’errore all’intero compito."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: È indicata la prima riga errata; La spiegazione nomina la regola; La correzione è controllata con un altro metodo. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Un alunno scrive 4 × (3 + 2) = 4 × 3 + 2 = 12 + 2 = 14. Trova la prima uguaglianza sbagliata e correggi.","work":["La prima trasformazione è errata: manca 4 davanti al secondo addendo.","Applicando la distributiva: 4 × 3 + 4 × 2 = 12 + 8 = 20.","Controllo direttamente la parentesi: 4 × 5 = 20."],"result":"La prima uguaglianza è sbagliata; il risultato corretto è 20."},"steps":[{"title":"Confronta due righe","do":"Nel tuo svolgimento verifica la prima uguaglianza, poi passa alla seguente.","help":"Un risultato sbagliato può dipendere da una riga molto precedente."},{"title":"Nomina l’errore","do":"Indica il termine o il segno cambiato e la regola violata.","help":"Qui il fattore 4 deve moltiplicare anche 2."},{"title":"Rifai da quel punto","do":"Conserva ciò che è corretto e controlla con una via diversa.","help":"Risolvere prima la parentesi fornisce un controllo indipendente."}],"transfer":{"task":"Esamina 5 × (2 + 4) = 10 + 4 = 14. Indica la prima riga errata, correggi e controlla con la parentesi.","check":"Prima trasformazione errata: 5 × 4 è diventato solo 4. Correzione: 10 + 20 = 30; controllo 5 × 6 = 30."},"checks":["È indicata la prima riga errata","La spiegazione nomina la regola","La correzione è controllata con un altro metodo"],"error":{"wrong":"Correggo 12 + 2 in 20 senza cambiare la riga precedente.","why":"La somma 12 + 2 vale davvero 14: l’errore è prima.","fix":"Ripristina 4 × 2 nella distribuzione."},"home":["Quando correggi un tuo esercizio segnala la prima riga diversa, non solo la risposta finale.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Confronta due righe","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Copri le righe successive e metti a confronto solo due righe; indica con una freccia il termine trasformato.","preserve":"Individuare la prima riga errata e correggerne la regola.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Mostra una riga, poi fai scegliere al ragazzo il prossimo passaggio e chiedi di spiegarlo. Riduci i suggerimenti sulla procedura; mantieni calcolatrice, formulario e altri strumenti compensativi utili. Correttezza di un esempio non dimostra padronanza di ogni problema.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M08-12","goal":"Usare calcoli, unità e controllo di convenienza in un acquisto quotidiano.","materials":["carta a quadretti","matita","calcolatrice o formulario se utili al tuo compito"],"techniques":[{"name":"Tabella quantità-prezzo","how":"Scrivi una riga per prodotto e una colonna per il costo totale.","why":"Collega l’operazione al significato economico."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Quantità e prezzo unitario sono distinti; Gli importi hanno due decimali coerenti; Spesa e resto ricostruiscono il budget. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Hai 10 euro. Compri 3 pacchi a 2,40 euro l’uno e una gomma a 1,30 euro. Quanto spendi e quanto resto ricevi?","work":["Tre pacchi costano 3 × 2,40 = 7,20 euro.","Aggiungo la gomma: 7,20 + 1,30 = 8,50 euro.","Resto: 10,00 − 8,50 = 1,50 euro. Controllo 8,50 + 1,50 = 10,00."],"result":"Spesa 8,50 euro; resto 1,50 euro. Il denaro basta."},"steps":[{"title":"Organizza lo scontrino","do":"Sul tuo problema separa quantità, prezzo unitario e costo della riga.","help":"3 pacchi non significa 3 euro."},{"title":"Somma le righe","do":"Calcola i costi e allinea le virgole nella somma.","help":"Scrivi 10,00 per il denaro disponibile."},{"title":"Verifica il budget","do":"Sottrai la spesa e ricomponi spesa più resto.","help":"Un resto negativo indica che il denaro non basta."}],"transfer":{"task":"Hai 15 euro. Compri 4 biglietti a 2,75 euro e una cartellina a 1,60 euro. Calcola spesa e resto.","check":"4 × 2,75 = 11,00; spesa 12,60 euro; resto 2,40 euro. 12,60 + 2,40 = 15,00."},"checks":["Quantità e prezzo unitario sono distinti","Gli importi hanno due decimali coerenti","Spesa e resto ricostruiscono il budget"],"error":{"wrong":"2,40 + 1,30 = costo di tutti gli acquisti.","why":"Hai contato un solo pacco.","fix":"Calcola prima 3 × 2,40."},"home":["Simula su carta un acquisto del tuo esercizio senza usare denaro reale.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Organizza lo scontrino","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa uno scontrino con tre colonne già etichettate e calcolatrice; indica il budget in un riquadro separato.","preserve":"Usare calcoli, unità e controllo di convenienza in un acquisto quotidiano.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Mostra una riga, poi fai scegliere al ragazzo il prossimo passaggio e chiedi di spiegarlo. Riduci i suggerimenti sulla procedura; mantieni calcolatrice, formulario e altri strumenti compensativi utili. Correttezza di un esempio non dimostra padronanza di ogni problema.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M09-01","goal":"Costruire una figura rispettando misure e uso degli strumenti.","materials":["carta a quadretti","matita","righello; compasso e squadra quando richiesti"],"techniques":[{"name":"Sequenza grafica","how":"Segna sul foglio 1 lato, 2 perpendicolari, 3 chiusura prima di tracciare.","why":"Riduce le decisioni simultanee durante il disegno."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: La misura parte dallo zero; I vertici sono in ordine sul bordo; Lati opposti e angoli rispettano la consegna. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Disegna un rettangolo ABCD con AB = 6 cm e BC = 3 cm. Usa righello e squadra; indica i vertici in ordine.","work":["Traccio AB lungo 6 cm a partire dallo zero del righello.","Con la squadra costruisco perpendicolari ad AB in A e B; segno AD e BC di 3 cm sullo stesso lato.","Unisco D e C. Controllo CD = 6 cm, lati opposti paralleli e quattro angoli retti."],"result":"Rettangolo con lati consecutivi 6 cm e 3 cm, vertici A-B-C-D lungo il bordo."},"steps":[{"title":"Traccia il primo lato","do":"Misura il lato indicato nella consegna partendo dallo zero.","help":"Non partire dal bordo di plastica del righello."},{"title":"Costruisci le perpendicolari","do":"Appoggia la squadra al primo lato e traccia due lati della stessa misura.","help":"Mantieni la squadra ferma e segna prima i punti."},{"title":"Chiudi e controlla","do":"Unisci i punti finali e misura i lati opposti.","help":"Se non coincidono, controlla prima gli angoli."}],"transfer":{"task":"Disegna un rettangolo EFGH con EF = 4 cm e FG = 2 cm. Controlla lati e angoli.","check":"EF = GH = 4 cm; FG = HE = 2 cm; quattro angoli retti. I vertici seguono il bordo e non sono incrociati."},"checks":["La misura parte dallo zero","I vertici sono in ordine sul bordo","Lati opposti e angoli rispettano la consegna"],"error":{"wrong":"Misuro 6 cm dalla tacca 1 alla tacca 6.","why":"La distanza così è 5 cm.","fix":"Parti da 0 e arriva a 6, oppure da 1 a 7."},"home":["Sul tuo disegno segna prima i punti e poi traccia una linea alla volta.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Traccia il primo lato","difficulty":"La squadra si muove mentre traccio la linea","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa strumenti con presa stabile e foglio fissato; il professionista può tenere la squadra mentre tu scegli punti e misure.","preserve":"Costruire una figura rispettando misure e uso degli strumenti.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Distingui il ragionamento geometrico dalla precisione del tratto. Riduci indicazioni su ordine e scelta delle formule; lascia disponibili righe guida, strumenti e formulario. Un disegno riuscito non verifica da solo il calcolo o la dimostrazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M09-02","goal":"Descrivere proprietà di figure piane e solidi senza confondere elementi.","materials":["carta a quadretti","matita","righello; compasso e squadra quando richiesti"],"techniques":[{"name":"Tabella di confronto","how":"Affianca figura piana e solido con intestazioni diverse per lati e spigoli.","why":"Impedisce di sommare elementi di tipi diversi."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: La dimensione è indicata; Facce, spigoli e vertici non sono confusi; Le proprietà non dipendono dalla prospettiva del disegno. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Confronta un quadrato e un cubo: indica dimensione, lati o spigoli, vertici e, per il cubo, facce.","work":["Il quadrato è una figura piana: 4 lati uguali, 4 vertici, 4 angoli retti.","Il cubo è un solido: 6 facce quadrate uguali, 12 spigoli e 8 vertici.","Distinguo lati del quadrato e spigoli del cubo; una faccia del cubo ha forma quadrata."],"result":"Quadrato: piano, 4 lati e 4 vertici. Cubo: solido, 6 facce, 12 spigoli, 8 vertici."},"steps":[{"title":"Separa piano e spazio","do":"Sul tuo compito indica se osservi una figura piana o un solido.","help":"Una scatola ha profondità; il disegno di una faccia è piano."},{"title":"Conta per gruppi","do":"Conta facce, spigoli e vertici in colonne diverse.","help":"Sul cubo conta 4 spigoli sopra, 4 sotto e 4 verticali."},{"title":"Formula una proprietà","do":"Scrivi una frase che resti vera per tutta la figura.","help":"Non dedurre misure dal solo disegno."}],"transfer":{"task":"Descrivi un rettangolo e un parallelepipedo rettangolo: lati o spigoli, vertici e facce. Non supporre tutte le misure uguali.","check":"Rettangolo: 4 lati, lati opposti uguali, 4 vertici e angoli retti. Parallelepipedo rettangolo: 6 facce rettangolari, 12 spigoli, 8 vertici; le tre dimensioni possono differire."},"checks":["La dimensione è indicata","Facce, spigoli e vertici non sono confusi","Le proprietà non dipendono dalla prospettiva del disegno"],"error":{"wrong":"Un cubo ha 6 spigoli perché vedo 6 facce.","why":"Faccia e spigolo sono elementi diversi.","fix":"Conta i segmenti di confine: 4 + 4 + 4 = 12."},"home":["Descrivi una figura del tuo libro con tre proprietà, senza affidarti alla sola apparenza.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Separa piano e spazio","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa una scatola vuota come modello; indica un tipo di elemento per volta e segna con etichette removibili quelli già contati.","preserve":"Descrivere proprietà di figure piane e solidi senza confondere elementi.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Distingui il ragionamento geometrico dalla precisione del tratto. Riduci indicazioni su ordine e scelta delle formule; lascia disponibili righe guida, strumenti e formulario. Un disegno riuscito non verifica da solo il calcolo o la dimostrazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M09-03","goal":"Convertire misure lineari, di area, volume, capacità e massa con unità coerenti.","materials":["carta a quadretti","matita","righello; compasso e squadra quando richiesti"],"techniques":[{"name":"Conversione esplicita","how":"Scrivi il fattore prima di moltiplicare, senza affidarti solo agli spostamenti della virgola.","why":"Permette di distinguere lunghezze, aree e volumi."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: La grandezza è identificata; Il fattore considera l’esponente; L’unità finale è quella richiesta. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Converti 2,5 m in cm; 3 m² in cm²; 2 dm³ in cm³ e in litri; 0,75 kg in g.","work":["1 m = 100 cm, quindi 2,5 m = 250 cm. Per le aree il fattore è 100²: 3 m² = 30000 cm².","1 dm = 10 cm, quindi 1 dm³ = 1000 cm³: 2 dm³ = 2000 cm³. Poiché 1 dm³ = 1 L, sono 2 L.","1 kg = 1000 g: 0,75 kg = 750 g."],"result":"250 cm; 30000 cm²; 2000 cm³ = 2 L; 750 g."},"steps":[{"title":"Identifica la grandezza","do":"Nel tuo esercizio segna lunghezza, area, volume, capacità o massa.","help":"L’esponente ² o ³ cambia il fattore di conversione."},{"title":"Scrivi l’equivalenza","do":"Prima del calcolo scrivi quanto vale un’unità in quella richiesta.","help":"Per m² → cm² il fattore è 10000, non 100."},{"title":"Controlla la direzione","do":"Verifica se il numero deve crescere passando a un’unità più piccola.","help":"L’oggetto resta uguale: cambiano unità e numero."}],"transfer":{"task":"Converti 1,2 m in cm; 0,5 m² in cm²; 3 dm³ in cm³ e litri; 1,5 kg in g.","check":"120 cm; 5000 cm²; 3000 cm³ = 3 L; 1500 g."},"checks":["La grandezza è identificata","Il fattore considera l’esponente","L’unità finale è quella richiesta"],"error":{"wrong":"3 m² = 300 cm².","why":"Hai usato il fattore delle lunghezze.","fix":"1 m² è un quadrato di 100 cm per 100 cm: 10000 cm²."},"home":["Su una conversione assegnata scrivi prima l’equivalenza di un’unità.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Identifica la grandezza","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa una tabella separata per ogni grandezza con equivalenze di base visibili; non mescolare scale lineari e quadratiche.","preserve":"Convertire misure lineari, di area, volume, capacità e massa con unità coerenti.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Distingui il ragionamento geometrico dalla precisione del tratto. Riduci indicazioni su ordine e scelta delle formule; lascia disponibili righe guida, strumenti e formulario. Un disegno riuscito non verifica da solo il calcolo o la dimostrazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M09-04","goal":"Distinguere e calcolare perimetro, area, superficie totale e volume.","materials":["carta a quadretti","matita","righello; compasso e squadra quando richiesti"],"techniques":[{"name":"Confronto delle grandezze","how":"Affianca quattro riquadri: P, A, S, V con disegno e unità.","why":"Aiuta a scegliere la formula a partire dalla richiesta."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: La formula risponde alla grandezza richiesta; Sono considerate tutte le facce; Le unità distinguono lunghezza, area e volume. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Un rettangolo ha lati 5 cm e 3 cm. Un parallelepipedo rettangolo ha dimensioni 5 cm, 3 cm e 2 cm. Calcola perimetro e area del rettangolo, superficie totale e volume del solido.","work":["Rettangolo: P = 2(5 + 3) = 16 cm; A = 5 × 3 = 15 cm².","Solido: le coppie di facce hanno aree 15, 10 e 6 cm². S = 2(15 + 10 + 6) = 62 cm².","Volume: V = 5 × 3 × 2 = 30 cm³. Distinguo bordo, copertura e spazio occupato."],"result":"P = 16 cm; A = 15 cm²; superficie totale = 62 cm²; volume = 30 cm³."},"steps":[{"title":"Nomina ciò che misuri","do":"Accanto alla domanda scrivi bordo, regione piana, facce o spazio del solido.","help":"Superficie totale comprende tutte le facce, anche quelle non visibili."},{"title":"Scegli la formula","do":"Scrivi la formula con lettere e poi sostituisci le misure.","help":"La profondità 2 compare nel volume e nelle facce laterali."},{"title":"Verifica le unità","do":"Controlla cm per bordo, cm² per area e superficie, cm³ per volume.","help":"Stesso numero con unità diversa non significa stessa grandezza."}],"transfer":{"task":"Un quadrato ha lato 4 cm e un cubo ha spigolo 4 cm. Calcola perimetro e area del quadrato, superficie totale e volume del cubo.","check":"Quadrato: P = 16 cm, A = 16 cm². Cubo: S = 6 × 16 = 96 cm²; V = 4³ = 64 cm³."},"checks":["La formula risponde alla grandezza richiesta","Sono considerate tutte le facce","Le unità distinguono lunghezza, area e volume"],"error":{"wrong":"Superficie del parallelepipedo = 5 × 3 × 2 = 30 cm².","why":"Il prodotto delle tre dimensioni è volume.","fix":"Somma le aree delle sei facce: 62 cm²."},"home":["Per il tuo esercizio evidenzia la parola della domanda prima di cercare la formula.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Nomina ciò che misuri","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa quattro riquadri con etichette e unità già presenti; scegli tu i dati da inserire nel formulario.","preserve":"Distinguere e calcolare perimetro, area, superficie totale e volume.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Distingui il ragionamento geometrico dalla precisione del tratto. Riduci indicazioni su ordine e scelta delle formule; lascia disponibili righe guida, strumenti e formulario. Un disegno riuscito non verifica da solo il calcolo o la dimostrazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M09-05","goal":"Applicare Pitagora e un rapporto di similitudine in situazioni distinte.","materials":["carta a quadretti","matita","righello; compasso e squadra quando richiesti"],"techniques":[{"name":"Disegno etichettato","how":"Segna cateti e ipotenusa, poi collega ciascun lato al suo corrispondente nella figura simile.","why":"Previene lo scambio di dati e del fattore."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: L’ipotenusa è opposta all’angolo retto; La radice è estratta dal quadrato; Tutti i lati usano lo stesso fattore. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Un triangolo rettangolo ha cateti 6 cm e 8 cm. Calcola l’ipotenusa. Un triangolo simile con fattore di ingrandimento 2 quali lati ha?","work":["Pitagora: c² = 6² + 8² = 36 + 64 = 100.","L’ipotenusa è c = √100 = 10 cm, maggiore di ogni cateto.","Nella figura simile moltiplico tutti i lati per 2: 12, 16, 20 cm. Gli angoli corrispondenti restano uguali."],"result":"Ipotenusa 10 cm. Triangolo ingrandito: cateti 12 e 16 cm, ipotenusa 20 cm."},"steps":[{"title":"Riconosci l’angolo retto","do":"Nel tuo disegno segna il lato opposto all’angolo retto come ipotenusa.","help":"Pitagora qui richiede un triangolo rettangolo."},{"title":"Calcola quadrati e radice","do":"Scrivi il quadrato dell’ipotenusa prima di estrarre la radice.","help":"100 è c²; 10 è c."},{"title":"Applica il fattore comune","do":"Nella similitudine moltiplica ogni lato per lo stesso numero.","help":"Raddoppiare solo un lato non produce una figura simile."}],"transfer":{"task":"Un triangolo rettangolo ha cateti 5 e 12 cm. Trova l’ipotenusa e i lati di una riduzione con fattore 1/2.","check":"c² = 25 + 144 = 169; c = 13 cm. Riduzione: 2,5 cm, 6 cm e 6,5 cm; rapporti dei lati tutti 1/2."},"checks":["L’ipotenusa è opposta all’angolo retto","La radice è estratta dal quadrato","Tutti i lati usano lo stesso fattore"],"error":{"wrong":"c = 6² + 8² = 100 cm.","why":"Hai trovato il quadrato della lunghezza.","fix":"Calcola √100 = 10 cm."},"home":["Nel tuo problema segna prima l’ipotenusa; nella similitudine disegna le frecce del fattore.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Riconosci l’angolo retto","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa un disegno con simbolo dell’angolo retto e tre etichette; conserva una riga distinta per c² e una per c.","preserve":"Applicare Pitagora e un rapporto di similitudine in situazioni distinte.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Distingui il ragionamento geometrico dalla precisione del tratto. Riduci indicazioni su ordine e scelta delle formule; lascia disponibili righe guida, strumenti e formulario. Un disegno riuscito non verifica da solo il calcolo o la dimostrazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M09-06","goal":"Leggere coordinate e applicare traslazioni e simmetrie sul piano.","materials":["carta a quadretti","matita","righello; compasso e squadra quando richiesti"],"techniques":[{"name":"Regola accanto al grafico","how":"Scrivi (x + 2,y − 1) e completa una tabella prima di disegnare.","why":"Distingue il calcolo delle coordinate dal posizionamento."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Gli assi e la scala sono etichettati; La traslazione è uguale per tutti; La simmetria conserva la distanza dall’asse. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Segna A(1,2), B(3,2), C(1,4). Trasla ogni punto di 2 unità a destra e 1 in basso; poi trova il simmetrico di A rispetto all’asse y.","work":["Leggo prima x, poi y: A è 1 a destra e 2 in alto dall’origine.","La traslazione è (x,y) → (x + 2,y − 1): A′(3,1), B′(5,1), C′(3,3).","Per la simmetria sull’asse y cambio il segno di x: A simmetrico è (−1,2)."],"result":"Punti traslati (3,1), (5,1), (3,3); simmetrico di A rispetto a y: (−1,2)."},"steps":[{"title":"Leggi gli assi","do":"Sul tuo piano indica origine e direzioni positive prima di segnare i punti.","help":"La coppia è (x,y), non (y,x)."},{"title":"Scrivi la trasformazione","do":"Indica che cosa cambia per x e per y.","help":"Destra aumenta x; basso diminuisce y."},{"title":"Controlla i punti","do":"Confronta lo spostamento di tutti i punti e la distanza dall’asse nella simmetria.","help":"Una traslazione usa lo stesso spostamento per tutti."}],"transfer":{"task":"Segna P(−2,3) e Q(1,1). Trasla di 1 a destra e 2 in alto. Trova anche il simmetrico di P rispetto all’asse x.","check":"P′(−1,5), Q′(2,3); simmetrico di P rispetto a x: (−2,−3)."},"checks":["Gli assi e la scala sono etichettati","La traslazione è uguale per tutti","La simmetria conserva la distanza dall’asse"],"error":{"wrong":"Il simmetrico di (1,2) sull’asse y è (1,−2).","why":"Hai cambiato y: questa è la simmetria sull’asse x.","fix":"Cambia x: (−1,2)."},"home":["Sul tuo esercizio separa tabella delle nuove coordinate e disegno.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Leggi gli assi","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa un piano con assi evidenti e tabella x/y; traccia il percorso orizzontale prima di quello verticale.","preserve":"Leggere coordinate e applicare traslazioni e simmetrie sul piano.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Distingui il ragionamento geometrico dalla precisione del tratto. Riduci indicazioni su ordine e scelta delle formule; lascia disponibili righe guida, strumenti e formulario. Un disegno riuscito non verifica da solo il calcolo o la dimostrazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M09-07","goal":"Usare dati dichiarati e proprietà senza dedurre misure dall’apparenza.","materials":["carta a quadretti","matita","righello; compasso e squadra quando richiesti"],"techniques":[{"name":"Dati-deduzioni","how":"Dividi il foglio in “dato” e “dedotto”, collegandoli con una freccia.","why":"Rende controllabile l’origine delle informazioni."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Ogni deduzione ha un dato o proprietà; La somma degli angoli è verificata; Non compaiono misure inventate dal disegno. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"La figura è descritta così: triangolo ABC isoscele con AB = AC, angolo A = 40°. Trova B e C; non è fornita una scala del disegno.","work":["AB = AC indica che gli angoli alla base B e C sono uguali.","La somma degli angoli è 180°: B + C = 180° − 40° = 140°.","Divido in due parti uguali: B = C = 70°. Non deduco le lunghezze dalla figura."],"result":"B = 70° e C = 70°; le lunghezze dei lati non sono determinabili dai dati."},"steps":[{"title":"Raccogli i dati segnati","do":"Copia solo misure, simboli di uguaglianza e proprietà esplicitamente date.","help":"Una figura che sembra equilatera può non esserlo."},{"title":"Collega una proprietà","do":"Scrivi quale dato permette ogni deduzione.","help":"AB = AC implica B = C."},{"title":"Distingui il ricavabile","do":"Rispondi alle domande possibili e indica ciò che manca.","help":"Per una lunghezza serve un dato che fissi la scala."}],"transfer":{"task":"Un triangolo DEF è isoscele con DE = DF e angolo D = 50°. Trova E e F. Puoi concludere che DE = 5 cm?","check":"E = F = (180° − 50°)/2 = 65°. Non si può concludere DE = 5 cm senza un dato di lunghezza o scala."},"checks":["Ogni deduzione ha un dato o proprietà","La somma degli angoli è verificata","Non compaiono misure inventate dal disegno"],"error":{"wrong":"AB sembra 4 cm, quindi AB = 4 cm.","why":"Il disegno potrebbe non essere in scala.","fix":"Usa soltanto la lunghezza dichiarata; qui non è data."},"home":["Per una figura assegnata separa almeno due dati da due deduzioni.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Raccogli i dati segnati","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Affianca al disegno un elenco numerato dei dati; indica con il dito il simbolo a cui si riferisce ogni riga.","preserve":"Usare dati dichiarati e proprietà senza dedurre misure dall’apparenza.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Distingui il ragionamento geometrico dalla precisione del tratto. Riduci indicazioni su ordine e scelta delle formule; lascia disponibili righe guida, strumenti e formulario. Un disegno riuscito non verifica da solo il calcolo o la dimostrazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M09-08","goal":"Raccogliere dati categoriali e rappresentare frequenze in tabella e grafico.","materials":["carta a quadretti","matita","righello; compasso e squadra quando richiesti"],"techniques":[{"name":"Tabella prima del grafico","how":"Passa dall’elenco alle tacche, poi ai numeri, infine alle barre.","why":"Fornisce una base controllabile al disegno."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Ogni risposta è contata una volta; Le frequenze sommano al totale; Il grafico ha titolo, etichette e scala. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"In una classe immaginaria 8 risposte alla domanda “mezzo usato per arrivare a scuola” sono: piedi, bus, bici, piedi, bus, piedi, bici, piedi. Costruisci una tabella e un grafico a barre.","work":["Definisco tre categorie e conto una risposta alla volta: piedi 4, bus 2, bici 2.","Controllo la somma: 4 + 2 + 2 = 8.","Disegno barre distinte con asse orizzontale “mezzo” e verticale “numero di risposte”, scala di una risposta per quadretto."],"result":"Tabella: piedi 4; bus 2; bici 2. Barre di altezza 4, 2, 2; totale 8."},"steps":[{"title":"Definisci la domanda","do":"Nel tuo compito scrivi che cosa conta ogni risposta e quali categorie usi.","help":"Non raccogliere dati personali per esercitarti: usa quelli forniti."},{"title":"Conta con tacche","do":"Aggiungi una tacca per ogni risposta prima di scrivere le frequenze.","help":"Spunta ogni voce già contata."},{"title":"Rappresenta e controlla","do":"Disegna barre con stessa scala e confronta il totale con l’elenco.","help":"Il titolo dice a che cosa si riferiscono i dati."}],"transfer":{"task":"Sei preferenze immaginarie di frutta sono: mela, pera, mela, banana, pera, mela. Costruisci tabella e barre.","check":"Mela 3, pera 2, banana 1; totale 6. Tre barre distinte alte 3, 2, 1, con categorie e scala esplicite."},"checks":["Ogni risposta è contata una volta","Le frequenze sommano al totale","Il grafico ha titolo, etichette e scala"],"error":{"wrong":"Disegno quattro barre per “piedi” e due per “bus”.","why":"Una barra rappresenta la categoria, la sua altezza la frequenza.","fix":"Disegna una barra per piedi alta 4 e una per bus alta 2."},"home":["Trasforma un elenco di dati del tuo libro in tabella prima di disegnare il grafico.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Definisci la domanda","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa righe già etichettate e una spunta sull’elenco; per il grafico fornisci assi e scala ma lascia scegliere le altezze.","preserve":"Raccogliere dati categoriali e rappresentare frequenze in tabella e grafico.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Distingui il ragionamento geometrico dalla precisione del tratto. Riduci indicazioni su ordine e scelta delle formule; lascia disponibili righe guida, strumenti e formulario. Un disegno riuscito non verifica da solo il calcolo o la dimostrazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M09-09","goal":"Calcolare frequenze, media, mediana e moda distinguendone il significato.","materials":["carta a quadretti","matita","righello; compasso e squadra quando richiesti"],"techniques":[{"name":"Tre domande distinte","how":"Affianca “quanto in media?”, “quale centro?”, “quale più frequente?” ai calcoli.","why":"Evita di usare un’unica procedura per indici diversi."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Le ripetizioni restano nell’elenco; La media divide per il numero di dati; Mediana e moda usano criteri diversi. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"I dati sono 2, 3, 3, 4, 8. Calcola frequenze, media, mediana e moda.","work":["I valori ordinati sono già 2, 3, 3, 4, 8; frequenze: 2→1, 3→2, 4→1, 8→1.","Somma 20 e divido per 5: media = 4.","La mediana è il terzo dato, 3; la moda è 3 perché compare due volte. Frequenza relativa di 3: 2/5 = 40%."],"result":"Media 4, mediana 3, moda 3; frequenze assolute 1,2,1,1 e relative 20%,40%,20%,20%."},"steps":[{"title":"Ordina e conta","do":"Nel tuo elenco metti i valori in ordine conservando le ripetizioni.","help":"Due 3 sono due osservazioni, non una."},{"title":"Calcola gli indici","do":"Per media usa somma/numero; per mediana trova il centro; per moda conta le ripetizioni.","help":"Con un numero pari di dati la mediana è la media dei due centrali."},{"title":"Spiega le differenze","do":"Scrivi che cosa descrive ogni indice e verifica il totale delle frequenze.","help":"Il valore alto 8 sposta la media senza diventare la moda."}],"transfer":{"task":"Analizza 1, 2, 2, 5. Calcola frequenze, media, mediana e moda.","check":"Frequenze 1→1, 2→2, 5→1; relative 25%,50%,25%. Media 10/4 = 2,5; mediana (2 + 2)/2 = 2; moda 2."},"checks":["Le ripetizioni restano nell’elenco","La media divide per il numero di dati","Mediana e moda usano criteri diversi"],"error":{"wrong":"La media è (2 + 3 + 4 + 8)/4 perché 3 si ripete.","why":"La media deve includere ogni osservazione.","fix":"Somma anche il secondo 3 e dividi per 5."},"home":["Sui dati assegnati conserva l’elenco ordinato accanto ai tre indici.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Ordina e conta","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa un riquadro per ogni indice e una striscia ordinata dei dati; copri gli altri riquadri mentre calcoli.","preserve":"Calcolare frequenze, media, mediana e moda distinguendone il significato.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Distingui il ragionamento geometrico dalla precisione del tratto. Riduci indicazioni su ordine e scelta delle formule; lascia disponibili righe guida, strumenti e formulario. Un disegno riuscito non verifica da solo il calcolo o la dimostrazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M09-10","goal":"Calcolare una probabilità semplice specificando esiti e ipotesi.","materials":["carta a quadretti","matita","righello; compasso e squadra quando richiesti"],"techniques":[{"name":"Spazio degli esiti","how":"Disegna tutte le palline o scrivi tutti i numeri del dado, poi cerchia i favorevoli.","why":"Rende visibile il denominatore."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Gli esiti elementari sono distinti; L’evento segue la consegna; La probabilità è tra 0 e 1. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Un sacchetto contiene 3 palline rosse e 2 blu, identiche per forma e peso. Mescoli ed estrai una pallina senza guardare. Qual è la probabilità di rosso?","work":["Gli esiti elementari sono le 5 singole palline; si assume che ciascuna abbia la stessa possibilità di essere estratta.","Tre palline soddisfano l’evento rosso: casi favorevoli 3 su 5.","P(rosso) = 3/5 = 0,6 = 60%; P(blu) = 2/5 = 40%."],"result":"Probabilità di rosso 3/5, cioè 60%. Non significa che ogni cinque estrazioni appariranno esattamente tre rossi."},"steps":[{"title":"Elenca gli esiti","do":"Per il tuo esperimento scrivi i singoli esiti possibili e l’ipotesi di uguale possibilità.","help":"Non contare soltanto i colori: le palline sono cinque."},{"title":"Definisci l’evento","do":"Segna gli esiti che rispettano esattamente la richiesta.","help":"“Maggiore di 4” non comprende 4."},{"title":"Calcola il rapporto","do":"Dividi favorevoli per possibili e controlla che il valore sia tra 0 e 1.","help":"Una probabilità non è una promessa sul prossimo esito."}],"transfer":{"task":"Un dado regolare a sei facce è lanciato una volta. Calcola la probabilità di un numero maggiore di 4 e di un numero pari.","check":"Maggiore di 4: {5,6}, quindi 2/6 = 1/3. Pari: {2,4,6}, quindi 3/6 = 1/2. Si assume dado equilibrato."},"checks":["Gli esiti elementari sono distinti","L’evento segue la consegna","La probabilità è tra 0 e 1"],"error":{"wrong":"P(rosso) = 1/2 perché ci sono due colori.","why":"I colori non hanno lo stesso numero di palline.","fix":"Conta le palline: 3 favorevoli su 5."},"home":["Su un problema di probabilità scrivi prima tutti gli esiti e soltanto dopo la frazione.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Elenca gli esiti","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Rappresenta ciascun esito con una casella separata; evidenzia i favorevoli senza cancellare gli altri.","preserve":"Calcolare una probabilità semplice specificando esiti e ipotesi.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Distingui il ragionamento geometrico dalla precisione del tratto. Riduci indicazioni su ordine e scelta delle formule; lascia disponibili righe guida, strumenti e formulario. Un disegno riuscito non verifica da solo il calcolo o la dimostrazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M10-01","goal":"Spiegare un fenomeno collegando condizioni, processo ed effetto.","materials":["carta e matita","testo e dati riportati nella consegna"],"techniques":[{"name":"Spiegazione causale","how":"Costruisci una frase “quando… il processo… quindi…” usando stato e condizioni del testo.","why":"Organizza la spiegazione oltre la semplice definizione."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Il cambiamento di stato è corretto; La causa è collegata ai dati; Le conclusioni rispettano le condizioni indicate. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Testo: “L’acqua liquida può passare a vapore dalla sua superficie anche senza bollire. Questo processo è chiamato evaporazione. Con aria più calda o in movimento l’evaporazione può aumentare, a parità delle altre condizioni.” Spiega perché due panni uguali possono asciugarsi a velocità diverse.","work":["Identifico il cambiamento: acqua liquida → vapore nell’aria.","Collego le condizioni: aria più calda o in movimento può favorire l’evaporazione.","Formulo una spiegazione prudente: se i panni hanno uguale acqua iniziale e materiale, condizioni diverse dell’aria possono cambiare il tempo di asciugatura."],"result":"I panni si asciugano perché l’acqua evapora; aria più calda o in movimento può accelerare il processo. Non serve raggiungere l’ebollizione."},"steps":[{"title":"Trova il cambiamento","do":"Nel tuo testo identifica che cosa cambia e tra quali stati.","help":"Evaporazione: liquido a gas; condensazione: gas a liquido."},{"title":"Collega le condizioni","do":"Sottolinea le condizioni che possono influire e ciò che deve restare uguale.","help":"“Può aumentare” non significa “aumenta sempre”."},{"title":"Spiega con una catena","do":"Scrivi condizione → processo → effetto osservabile.","help":"Usa i dati del testo, senza aggiungere una causa non fornita."}],"transfer":{"task":"Testo: “Il vapore d’acqua nell’aria può condensare quando incontra una superficie abbastanza fredda.” Spiega le goccioline esterne a un bicchiere freddo chiuso, senza perdite.","check":"Il vapore presente nell’aria condensa sulla superficie fredda e forma gocce liquide. Non è necessario che l’acqua attraversi il vetro; bicchiere chiuso e senza perdite escludono quella spiegazione nel compito."},"checks":["Il cambiamento di stato è corretto","La causa è collegata ai dati","Le conclusioni rispettano le condizioni indicate"],"error":{"wrong":"L’acqua evapora solo se bolle.","why":"Il testo dice che può evaporare dalla superficie anche senza bollire.","fix":"Distingui evaporazione ed ebollizione; usa l’esempio dei panni."},"home":["Per il fenomeno assegnato scrivi una catena di tre elementi e cerca nel testo ciascun collegamento.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Trova il cambiamento","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Dividi il testo in tre righe: stato iniziale, processo, condizioni; puoi ascoltare la lettura e costruire la catena a voce.","preserve":"Spiegare un fenomeno collegando condizioni, processo ed effetto.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Chiedi che cosa è stato osservato e che cosa è una spiegazione. Riduci le domande guida, mantenendo gli strumenti di lettura e registrazione utili. Gli esempi non sostituiscono procedure di laboratorio autorizzate; evita esperimenti con calore, corrente di rete o sostanze non previste.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M10-02","goal":"Descrivere osservazioni senza mescolarle a interpretazioni.","materials":["carta e matita","testo e dati riportati nella consegna"],"techniques":[{"name":"Doppia colonna osservazione-ipotesi","how":"Trascrivi prima i dati visibili e solo dopo le possibili spiegazioni.","why":"Evita di presentare un’interpretazione come fatto osservato."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Le osservazioni sono verificabili nei dati; Le misure hanno unità; L’ipotesi è etichettata separatamente. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Dati di osservazione di una piantina in immagine: fusto verde alto 8 cm; quattro foglie; due foglie inclinate verso una finestra a destra. Scrivi tre osservazioni e separa una possibile spiegazione.","work":["Registro misure e conteggi: fusto alto 8 cm; quattro foglie.","Descrivo la posizione: due foglie sono inclinate verso la finestra a destra.","Separo l’ipotesi: la luce potrebbe influire sull’orientamento; questi soli dati non provano la causa."],"result":"Osservazioni: altezza 8 cm, quattro foglie, due inclinate a destra. Ipotesi distinta: possibile relazione con la luce."},"steps":[{"title":"Scegli ciò che osservi","do":"Per il tuo oggetto indica colore, forma, misura o numero realmente disponibili.","help":"“Bello” è un giudizio, non una misura."},{"title":"Descrivi in modo preciso","do":"Usa una frase per caratteristica e indica l’unità per le misure.","help":"“Alto 8 cm” è più controllabile di “abbastanza alto”."},{"title":"Separa l’ipotesi","do":"Scrivi le spiegazioni in una colonna diversa.","help":"Puoi usare “potrebbe”, poi dire quali dati servirebbero."}],"transfer":{"task":"Una pietra osservata è grigia, lunga 4 cm, ha superficie ruvida e tre macchie bianche. Scrivi tre osservazioni. La frase “viene da un vulcano” è osservazione o ipotesi?","check":"Sono osservazioni colore grigio, lunghezza 4 cm, superficie ruvida, tre macchie bianche. “Viene da un vulcano” è un’ipotesi sull’origine, non ricavabile con certezza da questi dati."},"checks":["Le osservazioni sono verificabili nei dati","Le misure hanno unità","L’ipotesi è etichettata separatamente"],"error":{"wrong":"Osservo che la pianta vuole la luce.","why":"“Vuole” attribuisce un’intenzione che non è osservabile qui.","fix":"Descrivi l’inclinazione e formula una possibile influenza della luce."},"home":["Descrivi un’immagine del tuo libro con tre dati e una eventuale ipotesi separata.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Scegli ciò che osservi","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa una lista con icone testuali “colore, numero, misura, posizione”; registra anche con parole brevi o dettatura.","preserve":"Descrivere osservazioni senza mescolarle a interpretazioni.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Chiedi che cosa è stato osservato e che cosa è una spiegazione. Riduci le domande guida, mantenendo gli strumenti di lettura e registrazione utili. Gli esempi non sostituiscono procedure di laboratorio autorizzate; evita esperimenti con calore, corrente di rete o sostanze non previste.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M10-03","goal":"Classificare elementi con un criterio esplicito e confrontarne proprietà.","materials":["carta e matita","testo e dati riportati nella consegna"],"techniques":[{"name":"Matrice di proprietà","how":"Metti gli elementi in righe e il criterio nella colonna da compilare.","why":"Rende coerente la classificazione di tutti gli elementi."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Il criterio è esplicito; Ogni elemento compare una volta; Le condizioni del testo sono conservate. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Dati: ferro e rame conducono bene elettricità; plastica e legno asciutto la conducono molto meno nelle condizioni descritte. Classifica i quattro materiali e confronta ferro e plastica. Non eseguire prove con prese o corrente di rete.","work":["Scelgo il criterio “conduzione elettrica nelle condizioni descritte”.","Gruppo dei buoni conduttori: ferro e rame. Gruppo di materiali isolanti nell’uso considerato: plastica e legno asciutto.","Confronto ferro e plastica sullo stesso criterio: il ferro conduce bene, la plastica molto meno. Non classifico per colore."],"result":"Ferro/rame: buoni conduttori; plastica/legno asciutto: isolanti nelle condizioni indicate. Il criterio resta la conduzione."},"steps":[{"title":"Dichiara il criterio","do":"Sul tuo compito scrivi la proprietà usata per formare i gruppi.","help":"Non cambiare da conduzione a durezza a metà classificazione."},{"title":"Applica a tutti","do":"Per ogni elemento usa il dato relativo a quella proprietà.","help":"Mantieni qualifiche come “asciutto” o “trasparente”."},{"title":"Confronta due elementi","do":"Scrivi una somiglianza o differenza rispetto allo stesso criterio.","help":"Un materiale può cambiare gruppo se cambia il criterio."}],"transfer":{"task":"Dati: vetro e plastica trasparente lasciano passare luce; cartone e legno sono opachi. Classifica e confronta vetro e cartone.","check":"Criterio: passaggio della luce. Trasparenti: vetro e plastica trasparente; opachi: cartone e legno. Il vetro permette di vedere attraverso, il cartone no nei dati forniti."},"checks":["Il criterio è esplicito","Ogni elemento compare una volta","Le condizioni del testo sono conservate"],"error":{"wrong":"Il legno è sempre isolante in ogni condizione.","why":"Il dato riguarda legno asciutto nelle condizioni descritte.","fix":"Mantieni la condizione e non generalizzare oltre i dati."},"home":["Sulla tua classificazione scrivi il criterio sopra la tabella e controlla tutte le righe.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Dichiara il criterio","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa una tabella con quattro righe già etichettate; ascolta un dato alla volta e indica il gruppo corrispondente.","preserve":"Classificare elementi con un criterio esplicito e confrontarne proprietà.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Chiedi che cosa è stato osservato e che cosa è una spiegazione. Riduci le domande guida, mantenendo gli strumenti di lettura e registrazione utili. Gli esempi non sostituiscono procedure di laboratorio autorizzate; evita esperimenti con calore, corrente di rete o sostanze non previste.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M10-04","goal":"Interpretare uno schema, un modello e un’immagine riconoscendone i limiti.","materials":["carta e matita","testo e dati riportati nella consegna"],"techniques":[{"name":"Traduzione visivo-verbale","how":"Trasforma ogni freccia in una frase con origine, relazione e destinazione.","why":"Fa controllare il significato del disegno."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Ogni simbolo è interpretato dalla legenda; Le relazioni sono espresse in parole; È indicato almeno un limite del modello. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Schema fornito: Sole → energia luminosa → pianta. Modello: radici assorbono acqua; foglie ricevono luce e scambiano gas. Immagine descritta: frecce blu dal terreno alle radici, frecce gialle dal Sole alle foglie. Spiega simboli e limiti.","work":["Leggo la legenda: blu indica acqua; giallo luce. Le frecce mostrano direzione, non la forma reale delle sostanze.","Collego schema e modello: luce arriva alle foglie, acqua è assorbita dalle radici; non sono la stessa cosa.","Indico un limite: il modello non mostra tutti i passaggi della fotosintesi e non dà quantità o tempi."],"result":"Lo schema rappresenta flussi di acqua ed energia luminosa verso la pianta; colori e frecce sono convenzioni. Non è una fotografia completa del processo."},"steps":[{"title":"Leggi la legenda","do":"Nel tuo schema identifica significato di colori, frecce e simboli.","help":"Se la legenda manca, non inventare ciò che significa un colore."},{"title":"Traduci in frasi","do":"Scrivi una frase per ogni relazione disegnata.","help":"“Radici assorbono acqua” è più preciso di “la pianta prende cose”."},{"title":"Dichiara il limite","do":"Indica che cosa è semplificato o non rappresentato.","help":"Un modello serve a capire alcuni aspetti, non tutti."}],"transfer":{"task":"Schema: acqua liquida → evaporazione → vapore → condensazione → gocce. Immagine descritta: freccia rossa verso “vapore”, blu verso “gocce”. Spiega il modello e indica due dati che non fornisce.","check":"Rappresenta due cambiamenti di stato opposti. I colori distinguono passaggi e richiedono una legenda, non sono colori del vapore. Mancano quantità, temperature precise e tempi; basta indicarne due."},"checks":["Ogni simbolo è interpretato dalla legenda","Le relazioni sono espresse in parole","È indicato almeno un limite del modello"],"error":{"wrong":"Le frecce gialle sono tubi che entrano nelle foglie.","why":"La freccia è un simbolo della direzione della luce.","fix":"Scrivi “energia luminosa arriva alle foglie”."},"home":["Per una figura del tuo testo scrivi due relazioni e un limite della rappresentazione.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Leggi la legenda","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Aggiungi etichette scritte ai colori e numera le frecce; analizza una relazione per volta.","preserve":"Interpretare uno schema, un modello e un’immagine riconoscendone i limiti.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Chiedi che cosa è stato osservato e che cosa è una spiegazione. Riduci le domande guida, mantenendo gli strumenti di lettura e registrazione utili. Gli esempi non sostituiscono procedure di laboratorio autorizzate; evita esperimenti con calore, corrente di rete o sostanze non previste.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M10-05","goal":"Distinguere domanda, ipotesi e previsione verificabile.","materials":["carta e matita","testo e dati riportati nella consegna"],"techniques":[{"name":"Struttura domanda-ipotesi-previsione","how":"Scrivi tre riquadri separati e collega la previsione alla spiegazione.","why":"Distingue il problema di ricerca dall’esito atteso."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: La domanda identifica un confronto; L’ipotesi è una spiegazione provvisoria; La previsione riguarda un dato misurabile. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Situazione: due fogli identici, uno piano e uno piegato a fisarmonica, sostengono piccoli pesi tra due supporti. Formula domanda, ipotesi e previsione senza aver ancora raccolto risultati.","work":["Domanda: la piegatura cambia quanti pesi uguali il foglio sostiene?","Ipotesi: la forma piegata potrebbe rendere il foglio più resistente al piegamento in questa disposizione.","Previsione: se l’ipotesi è adeguata, a parità di foglio, distanza dei supporti e pesi, il foglio piegato sosterrà più pesi di quello piano."],"result":"La domanda chiede che cosa confrontare; l’ipotesi propone una spiegazione; la previsione indica il risultato atteso e le condizioni."},"steps":[{"title":"Formula la domanda","do":"Nel tuo compito indica due condizioni da confrontare e una grandezza da osservare.","help":"“Cosa succede?” è troppo ampio: chiedi quanti pesi o quanto tempo."},{"title":"Proponi una spiegazione","do":"Scrivi “potrebbe… perché…” senza trattarla come dato.","help":"Non dire “ho dimostrato” prima della prova."},{"title":"Prevedi un esito","do":"Usa “se… allora…” e indica ciò che deve restare uguale.","help":"Una previsione deve poter essere confrontata con misure."}],"transfer":{"task":"Due cubetti di ghiaccio uguali sono posti su superfici dello stesso materiale, una in stanza più calda e una più fresca. Formula domanda, ipotesi e previsione; non eseguire prove senza autorizzazione.","check":"Domanda: la temperatura ambiente cambia il tempo di fusione? Ipotesi: aria più calda può favorire lo scambio di energia verso il ghiaccio. Previsione: con cubetti e superfici uguali, il cubetto nella stanza più calda dovrebbe fondere prima. È un’attesa, non un risultato già osservato."},"checks":["La domanda identifica un confronto","L’ipotesi è una spiegazione provvisoria","La previsione riguarda un dato misurabile"],"error":{"wrong":"La previsione è “il foglio è bello”.","why":"Non corrisponde al confronto né a una misura di resistenza.","fix":"Prevedi quale foglio sosterrà più pesi, con condizioni uguali."},"home":["Per la tua attività scientifica scrivi prima la previsione e non modificarla dopo per farla coincidere con i dati.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Formula la domanda","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa tre inizi di frase già scritti: “Cambia…?”, “Potrebbe… perché…”, “Se… allora…”; scegli tu i contenuti.","preserve":"Distinguere domanda, ipotesi e previsione verificabile.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Chiedi che cosa è stato osservato e che cosa è una spiegazione. Riduci le domande guida, mantenendo gli strumenti di lettura e registrazione utili. Gli esempi non sostituiscono procedure di laboratorio autorizzate; evita esperimenti con calore, corrente di rete o sostanze non previste.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M10-06","goal":"Progettare un confronto controllato e leggere risultati senza generalizzare.","materials":["carta e matita","testo e dati riportati nella consegna"],"techniques":[{"name":"Confronto controllato","how":"Compila le colonne “cambio”, “misuro”, “mantengo” prima di osservare i risultati.","why":"Rende interpretabile la differenza tra condizioni."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Una sola variabile prevista cambia; Misura e procedura sono definite; La conclusione non supera le condizioni provate. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Prova su carta: due fogli identici tra supporti distanti 10 cm; A piano e B piegato a fisarmonica. Si aggiungono pesi identici uno alla volta al centro fino al cedimento. Risultati in tre prove: A 2,2,3 pesi; B 5,6,5. Identifica variabile, controlli e conclusione.","work":["Variabile cambiata: forma del foglio. Misura: numero di pesi sostenuti prima del cedimento.","Tengo uguali tipo di foglio, distanza 10 cm, tipo di pesi, posizione e modo di aggiungerli.","In queste prove B sostiene più pesi di A; ripetizioni mostrano piccole differenze. Non dimostra ogni possibile forma o materiale."],"result":"Il confronto sostiene che, in questa disposizione, la piegatura scelta aumenta il numero di pesi sostenuti."},"steps":[{"title":"Seleziona una variabile","do":"Nel tuo protocollo scrivi che cosa cambia e che cosa misuri.","help":"Piegatura e numero di pesi hanno ruoli diversi."},{"title":"Fissa i controlli","do":"Elenca condizioni uguali e ripetizioni previste.","help":"Cambiare contemporaneamente foglio e distanza impedisce un confronto chiaro."},{"title":"Concludi sui dati","do":"Confronta le ripetizioni e formula una conclusione limitata al test.","help":"Se i risultati si sovrappongono molto, segnala l’incertezza."}],"transfer":{"task":"Prova su carta: due rampe identiche lunghe 30 cm, altezza A 5 cm e B 10 cm; stessa pallina lasciata senza spinta. Tempi in secondi: A 1,8;1,9;1,8 e B 1,2;1,3;1,2. Indica variabile, misura, controlli e conclusione.","check":"Variabile: altezza. Misura: tempo per percorrere la rampa. Controlli: pallina, lunghezza/materiale, punto di rilascio e assenza di spinta. In queste prove la rampa più alta dà tempi minori; non si conclude “il doppio dell’altezza dimezza sempre il tempo”."},"checks":["Una sola variabile prevista cambia","Misura e procedura sono definite","La conclusione non supera le condizioni provate"],"error":{"wrong":"Cambio sia piegatura sia tipo di foglio e attribuisco la differenza alla piegatura.","why":"Non separi l’effetto delle due modifiche.","fix":"Usa lo stesso tipo di foglio e cambia solo la forma."},"home":["Sul tuo esperimento scolastico identifica prima una variabile, una misura e tre controlli.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Seleziona una variabile","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa tre colonne già etichettate e una lista numerata del protocollo; spunta ogni controllo mentre lo descrivi.","preserve":"Progettare un confronto controllato e leggere risultati senza generalizzare.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Chiedi che cosa è stato osservato e che cosa è una spiegazione. Riduci le domande guida, mantenendo gli strumenti di lettura e registrazione utili. Gli esempi non sostituiscono procedure di laboratorio autorizzate; evita esperimenti con calore, corrente di rete o sostanze non previste.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M10-07","goal":"Registrare misure con unità e costruire una rappresentazione leggibile.","materials":["carta e matita","testo e dati riportati nella consegna"],"techniques":[{"name":"Doppia rappresentazione dei dati","how":"Passa dalla tabella ai punti e ricontrolla ogni punto nella tabella.","why":"Permette di vedere l’andamento senza perdere le misure."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Ogni punto corrisponde a una coppia; Gli assi hanno unità e scala regolare; La descrizione usa variazioni realmente presenti. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Un campione viene misurato ogni minuto. Tempo (min): 0,1,2,3. Temperatura (°C): 20,24,28,30. Crea tabella e grafico con tempo orizzontale e temperatura verticale.","work":["Scrivo intestazioni “tempo (min)” e “temperatura (°C)” e associo 0→20, 1→24, 2→28, 3→30.","Scelgo scala orizzontale di 1 minuto e verticale di 2 °C, indicando se l’asse parte da 20. Segno (0,20),(1,24),(2,28),(3,30).","Leggo: in tre minuti la temperatura aumenta di 10 °C; gli incrementi sono 4,4,2 °C. Una linea può guidare la lettura, senza inventare nuove misure."],"result":"Tabella di quattro coppie; grafico con punti corretti e unità. Aumento totale 10 °C; l’aumento per minuto non è sempre uguale."},"steps":[{"title":"Associa dato e unità","do":"Nel tuo quaderno trascrivi ogni coppia senza cambiare ordine.","help":"Un numero privo di unità non dice che cosa è misurato."},{"title":"Scegli una scala","do":"Disegna assi con tacche regolari e valori leggibili.","help":"Dichiara l’origine scelta: non far sembrare 20 °C lo zero."},{"title":"Leggi la variazione","do":"Confronta primo e ultimo valore e poi gli intervalli.","help":"Una curva regolare disegnata non sostituisce misure mancanti."}],"transfer":{"task":"Tempo (min): 0,2,4. Altezza dell’acqua (cm): 1,3,4. Rappresenta i dati e descrivi la variazione totale.","check":"Punti (0,1),(2,3),(4,4), assi con min e cm. Aumento totale 3 cm; primo intervallo +2 cm, secondo +1 cm. Non sono incrementi costanti."},"checks":["Ogni punto corrisponde a una coppia","Gli assi hanno unità e scala regolare","La descrizione usa variazioni realmente presenti"],"error":{"wrong":"Scrivo 30 − 20 = 10 minuti.","why":"La differenza riguarda temperature.","fix":"Scrivi 10 °C; i tempi si leggono sull’altro asse."},"home":["Per la tua tabella verifica ogni punto del grafico contro una riga.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Associa dato e unità","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Fornisci assi con unità e tacche già tracciate; lascia al ragazzo il posizionamento e la lettura delle coppie.","preserve":"Registrare misure con unità e costruire una rappresentazione leggibile.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Chiedi che cosa è stato osservato e che cosa è una spiegazione. Riduci le domande guida, mantenendo gli strumenti di lettura e registrazione utili. Gli esempi non sostituiscono procedure di laboratorio autorizzate; evita esperimenti con calore, corrente di rete o sostanze non previste.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M10-08","goal":"Scrivere una relazione separando scopo, metodo, risultati e conclusione.","materials":["carta e matita","testo e dati riportati nella consegna"],"techniques":[{"name":"Struttura della relazione","how":"Inserisci ciascuna frase nella sezione corretta e collega conclusione e tabella.","why":"Rende verificabile che cosa hai fatto e che cosa sostieni."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Il metodo permetterebbe di ripetere la prova; I risultati sono distinti dalla conclusione; Origine dei dati e limite sono espliciti. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Dati di laboratorio simulato: confronto carta piana/piegata; fogli identici; supporti a 10 cm; pesi uguali centrali. Tre prove: piano 2,2,3; piegato 5,6,5. Scrivi una breve relazione senza fingere di aver eseguito la prova.","work":["Scopo: confrontare la resistenza delle due forme. Metodo: stessi fogli e pesi, stessa distanza, aggiunta di un peso per volta; tre prove.","Risultati: riporto in tabella piano 2,2,3 e piegato 5,6,5; sono dati forniti, non misure personali.","Conclusione: il foglio piegato sostiene più pesi nelle condizioni indicate. Limite: poche prove e un solo tipo di carta."],"result":"Relazione esemplificativa: “Analizzo dati forniti. Con fogli e condizioni uguali, il piano sostiene 2,2,3 pesi e il piegato 5,6,5. I dati sostengono il vantaggio della piegatura usata; non descrivono ogni carta o forma.”"},"steps":[{"title":"Organizza le sezioni","do":"Nel tuo compito usa scopo, materiali/metodo, risultati, conclusione e limiti.","help":"Non mettere la conclusione prima di mostrare i risultati."},{"title":"Riporta i dati","do":"Usa una tabella con condizioni, ripetizioni e unità.","help":"Dichiara se i dati sono raccolti da te o forniti."},{"title":"Collega la conclusione","do":"Cita una differenza dei risultati e un limite del metodo.","help":"Non inventare osservazioni per completare la relazione."}],"transfer":{"task":"Dati simulati: due superfici A liscia e B ruvida; stessa pallina, stessa spinta prevista, tre distanze (cm): A 40,42,41; B 20,22,21. Scrivi scopo, metodo, risultati, conclusione e un limite.","check":"Scopo: confrontare le distanze su due superfici. Metodo: stessa pallina e condizioni di spinta previste, tre prove. Risultati: le sei distanze in tabella con cm. Conclusione: qui la pallina percorre meno su B. Limite: controllare realmente che la spinta sia uguale; i dati forniti non bastano a verificarlo."},"checks":["Il metodo permetterebbe di ripetere la prova","I risultati sono distinti dalla conclusione","Origine dei dati e limite sono espliciti"],"error":{"wrong":"Scrivo “ho misurato” anche se i dati sono nel testo.","why":"Attribuisci a te un’osservazione non eseguita.","fix":"Scrivi “nei dati forniti risulta…” e riporta la tabella."},"home":["Nella tua relazione controlla che ogni conclusione abbia un riferimento alla tabella.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Organizza le sezioni","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa cinque intestazioni già pronte e una casella per ogni dato; puoi dettare la conclusione prima di trascriverla.","preserve":"Scrivere una relazione separando scopo, metodo, risultati e conclusione.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Chiedi che cosa è stato osservato e che cosa è una spiegazione. Riduci le domande guida, mantenendo gli strumenti di lettura e registrazione utili. Gli esempi non sostituiscono procedure di laboratorio autorizzate; evita esperimenti con calore, corrente di rete o sostanze non previste.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M10-09","goal":"Distinguere dato osservato e spiegazione da mettere alla prova.","materials":["carta e matita","testo e dati riportati nella consegna"],"techniques":[{"name":"Confronto di spiegazioni","how":"Affianca la spiegazione proposta a un’alternativa o limite e cerca il dato che le distinguerebbe.","why":"Allena una conclusione proporzionata alle osservazioni."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Il dato non contiene una causa inventata; La spiegazione indica un meccanismo; Il limite o l’alternativa è pertinente. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Dati: una bustina di tè immersa in acqua colora l’acqua prima vicino alla bustina e poi più lontano. Proposta: sostanze del tè passano nell’acqua e si distribuiscono. Separa osservazioni e spiegazione; indica un limite.","work":["Osservazioni fornite: il colore compare vicino alla bustina e successivamente più lontano.","Spiegazione proposta: alcune sostanze passano dalla bustina all’acqua e si distribuiscono; è diversa dalla descrizione del colore.","Il solo colore non misura la quantità di sostanze né distingue tutti i processi di trasporto; servirebbero dati ulteriori."],"result":"Descrizione e spiegazione sono separate. L’osservazione è compatibile con la proposta ma non verifica ogni suo dettaglio."},"steps":[{"title":"Scrivi i dati","do":"Nel tuo fenomeno elenca ciò che si vede o misura senza “perché”.","help":"“Il colore si estende” è una descrizione."},{"title":"Proponi il meccanismo","do":"Spiega come potrebbe prodursi il cambiamento.","help":"Usa “compatibile con” quando i dati non isolano la causa."},{"title":"Cerca un’alternativa","do":"Indica un’altra spiegazione o un dato necessario per distinguerla.","help":"Una sequenza temporale da sola non prova una causa."}],"transfer":{"task":"Dati: una pozzanghera è più piccola dopo due ore di sole, senza pioggia. Proposta: parte dell’acqua è evaporata. Che cosa è osservato? Quali altre possibilità o dati consideri?","check":"Osservato: diminuzione dell’estensione dopo due ore. Evaporazione è una spiegazione possibile; assorbimento nel terreno o scorrimento possono contribuire. Servono informazioni su superficie, profondità e perdite per attribuire tutto all’evaporazione."},"checks":["Il dato non contiene una causa inventata","La spiegazione indica un meccanismo","Il limite o l’alternativa è pertinente"],"error":{"wrong":"La pozzanghera è diminuita, quindi so che tutta l’acqua è evaporata.","why":"Mancano dati che escludano altre perdite.","fix":"Distingui diminuzione osservata ed evaporazione possibile."},"home":["Nel tuo testo scientifico segna una frase di osservazione e una di spiegazione.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Scrivi i dati","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa due colori o etichette scritte “vedo” e “spiego”; completa un dato alla volta senza dover rileggere tutto.","preserve":"Distinguere dato osservato e spiegazione da mettere alla prova.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Chiedi che cosa è stato osservato e che cosa è una spiegazione. Riduci le domande guida, mantenendo gli strumenti di lettura e registrazione utili. Gli esempi non sostituiscono procedure di laboratorio autorizzate; evita esperimenti con calore, corrente di rete o sostanze non previste.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M10-10","goal":"Risolvere un problema quantitativo con grandezze e unità coerenti.","materials":["carta e matita","testo e dati riportati nella consegna"],"techniques":[{"name":"Formula con significato","how":"Accanto a d scrivi “massa per unità di volume” e a v “spazio per unità di tempo”.","why":"Aiuta a ricordare ordine e unità del rapporto."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: I dati hanno simboli e unità; Il rapporto ha l’ordine corretto; La verifica ricostruisce il dato iniziale. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Un campione ha massa 120 g e volume 40 cm³. Calcola densità media usando d = m/V. Un oggetto percorre 150 m in 30 s: calcola velocità media usando v = s/t.","work":["Densità: identifico m = 120 g e V = 40 cm³; d = 120/40 = 3 g/cm³.","Velocità media: s = 150 m, t = 30 s; v = 150/30 = 5 m/s.","Controllo ricostruendo i dati: 3 × 40 = 120 g e 5 × 30 = 150 m. La velocità è media, non necessariamente costante."],"result":"Densità media 3 g/cm³; velocità media 5 m/s."},"steps":[{"title":"Etichetta le grandezze","do":"Nel tuo problema scrivi simbolo, dato e unità prima della formula.","help":"Volume non è una lunghezza: qui è in cm³."},{"title"
