ai colori."],"sources":["novak","aidmappe"]}],"sources":{"dunlosky2013":{"title":"Dunlosky e colleghi · Tecniche di apprendimento (2013)","url":"https://www.psychologicalscience.org/publications/journals/pspi/learning-techniques.html","kind":"Rassegna scientifica","note":"Sostegno generale a recupero attivo e pratica distribuita; non validazione di ogni guida."},"ies2007":{"title":"IES · Organizing Instruction and Study (2007)","url":"https://ies.ed.gov/ncee/wwc/PracticeGuide/1","kind":"Guida istituzionale basata sulla ricerca","note":"Esempi svolti, spiegazioni, rappresentazioni e organizzazione dello studio."},"eef2025":{"title":"EEF · Metacognition and Self-Regulated Learning (2025)","url":"https://educationendowmentfoundation.org.uk/education-evidence/guidance-reports/metacognition/","kind":"Guida educativa basata sulla ricerca","note":"Pianificazione, monitoraggio e valutazione insegnati nel contesto disciplinare."},"aid":{"title":"AID · Strumenti compensativi","url":"https://www.aiditalia.org/software-compensativi","kind":"Indicazioni associative","note":"Scelta collegata a bisogno, contesto e autonomia; nessuno strumento universale."},"aidmappe":{"title":"AID · Guida mappe e mediatori didattici","url":"https://www.aiditalia.org/news/Guida%20Mappe%20Didattiche","kind":"Guida metodologica associativa","note":"Tipi e funzioni dei mediatori. Esempi dello strumento redatti ex novo."},"novak":{"title":"Novak e Cañas · Theory of Concept Maps","url":"https://cmap.ihmc.us/docs/theory-of-concept-maps","kind":"Riferimento teorico e metodologico","note":"Domanda focale, concetti, parole-legame e proposizioni; riferimento per le mappe concettuali."},"aiddsa":{"title":"AID · Che cosa sono i DSA","url":"https://www.aiditalia.org/che-cosa-sono-i-dsa","kind":"Informazione associativa","note":"Distinzione tra difficoltà di lettura, ortografia, grafia e abilità numeriche."},"wcag":{"title":"W3C · WCAG 2.2","url":"https://www.w3.org/WAI/WCAG22/quickref/","kind":"Standard di accessibilità","note":"Criteri pertinenti per tastiera, ingrandimento, reflow, contrasto e focus."}}}</script><script>'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent);
const INVENTORY=DATA.inventory, METHODS=new Map(DATA.methods.map(m=>[m.id,m])), MAPS=DATA.maps;
const PHASES=['Che cosa devi ottenere','Tecniche utili','Guarda come si fa','Proviamo sul tuo compito','Prova con meno aiuto','Controlla il risultato','Riprendilo a casa'];
const state={mode:'home',subject:null,area:null,method:null,phase:0,mapType:null,mapSubject:null,map:null,mapStep:0,full:true,selected:new Set(),category:'tutte',large:false};
const main=document.getElementById('main'),pathEl=document.getElementById('path');let printReturn=null;
const e=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p=s=>`<p>${e(s).replace(/\n/g,'<br>')}</p>`;
const list=(a,ordered=false)=>`<${ordered?'ol':'ul'}>${a.map(x=>`<li>${e(x)}</li>`).join('')}</${ordered?'ol':'ul'}>`;
const btn=(label,action,value='',cls='',extra='')=>`<button class="${cls}" data-action="${action}" data-value="${e(value)}" ${extra}>${e(label)}</button>`;
const card=(label,sub,action,value)=>`<button class="choice" data-action="${action}" data-value="${e(value)}"><strong>${e(label)}</strong><span class="small">${e(sub)}</span></button>`;
const unique=(a,key)=>[...new Map(a.map(x=>[x[key],x])).values()];
function clearMethod(){state.method=null;state.phase=0;state.selected.clear();state.category='tutte';}
function reset(){Object.assign(state,{mode:'home',subject:null,area:null,method:null,phase:0,mapType:null,mapSubject:null,map:null,mapStep:0,full:true,category:'tutte'});state.selected.clear();}
function breadcrumbs(){
 const crumbs=[['Inizio','home','']];
 if(state.mode==='tasks'){
  crumbs.push(['Compiti','tasks','']);
  if(state.subject)crumbs.push([INVENTORY.find(x=>x.subject===state.subject).subjectName,'subject',state.subject]);
  if(state.area)crumbs.push([state.area,'area',state.area]);
 }else if(state.mode==='maps'){
  crumbs.push(['Mappe','maps','']);if(state.mapType)crumbs.push([state.mapType==='concettuale'?'Concettuali':'Mentali','map-type',state.mapType]);
  if(state.mapSubject)crumbs.push([state.mapSubject,'map-subject',state.mapSubject]);
 }else if(state.mode==='about')crumbs.push(['Guida e fonti','about','']);
 pathEl.innerHTML=state.mode==='home'?'':`<ol class="flow">${crumbs.map(([l,a,v])=>`<li>${btn(l,a,v)}</li>`).join('')}</ol>`;
}
function render(focus=true){breadcrumbs();
 if(state.mode==='home')renderHome();else if(state.mode==='tasks')renderTasks();else if(state.mode==='maps')renderMaps();else renderAbout();
 if(focus){const heading=main.querySelector('h1,h2');if(heading){heading.setAttribute('tabindex','-1');heading.focus({preventScroll:true});}main.scrollIntoView({block:'start',behavior:'instant'});}
}
function renderHome(){main.innerHTML=`<section class="hero"><p class="tag">Il tuo compito. Il tuo prossimo passo.</p><h1>Un passo alla volta.</h1><p class="intro">Scegli il lavoro che hai da fare. Guarda un esempio, prova sul quaderno e trova il metodo da riprendere a casa.</p></section><div class="entry-grid"><button class="entry" data-action="tasks" aria-label="Affronta un compito"><span class="number">01 / DAL COMPITO AL METODO</span><strong>Affronta un compito</strong><span class="desc">Materia, ambito e attività: una guida concreta per capire da dove iniziare e come continuare.</span><span class="arrow" aria-hidden="true">→</span></button><button class="entry" data-action="maps" aria-label="Impara a costruire mappe"><span class="number">02 / DAL TESTO ALLA MAPPA</span><strong>Impara a costruire mappe</strong><span class="desc">Mappe concettuali e mentali, con esempi che prendono forma passo dopo passo. Tu costruisci sul foglio.</span><span class="arrow" aria-hidden="true">→</span></button></div><div class="home-note"><span>${INVENTORY.length} attività · ${MAPS.length} esempi di mappe</span><span>Da usare insieme o riprendere a casa</span><span>Porta il compito, un foglio e gli strumenti che ti aiutano.</span></div>`;}
function renderTasks(){
 if(state.method){renderMethod();return;}
 if(!state.subject){main.innerHTML=`<p class="tag level-label">Passaggio 1 di 3</p><h1>Di quale materia ti occupi?</h1><p class="intro">Scegli una materia. Per appunti, interrogazioni e organizzazione trovi anche «In tutte le materie».</p><div class="choices">${unique(INVENTORY,'subject').map(x=>card(x.subjectName,`${INVENTORY.filter(y=>y.subject===x.subject).length} attività`, 'subject',x.subject)).join('')}</div>`;return;}
 const rows=INVENTORY.filter(x=>x.subject===state.subject);
 if(!state.area){main.innerHTML=`<p class="tag level-label">Passaggio 2 di 3</p><h1>In quale ambito?</h1><p class="intro">${e(rows[0].subjectName)}: scegli la parte del lavoro che vuoi affrontare.</p><div class="choices">${unique(rows,'area').map(x=>card(x.area,`${rows.filter(y=>y.area===x.area).length} tipi di lavoro`,'area',x.area)).join('')}</div>`;return;}
 main.innerHTML=`<p class="tag level-label">Passaggio 3 di 3</p><h1>Che cosa devi fare?</h1><p class="intro">${e(state.area)}. Parti dalla consegna del tuo compito.</p><div class="choices activities">${rows.filter(x=>x.area===state.area).map(x=>card(x.title,x.id,'method',x.id)).join('')}</div>`;
}
function methodData(){return {...INVENTORY.find(x=>x.id===state.method),...METHODS.get(state.method)};}
function renderMethod(){const m=methodData();let body='';
 switch(state.phase){
 case 0:body=`${p(m.goal)}<h3>Prepara quello che ti serve</h3>${list(m.materials)}<p class="hint">Segui la guida sul tuo compito. Apri un aiuto quando serve: non devi ricordare tutto prima di iniziare.</p>`;break;
 case 1:body=m.techniques.map(t=>`<section class="task-step"><h3>${e(t.name)}</h3>${p(t.how)}<p class="small"><strong>Ti serve per:</strong> ${e(t.why)}</p></section>`).join('');break;
 case 2:body=`<h3>La consegna dell’esempio</h3><div class="example">${e(m.example.task)}</div><h3>Ecco i passaggi</h3>${list(m.example.work,true)}<details><summary>Mostra il confronto</summary><div class="result">${p(m.example.result)}</div></details><p class="hint">L’esempio è inventato per mostrare il metodo. Cerca il motivo dei passaggi, non solo la risposta.</p>`;break;
 case 3:body=m.steps.map((s,i)=>`<section class="task-step"><h3>${i+1}. ${e(s.title)}</h3>${p(s.do)}<details><summary>Mostra un aiuto</summary>${p(s.help)}</details></section>`).join('');break;
 case 4:body=`<p>Prova questo piccolo compito diverso dall’esempio. Mantieni gli strumenti che ti servono e consulta meno suggerimenti, se puoi.</p><div class="example">${e(m.transfer.task)}</div><details><summary>Mostra il confronto</summary>${p(m.transfer.check)}</details><p class="hint">Se resti fermo, torna al passaggio corrispondente in «Proviamo sul tuo compito».</p>`;break;
 case 5:body=`<h3>Guarda il tuo lavoro</h3>${list(m.checks)}<details><summary>Un errore da riconoscere</summary><p><strong>Esempio:</strong> ${e(m.error.wrong)}</p><p><strong>Perché:</strong> ${e(m.error.why)}</p><p><strong>Come correggerlo:</strong> ${e(m.error.fix)}</p></details><p class="hint">Andare avanti nella guida non significa aver imparato: controlla che cosa riesci a fare sul foglio.</p>`;break;
 case 6:body=`${list(m.home,true)}<p>Puoi stampare una scheda con il metodo e gli aiuti che hai scelto. Per ritrovarlo, scrivi <strong>${e(m.id)}</strong> in «Ritrova un percorso».</p>${btn('Prepara scheda per casa','print-method','','primary')}`;break;
 }
 main.innerHTML=`<header class="guide-heading"><div><p class="tag">Il metodo da provare</p><h1>${e(m.title)}</h1><p class="small">${e(m.subjectName)} / ${e(m.area)}</p></div><span class="code">${e(m.id)}</span></header><div class="guide-layout"><nav class="phases" aria-label="Passaggi del metodo">${PHASES.map((t,i)=>`<button data-action="phase" data-value="${i}" ${i===state.phase?'aria-current="step"':''}><span class="stepnum">${i+1}</span><span>${e(t)}</span></button>`).join('')}</nav><div><article class="content-card"><p class="section-overline">Passaggio ${state.phase+1} di 7</p><h2>${PHASES[state.phase]}</h2>${body}<div class="nav-actions">${btn('Indietro','previous','','',state.phase===0?'disabled':'')}${btn('Avanti','next','','primary',state.phase===6?'disabled':'')}</div></article>${supports(m)}${coach(m)}${state.phase!==6?`<div class="print-action">${btn('Prepara scheda per casa','print-method')}</div>`:''}</div></div>`;
}
function supports(m){return `<details id="supports"><summary>Se un passaggio è faticoso</summary><p class="hint">Scegli gli aiuti utili adesso. Li ritroverai nella scheda stampata. Le scelte si azzerano quando cambi metodo o chiudi il file.</p>${m.adaptations.map((a,i)=>`<section class="support"><label><input type="checkbox" data-support="${i}" ${state.selected.has(i)?'checked':''}>${e(a.difficulty)}</label><p class="small">Nel passaggio: ${e(a.stage)}</p><p><strong>Puoi provare:</strong> ${e(a.aid)}</p><p><strong>Continui ad allenare:</strong> ${e(a.preserve)}</p><p><strong>Guarda se ti aiuta:</strong> ${e(a.verify)}</p></section>`).join('')}</details>`;}
function sourcesHTML(ids){return `<ul class="sources">${[...new Set(ids)].map(id=>{const s=DATA.sources[id];return s?`<li><a href="${e(s.url)}" target="_blank" rel="noopener noreferrer">${e(s.title)}</a><small>${e(s.kind)} · ${e(s.note)}</small></li>`:`<li>Riferimento da verificare: ${e(id)}</li>`;}).join('')}</ul>`;}
function coach(m){return `<details id="coach"><summary>Per chi ti accompagna</summary><p>${e(m.coach)}</p><p class="small">Le categorie aiutano a consultare le possibilità; non diagnosticano, non assegnano metodi e non escludono attività. «Trasversale» indica una difficoltà che non va attribuita automaticamente a un DSA.</p><div class="chips" role="group" aria-label="Consulta adattamenti per categoria">${['tutte','dislessia','disortografia','disgrafia','discalculia','trasversale'].map(c=>btn(c==='tutte'?'Tutte':c[0].toUpperCase()+c.slice(1),'category',c,'',`aria-pressed="${state.category===c}"`)).join('')}</div><div id="coach-adaptations">${coachAdaptations(m)}</div><h3>Da dove vengono le indicazioni</h3><p class="small">Le fonti sostengono principi generali. Questa guida, gli esempi e gli adattamenti al compito sono elaborazioni editoriali originali; non costituiscono un protocollo clinico validato.</p>${sourcesHTML(m.sources)}<p class="small">La prova con meno aiuto riduce i suggerimenti didattici, non gli strumenti compensativi necessari.</p></details>`;}
function coachAdaptations(m){const selected=m.adaptations.filter(a=>state.category==='tutte'||a.categories.includes(state.category));return selected.length?selected.map(a=>`<section class="coach-record"><p>${a.categories.map(c=>`<span class="pill">${e(c)}</span>`).join('')}</p><h3>${e(a.stage)}</h3><p><strong>Osservare:</strong> ${e(a.signal)}</p><p><strong>Adattare:</strong> ${e(a.aid)}</p><p><strong>Conservare:</strong> ${e(a.preserve)}</p><p><strong>Verificare:</strong> ${e(a.verify)}</p></section>`).join(''):'<p>Questa guida non propone un adattamento specifico per la categoria selezionata. Consulta le difficoltà osservate; non significa che il compito sia sempre facile o difficile.</p>';}
function renderMaps(){
 if(!state.mapType){main.innerHTML=`<p class="tag">Laboratorio delle mappe</p><h1>Quale mappa vuoi imparare?</h1><p class="intro">Due modi di organizzare le idee. Guarda l’esempio e costruisci la tua mappa su carta.</p><div class="choices activities">${card('Mappa concettuale','Collega concetti con parole-legame: ogni collegamento diventa una frase.','map-type','concettuale')}${card('Mappa mentale','Parti da un tema centrale e organizza parole chiave in rami e sottorami.','map-type','mentale')}</div><details><summary>Una mappa serve sempre?</summary><p>No. Per una successione può essere più chiara una linea del tempo; per un confronto una tabella; per una procedura una sequenza di passi. Scegli in base al compito.</p></details>`;return;}
 if(!state.mapSubject){main.innerHTML=`<p class="tag">Mappa ${e(state.mapType)}</p><h1>Scegli una materia</h1><p class="intro">Ogni esempio contiene un testo iniziale, una mappa completa e i passaggi per costruirla.</p><div class="choices">${unique(MAPS.filter(x=>x.type===state.mapType),'subject').map(m=>card(m.subject,m.subject==='Seconda lingua comunitaria'?'Francese, spagnolo e tedesco':m.topic,'map-subject',m.subject)).join('')}</div>`;return;}
 if(!state.map){const choices=MAPS.filter(x=>x.type===state.mapType&&x.subject===state.mapSubject);main.innerHTML=`<h1>Scegli la lingua</h1><div class="choices">${choices.map(m=>card(m.language,m.topic,'map',m.id)).join('')}</div>`;return;}
 const m=MAPS.find(x=>x.id===state.map);
 main.innerHTML=`<header class="guide-heading"><div><p class="tag">Mappa ${e(m.type)} · ${e(m.subject)}</p><h1>${e(m.topic)}</h1></div><span class="code">${e(m.id)}</span></header><details open><summary>Leggi il materiale di partenza</summary><div class="source-text">${p(m.sourceText)}</div><p class="small">Testo originale per l’esercizio. ${m.type==='concettuale'?'Domanda: '+e(m.question):'Obiettivo: organizzare il tema in rami e sottorami.'}</p></details><div class="inline-actions">${btn('Mappa completa','map-full','','',`aria-pressed="${state.full}"`)}${btn('Costruzione passo passo','map-build','','',`aria-pressed="${!state.full}"`)}</div><div class="map-layout"><section class="map-panel"><h2>${state.full?'L’esempio completo':'La mappa prende forma'}</h2>${mapSVG(m)}<div class="map-outline-auto">${mapOutline(m)}</div><details><summary>Leggi la mappa come elenco</summary>${mapOutline(m)}</details><p class="small">Seleziona un nodo o un passaggio per leggere la spiegazione. I numeri ritrovano gli stessi elementi sul foglio.</p></section><aside class="map-panel" aria-label="Istruzioni di costruzione"><div id="map-instruction" class="map-instruction">${mapInstruction(m)}</div><div class="map-step-buttons">${m.instructions.map((s,i)=>btn(s.title,'map-step',i,'',`aria-pressed="${state.mapStep===i}"`)).join('')}</div><div class="nav-actions">${btn('Passaggio precedente','map-prev','','',state.mapStep===0?'disabled':'')}${btn('Passaggio successivo','map-next','','primary',state.mapStep===5?'disabled':'')}</div></aside></div><section class="content-card map-section"><h2>Adesso costruisci sul foglio</h2><h3>Prima, con una traccia</h3>${p(m.scaffold)}${btn('Prepara traccia da completare','print-scaffold')}<h3 class="support-title">Poi, un compito nuovo</h3>${p(m.transfer)}<details><summary>Mostra il confronto</summary>${p(m.transferCheck)}</details><h3>Controlla la tua mappa</h3>${list(m.checks)}<details><summary>Un errore da riconoscere</summary>${p(m.error)}</details><div class="inline-actions">${btn('Prepara esempio di mappa','print-map','','primary')}</div></section><details><summary>Se costruire la mappa è faticoso</summary><p>Leggi o ascolta il testo a piccoli blocchi. Puoi usare parole già stampate, scrivere meno o far trascrivere ciò che dici: continui a scegliere e spiegare i collegamenti. Usa numeri oltre ai colori. Copri i rami su cui non stai lavorando. Mantieni gli strumenti compensativi che ti servono.</p><p>Controlla se l’aiuto ti permette di spiegare la relazione o il raggruppamento. Una mappa bella non è necessariamente una mappa compresa.</p></details><details><summary>Per chi ti accompagna</summary><p>Mostrare una decisione alla volta, chiedere il motivo e passare a un contenuto nuovo. Per dislessia valutare l’accesso al testo; per disgrafia alleggerire la trascrizione; per disortografia separare organizzazione e revisione; in presenza di difficoltà numeriche sostenere la lettura di dati e simboli. Sono possibilità da verificare nella persona, non associazioni automatiche.</p><p>Gli esempi e la progressione sono adattamenti editoriali originali. Non attribuire pari evidenza a tutte le forme di mappa.</p>${sourcesHTML(m.sources)}</details>`;
}
function mapInstruction(m){const s=m.instructions[state.mapStep];return `<h3>${e(s.title)}</h3>${p(s.text)}<p class="small">Riferimenti: ${s.nodes.map(id=>Number(id.slice(1))+1).join(', ')}.</p>`;}
function shownNode(n){return state.full||state.mapStep===5||n.id==='n0'||n.branch<=state.mapStep;}
function mapOutline(m){return `<ul class="map-text">${m.edges.filter(x=>shownNode(m.nodes.find(n=>n.id===x.to))).map(x=>{const a=m.nodes.find(n=>n.id===x.from),b=m.nodes.find(n=>n.id===x.to);return `<li>${btn(`${Number(a.id.slice(1))+1}. ${a.label} ${x.label||'→'} ${Number(b.id.slice(1))+1}. ${b.label}`,'map-node',b.id)}</li>`;}).join('')}</ul>`;}
function wrapWords(text,max=18){const words=text.split(' '),lines=[];let line='';for(const w of words){if(line&&(`${line} ${w}`).length>max){lines.push(line);line=w;}else line+=`${line?' ':''}${w}`;}if(line)lines.push(line);return lines;}
function mapSVG(m,{print=false,scaffold=false}={}){
 const positions=m.type==='concettuale'?{n0:[500,66],n1:[130,290],n2:[130,526],n3:[375,290],n4:[375,526],n5:[625,290],n6:[625,526],n7:[870,290],n8:[870,526]}:{n0:[500,315],n1:[245,163],n2:[140,50],n3:[755,163],n4:[860,50],n5:[245,468],n6:[140,580],n7:[755,468],n8:[860,580]};
 const width=215,height=m.type==='concettuale'?112:92;const selected=new Set(m.instructions[state.mapStep].nodes);
 const visible=n=>print||shownNode(n);
 let svg=`<svg class="map-visual ${print?'':'responsive-graphic'}" viewBox="0 0 1000 645" role="group" aria-label="Mappa ${e(m.type)}: ${e(m.topic)}"><defs><marker id="arrow-${e(m.id)}${print?'-p':''}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#738c80"/></marker></defs>`;
 for(const edge of m.edges){const target=m.nodes.find(n=>n.id===edge.to);if(!visible(target))continue;let [x1,y1]=positions[edge.from],[x2,y2]=positions[edge.to];
  if(m.type==='concettuale'){y1+=height/2;y2-=height/2;const route=edge.from==='n0'?`M${x1},${y1} L${x1},${y1+30} L${x2},${y1+30} L${x2},${y2}`:`M${x1},${y1} L${x2},${y2}`;svg+=`<g class="map-edge"><path d="${route}" marker-end="url(#arrow-${e(m.id)}${print?'-p':''})"/>`;const lx=x2,ly=(y1+y2)/2+9;const label=scaffold&&edge.id!=='e0'?'…':edge.label;const lines=wrapWords(label,23);svg+=`<rect x="${lx-111}" y="${ly-15}" width="222" height="${lines.length*22+6}" rx="4"/><text text-anchor="middle">${lines.map((line,i)=>`<tspan x="${lx}" y="${ly+3+i*22}">${e(line)}</tspan>`).join('')}</text></g>`;
  }else{svg+=`<g class="map-edge"><path d="M${x1},${y1} Q${x2},${y1} ${x2},${y2}"/></g>`;}
 }
 for(const n of m.nodes){if(!visible(n))continue;const[x,y]=positions[n.id],blank=scaffold&&!['n0','n1'].includes(n.id),label=blank?'…':n.label,lines=wrapWords(label,18);svg+=`<g class="map-node ${n.id==='n0'?'root':''} ${!print&&selected.has(n.id)?'selected':''}" ${print?'':`role="button" tabindex="0" data-action="map-node" data-value="${n.id}" data-map-node="${n.id}" aria-label="${Number(n.id.slice(1))+1}. ${e(label)}"`}><rect x="${x-width/2}" y="${y-height/2}" width="${width}" height="${height}" rx="12"/><text class="node-id" x="${x-width/2+9}" y="${y-height/2+20}">${Number(n.id.slice(1))+1}</text><text text-anchor="middle">${lines.map((s,i)=>`<tspan x="${x}" y="${y-((lines.length-1)*24)/2+9+i*24}">${e(s)}</tspan>`).join('')}</text></g>`;}
 return svg+'</svg>';
}
function renderAbout(){main.innerHTML=`<p class="tag">Come usare questo strumento</p><h1>Un aiuto per imparare il metodo.</h1><p>Porta il compito e scegli il percorso. Puoi guardare un esempio, provare sul foglio e consultare gli aiuti. La prima volta, lavora con chi ti accompagna; poi riprendi la scheda a casa.</p><h2>Funziona senza rete</h2><p>Questo file contiene tutto il necessario. Puoi copiarlo da solo su un altro computer. I collegamenti alle fonti sono facoltativi e richiedono Internet.</p><h2>Le tue scelte</h2><p>Non vengono salvati nomi, diagnosi o progressi. Gli aiuti selezionati servono alla scheda stampata e si azzerano alla chiusura, al ricaricamento o al cambio di metodo. L’ingrandimento A+ vale per questa apertura.</p><h2>Una guida educativa, da adattare</h2><p>Ci sono ${INVENTORY.length} attività e ${MAPS.length} esempi di mappe. Le sequenze, gli esempi e gli adattamenti sono proposte editoriali: le fonti non validano automaticamente ogni guida. Il completamento dei passaggi non è una valutazione dell’apprendimento e lo strumento non formula diagnosi.</p><p>La scelta degli strumenti dipende dal compito e dalla persona. Non togliere uno strumento necessario per dimostrare autonomia. Per attività motorie, strumentali ed esperimenti segui le indicazioni dell’insegnante; la guida aiuta a organizzare il lavoro.</p><h2>Fonti e riferimenti</h2>${sourcesHTML(Object.keys(DATA.sources))}<p class="small">Versione 1 · 8 ottobre 2026. Gli argomenti delle mappe sono proposte introduttive, non una sequenza obbligatoria per tutte le scuole.</p>`;}
function showPrint(kind){printReturn=document.activeElement;let text='';
 if(kind==='method'){const m=methodData();text=`<header><p>METODO DI STUDIO DSA · SCHEDA PER CASA</p><h1>${e(m.title)}</h1><p>${e(m.subjectName)} / ${e(m.area)} · <strong>${e(m.id)}</strong></p></header><section><h2>Il risultato da raggiungere</h2>${p(m.goal)}<p><strong>Materiali:</strong> ${e(m.materials.join('; '))}</p></section><section><h2>Il mio metodo</h2>${m.steps.map((s,i)=>`<h3>${i+1}. ${e(s.title)}</h3>${p(s.do)}`).join('')}</section><section><h2>Gli aiuti scelti</h2>${state.selected.size?list([...state.selected].sort((a,b)=>a-b).map(i=>`${m.adaptations[i].difficulty}: ${m.adaptations[i].aid} Controllo: ${m.adaptations[i].verify}`)):'<p>Nessun aiuto selezionato nella guida. Mantieni comunque gli strumenti che ti servono.</p>'}</section><section><h2>Controllo il lavoro</h2>${list(m.checks)}<h2>Quando riprendo a casa</h2>${list(m.home,true)}</section><p><strong>Per riaprire:</strong> apri l’HTML e scrivi ${e(m.id)} in «Ritrova un percorso». Non è una certificazione di apprendimento.</p>`;
 }else{const m=MAPS.find(x=>x.id===state.map),scaffold=kind==='scaffold';text=`<header><p>METODO DI STUDIO DSA · MAPPA ${e(m.type.toUpperCase())}</p><h1>${e(m.topic)}${scaffold?' · traccia':''}</h1><p>${e(m.subject)} · ${e(m.id)}</p></header><section><h2>Materiale di partenza</h2>${p(m.sourceText)}<p>${e(m.type==='concettuale'?m.question:'Organizza il tema centrale in rami e sottorami.')}</p>${mapSVG(m,{print:true,scaffold})}</section><section><h2>${scaffold?'Completa sul foglio':'Come costruirla'}</h2>${scaffold?p(m.scaffold)+`<div class="paper-lines"></div>`:m.instructions.map(s=>`<h3>${e(s.title)}</h3>${p(s.text)}`).join('')}<h2>Un compito nuovo</h2>${p(m.transfer)}<h2>Controlla</h2>${list(m.checks)}${scaffold?'':`<h2>Un errore da riconoscere</h2>${p(m.error)}`}</section><p>Ritrova questo esempio con il codice ${e(m.id)}. Mantieni gli strumenti compensativi necessari.</p>`;}
 document.getElementById('print-sheet').innerHTML=text;document.getElementById('app').hidden=true;document.getElementById('preview').hidden=false;document.querySelector('[data-action="print"]').focus();window.scrollTo(0,0);
}
function openMethod(id){const row=INVENTORY.find(x=>x.id===id);if(!row)return;clearMethod();Object.assign(state,{mode:'tasks',subject:row.subject,area:row.area,method:id});render();}
function openMap(id){const m=MAPS.find(x=>x.id===id);if(!m)return;clearMethod();Object.assign(state,{mode:'maps',mapType:m.type,mapSubject:m.subject,map:id,mapStep:0,full:true});render();}
function action(name,value){switch(name){
 case 'home':reset();break;
 case 'tasks':reset();state.mode='tasks';break;
 case 'subject':clearMethod();Object.assign(state,{mode:'tasks',subject:value,area:null});break;
 case 'area':clearMethod();state.area=value;break;
 case 'method':openMethod(value);return;
 case 'phase':state.phase=Number(value);break;
 case 'previous':state.phase=Math.max(0,state.phase-1);break;
 case 'next':state.phase=Math.min(6,state.phase+1);break;
 case 'maps':reset();state.mode='maps';break;
 case 'map-type':Object.assign(state,{mode:'maps',mapType:value,mapSubject:null,map:null,mapStep:0,full:true});break;
 case 'map-subject':{state.mapSubject=value;const choices=MAPS.filter(x=>x.type===state.mapType&&x.subject===value);state.map=null;if(choices.length===1){openMap(choices[0].id);return;}break;}
 case 'map':openMap(value);return;
 case 'map-full':state.full=true;break;
 case 'map-build':state.full=false;state.mapStep=0;break;
 case 'map-step':state.mapStep=Number(value);break;
 case 'map-next':state.mapStep=Math.min(5,state.mapStep+1);break;
 case 'map-prev':state.mapStep=Math.max(0,state.mapStep-1);break;
 case 'map-node':{const m=MAPS.find(x=>x.id===state.map);state.mapStep=value==='n0'?0:m.nodes.find(x=>x.id===value).branch;break;}
 case 'category':{state.category=value;document.querySelectorAll('[data-action="category"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===value)));document.getElementById('coach-adaptations').innerHTML=coachAdaptations(methodData());return;}
 case 'about':state.mode='about';break;
 case 'size':state.large=!state.large;document.documentElement.style.fontSize=state.large?'22px':'';document.getElementById('size-button').textContent=state.large?'A−':'A+';document.getElementById('size-button').setAttribute('aria-label',state.large?'Ripristina dimensione testo':'Ingrandisci testo');return;
 case 'print-method':showPrint('method');return;
 case 'print-map':showPrint('map');return;
 case 'print-scaffold':showPrint('scaffold');return;
 case 'close-print':document.getElementById('preview').hidden=true;document.getElementById('app').hidden=false;if(printReturn?.isConnected)printReturn.focus();return;
 case 'print':window.print();return;
 default:return;
 }
 const isMapStep=['map-full','map-build','map-step','map-next','map-prev','map-node'].includes(name);
 const isMethodStep=['phase','previous','next'].includes(name);
 render(!(isMapStep||isMethodStep));
 if(isMapStep||isMethodStep){const target=main.querySelector(isMapStep?'#map-instruction':'.content-card h2');if(target){target.setAttribute('tabindex','-1');target.focus({preventScroll:true});target.scrollIntoView({block:'nearest',behavior:'instant'});}}
}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action]');if(b&&!b.disabled)action(b.dataset.action,b.dataset.value);});
document.addEventListener('keydown',ev=>{if(ev.target.matches('g[data-map-node]')&&['Enter',' '].includes(ev.key)){ev.preventDefault();action('map-node',ev.target.dataset.value);}});
document.addEventListener('change',ev=>{if(ev.target.matches('[data-support]')){const i=Number(ev.target.dataset.support);if(ev.target.checked)state.selected.add(i);else state.selected.delete(i);}});
document.getElementById('lookup-form').addEventListener('submit',ev=>{ev.preventDefault();const code=document.getElementById('code').value.trim().toUpperCase(),status=document.getElementById('lookup-status');if(METHODS.has(code)){status.textContent='';document.getElementById('lookup').open=false;openMethod(code);}else if(MAPS.some(x=>x.id===code)){status.textContent='';document.getElementById('lookup').open=false;openMap(code);}else{status.textContent='Codice non trovato. Controlla lettere, numeri e trattino sulla scheda.';document.getElementById('code').focus();}});
render(false);

</script></body></html>
