sclusione proposta. Frase: «Non condivido questa esclusione; organizziamo un gruppo in cui possa partecipare». Coinvolgere docente/adulto di riferimento senza diffondere il messaggio."},"checks":["Sono descritti comportamenti osservabili.","La risposta evita ritorsioni.","È indicato un adulto di riferimento."],"error":{"wrong":"Lo insulto anch'io così capisce.","why":"Ripete il comportamento dannoso e può aumentare il conflitto.","fix":"Usa una frase sul comportamento e segnala i fatti all'adulto."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Scrivere la risposta","difficulty":"Non trovo le parole quando il caso mi agita.","categories":["trasversale"],"signal":"Resta bloccato o scrive soltanto un insulto di risposta.","aid":"Offri la struttura fatto–richiesta–adulto; usa casi inventati e permetti di non raccontare esperienze proprie.","preserve":"Riconoscere un comportamento irrispettoso e formulare una risposta che coinvolga un adulto.","verify":"Confronta due tentativi con lo stesso criterio: Sono descritti comportamenti osservabili. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M17-03","goal":"Confrontare due posizioni e motivare una proposta che consideri un'obiezione.","materials":["Carta con due posizioni"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Riscrivo A: spazio per giocare; B: spazio tranquillo.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: La proposta considera due bisogni.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Tema inventato: cortile in ricreazione. A propone tutta l'area per il gioco con palla; B vuole una zona tranquilla per parlare. Entrambi chiedono spazio. Formula una proposta e un'obiezione da affrontare.","work":["Riscrivo A: spazio per giocare; B: spazio tranquillo.","Propongo due zone delimitate e un passaggio libero.","Obiezione: cortile piccolo. Risposta possibile: alternare giorni o orari, dopo verifica con la scuola."],"result":"Proposta motivata con due bisogni e un limite: zone distinte se lo spazio consente, altrimenti turni concordati. Non pretendo di conoscere le misure reali."},"steps":[{"title":"Riscrivi le posizioni","do":"Nel tema assegnato riporta un motivo per ciascuna posizione senza caricature.","help":"Prima di rispondere, verifica di averla capita."},{"title":"Cerca criteri comuni","do":"Individua sicurezza, accesso o fattibilità pertinenti al tema.","help":"Una preferenza da sola non dimostra che l'altra proposta sia sbagliata."},{"title":"Argomenta e rivedi","do":"Proponi, motiva e rispondi a un'obiezione concreta.","help":"Se manca un dato, indica quale serve per decidere."}],"transfer":{"task":"Tema: biblioteca. A vuole lavorare in silenzio; B preparare un'esposizione a voce. Proponi una soluzione e un'obiezione.","check":"Proposta con entrambi i bisogni, per esempio orario o spazio dedicato all'orale; obiezione su spazio/tempo e risposta verificabile con docente o bibliotecario."},"checks":["Le due posizioni sono riconoscibili.","La proposta considera due bisogni.","L'obiezione riceve una risposta pertinente."],"error":{"wrong":"B è noioso, quindi scegliamo A.","why":"Attacca una persona senza affrontare la sua esigenza.","fix":"Descrivi la richiesta di tranquillità e cerca una soluzione compatibile."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Gestire il turno di discussione","difficulty":"Perdo il motivo mentre ascolto l'altro.","categories":["trasversale"],"signal":"Risponde senza riprendere ciò che l'altro ha detto.","aid":"Usa una carta motivo A/motivo B/proposta e una frase iniziale: ho capito che chiedi…","preserve":"Confrontare due posizioni e motivare una proposta che consideri un'obiezione.","verify":"Confronta due tentativi con lo stesso criterio: Le due posizioni sono riconoscibili. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M17-04","goal":"Valutare una notizia cercando autore, data, prove e conferme.","materials":["Due messaggi inventati e carta"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Controllo autore e data: A non li fornisce, B li fornisce nel caso.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: La conclusione rispetta ambito e tempo.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Messaggio A: «La scuola chiude domani», senza autore o data. B: avviso fittizio della segreteria, datato 10 marzo, «Il 12 marzo la biblioteca è chiusa per lavori; lezioni regolari». Valuta la notizia della chiusura scolastica.","work":["Controllo autore e data: A non li fornisce, B li fornisce nel caso.","Confronto il contenuto: B parla della biblioteca, non di tutta la scuola.","Non diffondo A come confermato; cerco un avviso ufficiale sulla scuola."],"result":"La chiusura di tutta la scuola non è confermata. B documenta solo biblioteca chiusa il 12 marzo e lezioni regolari; nel caso sono dati fittizi."},"steps":[{"title":"Identifica provenienza e data","do":"Per la ricerca annota chi pubblica, quando e con quale competenza.","help":"Una schermata inoltrata può perdere contesto."},{"title":"Controlla le prove","do":"Cerca dati, documento originale e limiti geografici o temporali.","help":"Molte condivisioni non sostituiscono una prova."},{"title":"Verifica una conferma","do":"Confronta con una fonte pertinente e aggiornata prima di concludere.","help":"Scrivi non confermato se la verifica manca."}],"transfer":{"task":"A: «Acqua non potabile nel quartiere», inoltrato senza data. B: avviso fittizio del gestore, 8 aprile, riguarda soltanto via Olmo dalle 9 alle 12. Che cosa sai e che cosa verifichi?","check":"Sai soltanto quanto riportato nel caso per via Olmo e orario; non generalizzi al quartiere. Per la vita reale consulta gli avvisi attuali del gestore, senza usare la scheda come indicazione sanitaria."},"checks":["Autore e data sono controllati.","La conclusione rispetta ambito e tempo.","Conferma e popolarità sono distinte."],"error":{"wrong":"La notizia è vera perché la condividono tutti.","why":"Il numero di inoltri non dimostra il contenuto.","fix":"Risalire all'avviso originale e confrontare il fatto preciso."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Confrontare le fonti","difficulty":"Le pagine lunghe mi fanno perdere la notizia.","categories":["dislessia"],"signal":"Confronta titoli ma non ambito o data.","aid":"Usa una tabella fatto/autore/data/ambito e lettura audio se utile; controlla una voce per volta.","preserve":"Valutare una notizia cercando autore, data, prove e conferme.","verify":"Confronta due tentativi con lo stesso criterio: Autore e data sono controllati. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M17-05","goal":"Preparare un messaggio digitale pertinente evitando dati personali superflui.","materials":["Carta; nessun invio richiesto"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Individuo lo scopo: chiedere il luogo della scheda.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: I dati superflui sono eliminati.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Devi scrivere al docente per chiedere dove trovare la scheda del compito. Bozza inventata: «Ciao, ecco indirizzo di casa, foto del mio documento e numero personale; mandami la scheda». Riscrivila senza dati inutili.","work":["Individuo lo scopo: chiedere il luogo della scheda.","Tolgo indirizzo, documento e numero personale perché non servono allo scopo.","Scrivo una richiesta con saluto, compito e ringraziamento."],"result":"«Buongiorno, non trovo la scheda del compito di scienze assegnato oggi. Può indicarmi dove consultarla? Grazie». Esempio su carta, senza invio."},"steps":[{"title":"Definisci destinatario e scopo","do":"Prima del messaggio assegnato scrivi a chi serve e che cosa deve ottenere.","help":"Un gruppo pubblico non equivale a una comunicazione della classe."},{"title":"Riduci i dati","do":"Togli informazioni che non servono e controlla eventuali dati di altre persone.","help":"Chiedi al docente prima di usare foto o contatti reali."},{"title":"Rileggi prima dell'invio","do":"Verifica chiarezza, tono e canale previsto dalla scuola.","help":"Qui prepara soltanto una bozza: non inserire dati personali reali."}],"transfer":{"task":"Bozza: «Nel gruppo pubblico metto la foto di tutti e i loro numeri per organizzare i libri». Riscrivi come proposta alla classe, senza pubblicare dati.","check":"«Proponiamo uno scambio di libri. Concordiamo con il docente un canale della classe e quali informazioni siano necessarie». Non pubblicare foto o numeri; per uso reale segui regole e canali scolastici."},"checks":["Il messaggio formula una richiesta chiara.","I dati superflui sono eliminati.","Destinatario e canale sono considerati."],"error":{"wrong":"Allego un documento per farmi riconoscere nel compito.","why":"Per questa richiesta il documento non è necessario.","fix":"Indica la scheda cercata senza allegare dati personali."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Revisionare il messaggio","difficulty":"Mi accorgo tardi degli errori nel testo.","categories":["disortografia"],"signal":"Il testo contiene parole fuori scopo o informazioni non necessarie.","aid":"Usa una checklist scopo/destinatario/dati/tono e correttore se scelto; non confondere ortografia e privacy.","preserve":"Preparare un messaggio digitale pertinente evitando dati personali superflui.","verify":"Confronta due tentativi con lo stesso criterio: Il messaggio formula una richiesta chiara. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M17-06","goal":"Confrontare consumi e spese con dati forniti e distinguere risparmio e sostenibilità.","materials":["Carta e calcolatrice se scelta"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Calcolo A: 8÷4=2 euro per quaderno; B: 10÷4=2,50.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Il budget è confrontato col costo totale.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Due confezioni inventate di quaderni: A, 4 quaderni a 8 euro con una busta di plastica; B, 4 quaderni a 10 euro senza busta. Servono 4 quaderni, budget 9 euro. Confronta costo e un aspetto ambientale senza decretare quale sia sempre migliore.","work":["Calcolo A: 8÷4=2 euro per quaderno; B: 10÷4=2,50.","A rientra nei 9 euro; B supera il budget di 1 euro.","B evita la busta, ma mancano dati su produzione e trasporto; non posso stimare l'intero impatto."],"result":"A soddisfa il budget, B evita una busta; costo e aspetto ambientale sono distinti. Possibile cercare alternative senza acquistare in questa prova."},"steps":[{"title":"Raccogli dati confrontabili","do":"Nel problema assegnato allinea quantità, costo totale, budget e dati sul consumo.","help":"Non confrontare confezioni di quantità diverse senza tenerne conto."},{"title":"Calcola e controlla","do":"Trova costo unitario o consumo con le unità corrette.","help":"Puoi usare la calcolatrice; verifica l'operazione scelta."},{"title":"Motiva una scelta limitata","do":"Spiega costo, bisogno e ciò che sai sull'ambiente.","help":"Dichiara i dati mancanti, evitando sempre ecologico."}],"transfer":{"task":"Due confezioni: C, 5 quaderni a 10 euro; D, 5 a 12,50. Servono 5 quaderni, budget 11 euro. D dichiara meno imballaggio. Confronta.","check":"C costa 2 euro per quaderno e rientra; D 2,50 e supera di 1,50. Meno imballaggio è un dato parziale, non una misura completa di sostenibilità."},"checks":["I costi unitari sono corretti.","Il budget è confrontato col costo totale.","Il dato ambientale non diventa una conclusione assoluta."],"error":{"wrong":"B costa 2 euro perché ha quattro quaderni.","why":"Dividere 10 per 4 dà 2,50.","fix":"Scrivi 10÷4 e verifica moltiplicando 2,50×4."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Calcolare il costo unitario","difficulty":"Scambio costo totale e prezzo di un pezzo.","categories":["discalculia"],"signal":"Scrive lo stesso valore per confezione e quaderno.","aid":"Tabella quantità/costo totale/costo unitario e calcolatrice scelta; controlla con la moltiplicazione.","preserve":"Confrontare consumi e spese con dati forniti e distinguere risparmio e sostenibilità.","verify":"Confronta due tentativi con lo stesso criterio: I costi unitari sono corretti. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M17-07","goal":"Creare un cartellone o una campagna con messaggio, azione e dato corretto.","materials":["Foglio e colori","Dati inventati forniti"],"techniques":[{"name":"Bozzetto e revisione","how":"Prepara una prima versione seguendo questo vincolo: L'azione è eseguibile e precisa.","why":"Permette di controllare le scelte prima del prodotto finale."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Il dato mantiene il suo ambito.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Campagna inventata della classe: in un controllo sono stati trovati 12 fogli utilizzabili su un solo lato. Prepara un cartellone che inviti a riutilizzarli per bozze, senza inventare un risparmio energetico.","work":["Scelgo titolo «Un lato ancora da usare».","Scrivo dato: nel nostro controllo 12 fogli avevano un lato libero.","Aggiungo azione: mettili nella vaschetta bozze se non contengono dati personali; disegno foglio e vaschetta."],"result":"Cartellone con titolo, dato limitato al controllo inventato, azione chiara e immagine pertinente; nessuna percentuale ambientale inventata."},"steps":[{"title":"Definisci pubblico e azione","do":"Per la campagna assegnata decidi chi legge e che cosa può fare.","help":"Una frase generica come salva il mondo non dice l'azione."},{"title":"Seleziona un dato verificato","do":"Riporta fonte e ambito del dato, anche se è un conteggio della classe.","help":"Non aggiungere percentuali per rendere il messaggio convincente."},{"title":"Adatta cartellone e messaggio","do":"Nel cartellone dai gerarchia a titolo, dato e azione; nel messaggio tieni le informazioni essenziali.","help":"Verifica il testo prima di decorare."}],"transfer":{"task":"Dati inventati: 8 libri disponibili per lo scambio in classe. Prepara un messaggio breve e un cartellone con dove e quando: aula 3, venerdì in ricreazione.","check":"Entrambi i formati indicano 8 libri, aula 3 e venerdì in ricreazione; invitano allo scambio senza promettere che tutti riceveranno un libro."},"checks":["L'azione è eseguibile e precisa.","Il dato mantiene il suo ambito.","Testo e immagine comunicano lo stesso messaggio."],"error":{"wrong":"Con 12 fogli salviamo il 50% degli alberi.","why":"Il dato non permette quella percentuale.","fix":"Usa il conteggio osservato senza stimare effetti non misurati."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Scrivere il cartellone","difficulty":"Gli errori nel titolo mi fanno riscrivere tutto.","categories":["disortografia"],"signal":"Continua a rifare il foglio per correggere una parola.","aid":"Prepara testo su foglio separato e usa correttore o copia verificata se scelti prima di riportarlo.","preserve":"Creare un cartellone o una campagna con messaggio, azione e dato corretto.","verify":"Confronta due tentativi con lo stesso criterio: L'azione è eseguibile e precisa. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M17-08","goal":"Progettare un'azione per scuola o territorio con ruoli, autorizzazione e verifica.","materials":["Carta per piano","Caso di progetto inventato"],"techniques":[{"name":"Scomposizione del compito","how":"Trasforma la consegna in azioni brevi: definisci bisogno e prodotto, distribuisci compiti e permessi, verifica e presenta.","why":"Fa vedere che cosa iniziare, che cosa completare e che cosa controllare."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Ruoli e tempi sono indicati.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Progetto inventato: manca un elenco dei libri della biblioteca di classe. Avete 20 libri e due incontri. Proponi un piano con chi conta, chi registra, chi controlla; nessuna attività esterna o contatto reale è richiesto.","work":["Obiettivo: elenco con titolo e numero dei 20 libri.","Incontro 1: due compagni contano, due registrano, docente concorda modalità; incontro 2: scambio dei ruoli e controllo.","Verifica: 20 righe, nessun titolo duplicato per errore e corrispondenza con i libri."],"result":"Piano in due incontri, ruoli ruotabili, accordo del docente e controllo 20 libri/20 registrazioni. Copie dello stesso titolo restano distinte come copie."},"steps":[{"title":"Definisci bisogno e prodotto","do":"Per il progetto assegnato descrivi il problema e un risultato controllabile.","help":"Scrivi come saprai che è concluso."},{"title":"Distribuisci compiti e permessi","do":"Assegna ruoli, tempi e responsabile per autorizzazioni scolastiche o del territorio.","help":"Una proposta non autorizza uscite o interventi sul luogo."},{"title":"Verifica e presenta","do":"Controlla prodotto e limiti, poi prepara una proposta al responsabile.","help":"Indica ciò che resta da decidere."}],"transfer":{"task":"Progetto inventato: mappare sei punti del cortile dove mancano cartelli. Pianifica osservazione accompagnata, raccolta su carta e proposta alla scuola.","check":"Piano con autorizzazione/accompagnamento, sei punti numerati, ruoli e proposta; verifica corrispondenza punto/descrizione. Nessuna installazione autonoma di cartelli."},"checks":["Il prodotto finale è verificabile.","Ruoli e tempi sono indicati.","Autorizzazioni necessarie sono distinte dalla proposta."],"error":{"wrong":"Incollo cartelli nel quartiere perché il progetto è utile.","why":"La proposta non dà il permesso di intervenire in luoghi reali.","fix":"Prepara la mappa e chiedi al responsabile di valutare l'intervento."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Gestire i ruoli","difficulty":"Dimentico il mio compito fra un incontro e l'altro.","categories":["trasversale"],"signal":"Il lavoro si interrompe perché nessuno sa chi deve controllare.","aid":"Usa una tabella ruolo/azione/scadenza e apri ogni incontro dalla propria riga.","preserve":"Progettare un'azione per scuola o territorio con ruoli, autorizzazione e verifica.","verify":"Confronta due tentativi con lo stesso criterio: Il prodotto finale è verificabile. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M18-01","goal":"Ricostruire un testo religioso distinguendo racconto e interpretazione.","materials":["Testo rielaborato fornito, carta e penna"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Ordino ferimento, passanti che proseguono, aiuto del samaritano, locanda.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Il significato è sostenuto da un passaggio.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Rielaborazione editoriale di Luca 10,25–37: un viaggiatore è ferito; due passanti proseguono; un samaritano si ferma, cura le ferite e affida l'uomo a una locanda. Domande: ordina gli eventi; quale gesto sostiene una lettura di cura del prossimo?","work":["Ordino ferimento, passanti che proseguono, aiuto del samaritano, locanda.","Individuo il gesto di fermarsi e assistere il ferito.","Distinguo il fatto narrato dalla lettura: il racconto può essere letto come invito alla cura del prossimo."],"result":"Quattro eventi in ordine; fermarsi e assistere sostiene l'interpretazione. È una rielaborazione, non una citazione integrale o una richiesta di adesione religiosa."},"steps":[{"title":"Identifica tipo e provenienza","do":"Nel testo assegnato registra libro/passaggio o autore del documento e se è originale o rielaborato.","help":"Un racconto biblico e un regolamento hanno forme diverse."},{"title":"Ricostruisci il contenuto","do":"Segna persone, azioni e ordine senza aggiungere intenzioni non dichiarate.","help":"Sottolinea il passaggio che sostiene la risposta."},{"title":"Motiva la lettura","do":"Formula un significato possibile e cita l'azione pertinente.","help":"La comprensione non richiede di dichiarare la tua fede."}],"transfer":{"task":"Documento didattico inventato di una comunità: «Nella raccolta comune ognuno offre ciò che può. Due persone distribuiscono il materiale secondo i bisogni». Riporta due azioni e un significato possibile.","check":"Azioni: offerta secondo possibilità e distribuzione secondo bisogni; possibile solidarietà motivata da queste azioni. Non attribuire il documento inventato a una religione reale."},"checks":["Gli eventi sono ordinati correttamente.","Il significato è sostenuto da un passaggio.","Rielaborazione e citazione sono distinte."],"error":{"wrong":"I due passanti curano il ferito.","why":"Nel testo proseguono; l'aiuto viene dal samaritano.","fix":"Riassegna ogni azione al suo personaggio."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Seguire il testo","difficulty":"Perdo chi compie l'azione.","categories":["dislessia"],"signal":"Attribuisce il gesto al personaggio della riga precedente.","aid":"Dividi il testo in eventi con nome e verbo; lettura audio disponibile se scelta.","preserve":"Ricostruire un testo religioso distinguendo racconto e interpretazione.","verify":"Confronta due tentativi con lo stesso criterio: Gli eventi sono ordinati correttamente. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M18-02","goal":"Collegare figura, evento, simbolo e festa usando dati documentati.","materials":["Scheda didattica fornita, carta"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Scrivo Sukkot nel campo festa e sette giorni nel campo durata.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Il significato rimanda alla fonte.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Scheda sintetica verificata su Chabad: Sukkot è una festa ebraica di sette giorni; la sukkah è una capanna temporanea collegata al ricordo delle dimore nel deserto. Compila festa, durata, oggetto e significato. Non presumere che ogni persona la celebri allo stesso modo.","work":["Scrivo Sukkot nel campo festa e sette giorni nel campo durata.","Metto sukkah/capanna nel campo oggetto, non nel campo persona.","Collego la capanna al ricordo delle dimore nel deserto, secondo la scheda."],"result":"Festa: Sukkot; durata: sette giorni; oggetto: sukkah; significato: ricordo delle dimore nel deserto. La scheda non nomina una figura individuale."},"steps":[{"title":"Separa i campi","do":"Nell'argomento assegnato distingue persona, evento, simbolo, luogo e festa.","help":"Non ogni testo fornisce tutti i campi."},{"title":"Collega al significato","do":"Per un simbolo o festa scrivi il significato indicato dalla fonte e la tradizione cui si riferisce.","help":"Non trasformare un simbolo in un significato universale."},{"title":"Recupera e verifica","do":"Copri due campi e ricostruisci le associazioni, poi controlla.","help":"Segna non fornito quando manca un'informazione."}],"transfer":{"task":"Scheda narrativa: nel racconto di Luca un samaritano assiste un viaggiatore ferito; la locanda è il luogo della cura. Compila figura, evento, luogo; è indicata una festa?","check":"Figura: samaritano; evento: assistenza al ferito; luogo: locanda. Nessuna festa indicata: non inventarla."},"checks":["Festa, oggetto e figura non sono confusi.","Il significato rimanda alla fonte.","I dati mancanti restano dichiarati."],"error":{"wrong":"Sukkah è il nome di una persona.","why":"La scheda la descrive come capanna.","fix":"Sposta sukkah nel campo oggetto e Sukkot nel campo festa."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Ricordare i termini","difficulty":"Scambio parole che si somigliano.","categories":["trasversale"],"signal":"Inverte Sukkot e sukkah pur distinguendo festa e oggetto a voce.","aid":"Usa due carte: nome con categoria e piccolo disegno; ripassa l'associazione, non solo l'ortografia.","preserve":"Collegare figura, evento, simbolo e festa usando dati documentati.","verify":"Confronta due tentativi con lo stesso criterio: Festa, oggetto e figura non sono confusi. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M18-03","goal":"Collegare un contenuto religioso a storia, arte e cultura distinguendo le fonti.","materials":["Due schede fornite, carta"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Trovo il gesto comune: fasciare e assistere un ferito.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Le date rimangono assegnate alla fonte corretta.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Scheda testuale: un samaritano aiuta un viaggiatore ferito nel racconto di Luca. Scheda di opera inventata: «La sosta», dipinta nel 1880, mostra una figura che fascia un ferito vicino a una locanda. Formula un collegamento e un limite storico.","work":["Trovo il gesto comune: fasciare e assistere un ferito.","Collego l'immagine al tema della cura presente nel racconto.","La data 1880 riguarda l'opera inventata, non l'evento narrato; l'immagine non prova che il fatto sia avvenuto in quell'anno."],"result":"Collegamento artistico/culturale basato sulla cura; 1880 è il contesto dell'opera. Il dipinto non è una fotografia del racconto."},"steps":[{"title":"Identifica le due fonti","do":"Per il collegamento assegnato scrivi testo, opera/oggetto e rispettive informazioni di contesto.","help":"Se una data manca, non sostituirla con quella dell'altra fonte."},{"title":"Trova un elemento comune","do":"Collega gesto, simbolo o tema con un dettaglio presente in entrambe.","help":"Una somiglianza va spiegata, non solo nominata."},{"title":"Dichiara il limite","do":"Spiega che cosa la fonte artistica rappresenta e che cosa non dimostra storicamente.","help":"Distingui tradizione, narrazione e data del manufatto."}],"transfer":{"task":"Scheda su Sukkot: capanna temporanea e ricordo delle dimore nel deserto. Scheda inventata di museo: modello di capanna costruito nel 2022 per un percorso didattico. Collega e distingui le date.","check":"Il modello rappresenta la capanna collegata alla festa; 2022 è la data del modello museale, non l'origine della tradizione."},"checks":["Il collegamento cita due dettagli.","Le date rimangono assegnate alla fonte corretta.","Rappresentazione e prova storica sono distinte."],"error":{"wrong":"Il racconto è ambientato nel 1880 perché il dipinto è del 1880.","why":"Confonde data del manufatto e tempo narrato.","fix":"Scrivi 1880 solo accanto all'opera."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Gestire due fonti","difficulty":"Confondo quale fonte dice una cosa.","categories":["trasversale"],"signal":"Attribuisce al testo un dato presente solo nella scheda del museo.","aid":"Usa due colonne con intestazione fonte; collega ogni dato alla propria colonna.","preserve":"Collegare un contenuto religioso a storia, arte e cultura distinguendo le fonti.","verify":"Confronta due tentativi con lo stesso criterio: Il collegamento cita due dettagli. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M18-04","goal":"Confrontare pratiche di tradizioni diverse senza appiattirle o generalizzare.","materials":["Due schede sintetiche, tabella"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: A: tradizione ebraica, capanna, durante Sukkot.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Ogni pratica resta nel suo contesto.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Scheda A verificata su Chabad: in Sukkot la sukkah è una capanna legata alla festa ebraica. Scheda B verificata su Islamic Relief: nel Ramadan l'iftar è il pasto che interrompe il digiuno dopo il tramonto. Confronta tradizione, pratica e momento usando solo questi dati.","work":["A: tradizione ebraica, capanna, durante Sukkot.","B: tradizione islamica, pasto di iftar, dopo il tramonto nel Ramadan.","Entrambe sono pratiche collegate a un periodo religioso; oggetto/pratica e momento differiscono. Le schede non descrivono tutti i fedeli."],"result":"Tabella corretta dei tre criteri; somiglianza limitata al legame con un periodo religioso; differenze esplicite tra capanna e pasto."},"steps":[{"title":"Usa criteri uguali","do":"Nel confronto assegnato prepara le stesse righe per entrambe le tradizioni.","help":"Non confrontare la festa di una tradizione con tutta l'altra religione."},{"title":"Riporta il contesto","do":"Attribuisci ogni pratica alla fonte e al periodo descritto.","help":"Evita tutti fanno così; la fonte può descrivere una pratica senza coprire ogni comunità."},{"title":"Formula somiglianza e differenza","do":"Scrivi una frase per ciascuna, con dati delle schede.","help":"Non valutare quale tradizione sia migliore."}],"transfer":{"task":"Confronta ancora A e B, ma rispondi: entrambe sono un pasto dopo il tramonto? Quale dato manca per confrontarne tutte le pratiche?","check":"No: B definisce l'iftar come pasto dopo il tramonto; A descrive la capanna. Mancano informazioni su altre pratiche e sulle differenze interne alle comunità."},"checks":["I criteri del confronto sono gli stessi.","Ogni pratica resta nel suo contesto.","La conclusione non riguarda automaticamente tutti i fedeli."],"error":{"wrong":"Sukkot e Ramadan sono la stessa festa.","why":"Condividono solo il generico legame con una tradizione religiosa.","fix":"Nomina separatamente festa/pratica e differenze documentate."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Confrontare termini nuovi","difficulty":"I nomi nuovi mi fanno perdere i dati.","categories":["dislessia"],"signal":"Associa iftar alla capanna o sukkah al pasto.","aid":"Usa glossario breve nome–tradizione–significato; lettura audio se scelta e una riga per pratica.","preserve":"Confrontare pratiche di tradizioni diverse senza appiattirle o generalizzare.","verify":"Confronta due tentativi con lo stesso criterio: I criteri del confronto sono gli stessi. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M18-05","goal":"Argomentare una questione etica distinguendo fatti, valori e domande aperte.","materials":["Caso inventato, carta"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Fatto: un compagno chiede di copiare.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: La proposta considera una conseguenza.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Caso: due compagni devono consegnare un lavoro. Uno chiede di copiare la parte dell'altro perché ha perso tempo. Domanda: come aiutarlo senza presentare come suo un lavoro altrui? Scrivi fatto, valore, proposta e domanda da chiarire.","work":["Fatto: un compagno chiede di copiare.","Valori in gioco: aiuto e correttezza nell'attribuire il lavoro.","Propongo di spiegare un passaggio e segnalare al docente ciò che manca; chiedo se è possibile recuperare una parte entro un nuovo termine."],"result":"Aiuto al procedimento senza attribuire all'altro la copia; richiesta al docente sui tempi. È una proposta motivata, non l'unica risposta o un giudizio sul valore della persona."},"steps":[{"title":"Descrivi il dilemma","do":"Nel tema assegnato indica fatti e due esigenze che possono entrare in tensione.","help":"Non inventare motivazioni interiori."},{"title":"Confronta le ragioni","do":"Spiega un valore e una conseguenza per due possibili azioni.","help":"Puoi confrontare prospettive religiose e non religiose senza dichiarare la tua appartenenza."},{"title":"Formula proposta e domanda","do":"Scrivi una scelta motivata e ciò che resta aperto sul significato.","help":"Valuta il ragionamento, non l'adesione a una fede."}],"transfer":{"task":"Caso: un gruppo trova un oggetto senza nome in classe e vorrebbe tenerlo. Formula una proposta e la domanda: che cosa significa rispettare ciò che non è nostro?","check":"Proposta: consegnare l'oggetto al docente o al punto concordato per gli oggetti trovati; motivazione legata al possibile proprietario; domanda di significato distinta dal fatto."},"checks":["Fatti e valutazioni sono distinti.","La proposta considera una conseguenza.","La domanda di significato non è scambiata per un fatto."],"error":{"wrong":"È una cattiva persona perché chiede di copiare.","why":"Giudica tutta la persona da un comportamento e non risolve il dilemma.","fix":"Descrivi la richiesta, spiega il problema e proponi un aiuto corretto."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Confrontare le ragioni","difficulty":"Mi blocco perché penso che ci sia una risposta personale obbligatoria.","categories":["trasversale"],"signal":"Evita il compito per timore di dover raccontare convinzioni private.","aid":"Usa soltanto il caso inventato e le colonne fatto/ragioni/proposta; consenti risposta orale.","preserve":"Argomentare una questione etica distinguendo fatti, valori e domande aperte.","verify":"Confronta due tentativi con lo stesso criterio: Fatti e valutazioni sono distinti. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M18-06","goal":"Trasformare una ricerca documentata in scheda, testo ed esposizione coerenti.","materials":["Due schede sintetiche già fornite, carta"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Scheda 1: racconto, gesto di aiuto; scheda 2: opera inventata, fasciare il ferito.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Scheda, testo e orale conservano gli stessi dati.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Dati per questa mini ricerca: racconto di Luca, samaritano che aiuta il ferito; opera inventata «La sosta», 1880, scena di assistenza. Domanda: come è rappresentata la cura? Produci scheda di due fonti, testo di tre frasi e scaletta orale.","work":["Scheda 1: racconto, gesto di aiuto; scheda 2: opera inventata, fasciare il ferito.","Testo: «Nel racconto il samaritano si ferma ad aiutare. Nell'opera inventata una figura fascia il ferito. Entrambi rappresentano la cura con azioni concrete».","Scaletta: fonti→gesti→collegamento; dichiaro inventata l'opera e rielaborato il testo."],"result":"Scheda con provenienza distinta, tre frasi complete e orale sugli stessi dati; nessuna biografia o data del racconto inventata."},"steps":[{"title":"Definisci domanda e fonti","do":"Nella ricerca assegnata scrivi che cosa vuoi capire e registra autore/titolo o provenienza.","help":"Una ricerca deve permettere di ritrovare la fonte."},{"title":"Adatta i quattro formati","do":"Nella scheda usa campi; nella ricerca seleziona prove; nel testo lega le frasi; nell'orale usa tre punti.","help":"I formati cambiano, i dati verificati restano gli stessi."},{"title":"Controlla attribuzioni","do":"Confronta ogni affermazione con la fonte prima di presentare.","help":"Distingui sintesi personale, citazione ed esempio inventato."}],"transfer":{"task":"Usa scheda Sukkot/capanna e modello museale inventato del 2022: fai due schede, tre frasi e tre parole guida per spiegare il collegamento.","check":"Schede distinguono tradizione e modello; testo collega capanna e rappresentazione; 2022 riguarda il modello. Parole guida possibili: festa–capanna–modello."},"checks":["La provenienza di entrambe le fonti è indicata.","Scheda, testo e orale conservano gli stessi dati.","I dati non forniti non sono aggiunti."],"error":{"wrong":"Nel testo attribuisco il 1880 al racconto di Luca.","why":"È la data dell'opera inventata.","fix":"Rileggi la scheda fonte e correggi l'attribuzione."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Scrivere la sintesi","difficulty":"Gli errori di scrittura nascondono quello che so.","categories":["disortografia"],"signal":"La spiegazione orale è coerente ma la bozza ha parole mancanti o forme errate.","aid":"Prepara tre frasi con parole guida e usa correttore o dettatura scelti; rivedi le attribuzioni separatamente dall'ortografia.","preserve":"Trasformare una ricerca documentata in scheda, testo ed esposizione coerenti.","verify":"Confronta due tentativi con lo stesso criterio: La provenienza di entrambe le fonti è indicata. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M18-07","goal":"Comprendere una lettura delle attività alternative con prove nel testo.","materials":["Racconto originale e carta"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Problema: mancavano due pennelli.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Ogni risposta usa un dettaglio.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Testo originale: «Al laboratorio mancavano due pennelli. Mina propose di alternarsi. Omar preparò intanto i colori. Dopo dieci minuti scambiarono i compiti e finirono entrambi». Domande: qual era il problema, quale soluzione usarono, da che cosa capisci la collaborazione?","work":["Problema: mancavano due pennelli.","Soluzione: turni e un compito alternativo di preparazione.","Prova: scambiarono i compiti e finirono entrambi."],"result":"Risposte complete con dati del testo; collaborazione motivata da turni, preparazione e scambio."},"steps":[{"title":"Leggi per una domanda","do":"Sul testo assegnato cerca prima problema e azioni.","help":"Leggi una breve parte e fermati a dirne il senso."},{"title":"Trova la prova","do":"Per ogni risposta indica la frase che la sostiene.","help":"Una qualità dei personaggi non presente nel testo resta un'ipotesi."},{"title":"Rispondi con una frase","do":"Unisci risposta e dettaglio, poi rileggi la domanda.","help":"Evita di copiare tutto il racconto."}],"transfer":{"task":"Testo originale: «Il gruppo aveva un solo atlante. Leo cercò i nomi, Eva li scrisse e poi invertirono i ruoli». Spiega problema, soluzione e prova di collaborazione.","check":"Un solo atlante; ricerca e scrittura distribuite; inversione dei ruoli come prova che entrambi partecipano."},"checks":["Problema e soluzione sono distinti.","Ogni risposta usa un dettaglio.","Non sono aggiunte intenzioni non documentate."],"error":{"wrong":"Omar non collabora perché non usa subito il pennello.","why":"Preparare i colori è un compito utile e il testo descrive lo scambio.","fix":"Cita la preparazione e l'inversione dei compiti."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Leggere il racconto","difficulty":"Perdo l'azione passando alla riga successiva.","categories":["dislessia"],"signal":"Ricorda i nomi ma non chi ha fatto che cosa.","aid":"Dividi in tre righe evento, con lettura audio se utile, e annota nome–azione.","preserve":"Comprendere una lettura delle attività alternative con prove nel testo.","verify":"Confronta due tentativi con lo stesso criterio: Problema e soluzione sono distinti. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M18-08","goal":"Discutere e scrivere una proposta nelle attività alternative considerando due ragioni.","materials":["Due posizioni inventate, carta"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Riformulo A: accesso facile; B: restituzione controllabile.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: La proposta è concreta.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Tema: scambio di materiali. A vuole prestare tutto subito; B chiede di segnare chi prende gli oggetti per ritrovarli. Discutilo con turni e scrivi una proposta di tre frasi.","work":["Riformulo A: accesso facile; B: restituzione controllabile.","Propongo prestito con un elenco semplice degli oggetti, senza dati personali in questa scheda.","Scrivo: «Prestiamo i materiali disponibili. Segniamo oggetto e restituzione nel modo concordato dal docente. Così facilitiamo l'uso e il recupero». "],"result":"Tre frasi che considerano accesso e restituzione; discussione con riformulazione delle due ragioni."},"steps":[{"title":"Ascolta e riformula","do":"Nella discussione assegnata ripeti il motivo dell'altro prima di rispondere.","help":"Usa chiedi… perché… e verifica se hai capito."},{"title":"Scegli una proposta","do":"Confronta due bisogni e trova una soluzione praticabile.","help":"Distingui accordo possibile e dato da verificare."},{"title":"Scrivi e revisiona","do":"Trasforma la proposta in tre frasi: scelta, modalità, motivo.","help":"Nel testo deve restare anche la ragione ascoltata."}],"transfer":{"task":"Tema: A vuole una locandina molto decorata, B vuole testo leggibile da lontano. Discuti e scrivi tre frasi di proposta.","check":"Riporta entrambe le ragioni; proposta con titolo leggibile e decorazioni che non coprono i dati; tre frasi pertinenti, senza attacco personale."},"checks":["Entrambe le posizioni sono riportate.","La proposta è concreta.","Le tre frasi spiegano scelta e motivo."],"error":{"wrong":"Scrivo B ha torto senza spiegare.","why":"Non affronta il bisogno di restituzione.","fix":"Riporta il motivo di B e integra una registrazione semplice."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Passare dall'orale al testo","difficulty":"So dirlo ma faccio fatica a scriverlo.","categories":["disgrafia"],"signal":"La proposta orale completa diventa una frase illeggibile o incompleta.","aid":"Usa tre caselle scelta/modo/motivo e dettatura o tastiera se scelte, mantenendo gli stessi contenuti.","preserve":"Discutere e scrivere una proposta nelle attività alternative considerando due ragioni.","verify":"Confronta due tentativi con lo stesso criterio: Entrambe le posizioni sono riportate. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M18-09","goal":"Preparare un progetto collaborativo con prodotto, ruoli e controllo finale.","materials":["Carta per piano e schede inventate"],"techniques":[{"name":"Scomposizione del compito","how":"Trasforma la consegna in azioni brevi: definisci il prodotto, distribuisci e ruota, controlla e presenta.","why":"Fa vedere che cosa iniziare, che cosa completare e che cosa controllare."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Tutti hanno un ruolo e una rotazione.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Progetto delle attività alternative: creare quattro cartoncini sul rispetto dei materiali condivisi. Ogni cartoncino deve contenere un'azione e un motivo; due incontri, tre compagni. Pianifica ruoli e una verifica.","work":["Prodotto: quattro cartoncini con azione e motivo.","Incontro 1: raccogliamo quattro azioni, una persona scrive, una disegna, una controlla; incontro 2 ruotiamo e rifiniamo.","Controllo: ogni cartoncino ha azione concreta e motivo, per esempio «Rimetti il righello nella scatola: chi viene dopo lo trova». "],"result":"Piano in due incontri e ruoli ruotabili; quattro cartoncini verificati su azione/motivo. Esempio completo del primo cartoncino."},"steps":[{"title":"Definisci il prodotto","do":"Nel progetto assegnato scrivi quantità e requisiti di ogni pezzo.","help":"Per contare il completamento serve sapere che cosa deve contenere."},{"title":"Distribuisci e ruota","do":"Assegna scrittura, immagini e controllo con un tempo concordato.","help":"Non assegnare sempre lo stesso ruolo in base a una diagnosi."},{"title":"Controlla e presenta","do":"Rivedi ogni prodotto e spiega come risponde al tema.","help":"Segna ciò che manca prima di decorare."}],"transfer":{"task":"Progetto: tre segnalibri con una frase sull'aiuto reciproco e un simbolo coerente. Pianifica due incontri e controlli.","check":"Tre segnalibri, ruoli distribuiti e ruotati, frase e simbolo pertinenti su ciascuno; esempio ammissibile: «Chiedi quale parte manca» con due mani che uniscono un foglio."},"checks":["Quantità e requisiti sono rispettati.","Tutti hanno un ruolo e una rotazione.","Il controllo usa azione/motivo o frase/simbolo."],"error":{"wrong":"Quattro disegni senza testo completano il progetto.","why":"Mancano azione e motivo richiesti.","fix":"Aggiungi per ogni disegno una frase che dica che cosa fare e perché."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Seguire le parti del progetto","difficulty":"Mi dimentico la parte da completare.","categories":["trasversale"],"signal":"Consegna un cartoncino con un requisito mancante.","aid":"Usa una tabella con una riga per pezzo e caselle azione/motivo/controllato.","preserve":"Preparare un progetto collaborativo con prodotto, ruoli e controllo finale.","verify":"Confronta due tentativi con lo stesso criterio: Quantità e requisiti sono rispettati. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M19-01","goal":"Preparare l'esecuzione controllando assetto, respiro e coordinazione secondo il proprio strumento.","materials":["Strumento assegnato e docente","Carta con tre controlli"],"techniques":[{"name":"Pratica per segmenti","how":"Prova prima il segmento indicato nell'esempio: Controllo sedia e posizione dello strumento con le indicazioni ricevute. Poi unisci i segmenti.","why":"Riduce il numero di azioni da gestire insieme; la precisione viene controllata prima di aumentare la velocità."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Il respiro non viene forzato dalla consegna.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Esempio per tastiera: il docente ha concordato sedia stabile, strumento raggiungibile comodamente e quattro attacchi sul do centrale. Prepara una checklist assetto–respiro–attacchi e conta 1–2–3–4 senza irrigidirti. Per fiati o archi assetto e respiro sono quelli insegnati dal docente, non quelli della tastiera.","work":["Controllo sedia e posizione dello strumento con le indicazioni ricevute.","Prima del via riconosco se sto trattenendo il respiro; non forzo inspirazioni.","Eseguo quattro do, uno per conteggio; controllo se il cambio di azione interrompe il tempo."],"result":"Checklist: assetto concordato, respiro non forzato, quattro attacchi regolari. La qualità della postura si osserva col docente e non si deduce dalla scheda."},"steps":[{"title":"Controlla l'assetto specifico","do":"Prima del brano portato usa le indicazioni del docente per seduta, appoggio o sostegno dello strumento.","help":"Non copiare la postura di uno strumento diverso."},{"title":"Prepara respiro e attacco","do":"Prova un ingresso breve col respiro insegnato per il tuo strumento.","help":"Per fiati concorda il punto di respiro; per tastiera o archi non inventare tecniche respiratorie."},{"title":"Osserva la coordinazione","do":"Esegui pochi suoni e descrivi dove compare tensione o interruzione.","help":"Chiedi una correzione specifica; interrompi e segnala un disagio al docente."}],"transfer":{"task":"Con assetto già concordato esegui do–re–do–re, uno per conteggio; indica quale dei tre controlli serve se il tempo si interrompe al cambio di nota.","check":"Quattro attacchi in ordine; il controllo pertinente è coordinazione/cambio, senza trascurare assetto e respiro. Se le note non sono accessibili sullo strumento, il docente adatta il registro."},"checks":["L'assetto segue il modello del proprio strumento.","Il respiro non viene forzato dalla consegna.","Gli attacchi rispettano i conteggi."],"error":{"wrong":"Uso per il flauto la stessa preparazione tecnica della tastiera.","why":"Sostegno, produzione del suono e respiro hanno richieste diverse.","fix":"Chiedi la dimostrazione dello strumento assegnato e aggiorna la checklist."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Preparare l'assetto","difficulty":"Mi dimentico un controllo prima di iniziare.","categories":["trasversale"],"signal":"Parte prima di sistemare uno dei punti concordati.","aid":"Usa tre simboli assetto/respiro/via; eventuali difficoltà motorie sono osservazioni trasversali, non conseguenze automatiche del DSA.","preserve":"Preparare l'esecuzione controllando assetto, respiro e coordinazione secondo il proprio strumento.","verify":"Confronta due tentativi con lo stesso criterio: L'assetto segue il modello del proprio strumento. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Concorda movimenti, tempo e tecnica con il docente della disciplina; non usare il risultato per dedurre un DSA o altre diagnosi.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M19-02","goal":"Studiare un passaggio tecnico isolando un cambio e verificando due criteri.","materials":["Strumento assegnato","Sequenza scritta e docente per posizioni"],"techniques":[{"name":"Pratica per segmenti","how":"Prova prima il segmento indicato nell'esempio: Provo lentamente re→mi per due conteggi con posizioni confermate. Poi unisci i segmenti.","why":"Riduce il numero di azioni da gestire insieme; la precisione viene controllata prima di aumentare la velocità."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Le note restano nell'ordine richiesto.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Sequenza originale: do–re–mi–re, un suono per conteggio. Il docente conferma registro e posizioni. Obiettivo tecnico: cambio re→mi senza pausa aggiunta e suono riconoscibile. Non serve accelerare.","work":["Provo lentamente re→mi per due conteggi con posizioni confermate.","Aggiungo do prima e re dopo, mantenendo quattro conteggi.","Controllo ordine delle note e assenza di pausa extra nel cambio; se manca uno, riprendo la coppia."],"result":"Quattro note do-re-mi-re, quattro attacchi regolari; il cambio re→mi è osservato separatamente dalla velocità."},"steps":[{"title":"Individua il cambio","do":"Nel passaggio assegnato cerchia le due note o azioni che interrompono l'esecuzione.","help":"Non ripetere l'intero brano se il problema è in una coppia."},{"title":"Prova lentamente","do":"Esegui il cambio con la tecnica mostrata: dita, arco o attacco secondo lo strumento.","help":"La scheda non prescrive diteggiature universali."},{"title":"Rimetti nel contesto","do":"Aggiungi una nota prima e una dopo e confronta due tentativi.","help":"Aumenta il tempo soltanto con i criteri concordati raggiunti."}],"transfer":{"task":"Sequenza mi–re–do–re, un suono per conteggio. Isola re→do e poi ricomponi.","check":"Quattro note nell'ordine, nessuna pausa aggiunta tra re e do; posizioni e qualità del suono controllate dal docente sullo strumento."},"checks":["Il cambio difficile è individuato.","Le note restano nell'ordine richiesto.","Non compare una pausa supplementare nel cambio."],"error":{"wrong":"Ripeto tutto velocemente sperando che il cambio migliori.","why":"Non isola il punto né permette di osservare la correzione.","fix":"Riprendi solo re→mi lentamente, poi aggiungi il contesto."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Osservare il cambio","difficulty":"Non capisco dove mi fermo.","categories":["trasversale"],"signal":"La stessa interruzione ricorre ma non sa indicarne le note.","aid":"Segna la coppia con una parentesi e ascolta un modello lento del docente; non attribuire il problema coordinativo al DSA.","preserve":"Studiare un passaggio tecnico isolando un cambio e verificando due criteri.","verify":"Confronta due tentativi con lo stesso criterio: Il cambio difficile è individuato. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Concorda movimenti, tempo e tecnica con il docente della disciplina; non usare il risultato per dedurre un DSA o altre diagnosi.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M19-03","goal":"Studiare un breve brano per frasi e collegarle mantenendo il tempo.","materials":["Strumento e docente","Mini brano originale scritto"],"techniques":[{"name":"Pratica per segmenti","how":"Prova prima il segmento indicato nell'esempio: Leggo la seconda misura: do-mi-re-do, quattro attacchi. Poi unisci i segmenti.","why":"Riduce il numero di azioni da gestire insieme; la precisione viene controllata prima di aumentare la velocità."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Il collegamento conserva la pulsazione.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Mini brano originale di due misure in 4/4; ogni nota vale un quarto: do re mi re | do mi re do. Il docente conferma registro e posizioni. Studia prima la seconda misura e poi il collegamento tra le due.","work":["Leggo la seconda misura: do-mi-re-do, quattro attacchi.","Provo lentamente il collegamento: ultimo re della prima→primo do della seconda.","Eseguo le otto note, con conteggio continuo e nessuna pausa alla stanghetta."],"result":"Otto note nell'ordine, due misure complete; collegamento re→do senza tempo aggiunto. Il tempo comodo è concordato."},"steps":[{"title":"Dividi il brano","do":"Nel brano assegnato segna frasi o brevi misure con inizio e fine.","help":"Scegli un blocco breve ma musicalmente riconoscibile."},{"title":"Studia e spiega il punto","do":"Prova il blocco meno sicuro e nomina note, ritmo e cambio.","help":"Se sbagli due volte nello stesso punto, restringi il segmento."},{"title":"Collega e riprendi","do":"Unisci i blocchi includendo il passaggio di confine; ripassa in giorni diversi.","help":"Una stanghetta non implica una pausa."}],"transfer":{"task":"Nuovo mini brano: mi re do re | mi do re mi, sempre quarti in 4/4. Studia il collegamento e suona tutto.","check":"Otto attacchi nell'ordine; collegamento re→mi fra le misure senza pausa; due gruppi di quattro conteggi."},"checks":["Entrambe le misure sono complete.","Il collegamento conserva la pulsazione.","La riprova riguarda il punto effettivamente difficile."],"error":{"wrong":"Mi fermo tra le due misure per preparare le dita.","why":"Aggiunge un tempo non scritto.","fix":"Prova ultimo suono della prima e primo della seconda come una coppia."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Seguire le misure","difficulty":"Perdo il punto passando alla misura dopo.","categories":["trasversale"],"signal":"Rientra alla prima misura o salta una nota dopo la stanghetta.","aid":"Metti le due misure sulla stessa riga con numeri e segno di collegamento.","preserve":"Studiare un breve brano per frasi e collegarle mantenendo il tempo.","verify":"Confronta due tentativi con lo stesso criterio: Entrambe le misure sono complete. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Concorda movimenti, tempo e tecnica con il docente della disciplina; non usare il risultato per dedurre un DSA o altre diagnosi.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M19-04","goal":"Collegare lettura delle note e teoria delle durate prima dell'esecuzione.","materials":["Carta, penna e legenda","Q = quarto, H = metà; pentagramma del docente se previsto"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Leggo i nomi: do, re, mi.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Durate e attacchi sono distinti.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Sequenza testuale in 4/4: do(Q), re(Q), mi(H). Con Q=1 conteggio e H=2, indica nomi, durate e totale. Poi spiega perché ci sono tre note ma quattro conteggi.","work":["Leggo i nomi: do, re, mi.","Allineo durate: 1, 1, 2; mi occupa 3–4.","Sommo quattro e distinguo tre attacchi da quattro conteggi."],"result":"Tre note/attacchi, quattro conteggi; mi dura il doppio di ciascuna delle altre. La prova testuale non verifica da sola lettura della chiave sul pentagramma."},"steps":[{"title":"Leggi chiave e simboli","do":"Per lo spartito portato identifica chiave, note e valore ritmico.","help":"La legenda testuale aiuta le durate ma non sostituisce la chiave."},{"title":"Separa altezza e durata","do":"Nomina la nota, poi assegna i conteggi senza suonare.","help":"Due note diverse possono avere la stessa durata."},{"title":"Spiega prima di eseguire","do":"Conta il totale e verifica una misura; poi suona se la tecnica è già appresa.","help":"Controlla anche le pause presenti nello spartito reale."}],"transfer":{"task":"Sequenza fa(H), mi(Q), re(Q) in 4/4. Indica conteggi, ordine e numero di attacchi.","check":"Fa su 1–2, mi sul 3, re sul 4; tre attacchi e quattro conteggi. Sul pentagramma la posizione si verifica nella chiave insegnata."},"checks":["I nomi seguono la sequenza.","Durate e attacchi sono distinti.","Il totale riempie la misura richiesta."],"error":{"wrong":"Mi vale un conteggio perché è una nota sola.","why":"Una nota può durare più conteggi.","fix":"Usa due caselle per H e un solo attacco all'inizio."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Tenere il conteggio","difficulty":"Dimentico quanti tempi dura una nota.","categories":["trasversale"],"signal":"Ogni simbolo viene trattato come una sola casella.","aid":"Usa caselle numerate e legenda dei valori; mantiene disponibile la legenda scelta.","preserve":"Collegare lettura delle note e teoria delle durate prima dell'esecuzione.","verify":"Confronta due tentativi con lo stesso criterio: I nomi seguono la sequenza. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M19-05","goal":"Preparare un'esecuzione individuale con inizio, continuità e fine controllati.","materials":["Strumento, docente","Mini brano originale"],"techniques":[{"name":"Pratica per segmenti","how":"Prova prima il segmento indicato nell'esempio: Conto 1–2–3–4 prima di partire. Poi unisci i segmenti.","why":"Riduce il numero di azioni da gestire insieme; la precisione viene controllata prima di aumentare la velocità."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Il ritmo conserva le durate.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Brano di quattro conteggi: do(Q), re(Q), do(H). Dopo quattro conteggi preparatori, esegui da solo e chiudi alla fine del quarto tempo. Il docente conferma tecnica e registro.","work":["Conto 1–2–3–4 prima di partire.","Suono do su 1, re su 2, do tenuto su 3–4.","Fermo il suono alla fine del 4 e controllo attacco, continuità e chiusura."],"result":"Ingresso dopo il conteggio; tre attacchi nell'ordine; chiusura dopo la durata di quattro conteggi."},"steps":[{"title":"Prepara il via","do":"Per il brano individuale concorda tempo, respiro o gesto iniziale.","help":"Puoi tenere spartito e strumenti compensativi scelti."},{"title":"Esegui una volta intera","do":"Prova dall'inizio alla fine senza fermarti a ogni dettaglio.","help":"Se perdi il punto, usa il rientro concordato col docente."},{"title":"Rivedi un criterio","do":"Dopo la prova segna una riuscita e un punto da riprendere.","help":"Valuta ingresso, continuità e fine separatamente."}],"transfer":{"task":"Esegui da solo re(H), do(Q), re(Q), con lo stesso conteggio preparatorio.","check":"Re su 1–2, do sul 3, re sul 4; inizio dopo preparazione e fine dopo il quarto conteggio, senza nota extra."},"checks":["L'ingresso avviene dopo il conteggio.","Il ritmo conserva le durate.","La chiusura non aggiunge un attacco."],"error":{"wrong":"Ricominciò dall'inizio dopo ogni piccola incertezza.","why":"Impedisce di osservare la continuità dell'esecuzione intera.","fix":"Prova un rientro concordato e correggi il punto dopo la prova."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Iniziare da solo","difficulty":"Quando devo partire perdo il primo suono.","categories":["trasversale"],"signal":"La prima nota viene saltata pur essendo riuscita nel frammento.","aid":"Usa conteggio preparatorio e prima nota evidenziata; togli gradualmente il richiamo dell'adulto, non lo spartito.","preserve":"Preparare un'esecuzione individuale con inizio, continuità e fine controllati.","verify":"Confronta due tentativi con lo stesso criterio: L'ingresso avvien
