rmare gli appunti in domande per il ripasso"}],"methods":[{"id":"M01-01","goal":"Ricavare chi agisce, che cosa accade e perché da una lettura silenziosa.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Lettura a blocchi","how":"Leggi una frase, fermati e dì che cosa cambia.","why":"Mantiene il filo degli eventi."},{"name":"Recupero dal testo chiuso","how":"Copri il brano e ricostruisci tre informazioni; poi verifica.","why":"Fa emergere ciò che hai compreso."}],"example":{"task":"Leggi in silenzio: «Lina trovò un quaderno sul bus. Dentro c'era un numero. Telefonò al proprietario e gli restituì il quaderno alla fermata». Indica persona, problema e soluzione.","work":["La persona che agisce è Lina.","Il problema è il quaderno smarrito trovato sul bus.","Il numero permette a Lina di contattare il proprietario."],"result":"Lina trova un quaderno smarrito; usa il numero al suo interno e lo restituisce alla fermata."},"steps":[{"title":"Definisci la domanda","do":"Individua quali informazioni devi trovare.","help":"Qui servono persona, problema e soluzione."},{"title":"Leggi un blocco","do":"Leggi senza parlare e annota una parola per evento.","help":"Segna trova, telefona, restituisce."},{"title":"Ricostruisci e verifica","do":"Copri il testo, rispondi e riapri per correggere.","help":"Controlla anche luogo e collegamento fra eventi."}],"transfer":{"task":"Leggi: «Omar vide una pianta piegata. Sistemò un sostegno e la legò senza stringere. Il giorno dopo il fusto era diritto». Chi interviene e come?","check":"Omar interviene; mette un sostegno e lega la pianta senza stringere."},"checks":["Nomini chi agisce.","Riporti l'azione risolutiva.","Non aggiungi eventi assenti."],"error":{"wrong":"Lina perde il proprio quaderno.","why":"Il testo dice che lo trova e lo restituisce a un proprietario.","fix":"Cerca il soggetto di trovò e distingui chi trova da chi perde."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Leggi un blocco","difficulty":"Perdo la riga mentre leggo.","categories":["dislessia"],"signal":"Salti una frase o la rileggi senza accorgertene.","aid":"Usa un segnariga e scopri una frase alla volta.","preserve":"Ricavare chi agisce, che cosa accade e perché da una lettura silenziosa.","verify":"Confronta omissioni e fatica su due brevi blocchi."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Comprendere il brano non richiede una velocità prestabilita; la lettura assistita resta possibile.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M01-02","goal":"Leggere un breve testo ad alta voce facendo capire pause e intenzioni.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Marcatura delle pause","how":"Segna / per pausa breve e // per fine frase.","why":"Aiuta a collegare respiro e significato."},{"name":"Rilettura con obiettivo","how":"Ripeti solo il punto in cui la voce non esprime la domanda.","why":"Rende la correzione mirata."}],"example":{"task":"Leggi: «Marta aprì la porta. “Sei già qui?” chiese. Poi sorrise: “Ti aspettavo!”». Indica pause e intonazione.","work":["Segno una pausa completa dopo porta.","Alzo l'intonazione su Sei già qui? perché è una domanda.","Rendo vivace Ti aspettavo! e chiudo la voce alla fine."],"result":"Marta aprì la porta. // «Sei già qui?» // chiese. // Poi sorrise: / «Ti aspettavo!» //"},"steps":[{"title":"Comprendi la scena","do":"Spiega chi parla e con quale intenzione.","help":"Marta domanda e poi mostra contentezza."},{"title":"Segna pause e parole","do":"Marca la punteggiatura e le parole da mettere in rilievo.","help":"Prova qui e aspettavo senza gridare."},{"title":"Leggi e correggi","do":"Leggi una frase per volta, poi riprendi il punto poco chiaro.","help":"Chiedi se l'ascoltatore riconosce domanda e affermazione."}],"transfer":{"task":"Leggi: «“Dove vai?” domandò Leo. “In biblioteca”, rispose Ada». Mostra domanda e risposta.","check":"Pausa fra le battute; la domanda si distingue dalla risposta, pronunciata con conclusione. Le parole restano complete."},"checks":["Rispetti i punti.","Distingui domanda e risposta.","Rendi comprensibili le battute."],"error":{"wrong":"Leggo tutto con la stessa voce senza pause.","why":"Chi ascolta non distingue frasi e intenzioni.","fix":"Segna la fine delle battute e prova separatamente la domanda."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Segna pause e parole","difficulty":"Faccio fatica a decifrare e recitare insieme.","categories":["dislessia"],"signal":"Ti blocchi sulle parole quando aggiungi l'intonazione.","aid":"Prepara prima le parole difficili con ascolto del modello, poi leggi due frasi segnate.","preserve":"Leggere un breve testo ad alta voce facendo capire pause e intenzioni.","verify":"Osserva se diminuiscono interruzioni mantenendo il significato."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non forzare una prestazione pubblica; concorda lettura condivisa o brano breve quando la decodifica assorbe troppe risorse.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M01-03","goal":"Completare un libro seguendo vicenda e cambiamenti dei personaggi.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Diario minimo di lettura","how":"Dopo ogni capitolo scrivi evento, cambiamento e dubbio.","why":"Evita di ricominciare da zero."},{"name":"Recupero distribuito","how":"Prima della nuova parte racconta la precedente senza guardare.","why":"Collega capitoli distanti."}],"example":{"task":"Mini libro originale «Il ponte di carta», completo in tre capitoli. 1: «Nora vuole esporre un modellino, ma il ponte di carta crolla». 2: «Chiede a Teo di provarlo insieme; piegano due sostegni». 3: «Il ponte regge una gomma. Nora presenta il lavoro citando l'aiuto di Teo». Ricostruisci la vicenda.","work":["Capitolo 1: desiderio di esporre e ostacolo del crollo.","Capitolo 2: Nora passa dal lavorare sola a chiedere collaborazione.","Capitolo 3: il ponte regge e Nora riconosce il contributo di Teo."],"result":"Nora risolve il problema collaborando; il progetto riesce e il riconoscimento dell'aiuto conclude il suo cambiamento."},"steps":[{"title":"Dividi la lettura","do":"Distribuisci i capitoli del libro in appuntamenti realistici.","help":"Segna una tappa breve e una possibile pausa."},{"title":"Registra la tappa","do":"Annota evento, personaggio che cambia e domanda rimasta.","help":"Per il capitolo 2: collaborazione; reggerà?"},{"title":"Riprendi il filo","do":"Racconta la tappa precedente prima di leggere la successiva.","help":"Usa il diario solo dopo il primo tentativo."},{"title":"Collega l'intero libro","do":"Ricostruisci inizio, svolta e conclusione.","help":"Verifica che il finale risponda al problema iniziale."}],"transfer":{"task":"Mini libro completo «La chiave»: 1 «Ivo perde la chiave del capanno». 2 «Ripercorre il sentiero e trova la chiave vicino al pozzo». 3 «La appende a un gancio e prepara un cartello per ricordarsene». Scrivi una riga per capitolo.","check":"1 perdita; 2 ricerca e ritrovamento; 3 prevenzione di una nuova perdita. Il cartello arriva dopo il ritrovamento."},"checks":["Registri tutti i capitoli.","Colleghi il finale al problema.","Riprendi la lettura dal punto segnato."],"error":{"wrong":"Scrivo solo che il ponte è bello.","why":"Il giudizio non conserva eventi e cambiamento.","fix":"Aggiungi crollo, aiuto di Teo e prova riuscita."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Dividi la lettura","difficulty":"Mi stanco prima di finire il capitolo.","categories":["trasversale"],"signal":"Interrompi spesso senza segnare il punto.","aid":"Concorda tappe per scena, segnalibro e diario di una riga; usa l'audiolibro se disponibile e scelto.","preserve":"Completare un libro seguendo vicenda e cambiamenti dei personaggi.","verify":"Osserva se riprendi il filo alla tappa successiva con meno rilettura."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Il mini libro mostra la procedura, non dimostra la capacità di sostenere un romanzo lungo; verifica durata e formato sul libro assegnato.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M01-04","goal":"Rispondere a domande di comprensione con informazioni verificabili nel testo.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Domanda trasformata in ricerca","how":"Cerchia chi, dove, perché o come e cerca il dato corrispondente.","why":"Orienta la lettura."},{"name":"Risposta con prova","how":"Scrivi risposta e breve riferimento al punto del testo.","why":"Evita risposte basate su supposizioni."}],"example":{"task":"Testo: «Il cortile era allagato dopo il temporale. La classe spostò la lettura nell'atrio, dove c'erano panche asciutte». Domande: dove si svolge la lettura? Perché viene spostata?","work":["Dove richiede il nuovo luogo: nell'atrio.","Perché richiede la causa: il cortile è allagato.","Le panche asciutte spiegano la scelta dell'atrio."],"result":"La lettura si svolge nell'atrio; viene spostata perché il cortile è allagato dopo il temporale."},"steps":[{"title":"Scomponi la domanda","do":"Separa le richieste presenti nella stessa domanda.","help":"Dove e perché richiedono due dati."},{"title":"Trova la prova","do":"Sottolinea solo la frase che sostiene la risposta.","help":"Allagato indica la causa."},{"title":"Scrivi e confronta","do":"Rispondi con frase completa e controlla tutte le richieste.","help":"Non basta nominare l'atrio."}],"transfer":{"task":"«La biblioteca chiuse alle cinque per una riparazione. Sara restituì il libro nella cassetta esterna». Come restituisce il libro Sara? Perché non entra?","check":"Lo mette nella cassetta esterna; non entra perché la biblioteca è chiusa per una riparazione."},"checks":["Rispondi a ogni richiesta.","La prova è nel testo.","Il pronome ha un riferimento chiaro."],"error":{"wrong":"Sara non entra perché non ama leggere.","why":"Questa motivazione non è presente.","fix":"Sostituisci il giudizio con la chiusura per riparazione."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Scomponi la domanda","difficulty":"Dimentico la seconda parte della domanda.","categories":["trasversale"],"signal":"Rispondi solo a dove o solo a perché.","aid":"Riscrivi le richieste come due caselle da spuntare.","preserve":"Rispondere a domande di comprensione con informazioni verificabili nel testo.","verify":"Controlla se entrambe ricevono risposta senza richiamo dell'adulto."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non confondere errori di scrittura con mancata comprensione; per osservare il contenuto consenti risposta orale.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M01-05","goal":"Formulare un'inferenza distinguendo indizi e conclusione possibile.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Indizi collegati","how":"Metti insieme almeno due dettagli prima di inferire.","why":"Riduce le supposizioni isolate."},{"name":"Ipotesi verificata","how":"Chiedi se una spiegazione alternativa è compatibile col brano.","why":"Mantiene distinta certezza e possibilità."}],"example":{"task":"«Rita guardava l'orologio e tamburellava sul tavolo. Quando arrivò il messaggio “Sto arrivando”, smise e sorrise». Che cosa puoi inferire?","work":["Guarda l'orologio e tamburella: segnali compatibili con attesa impaziente.","Il messaggio annuncia un arrivo.","Il sorriso suggerisce sollievo; il testo non dice chi sta arrivando."],"result":"Rita probabilmente attende qualcuno con impazienza e si rassicura al messaggio; non sappiamo chi sia."},"steps":[{"title":"Separa scritto e implicito","do":"Elenca i fatti dichiarati senza interpretarli.","help":"Guardare l'orologio è un fatto; essere impaziente è un'ipotesi."},{"title":"Collega gli indizi","do":"Spiega quale conclusione è sostenuta da più dettagli.","help":"Usa attesa più messaggio più cambiamento."},{"title":"Controlla il limite","do":"Cerca un'alternativa e indica che cosa non sai.","help":"Evita di inventare identità o eventi."}],"transfer":{"task":"«Samir infilò il biglietto nella tasca, guardò il binario e salì quando le porte si aprirono». Dove si trova probabilmente? Quali indizi usi?","check":"Probabilmente in stazione o alla fermata di un mezzo su rotaie: biglietto, binario e porte su cui sale. Il testo non stabilisce città o destinazione."},"checks":["Citi almeno due indizi.","Segnali l'incertezza dove necessaria.","Non inventi dettagli."],"error":{"wrong":"Rita aspetta sicuramente sua madre.","why":"Il messaggio non identifica la persona.","fix":"Scrivi qualcuno e usa probabilmente per l'emozione."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Collega gli indizi","difficulty":"Non riesco a tenere insieme gli indizi.","categories":["trasversale"],"signal":"Usi un solo dettaglio ignorando il messaggio.","aid":"Scrivi due colonne: indizio e che cosa può suggerire; collega le righe con una freccia.","preserve":"Formulare un'inferenza distinguendo indizi e conclusione possibile.","verify":"Osserva se la conclusione cita più dettagli."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Le emozioni sono inferenze contestuali, non letture diagnostiche del personaggio o del ragazzo.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M01-06","goal":"Descrivere narratore, personaggi, ambiente e struttura di un racconto.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Griglia narrativa","how":"Compila chi racconta, chi agisce, dove/quando e problema-soluzione.","why":"Separa componenti diverse."},{"name":"Prova linguistica","how":"Usa pronomi e azioni del brano per motivare l'analisi.","why":"Sostiene le etichette."}],"example":{"task":"«Quel lunedì entrai nel laboratorio. Avevo rotto il vaso e temevo la reazione di Alba. Lei mi aiutò a raccogliere i pezzi; insieme spiegammo l'accaduto al custode». Analizza.","work":["Entrai e avevo indicano un narratore interno in prima persona.","Personaggi: narratore, Alba e custode; ambiente: laboratorio, lunedì.","Problema: vaso rotto e timore; soluzione: collaborazione e spiegazione."],"result":"Narratore interno; protagonista che racconta; Alba aiuta; il custode ascolta la spiegazione. La vicenda passa dal timore alla responsabilità condivisa."},"steps":[{"title":"Identifica la voce","do":"Cerca persona verbale e partecipazione agli eventi.","help":"Entrai non è la voce di un narratore esterno."},{"title":"Compila gli elementi","do":"Registra personaggi, luogo e tempo con prove.","help":"Non attribuire al custode azioni non narrate."},{"title":"Ricostruisci la struttura","do":"Segna situazione, ostacolo, azione e conclusione.","help":"L'aiuto di Alba è il passaggio risolutivo."}],"transfer":{"task":"«Al tramonto Eva era sul molo. Il vento le portò via il foglio; Luca lo recuperò con una rete». Identifica voce, ambiente e problema-soluzione.","check":"Narratore esterno in terza persona; molo al tramonto; Eva perde il foglio, Luca lo recupera con una rete."},"checks":["Motivi la scelta del narratore.","Distingui luogo e tempo.","Indichi ostacolo e risoluzione."],"error":{"wrong":"Il narratore è Alba perché è nominata.","why":"Un personaggio nominato non è necessariamente la voce narrante.","fix":"Cerca chi dice entrai: la voce è del personaggio senza nome."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Compila gli elementi","difficulty":"Le caselle della griglia si mescolano.","categories":["trasversale"],"signal":"Scrivi un luogo nella colonna personaggi.","aid":"Usa una griglia di quattro righe con un esempio per riga.","preserve":"Descrivere narratore, personaggi, ambiente e struttura di un racconto.","verify":"Verifica se classifichi correttamente gli elementi del nuovo brano."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Introduci focalizzazione o analessi solo se richieste; questa guida non esaurisce l'analisi narratologica.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M01-07","goal":"Dividere un racconto in sequenze e assegnare titoli che ne riassumano l'azione.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Segnali di cambiamento","how":"Cerca passaggi di tempo, luogo o azione.","why":"Aiuta a scegliere confini motivati."},{"name":"Titolo sintetico","how":"Trasforma l'azione centrale in poche parole.","why":"Conserva il senso della sequenza."}],"example":{"task":"«Ada cercò il gatto in casa. Aprì armadi e finestre. Nel pomeriggio uscì in giardino e udì un miagolio. Il gatto era sul tetto del capanno. Ada portò una scala e il vicino lo fece scendere». Dividi e titola.","work":["Prima sequenza: ricerca in casa, prime due frasi.","Seconda: uscita nel pomeriggio e localizzazione del gatto.","Terza: scala e intervento del vicino, con soluzione."],"result":"1 Ricerca in casa; 2 Il gatto sul tetto; 3 Il recupero con la scala."},"steps":[{"title":"Segna i cambiamenti","do":"Individua dove cambia azione o ambiente.","help":"Nel pomeriggio introduce una nuova fase."},{"title":"Traccia i confini","do":"Accorpa le frasi che svolgono la stessa funzione.","help":"Aprire armadi fa parte della ricerca in casa."},{"title":"Titola e verifica","do":"Scrivi un titolo per blocco e ricostruisci il racconto dai titoli.","help":"Controlla che il recupero non sia dimenticato."}],"transfer":{"task":"«Nico impastò la focaccia e la lasciò riposare. Dopo un'ora la infornò. A cena la tagliò e la offrì agli amici». Dividi e titola.","check":"Tre sequenze possibili: preparazione e riposo; cottura; focaccia condivisa. Altri confini sono accettabili se motivati e tutti gli eventi sono coperti."},"checks":["Ogni frase appartiene a una sequenza.","I confini hanno una ragione.","I titoli distinguono le azioni."],"error":{"wrong":"Creo un titolo per ogni parola.","why":"Le sequenze sono unità di contenuto, non parole isolate.","fix":"Raggruppa le frasi della ricerca in un'unica unità."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Traccia i confini","difficulty":"Perdo i confini quando ricopio.","categories":["disgrafia"],"signal":"La ricopiatura lunga interrompe la divisione.","aid":"Numera le frasi sul testo e annota solo numeri iniziali e finali dei blocchi.","preserve":"Dividere un racconto in sequenze e assegnare titoli che ne riassumano l'azione.","verify":"Osserva se i confini restano leggibili con meno scrittura."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Può esistere più di una segmentazione sensata; chiedi una motivazione, non un numero fisso di sequenze.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M01-08","goal":"Selezionare informazioni essenziali rispetto a una domanda di lettura.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Domanda guida","how":"Valuta i dettagli in rapporto allo scopo dichiarato.","why":"Essenziale dipende dalla domanda."},{"name":"Prova di eliminazione","how":"Togli un dettaglio e verifica se la spiegazione resta comprensibile.","why":"Distingue funzione e ornamento."}],"example":{"task":"«Per ridurre le code, la mensa introdusse due turni. Il cartello nuovo era verde. Gli alunni della prima mangiavano alle dodici, quelli della seconda alle dodici e trenta». Spiega l'organizzazione senza dettagli superflui.","work":["Lo scopo è ridurre le code.","I due turni e i loro orari spiegano l'organizzazione.","Il verde del cartello non serve a questa domanda."],"result":"La mensa riduce le code con due turni: prima alle 12:00, seconda alle 12:30."},"steps":[{"title":"Fissa lo scopo","do":"Scrivi quale domanda deve ricevere risposta.","help":"Qui si chiede come funziona l'organizzazione."},{"title":"Classifica i dettagli","do":"Segna essenziali, di supporto e non necessari.","help":"Orari essenziali; colore non necessario."},{"title":"Verifica la selezione","do":"Ricostruisci la risposta solo con le informazioni scelte.","help":"Se togli gli orari, la risposta è incompleta."}],"transfer":{"task":"«Il museo chiude il martedì per manutenzione. Il biglietto è azzurro. Negli altri giorni apre alle nove». Quali dati servono per sapere quando visitarlo?","check":"Chiusura il martedì e apertura alle nove negli altri giorni; il colore del biglietto non risponde alla domanda."},"checks":["Dichiari lo scopo.","Mantieni tutti i dati necessari.","Sai motivare un'esclusione."],"error":{"wrong":"Cancello tutti i numeri perché sono dettagli.","why":"Gli orari sono necessari allo scopo.","fix":"Conserva 12:00 e 12:30; elimina il colore."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Classifica i dettagli","difficulty":"Sottolineo quasi tutto.","categories":["trasversale"],"signal":"Ogni frase riceve lo stesso segno.","aid":"Scegli prima una domanda guida e sottolinea un dato solo se serve a risponderle.","preserve":"Selezionare informazioni essenziali rispetto a una domanda di lettura.","verify":"Confronta selezione e completezza della risposta."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Un dettaglio escluso qui può diventare essenziale in un'altra domanda, per esempio sul cartello.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M01-09","goal":"Scrivere un riassunto fedele con nessi e informazioni principali.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Catena degli eventi","how":"Riduci il brano a problema, azioni e conclusione.","why":"Mantiene la struttura."},{"name":"Riformulazione controllata","how":"Scrivi con parole tue e confronta soggetti e cause.","why":"Riduce la copia e le distorsioni."}],"example":{"task":"«Elia preparò una barchetta per la gara. Il giorno della prova la vela si strappò. Usò il fazzoletto come vela e arrivò al traguardo, anche se non vinse». Riassumi in due frasi.","work":["Conservo preparazione, vela rotta, sostituzione e arrivo.","Tolgo la formula il giorno della prova senza cambiare ordine.","Unisco guasto e soluzione con ma e quindi."],"result":"Elia preparò una barchetta per la gara, ma la vela si strappò. La sostituì con un fazzoletto e raggiunse il traguardo senza vincere."},"steps":[{"title":"Trova il nucleo","do":"Segna gli eventi necessari a capire il risultato.","help":"Senza la vela rotta non si capisce il fazzoletto."},{"title":"Scrivi la catena","do":"Metti i nuclei in ordine e aggiungi i collegamenti.","help":"Distingui riuscire ad arrivare da vincere."},{"title":"Rivedi la fedeltà","do":"Confronta il riassunto col testo e togli giudizi personali.","help":"Non aggiungere emozioni non dette."}],"transfer":{"task":"«Mina seminò i fagioli. Per due giorni dimenticò l'acqua e la terra si seccò. Riprese ad annaffiare; una settimana dopo comparvero i germogli». Riassumi in due frasi.","check":"Mina seminò i fagioli, ma la terra si seccò perché non li annaffiò per due giorni. Riprese ad annaffiare e dopo una settimana comparvero i germogli; accettate formulazioni equivalenti."},"checks":["Conservi problema e conclusione.","Mantieni ordine e causa.","Non inserisci un'opinione."],"error":{"wrong":"Elia vinse grazie al fazzoletto.","why":"Il brano nega la vittoria.","fix":"Scrivi che raggiunse il traguardo senza vincere."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Scrivi la catena","difficulty":"Faccio fatica a scrivere e tenere la storia a mente.","categories":["disgrafia"],"signal":"Perdi eventi durante la stesura lunga.","aid":"Prepara quattro parole chiave e detta o scrivi una frase alla volta mantenendole visibili.","preserve":"Scrivere un riassunto fedele con nessi e informazioni principali.","verify":"Verifica se tutti gli eventi essenziali restano presenti."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. La sintesi non coincide con ridurre ogni testo della stessa percentuale; la lunghezza dipende da consegna e nuclei.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M01-10","goal":"Raccontare oralmente una vicenda in ordine comprensibile.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Scaletta di eventi","how":"Usa cinque parole chiave, non un testo da leggere.","why":"Sostiene il filo del racconto."},{"name":"Prova e riscontro","how":"Racconta e chiedi quale passaggio manca.","why":"Rende il controllo osservabile."}],"example":{"task":"Racconta a chi non lo conosce: «Dario arrivò al campo senza borraccia. Tornò allo spogliatoio, ma era chiuso. La custode lo aprì e Dario recuperò la borraccia prima dell'allenamento».","work":["Parole chiave: campo, borraccia, spogliatoio chiuso, custode, recupero.","Introduco Dario e il problema.","Collego l'apertura al recupero prima dell'allenamento."],"result":"Dario arriva al campo e si accorge di non avere la borraccia. Va allo spogliatoio, ma lo trova chiuso. La custode lo apre e lui recupera la borraccia in tempo per allenarsi."},"steps":[{"title":"Prepara i punti","do":"Scrivi personaggio, problema e tre eventi.","help":"Evita frasi complete da imparare a memoria."},{"title":"Racconta con legami","do":"Usa prima, ma, quindi e alla fine quando servono.","help":"Spiega perché cerca la custode."},{"title":"Verifica l'ascolto","do":"Chiedi all'ascoltatore di dire problema e soluzione.","help":"Ripeti solo il collegamento poco chiaro."}],"transfer":{"task":"«Alma vide un aquilone incastrato. Chiamò il nonno, che lo liberò con un bastone lungo. Alma riprese a farlo volare». Racconta in tre frasi.","check":"Devono comparire Alma, aquilone incastrato, aiuto del nonno con bastone e ripresa del volo in quest'ordine."},"checks":["Introduci il protagonista.","Colleghi problema e intervento.","Concludi senza saltare l'esito."],"error":{"wrong":"La custode recupera l'allenamento.","why":"I riferimenti confusi cambiano azioni e oggetti.","fix":"Nomina Dario come chi recupera la borraccia."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Racconta con legami","difficulty":"Mi blocco e non ricordo cosa viene dopo.","categories":["trasversale"],"signal":"Riparti dall'inizio ad ogni esitazione.","aid":"Usa cinque cartoncini con parole chiave e spostane uno dopo ogni evento raccontato.","preserve":"Raccontare oralmente una vicenda in ordine comprensibile.","verify":"Verifica se riprendi dal punto interrotto senza ricominciare."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non richiedere la ripetizione identica del modello; valuta ordine, nessi e comprensibilità.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M01-11","goal":"Trasformare un racconto rispettando il vincolo di finale, narratore o forma.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Vincoli prima della riscrittura","how":"Segna che cosa cambia e che cosa deve restare.","why":"Evita di rifare una storia scollegata."},{"name":"Confronto fra versioni","how":"Affianca originale e trasformazione e verifica azioni e voce.","why":"Controlla la coerenza."}],"example":{"task":"Originale: «Io, Lea, trovai una scatola. La aprii: era vuota». Produci un finale diverso, una versione in terza persona e una forma dialogata.","work":["Finale diverso: mantengo ritrovamento e apertura; aggiungo un messaggio nella scatola.","Terza persona: trasformo io trovai in Lea trovò mantenendo la scatola vuota.","Dialogo: faccio comunicare a Lea ritrovamento ed esito a un compagno."],"result":"Finale: «Io, Lea, trovai una scatola. La aprii: conteneva un invito». Narratore: «Lea trovò una scatola. La aprì: era vuota». Dialogo: «Ho trovato una scatola», disse Lea. «Che cosa contiene?» chiese Ivo. «Niente», rispose Lea."},"steps":[{"title":"Scegli la trasformazione","do":"Leggi se la consegna cambia finale, narratore o forma.","help":"Sono tre vincoli diversi; esegui quelli richiesti."},{"title":"Fissa le invarianti","do":"Annota eventi, tempo e personaggi da conservare.","help":"Nel cambio di narratore la scatola resta vuota."},{"title":"Riscrivi e controlla","do":"Cambia verbi per la voce, esito per il finale o battute per il dialogo.","help":"Controlla che non restino io e lei riferiti allo stesso narratore."}],"transfer":{"task":"«Tom entrò in soffitta e trovò un violino rotto». Riscrivi in prima persona e crea separatamente un finale in cui Tom può suonare.","check":"Prima persona: «Entrai in soffitta e trovai un violino rotto». Finale possibile: Tom ripara il violino con aiuto competente e lo suona; il passaggio deve spiegare come il guasto è risolto."},"checks":["Esegui il vincolo richiesto.","Mantieni coerente la persona verbale.","Motivi il nuovo esito."],"error":{"wrong":"Cambio narratore trasformando la scatola vuota in piena.","why":"Questo cambia anche l'evento, oltre al narratore.","fix":"Mantieni l'esito e modifica solo persona e riferimenti."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Fissa le invarianti","difficulty":"Perdo di vista quale parte devo cambiare.","categories":["trasversale"],"signal":"Modifichi tutti gli eventi senza seguire il vincolo.","aid":"Usa due riquadri: cambio e conservo, con due dati ciascuno.","preserve":"Trasformare un racconto rispettando il vincolo di finale, narratore o forma.","verify":"Verifica che la nuova versione rispetti entrambe le liste."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. La produzione creativa ammette molte risposte; la valutazione riguarda il vincolo e la coerenza, non il gradimento dell'adulto.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M01-12","goal":"Proporre un tema e una motivazione sostenuti da azioni del racconto.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Azione e motivo","how":"Collega una scelta del personaggio a indizi del testo.","why":"Distingue motivo e evento."},{"name":"Tema argomentato","how":"Formula una idea generale e cerca due passaggi che la sostengano.","why":"Evita etichette senza prova."}],"example":{"task":"«Ina voleva vincere il torneo. Quando vide la rivale ferita, fermò il gioco e la aiutò, rinunciando al punto decisivo». Quale motivazione e tema emergono?","work":["Ina vuole vincere: obiettivo esplicito.","Fermare il gioco e aiutare la rivale suggeriscono cura per l'altra persona.","La rinuncia al punto collega il tema della solidarietà a una scelta costosa."],"result":"Ina sembra dare priorità alla cura della rivale rispetto alla vittoria. Un tema plausibile è la solidarietà in competizione, sostenuto dall'aiuto e dalla rinuncia al punto."},"steps":[{"title":"Individua la scelta","do":"Trova l'azione che cambia la vicenda.","help":"Non limitarti al desiderio iniziale di vincere."},{"title":"Formula la motivazione","do":"Spiega perché il personaggio può agire così usando indizi.","help":"Usa sembra se il motivo non è dichiarato."},{"title":"Sostieni il tema","do":"Collega un'idea generale a due dettagli.","help":"Solidarietà: aiuto alla rivale e rinuncia."}],"transfer":{"task":"«Bruno aveva paura di parlare. Per difendere un compagno accusato ingiustamente, alzò la mano e raccontò ciò che aveva visto». Proponi tema e motivazione.","check":"Tema plausibile: coraggio per la giustizia; motivazione: difendere il compagno, esplicita. Prove: paura, alzare la mano e testimonianza. Altri temi richiedono indizi coerenti."},"checks":["Distingui tema e trama.","Citi azioni pertinenti.","Segnali se il motivo è inferito."],"error":{"wrong":"Il tema è il torneo perché è il luogo della vicenda.","why":"Torneo è argomento o contesto, non una formulazione del significato proposto.","fix":"Formula solidarietà durante la competizione e motivalo."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Formula la motivazione","difficulty":"Le idee astratte mi restano vaghe.","categories":["trasversale"],"signal":"Nomini un tema senza collegarlo ad azioni.","aid":"Completa: il personaggio fa…, questo può mostrare…, perché….","preserve":"Proporre un tema e una motivazione sostenuti da azioni del racconto.","verify":"Osserva se ogni interpretazione contiene una prova."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Accogli interpretazioni alternative motivate; non attribuire automaticamente al ragazzo le motivazioni del personaggio.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M01-13","goal":"Ricavare il significato contestuale di una parola e scegliere sinonimi e contrari adatti.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Contesto prima del dizionario","how":"Sostituisci la parola con un'ipotesi e rileggi la frase.","why":"Restringe i significati possibili."},{"name":"Confronto di sostituzioni","how":"Prova sinonimo e contrario nella stessa frase.","why":"Controlla significato e accordi."}],"example":{"task":"«Il sentiero era angusto: passava una sola persona alla volta». Spiega angusto, scegli un sinonimo e un contrario nel contesto.","work":["Il seguito dice che passa una sola persona: lo spazio è ridotto.","Stretto sostituisce angusto conservando il senso.","Ampio contrasta il significato del sentiero stretto."],"result":"Angusto significa stretto in questo contesto; sinonimo: stretto; contrario: ampio."},"steps":[{"title":"Leggi gli indizi","do":"Cerca esempi, spiegazioni e contrasti vicino alla parola.","help":"Una persona alla volta chiarisce la larghezza."},{"title":"Formula e controlla","do":"Scrivi un significato provvisorio e verifica col dizionario se serve.","help":"Non scegliere la prima definizione senza rileggere."},{"title":"Sostituisci le parole","do":"Prova sinonimo e contrario mantenendo genere e numero.","help":"Il sentiero ampio è grammaticalmente coerente."}],"transfer":{"task":"«La risposta fu concisa: solo due parole». Spiega concisa e proponi un sinonimo e un contrario.","check":"Concisa: breve e sintetica; sinonimo: breve o sintetica; contrario contestuale: prolissa o lunga. Devono accordarsi con risposta."},"checks":["Usi gli indizi del contesto.","Il sinonimo conserva il senso.","Il contrario e gli accordi sono appropriati."],"error":{"wrong":"Angusto significa triste in ogni frase.","why":"Una parola può avere usi figurati, ma qui riguarda la larghezza.","fix":"Sostituisci con stretto e controlla una persona alla volta."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Formula e controlla","difficulty":"Fatico a leggere le tante definizioni del dizionario.","categories":["dislessia"],"signal":"Abbandoni la voce prima di trovare l'uso pertinente.","aid":"Cerca una definizione per volta con guida visiva o lettura assistita e confrontala con la frase.","preserve":"Ricavare il significato contestuale di una parola e scegliere sinonimi e contrari adatti.","verify":"Verifica se scegli il significato giusto senza copiare tutta la voce."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Il sinonimo perfetto non esiste per ogni contesto; accetta equivalenti motivati e segnala differenze di tono.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M01-14","goal":"Preparare scheda libro, recensione e presentazione distinguendo dati, sintesi e giudizio.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Tre sezioni separate","how":"Dividi dati del libro, vicenda e valutazione motivata.","why":"Evita di scambiare opinioni e informazioni."},{"name":"Adattamento al destinatario","how":"Usa una scheda per i dati, una recensione per il giudizio e una scaletta per parlare.","why":"Sceglie la forma utile."}],"example":{"task":"Libro didattico originale «La lanterna sul molo», autrice inventata Mira Lago. Testo completo breve: «Ari perde la lanterna durante una notte di vento. Segue la luce dalla spiaggia al molo. La trova accanto a un pescatore, che la protegge dall'acqua. Ari lo ringrazia e torna a casa». Produci una scheda, una breve recensione e un avvio di presentazione.","work":["Dati: titolo e autrice sono dichiarati e inventati per l'esercizio.","Sintesi: perdita, ricerca e ritrovamento con aiuto.","Giudizio: apprezzo il gesto del pescatore; lo sostengo con la protezione della lanterna."],"result":"Scheda: «La lanterna sul molo», Mira Lago; protagonista Ari, ambiente spiaggia/molo, tema possibile aiuto. Recensione: un breve racconto di ricerca; il gesto del pescatore rende convincente l'aiuto, ma la ricerca potrebbe essere sviluppata di più. Presentazione: «Vi presento una storia in cui Ari cerca una lanterna e incontra un aiuto inatteso»."},"steps":[{"title":"Raccogli i dati","do":"Leggi titolo, autore e informazioni editoriali realmente disponibili.","help":"Non inventare editore o anno mancanti."},{"title":"Sintetizza senza confondere","do":"Scrivi vicenda e personaggi nella scheda; evita anticipazioni finali se la recensione lo richiede.","help":"Per una scheda completa il finale può essere richiesto."},{"title":"Motiva il giudizio","do":"Scegli un pregio o limite e un dettaglio che lo sostiene.","help":"Nella recensione non basta bello."},{"title":"Prepara la presentazione","do":"Trasforma i punti in un avvio orale per il destinatario.","help":"Usa scheda, recensione o esposizione secondo la consegna."}],"transfer":{"task":"Libro didattico originale «Il seme», autore inventato Paolo Riva. Testo: «Zoe pianta un seme. Non vede nulla per giorni. Continua a curarlo e infine spunta una foglia». Prepara tre dati di scheda, un giudizio motivato e un avvio orale.","check":"Dati: titolo Il seme, Paolo Riva, protagonista Zoe; giudizio con riferimento a attesa/cura/foglia; avvio che presenti vicenda o tema senza inventare dati editoriali."},"checks":["I dati non sono inventati.","La sintesi è fedele.","Il giudizio cita un dettaglio."],"error":{"wrong":"Nella scheda scrivo che l'autrice è famosa e ha vinto un premio.","why":"Il materiale non lo dice.","fix":"Riporta solo Mira Lago, specificando che il dossier è didattico inventato."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Motiva il giudizio","difficulty":"Non riesco a separare fatti e opinioni.","categories":["trasversale"],"signal":"Metti mi piace nel riquadro dei dati.","aid":"Usa due simboli: D per dato del testo e G per giudizio motivato.","preserve":"Preparare scheda libro, recensione e presentazione distinguendo dati, sintesi e giudizio.","verify":"Verifica se ogni G è accompagnato da una ragione."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Su un libro reale verifica i dati nel volume; questi titoli e autori sono fittizi e non sono riferimenti bibliografici.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M02-01","goal":"Leggere versi facendo sentire ritmo e senso.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Pause di senso","how":"Segna pause dove si chiude un gruppo di significato.","why":"Evita una pausa rigida a ogni verso."},{"name":"Ascolto e confronto","how":"Prova due letture e scegli quella più comprensibile.","why":"Collega voce e testo."}],"example":{"task":"Versi originali: «Sul prato / la pioggia sottile / disegna cerchi». Leggi senza spezzare il soggetto la pioggia sottile dal verbo disegna.","work":["Sul prato introduce il luogo: posso fare una pausa breve.","La pioggia sottile disegna cerchi è una frase unica.","Alla fine di cerchi chiudo la frase; il ritorno a capo non obbliga a una lunga pausa."],"result":"Lettura proposta: «Sul prato / la pioggia sottile disegna cerchi //», con tono quieto e continuità fra secondo e terzo verso."},"steps":[{"title":"Comprendi la frase","do":"Individua soggetto, azione e immagine.","help":"Qui è la pioggia a disegnare."},{"title":"Segna il ritmo","do":"Marca pause brevi e conclusioni secondo sintassi e senso.","help":"Non fermarti a lungo dopo sottile."},{"title":"Prova la voce","do":"Leggi e verifica se l'ascoltatore comprende chi fa cosa.","help":"Confronta due pause diverse."}],"transfer":{"task":"«Dal muro / un gatto curioso / osserva la strada». Proponi una lettura.","check":"Collega un gatto curioso a osserva; pausa breve possibile dopo muro, conclusione dopo strada. Sono ammesse scelte espressive motivate."},"checks":["Mantieni i gruppi di senso.","Distingui pausa e ritorno a capo.","La voce rende comprensibile l'immagine."],"error":{"wrong":"Mi fermo a lungo dopo ogni verso.","why":"Il soggetto si stacca dal suo verbo.","fix":"Collega la pioggia sottile a disegna."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Segna il ritmo","difficulty":"Mi perdo fra gli a capo.","categories":["dislessia"],"signal":"Interrompi una frase prima del verbo.","aid":"Unisci con un arco i versi che formano la stessa frase e usa un segnariga.","preserve":"Leggere versi facendo sentire ritmo e senso.","verify":"Osserva se mantieni il legame soggetto-verbo."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non confondere scioltezza di lettura e comprensione poetica; può servire un modello ascoltato.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M02-02","goal":"Riscrivere versi in prosa esplicitando il significato senza aggiungere un commento.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Riordino sintattico","how":"Rimetti soggetto e verbo nell'ordine più chiaro.","why":"Scioglie le inversioni."},{"name":"Sostituzione controllata","how":"Spiega parole figurate con il contesto.","why":"Mantiene il contenuto."}],"example":{"task":"Versi originali: «D'oro si veste / il colle al mattino». Fai la parafrasi; qui oro indica la luce gialla del sole.","work":["Il soggetto è il colle.","D'oro si veste significa appare coperto da luce dorata.","Al mattino resta come indicazione di tempo."],"result":"Al mattino il colle è illuminato dalla luce dorata del sole."},"steps":[{"title":"Sciogli la frase","do":"Individua soggetto, verbo e riferimenti.","help":"Non cercare un vestito reale."},{"title":"Spiega le parole","do":"Sostituisci espressioni difficili mantenendo il significato.","help":"Oro qui è una qualità della luce."},{"title":"Confronta col testo","do":"Controlla ogni informazione e togli il giudizio personale.","help":"La parafrasi non richiede mi piace."}],"transfer":{"task":"«Dorme il villaggio / sotto un manto di neve». Manto indica una copertura. Parafrasa.","check":"Il villaggio è quieto mentre la neve lo ricopre; formulazioni equivalenti devono conservare quiete e copertura di neve."},"checks":["Il significato è conservato.","Le inversioni diventano chiare.","Non aggiungi una valutazione."],"error":{"wrong":"Il colle indossa un abito comprato.","why":"Prendi alla lettera l'immagine di luce.","fix":"Scrivi è illuminato dalla luce dorata."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Sciogli la frase","difficulty":"L'ordine insolito mi confonde.","categories":["trasversale"],"signal":"Attribuisci l'azione al mattino anziché al colle.","aid":"Scrivi tre caselle: chi, che cosa fa, quando.","preserve":"Riscrivere versi in prosa esplicitando il significato senza aggiungere un commento.","verify":"Verifica se ricostruisci la frase senza inversione."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. La parafrasi chiarisce il significato ma non sostituisce l'analisi delle scelte poetiche.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M02-03","goal":"Riconoscere versi, strofe, schema di rime e un semplice conteggio metrico.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Annotazione a livelli","how":"Conta prima versi e strofe, poi confronta finali, poi sillabe.","why":"Evita di mescolare unità."},{"name":"Confronto sonoro","how":"Controlla i suoni dalla vocale tonica per le rime.","why":"Non basta la stessa ultima lettera."}],"example":{"task":"Poesia originale, una strofa: «Nel giardino canta il vento / tra le foglie del sentiero / passa lieve, passa lento / poi si perde nel mistero». Conta versi/strofe e rime. Conta metricamente «Nel giardino canta il vento», unendo canta_il.","work":["Ci sono quattro versi e una strofa.","Vento/lento formano rima A; sentiero/mistero rima B: ABAB.","Conteggio: Nel(1) giar(2) di(3) no(4) can(5) ta_il(6) ven(7) to(8): ottonario."],"result":"4 versi, 1 strofa, rime alternate ABAB; il primo verso conta 8 sillabe metriche con sinalefe canta_il."},"steps":[{"title":"Conta le unità","do":"Numera versi e separazioni fra strofe.","help":"Un a capo di impaginazione non sempre è un nuovo verso: usa il testo poetico."},{"title":"Marca le rime","do":"Confronta le parole finali dalla vocale accentata e assegna lettere.","help":"Vento e lento: ento."},{"title":"Conta un verso","do":"Dividi le sillabe, considera incontri vocalici e accento finale.","help":"Usa le convenzioni insegnate dal docente; qui la sinalefe è dichiarata."}],"transfer":{"task":"Una strofa: «La luce sul mare / mi invita a sognare». Conta versi, strofe e rime; conta «La luce sul mare».","check":"2 versi, 1 strofa, rima baciata AA: mare/sognare (are). La(1) lu(2) ce(3) sul(4) ma(5) re(6): senario, parola finale piana."},"checks":["Non confondi versi e strofe.","Motivi le rime coi suoni.","Mostri il conteggio metrico."],"error":{"wrong":"Conto nove sillabe nel primo verso ignorando canta_il.","why":"Nel conteggio richiesto le due vocali si uniscono.","fix":"Segna canta_il come una posizione metrica."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Conta un verso","difficulty":"Perdo il conto delle sillabe.","categories":["discalculia"],"signal":"Ricomincia il numero o salti una posizione.","aid":"Scrivi una casella numerata per ogni sillaba metrica, segnando l'unione vocalica.","preserve":"Riconoscere versi, strofe, schema di rime e un semplice conteggio metrico.","verify":"Verifica se numero finale e caselle coincidono."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Altri versi possono avere scelte metriche diverse: non imporre la sinalefe a ogni incontro né usare questo caso come regola universale.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M02-04","goal":"Riconoscere alcune figure retoriche e spiegare il loro effetto.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Confronto letterale e figurato","how":"Chiedi se l'espressione descrive un fatto letterale o un trasferimento.","why":"Fa emergere la figura."},{"name":"Etichetta con prova","how":"Collega il nome della figura alle parole precise.","why":"Evita il solo elenco di definizioni."}],"example":{"task":"Frasi originali: «Le stelle sono come lanterne»; «Il cielo è una coperta»; «Il vento sussurra». Identifica similitudine, metafora e personificazione.","work":["Come rende esplicito il confronto stelle/lanterne: similitudine.","Il cielo è chiamato coperta senza come: metafora.","Sussurrare è azione umana attribuita al vento: personificazione."],"result":"Similitudine: stelle come lanterne, effetto di luce; metafora: cielo-coperta, effetto di avvolgimento; personificazione: vento che sussurra, effetto di voce quieta."},"steps":[{"title":"Trova le parole","do":"Isola l'immagine o il suono insolito.","help":"Cerca come, identità figurata o azione umana."},{"title":"Confronta la definizione","do":"Spiega perché la figura corrisponde al caso.","help":"La presenza di come va interpretata, non basta da sola."},{"title":"Descrivi l'effetto","do":"Di' quale immagine o sensazione produce.","help":"Collega sussurra a un vento leggero."}],"transfer":{"task":"«La luna è una moneta»; «Le foglie danzano»; «Corre come una freccia». Identifica e motiva.","check":"Metafora luna-moneta; personificazione delle foglie; similitudine della corsa con la freccia, che richiama velocità."},"checks":["Citi le parole interessate.","Motivi ogni etichetta.","L'effetto è legato all'immagine."],"error":{"wrong":"Il cielo è una coperta è una similitudine con come.","why":"Come non c'è e l'identificazione è figurata.","fix":"Classifica metafora e spiega il cielo avvolgente."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Confronta la definizione","difficulty":"Confondo i nomi delle figure.","categories":["trasversale"],"signal":"Usi la stessa etichetta per casi diversi.","aid":"Tieni una scheda di tre esempi distinti e confronta il nuovo caso.","preserve":"Riconoscere alcune figure retoriche e spiegare il loro effetto.","verify":"Osserva se sai motivare la scelta anche senza dire subito il nome."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. L'elenco è introduttivo; per figure non comprese usa la definizione del manuale e un esempio verificato.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M02-05","goal":"Collegare immagini poetiche, tema ed emozioni con indizi testuali.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Inventario sensoriale","how":"Elenca colori, suoni e movimenti presenti.","why":"Parte dal testo."},{"name":"Interpretazione motivata","how":"Collega un possibile tema e tono a parole precise.","why":"Evita un'emozione arbitraria."}],"example":{"task":"Versi originali: «La panchina è vuota / il passo dell'amico non ritorna / nel cortile tace la sera». Quali immagini, tema e tono proponi?","work":["Immagini: panchina vuota, passo assente, cortile silenzioso.","Il mancato ritorno e il vuoto suggeriscono assenza.","Il tono può essere malinconico; non sappiamo perché l'amico non torni."],"result":"La poesia costruisce un'immagine di assenza attraverso vuoto e silenzio. Un tema plausibile è l'attesa di un amico; il tono appare malinconico."},"steps":[{"title":"Raccogli le immagini","do":"Annota ciò che puoi immaginare o sentire.","help":"Non aggiungere il motivo dell'assenza."},{"title":"Collega le ricorrenze","do":"Trova parole che convergono verso un tema.","help":"Vuota, non ritorna, tace."},{"title":"Motiva il tono","do":"Proponi un'emozione del testo usando almeno due indizi.","help":"Distingui tono del testo e tua reazione."}],"transfer":{"task":"«Una finestra si apre / risate riempiono la strada / il giorno comincia». Proponi immagine dominante e tono.","check":"Apertura e risate suggeriscono inizio vivace o gioioso; la risposta deve citare finestra che si apre e risate. Altre letture vanno motivate."},"checks":["Citi immagini effettive.","Il tema collega più versi.","Distingui interpretazione e certezza."],"error":{"wrong":"L'amico è morto, sicuramente.","why":"Il testo descrive assenza, non ne stabilisce la causa.","fix":"Scrivi assenza o attesa senza precisarne il motivo."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Collega le ricorrenze","difficulty":"I temi mi sembrano parole astratte.","categories":["trasversale"],"signal":"Dai un'etichetta senza indizi.","aid":"Disegna due immagini minime e completa entrambe richiamano….","preserve":"Collegare immagini poetiche, tema ed emozioni con indizi testuali.","verify":"Verifica se la formulazione finale cita due versi."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non prescrivere l'emozione corretta al ragazzo; una reazione personale può differire dal tono proposto.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M02-06","goal":"Scrivere un commento poetico con significato, forma e valutazione motivata.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Commento in tre mosse","how":"Scrivi che cosa dice, come lo dice e quale effetto produce.","why":"Organizza osservazioni diverse."},{"name":"Citazione breve spiegata","how":"Cita poche parole e spiega il loro ruolo.","why":"Sostiene l'interpretazione."}],"example":{"task":"Versi originali: «Il treno si allontana / resta un saluto nell'aria». Scrivi un commento di tre frasi.","work":["Il contenuto riguarda una partenza e il saluto che rimane.","Resta contrasta con si allontana.","Nell'aria rende il saluto quasi una presenza dopo la partenza."],"result":"La poesia rappresenta una separazione attraverso un treno che parte. Il contrasto fra «si allontana» e «resta» mette in rilievo la persistenza del saluto. Questa immagine può suggerire nostalgia, perché il legame continua anche dopo la partenza."},"steps":[{"title":"Spiega il contenuto","do":"Parafrasa brevemente la situazione.","help":"Non trasformare il commento in una lunga trama inventata."},{"title":"Osserva una scelta","do":"Scegli parola, contrasto, figura o ritmo e spiegalo.","help":"Qui puoi usare allontana/resta."},{"title":"Collega l'effetto","do":"Motiva un'interpretazione o una reazione personale.","help":"Indica quali parole la sostengono."}],"transfer":{"task":"«L'ultima foglia cade / il ramo aspetta la primavera». Commenta in tre frasi.","check":"Deve comparire fine della stagione e attesa/rinnovamento; una scelta osservabile è la personificazione del ramo che aspetta; l'effetto proposto va collegato ai versi."},"checks":["Descrivi il contenuto.","Analizzi almeno una scelta.","Motivi l'effetto o giudizio."],"error":{"wrong":"È bella perché è una poesia.","why":"È un giudizio circolare senza osservazione.","fix":"Spiega il contrasto allontana/resta e il suo effetto."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Osserva una scelta","difficulty":"Non so da dove iniziare il commento.","categories":["trasversale"],"signal":"Ripeti soltanto i versi.","aid":"Usa tre inizi temporanei: il testo mostra…, la parola… suggerisce…, questo produce….","preserve":"Scrivere un commento poetico con significato, forma e valutazione motivata.","verify":"Verifica se produci tre osservazioni diverse."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Riduci gradualmente gli inizi di frase; non ritirare lettura assistita o videoscrittura concordata.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M02-07","goal":"Confrontare due poesie usando gli stessi criteri e prove.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Tabella a criteri comuni","how":"Confronta tema, immagini e tono nelle stesse colonne.","why":"Rende simmetrico il confronto."},{"name":"Conclusione con prove","how":"Scrivi una somiglianza e una differenza citando entrambi i testi.","why":"Evita due analisi scollegate."}],"example":{"task":"Poesie originali. A: «Pioggia sui vetri / la stanza ascolta / passi lontani». B: «Pioggia sul campo / le pozzanghere ridono / corriamo insieme». Confronta pioggia e tono.","work":["Entrambe hanno la pioggia.","A presenta stanza e passi lontani: ambiente raccolto e possibile solitudine.","B presenta corsa insieme e pozzanghere che ridono: gioco e compagnia."],"result":"Le due poesie condividono la pioggia ma la presentano diversamente: A suggerisce raccoglimento o solitudine, B allegria condivisa attraverso «corriamo insieme»."},"steps":[{"title":"Scegli i criteri","do":"Usa tema, immagini e tono per entrambi i testi.","help":"Non confrontare lunghezza di A con emozione di B."},{"title":"Compila il confronto","do":"Scrivi un indizio per ciascun criterio in ciascuna poesia.","help":"Passi lontani e corriamo insieme sono prove."},{"title":"Formula la conclusione","do":"Unisci una somiglianza e una differenza motivate.","help":"Usa entrambe… mentre…."}],"transfer":{"task":"A: «La notte chiude le finestre / nessuna voce». B: «La notte accende le stelle / parliamo sul balcone». Confronta ambiente e presenza umana.","check":"Notte comune; A chiusura e assenza di voce, B apertura all'esterno e conversazione. I toni possono essere interpretati diversamente se sostenuti dalle parole."},"checks":["Usi criteri comuni.","Citi entrambi i testi.","La differenza deriva dalle prove."],"error":{"wrong":"A è breve, B è felice: quindi sono opposte.","why":"I criteri non sono gli stessi e l'opposizione non è dimostrata.","fix":"Confronta il tono in entrambe usando i dettagli."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Compila il confronto","difficulty":"Passando da un testo all'altro dimentico i dettagli.","categories":["trasversale"],"signal":"Compili solo una colonna.","aid":"Metti i testi affiancati e completa una riga di criterio alla volta.","preserve":"Confrontare due poesie usando gli stessi criteri e prove.","verify":"Verifica se ogni riga ha due prove."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Una tabella è un aiuto didattico; il confronto non richiede una valutazione estetica unica.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M02-08","goal":"Comporre una breve poesia rispettando un vincolo e motivando una scelta.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Banca di immagini","how":"Raccogli dettagli sensoriali prima dei versi.","why":"Fornisce materiale concreto."},{"name":"Revisione per vincolo","how":"Controlla tema, numero di versi e figura richiesta.","why":"Rende verificabile una produzione aperta."}],"example":{"task":"Scrivi tre versi sul risveglio di una città usando una personificazione, senza obbligo di rima.","work":["Scelgo finestre, bus e luce come immagini urbane.","Attribuisco alle finestre l'azione umana di sbadigliare.","Divido l'immagine in tre versi e verifico il tema."],"result":"«Le finestre sbadigliano / un bus scuote la strada / il sole apre il giorno». Tre versi; «finestre sbadigliano» è personificazione e introduce il risveglio."},"steps":[{"title":"Leggi i vincoli","do":"Segna tema, versi e figura richiesti.","help":"La rima non è richiesta."},{"title":"Scegli immagini","do":"Annota tre dettagli adatti al tema e una possibile figura.","help":"Finestre aperte possono diventare finestre che sbadigliano."},{"title":"Scrivi e rivedi","do":"Componi, leggi ad alta voce e controlla i vincoli.","help":"Spiega una scelta senza doverla chiamare bella."}],"transfer":{"task":"Scrivi quattro versi su un cortile dopo la pioggia usando una similitudine.","check":"Quattro versi riconoscibili, tema del cortile bagnato, un confronto esplicito sensato. Esempio valido: pozzanghere come specchi; sono ammesse altre produzioni coerenti."},"checks":["Rispetti tema e numero di versi.","La figura è riconoscibile.","Sai spiegare una tua scelta."],"error":{"wrong":"Aggiungo rime a caso cambiando il tema.","why":"Il vincolo principale non viene rispettato.","fix":"Conserva immagini urbane e togli parole inserite solo per rimare."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Scrivi e rivedi","difficulty":"Le idee ci sono ma scriverle mi affatica.","categories":["disgrafia"],"signal":"Abbandoni il testo durante la copiatura.","aid":"Detta una prima versione o usa parole su cartoncini, poi trascrivi solo la versione scelta.","preserve":"Comporre una breve poesia rispettando un vincolo e motivando una scelta.","verify":"Verifica se il prodotto conserva immagini e vincoli con fatica sostenibile."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non equiparare ortografia, grafia e qualità delle immagini; osserva gli obiettivi separatamente.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M02-09","goal":"Memorizzare e recitare un breve testo con recupero e controllo.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Recupero a segmenti","how":"Copri due versi, recitali e controlla omissioni.","why":"Allena il richiamo."},{"name":"Ripresa distribuita","how":"Ripeti dopo una pausa e il giorno successivo.","why":"Verifica la tenuta nel tempo."}],"example":{"task":"Memorizza questi versi originali: «Una luce alla finestra / un saluto lungo il viale / poi la notte lenta arriva / e ogni voce si fa lieve».","work":["Divido in due coppie: luce/saluto e notte/voce.","Coperto il primo blocco, recito i primi due versi esatti.","Recito il secondo e unisco i quattro; controllo che lenta e lieve non siano scambiate."],"result":"Testo completo recitato: «Una luce alla finestra / un saluto lungo il viale / poi la notte lenta arriva / e ogni voce si fa lieve»."},"steps":[{"title":"Comprendi e dividi","do":"Spiega immagini e scegli blocchi brevi.","help":"Ricorda il passaggio dal saluto alla notte."},{"title":"Copri e recupera","do":"Recita il blocco senza testo, poi verifica le parole.","help":"Riapri dopo il tentativo, non prima."},{"title":"Unisci e riprendi","do":"Collega i blocchi e prova dopo una pausa.","help":"Controlla soprattutto il punto di unione."}],"transfer":{"task":"Memorizza due versi originali: «Sul quaderno resta un segno / della strada che farò». Dopo una pausa recitali.","check":"Entrambi i versi nell'ordine corretto; per una richiesta di memoria letterale conserva resta, segno e farò. Se è richiesta recitazione espressiva, aggiungi una pausa motivata."},"checks":["Mantieni l'ordine dei versi.","Correggi omissioni specifiche.","Riesci a riprendere dopo una pausa."],"error":{"wrong":"Rileggo dieci volte ma non provo mai a coprire.","why":"Non osservo se riesco a richiamare il testo.","fix":"Copri due versi e tenta prima del controllo."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Copri e recupera","difficulty":"Mi blocco quando devo ricordare tutto insieme.","categories":["trasversale"],"signal":"Conosci i blocchi ma perdi la loro unione.","aid":"Usa temporaneamente i primi termini luce, saluto, notte, voce come indizi.","preserve":"Memorizzare e recitare un breve testo con recupero e controllo.","verify":"Verifica il richiamo dopo pausa con meno suggerimenti didattici."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Concorda eventuali riduzioni o supporti con il docente; memorizzazione letterale e comprensione sono obiettivi distinti.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M03-01","goal":"Ricostruire un mito o episodio distinguendo eventi narrati e spiegazione fantastica.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Catena problema-azione-esito","how":"Collega le azioni centrali dell'episodio.","why":"Mantiene la comprensione."},{"name":"Domanda sul significato","how":"Chiedi che cosa la storia vuole spiegare o mostrare.","why":"Distingue mito e descrizione scientifica."}],"example":{"task":"Mito inventato per l'esercizio: «Il villaggio viveva al buio. Aster salì sul monte e chiese una scintilla alla dea dell'alba. La portò in una conchiglia; aprendola, illuminò le case. Da allora, dice il racconto, ogni alba rinnova quel dono». Che cosa accade e che cosa spiega?","work":["Problema: villaggio al buio.","Aster ottiene una scintilla dalla dea e la porta nelle case.","Il racconto collega il dono al ritorno dell'alba in modo fantastico."],"result":"Aster porta la luce al villaggio; il mito inventato spiega il ripetersi dell'alba come rinnovo di un dono divino."},"steps":[{"title":"Individua i fatti narrati","do":"Segna protagonista, problema e azioni.","help":"Non presentare la dea come dato storico."},{"title":"Ordina l'episodio","do":"Collega richiesta, trasporto e apertura della conchiglia.","help":"L'esito dipende dall'ordine."},{"title":"Spiega la funzione","do":"Distingui la spiegazione del mito dalla spiegazione scientifica.","help":"Usa nel racconto si spiega…."}],"transfer":{"task":"Mito inventato: «Neri batté un tamburo per svegliare le nuvole; esse risposero con un rombo. Da allora il popolo racconta che il tuono è quella risposta». Che fenomeno interpreta e come?","check":"Il tuono è interpretato fantasticamente come risposta delle nuvole al tamburo; protagonista Neri, azione battere, esito rombo."},"checks":["Riporti azione ed esito.","Identifichi il fenomeno interpretato.","Distingui racconto e fatto accertato."],"error":{"wrong":"Il tuono nasce davvero da un tamburo.","why":"Il racconto inventato non è una spiegazione scientifica.","fix":"Scrivi secondo il mito le nuvole rispondono."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Individua i fatti narrati","difficulty":"I nomi nuovi mi fanno perdere i ruoli.","categories":["dislessia"],"signal":"Scambi protagonista e divinità.","aid":"Tieni una legenda nome-ruolo: Aster protagonista, dea donatrice.","preserve":"Ricostruire un mito o episodio distinguendo eventi narrati e spiegazione fantastica.","verify":"Verifica se assegni correttamente le azioni."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. I miti qui sono inventati, non tradizioni documentate; applica la procedura al testo effettivamente assegnato.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M03-02","goal":"Ordinare e riassumere eventi epici distinguendo ordine del racconto e cronologia.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Linea degli eventi","how":"Disponi gli eventi secondo quando accadono.","why":"Scioglie i ritorni al passato."},{"name":"Riassunto causale","how":"Unisci eventi con nessi coerenti.","why":"Evita una lista senza collegamenti."}],"example":{"task":"Episodio originale: «Ora Enea guarda la nave riparata. Il giorno prima la tempesta aveva spezzato il timone. All'alba i compagni lo avevano sostituito. Finalmente salpano». Il nome è usato in un esercizio inventato, non in un passo dell'Eneide. Ordina e riassumi.","work":["Prima: tempesta e timone spezzato, giorno precedente.","Secondo: sostituzione all'alba.","Terzo: osservazione della nave e partenza."],"result":"Dopo che una tempesta spezza il timone, i compagni lo sostituiscono all'alba; Enea osserva la nave riparata e il gruppo salpa."},"steps":[{"title":"Raccogli i segnali temporali","do":"Cerchia ora, il giorno prima e all'alba.","help":"L'inizio del racconto non è l'evento più antico."},{"title":"Ordina le azioni","do":"Numera secondo la cronologia.","help":"Guasto prima della riparazione."},{"title":"Sintetizza i nessi","do":"Scrivi un riassunto con causa e soluzione.","help":"Non aggiungere luoghi o battaglie."}],"transfer":{"task":"Episodio originale: «L'eroina stringe lo scudo ritrovato. Tre giorni prima lo aveva perso nel guado. Ieri una pastora lo ha recuperato. Oggi può ripartire». Ordina.","check":"Perdita tre giorni prima; recupero ieri; possesso e ripartenza oggi. Il riassunto cons
