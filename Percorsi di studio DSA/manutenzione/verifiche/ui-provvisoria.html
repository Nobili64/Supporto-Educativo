iques":[{"name":"Lettura culturale contestualizzata","how":"Compila chi/luogo/pratica/giorno e conserva le parole che limitano il gruppo.","why":"Evita di trasformare un testo locale in uno stereotipo."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: La pratica è tradotta correttamente; Le parole “alcuni” sono conservate; Il confronto non è una generalizzazione nazionale. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Tre testi didattici originali descrivono club immaginari. FR: “Dans notre club, certains élèves lisent des bandes dessinées le mercredi.” ES: “En nuestro club, algunos alumnos leen cómics los viernes.” DE: “In unserem Club lesen einige Schüler samstags Comics.” Trova chi, che cosa e quando; limita la conclusione al club.","work":["FR: alcuni alunni leggono fumetti il mercoledì. ES: alcuni alunni leggono fumetti il venerdì. DE: alcuni alunni leggono fumetti il sabato.","Conservo certains/algunos/einige: non significa tutti.","Confronto la pratica, non una nazione: una domanda possibile è “In quali giorni il nostro gruppo legge insieme?” I club sono immaginari."],"result":"Tre pratiche alternative: fumetti in un club, con giorni diversi e partecipazione di alcuni alunni. Nessuna descrive tutti i giovani di Francia, Spagna o Germania."},"steps":[{"title":"Delimita il contesto","do":"Nel tuo testo segna luogo, gruppo e parole di quantità.","help":"Questi esempi sono immaginari: servono a imparare il confronto."},{"title":"Estrai la pratica","do":"Scrivi attività e giorno dalla lingua studiata.","help":"DE: il verbo ausleihen è separato in leihen…aus nella frase data."},{"title":"Confronta con prudenza","do":"Formula una domanda su una pratica simile e indica ciò che non sai.","help":"Per un’affermazione reale su un Paese servono fonti adeguate."}],"transfer":{"task":"Nuovi testi originali su biblioteche immaginarie. FR: “Dans cette bibliothèque, certains enfants empruntent des livres le lundi.” ES: “En esta biblioteca, algunos niños toman libros prestados los martes.” DE: “In dieser Bibliothek leihen einige Kinder mittwochs Bücher aus.” Ricava pratica e giorno, poi scrivi una domanda di confronto.","check":"Prestito di libri: FR lunedì; ES martedì; DE mercoledì. Riguarda alcuni bambini della biblioteca descritta. Domanda pertinente: “Quando è possibile prendere libri in prestito nella biblioteca che conosco?” Non dedurre un calendario nazionale."},"checks":["La pratica è tradotta correttamente","Le parole “alcuni” sono conservate","Il confronto non è una generalizzazione nazionale"],"error":{"wrong":"In Germania tutti leggono fumetti il sabato.","why":"Il testo riguarda alcuni membri di un club immaginario.","fix":"Scrivi “Nel club descritto, alcuni…” e lascia aperta la domanda sugli altri contesti."},"home":["Nel tuo testo culturale sottolinea il contesto e prepara una domanda, non una regola su tutti gli abitanti.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Delimita il contesto","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa una tabella con luogo, gruppo, pratica e giorno; evidenzia alcuni nella lingua del testo.","preserve":"Ricavare aspetti culturali da un testo delimitato e confrontarli senza stereotipi.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Scegli la lingua effettivamente studiata e un modello di pronuncia del corso. Riduci i suggerimenti sul contenuto, mantenendo dizionario e scaletta utili. Non richiedere le tre lingue insieme: sono alternative. Il testo scritto non è una verifica dell’ascolto né della pronuncia.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M13-01","goal":"Collegare materiale, energia e funzione in un sistema tecnologico.","materials":["carta e matita","righello","materiali semplici indicati nella consegna, se realizzi il progetto"],"techniques":[{"name":"Schema funzionale","how":"Disegna una catena energetica e una tabella materiale-funzione.","why":"Collega parti e trasformazioni senza confondere i livelli."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Materiali e componenti sono distinti; La fonte energetica è corretta; Sono indicate funzione e almeno una dissipazione. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Una torcia descritta ha corpo di plastica, contatti metallici, pile, interruttore e lampada LED. Spiega la funzione di due materiali e la trasformazione energetica; non aprire né modificare un dispositivo reale.","work":["Il corpo di plastica contiene i componenti e, nell’uso previsto, isola dai contatti; i contatti metallici conducono corrente.","Le pile forniscono energia al circuito chiuso dall’interruttore; il LED trasforma parte dell’energia elettrica in luce e parte in calore.","Schema del sistema: pile → circuito/interruttore → LED → luce e calore. Il corpo protegge e sostiene, ma non fornisce l’energia."],"result":"Materiali diversi svolgono funzioni diverse. La torcia usa energia immagazzinata nelle pile e produce luce con dissipazione in calore."},"steps":[{"title":"Elenca i componenti","do":"Sul tuo oggetto separa materiale, componente e funzione.","help":"“Metallo” è il materiale, “contatto” il componente."},{"title":"Segui l’energia","do":"Indica fonte, passaggi e risultati del funzionamento.","help":"Distingui energia da oggetti: il LED non è una forma di energia."},{"title":"Spiega una scelta","do":"Collega una proprietà del materiale alla funzione.","help":"Non basta dire che la plastica è economica se la consegna chiede isolamento."}],"transfer":{"task":"Un ventilatore descritto ha scocca di plastica, fili metallici e motore alimentato a batteria. Spiega materiale, energia e funzione senza realizzare un circuito.","check":"Plastica: contenimento/protezione nell’uso previsto; metallo dei fili: conduzione. Batteria → energia elettrica → motore → movimento delle pale, con produzione anche di calore e suono. Non si conclude che tutta l’energia diventi movimento."},"checks":["Materiali e componenti sono distinti","La fonte energetica è corretta","Sono indicate funzione e almeno una dissipazione"],"error":{"wrong":"Le pile contengono luce che entra nel LED.","why":"La luce è prodotta durante il funzionamento, non conservata come luce nelle pile.","fix":"Rappresenta la fonte e la trasformazione in energia elettrica, poi luce e calore."},"home":["Per un oggetto del tuo libro compila due righe materiale-funzione e una catena energetica.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Elenca i componenti","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa carte separate per materiale, funzione e energia; collega una relazione per volta senza dover tenere l’intero sistema in mente.","preserve":"Collegare materiale, energia e funzione in un sistema tecnologico.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Fai motivare una scelta e riduci i suggerimenti sull’ordine del lavoro; mantieni schemi e strumenti utili. Distingui funzionamento del progetto, qualità del disegno e manualità. Per realizzare oggetti usa solo materiali e strumenti autorizzati dal docente; le simulazioni su carta non attestano sicurezza di un dispositivo reale.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M13-02","goal":"Rappresentare un processo produttivo e uno schema di funzionamento con frecce diverse.","materials":["carta e matita","righello","materiali semplici indicati nella consegna, se realizzi il progetto"],"techniques":[{"name":"Diagramma con legenda","how":"Usa riquadri numerati per le fasi e una catena separata per il funzionamento.","why":"Rende esplicita la relazione fra i blocchi."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Le fasi produttive rispettano l’ordine; Il funzionamento include fonte e risultato; La legenda distingue successione e flusso. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Dati: un quaderno si produce preparando carta, stampando righe, tagliando fogli, raccogliendoli e rilegandoli con una copertina. Una lampada da tavolo descritta funziona con fonte elettrica, interruttore e lampadina. Disegna due schemi: produzione del quaderno e funzionamento della lampada.","work":["Produzione: carta → stampa delle righe → taglio → raccolta dei fogli → rilegatura con copertina → quaderno. Le frecce indicano successione delle operazioni.","Funzionamento: fonte elettrica → interruttore chiuso/circuito → lampadina → luce e calore. Le frecce indicano un flusso energetico semplificato.","Nomino i due schemi: uno dice come l’oggetto è fabbricato, l’altro come opera durante l’uso."],"result":"Due schemi distinti e ordinati. Nel primo entrano materiali e lavorazioni; nel secondo fonte, controllo e risultato."},"steps":[{"title":"Scegli il tipo di schema","do":"Sul tuo compito indica se descrivi fabbricazione oppure uso.","help":"Un interruttore non è una fase produttiva."},{"title":"Ordina i passaggi","do":"Scrivi azioni per la produzione, componenti e flussi per il funzionamento.","help":"Usa il testo fornito; non aggiungere macchine non descritte."},{"title":"Aggiungi una legenda","do":"Dichiara se la freccia significa “poi” o “energia verso”.","help":"Una freccia senza significato può confondere i due schemi."}],"transfer":{"task":"Dati: un sacchetto di carta si produce tagliando un foglio, piegandolo, incollando fondo e bordo, lasciando asciugare. Un campanello a batteria ha pulsante e segnalatore sonoro. Rappresenta produzione e funzionamento.","check":"Produzione: foglio → taglio → piegatura → incollaggio fondo/bordo → asciugatura → sacchetto. Funzionamento: batteria → circuito chiuso dal pulsante → segnalatore → suono e calore. Le frecce non hanno lo stesso significato nei due schemi."},"checks":["Le fasi produttive rispettano l’ordine","Il funzionamento include fonte e risultato","La legenda distingue successione e flusso"],"error":{"wrong":"Produzione della lampada: accendo l’interruttore e si illumina.","why":"È una descrizione del funzionamento durante l’uso.","fix":"Per la produzione cerca dati di assemblaggio; qui sono forniti quelli del quaderno."},"home":["Per la pagina assegnata intitola esplicitamente il diagramma “produzione” o “funzionamento”.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Scegli il tipo di schema","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Prepara blocchi mobili con una parola per fase e la legenda scritta; riordina prima di ricopiare le frecce.","preserve":"Rappresentare un processo produttivo e uno schema di funzionamento con frecce diverse.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Fai motivare una scelta e riduci i suggerimenti sull’ordine del lavoro; mantieni schemi e strumenti utili. Distingui funzionamento del progetto, qualità del disegno e manualità. Per realizzare oggetti usa solo materiali e strumenti autorizzati dal docente; le simulazioni su carta non attestano sicurezza di un dispositivo reale.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M13-03","goal":"Rappresentare viste di un oggetto rispettando dimensioni e scala.","materials":["carta e matita","righello","materiali semplici indicati nella consegna, se realizzi il progetto"],"techniques":[{"name":"Tabella dimensioni-viste","how":"Prepara frontale L-H, alto L-P, laterale P-H con le misure reali e in scala.","why":"Aiuta a selezionare le due dimensioni visibili in ciascuna vista."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Ogni vista usa le due dimensioni corrette; La scala è applicata uniformemente; Le quote descrivono dimensioni reali. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Un blocco rettangolare è largo 6 cm, alto 4 cm e profondo 3 cm. Disegna in scala 1:1 vista frontale, dall’alto e laterale, indicandone dimensioni.","work":["Scelgo il fronte: larghezza 6 e altezza 4 → rettangolo 6 × 4 cm.","Dall’alto vedo larghezza e profondità: 6 × 3 cm. La vista laterale mostra profondità e altezza: 3 × 4 cm.","Scrivo il nome di ogni vista e conservo le stesse dimensioni comuni; non inserisco la profondità nella vista frontale."],"result":"Frontale 6 × 4 cm, dall’alto 6 × 3 cm, laterale 3 × 4 cm; scala 1:1."},"steps":[{"title":"Definisci il fronte","do":"Sul tuo oggetto indica larghezza, altezza e profondità prima delle viste.","help":"Una freccia può mostrare da quale lato guardi."},{"title":"Applica la scala","do":"Calcola le lunghezze disegnate prima di tracciare.","help":"1:2 significa metà della misura reale."},{"title":"Allinea e quota","do":"Mantieni dimensioni comuni coerenti e scrivi le misure reali nelle quote.","help":"La disposizione delle viste segue la convenzione richiesta dal docente; qui sono nominate separatamente."}],"transfer":{"task":"Blocco largo 8 cm, alto 6 cm, profondo 4 cm. Disegna le tre viste in scala 1:2 e indica dimensioni reali e disegnate.","check":"Frontale disegnata 4 × 3 cm, dall’alto 4 × 2 cm, laterale 2 × 3 cm. Quote reali: 8 × 6, 8 × 4, 4 × 6 cm. La scala dimezza il disegno, non l’oggetto."},"checks":["Ogni vista usa le due dimensioni corrette","La scala è applicata uniformemente","Le quote descrivono dimensioni reali"],"error":{"wrong":"Nella vista dall’alto disegno 6 × 4 come nel fronte.","why":"Dall’alto la seconda dimensione è profondità, non altezza.","fix":"Disegna 6 × 3 e controlla la tabella L-P."},"home":["Prima di disegnare l’oggetto assegnato compila una tabella delle misure di ogni vista.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Definisci il fronte","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa un modello di scatola e tre cornici etichettate; strumenti stabili per tracciare, lasciando al ragazzo la scelta delle dimensioni.","preserve":"Rappresentare viste di un oggetto rispettando dimensioni e scala.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Fai motivare una scelta e riduci i suggerimenti sull’ordine del lavoro; mantieni schemi e strumenti utili. Distingui funzionamento del progetto, qualità del disegno e manualità. Per realizzare oggetti usa solo materiali e strumenti autorizzati dal docente; le simulazioni su carta non attestano sicurezza di un dispositivo reale.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M13-04","goal":"Usare righello e squadra distinguendo linee di contorno, costruzione e quota.","materials":["carta e matita","righello","materiali semplici indicati nella consegna, se realizzi il progetto"],"techniques":[{"name":"Lista di convenzioni","how":"Tieni vicino al foglio tre campioni di linea: contorno, costruzione, quota.","why":"Rende visibile la funzione del tratto senza affidarsi alla sola memoria."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Righello e squadra hanno funzioni distinte; Contorno e costruzioni sono riconoscibili; Quote reali, unità e scala sono esplicite. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Disegna un quadrato di lato reale 40 mm in scala 1:1. Nella convenzione didattica qui adottata, usa contorno continuo marcato, costruzioni sottili e quote esterne sottili con estremi indicati. Non sono richieste altre convenzioni normative.","work":["Traccio i lati di 40 mm con righello e squadra, verificando perpendicolarità.","Tengo sottili le linee di costruzione; ripasso soltanto il contorno della figura finita.","Metto una linea di quota esterna parallela al lato, con estremi e numero 40; scrivo “quote in mm” e “scala 1:1”."],"result":"Quadrato con contorno distinto dalle costruzioni; quota esterna 40 e unità mm dichiarata; scala 1:1."},"steps":[{"title":"Scegli lo strumento","do":"Sul tuo disegno usa righello per misura e squadra per perpendicolari.","help":"Il righello non garantisce da solo l’angolo retto."},{"title":"Distingui i tratti","do":"Disegna costruzioni leggere e ripassa il contorno dopo il controllo.","help":"Non ripassare ogni linea indiscriminatamente."},{"title":"Applica le convenzioni","do":"Metti quote leggibili fuori dalla figura, unità e scala.","help":"Se il docente usa una convenzione diversa, seguila in modo coerente."}],"transfer":{"task":"Disegna un rettangolo reale 60 × 30 mm in scala 1:2, usando la stessa convenzione. Quanto misurano i lati disegnati? Quali numeri metti nelle quote?","check":"Disegno 30 × 15 mm. Quote reali 60 e 30, non 30 e 15. Scala 1:2; “quote in mm”; linee di quota esterne e contorno distinto."},"checks":["Righello e squadra hanno funzioni distinte","Contorno e costruzioni sono riconoscibili","Quote reali, unità e scala sono esplicite"],"error":{"wrong":"In scala 1:2 metto la quota 30 per il lato reale 60.","why":"La quota indica la misura reale, non quella ridotta sul foglio.","fix":"Scrivi 60 nella quota e 1:2 nella scala."},"home":["Sul tuo disegno fai tre controlli: tratti, quote reali, scala.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Scegli lo strumento","difficulty":"Il tratto è incerto e perdo la posizione dello strumento","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa righello/squadra con presa stabile e foglio fissato; modelli di tratti vicini alla zona di lavoro. Precisione del tratto e scelta della quota si osservano separatamente.","preserve":"Usare righello e squadra distinguendo linee di contorno, costruzione e quota.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Fai motivare una scelta e riduci i suggerimenti sull’ordine del lavoro; mantieni schemi e strumenti utili. Distingui funzionamento del progetto, qualità del disegno e manualità. Per realizzare oggetti usa solo materiali e strumenti autorizzati dal docente; le simulazioni su carta non attestano sicurezza di un dispositivo reale.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M13-05","goal":"Analizzare un oggetto collegando parti, funzione, materiali e limite.","materials":["carta e matita","righello","materiali semplici indicati nella consegna, se realizzi il progetto"],"techniques":[{"name":"Tabella parte-materiale-funzione","how":"Compila una riga per componente e poi unisci le funzioni nella spiegazione.","why":"Evita un semplice elenco senza comprensione del funzionamento."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Ogni parte ha funzione pertinente; Materiali noti e ignoti sono distinti; Il funzionamento e un limite sono espliciti. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Oggetto descritto: forbici scolastiche a punta arrotondata, con due lame metalliche, due anelli di plastica e un perno. Spiega parti e funzione; l’analisi non richiede usarle.","work":["Le lame metalliche tagliano nel loro uso previsto; gli anelli permettono la presa.","Il perno unisce le due parti e permette la rotazione relativa. La forza delle dita muove le lame attraverso gli anelli.","Limite: punta arrotondata non significa oggetto privo di rischi; uso solo secondo le istruzioni e autorizzazioni scolastiche."],"result":"Tabella: lame/metallo/taglio; anelli/plastica/presa; perno/collegamento/rotazione. Funzione complessiva: tagliare materiali adatti, non qualunque materiale."},"steps":[{"title":"Scomponi l’oggetto","do":"Nel tuo compito elenca le parti osservate e i materiali dichiarati.","help":"Non inventare materiale o meccanismo di parti nascoste."},{"title":"Collega parte e funzione","do":"Scrivi come ogni parte contribuisce al risultato.","help":"La funzione del perno non è tagliare."},{"title":"Descrivi uso e limite","do":"Spiega l’azione iniziale, il movimento e l’effetto, con un limite pertinente.","help":"Descrivere non richiede provare l’oggetto se non è autorizzato."}],"transfer":{"task":"Oggetto descritto: molletta da bucato con due leve di legno e una molla metallica. Spiega tre elementi, funzionamento e un limite.","check":"Le due leve di legno offrono presa e superfici di contatto; molla metallica collega e mantiene la pressione. Premendo le estremità la molletta si apre; rilasciando stringe nel suo uso previsto. Limite: non garantisce presa su ogni spessore o carico; non usarla su parti del corpo."},"checks":["Ogni parte ha funzione pertinente","Materiali noti e ignoti sono distinti","Il funzionamento e un limite sono espliciti"],"error":{"wrong":"Il perno serve a tagliare il foglio.","why":"Il taglio è svolto dalle lame, il perno permette il loro movimento relativo.","fix":"Correggi la riga del perno e collega rotazione e lame."},"home":["Analizza un oggetto del libro usando almeno tre righe parte-materiale-funzione.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Scomponi l’oggetto","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa un disegno etichettato o un’immagine con tre richiami; indica una parte per volta e puoi dettare la tabella.","preserve":"Analizzare un oggetto collegando parti, funzione, materiali e limite.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Fai motivare una scelta e riduci i suggerimenti sull’ordine del lavoro; mantieni schemi e strumenti utili. Distingui funzionamento del progetto, qualità del disegno e manualità. Per realizzare oggetti usa solo materiali e strumenti autorizzati dal docente; le simulazioni su carta non attestano sicurezza di un dispositivo reale.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M13-06","goal":"Progettare, realizzare e verificare un prodotto semplice rispetto a vincoli.","materials":["carta e matita","righello","materiali semplici indicati nella consegna, se realizzi il progetto"],"techniques":[{"name":"Prototipo e confronto con vincoli","how":"Prepara una lista di requisiti e verifica il modello prima e dopo la realizzazione.","why":"Collega le scelte al problema da risolvere."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Dimensioni e funzione sono esplicite; Il prototipo precede la realizzazione; La verifica indica che cosa è stato davvero provato. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Progetta un segnalibro in cartoncino di 15 × 4 cm, con nome del progetto e un foro facoltativo a 1 cm dal bordo superiore. Usa carta/righello per la prova; taglio e foro solo con strumenti autorizzati e aiuto previsto.","work":["Vincoli: rettangolo 15 × 4 cm, scritta leggibile; foro facoltativo che non indebolisca troppo il bordo. Disegno e segno misure prima di realizzare.","Prototipo su carta: traccio il rettangolo, posiziono titolo e punto del foro; verifico che la scritta stia nell’area.","Realizzazione autorizzata: riporto sul cartoncino e completo. Controllo misure, leggibilità e inserimento fra pagine senza danneggiarle; se manca autorizzazione consegno il prototipo su carta."],"result":"Progetto esemplificativo “Leggo qui”: rettangolo 15 × 4 cm, scritta centrale e foro facoltativo segnato a 1 cm dal bordo superiore. La prova di uso controlla i vincoli, non solo l’aspetto."},"steps":[{"title":"Scrivi i vincoli","do":"Sul tuo progetto indica dimensioni, funzione e condizioni di realizzazione.","help":"“Bello” non sostituisce “15 × 4 cm”."},{"title":"Costruisci il prototipo","do":"Prova prima su carta con quote e posizione degli elementi.","help":"Correggere qui evita rifare il prodotto finito."},{"title":"Realizza e verifica","do":"Usa solo strumenti autorizzati e confronta prodotto o prototipo con i vincoli.","help":"Se non realizzi, dichiara che il test di uso reale resta da fare."}],"transfer":{"task":"Progetta un’etichetta per una scatola: 8 × 3 cm, scritta “MATITE”, bordo libero di 0,5 cm e fissaggio previsto con nastro. Produci prima il prototipo su carta e specifica come lo verifichi.","check":"Rettangolo 8 × 3 cm; area interna utile 7 × 2 cm dopo margini di 0,5 cm su ogni lato. Scritta leggibile entro quell’area; fissaggio progettato senza coprirla. Verifica misure, margini e leggibilità; realizzazione solo autorizzata."},"checks":["Dimensioni e funzione sono esplicite","Il prototipo precede la realizzazione","La verifica indica che cosa è stato davvero provato"],"error":{"wrong":"Ho fatto il segnalibro largo 10 cm perché è più bello.","why":"Hai perso il vincolo di larghezza previsto.","fix":"Torna al rettangolo 15 × 4 cm oppure chiedi una modifica motivata del requisito prima di realizzare."},"home":["Sul tuo progetto scrivi tre vincoli e verifica prima il prototipo, poi il prodotto se realizzato.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Scrivi i vincoli","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa un foglio con riquadro delle quote e sequenza numerata; se la manualità interferisce, un adulto esegue il taglio mentre tu controlli progetto e misure.","preserve":"Progettare, realizzare e verificare un prodotto semplice rispetto a vincoli.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Fai motivare una scelta e riduci i suggerimenti sull’ordine del lavoro; mantieni schemi e strumenti utili. Distingui funzionamento del progetto, qualità del disegno e manualità. Per realizzare oggetti usa solo materiali e strumenti autorizzati dal docente; le simulazioni su carta non attestano sicurezza di un dispositivo reale.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M13-07","goal":"Documentare un progetto con decisioni, fasi, risultati e modifiche tracciabili.","materials":["carta e matita","righello","materiali semplici indicati nella consegna, se realizzi il progetto"],"techniques":[{"name":"Diario decisione-esito","how":"Usa una riga per problema, modifica e verifica nella sequenza del progetto.","why":"Rende ricostruibile il lavoro e il motivo delle scelte."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: I vincoli compaiono nella scheda; La modifica ha un motivo concreto; Esiti verificati e da verificare sono distinti. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Dati di progetto fittizio: etichetta per scatola, 8 × 3 cm, scritta MATITE, margini 0,5 cm. Primo prototipo: scritta troppo lunga; modifica: lettere più piccole. Versione finale: scritta entra nell’area 7 × 2 cm. Scrivi una scheda di documentazione.","work":["Registro obiettivo e vincoli con misure, titolo e area interna.","Sequenza: schizzo → prototipo → controllo → modifica delle lettere → verifica finale.","Distingui esito noto e ignoto: la scritta entra; tenuta del nastro non è ancora provata nei dati. Documento la modifica e il motivo."],"result":"Scheda: “Obiettivo: identificare la scatola. Vincoli: 8 × 3 cm, margini 0,5 cm. Primo problema: scritta fuori area. Modifica: lettere ridotte. Esito: MATITE entra in 7 × 2 cm. Da verificare: fissaggio.”"},"steps":[{"title":"Raccogli le versioni","do":"Sul tuo progetto conserva schizzo, prototipo e dati di controllo.","help":"Numero o data aiutano a distinguere le versioni senza dati personali."},{"title":"Spiega la modifica","do":"Scrivi problema → scelta → motivo.","help":"“Ho cambiato tutto” non permette di capire perché."},{"title":"Registra l’esito","do":"Separa vincoli rispettati, prove eseguite e verifiche ancora necessarie.","help":"Una foto mostra l’aspetto, non ogni proprietà di funzionamento."}],"transfer":{"task":"Progetto fittizio: segnalibro 12 × 3 cm, titolo LEGGO. Primo modello: titolo vicino al bordo; modifica: spostato al centro. Finale: misure corrette, prova fra pagine non ancora fatta. Documenta.","check":"Scheda con obiettivo, quote 12 × 3, sequenza e problema del titolo; modifica motivata “sposto al centro per lasciare spazio dal bordo”. Esito noto: misure corrette e titolo centrato. Da verificare: uso fra pagine. Non dichiarare riuscita una prova non eseguita."},"checks":["I vincoli compaiono nella scheda","La modifica ha un motivo concreto","Esiti verificati e da verificare sono distinti"],"error":{"wrong":"Scrivo “funziona perfettamente” senza prova di fissaggio.","why":"Non hai dati sulla tenuta.","fix":"Scrivi “scritta e dimensioni controllate; fissaggio da verificare”."},"home":["Nel tuo progetto conserva una modifica spiegata e una verifica ancora necessaria.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Raccogli le versioni","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa una scheda con cinque intestazioni e spazio per un disegno; puoi dettare motivi e risultati prima di trascriverli.","preserve":"Documentare un progetto con decisioni, fasi, risultati e modifiche tracciabili.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Fai motivare una scelta e riduci i suggerimenti sull’ordine del lavoro; mantieni schemi e strumenti utili. Distingui funzionamento del progetto, qualità del disegno e manualità. Per realizzare oggetti usa solo materiali e strumenti autorizzati dal docente; le simulazioni su carta non attestano sicurezza di un dispositivo reale.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M13-08","goal":"Leggere etichette e istruzioni e stimare consumo distinguendo potenza ed energia.","materials":["carta e matita","righello","materiali semplici indicati nella consegna, se realizzi il progetto"],"techniques":[{"name":"Lettura tecnica e controllo delle unità","how":"Usa tre riquadri etichetta/istruzioni/consumo e una riga W × h = Wh.","why":"Distingue dati tecnici, procedure e risultati quantitativi."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Potenza ed energia non sono confuse; Ore e giorni sono conteggiati correttamente; Divieti e dati mancanti sono espliciti. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Etichetta didattica di lampada: potenza 10 W. Istruzioni: spegnere prima di pulire; pulire con panno asciutto secondo le indicazioni del prodotto; non aprire il dispositivo. Uso previsto: 3 ore al giorno. Calcola energia giornaliera e individua due istruzioni; non eseguire manutenzione.","work":["Leggo 10 W come potenza, non energia totale. Uso E = P × t: 10 × 3 = 30 Wh = 0,03 kWh.","Estraggo due azioni dalle istruzioni: spegnere prima della pulizia; usare il panno indicato. Il divieto è non aprire il dispositivo.","Per cinque giorni uguali: 30 × 5 = 150 Wh = 0,15 kWh. Non ricavo il costo senza tariffa."],"result":"Consumo giornaliero 30 Wh = 0,03 kWh; cinque giorni 150 Wh = 0,15 kWh. Etichetta, istruzioni e calcolo hanno funzioni diverse."},"steps":[{"title":"Separa le informazioni","do":"Sul tuo testo marca dato tecnico, azione richiesta e divieto.","help":"W indica potenza; un’istruzione non è un numero di consumo."},{"title":"Calcola l’energia","do":"Scrivi potenza × ore e converti Wh in kWh dividendo per 1000.","help":"Somma le ore solo se l’uso è quello descritto."},{"title":"Controlla i limiti","do":"Conserva i divieti e indica quali dati mancano per altri calcoli.","help":"Non trasformare lettura di istruzioni in manutenzione reale."}],"transfer":{"task":"Etichetta didattica: lampada 8 W; uso 4 ore al giorno per 7 giorni. Istruzioni: scollegare secondo le indicazioni prima della manutenzione, non bagnare, non aprire. Calcola energia e scrivi un divieto e un dato mancante per il costo.","check":"8 × 4 = 32 Wh/giorno; 32 × 7 = 224 Wh = 0,224 kWh. Divieto: non bagnare oppure non aprire. Per il costo manca la tariffa applicabile; non si inventa un prezzo. Non eseguire le azioni di manutenzione per esercitarti."},"checks":["Potenza ed energia non sono confuse","Ore e giorni sono conteggiati correttamente","Divieti e dati mancanti sono espliciti"],"error":{"wrong":"10 W per tre ore = 30 W.","why":"Moltiplicando potenza per tempo ottieni energia.","fix":"Scrivi 30 Wh, poi 0,03 kWh."},"home":["Su un’etichetta del libro separa un dato, un divieto e un calcolo di consumo.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Separa le informazioni","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Trascrivi i dati in una tabella W/ore/giorni e lascia visibile 1000 Wh = 1 kWh; calcolatrice disponibile.","preserve":"Leggere etichette e istruzioni e stimare consumo distinguendo potenza ed energia.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Fai motivare una scelta e riduci i suggerimenti sull’ordine del lavoro; mantieni schemi e strumenti utili. Distingui funzionamento del progetto, qualità del disegno e manualità. Per realizzare oggetti usa solo materiali e strumenti autorizzati dal docente; le simulazioni su carta non attestano sicurezza di un dispositivo reale.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M13-09","goal":"Usare un programma, scrivere istruzioni e simulare un robot distinguendo ambienti e risultati.","materials":["carta e matita","righello","materiali semplici indicati nella consegna, se realizzi il progetto"],"techniques":[{"name":"Tracciamento dell’esecuzione","how":"Usa una tabella comando/posizione/orientamento e separa il risultato digitale dal percorso del robot.","why":"Permette di trovare il primo comando che produce un risultato inatteso."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Programma, algoritmo e robot sono distinti; Rotazione e spostamento seguono le definizioni; Risultati simulati e realmente verificati sono dichiarati. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Tre attività su carta: A descrivi come salvare un disegno digitale come progetto modificabile e come immagine; B scrivi un algoritmo per una griglia; C simula un robot. Griglia: righe 1-3 dall’alto, colonne 1-3 da sinistra. Robot in (riga 3,colonna 1), rivolto a nord; meta (1,3). Comandi: AVANTI di una casella, DESTRA rotazione di 90° senza spostamento.","work":["A: nel programma scelto usa il comando per salvare il progetto con nome “percorso”; poi il comando di esportazione per un’immagine. Le etichette esatte dipendono dal programma: il progetto conserva gli elementi modificabili, l’immagine non necessariamente.","B: algoritmo AVANTI, AVANTI, DESTRA, AVANTI, AVANTI. Traccia posizioni (3,1) → (2,1) → (1,1); rotazione verso est; → (1,2) → (1,3).","C: muovo un segnalino per i passi e ruoto una freccia per l’orientamento. Su robot reale comandi, sensori e ostacoli vanno verificati secondo il modello e il docente; qui è simulazione."],"result":"Procedura digitale descritta con salvataggio modificabile ed esportazione distinti. Algoritmo di cinque comandi raggiunge (1,3) rivolto a est nella griglia; non prova il comportamento di un robot reale."},"steps":[{"title":"Definisci l’ambiente","do":"Sul tuo compito indica programma digitale, algoritmo su carta o robot reale.","help":"Non dare per verificata un’azione digitale che hai soltanto descritta."},{"title":"Specifica i comandi","do":"Definisci punto iniziale, orientamento, meta e significato di ogni comando.","help":"DESTRA ruota: non sposta in una casella a destra."},{"title":"Simula e controlla","do":"Esegui un comando per volta segnando posizione e orientamento; per il digitale verifica l’output realmente prodotto.","help":"Se un robot reale si comporta diversamente, controlla istruzioni e condizioni del suo modello."}],"transfer":{"task":"Nuova griglia 3 × 3: robot in (1,3) rivolto a sud, meta (3,1). Usa AVANTI e DESTRA. Indica inoltre differenza fra salvare il progetto in un programma e stampare una pagina.","check":"AVANTI, AVANTI, DESTRA, AVANTI, AVANTI: (1,3) → (2,3) → (3,3), rotazione da sud a ovest, → (3,2) → (3,1). Salvataggio conserva un file per riaprirlo; stampa produce una pagina e non sostituisce il salvataggio. Per il programma reale verifica file riaperto e risultato della stampa separatamente."},"checks":["Programma, algoritmo e robot sono distinti","Rotazione e spostamento seguono le definizioni","Risultati simulati e realmente verificati sono dichiarati"],"error":{"wrong":"DESTRA sposta il robot alla casella destra senza ruotarlo.","why":"Nella definizione fornita il comando modifica solo orientamento.","fix":"Lascia la posizione invariata e ruota la freccia di 90°."},"home":["Per il tuo percorso registra comando, posizione e orientamento; per un programma controlla che il file salvato si riapra.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Definisci l’ambiente","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa un segnalino e una freccia fisica per distinguere posizione e orientamento; mostra un comando alla volta e registra la riga prima di proseguire.","preserve":"Usare un programma, scrivere istruzioni e simulare un robot distinguendo ambienti e risultati.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Fai motivare una scelta e riduci i suggerimenti sull’ordine del lavoro; mantieni schemi e strumenti utili. Distingui funzionamento del progetto, qualità del disegno e manualità. Per realizzare oggetti usa solo materiali e strumenti autorizzati dal docente; le simulazioni su carta non attestano sicurezza di un dispositivo reale.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M14-01","goal":"Rappresentare posizione e proporzioni di due oggetti osservati.","materials":["Carta, matita e gomma","Tazza cilindrica e libro chiuso; oppure la descrizione qui sotto"],"techniques":[{"name":"Bozzetto e revisione","how":"Prepara una prima versione seguendo questo vincolo: Sono riconoscibili i due oggetti e la loro posizione.","why":"Permette di controllare le scelte prima del prodotto finale."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Il rapporto tra le altezze corrisponde al modello.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Disegna una tazza a sinistra di un libro. Nella nostra immagine descritta la tazza è alta 8 cm e larga 6; il libro, alto 4 e largo 12, appoggia sullo stesso piano. Mantieni il rapporto delle altezze.","work":["Traccio la linea del tavolo e due ingombri: 6×8 cm e 12×4 cm.","Disegno il bordo della tazza come un'ellisse e il libro come un rettangolo; aggiungo il manico a sinistra.","Controllo: la tazza è alta il doppio del libro e le basi sono sulla stessa linea."],"result":"Bozzetto con tazza a sinistra, rapporto di altezza 2:1, base comune; manico fuori dall'ingombro del corpo."},"steps":[{"title":"Osserva gli ingombri","do":"Nel modello portato trova alto, largo e posizione prima dei dettagli.","help":"Segna quattro estremi di ogni oggetto."},{"title":"Costruisci le forme","do":"Disegna le forme semplici e poi aggiungi bordi e parti visibili.","help":"Per un oggetto curvo parti dall'asse centrale."},{"title":"Confronta le proporzioni","do":"Controlla due rapporti e l'appoggio nel modello e nel disegno.","help":"Copri i dettagli: gli ingombri devono già somigliare."}],"transfer":{"task":"Disegna dalla descrizione una bottiglia alta 12 cm accanto a una scatola alta 6 e larga 8; entrambe sul tavolo.","check":"Bottiglia alta il doppio della scatola, basi allineate, scatola larga 8 cm nella scala scelta; sono ammesse altre scale se mantengono i rapporti."},"checks":["Sono riconoscibili i due oggetti e la loro posizione.","Il rapporto tra le altezze corrisponde al modello.","Le basi appoggiano sullo stesso piano."],"error":{"wrong":"Libro alto quanto la tazza.","why":"Il modello indica un'altezza dimezzata.","fix":"Riduci l'ingombro del libro prima dei dettagli."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Tracciare il contorno","difficulty":"Mi affatico nel ripassare le linee.","categories":["trasversale"],"signal":"Il ragazzo cancella molte volte lo stesso tratto.","aid":"Usa un formato più grande, tratti brevi e appoggio stabile; valuta i rapporti, non la fermezza della mano.","preserve":"Rappresentare posizione e proporzioni di due oggetti osservati.","verify":"Confronta due tentativi con lo stesso criterio: Sono riconoscibili i due oggetti e la loro posizione. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M14-02","goal":"Tradurre un tema in tre scelte visive riconoscibili.","materials":["Foglio, matita e colori"],"techniques":[{"name":"Bozzetto e revisione","how":"Prepara una prima versione seguendo questo vincolo: Due elementi visivi sostengono il tema.","why":"Permette di controllare le scelte prima del prodotto finale."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: L'elemento principale è distinguibile.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Rappresenta «Una città più silenziosa» inserendo almeno due scelte che comunicano il tema, senza scrivere il titolo nel disegno.","work":["Elenco tre elementi: pista ciclabile, alberi, persone che camminano.","Metto una pista e due biciclette al centro, alberi ai lati e pedoni sul marciapiede.","Uso colori tenui e lascio spazio tra gli elementi per suggerire calma."],"result":"Disegno esemplificativo: strada con biciclette e pedoni, filare di alberi, colori tenui; la scelta dei mezzi e lo spazio sostengono il tema."},"steps":[{"title":"Decidi il messaggio","do":"Sul tema assegnato scrivi una frase: voglio far vedere che…","help":"Evita una lista di oggetti senza collegamento al tema."},{"title":"Progetta tre elementi","do":"Fai un bozzetto con elemento principale, spazio e colori.","help":"Cerchia i due elementi che rendono leggibile il tema."},{"title":"Realizza e motiva","do":"Completa il disegno e spiega due scelte visive.","help":"Confronta la spiegazione con quello che si vede."}],"transfer":{"task":"Rappresenta «Una piazza accogliente» con almeno due elementi che permettono alle persone di stare insieme.","check":"Criteri: presenza di uno spazio d'incontro e di un secondo elemento motivato, per esempio panchine e area di gioco; spiega in due frasi come comunicano accoglienza."},"checks":["Due elementi visivi sostengono il tema.","L'elemento principale è distinguibile.","La spiegazione cita dettagli presenti."],"error":{"wrong":"Disegno solo un cielo azzurro per la città silenziosa.","why":"Il cielo da solo non chiarisce che cosa rende silenziosa la città.","fix":"Aggiungi biciclette e pedoni e motiva il collegamento."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Preparare il bozzetto","difficulty":"Mi blocco perché non so da dove iniziare.","categories":["trasversale"],"signal":"Resta il foglio vuoto dopo aver letto la traccia.","aid":"Prova tre miniature da 4 cm; scegli quella che comunica due elementi del tema.","preserve":"Tradurre un tema in tre scelte visive riconoscibili.","verify":"Confronta due tentativi con lo stesso criterio: Due elementi visivi sostengono il tema. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M14-03","goal":"Usare linea, colore, volume e spazio per distinguere primo piano e sfondo.","materials":["Carta, matita e due colori"],"techniques":[{"name":"Bozzetto e revisione","how":"Prepara una prima versione seguendo questo vincolo: La luce mantiene la stessa direzione.","why":"Permette di controllare le scelte prima del prodotto finale."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Due indizi distinguono vicino e lontano.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Disegna due sfere: una grande in primo piano a sinistra e una piccola sullo sfondo a destra. La luce arriva dall'alto a sinistra. Usa contorno, ombra e sovrapposizione.","work":["Traccio un cerchio di 6 cm e uno di 3 cm, leggermente più in alto.","Tengo chiara la parte alta sinistra; scurisco gradualmente la parte bassa destra.","Aggiungo un piano e un'ombra a destra; uso un contorno più evidente per la sfera vicina."],"result":"Due sfere con dimensioni diverse e ombre coerenti con luce alta a sinistra; quella grande appare vicina per dimensione e contorno."},"steps":[{"title":"Indica la luce e lo spazio","do":"Sul compito segna con una freccia la luce e scegli che cosa sta davanti.","help":"La stessa luce deve valere per tutti gli oggetti."},{"title":"Costruisci i contrasti","do":"Varia linea, dimensione e chiaroscuro secondo la posizione.","help":"Fai una striscia di tre toni prima di ombreggiare."},{"title":"Controlla l'effetto","do":"Indica due dettagli che fanno leggere volume e profondità.","help":"Chiedi di indicare quale oggetto sembra più vicino."}],"transfer":{"task":"Disegna un cubo vicino e uno lontano, con luce da destra; usa almeno due indizi di profondità.","check":"Cubo vicino più grande; cubo lontano più piccolo e/o più alto nel foglio; facce a sinistra più scure delle facce illuminate a destra. Spiega gli indizi."},"checks":["La luce mantiene la stessa direzione.","Due indizi distinguono vicino e lontano.","Sono visibili almeno tre toni di chiaroscuro."],"error":{"wrong":"Scurisco a sinistra con luce da sinistra.","why":"Metto l'ombra nella parte illuminata senza una ragione.","fix":"Mantieni chiara la zona rivolta alla luce e scurisci il lato opposto."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Applicare il chiaroscuro","difficulty":"Non distinguo i toni che ho già usato.","categories":["trasversale"],"signal":"Le zone chiare e scure risultano tutte uguali.","aid":"Prepara tre campioni numerati chiaro, medio, scuro e confrontali con le zone.","preserve":"Usare linea, colore, volume e spazio per distinguere primo piano e sfondo.","verify":"Confronta due tentativi con lo stesso criterio: La luce mantiene la stessa direzione. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M14-04","goal":"Scegliere e usare una tecnica spiegando l'effetto ottenuto.","materials":["Carta, matita, pastelli","Ritagli di carta e colla; forbici solo se utilizzabili in sicurezza"],"techniques":[{"name":"Bozzetto e revisione","how":"Prepara una prima versione seguendo questo vincolo: Entrambe le tecniche richieste sono visibili.","why":"Permette di controllare le scelte prima del prodotto finale."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: La prova del materiale precede il lavoro.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Crea un paesaggio con montagna, lago e cielo usando collage per la montagna e pastello per lago e cielo. Fai prima una prova dei materiali.","work":["Su un angolo provo un tratto leggero e uno sovrapposto di pastello.","Strappo carta per due monti e li sovrappongo; lascio libera la zona del lago.","Coloro cielo e lago con tratti orizzontali e incollo i monti solo dopo la prova di posizione."],"result":"Paesaggio con bordi irregolari nei monti e tratti orizzontali nel lago; collage e pastello hanno ruoli diversi, spiegati."},"steps":[{"title":"Prova il materiale","do":"Per la tecnica assegnata prepara un campione prima del foglio finale.","help":"Confronta tratto leggero e sovrapposto oppure due modi di unire la carta."},{"title":"Scegli la sequenza","do":"Decidi le parti da fare prima, senza coprire quelle ancora da lavorare.","help":"Posiziona i ritagli prima di incollarli."},{"title":"Realizza e descrivi","do":"Completa il lavoro e nomina un effetto osservabile della tecnica.","help":"Non basta dire bello: indica bordi, trama o copertura."}],"transfer":{"task":"Realizza un albero con tronco a pastello e chioma a collage; indica l'effetto di ciascuna tecnica.","check":"Tronco leggibile attraverso linee o colore; chioma ottenuta con ritagli o strappi; spiega che il collage crea forme sovrapposte e il pastello permette tratti."},"checks":["Entrambe le tecniche richieste sono visibili.","La prova del materiale precede il lavoro.","La spiegazione collega tecnica ed effetto."],"error":{"wrong":"Incollo i monti sopra il lago appena colorato coprendolo tutto.","why":"La sequenza cancella una parte richiesta.","fix":"Prova prima i ritagli e lascia libero lo spazio del lago."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Manipolare i materiali","difficulty":"Tagliare mi richiede troppo tempo.","categories":["trasversale"],"signal":"Il tempo viene assorbito dai ritagli invece che dalle scelte compositive.","aid":"Usa carta strappata o forme già disponibili se il taglio non è l'obiettivo; non dedurre una difficoltà motoria dal DSA.","preserve":"Scegliere e usare una tecnica spiegando l'effetto ottenuto.","verify":"Confronta due tentativi con lo stesso criterio: Entrambe le tecniche richieste sono visibili. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M14-05","goal":"Realizzare un elaborato che rispetta tutti i vincoli della consegna.","materials":["Foglio A4, righello e colori"],"techniques":[{"name":"Bozzetto e revisione","how":"Prepara una prima versione seguendo questo vincolo: Tutti i dati obbligatori compaiono.","why":"Permette di controllare le scelte prima del prodotto finale."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Il numero di colori rispetta il limite.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Crea un manifesto A4 per lo scambio di libri: titolo «Scambia un libro», data inventata 12 maggio, aula 2, un'immagine di due libri, massimo tre colori.","work":["Trasformo la traccia in cinque caselle: formato, titolo, data, luogo, immagine; aggiungo il limite dei colori.","Faccio un bozzetto: titolo in alto, due libri al centro, data e aula in basso.","Uso nero, blu e arancione e spunto ogni vincolo sul manifesto."],"result":"Manifesto con «Scambia un libro», 12 maggio, aula 2, due libri riconoscibili e soltanto nero, blu, arancione."},"steps":[{"title":"Segna i vincoli","do":"Trascrivi i requisiti dell'elaborato assegnato in caselle da spuntare.","help":"Separa ciò che deve esserci da ciò che puoi scegliere."},{"title":"Distribuisci lo spazio","do":"Decidi in bozzetto dove stanno testo e immagini.","help":"Lascia margine e verifica la leggibilità del testo."},{"title":"Spunta la consegna","do":"Controlla ogni requisito sul prodotto, prima della decorazione finale.","help":"Indica con il dito dove è soddisfatto ogni vincolo."}],"transfer":{"task":"Crea un cartoncino per una mostra: titolo «Piccole forme», 18 giugno, aula 5, immagine di tre forme geometriche, due colori.","check":"Devono comparire titolo esatto, data, aula, tre forme e non più di due colori; gerarchia leggibile con titolo più evidente."},"checks":["Tutti i dati obbligatori compaiono.","Il numero di colori rispetta il limite.","Il titolo si distingue dalle informazioni secondarie."],"error":{"wrong":"Aggiungo un quarto colore per decorare.","why":"La consegna ammette al massimo tre colori.","fix":"Sostituisci il quarto colore con uno già usato."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Leggere i vincoli","difficulty":"Perdo un requisito mentre leggo.","categories":["dislessia"],"signal":"Il ragazzo omette un dato pur avendolo compreso oralmente.","aid":"Consegna in righe separate, lettura audio se scelta, e checklist con una casella per requisito.","preserve":"Realizzare un elaborato che rispetta tutti i vincoli della consegna.","verify":"Confronta due tentativi con lo stesso criterio: Tutti i dati obbligatori compaiono. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M14-06","goal":"Rielaborare un modello mantenendo un elemento e cambiandone due con uno scopo.","materials":["Carta e colori"],"techniques":[{"name":"Bozzetto e revisione","how":"Prepara una prima versione seguendo questo vincolo: L'elemento richiesto resta riconoscibile.","why":"Permette di controllare le scelte prima del prodotto finale."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Due cambiamenti hanno una motivazione.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Modello originale descritto: casa rettangolare con tetto triangolare, albero a sinistra e sole in alto. Trasformalo in una scena notturna mantenendo la casa.","work":["Mantengo rettangolo e tetto della casa.","Sostituisco sole con luna e cambio il cielo chiaro in blu scuro.","Aggiungo finestre gialle: il contrasto fa riconoscere la casa nella notte."],"result":"Scena notturna con casa riconoscibile, luna e cielo scuro; finestre luminose coerenti con la trasformazione."},"steps":[{"title":"Separa fisso e variabile","do":"Nel modello assegnato indica l'elemento da mantenere e ciò che puoi cambiare.","help":"Scrivi mantengo/cambio prima di disegnare."},{"title":"Prova due cambiamenti","do":"Prepara una miniatura che mostri la nuova idea.","help":"Ogni cambiamento deve servire allo scopo scelto."},{"title":"Confronta con il modello","do":"Indica una continuità e due trasformazioni nel lavoro finito.","help":"Non confondere rielaborare con copiare tutti i dettagli."}],"transfer":{"task":"Trasforma lo stesso modello in una scena ventosa, mantenendo la casa e cambiando due elementi.","check":"Casa riconoscibile; due cambiamenti legati al vento, per esempio chioma inclinata e nuvole in movimento; breve motivazione dei cambiamenti."},"checks":["L'elemento richiesto resta riconoscibile.","Due cambiamenti hanno una motivazione.","L'insieme comunica la nuova scena."],"error":{"wrong":"Cambio soltanto il colore del tetto per creare la notte.","why":"Il cambiamento non rende evidente la notte.","fix":"Modifica cielo e fonte luminosa, poi verifica l'effetto."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Confrontare le versioni","difficulty":"Mi dimentico che cosa doveva restare uguale.","categories":["trasversale"],"signal":"L'elemento da mantenere scompare nella seconda versione.","aid":"Tieni accanto modello e bozzetto e cerchia l'elemento fisso.","preserve":"Rielaborare un modello mantenendo un elemento e cambiandone due con uno scopo.","verify":"Confronta due tentativi con lo stesso criterio: L'elemento richiesto resta riconoscibile. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M14-07","goal":"Distinguere osservazione e interpretazione nella lettura di un'opera.","materials":["Carta, penna","Descrizione dell'immagine fornita"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Registro dati: una figura è separata dal gruppo; la sciarpa è l'unico elemento rosso.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: La lettura usa un dettaglio preciso.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Opera inventata «La panchina»: una figura sola siede a sinistra; tre figure parlano a destra; una panchina vuota sta al centro; colori grigi e una sciarpa rossa. Scrivi due osservazioni e un'interpretazione motivata.","work":["Registro dati: una figura è separata dal gruppo; la sciarpa è l'unico elemento rosso.","Propongo: la separazione può suggerire solitudine.","Sostengo l'ipotesi con la distanza tra le figure; non so che cosa pensino davvero."],"result":"Osservazioni: figura separata e contrasto rosso/grigio. Interpretazione possibile: solitudine, sostenuta dalla distanza; non è un fatto certo sul personaggio."},"steps":[{"title":"Raccogli ciò che vedi","do":"Per l'opera assegnata descrivi soggetti, posizione, colori e linee.","help":"Usa si vede prima di forse."},{"title":"Formula una lettura","do":"Scrivi una possibile idea o emozione e collegala a due dettagli.","help":"Segna come ipotesi ciò che non è direttamente visibile."},{"title":"Controlla i dati dell'opera","do":"Aggiungi autore, titolo e data soltanto se forniti da una fonte.","help":"Non inventare biografie per spiegare l'immagine."}],"transfer":{"task":"Opera inventata «Il ponte»: due figure ai lati opposti di un ponte, una mano tesa da ciascuna, cielo chiaro. Scrivi due dati e una lettura possibile.","check":"Dati: figure ai due lati e mani tese; possibile incontro/cooperazione motivato dalle mani. Altre letture sono accettabili se legate a un dettaglio."},"checks":["Osservazione e interpretazione sono separate.","La lettura usa un dettaglio preciso.","Dati mancanti restano dichiarati mancanti."],"error":{"wrong":"La figura è sicuramente triste.","why":"L'emozione è interpretata, non osservata direttamente.","fix":"Scrivi può suggerire tristezza perché è separata dal gruppo."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Descrivere l'immagine","difficulty":"Faccio fatica a scrivere tutte le osservazioni.","categories":["disgrafia"],"signal":"Le idee sono espresse a voce ma perse durante la trascrizione.","aid":"Registra parole chiave o usa dettatura scelta; mantieni le colonne dato e ipotesi.","preserve":"Distinguere osservazione e interpretazione nella lettura di un'opera.","verify":"Confronta due tentativi con lo stesso criterio: Osservazione e interpretazione sono separate. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M14-08","goal":"Collegare artista, stile e periodo usando soltanto dati documentati.","materials":["Schede fornite, carta e penna"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Segno 1780 per Valli e 1930 per Riva sulla linea del tempo.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Una caratteristica è collegata a un dettaglio.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Schede didattiche inventate: Ada Riva, 1900–1950, dipinto del 1930 con forme geometriche; Bruno Valli, 1750–1810, dipinto del 1780 con figure e abiti di corte. Ordina le opere e descrivi una differenza visiva, senza inventare un movimento.","work":["Segno 1780 per Valli e 1930 per Riva sulla linea del tempo.","Associo Riva alle forme geometriche e Valli alle figure di corte.","Distinguo descrizione visiva da nome di stile: le schede non danno un movimento artistico."],"result":"Ordine: Valli 1780, Riva 1930. Differenza: figure e abiti di corte contro forme geometriche; movimento non indicato."},"steps":[{"title":"Compila tre campi","do":"Per gli autori del libro registra artista, opera/data, caratteristiche dello stile documentate.","help":"Usa una riga per autore e cita la pagina."},{"title":"Ordina le date","do":"Disponi le opere nel tempo, separando data dell'opera da vita dell'autore.","help":"Non usare l'anno di nascita come anno del dipinto."},{"title":"Collega dati e immagine","do":"Spiega una caratteristica con un dettaglio visibile.","help":"Se il movimento manca, chiedi o consulta la fonte prima di nominarlo."}],"transfer":{"task":"Schede inventate: Lea Fiori, opera 1920 con campiture piatte; Nino Bosco, opera 1880 con sfumature. Ordina e confronta.","check":"Bosco 1880 precede Fiori 1920; differenza tra sfumature e campiture piatte. Non attribuire stili storici non forniti."},"checks":["Le date sono attribuite all'opera corretta.","Una caratteristica è collegata a un dettaglio.","Nomi di movimenti non documentati non sono inventati."],"error":{"wrong":"Scrivo 1900 come data dell'opera di Riva.","why":"È l'inizio della vita indicata, non la data dell'opera.","fix":"Riporta 1930 nel campo opera e 1900–1950 nel campo vita."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Ordinare le date","difficulty":"Scambio le cifre e l'ordine degli anni.","categories":["discalculia"],"signal":"Date copiate o ordinate diversamente dalla scheda.","aid":"Usa cartoncini con gli anni, confronta prima le centinaia e verifica sulla linea del tempo.","preserve":"Collegare artista, stile e periodo usando soltanto dati documentati.","verify":"Confronta due tentativi con lo stesso criterio: Le date sono attribuite all'opera corretta. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M14-09","goal":"Confrontare due immagini separando somiglianze, differenze e contesto.","materials":["Due descrizioni fornite, tabella a tre colonne"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Allineo gli stessi aspetti: uso della piazza, trasporti, fontana.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Le conclusioni sono sostenute da dettagli.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Immagini inventate: A, piazza del 1850 con mercato, carretti e fontana; B, stessa piazza nel 2020 con autobus, mercato e fontana. Trova una permanenza e due cambiamenti.","work":["Allineo gli stessi aspetti: uso della piazza, trasporti, fontana.","Mercato e fontana compaiono in entrambe; carretti e autobus differiscono.","Il cambio dei trasporti è documentato dalle immagini; non posso stabilire da solo se tutti vivano meglio."],"result":"Permanenze: mercato e fontana. Cambiamento: carretti/autobus; cambia anche il periodo. Per un secondo cambiamento visivo servirebbero altri dati: la consegna eccede le informazioni disponibili."},"steps":[{"title":"Allinea gli aspetti","do":"Per le immagini assegnate usa righe identiche: soggetti, spazio, materiali, uso.","help":"Una differenza richiede dati di entrambe le immagini."},{"title":"Collega al contesto","do":"Aggiungi le date o informazioni storiche fornite.","help":"Distingui ciò che si vede da una spiegazione da verificare."},{"title":"Controlla le conclusioni","do":"Conta somiglianze e differenze effettivamente sostenute.","help":"Se manca un dato, dichiaralo anziché completare per intuizione."}],"transfer":{"task":"A: edificio nel 1910 con portone in legno e cortile vuoto. B: nel 2025 stesso portone, rampa e panchine nel cortile. Trova una permanenza e due cambiamenti.","check":"Permanenza: portone. Cambiamenti: rampa aggiunta e panchine presenti. Le date situano il confronto senza dimostrare da sole le cause."},"checks":["Ogni confronto usa lo stesso aspetto.","Le conclusioni sono sostenute da dettagli.","Una richiesta non risolvibile è segnalata."],"error":{"wrong":"La piazza del 2020 è certamente più felice.","why":"Le immagini non documentano il benessere delle persone.","fix":"Descrivi autobus e carretti senza dedurre felicità."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Compilare il confronto","difficulty":"Perdo il punto passando da un'immagine all'altra.","categories":["trasversale"],"signal":"Confronta un dettaglio di A con un aspetto diverso di B.","aid":"Usa una tabella con la stessa riga per A e B e affronta un aspetto alla volta.","preserve":"Confrontare due immagini separando somiglianze, differenze e contesto.","verify":"Confronta due tentativi con lo stesso criterio: Ogni confronto usa lo stesso aspetto. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M14-10","goal":"Preparare scheda e presentazione di un bene culturale indicando come rispettarlo.","materials":["Scheda inventata, carta e penna"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Compilo nome, data, materiale, forma e funzione dalla scheda.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: La fonte o natura inventata dei dati è indicata.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Bene inventato: Ponte delle Querce, costruito nel 1890, pietra, tre archi, attraversa il torrente Lume, percorso pedonale. Prepara una scheda e una presentazione di 30 secondi con una cura appropriata.","work":["Compilo nome, data, materiale, forma e funzione dalla scheda.","Scelgo tre punti per l'orale: nome/data, tre archi in pietra, passaggio pedonale.","Propongo di non scrivere sulla pietra e di seguire il percorso segnalato."],"result":"Scheda completa dei cinque dati. Presentazione: «Il Ponte delle Querce è del 1890. Ha tre archi in pietra sul torrente Lume e serve ai pedoni. Lo rispettiamo evitando scritte e seguendo il percorso»."},"steps":[{"title":"Raccogli dati e fonte","do":"Per il bene assegnato compila nome, luogo, data, materiale, funzione; scrivi la fonte.","help":"Per una ricerca distingui fonte consultata e dato non trovato."},{"title":"Adatta il formato","do":"Nella scheda usa campi; nella presentazione ordina tre punti e un'immagine descritta.","help":"Una presentazione non è la lettura di tutti i campi."},{"title":"Proponi una cura","do":"Collega una regola al bene e alle indicazioni del luogo.","help":"Le norme reali del sito si verificano prima della visita."}],"transfer":{"task":"Bene inventato: Fontana del Sole, 1920, bronzo, vasca circolare, piazza Alba. Fai una scheda, tre frasi orali e una cura.","check":"Scheda e orale riportano nome, anno, materiale, forma, luogo; cura motivata, per esempio non gettare rifiuti nella vasca. Non inventare autore o acqua potabile."},"checks":["Scheda e orale conservano i dati essenziali.","La fonte o natura inventata dei dati è indicata.","La cura proposta è pertinente al bene."],"error":{"wrong":"Dico che la fontana è potabile perché contiene acqua.","why":"La scheda non fornisce questa informazione.","fix":"Non proporre di bere; verifica un'indicazione ufficiale per un luogo reale."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Preparare la presentazione"
