erva pastora e guado."},"checks":["Usi i segnali temporali.","Distingui ordine narrativo e cronologico.","Mantieni il legame perdita-ritrovamento."],"error":{"wrong":"Metto la nave riparata prima del danno perché è nella prima frase.","why":"Segui l'ordine del racconto, non degli eventi.","fix":"Parti da il giorno prima e numera di nuovo."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Ordina le azioni","difficulty":"Scambio ieri, oggi e prima.","categories":["trasversale"],"signal":"Inverti riparazione e danno.","aid":"Disegna tre caselle con etichette temporali e metti una sola azione in ciascuna.","preserve":"Ordinare e riassumere eventi epici distinguendo ordine del racconto e cronologia.","verify":"Verifica la sequenza nel nuovo episodio."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. L'uso di un nome epico non rende il passo una citazione autentica; esplicita sempre questa distinzione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M03-03","goal":"Parafrasare un passo epico o letterario mantenendo soggetti, azioni e registro comprensibile.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Riordino di frase","how":"Ricostruisci chi compie l'azione e su che cosa.","why":"Scioglie inversioni."},{"name":"Lessico spiegato","how":"Sostituisci termini elevati con equivalenti contestuali.","why":"Conserva il significato."}],"example":{"task":"Passo epico originale: «Al duce porse il giovane la spada, ché difendesse il ponte». Glossario: duce = comandante; porse = diede; ché = affinché. Parafrasa.","work":["Il giovane è chi dà la spada.","Il comandante la riceve.","La finalità è permettere al comandante di difendere il ponte."],"result":"Il giovane diede la spada al comandante affinché questi difendesse il ponte."},"steps":[{"title":"Identifica le azioni","do":"Trova verbi e soggetti anche se l'ordine è insolito.","help":"Il giovane porse; il duce difendesse."},{"title":"Sciogli il lessico","do":"Usa glossario e contesto per parole e connettivi.","help":"Ché qui introduce uno scopo."},{"title":"Riscrivi e verifica","do":"Confronta ogni azione e relazione col passo.","help":"Non trasformare lo scopo in un evento già riuscito."}],"transfer":{"task":"Passo originale: «Alla riva giunse il viandante, stanco per il lungo cammino». Glossario: viandante = persona che viaggia a piedi. Parafrasa.","check":"La persona che viaggiava a piedi arrivò alla riva, stanca per il lungo cammino; conserva luogo e causa della stanchezza."},"checks":["I soggetti sono corretti.","Mantieni scopo o causa.","Non aggiungi esiti assenti."],"error":{"wrong":"Il comandante diede la spada al giovane.","why":"L'inversione ti ha fatto scambiare i ruoli.","fix":"Metti il giovane prima di diede e comandante dopo a."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Identifica le azioni","difficulty":"Le frasi lunghe con inversioni mi confondono.","categories":["dislessia"],"signal":"Attribuisci il verbo al nome più vicino.","aid":"Evidenzia ciascun verbo e collega il suo soggetto con una freccia; ascolta una lettura se utile.","preserve":"Parafrasare un passo epico o letterario mantenendo soggetti, azioni e registro comprensibile.","verify":"Verifica i ruoli prima e dopo la parafrasi."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Per termini senza glossario consulta il manuale o una fonte lessicale; non improvvisare equivalenze storiche.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M03-04","goal":"Analizzare una scelta dell'eroe come conflitto fra valori e conseguenze.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Mappa delle alternative","how":"Elenca scelta possibile, valore e costo.","why":"Rende visibile il conflitto."},{"name":"Argomentazione dal testo","how":"Motiva il valore con azioni e parole.","why":"Evita giudizi morali automatici."}],"example":{"task":"Episodio originale: «La comandante può inseguire il nemico o soccorrere i compagni feriti. Dice: “La vittoria non vale il loro abbandono” e resta a proteggerli». Analizza il conflitto.","work":["Alternative: inseguire per ottenere vittoria; restare per soccorrere.","La frase esplicita la priorità data alla cura dei compagni.","Conseguenza narrata: resta; la cattura del nemico non è indicata."],"result":"Il conflitto è fra vittoria e tutela dei compagni. La comandante privilegia la tutela, rinunciando all'inseguimento; non sappiamo l'esito della guerra."},"steps":[{"title":"Individua le alternative","do":"Scrivi due azioni realmente possibili nel passo.","help":"Evita una scelta inventata fuori scena."},{"title":"Collega valori e costi","do":"Spiega ciò che ogni opzione tutela e rischia.","help":"Restare tutela feriti ma interrompe l'inseguimento."},{"title":"Motiva l'analisi","do":"Cita frase o azione e limita la conclusione.","help":"Non dedurre la vittoria finale."}],"transfer":{"task":"«Un messaggero può tenere per sé una ricompensa o dividerla con chi lo ha aiutato. La divide e dice: “Non sono arrivato da solo”». Quale conflitto?","check":"Guadagno personale contro riconoscimento dell'aiuto/condivisione; la divisione e la frase sostengono il secondo valore."},"checks":["Indichi entrambe le opzioni.","Colleghi valori ad azioni.","Distingui costo ed esito noto."],"error":{"wrong":"È vigliacca perché non insegue.","why":"È un giudizio che ignora la scelta di proteggere.","fix":"Descrivi il conflitto e motiva il giudizio con il testo."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Collega valori e costi","difficulty":"Valore e conseguenza mi sembrano la stessa cosa.","categories":["trasversale"],"signal":"Scrivi vittoria sia come scelta sia come motivo senza distinguerli.","aid":"Usa tre colonne: azione, ciò che tutela, possibile costo.","preserve":"Analizzare una scelta dell'eroe come conflitto fra valori e conseguenze.","verify":"Verifica se le colonne contengono informazioni diverse."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non trasformare la discussione letteraria in valutazione clinica delle scelte personali del ragazzo.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M03-05","goal":"Riconoscere indizi di genere senza attribuirlo a un singolo tratto isolato.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Lista di indizi","how":"Cerca personaggi, azioni, tono e funzione del testo.","why":"Usa più elementi."},{"name":"Confronto con definizioni","how":"Collega indizi alla definizione del genere nel manuale.","why":"Evita classificazioni meccaniche."}],"example":{"task":"Testo originale: «La guerriera guidò il popolo oltre il passo; il cantore narrò il suo gesto solenne e l'intervento della dea che fermò la neve». È costruito come episodio epico: indica tre indizi.","work":["Gesto eroico con effetto sul popolo.","Tono solenne e presenza del cantore.","Intervento divino nella vicenda."],"result":"I tre indizi rendono il testo compatibile con un episodio epico; la sola presenza di una guerriera non basterebbe."},"steps":[{"title":"Leggi la definizione","do":"Prendi dal manuale le caratteristiche del genere richiesto.","help":"Distingui mito, epica e racconto fantastico."},{"title":"Cerca più indizi","do":"Sottolinea azioni, tono e funzione sociale.","help":"Guida del popolo e intervento divino sono diversi indizi."},{"title":"Motiva e limita","do":"Spiega la classificazione e ciò che non è sufficiente.","help":"Un eroe può comparire anche in un fumetto."}],"transfer":{"task":"Testo originale: «Un essere primordiale separò terra e cielo; il popolo racconta così l'origine del mondo». Quale caratteristica rimanda al mito?","check":"Spiegazione fantastica dell'origine del mondo e azione di un essere primordiale; non è una spiegazione scientifica."},"checks":["Usi più indizi quando disponibili.","Citi la definizione pertinente.","Non classifichi da un solo nome."],"error":{"wrong":"Ogni testo con una dea è automaticamente epica.","why":"Un personaggio divino può comparire in generi diversi.","fix":"Controlla funzione, azioni e tono oltre al personaggio."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Leggi la definizione","difficulty":"Ricordo le definizioni ma non so usarle.","categories":["trasversale"],"signal":"Ripeti la definizione senza esempi.","aid":"Accosta ogni caratteristica a una frase del passo.","preserve":"Riconoscere indizi di genere senza attribuirlo a un singolo tratto isolato.","verify":"Verifica se trovi una prova per ciascun criterio."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Il testo breve consente solo una classificazione motivata locale; confronta l'opera e il contesto quando disponibili.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M03-06","goal":"Confrontare personaggi, temi o versioni su criteri comuni e differenze verificabili.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Tabella comparativa","how":"Usa lo stesso criterio per le due versioni o figure.","why":"Evita confronti asimmetrici."},{"name":"Sintesi di somiglianze e differenze","how":"Concludi con prove da entrambe.","why":"Mostra il rapporto fra testi."}],"example":{"task":"Due versioni originali. A: «L'eroe attraversa il fiume da solo per portare il messaggio». B: «L'eroina chiede una barca e attraversa con il villaggio per portare il messaggio». Confronta scopo, strategia e possibile tema.","work":["Scopo uguale: consegnare un messaggio.","A agisce sola; B cerca mezzo e collaborazione.","Temi possibili: iniziativa individuale in A, cooperazione in B."],"result":"Entrambi affrontano un ostacolo per comunicare; cambiano strategia e ruolo del gruppo. I temi proposti derivano dal contrasto solo/con il villaggio."},"steps":[{"title":"Scegli l'oggetto","do":"Chiarisci se confronti personaggi, temi o versioni.","help":"Puoi applicare criteri diversi, ma identici per i due testi."},{"title":"Raccogli le prove","do":"Compila scopo, azione e ruolo degli altri.","help":"Non dedurre abilità non dichiarate."},{"title":"Scrivi il confronto","do":"Unisci somiglianza e differenza con riferimenti.","help":"Evita migliore senza criterio."}],"transfer":{"task":"A: «Milo restituisce il dono al re perché lo ritiene ingiusto». B: «Lia conserva il dono e lo divide con gli esclusi». Confronta risposta all'ingiustizia.","check":"Tema comune: ingiustizia del dono; strategie diverse: rifiuto/restituzione contro ridistribuzione. La motivazione di Lia è inferita dalla divisione con gli esclusi."},"checks":["Confronti lo stesso aspetto.","Citi entrambi i passi.","Segnali inferenze e dati."],"error":{"wrong":"A è coraggioso e B è donna: questo è il confronto.","why":"Sono criteri diversi e il coraggio va motivato.","fix":"Confronta come entrambi superano il fiume."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Raccogli le prove","difficulty":"Dimentico una versione quando leggo l'altra.","categories":["trasversale"],"signal":"Usi prove solo da A.","aid":"Affianca due schede e completa una sola riga di criterio per volta.","preserve":"Confrontare personaggi, temi o versioni su criteri comuni e differenze verificabili.","verify":"Osserva se ogni differenza ha una prova per lato."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Le versioni sono create per l'esercizio; non presentarle come varianti storiche documentate.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M03-07","goal":"Collegare autore, opera e contesto usando un dossier e distinguendo informazioni mancanti.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Scheda di relazioni","how":"Scrivi autore→opera→contesto con un legame esplicito.","why":"Organizza i dati."},{"name":"Controllo delle fonti","how":"Associa ogni dato al documento che lo fornisce.","why":"Evita biografie inventate."}],"example":{"task":"Dossier interamente inventato: «L'autrice Nora Valdi, nata nel 1870, pubblica nel 1905 il racconto Il telaio. Una nota del dossier descrive una città dove molte famiglie lavorano nei laboratori tessili. Il racconto ha come protagonista un'apprendista tessitrice». Collega i dati.","work":["Autrice: Nora Valdi; opera: Il telaio, 1905.","Contesto del dossier: lavoro tessile cittadino.","Il mestiere della protagonista collega opera e ambiente; il dossier non prova una esperienza personale dell'autrice."],"result":"Nel dossier inventato, Nora Valdi pubblica Il telaio nel 1905. La protagonista tessitrice richiama il contesto di laboratori tessili descritto nella nota; non sappiamo se l'autrice abbia svolto quel mestiere."},"steps":[{"title":"Raccogli i dati certi","do":"Annota autore, opera, date e documento di provenienza.","help":"Sul compito reale usa manuale e scheda bibliografica."},{"title":"Collega il contesto","do":"Individua un elemento dell'opera coerente con il contesto documentato.","help":"Distingui somiglianza e prova di influenza."},{"title":"Segnala i vuoti","do":"Scrivi non indicato per informazioni mancanti.","help":"Non dedurre biografia dalla protagonista."}],"transfer":{"task":"Dossier inventato: «Luca Morelli pubblica Il porto nel 1932; il protagonista è un marinaio. La nota descrive commercio marittimo nella città rappresentata». Compila autore-opera-contesto e un limite.","check":"Luca Morelli→Il porto (1932)→commercio marittimo/protagonista marinaio. Non sono indicate nascita, esperienza professionale né causa della scelta narrativa."},"checks":["Ogni dato viene dal dossier.","Il legame col contesto è esplicito.","Non inventi biografia."],"error":{"wrong":"Nora era tessitrice perché lo è la protagonista.","why":"Un personaggio non prova la biografia dell'autrice.","fix":"Segna mestiere dell'autrice non indicato."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Raccogli i dati certi","difficulty":"Nomi e date si mescolano.","categories":["dislessia"],"signal":"Attribuisci la data dell'opera alla nascita.","aid":"Usa righe etichettate autore/nascita/opera/pubblicazione e riporta il dato nella sola riga pertinente.","preserve":"Collegare autore, opera e contesto usando un dossier e distinguendo informazioni mancanti.","verify":"Verifica l'associazione nel secondo dossier."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Nomi e opere fittizi allenano la procedura e non vanno studiati come storia letteraria; per autori reali servono fonti reali.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M03-08","goal":"Trasformare informazioni letterarie in scheda, mappa, risposta o esposizione coerente.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Selezione per prodotto","how":"Scegli i dati in base alla forma richiesta.","why":"Evita un unico formato per ogni compito."},{"name":"Relazioni verbalizzate","how":"Spiega con parole le frecce e i collegamenti.","why":"Controlla il senso della mappa."}],"example":{"task":"Episodio originale: «Il re chiude il pozzo al villaggio. L'eroina Talia lo convince a riaprirlo mostrando che anche il palazzo dipende dalla stessa acqua». Produci scheda, mappa, risposta a come convince? e avvio orale.","work":["Scheda: re e Talia; problema: pozzo chiuso; soluzione: argomento della dipendenza comune.","Mappa: chiusura→mancanza d'acqua; dipendenza condivisa→riapertura.","Risposta e avvio orale scelgono il nesso decisivo."],"result":"Scheda: Talia, re, pozzo, chiusura/riapertura. Mappa: palazzo e villaggio→dipendono→stessa acqua. Risposta: Talia mostra al re che anche il palazzo dipende dal pozzo. Avvio: «Questo episodio presenta un conflitto sull'acqua risolto con un argomento»."},"steps":[{"title":"Leggi la richiesta","do":"Distingui scheda, mappa, risposta ed esposizione.","help":"La scheda elenca dati; la risposta seleziona ciò che viene chiesto."},{"title":"Seleziona e collega","do":"Estrai personaggi, problema e relazione centrale.","help":"Nella mappa nomina il significato delle frecce."},{"title":"Produci e verifica","do":"Adatta la forma e ricostruisci il senso leggendo il prodotto.","help":"Nell'esposizione usa i nodi come scaletta, non leggere solo nomi."}],"transfer":{"task":"«Il villaggio divide il raccolto; Iri segnala che gli anziani non hanno ricevuto nulla. Il capo corregge la divisione». Crea una mappa e rispondi perché il capo interviene?","check":"Mappa: anziani esclusi→segnalazione di Iri→divisione corretta. Risposta: interviene perché Iri segnala l'esclusione degli anziani; la segnalazione è il nesso richiesto."},"checks":["Il prodotto corrisponde alla consegna.","I collegamenti sono nominati.","La risposta riprende il nesso richiesto."],"error":{"wrong":"Nella mappa scrivo solo pozzo, re, Talia senza legami.","why":"I nomi non spiegano il conflitto.","fix":"Aggiungi chiude, dipende da e convince a riaprire."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Seleziona e collega","difficulty":"Ricopiare la mappa mi fa perdere i collegamenti.","categories":["disgrafia"],"signal":"I nodi sono presenti ma le frecce spariscono.","aid":"Usa tre riquadri già tracciati e scrivi solo etichette e verbi di relazione.","preserve":"Trasformare informazioni letterarie in scheda, mappa, risposta o esposizione coerente.","verify":"Verifica se sai spiegare ogni freccia oralmente."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non assumere che una mappa aiuti tutti; confronta con una breve scaletta e conserva il formato utile.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M04-01","goal":"Scrivere e controllare un breve dettato applicando una regola ortografica mirata.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Controllo per bersaglio","how":"Rileggi una volta per apostrofi e una per accenti.","why":"Riduce controlli indistinti."},{"name":"Regola con contrasto","how":"Confronta un esempio corretto e uno simile scorretto.","why":"Rende esplicita la scelta."}],"example":{"task":"Un adulto legge prima tutta la frase, poi piccoli gruppi e infine tutta la frase: «Un'amica è arrivata: ha portato un po' di pane». Scrivila e controlla un'amica, è, ha e po'.","work":["Un'amica ha apostrofo: una perde la a davanti a vocale.","È verbo essere richiede accento; ha verbo avere richiede h.","Po' è troncamento di poco e usa apostrofo, non accento."],"result":"«Un'amica è arrivata: ha portato un po' di pane»."},"steps":[{"title":"Ascolta il significato","do":"Chiedi una prima lettura intera e riconosci la scena.","help":"Poi usa gruppi brevi concordati."},{"title":"Scrivi per gruppi","do":"Ripeti mentalmente il gruppo e scrivilo prima del successivo.","help":"Non richiedere contemporaneamente rapidità e controllo completo."},{"title":"Controlla una regola","do":"Rivedi apostrofi, poi accenti e h dei verbi.","help":"Motiva una correzione usando la frase."}],"transfer":{"task":"Dettato con la stessa procedura: «Un amico ha un po' di fretta, ma è gentile».","check":"Un amico senza apostrofo (maschile); ha con h; po' con apostrofo; è con accento; virgola prima di ma accettabile come nel modello."},"checks":["Distingui un amico e un'amica.","Scrivi correttamente è e ha.","Usi po' senza accento."],"error":{"wrong":"Un'amico à un pò di fretta.","why":"Un maschile non ha apostrofo; ha richiede h; po' richiede apostrofo.","fix":"Correggi in un amico ha un po' di fretta."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Controlla una regola","difficulty":"Rileggo ma non vedo gli errori ortografici.","categories":["disortografia"],"signal":"Gli stessi bersagli restano errati dopo una rilettura globale.","aid":"Evidenzia solo le quattro forme bersaglio e usa una mini scheda di regola; separa questa prova dalla produzione di contenuti.","preserve":"Scrivere e controllare un breve dettato applicando una regola ortografica mirata.","verify":"Conta le forme bersaglio corrette e le correzioni motivate."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Il dettato non diagnostica un disturbo; eventuali strumenti o tempi diversi vanno concordati in base all'obiettivo.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M04-02","goal":"Classificare parole nel contesto e indicarne le caratteristiche grammaticali.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Domande per categoria","how":"Chiedi se la parola nomina, sostituisce, qualifica o esprime un'azione.","why":"Parte dalla funzione nel contesto."},{"name":"Analisi graduata","how":"Aggiungi genere, numero e altri tratti solo dopo la categoria.","why":"Evita etichette sovrapposte."}],"example":{"task":"Analizza tutte le parole di «Le piccole api volano».","work":["Le: articolo determinativo femminile plurale.","Piccole: aggettivo qualificativo femminile plurale, grado positivo.","Api: nome comune di animale femminile plurale; volano: verbo volare, indicativo presente, terza persona plurale, prima coniugazione."],"result":"Le = articolo; piccole = aggettivo; api = nome; volano = verbo. Genere/numero concordano nel gruppo le piccole api."},"steps":[{"title":"Osserva la frase","do":"Leggi la parola insieme a quelle vicine.","help":"La categoria va riconosciuta nel suo uso."},{"title":"Assegna la categoria","do":"Usa una domanda e motiva la scelta.","help":"Piccole qualifica api."},{"title":"Completa i tratti","do":"Indica tratti richiesti e controlla gli accordi.","help":"Non attribuire genere al verbo volano."}],"transfer":{"task":"Analizza «Il gatto dorme».","check":"Il: articolo determinativo maschile singolare; gatto: nome comune di animale maschile singolare; dorme: verbo dormire, terza coniugazione, indicativo presente, terza persona singolare."},"checks":["Classifichi ogni parola.","Indichi tratti pertinenti alla categoria.","Controlli genere e numero degli accordi."],"error":{"wrong":"Volano è un nome plurale perché termina in o.","why":"La terminazione non basta: qui esprime l'azione delle api.","fix":"Riconosci il verbo volare e analizza persona e tempo."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Completa i tratti","difficulty":"Le molte caratteristiche si mescolano.","categories":["trasversale"],"signal":"Metti il tempo verbale nella scheda del nome.","aid":"Usa colonne categoria e tratti, con righe diverse per nome e verbo.","preserve":"Classificare parole nel contesto e indicarne le caratteristiche grammaticali.","verify":"Verifica se compili solo i tratti pertinenti."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Per classificazioni controverse adotta il modello del manuale del ragazzo e dichiara le alternative.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M04-03","goal":"Riconoscere e produrre forme verbali indicando modo, tempo e persona.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Scomposizione della forma","how":"Distingui ausiliare e participio nei tempi composti.","why":"Evita di contare due verbi indipendenti."},{"name":"Recupero con controllo","how":"Produci una forma dal pronome e verifica sulla tavola.","why":"Allena scelta e autocorrezione."}],"example":{"task":"Analizza «noi avevamo letto» e trasformalo al futuro semplice.","work":["Avevamo letto è una sola forma composta del verbo leggere.","Modo indicativo, tempo trapassato prossimo, prima persona plurale.","Futuro semplice alla stessa persona: noi leggeremo."],"result":"Avevamo letto: leggere, seconda coniugazione, indicativo trapassato prossimo, prima persona plurale; futuro: leggeremo."},"steps":[{"title":"Trova la forma intera","do":"Unisci ausiliare e participio quando costituiscono un tempo composto.","help":"Non separare avevamo da letto."},{"title":"Identifica i tratti","do":"Collega infinito, modo, tempo, persona e numero.","help":"Il pronome noi aiuta a verificare la persona."},{"title":"Coniuga e confronta","do":"Produci la forma richiesta e controlla la tavola solo dopo il tentativo.","help":"Mantieni persona e numero nella trasformazione."}],"transfer":{"task":"Analizza «voi avete scritto» e trasformalo all'imperfetto indicativo.","check":"Scrivere, seconda coniugazione, indicativo passato prossimo, seconda persona plurale; imperfetto: voi scrivevate."},"checks":["Consideri la forma composta intera.","Riconosci modo e tempo.","Conservi persona e numero."],"error":{"wrong":"Avevamo letto è imperfetto perché avevamo lo è.","why":"L'ausiliare da solo non determina il nome dell'intera forma composta.","fix":"Considera ausiliare all'imperfetto più participio: trapassato prossimo."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Identifica i tratti","difficulty":"Leggendo la tavola salto da una persona all'altra.","categories":["dislessia"],"signal":"Copi la forma della riga vicina.","aid":"Copri le righe non usate e allinea pronome e forma con un segnariga.","preserve":"Riconoscere e produrre forme verbali indicando modo, tempo e persona.","verify":"Verifica che persona e numero siano conservati."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. L'uso della tavola compensativa resta possibile; valuta separatamente riconoscimento e recupero senza tavola.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M04-04","goal":"Individuare soggetto, predicato e complementi in una frase semplice.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Partenza dal predicato","how":"Trova il verbo e chiedi chi compie o subisce l'azione.","why":"Organizza le relazioni."},{"name":"Domande di relazione","how":"Associa i gruppi a chi?, che cosa?, a chi?, dove?.","why":"Evita analisi parola per parola."}],"example":{"task":"Analizza «Ieri Sara ha dato un libro a Luca in biblioteca».","work":["Predicato verbale: ha dato; soggetto: Sara.","Che cosa ha dato? un libro, complemento oggetto. A chi? a Luca, complemento di termine.","Ieri: tempo determinato; in biblioteca: stato in luogo."],"result":"Sara soggetto; ha dato predicato verbale; un libro oggetto; a Luca termine; ieri tempo determinato; in biblioteca stato in luogo."},"steps":[{"title":"Trova il predicato","do":"Individua l'intera forma verbale.","help":"Ha dato è un unico predicato."},{"title":"Collega i gruppi","do":"Trova soggetto e rispondi alle domande del verbo.","help":"Non chiamare Luca soggetto perché è una persona."},{"title":"Nomina e verifica","do":"Assegna complementi ai gruppi e rileggi le relazioni.","help":"Ieri risponde quando, non dove."}],"transfer":{"task":"«Oggi Paolo scrive una lettera alla nonna in cucina». Analizza.","check":"Paolo soggetto; scrive predicato verbale; una lettera oggetto; alla nonna termine; oggi tempo determinato; in cucina stato in luogo."},"checks":["Identifichi il predicato completo.","Distingui soggetto e destinatario.","Analizzi gruppi di parole."],"error":{"wrong":"A Luca è complemento oggetto.","why":"La domanda pertinente è a chi, non che cosa.","fix":"Assegna termine ad a Luca e oggetto a un libro."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Collega i gruppi","difficulty":"Le tante domande mi confondono.","categories":["trasversale"],"signal":"Assegni etichette senza legame col verbo.","aid":"Disegna il verbo al centro e collega una domanda alla volta al gruppo corrispondente.","preserve":"Individuare soggetto, predicato e complementi in una frase semplice.","verify":"Verifica se sai dire quale domanda sostiene ogni etichetta."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Le domande sono indizi, non un algoritmo universale; usa il modello del manuale nei casi ambigui.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M04-05","goal":"Dividere un periodo in proposizioni e riconoscere relazioni di coordinazione e subordinazione.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Verbi e proposizioni","how":"Segna i predicati e i gruppi che dipendono da essi.","why":"Avvia la segmentazione."},{"name":"Freccia di dipendenza","how":"Collega principale e subordinata, distinguendo la coordinata.","why":"Rende visibile la struttura."}],"example":{"task":"Analizza «Quando piove, resto a casa e leggo un libro».","work":["Predicati: piove, resto, leggo; tre proposizioni.","Resto a casa è principale; e leggo un libro è coordinata copulativa alla principale.","Quando piove è subordinata temporale di primo grado."],"result":"Subordinata temporale «Quando piove»→principale «resto a casa»—coordinata copulativa «e leggo un libro»."},"steps":[{"title":"Segna i predicati","do":"Considera tempi composti e costruzioni verbali come unità secondo il manuale.","help":"Nel modello ci sono tre predicati."},{"title":"Dividi il periodo","do":"Isola le proposizioni e conserva i connettivi.","help":"E e quando indicano relazioni diverse."},{"title":"Collega la struttura","do":"Trova principale, coordinate e dipendenze richieste.","help":"Per quando chiedi in quale momento resto a casa."}],"transfer":{"task":"«Poiché è tardi, chiudo il quaderno e vado a dormire». Analizza senza separare vado a dormire, considerato qui una costruzione unitaria.","check":"Poiché è tardi: subordinata causale; chiudo il quaderno: principale; e vado a dormire: coordinata copulativa. La convenzione sulla costruzione è esplicitata nella consegna."},"checks":["Segmenti con criterio.","Distingui coordinata e subordinata.","Motivi temporale o causale."],"error":{"wrong":"E leggo è una subordinata perché viene dopo.","why":"La posizione non determina la dipendenza.","fix":"Osserva e e il legame sullo stesso livello con resto."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Collega la struttura","difficulty":"Le frecce della struttura diventano confuse.","categories":["trasversale"],"signal":"Tutte le proposizioni sembrano dipendere l'una dall'altra.","aid":"Usa tre strisce: principale al centro, coordinata a fianco e subordinata sotto.","preserve":"Dividere un periodo in proposizioni e riconoscere relazioni di coordinazione e subordinazione.","verify":"Verifica se spieghi i due tipi di legame."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Le costruzioni verbali e i criteri di segmentazione possono variare fra manuali; esplicita la convenzione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M04-06","goal":"Trasformare frasi controllando agente, oggetto e significato.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Griglia dei ruoli","how":"Segna chi agisce, che cosa riceve l'azione e tempo.","why":"Mantiene i ruoli nel cambio di forma."},{"name":"Confronto prima/dopo","how":"Verifica ogni variazione richiesta e ogni invariante.","why":"Evita trasformazioni casuali."}],"example":{"task":"Trasforma «Il custode apre il cancello» in passiva, negativa e interrogativa; mantieni il presente.","work":["Passiva: cancello diventa soggetto; custode resta agente.","Negativa: inserisco non prima di apre.","Interrogativa: mantengo la frase e uso la domanda."],"result":"Passiva: «Il cancello è aperto dal custode». Negativa: «Il custode non apre il cancello». Interrogativa: «Il custode apre il cancello?»"},"steps":[{"title":"Identifica il vincolo","do":"Leggi se devi cambiare voce, negazione, domanda o tempo.","help":"Esegui solo i cambi richiesti."},{"title":"Segna i ruoli","do":"Annota agente, oggetto e tempo iniziali.","help":"Custode agisce sul cancello."},{"title":"Trasforma e verifica","do":"Controlla ruoli, accordi e punteggiatura.","help":"In passiva aperto concorda con cancello."}],"transfer":{"task":"«La cuoca prepara le zuppe». Trasforma in passiva e negativa al presente.","check":"«Le zuppe sono preparate dalla cuoca»; «La cuoca non prepara le zuppe». Accordo plurale femminile nella passiva."},"checks":["Rispetti la trasformazione.","Mantieni agente e oggetto.","Controlli accordo e tempo."],"error":{"wrong":"Il custode è aperto dal cancello.","why":"Hai scambiato agente e oggetto.","fix":"Metti il cancello come soggetto della passiva."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Segna i ruoli","difficulty":"Scambio chi fa e chi riceve l'azione.","categories":["trasversale"],"signal":"La passiva cambia i ruoli.","aid":"Usa due cartoncini agente/oggetto e una freccia dell'azione prima di trasformare.","preserve":"Trasformare frasi controllando agente, oggetto e significato.","verify":"Verifica che il significato dell'azione resti invariato."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non tutti i verbi permettono la passiva; controlla transitività e consegna prima di applicare il modello.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M04-07","goal":"Inserire punteggiatura che renda chiare frasi, elenchi e discorso diretto.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Segmentazione del senso","how":"Individua unità complete e cambi di voce.","why":"Guida punti e virgolette."},{"name":"Lettura di controllo","how":"Leggi seguendo i segni e verifica i collegamenti.","why":"Fa emergere separazioni scorrette."}],"example":{"task":"Punteggia: «Mia prese tre oggetti una penna un foglio e una busta poi disse posso spedire la lettera».","work":["Dopo oggetti introduco l'elenco con i due punti.","Separazione dell'elenco con virgole; punto dopo busta.","Introduco le parole di Mia con due punti e virgolette; posso spedire la lettera è affermazione."],"result":"Mia prese tre oggetti: una penna, un foglio e una busta. Poi disse: «Posso spedire la lettera»."},"steps":[{"title":"Trova le unità","do":"Segna dove si completa un'azione e dove inizia un elenco o una voce.","help":"Non separare soggetto e verbo con virgola."},{"title":"Inserisci i segni","do":"Usa i segni in rapporto alla funzione.","help":"Due punti prima dell'elenco e della battuta."},{"title":"Rileggi il risultato","do":"Verifica che i segni esprimano il senso scelto.","help":"L'intonazione non basta da sola a decidere tutte le virgole."}],"transfer":{"task":"Punteggia: «Leo chiese dove sono le chiavi Ada rispose sul tavolo».","check":"Leo chiese: «Dove sono le chiavi?» Ada rispose: «Sul tavolo». Ammesse convenzioni equivalenti coerenti di discorso diretto."},"checks":["Le frasi sono distinguibili.","Elenchi e battute sono introdotti.","La domanda riceve il punto interrogativo."],"error":{"wrong":"Mia, prese tre oggetti.","why":"La virgola separa senza motivo soggetto e predicato.","fix":"Togli la virgola e metti due punti dopo oggetti."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Inserisci i segni","difficulty":"Dimentico i segni mentre scrivo.","categories":["disortografia"],"signal":"Il contenuto è completo ma mancano sistematicamente i confini.","aid":"Rivedi solo punti, poi elenchi, poi battute con tre passaggi separati.","preserve":"Inserire punteggiatura che renda chiare frasi, elenchi e discorso diretto.","verify":"Verifica se i confini corretti aumentano senza cambiare il contenuto."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Più punteggiature possono essere coerenti; spiega differenze di senso e rispetta le convenzioni del manuale.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M04-08","goal":"Spiegare una regola grammaticale applicandola e distinguendo un caso simile.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Regola-esempio-contrasto","how":"Affianca formulazione, applicazione e caso da non confondere.","why":"Rende operativa la regola."},{"name":"Spiegazione senza copia","how":"Chiudi il manuale, spiega e controlla precisione.","why":"Verifica comprensione."}],"example":{"task":"Regola fornita: «Si scrive ha con h quando è una forma del verbo avere; a senza h può essere una preposizione». Applica a «Luca … una bici» e «Luca va … scuola» e spiega.","work":["Luca ha una bici: indica possesso, forma di avere.","Luca va a scuola: a introduce il luogo di destinazione.","Sostituire ha con aveva mantiene una frase possibile; Luca va aveva scuola no."],"result":"«Luca ha una bici» e «Luca va a scuola». La h distingue la forma del verbo avere dalla preposizione a nei due casi."},"steps":[{"title":"Riformula la regola","do":"Spiega il criterio con parole tue.","help":"Non basta dire si mette h perché sì."},{"title":"Applica al contesto","do":"Osserva il ruolo della parola nella frase.","help":"Possesso contro destinazione."},{"title":"Prova un contrasto","do":"Confronta un caso simile e controlla sul manuale.","help":"Usa la sostituzione come controllo, non come unica spiegazione."}],"transfer":{"task":"Completa e motiva: «Nina … fame»; «Nina scrive … Marco».","check":"Nina ha fame: verbo avere; Nina scrive a Marco: preposizione che introduce destinatario."},"checks":["Formuli il criterio.","Applichi correttamente entrambi i casi.","Motivi la differenza."],"error":{"wrong":"Metto h ogni volta che sento a.","why":"Le due forme suonano uguali ma hanno ruoli diversi.","fix":"Leggi la frase e distingue verbo e preposizione."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Riformula la regola","difficulty":"Ricordo la frase della regola ma non il suo uso.","categories":["trasversale"],"signal":"La reciti e poi sbagli entrambi i casi.","aid":"Tieni un esempio e un controesempio a fianco e cambia soltanto soggetto e oggetto.","preserve":"Spiegare una regola grammaticale applicandola e distinguendo un caso simile.","verify":"Verifica l'applicazione su Nina senza copiare le risposte."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. La correttezza in due frasi non prova trasferimento generale: osserva poi un testo autonomo e conserva gli strumenti.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M05-01","goal":"Tradurre la traccia in richieste e vincoli verificabili prima di scrivere.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Scomposizione della consegna","how":"Separa prodotto, destinatario, contenuti e vincoli.","why":"Riduce omissioni."},{"name":"Lista di controllo","how":"Trasforma ogni richiesta in una casella.","why":"Sostiene la revisione."}],"example":{"task":"Traccia: «Scrivi al consiglio degli studenti un messaggio di 4-5 frasi per proporre una biblioteca di classe. Indica una ragione e una regola di prestito». Analizza e produci un messaggio.","work":["Prodotto: messaggio; destinatario: consiglio degli studenti.","Contenuti obbligatori: proposta, ragione e regola; lunghezza 4-5 frasi.","Preparo quattro frasi, includendo ragione e prestito."],"result":"«Propongo di creare una biblioteca di classe. Potremmo scambiarci libri senza comprarli ogni volta. Ogni prestito durerebbe una settimana e sarebbe registrato su un quaderno. Chiedo al consiglio di discutere questa proposta»."},"steps":[{"title":"Identifica il prodotto","do":"Cerchia che cosa devi consegnare e a chi.","help":"Qui non è un racconto."},{"title":"Elenca i vincoli","do":"Annota contenuti, forma e lunghezza.","help":"Conta frasi, non righe."},{"title":"Scrivi e spunta","do":"Produci il testo e collega ogni vincolo a una parte.","help":"La regola deve essere operativa."}],"transfer":{"task":"«Scrivi tre frasi al responsabile della palestra per proporre un torneo: specifica partecipanti e una regola di sicurezza». Produci il messaggio.","check":"Tre frasi; destinatario rispettoso; proposta di torneo; partecipanti identificati; regola concreta di sicurezza, per esempio area libera da ostacoli prima di iniziare."},"checks":["Identifichi destinatario e prodotto.","Copri tutti i contenuti.","Rispetti il limite di frasi."],"error":{"wrong":"Scrivo cinque frasi sul mio libro preferito.","why":"Hai perso lo scopo della consegna.","fix":"Rileggi proposta, ragione e regola e sostituisci il contenuto."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Elenca i vincoli","difficulty":"La consegna lunga mi fa dimenticare i vincoli.","categories":["dislessia"],"signal":"Produci un testo pertinente ma ometti la regola.","aid":"Spezza la traccia in quattro righe e tieni una casella per ciascun vincolo.","preserve":"Tradurre la traccia in richieste e vincoli verificabili prima di scrivere.","verify":"Verifica che ogni casella corrisponda a una frase o parte del testo."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Semplifica la presentazione della traccia senza cancellarne gli obiettivi; eventuali riduzioni vanno concordate.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M05-02","goal":"Raccogliere e selezionare idee pertinenti a una traccia.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Domande generative","how":"Usa chi, dove, che cosa, problema e cambiamento.","why":"Produce dettagli utili."},{"name":"Selezione per pertinenza","how":"Tieni le idee che sostengono lo scopo.","why":"Evita elenchi scollegati."}],"example":{"task":"Traccia: «Racconta una giornata immaginaria in cui una classe risolve un piccolo problema». Raccogli idee e scegli un nucleo.","work":["Idee: pianta da curare; cartellone caduto; bus rumoroso; pallone perso.","Scelgo cartellone caduto perché permette problema e soluzione in classe.","Dettagli: aula, Nora e Ben, nastro esaurito, fermagli, cartellone appeso."],"result":"Nucleo scelto: Nora e Ben trovano il cartellone a terra; non hanno nastro, usano fermagli e lo appendono. Bus rumoroso e pallone perso restano esclusi perché aprirebbero altre vicende."},"steps":[{"title":"Apri le domande","do":"Rispondi con parole brevi senza scrivere subito il testo.","help":"Chi aiuta? Quale ostacolo?"},{"title":"Produci alternative","do":"Scrivi almeno due possibili nuclei.","help":"Non devi usare ogni idea raccolta."},{"title":"Seleziona e motiva","do":"Scegli ciò che serve alla traccia e scarta il resto.","help":"Conserva un problema che abbia una soluzione narrabile."}],"transfer":{"task":"Traccia: «Descrivi un luogo immaginario adatto a leggere». Raccogli sei dettagli e scegline quattro.","check":"Sei dettagli proposti; quattro pertinenti a spazio, luce, suoni, arredi o atmosfera. Dev'essere motivato almeno uno scarto; non è obbligatoria una vicenda."},"checks":["Generi più alternative.","Le idee selezionate rispondono alla traccia.","Motivi un'esclusione."],"error":{"wrong":"Uso tutte le idee anche se appartengono a storie diverse.","why":"La raccolta non impone di inserire tutto.","fix":"Seleziona solo problema del cartellone e dettagli collegati."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Apri le domande","difficulty":"Non mi vengono idee quando vedo il foglio vuoto.","categories":["trasversale"],"signal":"Resti fermo senza formulare un nucleo.","aid":"Usa quattro domande con un piccolo disegno o parola per risposta.","preserve":"Raccogliere e selezionare idee pertinenti a una traccia.","verify":"Osserva se produci idee pertinenti prima della stesura."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Le domande sono un avvio da ridurre quando la raccolta diventa autonoma; non imporre contenuti personali.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M05-03","goal":"Organizzare idee in una scaletta e sviluppare paragrafi con una funzione.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Ordine per funzione","how":"Assegna introduzione, sviluppo e conclusione ai nuclei.","why":"Crea una progressione."},{"name":"Paragrafo a nucleo","how":"Collega ogni paragrafo a un'idea principale e dettagli.","why":"Evita a capo casuali."}],"example":{"task":"Dati inventati: «Il giardino scolastico ha un angolo secco; la classe sceglie piante resistenti; prepara il terreno; organizza turni d'acqua». Scrivi scaletta e tre paragrafi brevi.","work":["Introduzione: problema dell'angolo secco.","Sviluppo: scelta delle piante e preparazione del terreno.","Conclusione: turni per curare il giardino."],"result":"Scaletta: problema→intervento→cura. Paragrafo 1: «Una parte del giardino scolastico era secca». Paragrafo 2: «La classe scelse piante resistenti e preparò il terreno prima di piantarle». Paragrafo 3: «Infine organizzò turni d'acqua per continuare la cura»."},"steps":[{"title":"Raggruppa le idee","do":"Metti insieme i dettagli dello stesso nucleo.","help":"Scelta e preparazione possono stare nello sviluppo."},{"title":"Ordina la scaletta","do":"Decidi che cosa deve sapere prima il lettore.","help":"Presenta il problema prima della soluzione."},{"title":"Sviluppa i paragrafi","do":"Scrivi un gruppo di frasi per nucleo e controlla i collegamenti.","help":"Un paragrafo breve può contenere una sola frase."}],"transfer":{"task":"Dati: «L'aula è rumorosa; la classe prova feltrini sotto le sedie; confronta il rumore; decide di mantenerli». Fai tre nuclei e un testo in tre paragrafi.","check":"Problema rumore→prova e confronto→decisione. I tre paragrafi devono seguire l'ordine e contenere tutti i dati senza inventare misure."},"checks":["Ogni nucleo ha una funzione.","I paragrafi seguono la scaletta.","I collegamenti sono comprensibili."],"error":{"wrong":"Faccio un a capo dopo ogni parola lunga.","why":"La lunghezza della parola non determina il paragrafo.","fix":"Raggruppa frasi che sviluppano lo stesso nucleo."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Sviluppa i paragrafi","difficulty":"Ricopiare tutta la scaletta mi affatica.","categories":["disgrafia"],"signal":"Hai l'ordine ma interrompi la stesura per fatica.","aid":"Usa una scaletta di sole parole chiave e scrivi un paragrafo alla volta con spazio già previsto.","preserve":"Organizzare idee in una scaletta e sviluppare paragrafi con una funzione.","verify":"Verifica completezza e fatica rispetto alla ricopiatura integrale."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non confondere numero di paragrafi e qualità; la struttura dipende dal prodotto richiesto.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M05-04","goal":"Scrivere un racconto con situazione iniziale, ostacolo, azione e conclusione.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Catena narrativa","how":"Progetta i quattro momenti prima di scrivere.","why":"Sostiene la coerenza."},{"name":"Controllo causa-esito","how":"Verifica che la soluzione risponda al problema.","why":"Evita finali scollegati."}],"example":{"task":"Scrivi quattro frasi su un ragazzo che deve consegnare un disegno e incontra un ostacolo.","work":["Situazione: Milo deve portare il disegno alla mostra.","Ostacolo: il vento lo strappa dalla cartella.","Azione ed esito: Milo lo recupera e lo fissa in una busta prima di arrivare."],"result":"Milo camminava verso la mostra con il suo disegno. Una raffica lo fece volare sul prato. Milo lo recuperò e lo mise in una busta chiusa. Arrivò in tempo e consegnò il disegno un po' stropicciato."},"steps":[{"title":"Progetta i momenti","do":"Scrivi personaggio, luogo, obiettivo e ostacolo.","help":"Mantieni un solo problema principale nel racconto breve."},{"title":"Narra le azioni","do":"Collega ciò che accade con tempi coerenti.","help":"Il recupero deve seguire la perdita."},{"title":"Chiudi e rivedi","do":"Verifica che il finale risolva o lasci intenzionalmente aperto il problema.","help":"Non inserire una vittoria estranea alla mostra."}],"transfer":{"task":"Scrivi 4-6 frasi su una ragazza che deve aprire un laboratorio ma non trova la chiave.","check":"Personaggio e luogo chiari, chiave mancante, tentativo concreto e finale coerente; tempi verbali compatibili e almeno un nesso causale o temporale."},"checks":["L'obiettivo è chiaro.","L'azione affronta l'ostacolo.","Il finale è collegato alla vicenda."],"error":{"wrong":"Milo perde il disegno e alla fine vince una gara di nuoto.","why":"La conclusione non risponde al problema narrato.","fix":"Concludi con recupero o conseguenza della mancata consegna."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Progetta i momenti","difficulty":"Dimentico un pezzo della storia mentre scrivo.","categories":["trasversale"],"signal":"Manca ostacolo o conclusione.","aid":"Tieni quattro riquadri con una parola chiave per momento.","preserve":"Scrivere un racconto con situazione iniziale, ostacolo, azione e conclusione.","verify":"Verifica che tutti i riquadri siano sviluppati."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non richiedere sempre un lieto fine; anche una conclusione non risolutiva può essere coerente e intenzionale.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M05-05","goal":"Descrivere un ambiente con ordine e dettagli osservabili distinguendo dati e impressioni.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Percorso dello sguardo","how":"Descrivi dall'insieme ai dettagli o da un lato all'altro.","why":"Evita salti spaziali."},{"name":"Dettagli sensoriali","how":"Scegli elementi visivi e altri sensi pertinenti.","why":"Rende concreta la descrizione."}],"example":{"task":"Ambiente immaginario: stanza rettangolare, porta a sud, finestra a nord, tavolo al centro, scaffale a est, odore di legno. Scrivi una descrizione dal punto di vista di chi entra.","work":["Parto dalla forma della stanza.","Davanti a chi entra c'è la finestra a nord; il tavolo è centrale.","Scaffale a destra, verso est; aggiungo odore senza inventare rumori."],"result":"Entrando dalla porta a sud si vede una stanza rettangolare. Davanti, la finestra a nord illumina il tavolo centrale. Sulla destra, a est, c'è uno scaffale. Nell'ambiente si sente odore di legno."},"steps":[{"title":"Scegli il punto di vista","do":"Decidi da dove osservi e quale ordine usi.","help":"Destra cambia se cambia il punto di vista."},{"title":"Seleziona dettagli","do":"Annota forma, posizioni e sensazioni presenti o dichiarate.","help":"Non presentare un'impressione come misura."},{"title":"Scrivi e verifica","do":"Segui lo stesso percorso e controlla orientamento e parole.","help":"Rileggi fingendo di entrare dalla porta."}],"transfer":{"task":"Stanza immaginaria quadrata: porta a ovest, finestra a est, poltrona al centro, mensola a nord. Descrivi entrando da ovest.","check":"Davanti: finestra a est; al centro poltrona; a sinistra mensola a nord. Forma quadrata; niente dimensioni o sensazioni inventate come dati."},"checks":["Il punto di vista è stabile.","I dettagli rispettano le posizioni.","Distingui dati e impressioni."],"error":{"wrong":"Entrando da sud metto lo scaffale a sinistra.","why":"Guardando verso nord, est è a destra.","fix":"Disegna una pianta con freccia dell'osservatore e correggi."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Scegli il punto di vista","difficulty":"Mi confondo con destra e sinistra della descrizione.","categories":["trasversale"],"signal":"Cambi il punto di vista durante il testo.","aid":"Disegna una freccia che indica dove guarda l'osservatore e tienila fissa.","preserve":"Descrivere un ambiente con ordine e dettagli osservabili distinguendo dati e impressioni.","verify":"Verifica che le posizioni si possano ricostruire dal testo."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Per descrizioni soggettive sono ammesse immagini personali, purché distinte dai dati del compito.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M05-06","goal":"Scrivere un testo espositivo o una relazione usando dati e collegamenti chiari.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Domande organizzatrici","how":"Ordina che cosa, come, perché e risultato.","why":"Dà struttura all'informazione."},{"name":"Dati separati da ipotesi","how":"Segna osservazioni e possibili spiegazioni in sezioni diverse.","why":"Evita conclusioni non provate."}],"example":{"task":"Dati inventati di una prova: «Tre fogli uguali: A piano, B piegato a fisarmonica, C arrotolato. Con la stessa gomma sopra, A si piega, B e C restano stabili». Scrivi una breve esposizione e una relazione della prova.","work":["Esposizione: la forma può modificare la stabilità del foglio.","Relazione: oggetti uguali, forme diverse, stessa gomma; riporto risultati.","Non concludo che B sopporti ogni peso: è provata soltanto quella gomma."],"result":"Esposizione: «La forma di un foglio può cambiare il modo in cui sostiene un oggetto: nella prova il foglio piano si piega, quelli piegato e arrotolato restano stabili». Relazione: «Abbiamo confrontato tre fogli uguali con forme diverse e la stessa gomma. A si è piegato; B e C sono rimasti stabili. La prova mostra una differenza in queste condizioni»."},"steps":[{"title":"Definisci il prodotto","do":"Per esposizione organizza le informazioni; per relazione aggiungi procedura e risultati.","help":"Non confondere spiegazione generale e resoconto della prova."},{"title":"Seleziona i dati","do":"Raccogli condizioni, azioni e risultati forniti.","help":"Scrivi stessa gomma, non stesso peso inventato."},{"title":"Ordina e verifica","do":"Usa titoli o paragrafi e limita le conclusioni.","help":"Distinguere risultato e spiegazione possibile."}],"transfer":{"task":"Dati inventati: «Due fogli uguali, uno bianco e uno nero, restano al sole per 10 minuti. Il termometro segna 25 °C sul bianco e 29 °C sul nero». Scrivi una relazione breve.","check":"Condizioni e durata riportate; bianco 25 °C, nero 29 °C; nero 4 °C più caldo in questa prova. Non generalizzare a tutti i materiali o condizioni."},"checks":["Riporti condizioni e dati.","La struttura corrisponde al prodotto.","La conclusione non supera la prova."],"error":{"wrong":"Il foglio piegato sostiene qualsiasi oggetto.","why":"È stato provato solo con una gomma.","fix":"Limita l'affermazione alle condizioni osservate."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Seleziona i dati","difficulty":"Non riesco a copiare dati e spiegare insieme.","categories":["disgrafia"],"signal":"Ometti risultati durante la stesura.","aid":"Prepara tabella A/B/C con esito e scrivi la spiegazione usando la tabella visibile.","preserve":"Scrivere un testo espositivo o una relazione usando dati e collegamenti chiari.","verify":"Verifica che ogni dato compaia senza ricopiatura ripetuta."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. I risultati sono forniti e inventati; non descriverli come esperimenti realmente eseguiti dal ragazzo.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M05-07","goal":"Scrivere una tesi con ragioni, obiezione e risposta proporzionate.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Mappa argomentativa","how":"Collega tesi, ragione, esempio e possibile obiezione.","why":"Separa le funzioni."},{"name":"Verifica della prova","how":"Chiedi se il dato sostiene davvero la conclusione.","why":"Evita generalizzazioni."}],"example":{"task":"Dati inventati: «In un sondaggio di classe 18 alunni su 24 chiedono una zona tranquilla per leggere; 6 preferiscono usare tutto il cortile per il gioco». Argomenta una proposta senza cancellare la minoranza.","work":["Tesi: creare una piccola zona di lettura.","Ragione: 18 su 24 la richiedono; il sondaggio riguarda questa classe.","Obiezione: spazio di gioco ridotto; risposta: delimitare una zona e rivedere l'uso dopo una prova."],"result":"Propongo una piccola zona tranquilla per leggere: 18 alunni su 24 la chiedono. Sei preferiscono avere tutto il cortile per giocare, quindi serve un accordo sullo spazio. Possiamo provare una zona limitata e verificare dopo una settimana se permette entrambe le attività."},"steps":[{"title":"Formula la tesi","do":"Scrivi una proposta precisa.","help":"Piccola zona è più controllabile di cambiare tutta la scuola."},{"title":"Sostieni e limita","do":"Collega una ragione a un dato o esempio affidabile.","help":"18/24 descrive la classe, non tutti gli studenti."},{"title":"Considera l'obiezione","do":"Riporta un punto contrario e rispondi senza insultare.","help":"Cerca una condizione o compromesso verificabile."}],"transfer":{"task":"Dati inventati: «12 alunni su 20 preferiscono lavori a coppie; 8 individuali». Proponi una scelta con ragione e obiezione.","check":"Tesi chiara, dato corretto riferito ai 20 alunni, riconoscimento della preferenza degli 8, risposta praticabile (alternanza o scelta secondo compito). Non dimostra superiorità universale del lavoro a coppie."},"checks":["La tesi è precisa.","Le prove sostengono la ragione.","L'obiezione riceve una risposta rispettosa."],"error":{"wrong":"Tutti vogliono leggere, quindi basta vietare il gioco.","why":"Sei non condividono la preferenza e il dato non autorizza il divieto.","fix":"Usa 18 su 24 e discuti una zona limitata."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Considera l'obiezione","difficulty":"Quando vedo un'obiezione perdo la mia idea.","categories":["trasversale"],"signal":"Abbandoni la tesi o ripeti soltanto la ragione.","aid":"Usa tre righe separate: propongo…, qualcuno osserva…, rispondo….","preserve":"Scrivere una tesi con ragioni, obiezione e risposta proporzionate.","verify":"Verifica se mantieni tesi e risposta senza cancellare l'obiezione."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. La forza dell'argomento non coincide con il consenso dell'adulto; verifica dati, nessi e proporzione della conclusione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M05-08","goal":"Adattare dati e tono a diario, lettera, e-mail, articolo, recensione e regolamento.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Destinatario e funzione","how":"Stabilisci chi legge e se devi ricordare, informare, valutare o dare regole.","why":"Distingue i generi comunicativi."},{"name":"Confronto di forme","how":"Usa gli stessi fatti in forme diverse e controlla apertura e struttura.","why":"Mostra che il formato dipende dallo scopo."}],"example":{"task":"Dati inventati: «Sabato la classe organizza uno scambio di libri dalle 10 alle 12 in aula. Ogni partecipante porta al massimo due libri integri. L'attività permette di scoprire nuove letture». Produci un esempio breve per ciascuna forma; per il diario immagina una reazione, per la recensione valuta l'attività.","work":["Lettera/e-mail informano un destinatario; articolo presenta fatti a lettori.","Diario registra una reazione immaginata; recensione esprime un giudizio motivato.","Regolamento trasforma le condizioni in istruzioni verificabili."],"result":"Diario: «Sabato. Lo scambio mi incuriosisce: porterò due libri per cercare una lettura diversa». Lettera: «Caro Luca, sabato in aula scambiamo libri dalle 10 alle 12. Porta al massimo due libri integri. A presto, Ada». E-mail: «Oggetto: scambio di libri. Buongiorno, sabato lo scambio si terrà in aula dalle 10 alle 12. Ogni partecipante può portare fino a due libri integri. Un saluto, Ada». Articolo: «Sabato, dalle 10 alle 12, la classe organizza uno scambio di libri in aula per scoprire nuove letture». Recensione della proposta: «Lo scambio offre nuove letture senza acquisti; il limite di due libri rende semplice la partecipazione, ma non garantisce che ciascuno trovi un titolo adatto». Regolamento: «1. Partecipa dalle 10 alle 12 in aula. 2. Porta al massimo due libri. 3. Controlla che siano integri»."},"steps":[{"title":"Identifica genere e destinatario","do":"Scegli diario, lettera, e-mail, articolo, recensione o regolamento secondo la traccia.","help":"Il diario può essere personale; l'articolo deve rendere chiari i fatti."},{"title":"Seleziona dati e tono","do":"Conserva i dati comuni e separa opinioni da informazioni.","help":"Nell'e-mail indica oggetto e saluto; nella lettera apertura e chiusura."},{"title":"Scrivi nella forma","do":"Organizza notizia, giudizio, vissuto immaginario o regole secondo lo scopo.","help":"Per recensione di un libro aggiungi dati dell'opera e prova del giudizio."},{"title":"Controlla la funzione","do":"Verifica che il destinatario possa capire o agire.","help":"Nel regolamento ogni regola deve essere osservabile."}],"transfer":{"task":"Dati inventati: «Mercoledì, dalle 15 alle 16 in biblioteca, laboratorio di segnalibri; porta una matita; posti: 12». Scrivi un'e-mail informativa e un regolamento di tre punti.","check":"E-mail con oggetto, destinatario generico rispettoso, giorno, orario, luogo, matita e limite12; regolamento con tre azioni/condizioni pertinenti. Non aggiungere modalità di prenotazione come dato se non fornite."},"checks":["La forma è riconoscibile.","I dati restano corretti.","Opinioni e fatti sono distinguibili."],"error":{"wrong":"Scrivo nel regolamento: mi piace leggere.","why":"Un giudizio non indica come partecipare.","fix":"Sostituisci con una regola concreta sui due libri integri."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Identifica genere e destinatario","difficulty":"Confondo il formato della consegna.","categories":["trasversale"],"signal":"Scrivi un diario quando serve una e-mail.","aid":"Tieni una scheda con scopo, apertura e chiusura della forma richiesta.","preserve":"Adattare dati e tono a diario, lettera, e-mail, articolo, recensione e regolamento.","verify":"Verifica se il nuovo testo rispetta tre caratteristiche del genere."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Le convenzioni variano per destinatario e situazione; non richiedere esperienze o dati personali reali.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M05-09","goal":"Riassumere un testo rispettando un limite di parole senza perdere i nessi.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Nuclei irrinunciabili","how":"Seleziona problema, azione ed esito prima del conteggio.","why":"Protegge la fedeltà."},{"name":"Riduzione per revisione","how":"Accorcia ripetizioni e dettagli e riconta.","why":"Evita tagli casuali."}],"example":{"task":"«Lia voleva portare a scuola un vaso fragile. Per proteggerlo, avvolse il vaso in un asciugamano e lo mise in una scatola. Alla fine del viaggio il vaso era integro». Riassumi in massimo20 parole, contando come parole le unità separate da spazi.","work":["Conservo trasporto, protezione e arrivo integro.","Elimino ripetizioni di vaso e dettagli non necessari.","Conto18 parole nella versione scelta."],"result":"«Lia protegge un vaso fragile con un asciugamano e una scatola: arriva a scuola con il vaso integro». Conteggio: Lia1 protegge2 un3 vaso4 fragile5 con6 un7 asciugamano8 e9 una10 scatola11 arriva12 a13 scuola14 con15 il16 vaso17 integro18."},"steps":[{"title":"Segna il limite","do":"Leggi se conta parole, righe o caratteri e chiarisci la convenzione.","help":"Qui valgono unità separate da spazi."},{"title":"Scrivi i nuclei","do":"Mantieni azione, scopo e risultato prima di accorciare.","help":"La protezione spiega l'esito."},{"title":"Riduci e riconta","do":"Togli ripetizioni; verifica senso e conteggio finale.","help":"Non eliminare il nesso per restare nel limite."}],"transfer":{"task":"«Omar dimenticò il quaderno. Telefonò a casa e il fratello glielo portò prima della lezione». Riassumi in massimo15 parole.","check":"Soluzione possibile13 parole: «Omar dimentica il quaderno; il fratello glielo porta prima della lezione dopo la telefonata» è17, quindi va ridotta. Versione valida13: «Omar dimentica il quaderno, telefona e il fratello lo porta prima della lezione». Conteggio: Omar1 dimentica2 il3 quaderno4 telefona5 e6 il7 fratello8 lo9 porta10 prima11 della12 lezione13."},"checks":["Resti entro il limite.","Conservi i nuclei.","Mostri un conteggio coerente."],"error":{"wrong":"Taglio il fratello e scrivo che il quaderno arriva da solo.","why":"Il taglio cancella chi risolve il problema.","fix":"Riduci altre parole mantenendo l'agente."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Riduci e riconta","difficulty":"Conto le parole e perdo il punto.","categories":["discalculia"],"signal":"Ripeti o salti numeri durante il conteggio.","aid":"Segna una piccola tacca ogni cinque parole oppure usa un contatore concordato.","preserve":"Riassumere un testo rispettando un limite di parole senza perdere i nessi.","verify":"Verifica il numero con un secondo conteggio per gruppi."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Il conteggio è un vincolo del compito, non un indicatore globale di comprensione; conserva gli strumenti utili.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M05-10","goal":"Rivedere un testo separando contenuto, coerenza e forma.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Revisione a passaggi","how":"Controlla prima senso e ordine, poi lessico e ortografia.","why":"Evita sovraccarico."},{"name":"Confronto motivato","how":"Spiega quale cambiamento risolve quale problema.","why":"Rende la correzione consapevole."}],"example":{"task":"Bozza originale: «Ieri andrò al parco. Ho incontrato Sara e lui mi ha dato il suo quaderno. Il parco era bello bello». Revisiona senza cambiare i fatti: ieri al parco, Sara consegna un quaderno.","work":["Andrò è incompatibile con ieri: uso sono andato/a.","Lui riferito a Sara non è coerente: uso lei.","Bello bello è ripetitivo e generico: tolgo la valutazione non necessaria."],"result":"«Ieri sono andato al parco. Ho incontrato Sara e lei mi ha dato il suo quaderno». Anche sono andata è corretto secondo la voce narrante; non aggiungo dettagli sul parco."},"steps":[{"title":"Controlla il contenuto","do":"Confronta il testo con la traccia e individua informazioni mancanti.","help":"Prima verifica i fatti da conservare."},{"title":"Controlla i collegamenti","do":"Rivedi tempi, pronomi e ordine delle idee.","help":"Cerca a chi si riferisce lui o lei."},{"title":"Rivedi la forma","do":"Controlla ripetizioni, punteggiatura e bersagli ortografici separatamente.","help":"Motiva almeno una correzione."}],"transfer":{"task":"Bozza: «Domani siamo andati al museo. La guida spiega le sale e loro indica il quadro». Riscrivi come programma futur
