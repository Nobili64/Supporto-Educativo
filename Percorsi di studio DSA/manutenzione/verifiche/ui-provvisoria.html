,"difficulty":"Perdo il filo quando parlo.","categories":["trasversale"],"signal":"Salta da materiale a data senza completare un punto.","aid":"Usa una carta con tre parole guida e un'immagine; riduci le domande dell'adulto, non la carta scelta.","preserve":"Preparare scheda e presentazione di un bene culturale indicando come rispettarlo.","verify":"Confronta due tentativi con lo stesso criterio: Scheda e orale conservano i dati essenziali. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M15-01","goal":"Riconoscere suoni lunghi/brevi e forti/piano dopo un ascolto.","materials":["Carta con quattro caselle","Adulto o compagno che esegue la sequenza senza mostrarla"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Ascolto una prima volta contando quattro eventi.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Durata e intensità sono distinte.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"L'esecutore produce quattro eventi: battito di mani piano, battito forte, voce «mmm» piano per tre conteggi, battito piano. Ascolta senza guardare la descrizione e indica intensità e durata di ciascuno; poi confronta.","work":["Ascolto una prima volta contando quattro eventi.","Al secondo ascolto annoto: piano breve; forte breve; piano lungo; piano breve.","Controllo con la sequenza dell'esecutore, separando forte da lungo."],"result":"1 piano/breve; 2 forte/breve; 3 piano/lungo; 4 piano/breve. La terza voce è lunga anche se poco intensa."},"steps":[{"title":"Scegli cosa ascoltare","do":"Nell'ascolto assegnato prepara caselle per durata, intensità o timbro secondo la domanda.","help":"Non cercare tutte le caratteristiche insieme."},{"title":"Ascolta con un compito","do":"Prima riconosci l'ordine; poi annota una caratteristica per evento.","help":"L'esecutore mantiene uguale la sequenza tra le ripetizioni."},{"title":"Controlla gli indizi","do":"Confronta le risposte con gli eventi e spiega una scelta.","help":"Il volume non stabilisce la durata."}],"transfer":{"task":"L'esecutore fa «mmm» forte per tre conteggi, battito piano, battito forte. Ascolta e classifica i tre eventi prima di leggere il controllo.","check":"1 forte/lungo; 2 piano/breve; 3 forte/breve. Ripetere allo stesso modo se un evento non è stato udito."},"checks":["L'ordine degli eventi è conservato.","Durata e intensità sono distinte.","La risposta cita un evento ascoltato."],"error":{"wrong":"Segno lungo per il battito forte.","why":"Intensità e durata sono caratteristiche diverse.","fix":"Confronta il battito forte con «mmm» tenuto tre conteggi."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Annotare durante l'ascolto","difficulty":"Dimentico i primi suoni mentre ascolto gli ultimi.","categories":["trasversale"],"signal":"Le risposte sono corrette subito dopo un evento ma si perdono nella sequenza.","aid":"Usa quattro caselle e simboli L/B e F/P già spiegati; ripeti la sequenza senza accelerare.","preserve":"Riconoscere suoni lunghi/brevi e forti/piano dopo un ascolto.","verify":"Confronta due tentativi con lo stesso criterio: L'ordine degli eventi è conservato. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M15-02","goal":"Leggere e scrivere una misura ritmica con durate complete.","materials":["Carta, matita","Legenda: Q = un quarto, H = una metà, R = pausa di un quarto"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Sommo Q+Q+H: 1+1+2=4.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Le pause sono conteggiate.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"In una misura di 4/4, ogni Q vale un conteggio, H due e R uno silenzioso. Leggi Q Q H e scrivi un'altra misura di quattro conteggi che contenga una pausa.","work":["Sommo Q+Q+H: 1+1+2=4.","Numero i conteggi: Q su 1, Q su 2, H tenuto su 3–4.","Scrivo Q R H: suono su 1, silenzio su 2, suono tenuto su 3–4."],"result":"Q Q H riempie la misura; Q R H è una soluzione con pausa e durata totale quattro."},"steps":[{"title":"Leggi la legenda","do":"Nello spartito assegnato associa simbolo, nome e durata prima di suonare.","help":"In questa prova i simboli testuali sostituiscono le figure, non le altezze sul pentagramma."},{"title":"Allinea i conteggi","do":"Scrivi i conteggi sotto figure e pause; per le note aggiungi il nome dalla chiave studiata.","help":"Una pausa occupa tempo anche senza suono."},{"title":"Scrivi e ricontrolla","do":"Nella scrittura musicale controlla somma delle durate e simboli richiesti.","help":"Per il pentagramma verifica linea/spazio e chiave con il modello del docente."}],"transfer":{"task":"Leggi H R Q in 4/4 e scrivi una diversa misura con due Q e due R.","check":"H occupa 1–2, R il 3, Q il 4. Una soluzione è Q R Q R; ogni ordine con due Q e due R totalizza quattro."},"checks":["La misura contiene quattro conteggi.","Le pause sono conteggiate.","La scrittura rispetta i simboli richiesti."],"error":{"wrong":"Q Q H R vale quattro.","why":"Le durate sommano cinque conteggi.","fix":"Togli una Q oppure sostituisci H con Q."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Allineare le durate","difficulty":"Perdo il conteggio delle durate.","categories":["trasversale"],"signal":"La somma cambia quando riconta gli stessi simboli.","aid":"Usa quattro caselle numerate e occupa due caselle per H; puoi tenere la legenda.","preserve":"Leggere e scrivere una misura ritmica con durate complete.","verify":"Confronta due tentativi con lo stesso criterio: La misura contiene quattro conteggi. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M15-03","goal":"Riprodurre un ritmo mantenendo pulsazione e pause.","materials":["Tavolo o battiti di mani","Carta con quattro conteggi per misura"],"techniques":[{"name":"Pratica per segmenti","how":"Prova prima il segmento indicato nell'esempio: Segno X – X – | X X – X, una casella per conteggio. Poi unisci i segmenti.","why":"Riduce il numero di azioni da gestire insieme; la precisione viene controllata prima di aumentare la velocità."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Le pause mantengono la loro durata.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Conta lentamente 1-2-3-4 due volte. Prima misura: batti su 1 e 3. Seconda: batti su 1, 2 e 4. Non battere sugli altri conteggi.","work":["Segno X – X – | X X – X, una casella per conteggio.","Dico tutti i numeri mentre batto soltanto sulle X.","Ripeto due misure senza aggiungere colpi nei silenzi."],"result":"Cinque colpi totali; pulsazione continua per otto conteggi; pausa su 2 e 4 della prima misura e su 3 della seconda."},"steps":[{"title":"Segna colpi e pause","do":"Per il ritmo assegnato scrivi una casella per ogni pulsazione.","help":"La pausa resta una casella, non un buco nella sequenza."},{"title":"Prova una misura","do":"Conta ad alta voce a tempo lento e aggiungi i colpi.","help":"Se sbagli, riparti dall'inizio della misura dopo un conteggio preparatorio."},{"title":"Unisci le misure","do":"Esegui due misure senza interrompere la pulsazione.","help":"Aumenta il tempo soltanto dopo due esecuzioni coerenti."}],"transfer":{"task":"Su quattro conteggi ripeti due volte X – X X; mantieni il conteggio nelle pause.","check":"Tre colpi per misura, sei totali; nessun colpo sul 2; intervalli fra conteggi regolari al tempo scelto."},"checks":["I colpi cadono sui conteggi indicati.","Le pause mantengono la loro durata.","La seconda misura inizia senza un conteggio extra."],"error":{"wrong":"Dopo una pausa accelero per recuperare.","why":"La pausa faceva già parte del tempo.","fix":"Continua a dire tutti i numeri, anche nei silenzi."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Unire le misure","difficulty":"Mi perdo nel cambio di riga.","categories":["trasversale"],"signal":"Inserisce una pausa aggiuntiva fra le misure.","aid":"Scrivi entrambe le misure sulla stessa riga con separatore evidente e indica la pulsazione con un dito.","preserve":"Riprodurre un ritmo mantenendo pulsazione e pause.","verify":"Confronta due tentativi con lo stesso criterio: I colpi cadono sui conteggi indicati. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Concorda movimenti, tempo e tecnica con il docente della disciplina; non usare il risultato per dedurre un DSA o altre diagnosi.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M15-04","goal":"Cantare una breve frase rispettando ordine delle note e respiro concordato.","materials":["Voce","Docente o esecutore che fornisce le altezze in un registro comodo"],"techniques":[{"name":"Pratica per segmenti","how":"Prova prima il segmento indicato nell'esempio: Ascolto il modello di do-re-mi-re e lo ripeto sul suono «la». Poi unisci i segmenti.","why":"Riduce il numero di azioni da gestire insieme; la precisione viene controllata prima di aumentare la velocità."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: L'ordine delle note corrisponde al modello.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Melodia originale, una nota per conteggio: do re mi re | do do do, poi pausa. Testo: «Qui cam-mi-no | pia-no io». Con un docente scegli le altezze comode e canta senza forzare.","work":["Ascolto il modello di do-re-mi-re e lo ripeto sul suono «la».","Dico le sette sillabe al ritmo, con tre sillabe nella seconda frase.","Unisco testo e melodia; respiro prima e mi fermo dopo il settimo suono."],"result":"Sette suoni nell'ordine do-re-mi-re-do-do-do, una sillaba per suono; nessun suono nella pausa. La tonalità viene scelta dal docente."},"steps":[{"title":"Ascolta la frase","do":"Per il canto assegnato ascolta una frase breve nel registro concordato.","help":"Il modello deve essere udibile e ripetibile."},{"title":"Separa testo e note","do":"Prova testo ritmico e melodia prima di unirli.","help":"Segna con una barra il respiro concordato, senza trattenere forzatamente il fiato."},{"title":"Unisci e confronta","do":"Canta la frase e controlla attacco, ordine e chiusura.","help":"Riduci la lunghezza della frase se perdi il punto."}],"transfer":{"task":"Con lo stesso modello comodo canta do mi re do | re re do. Testo «Io sal-go qui | poi tor-no».","check":"Sette note e sette sillabe nell'ordine; la prima frase salta da do a mi, poi scende; finale su do. Il docente verifica le altezze."},"checks":["Testo e suoni hanno lo stesso numero di attacchi.","L'ordine delle note corrisponde al modello.","La pausa finale resta silenziosa."],"error":{"wrong":"Aggiungo una sillaba dopo il settimo suono.","why":"Non resta una nota assegnata a quella sillaba.","fix":"Riallinea sette sillabe a sette note prima di cantare."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Seguire il testo cantato","difficulty":"Perdo la riga mentre canto.","categories":["dislessia"],"signal":"Riprende una parola di una riga precedente.","aid":"Usa una frase per riga e evidenzia gli attacchi; ascolto del testo disponibile se utile.","preserve":"Cantare una breve frase rispettando ordine delle note e respiro concordato.","verify":"Confronta due tentativi con lo stesso criterio: Testo e suoni hanno lo stesso numero di attacchi. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Concorda movimenti, tempo e tecnica con il docente della disciplina; non usare il risultato per dedurre un DSA o altre diagnosi.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M15-05","goal":"Eseguire una sequenza strumentale breve controllando attacchi e durata.","materials":["Strumento scolastico assegnato","Scheda con due suoni già appresi A e B; docente per diteggiatura"],"techniques":[{"name":"Pratica per segmenti","how":"Prova prima il segmento indicato nell'esempio: Concordo quali note siano A e B e provo i due attacchi. Poi unisci i segmenti.","why":"Riduce il numero di azioni da gestire insieme; la precisione viene controllata prima di aumentare la velocità."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Le note lunghe occupano due conteggi.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Scegli con il docente due suoni già appresi e chiamali A e B. In quattro conteggi suona A sul 1, B sul 2, A tenuto su 3–4. La scheda non sostituisce le indicazioni tecniche dello strumento.","work":["Concordo quali note siano A e B e provo i due attacchi.","Conto A(1) B(2) A(3–4) senza interrompere il quarto conteggio.","Eseguo due volte allo stesso tempo comodo e verifico che l'ultimo suono duri due conteggi."],"result":"Tre attacchi e quattro conteggi; sequenza A-B-A, ultima durata doppia. Il suono effettivo dipende dallo strumento scelto."},"steps":[{"title":"Identifica i suoni","do":"Sul brano portato segna note e diteggiature già confermate dal docente.","help":"Non trasferire una posizione da uno strumento a un altro."},{"title":"Studia una cellula","do":"Prova lentamente tre attacchi controllando la durata.","help":"Nomina il punto del cambio prima di eseguirlo."},{"title":"Collega al brano","do":"Rientra nel passaggio precedente e continua dopo la cellula.","help":"Controlla continuità oltre al singolo suono corretto."}],"transfer":{"task":"Esegui B tenuto su 1–2, A sul 3 e B sul 4, con gli stessi suoni.","check":"Tre attacchi, sequenza B-A-B; primo suono lungo due conteggi; nessun conteggio aggiunto."},"checks":["I suoni seguono l'ordine richiesto.","Le note lunghe occupano due conteggi.","Gli attacchi non interrompono la pulsazione."],"error":{"wrong":"Suono A quattro volte perché conto quattro numeri.","why":"Numero di conteggi e numero di attacchi non coincidono.","fix":"Tieni A su 3–4 senza un nuovo attacco sul 4."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Cambiare suono","difficulty":"Perdo il tempo quando cambio posizione.","categories":["trasversale"],"signal":"Il cambio A/B interrompe ogni volta il conteggio.","aid":"Segna il cambio e prova due suoni molto lentamente con la tecnica del docente; difficoltà coordinative sono osservate senza attribuirle al DSA.","preserve":"Eseguire una sequenza strumentale breve controllando attacchi e durata.","verify":"Confronta due tentativi con lo stesso criterio: I suoni seguono l'ordine richiesto. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Concorda movimenti, tempo e tecnica con il docente della disciplina; non usare il risultato per dedurre un DSA o altre diagnosi.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M15-06","goal":"Mantenere il proprio ritmo ascoltando attacco e chiusura del gruppo.","materials":["Due esecutori, carta","Battiti di mani o percussioni sicure"],"techniques":[{"name":"Pratica per segmenti","how":"Prova prima il segmento indicato nell'esempio: Provo la parte A contando tutti i tempi; B prova la propria. Poi unisci i segmenti.","why":"Riduce il numero di azioni da gestire insieme; la precisione viene controllata prima di aumentare la velocità."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Il via è condiviso.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Due parti per due misure di quattro conteggi: A batte su 1 e 3; B su 2 e 4. Un compagno dà quattro conteggi preparatori; iniziate insieme e finite dopo otto conteggi.","work":["Provo la parte A contando tutti i tempi; B prova la propria.","Segniamo che nessuna parte deve copiare i colpi dell'altra.","Partiamo dopo il conteggio preparatorio e chiudiamo dopo il secondo 4."],"result":"Otto conteggi continui; quattro colpi per parte, alternati; stesso attacco e stessa chiusura."},"steps":[{"title":"Prepara la tua parte","do":"Nel brano d'insieme cerchia attacchi, pause e segnale finale della tua parte.","help":"Prova la tua linea prima di unirti agli altri."},{"title":"Concorda i segnali","do":"Stabilisci chi dà il via e come indica la fine.","help":"Guarda il segnale prima di iniziare."},{"title":"Suona e ascolta","do":"Mantieni la tua parte e controlla un punto comune del gruppo.","help":"Se perdi il punto, rientra nel punto concordato senza colpi casuali."}],"transfer":{"task":"Invertite le parti per una misura: A su 2 e 4, B su 1 e 3; poi fermatevi insieme.","check":"Ogni parte dà due colpi; l'insieme dà un colpo per conteggio; nessun colpo sul conteggio successivo alla chiusura."},"checks":["Ogni esecutore mantiene la parte assegnata.","Il via è condiviso.","La chiusura avviene nello stesso punto."],"error":{"wrong":"B copia A e batte su 1 e 3.","why":"Scompare l'alternanza prevista.","fix":"Ripeti B da solo su 2 e 4, poi unisci."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Seguire il gruppo","difficulty":"Mi confondo con la parte del compagno.","categories":["trasversale"],"signal":"Ripete il ritmo ascoltato invece di quello assegnato.","aid":"Usa una carta con la sola propria parte e un segnale visivo d'attacco.","preserve":"Mantenere il proprio ritmo ascoltando attacco e chiusura del gruppo.","verify":"Confronta due tentativi con lo stesso criterio: Ogni esecutore mantiene la parte assegnata. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Concorda movimenti, tempo e tecnica con il docente della disciplina; non usare il risultato per dedurre un DSA o altre diagnosi.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M15-07","goal":"Creare una sequenza sonora motivata da un evento narrativo.","materials":["Voce, mani e carta","Nessun file audio necessario"],"techniques":[{"name":"Bozzetto e revisione","how":"Prepara una prima versione seguendo questo vincolo: Gli eventi seguono l'ordine narrativo.","why":"Permette di controllare le scelte prima del prodotto finale."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Due scelte sonore sono motivate.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Sonorizza questa scena in 12 conteggi: 1–4 pioggia leggera, 5–8 pioggia forte, 9–12 pioggia che finisce. Usa mani e voce senza urla.","work":["Per 1–4 sfrego piano le mani.","Per 5–8 batto le dita sul tavolo con intensità maggiore.","Per 9–12 diminuisco gradualmente e lascio il 12 silenzioso."],"result":"Sequenza con crescendo nella parte centrale e diminuendo finale; scelta timbrica legata alla pioggia e chiusura in silenzio."},"steps":[{"title":"Dividi la scena","do":"Per l'invenzione assegnata segna eventi e durata di ogni segmento.","help":"Scrivi prima il fatto, poi il suono scelto."},{"title":"Scegli e prova i timbri","do":"Associa un suono a ogni evento e annota forte/piano, lungo/breve.","help":"Evita volume fastidioso; un suono efficace non deve essere fortissimo."},{"title":"Esegui e motiva","do":"Fai la sequenza completa e spiega due scelte.","help":"Un ascoltatore deve poter distinguere i segmenti."}],"transfer":{"task":"Sonorizza in otto conteggi: 1–4 passi che si avvicinano, 5–8 porta che si chiude e silenzio. Usa due timbri.","check":"Passi con colpi più intensi verso il 4; un timbro distinto per la porta tra 5 e 6; ultimi conteggi silenziosi. Altre soluzioni sono accettabili se motivano sequenza e due timbri."},"checks":["Gli eventi seguono l'ordine narrativo.","Due scelte sonore sono motivate.","La durata totale rispetta i conteggi."],"error":{"wrong":"Suono sempre con la stessa intensità per la pioggia che cresce.","why":"Non si distingue il cambiamento richiesto.","fix":"Prova tre livelli controllati e riduci il suono nel finale."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Gestire eventi e suoni","difficulty":"Mi dimentico il suono successivo.","categories":["trasversale"],"signal":"Si interrompe a ogni cambio di evento.","aid":"Usa una striscia con evento, simbolo del suono e numero di conteggi.","preserve":"Creare una sequenza sonora motivata da un evento narrativo.","verify":"Confronta due tentativi con lo stesso criterio: Gli eventi seguono l'ordine narrativo. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M15-08","goal":"Organizzare dati su genere, compositore e periodo senza confonderli.","materials":["Due schede didattiche inventate","Carta e penna"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Registro quattro campi separati per ogni scheda.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Le date sono ordinate correttamente.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Schede inventate: Lia Fonte, compositrice, pezzo del 1925 per pianoforte, danza in tre tempi; Enzo Ramo, compositore, pezzo del 1980 per gruppo di percussioni, marcia in due tempi. Compila autore, data, organico e tipo di brano.","work":["Registro quattro campi separati per ogni scheda.","Ordino 1925 prima di 1980 senza usare il tipo di brano come data.","Confronto danza in tre tempi e marcia in due; non assegno epoche o generi più precisi assenti nelle schede."],"result":"Fonte: 1925/pianoforte/danza in tre tempi. Ramo: 1980/percussioni/marcia in due tempi. Il nome dell'autore non è il genere."},"steps":[{"title":"Separa le informazioni","do":"Per il contenuto assegnato usa campi autore, opera, periodo, genere e organico.","help":"Scrivi non fornito nei campi mancanti."},{"title":"Collega alla fonte","do":"Per un compositore reale verifica i dati nel manuale o fonte indicata dal docente.","help":"Una data da sola non descrive tutte le caratteristiche della musica."},{"title":"Recupera e confronta","do":"Copri una colonna e ricostruisci due associazioni, poi controlla.","help":"Spiega una differenza con i dati delle schede."}],"transfer":{"task":"Schede inventate: Mira Lago, 1950, quartetto d'archi, ninna nanna; Dario Colle, 2000, voce e chitarra, canzone. Ordina e descrivi una differenza di organico.","check":"Lago 1950 precede Colle 2000; quartetto d'archi contro voce e chitarra; ninna nanna e canzone sono tipi descritti, non nomi dei compositori."},"checks":["Autore e tipo di brano non sono scambiati.","Le date sono ordinate correttamente.","L'organico è riportato senza strumenti inventati."],"error":{"wrong":"Scrivo pianoforte come compositore.","why":"È lo strumento, non l'autrice.","fix":"Sposta pianoforte in organico e Lia Fonte in autore."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Leggere più schede","difficulty":"Confondo i nomi e le informazioni.","categories":["dislessia"],"signal":"Associa la data o l'organico della seconda scheda alla prima.","aid":"Usa una scheda per riga, lettura audio se scelta, e controlla le associazioni una alla volta.","preserve":"Organizzare dati su genere, compositore e periodo senza confonderli.","verify":"Confronta due tentativi con lo stesso criterio: Autore e tipo di brano non sono scambiati. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M15-09","goal":"Descrivere e confrontare due sequenze usando criteri musicali comuni.","materials":["Due esecutori o un adulto","Carta per tabella"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Conto quattro eventi per ciascuna sequenza.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: La descrizione cita eventi precisi.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Sequenza A: quattro battiti di mani piano, uno ogni conteggio. B: quattro colpi di dita sul tavolo, forte-piano-forte-piano, allo stesso tempo. Ascolta le due sequenze e confronta numero di eventi, timbro e intensità.","work":["Conto quattro eventi per ciascuna sequenza.","A ha timbro di mani e intensità piano costante; B ha timbro di dita e intensità alternata.","Il tempo è uguale: l'intensità maggiore non dimostra una velocità maggiore."],"result":"Somiglianza: quattro eventi allo stesso tempo. Differenze: timbro e andamento dell'intensità."},"steps":[{"title":"Fissa i criteri","do":"Per i brani assegnati prepara le stesse righe: timbro, durata/ritmo, intensità e altri aspetti richiesti.","help":"Confronta lo stesso aspetto in entrambi."},{"title":"Ascolta e annota","do":"Segna un indizio per ogni criterio, con il punto del brano se disponibile.","help":"Usa più ascolti brevi con una domanda precisa."},{"title":"Scrivi il confronto","do":"Formula una somiglianza e una differenza sostenute dagli indizi.","help":"Preferisco A è un giudizio personale, non una caratteristica musicale."}],"transfer":{"task":"C: tre «mmm» brevi piano, uno per conteggio. D: un «mmm» piano tenuto tre conteggi. Confronta timbro, durata totale e attacchi.","check":"Stesso timbro vocale e stessa durata totale di tre conteggi; C ha tre attacchi brevi, D un attacco lungo."},"checks":["I criteri sono uguali per le due sequenze.","La descrizione cita eventi precisi.","Tempo e intensità non sono confusi."],"error":{"wrong":"B è più veloce perché è più forte.","why":"Il tempo delle due sequenze è dichiarato uguale.","fix":"Conta gli intervalli e descrivi B come più variabile nell'intensità."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Annotare il confronto","difficulty":"Non riesco a scrivere mentre ascolto.","categories":["disgrafia"],"signal":"Le note restano incomplete anche se sa descrivere i suoni a voce.","aid":"Scrivi dopo ogni sequenza con parole chiave; usa una tabella già pronta o dettatura se scelta.","preserve":"Descrivere e confrontare due sequenze usando criteri musicali comuni.","verify":"Confronta due tentativi con lo stesso criterio: I criteri sono uguali per le due sequenze. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M16-01","goal":"Seguire un percorso in ordine controllando orientamento ed equilibrio.","materials":["Schema su carta","Per la prova fisica: docente, spazio libero e segni a terra autorizzati"],"techniques":[{"name":"Pratica per segmenti","how":"Prova prima il segmento indicato nell'esempio: Disegno una linea, un segno da aggirare e un quadrato; frecce A→B→C. Poi unisci i segmenti.","why":"Riduce il numero di azioni da gestire insieme; la precisione viene controllata prima di aumentare la velocità."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: I cambi di direzione sono identificati.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Percorso didattico da concordare con il docente: A cammina lungo una linea a terra, B aggira un segno, C fermati con entrambi i piedi dentro un quadrato. Prima disegna il percorso; poi eseguilo solo nello spazio autorizzato.","work":["Disegno una linea, un segno da aggirare e un quadrato; frecce A→B→C.","Ripeto a voce linea, giro, stop e individuo dove cambia direzione.","Nella prova autorizzata osservo ordine e arresto nel quadrato, senza valutare la velocità."],"result":"Schema A→B→C corretto; esecuzione esemplificativa in ordine con arresto nel quadrato. L'eventuale equilibrio è osservato dal docente, non dedotto dal disegno."},"steps":[{"title":"Leggi le stazioni","do":"Nel percorso assegnato identifica azione e direzione per ogni stazione.","help":"Numerale senza cambiarne l'ordine."},{"title":"Prova i passaggi","do":"Con il docente prova un cambio di direzione alla volta.","help":"Non aggiungere ostacoli o superfici rialzate."},{"title":"Collega il percorso","do":"Esegui la sequenza e segna dove serve un'altra prova.","help":"Controlla ordine e arresto prima della rapidità."}],"transfer":{"task":"Nuovo schema: A entra nel quadrato, B cammina sulla linea, C aggira il segno e fermati. Disegnalo e, se autorizzato, eseguilo.","check":"Ordine quadrato→linea→giro→arresto; frecce corrette; nell'esecuzione arresto controllato e rispetto degli spazi."},"checks":["La sequenza rispetta le stazioni.","I cambi di direzione sono identificati.","L'arresto avviene nel punto richiesto."],"error":{"wrong":"Faccio C prima di B perché è più vicino.","why":"La posizione non cambia l'ordine richiesto.","fix":"Segui le frecce A→B→C e prova il passaggio B→C."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Cambiare stazione","difficulty":"Dimentico dove andare dopo la prima azione.","categories":["trasversale"],"signal":"Si ferma o raggiunge una stazione diversa da quella indicata.","aid":"Usa numeri a terra e una dimostrazione; eventuali difficoltà di equilibrio restano osservazioni trasversali.","preserve":"Seguire un percorso in ordine controllando orientamento ed equilibrio.","verify":"Confronta due tentativi con lo stesso criterio: La sequenza rispetta le stazioni. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Concorda movimenti, tempo e tecnica con il docente della disciplina; non usare il risultato per dedurre un DSA o altre diagnosi.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M16-02","goal":"Distinguere corsa, salto e lancio e preparare una sequenza conforme alle indicazioni.","materials":["Tre carte azione e matita","Esecuzione soltanto con docente e attrezzi autorizzati"],"techniques":[{"name":"Pratica per segmenti","how":"Prova prima il segmento indicato nell'esempio: Segno partenza e arrivo della corsa senza confonderli con il salto. Poi unisci i segmenti.","why":"Riduce il numero di azioni da gestire insieme; la precisione viene controllata prima di aumentare la velocità."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Ogni azione ha un controllo distinto.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Tre carte: C = corsa verso un segno; S = salto sul posto con arrivo nello spazio indicato; L = lancio di palla morbida verso un bersaglio quando la zona è libera. Ordina C-S-L e indica che cosa controllare in ogni azione. La tecnica e le distanze le decide il docente.","work":["Segno partenza e arrivo della corsa senza confonderli con il salto.","Per il salto scrivo arrivo nello spazio indicato; per il lancio zona libera.","Sul foglio preparo C→S→L e nella prova scolastica controllo un criterio per azione."],"result":"Corsa fino al segno; salto con arrivo nell'area; lancio verso bersaglio con zona libera. Nessuna misura o tecnica viene prescritta da questa scheda."},"steps":[{"title":"Nomina lo schema motorio","do":"Nel compito portato distingui correre, saltare, lanciare e altri gesti richiesti.","help":"Non sostituire un'azione con un'altra solo per completare il percorso."},{"title":"Scegli un criterio","do":"Prendi dal docente un criterio tecnico per ciascun gesto.","help":"Evita di correggere più dettagli insieme."},{"title":"Esegui e annota","do":"Nello spazio autorizzato prova e registra il criterio raggiunto o da riprendere.","help":"A casa lavora sullo schema; le prove fisiche richiedono condizioni concordate."}],"transfer":{"task":"Ordina L-C-S e indica un controllo per ogni azione usando le stesse carte.","check":"Lancio solo con zona libera, corsa verso il segno, salto nello spazio indicato; ordine L-C-S e controllo separato delle tre azioni."},"checks":["L'ordine delle tre azioni è corretto.","Ogni azione ha un controllo distinto.","Il lancio attende la zona libera."],"error":{"wrong":"Lancio mentre il compagno attraversa il bersaglio.","why":"Non rispetta la condizione indicata nella carta.","fix":"Attendi il segnale di zona libera del docente."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Ricordare più gesti","difficulty":"Mi confondo quando cambiano le azioni.","categories":["trasversale"],"signal":"Esegue due volte lo stesso gesto saltandone uno.","aid":"Tieni tre carte numerate visibili e prova una sola transizione per volta.","preserve":"Distinguere corsa, salto e lancio e preparare una sequenza conforme alle indicazioni.","verify":"Confronta due tentativi con lo stesso criterio: L'ordine delle tre azioni è corretto. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Concorda movimenti, tempo e tecnica con il docente della disciplina; non usare il risultato per dedurre un DSA o altre diagnosi.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M16-03","goal":"Collegare una capacità fisica alla richiesta dell'attività senza fare diagnosi.","materials":["Carta e schede didattiche"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Cerco la richiesta dominante: durata in A, tempo di risposta in B, resistenza del carico in C.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Le capacità non diventano etichette personali.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Definizioni per questa prova: resistenza = proseguire un'attività per il tempo previsto; rapidità = rispondere o muoversi in poco tempo; forza = vincere una resistenza. Associa: A mantenere il cammino previsto; B partire al segnale; C spostare un carico nella prova del docente.","work":["Cerco la richiesta dominante: durata in A, tempo di risposta in B, resistenza del carico in C.","Associo A alla resistenza, B alla rapidità, C alla forza.","Preciso che un'attività può coinvolgere più capacità: l'associazione evidenzia soltanto la richiesta qui descritta."],"result":"A resistenza; B rapidità; C forza, secondo le definizioni fornite. Non è un giudizio sulla condizione fisica di una persona."},"steps":[{"title":"Leggi la definizione","do":"Per la capacità studiata sottolinea durata, velocità o resistenza da vincere.","help":"Usa la definizione del libro, non etichette come bravo o debole."},{"title":"Trova la richiesta","do":"Descrivi che cosa richiede l'attività assegnata.","help":"Un risultato singolo non misura tutte le capacità."},{"title":"Controlla l'associazione","do":"Motiva il collegamento con una parola della definizione.","help":"Per pratica o allenamento segui soltanto dosi e condizioni concordate."}],"transfer":{"task":"Associa: D ripetere un movimento per il tempo stabilito; E reagire subito al segnale; F opporsi alla trazione di un elastico nella prova guidata.","check":"D resistenza; E rapidità; F forza. Le eventuali prove pratiche, carichi e tempi sono stabiliti dal docente."},"checks":["Ogni associazione cita la richiesta dell'attività.","Le capacità non diventano etichette personali.","Carichi e tempi non sono inventati."],"error":{"wrong":"Chi parte lentamente non ha forza.","why":"La partenza al segnale non basta a valutare la forza.","fix":"Descrivi la rapidità della risposta in quella prova e separa la forza."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Confrontare definizioni","difficulty":"Le tre parole mi sembrano uguali.","categories":["trasversale"],"signal":"Usa la stessa capacità per ogni richiesta.","aid":"Affianca ogni definizione a un simbolo: orologio, segnale, carico; poi spiega la parola chiave.","preserve":"Collegare una capacità fisica alla richiesta dell'attività senza fare diagnosi.","verify":"Confronta due tentativi con lo stesso criterio: Ogni associazione cita la richiesta dell'attività. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M16-04","goal":"Migliorare un gesto tecnico usando un criterio alla volta.","materials":["Scheda osservativa","Palla morbida e spazio scelti dal docente"],"techniques":[{"name":"Pratica per segmenti","how":"Prova prima il segmento indicato nell'esempio: Segno orientamento sì, attesa no, direzione sì. Poi unisci i segmenti.","why":"Riduce il numero di azioni da gestire insieme; la precisione viene controllata prima di aumentare la velocità."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: La correzione riguarda il punto osservato.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Prova didattica di passaggio a due mani, solo con il docente. Criteri forniti: orientati verso il compagno; passa quando è pronto; dirigi la palla nella zona concordata. Analizza il caso: Neri si orienta, passa prima del segnale, la palla arriva nella zona.","work":["Segno orientamento sì, attesa no, direzione sì.","Il punto da correggere è il momento del passaggio, non tutti i gesti.","Nella riprova attendo il segnale del compagno e mantengo i criteri riusciti."],"result":"Due criteri rispettati e uno da riprendere: attendere il compagno pronto. La tecnica specifica del gesto viene insegnata dal docente."},"steps":[{"title":"Osserva il modello","do":"Per il gesto assegnato scegli con il docente due o tre criteri visibili.","help":"La dimostrazione deve corrispondere allo sport studiato."},{"title":"Prova un punto","do":"Esegui concentrandoti sul criterio ancora da raggiungere.","help":"Chiedi feedback su quel criterio, non soltanto sul risultato finale."},{"title":"Ripeti e confronta","do":"Confronta due tentativi con gli stessi criteri.","help":"Se la palla arriva bene per caso, controlla comunque il procedimento."}],"transfer":{"task":"Caso nuovo: Leda aspetta il segnale e passa nella zona, ma guarda dalla parte opposta. Indica la correzione prioritaria.","check":"Attesa e direzione rispettate; orientamento da riprendere. Il docente mostra come orientarsi senza aggiungere correzioni non osservate."},"checks":["La scheda distingue i tre criteri.","La correzione riguarda il punto osservato.","La riprova usa lo stesso criterio."],"error":{"wrong":"Correggo la direzione perché il passaggio non è perfetto.","why":"Nel caso la direzione era già riuscita; il problema è l'attesa.","fix":"Segna i criteri uno per uno e lavora sul no."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Gestire il feedback","difficulty":"Mi confondo con troppe correzioni.","categories":["trasversale"],"signal":"Dopo una lunga spiegazione cambia tutti i gesti insieme.","aid":"Dai una sola indicazione e una dimostrazione; osserva la coordinazione senza collegarla automaticamente al DSA.","preserve":"Migliorare un gesto tecnico usando un criterio alla volta.","verify":"Confronta due tentativi con lo stesso criterio: La scheda distingue i tre criteri. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Concorda movimenti, tempo e tecnica con il docente della disciplina; non usare il risultato per dedurre un DSA o altre diagnosi.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M16-05","goal":"Scegliere una strategia di gioco in base a spazio, compagni e regole.","materials":["Schema su carta con A, B e D"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Segno D davanti ad A e B nello spazio libero.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: La motivazione cita uno spazio o un compagno.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Gioco inventato: A ha la palla; B è libero a destra; D avversario è davanti ad A. Regola: non si può correre con la palla; si può passare al compagno. Disegna una scelta che faccia avanzare il gioco.","work":["Segno D davanti ad A e B nello spazio libero.","Scelgo un passaggio verso B; non avanzo correndo con la palla.","Motivo: B è libero e il passaggio rispetta la regola."],"result":"Freccia A→B a destra; scelta motivata con spazio libero e regola del passaggio. La riuscita pratica dipende anche dagli avversari."},"steps":[{"title":"Leggi la situazione","do":"Nel gioco assegnato identifica chi ha la palla, chi è libero e il vincolo.","help":"Disegna posizioni semplici senza dettagli superflui."},{"title":"Confronta due scelte","do":"Indica una possibilità utile e una che viola la regola o trova spazio chiuso.","help":"La decisione dipende dalla situazione, non da una scelta sempre giusta."},{"title":"Prova e rivedi","do":"Nella pratica guidata verifica se lo spazio resta libero prima di agire.","help":"Spiega dopo la prova che cosa è cambiato."}],"transfer":{"task":"A ha la palla, B è marcato a destra, C è libero a sinistra; stessa regola. Proponi e motiva una scelta.","check":"Passaggio A→C a sinistra motivato dallo spazio libero; non correre con la palla. Se si considera un'altra scelta, deve rispettare la regola e spiegare il vantaggio."},"checks":["La scelta rispetta la regola data.","La motivazione cita uno spazio o un compagno.","La strategia viene aggiornata se cambiano le posizioni."],"error":{"wrong":"Corro oltre D con la palla.","why":"Il gioco vieta correre con la palla.","fix":"Cerca un compagno libero e traccia il passaggio."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Leggere le posizioni","difficulty":"Non riesco a tenere a mente tutti i giocatori.","categories":["trasversale"],"signal":"La scelta usa una posizione precedente al cambio.","aid":"Usa poche pedine sulla carta e ferma la situazione prima di confrontare due opzioni.","preserve":"Scegliere una strategia di gioco in base a spazio, compagni e regole.","verify":"Confronta due tentativi con lo stesso criterio: La scelta rispetta la regola data. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M16-06","goal":"Collaborare in un gioco distribuendo ruoli e controllando un obiettivo comune.","materials":["Carta per ruoli","Prova in palestra solo con attrezzi e spazio del docente"],"techniques":[{"name":"Pratica per segmenti","how":"Prova prima il segmento indicato nell'esempio: Assegno A primo passaggio, B ricezione e secondo passaggio, C ricezione finale. Poi unisci i segmenti.","why":"Riduce il numero di azioni da gestire insieme; la precisione viene controllata prima di aumentare la velocità."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: I ruoli e la rotazione sono chiari.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Gioco cooperativo inventato: tre compagni devono far arrivare una palla morbida da A a C attraverso B; tutti devono riceverla una volta, nessuno è eliminato. Prepara i ruoli e una regola di comunicazione.","work":["Assegno A primo passaggio, B ricezione e secondo passaggio, C ricezione finale.","Concordo la parola pronto prima di ogni passaggio.","Controllo l'obiettivo del gruppo: A→B→C, due passaggi, tutti coinvolti; poi ruotiamo i ruoli."],"result":"Sequenza A→B→C con due passaggi e segnale pronto; ruoli ruotati nella seconda prova. Il risultato comune include il coinvolgimento di tutti."},"steps":[{"title":"Definisci l'obiettivo comune","do":"Nel gioco portato scrivi che cosa deve riuscire al gruppo.","help":"Il punteggio da solo può non descrivere la collaborazione."},{"title":"Assegna e ruota i ruoli","do":"Concorda chi agisce, chi riceve e chi osserva, poi cambia i ruoli.","help":"Tutti devono sapere quando entrare."},{"title":"Verifica la cooperazione","do":"Conta il coinvolgimento e l'uso dei segnali dopo la prova.","help":"Riprendi il passaggio interrotto senza escludere chi ha sbagliato."}],"transfer":{"task":"Quattro compagni A-B-C-D; la palla passa in ordine e ogni compagno dice pronto. Prepara ruoli e controllo.","check":"Tre passaggi A→B→C→D, quattro partecipanti coinvolti, segnale prima di ciascun passaggio; rotazione dei ruoli proposta."},"checks":["Tutti partecipano secondo la regola.","I ruoli e la rotazione sono chiari.","Il segnale precede il passaggio."],"error":{"wrong":"A passa direttamente a C per finire prima.","why":"B viene escluso e la consegna non è rispettata.","fix":"Riparti da A e passa attraverso B."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Entrare nel proprio turno","difficulty":"Non capisco quando tocca a me.","categories":["trasversale"],"signal":"Agisce prima del segnale o resta fermo al suo turno.","aid":"Assegna una posizione e un numero di turno visibili e fai una prova lenta dei segnali.","preserve":"Collaborare in un gioco distribuendo ruoli e controllando un obiettivo comune.","verify":"Confronta due tentativi con lo stesso criterio: Tutti partecipano secondo la regola. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Concorda movimenti, tempo e tecnica con il docente della disciplina; non usare il risultato per dedurre un DSA o altre diagnosi.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M16-07","goal":"Applicare regole e distinguere giocatore, arbitro e osservatore.","materials":["Regolamento inventato e carta"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: A→B è passaggio 1 e B→C è passaggio 2.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: La decisione cita una regola.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Regole del gioco «Tre passaggi»: non correre con la palla; dopo tre passaggi consecutivi la squadra ottiene un punto; se la palla cade si riparte da zero. Caso: A→B→C, poi C corre con la palla. Indica conteggio e intervento dell'arbitro.","work":["A→B è passaggio 1 e B→C è passaggio 2.","C corre: viola la prima regola; non è stato completato il terzo passaggio.","L'arbitro segnala la violazione e applica la ripresa concordata dal docente; l'osservatore registra il fatto."],"result":"Due passaggi, nessun punto; violazione per corsa. Il regolamento fornito non specifica la ripresa dopo questa violazione: va concordata, non inventata."},"steps":[{"title":"Separa regola e ruolo","do":"Nel gioco assegnato elenca che cosa può fare il giocatore e che cosa controlla l'arbitro.","help":"L'osservatore descrive i fatti senza decidere tutte le sanzioni."},{"title":"Applica al caso","do":"Conta azioni e verifica ogni condizione della regola.","help":"Non applicare regole di uno sport diverso."},{"title":"Chiarisci i vuoti","do":"Se il regolamento non indica una ripresa, chiedi al docente prima della partita.","help":"Accordate la regola e applicatela allo stesso modo a tutti."}],"transfer":{"task":"Caso: A→B→C→A, poi la palla cade. Quanti passaggi e punti prima della caduta? Che cosa succede al conteggio successivo?","check":"Tre passaggi completati: un punto; dopo la caduta il nuovo conteggio parte da zero. La caduta non cancella il punto già assegnato secondo queste regole."},"checks":["Il conteggio distingue passaggi e ricevitori.","La decisione cita una regola.","Una ripresa non prevista non viene inventata."],"error":{"wrong":"Assegno tre passaggi perché vedo tre giocatori.","why":"A→B→C contiene solo due trasferimenti.","fix":"Conta le frecce, non i nomi."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Seguire il regolamento","difficulty":"Perdo la regola quando il gioco cambia.","categories":["dislessia"],"signal":"Cita una norma diversa da quella del gioco.","aid":"Usa tre carte regola con testo breve e lettura audio se utile; consulta la carta pertinente.","preserve":"Applicare regole e distinguere giocatore, arbitro e osservatore.","verify":"Confronta due tentativi con lo stesso criterio: Il conteggio distingue passaggi e ricevitori. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M16-08","goal":"Riprodurre e inventare una sequenza espressiva con conteggi e significato.","materials":["Carta con otto caselle","Spazio e movimenti autorizzati dal docente"],"techniques":[{"name":"Pratica per segmenti","how":"Prova prima il segmento indicato nell'esempio: Disegno quattro posizioni e scrivo due conteggi sotto ciascuna. Poi unisci i segmenti.","why":"Riduce il numero di azioni da gestire insieme; la precisione viene controllata prima di aumentare la velocità."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: I quattro segmenti restano in ordine.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Sequenza espressiva da adattare con il docente: su 1–2 apri le braccia per «albero», 3–4 inclinale per «vento», 5–6 torna al centro, 7–8 fermati. Prima rappresentala con quattro disegni, poi eseguila nello spazio autorizzato.","work":["Disegno quattro posizioni e scrivo due conteggi sotto ciascuna.","Provo il cambio al conteggio 3 e il ritorno al 5, senza cercare velocità.","Unisco otto conteggi; spiego che l'inclinazione rappresenta il vento."],"result":"Quattro segmenti di due conteggi, ordine albero→vento→centro→fermo; gesto del vento motivato. Ampiezza e posizione sono adattate dal docente."},"steps":[{"title":"Dividi in conteggi","do":"Nella sequenza assegnata scrivi durata e gesto di ciascun segmento.","help":"Un gesto espressivo deve avere anche un punto di inizio e fine."},{"title":"Prova le transizioni","do":"Con il docente prova un cambio per volta e scegli ampiezza gestibile.","help":"Non forzare posizioni per imitare perfettamente un modello."},{"title":"Unisci e spiega","do":"Esegui nel tempo concordato e spiega un gesto legato al tema.","help":"Valuta ordine, tempo e significato distintamente."}],"transfer":{"task":"Crea otto conteggi per «fiore che si apre»: 1–2 raccolto, 3–4 apertura, 5–6 posizione aperta, 7–8 chiusura. Disegna e motiva un gesto; esegui solo se autorizzato.","check":"Quattro segmenti in ordine, otto conteggi, apertura chiaramente distinguibile e motivazione coerente; possibili versioni sedute o in piedi concordate."},"checks":["Gli otto conteggi sono conservati.","I quattro segmenti restano in ordine.","Un gesto comunica il significato motivato."],"error":{"wrong":"Faccio quattro gesti in quattro conteggi.","why":"Ogni gesto doveva durare due conteggi.","fix":"Scrivi due caselle per gesto e conta anche mentre mantieni la posizione."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Coordinare gesto e conteggio","difficulty":"Mi perdo se conto e mi muovo insieme.","categories":["trasversale"],"signal":"Il gesto cambia correttamente ma il conteggio si interrompe.","aid":"Un compagno conta; usa disegni dei gesti. Il docente adatta il movimento osservato senza attribuirlo automaticamente al DSA.","preserve":"Riprodurre e inventare una sequenza espressiva con conteggi e significato.","verify":"Confronta due tentativi con lo stesso criterio: Gli otto conteggi sono conservati. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Concorda movimenti, tempo e tecnica con il docente della disciplina; non usare il risultato per dedurre un DSA o altre diagnosi.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M16-09","goal":"Preparare una pratica scolastica rispettando istruzioni di sicurezza e riscaldamento.","materials":["Carta con protocollo didattico","Docente per ogni esecuzione"],"techniques":[{"name":"Scomposizione del compito","how":"Trasforma la consegna in azioni brevi: leggi il protocollo reale, ordina la preparazione, segnala un problema.","why":"Fa vedere che cosa iniziare, che cosa completare e che cosa controllare."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Il riscaldamento segue le istruzioni del docente.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Protocollo fittizio della lezione: controllare spazio e scarpe; ascoltare attività e riscaldamento del docente; iniziare al segnale; comunicare subito dolore o malessere e interrompere la prova secondo le sue indicazioni. Caso: il pavimento ha uno zaino vicino al percorso. Che cosa fai?","work":["Individuo l'ostacolo prima della partenza.","Avviso il docente e attendo che lo spazio sia reso adatto.","Riprendo ascolto del riscaldamento e attendo il segnale; non invento esercizi sostitutivi."],"result":"Segnalo lo zaino, non inizio nel percorso occupato, seguo riscaldamento e segnale del docente. Il protocollo reale della scuola prevale su questo esempio."},"steps":[{"title":"Leggi il protocollo reale","do":"Prima della lezione verifica istruzioni del docente, spazio e attrezzatura richiesti.","help":"La scheda è organizzativa e non prescrive un allenamento."},{"title":"Ordina la preparazione","do":"Metti controllo, riscaldamento guidato e partenza nella sequenza della scuola.","help":"A casa prepara la checklist; non provare nuovi esercizi da solo."},{"title":"Segnala un problema","do":"Comunica un ostacolo o un malessere alla persona responsabile.","help":"Usa descrizioni semplici di ciò che osservi o senti."}],"transfer":{"task":"Stesso protocollo: un compagno parte prima del segnale e riferisce malessere. Indica due azioni appropriate.","check":"Segnalare al docente e interrompere/attendere secondo il protocollo; non spingerlo a continuare. Non cercare una diagnosi o un trattamento nella guida."},"checks":["Il controllo precede la partenza.","Il riscaldamento segue le istruzioni del docente.","Un problema viene segnalato prima di proseguire."],"error":{"wrong":"Parto lo stesso perché posso evitare lo zaino.","why":"Il protocollo richiede uno spazio controllato e un via.","fix":"Avvisa e attendi che il docente confermi la partenza."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Seguire la preparazione","difficulty":"Salto un controllo perché ho fretta.","categories":["trasversale"],"signal":"Inizia mentre spazio o istruzioni non sono ancora verificati.","aid":"Usa tre caselle prima di iniziare: spazio, istruzioni, segnale; spuntale con il docente.","preserve":"Preparare una pratica scolastica rispettando istruzioni di sicurezza e riscaldamento.","verify":"Confronta due tentativi con lo stesso criterio: Il controllo precede la partenza. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M16-10","goal":"Rispondere a una verifica teorica con definizione ed esempio coerente.","materials":["Testo didattico fornito, carta e penna"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Riprendo obiettivo comune nella prima risposta.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: Definizione ed esempio sono distinguibili.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Testo: «Nel gioco cooperativo il gruppo cerca un obiettivo comune; i ruoli possono ruotare. L'arbitro applica le regole concordate; l'osservatore registra ciò che accade». Domande: definisci gioco cooperativo; distingui arbitro e osservatore; proponi una rotazione.","work":["Riprendo obiettivo comune nella prima risposta.","Scrivo arbitro: applica regole; osservatore: registra fatti.","Propongo: nella seconda prova chi osservava diventa giocatore e un giocatore osserva."],"result":"Gioco cooperativo: attività con obiettivo comune del gruppo. Arbitro e osservatore hanno compiti diversi. Rotazione esemplificativa descritta senza cambiare le regole."},"steps":[{"title":"Scomponi le domande","do":"Per la verifica assegnata cerchia definisci, distingui, spiega o applica.","help":"Il verbo indica il tipo di risposta."},{"title":"Recupera il contenuto","do":"Rispondi con parole tue e un esempio, poi controlla nel manuale.","help":"La definizione non deve diventare un elenco di sport."},{"title":"Verifica ogni parte","do":"Conta le richieste soddisfatte e correggi una confusione.","help":"Segna fonte e punto da chiedere al docente."}],"transfer":{"task":"Testo: «Nel percorso ogni stazione ha un'azione; l'ordine è indicato dalle frecce. Il segnale del docente avvia la prova». Spiega stazione, ordine e partenza.","check":"Stazione = punto con azione prevista; ordine = sequenza delle frecce; partenza = segnale del docente. Tre risposte ancorate al testo."},"checks":["Ogni domanda ha una risposta pertinente.","Definizione ed esempio sono distinguibili.","I ruoli sono assegnati correttamente."],"error":{"wrong":"L'osservatore decide tutte le sanzioni.","why":"Nel testo registra fatti; l'arbitro applica regole.","fix":"Rileggi le due definizioni e riscrivi una funzione per ruolo."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Leggere le domande","difficulty":"Salto la seconda parte della domanda.","categories":["dislessia"],"signal":"Risponde alla definizione ma non al confronto richiesto.","aid":"Dividi la domanda in due righe e consenti lettura audio se scelta; spunta ogni parte.","preserve":"Rispondere a una verifica teorica con definizione ed esempio coerente.","verify":"Confronta due tentativi con lo stesso criterio: Ogni domanda ha una risposta pertinente. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M17-01","goal":"Distinguere un principio costituzionale da una regola scolastica e proporre un'applicazione.","materials":["Carta e testo fornito"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Individuo il principio di uguaglianza senza distinzione di lingua.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: La proposta affronta l'ostacolo del caso.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Sintesi editoriale dell'art. 3 della Costituzione, verificato sul Senato: pari dignità, uguaglianza davanti alla legge e rimozione degli ostacoli che limitano la partecipazione. Regola inventata della classe: tutti hanno un turno di parola. Caso: un compagno viene escluso perché parla un'altra lingua. Collega principio e regola.","work":["Individuo il principio di uguaglianza senza distinzione di lingua.","La regola dei turni è una modalità della classe, non il testo della Costituzione.","Propongo un turno anche per il compagno e una spiegazione accessibile della consegna; ciascuno rispetta i turni."],"result":"Principio: non escludere per la lingua. Regola locale: turni per tutti. Applicazione: garantire il turno e rendere comprensibile la consegna; dovere pratico concordato: ascoltare gli altri."},"steps":[{"title":"Leggi il livello della norma","do":"Nel compito assegnato separa Costituzione, regola del contesto e proposta personale.","help":"Cita articolo e fonte solo quando li hai verificati."},{"title":"Trova diritto e responsabilità","do":"Descrivi che cosa deve essere garantito e quale comportamento è richiesto nel caso.","help":"Non ridurre il diritto a un premio per chi è più bravo."},{"title":"Applica e motiva","do":"Proponi un'azione coerente col principio e con il contesto.","help":"Per una questione reale di diritto chiedi la fonte e il docente: l'esempio non è consulenza legale."}],"transfer":{"task":"Stesso principio e regola: un compagno non comprende il modulo per iscriversi al gruppo. Proponi una misura di partecipazione e distinguila dalla norma costituzionale.","check":"Spiegare il modulo con parole chiare o un aiuto di lettura favorisce la partecipazione. La misura è una proposta scolastica, non una citazione costituzionale."},"checks":["Principio e regola locale sono distinti.","La proposta affronta l'ostacolo del caso.","Il dovere pratico è descritto come regola concordata."],"error":{"wrong":"Il turno di parola è scritto nell'articolo 3.","why":"Il turno è una regola inventata, collegata al principio ma non citata nell'articolo.","fix":"Etichetta i due livelli: principio costituzionale e regola della classe."},"home":["Usa i passaggi sul compito assegnato e conserva la prima versione con una correzione visibile.","Riprendi domani e dopo tre giorni: rifai un piccolo segmento o rispondi a una domanda senza leggere la soluzione; poi controlla. Puoi usare gli strumenti compensativi concordati.","Se dopo due tentativi resta lo stesso ostacolo, indica il punto preciso e chiedi un esempio al docente o al professionista."],"adaptations":[{"stage":"Leggere il testo","difficulty":"Mi perdo nelle frasi della norma.","categories":["dislessia"],"signal":"Confonde sintesi, citazione e regola locale.","aid":"Usa testo letto ad alta voce o audio scelto e tre etichette: principio, regola, proposta.","preserve":"Distinguere un principio costituzionale da una regola scolastica e proporre un'applicazione.","verify":"Confronta due tentativi con lo stesso criterio: Principio e regola locale sono distinti. Annota se l'aiuto rende il passaggio più gestibile."}],"coach":"Mostra una volta il passaggio difficile, poi passa a una domanda e infine lascia iniziare il ragazzo. Riduci i suggerimenti didattici quando applica il criterio su una prova nuova; gli strumenti compensativi scelti in base al bisogno restano disponibili. Valuta il contenuto e il procedimento con i criteri della consegna, senza ricavare diagnosi dalla prestazione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M17-02","goal":"Riconoscere un comportamento irrispettoso e formulare una risposta che coinvolga un adulto.","materials":["Breve caso inventato e carta"],"techniques":[{"name":"Autospiegazione","how":"Spiega a voce il motivo di ogni scelta nell'esempio, a partire da: Registro ripetizione, insulto, esclusione e richiesta ignorata.","why":"Rende visibile il ragionamento e aiuta a trovare i passaggi mancanti."},{"name":"Prova nuova con controllo","how":"Esegui il mini compito nuovo prima di leggere il controllo. Confronta soprattutto questo criterio: La risposta evita ritorsioni.","why":"Mostra se sai usare il procedimento su materiale diverso; un errore indica il passaggio da riprendere."}],"example":{"task":"Caso inventato: da tre giorni alcuni compagni chiamano Lino con un insulto e lo escludono dal gruppo; Lino chiede di smettere, loro continuano. Descrivi i fatti e una risposta rispettosa senza assegnare diagnosi o colpe personali generiche.","work":["Registro ripetizione, insulto, esclusione e richiesta ignorata.","Non lo riduco a un semplice scherzo perché la richiesta di smettere è ignorata.","Propongo: non ripetere l'insulto, includere Lino se lo desidera e riferire i fatti al docente."],"result":"Descrizione concreta del comportamento ripetuto; sostegno e segnalazione al docente. La valutazione del caso reale spetta agli adulti responsabili, non a un'etichetta automatica."},"steps":[{"title":"Separa fatti e etichette","do":"Per il caso scolastico descrivi azioni, ripetizioni e conseguenze riportate.","help":"Evita tutti sono cattivi; scrivi chi fa che cosa nel caso fittizio."},{"title":"Scegli una risposta rispettosa","do":"Formula un'azione che non aumenti derisione o esclusione.","help":"Non chiedere al ragazzo di affrontare da solo una situazione che lo mette in difficoltà."},{"title":"Coinvolgi un adulto","do":"Indica a chi riferire i fatti nella scuola e quale aiuto chiedere.","help":"Per un fatto reale usa i canali della scuola; non raccogliere casi personali in questa scheda."}],"transfer":{"task":"Caso: un messaggio del gruppo deride l'accento di Sara e invita a non lavorare con lei. Scrivi i fatti, una frase rispettosa e a chi chiedere aiuto.","check":"Fatti: derisione dell'accento ed e
