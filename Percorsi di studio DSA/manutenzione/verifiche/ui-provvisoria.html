o.","check":"«Domani andremo al museo. La guida spiegherà le sale e indicherà il quadro». Forme equivalenti coerenti; guida soggetto singolare, tempi compatibili col futuro."},"checks":["Conservi i fatti richiesti.","Tempi e riferimenti sono coerenti.","Sai motivare una correzione."],"error":{"wrong":"Correggo la grafia ma lascio Ieri andrò.","why":"La revisione formale non risolve la contraddizione temporale.","fix":"Controlla prima ieri e il tempo verbale."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Rivedi la forma","difficulty":"Rileggendo il mio testo non vedo gli errori.","categories":["disortografia"],"signal":"Gli stessi errori restano dopo rilettura globale.","aid":"Aspetta una breve pausa, poi cerca una sola categoria di errori con una scheda; usa correttore concordato quando l'obiettivo è il contenuto.","preserve":"Rivedere un testo separando contenuto, coerenza e forma.","verify":"Confronta errori bersaglio prima e dopo, senza confonderli con qualità delle idee."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non correggere tutto al posto del ragazzo; seleziona un bersaglio sostenibile e mantieni gli strumenti compensativi.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M05-11","goal":"Prendere appunti selettivi durante un ascolto e ricostruire il messaggio.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Parole chiave in ascolto","how":"Annota argomento, dati e nessi anziché copiare ogni frase.","why":"Riduce la scrittura simultanea."},{"name":"Ricostruzione immediata","how":"Riformula dagli appunti e segnala i buchi.","why":"Controlla utilità degli appunti."}],"example":{"task":"Un adulto legge questo testo originale una volta, poi ripete su richiesta: «La raccolta dei libri usati comincia lunedì e termina venerdì. I libri vanno portati in biblioteca. Devono avere tutte le pagine. I volontari li divideranno per età». Prendi appunti e ricostruisci.","work":["Scrivo raccolta libri: lun-ven; biblioteca.","Aggiungo requisito: pagine complete.","Segno volontari→divisione per età, poi ricostruisco le quattro informazioni."],"result":"Appunti: «Libri usati | lun→ven | biblioteca | pagine complete | volontari: per età». Ricostruzione: la raccolta dura da lunedì a venerdì in biblioteca; i libri devono essere completi e i volontari li divideranno per età."},"steps":[{"title":"Prepara lo spazio","do":"Scrivi argomento e tre zone: quando, dove, condizioni.","help":"Se l'argomento non è noto, lascia una riga per il titolo."},{"title":"Annota mentre ascolti","do":"Segna parole chiave, numeri e frecce comprensibili.","help":"Usa abbreviazioni che sai sciogliere."},{"title":"Completa subito dopo","do":"Ricostruisci il messaggio e chiedi il dato mancante.","help":"Non trasformare il punto interrogativo in un'informazione inventata."}],"transfer":{"task":"Ascolto originale: «La visita alla serra è giovedì alle nove. Il ritrovo è al cancello. Portate un quaderno; la visita dura un'ora». Prendi appunti e riferisci.","check":"Giovedì9; cancello; quaderno; durata1ora. La ricostruzione include tutti e quattro i dati, senza sostituire visita con partenza."},"checks":["Gli appunti conservano i dati chiave.","Le abbreviazioni sono interpretabili.","Riconosci e chiedi ciò che manca."],"error":{"wrong":"Copio l'inizio e non sento biblioteca e requisito.","why":"La copia integrale assorbe l'ascolto.","fix":"Passa a parole chiave e chiedi di ripetere il dato mancante."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Annota mentre ascolti","difficulty":"Scrivere mentre ascolto mi fa perdere il seguito.","categories":["disgrafia"],"signal":"Ti fermi sulle prime parole e ometti i dati successivi.","aid":"Usa uno schema già diviso e poche parole; concorda materiale preparato o registrazione solo se consentita.","preserve":"Prendere appunti selettivi durante un ascolto e ricostruire il messaggio.","verify":"Verifica quanti dati puoi ricostruire e quanta fatica riferisci."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. L'ascolto letto qui è un modello breve; verifica poi ritmo e densità della lezione reale. Non registrare senza accordo.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M05-12","goal":"Preparare un'esposizione informativa o un racconto orale con struttura e controllo dell'ascolto.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Scaletta per funzione","how":"Per esposizione organizza tema e dati; per racconto eventi e cambiamento.","why":"Distingue i due prodotti."},{"name":"Prova con domanda","how":"Dopo il discorso chiedi all'ascoltatore un dato o un nesso.","why":"Verifica comprensibilità."}],"example":{"task":"Dati inventati: «La classe costruisce un raccoglitore di fogli; usa una scatola, tre separatori e etichette. All'inizio i fogli si mescolavano; dopo i separatori ogni materia ha uno spazio». Esponi il funzionamento e racconta la realizzazione.","work":["Esposizione: tema→materiali→funzione dei separatori.","Racconto: problema→costruzione→cambiamento.","Per entrambe concludo collegando separatori e ordine."],"result":"Esposizione: «Il raccoglitore è una scatola con tre separatori etichettati. Ogni spazio contiene i fogli di una materia». Racconto: «I fogli della classe si mescolavano. Abbiamo diviso una scatola con tre separatori e li abbiamo etichettati. Ora ogni materia ha uno spazio»."},"steps":[{"title":"Chiarisci la funzione","do":"Decidi se devi spiegare un argomento o raccontare eventi.","help":"I dati non richiedono sempre una storia."},{"title":"Prepara parole chiave","do":"Organizza inizio, nuclei e conclusione.","help":"Scrivi separatori→materie, non un copione lungo."},{"title":"Parla e verifica","do":"Prova con un ascoltatore e controlla il nesso centrale.","help":"Chiedi come i separatori risolvono il problema."}],"transfer":{"task":"Dati inventati: «Un semaforo di carta segnala il livello di rumore: verde basso, giallo medio, rosso alto. La classe lo prova durante un lavoro». Spiega lo strumento e racconta l'avvio della prova.","check":"Esposizione con tre colori e significati corretti; racconto con classe che avvia la prova, senza inventare risultati della prova. Distinguere funzionamento ed evento."},"checks":["La struttura segue lo scopo.","Dati ed eventi non si confondono.","L'ascoltatore comprende il nesso principale."],"error":{"wrong":"Dico che il semaforo ha ridotto il rumore, anche se non c'è un risultato.","why":"Aggiungi un esito non fornito.","fix":"Racconta soltanto che la classe avvia la prova."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Parla e verifica","difficulty":"Leggo tutta la scaletta senza guardare chi ascolta.","categories":["trasversale"],"signal":"La spiegazione diventa elenco di parole scollegate.","aid":"Usa tre cartoncini con un nucleo ciascuno e prova una frase per cartoncino.","preserve":"Preparare un'esposizione informativa o un racconto orale con struttura e controllo dell'ascolto.","verify":"Verifica se sai collegare i punti senza leggere un testo completo."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non imporre contatto oculare come prova di competenza; valuta chiarezza e collegamenti, con supporti concordati.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M05-13","goal":"Partecipare a una discussione ascoltando, motivando e riprendendo il punto altrui.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Riformulazione del punto altrui","how":"Riassumi la proposta prima di rispondere.","why":"Verifica l'ascolto."},{"name":"Intervento con ragione","how":"Esprimi posizione, motivo ed eventuale domanda.","why":"Evita attacchi alla persona."}],"example":{"task":"Discussione inventata. Lea: «Vorrei fare il cartellone a coppie per dividere il lavoro». Nino: «Preferisco lavorare solo per scegliere i dettagli». Scrivi una risposta che comprenda entrambi.","work":["Lea cerca divisione del lavoro; Nino autonomia nei dettagli.","Riformulo le due esigenze senza dire chi è pigro.","Propongo coppie con parti individuali e una revisione comune."],"result":"«Lea propone le coppie per dividere il lavoro; Nino vuole scegliere i propri dettagli. Potremmo preparare parti individuali e poi unirle a coppie, così condividiamo il compito. Vi sembra una prova utile?»"},"steps":[{"title":"Ascolta e annota","do":"Segna proposta e ragione del compagno.","help":"Non preparare la risposta ignorando il motivo."},{"title":"Riformula e verifica","do":"Ripeti il punto con parole tue e chiedi se lo hai capito.","help":"Distingui voglio scegliere da non voglio aiutare."},{"title":"Intervieni con motivo","do":"Esponi accordo, dissenso o proposta con una ragione.","help":"Puoi chiedere un chiarimento anziché chiudere subito."}],"transfer":{"task":"Ada: «Apriamo la finestra perché fa caldo». Ivo: «Non tutta: vicino alla finestra sento freddo». Formula una risposta rispettosa con proposta verificabile.","check":"Riconosci caldo e disagio di Ivo; proposta possibile apertura parziale per pochi minuti e verifica, o cambio di posto consensuale. Non ridicolizzare né inventare temperatura."},"checks":["Riformuli il motivo altrui.","Motivi il tuo intervento.","Proponi o chiedi senza attacco personale."],"error":{"wrong":"Nino è egoista, quindi non lo ascoltiamo.","why":"Attribuisci un tratto personale invece di discutere la proposta.","fix":"Riprendi il bisogno di scegliere dettagli e cerca un accordo."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Ascolta e annota","difficulty":"Aspettando il turno dimentico la mia idea.","categories":["trasversale"],"signal":"Interrompi o rinunci all'intervento.","aid":"Annota tre parole: punto altrui, tua ragione, domanda; usa un turno concordato.","preserve":"Partecipare a una discussione ascoltando, motivando e riprendendo il punto altrui.","verify":"Verifica se riesci a intervenire sul tema al tuo turno."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. La discussione non richiede accordo finale; osserva ascolto, ragioni e rispetto dei turni senza imporre consenso.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M06-01","goal":"Studiare un paragrafo di storia ricostruendo periodo, fatti e collegamenti.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Domande al paragrafo","how":"Trasforma titolo e testo in quando, chi, che cosa cambia e perché.","why":"Orienta lo studio."},{"name":"Recupero e verifica","how":"Chiudi il paragrafo, rispondi e riapri sulle lacune.","why":"Controlla il richiamo."}],"example":{"task":"Paragrafo didattico su un paese immaginario: «Nel 1880 Vallechiara aprì una strada verso il mercato. Prima i carri passavano su un sentiero spesso fangoso. La nuova strada rese più regolari i trasporti; il mercato restò ogni sabato». Studia e spiega cambiamento e permanenza.","work":["Quando e dove: 1880, Vallechiara.","Cambiamento: da sentiero fangoso a strada e trasporti più regolari.","Permanenza: mercato del sabato."],"result":"Nel 1880 Vallechiara costruì una strada verso il mercato, sostituendo il difficile sentiero. I trasporti divennero più regolari, mentre il mercato continuò a svolgersi il sabato."},"steps":[{"title":"Prepara le domande","do":"Leggi titolo e individua periodo e argomento.","help":"Scrivi quando, cambiamento, effetto e permanenza."},{"title":"Leggi per relazioni","do":"Annota pochi fatti con collegamenti.","help":"Strada→trasporti regolari, non solo strada."},{"title":"Recupera e correggi","do":"Spiega senza testo e riaprilo sui dati incerti.","help":"Riprendi il giorno dopo le stesse domande."}],"transfer":{"task":"Paragrafo inventato: «Nel 1920 Pietraluce inaugurò una scuola vicino alla piazza. Prima le lezioni erano in una casa privata. Il maestro rimase lo stesso». Spiega cambiamento e permanenza.","check":"1920 a Pietraluce; cambia il luogo delle lezioni dalla casa alla nuova scuola; resta lo stesso maestro. Non è indicato un cambiamento nei programmi."},"checks":["Conservi periodo e luogo.","Spieghi un nesso.","Distingui cambiamento e permanenza."],"error":{"wrong":"La nuova strada spostò il mercato alla domenica.","why":"Il testo mantiene il sabato.","fix":"Rileggi l'ultima frase e correggi la permanenza."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Leggi per relazioni","difficulty":"Il paragrafo fitto mi fa perdere i nessi.","categories":["dislessia"],"signal":"Ricordi nomi ma non il prima e dopo.","aid":"Leggi un blocco con segnariga o ascolto assistito e disegna prima→dopo.","preserve":"Studiare un paragrafo di storia ricostruendo periodo, fatti e collegamenti.","verify":"Verifica se ricostruisci il cambiamento con meno riletture."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Il paese è fittizio per allenare il metodo; per il programma di storia usa il manuale e fonti reali.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M06-02","goal":"Ordinare date e calcolare durate distinguendo intervallo e anno.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Linea del tempo a scala","how":"Colloca date lungo un asse con intervalli coerenti.","why":"Evita ordine puramente verbale."},{"name":"Calcolo con controllo","how":"Sottrai date e verifica contando intervalli.","why":"Distingue durata e conteggio degli anni elencati."}],"example":{"task":"Dossier inventato: un ponte è progettato nel1900, aperto nel1904 e restaurato nel1917. Ordina gli eventi e calcola progettazione-apertura e apertura-restauro.","work":["Ordine:1900→1904→1917.","1904−1900=4 anni;1917−1904=13 anni.","L'intero intervallo1900−1917 dura17 anni, uguale a4+13."],"result":"Progettazione1900; apertura1904; restauro1917. Durate:4 e13 anni; totale17."},"steps":[{"title":"Identifica eventi e date","do":"Associa ogni anno al suo evento.","help":"Non scambiare apertura e restauro."},{"title":"Disegna l'asse","do":"Scegli una scala e colloca i punti in ordine.","help":"Una distanza di13 anni deve essere maggiore di4."},{"title":"Calcola e verifica","do":"Sottrai anno iniziale da finale per lo stesso calendario.","help":"Qui non si aggiunge1: si misura l'intervallo."}],"transfer":{"task":"Dossier inventato: scuola progettata nel1930, aperta nel1936, ampliata nel1950. Ordina e calcola le due durate.","check":"1930→1936→1950;6 anni e14 anni; totale20. I dati indicano anni, quindi non consentono durate esatte in mesi o giorni."},"checks":["Date ed eventi sono associati.","L'asse rispetta la scala.","Durate e unità sono corrette."],"error":{"wrong":"Da1900 a1904 sono5 anni perché conto1900,1901,1902,1903,1904.","why":"Conti etichette, non intervalli trascorsi.","fix":"Conta i quattro passaggi o calcola1904−1900."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Calcola e verifica","difficulty":"La sottrazione delle date mi confonde.","categories":["discalculia"],"signal":"Il risultato non coincide con gli intervalli.","aid":"Usa salti sull'asse e calcolatrice concordata per la sottrazione.","preserve":"Ordinare date e calcolare durate distinguendo intervallo e anno.","verify":"Verifica che salti e differenza diano lo stesso risultato."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Questi esempi non attraversano a.C./d.C.; in quel caso non applicare la sottrazione ignorando l'assenza dell'anno zero.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M06-03","goal":"Leggere una carta storica collegando legenda, periodo e trasformazioni territoriali.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Legenda prima delle conclusioni","how":"Decodifica simboli e colori del periodo rappresentato.","why":"Evita di leggere la carta come attuale."},{"name":"Confronto temporale","how":"Usa due carte dello stesso spazio per osservare cambiamenti.","why":"Distingue posizione e trasformazione."}],"example":{"task":"Carte schematiche inventate, da disegnare: nord in alto; fiume al centro da nord a sud; villaggio a ovest. CartaA,1800: un cerchio vuoto indica traghetto all'altezza del villaggio. CartaB,1850: nello stesso punto un tratto doppio indica ponte; quadrato a est indica nuovo mercato. Leggi il cambiamento.","work":["Legende: cerchio=traghetto, tratto doppio=ponte, quadrato=mercato.","Lo spazio è lo stesso, ma le date differiscono di50 anni.","Nel1850 c'è un ponte e un mercato a est; il villaggio resta a ovest."],"result":"Fra le due carte il collegamento è rappresentato da traghetto a ponte e compare un mercato a est del fiume. La carta non spiega da sola perché il mercato sia nato."},"steps":[{"title":"Leggi data e legenda","do":"Identifica periodo, spazio e simboli.","help":"Non confondere i simboli con forme reali degli edifici."},{"title":"Localizza gli elementi","do":"Usa orientamento e punti comuni.","help":"Mantieni il fiume come riferimento."},{"title":"Confronta e limita","do":"Descrivi cosa compare, scompare o resta e non dedurre cause non indicate.","help":"Il rapporto causa-effetto richiede altre fonti."}],"transfer":{"task":"Carta inventataA,1600: città a nord del lago, strada fino alla riva sud. CartaB,1700: stessa città, stessa strada e nuova fortezza a sud; legenda fortezza=triangolo. Che cosa cambia e che cosa resta?","check":"Compare la fortezza a sud; città a nord e strada restano. Non sono fornite cause della costruzione né confini di uno Stato."},"checks":["Usi data e legenda.","Le posizioni sono corrette.","Non deduci cause senza dati."],"error":{"wrong":"Il quadrato a est dimostra che il ponte ha causato il mercato.","why":"La compresenza non basta a provare la causa.","fix":"Descrivi i due cambiamenti e segnala che la causa non è data."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Localizza gli elementi","difficulty":"Fatico a seguire simboli e testo insieme.","categories":["trasversale"],"signal":"Attribuisci un simbolo alla carta sbagliata.","aid":"Tieni la legenda vicino a ogni carta e confronta un simbolo alla volta.","preserve":"Leggere una carta storica collegando legenda, periodo e trasformazioni territoriali.","verify":"Verifica posizioni e differenze senza scambi."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Le carte sono schematiche e inventate; sulle carte reali controlla scala, proiezione, data e limiti della ricostruzione.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M06-04","goal":"Distinguere cause, condizioni e conseguenze senza scambiare successione e causalità.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Schema perché/poi","how":"Separa ciò che contribuisce all'evento da ciò che segue.","why":"Organizza spiegazioni."},{"name":"Controllo del nesso","how":"Cerca nel testo un legame esplicito prima di affermare una causa.","why":"Riduce inferenze arbitrarie."}],"example":{"task":"Dossier inventato: «Un inverno di piogge danneggia il sentiero. Poiché i carri non passano, il consiglio costruisce un ponte. I trasporti riprendono. Nello stesso anno la piazza viene dipinta». Analizza cause e conseguenze del ponte.","work":["Danno al sentiero e impossibilità dei carri sono condizioni e motivo dichiarato.","Evento: costruzione del ponte.","Conseguenza: ripresa dei trasporti; piazza dipinta è soltanto contemporanea nel dossier."],"result":"Le piogge danneggiano il percorso; il blocco dei carri spinge il consiglio a costruire il ponte, che permette la ripresa dei trasporti. Non è indicato un nesso con la pittura della piazza."},"steps":[{"title":"Scegli l'evento centrale","do":"Scrivi quale fatto devi spiegare.","help":"Qui costruzione del ponte."},{"title":"Separa prima e dopo","do":"Metti cause/condizioni a sinistra e conseguenze a destra.","help":"Controlla il significato di poiché."},{"title":"Motiva i collegamenti","do":"Cita il punto che sostiene la freccia e segnala nessi incerti.","help":"Nello stesso anno non significa a causa di."}],"transfer":{"task":"Dossier inventato: «La piena rompe il mulino. Il paese ne costruisce uno nuovo per riprendere la macinazione. Il pane torna disponibile. Intanto cambia il nome della via». Analizza.","check":"Piena→mulino rotto→costruzione del nuovo→ripresa di macinazione e disponibilità del pane. Cambio del nome della via non è collegato causalmente dai dati."},"checks":["Definisci l'evento.","Motivi le frecce.","Distingui contemporaneità e causalità."],"error":{"wrong":"La piazza è dipinta perché è nato il ponte.","why":"Il dossier non collega questi fatti.","fix":"Togli la freccia causale e indica contemporaneità."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Separa prima e dopo","difficulty":"Cause e conseguenze mi si scambiano.","categories":["trasversale"],"signal":"Metti ripresa dei trasporti prima del ponte.","aid":"Usa tre colonne: perché accade, evento, che cosa produce.","preserve":"Distinguere cause, condizioni e conseguenze senza scambiare successione e causalità.","verify":"Verifica l'ordine e spiega ogni freccia."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Una spiegazione storica può avere cause multiple; il dossier breve non autorizza a cercare una sola causa per tutti gli eventi.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M06-05","goal":"Confrontare due momenti distinguendo cambiamenti e permanenze su criteri comuni.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Tabella prima/dopo","how":"Usa le stesse categorie nei due periodi.","why":"Rende il confronto controllabile."},{"name":"Sintesi selettiva","how":"Formula un cambiamento e una permanenza con dati.","why":"Evita tutto cambia."}],"example":{"task":"Dossier inventato.1850:«Mercato al sabato nella piazza; merci trasportate con carri».1900:«Mercato al sabato nella piazza; molte merci arrivano in treno e poi con carri». Confronta luogo, giorno e trasporto.","work":["Luogo: piazza in entrambi i momenti.","Giorno: sabato in entrambi.","Trasporto: compare il treno, ma i carri restano per una parte del percorso."],"result":"Permanenze: piazza e sabato. Cambiamento: il treno entra nel trasporto delle merci; i carri non scompaiono del tutto."},"steps":[{"title":"Scegli categorie comuni","do":"Definisci aspetti presenti in entrambi i periodi.","help":"Luogo, giorno e mezzo sono distinti."},{"title":"Compila le due colonne","do":"Riporta solo i dati disponibili.","help":"Molte non equivale a tutte."},{"title":"Concludi con precisione","do":"Spiega un cambiamento e una permanenza evitando assoluti.","help":"Mantieni il ruolo residuo dei carri."}],"transfer":{"task":"Dossier inventato.1910:«Scuola nello stesso edificio, lezioni con lavagna e quaderni».1960:«Stesso edificio, lavagna, quaderni e un proiettore». Confronta.","check":"Permanenze: edificio, lavagna, quaderni. Cambiamento: aggiunta del proiettore; non è dichiarato che gli altri strumenti vengano abbandonati."},"checks":["Usi le stesse categorie.","Conservi parole come molte o alcuni.","Distingui aggiunta e sostituzione."],"error":{"wrong":"Nel1900 non esistono più i carri.","why":"Il dossier li mantiene per una parte del tragitto.","fix":"Scrivi integrazione del treno, non eliminazione dei carri."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Compila le due colonne","difficulty":"Leggendo due date dimentico i dati della prima.","categories":["trasversale"],"signal":"Compili il prima a memoria e ometti il sabato.","aid":"Tieni i due estratti affiancati e completa una categoria per volta.","preserve":"Confrontare due momenti distinguendo cambiamenti e permanenze su criteri comuni.","verify":"Verifica una prova in entrambe le colonne."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non generalizzare due esempi locali a tutti i territori; il confronto riguarda il dossier fornito.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M06-06","goal":"Confrontare istituzioni e società con criteri espliciti senza giudizi generici.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Criteri comparabili","how":"Scegli chi decide, chi partecipa e come cambia una decisione.","why":"Evita etichette vaghe."},{"name":"Confronto vincolato ai dati","how":"Distingui ciò che il dossier dice da ciò che non dice.","why":"Limita generalizzazioni."}],"example":{"task":"Due comunità immaginarie. A: «Il capo decide l'uso dei campi e resta in carica a vita». B: «Un consiglio eletto dagli adulti decide l'uso dei campi e cambia ogni due anni». Confronta organo, accesso e durata.","work":["Organo: capo unico in A; consiglio in B.","Accesso: in B elezione da parte degli adulti; in A non indicato.","Durata: vita in A; due anni in B."],"result":"Le due comunità affidano la stessa decisione a organi diversi. B prevede elezione e rinnovo biennale; A ha un capo a vita, ma il dossier non specifica come sia scelto."},"steps":[{"title":"Fissa i criteri","do":"Usa le stesse domande per civiltà o istituzioni.","help":"Puoi confrontare anche economia e gruppi sociali se il testo li documenta."},{"title":"Compila i dati","do":"Scrivi non indicato dove manca un'informazione.","help":"Non dedurre tutti votano da adulti."},{"title":"Formula il confronto","do":"Riporta somiglianze e differenze senza migliori assoluti.","help":"Un giudizio richiede criterio e prove ulteriori."}],"transfer":{"task":"Comunità inventate. C: «Le norme sono decise da tre anziani nominati a vita». D: «Le norme sono decise da cinque rappresentanti scelti dalle famiglie ogni anno». Confronta organo e durata.","check":"C tre anziani a vita; D cinque rappresentanti con scelta annuale dalle famiglie. Entrambe hanno un organo plurale; non sono indicate rappresentatività completa o regole di voto."},"checks":["Usi criteri identici.","Segnali i dati mancanti.","Non attribuisci caratteristiche non documentate."],"error":{"wrong":"InB votano anche i bambini perché è un'elezione.","why":"Il dossier specifica gli adulti.","fix":"Riporta la categoria dichiarata senza ampliarla."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Compila i dati","difficulty":"I dati dei due sistemi si mescolano.","categories":["trasversale"],"signal":"Attribuisci aB la carica a vita.","aid":"Usa una tabella con nome della comunità ripetuto in ciascuna colonna.","preserve":"Confrontare istituzioni e società con criteri espliciti senza giudizi generici.","verify":"Verifica ogni cella sull'estratto corrispondente."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Le istituzioni inventate non sono esempi completi di civiltà reali; nel programma usa le categorie del manuale e fonti contestualizzate.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M06-07","goal":"Analizzare una fonte distinguendo provenienza, contenuto, punto di vista e limite.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Scheda della fonte","how":"Registra autore, data, tipo e destinatario quando disponibili.","why":"Contestualizza il documento."},{"name":"Confronto con altre prove","how":"Separa ciò che la fonte afferma da ciò che occorre verificare.","why":"Evita di scambiare testimonianza e certezza."}],"example":{"task":"Fonte inventata per esercizio: lettera del mugnaio al consiglio,1912: «Il ponte chiuso mi impedisce di consegnare la farina. Chiedo che sia riparato subito». Analizza dati e limite.","work":["Tipo: lettera; autore: mugnaio; destinatario: consiglio; data1912.","Contenuto: il mugnaio segnala un problema di consegna e chiede riparazione.","Punto di vista: persona interessata ai trasporti; durata e gravità del danno non sono indicate."],"result":"La fonte documenta la richiesta del mugnaio e il problema da lui riferito. Per stabilire durata della chiusura e condizioni del ponte servono altri documenti o rilievi."},"steps":[{"title":"Identifica la provenienza","do":"Annota tipo, autore, data e destinatario o non indicato.","help":"Una fonte materiale richiede luogo di ritrovamento e contesto, se noti."},{"title":"Leggi l'affermazione","do":"Separa parole della fonte e tua interpretazione.","help":"Mi impedisce è quanto il mugnaio riferisce."},{"title":"Indica limite e verifica","do":"Formula una domanda da controllare con una seconda fonte.","help":"Un registro lavori può chiarire la durata."}],"transfer":{"task":"Fonte inventata: locandina del comune,1930: «Il nuovo mercato accoglierà cento banchi e porterà prosperità». Che cosa afferma e che cosa non dimostra?","check":"Afferma previsione di cento banchi e prosperità; non dimostra numero effettivo di banchi né prosperità futura. Servono registri di occupazione e dati successivi."},"checks":["Identifichi la fonte.","Distingui affermazione e fatto accertato.","Indichi un limite verificabile."],"error":{"wrong":"La locandina dimostra che tutti sono diventati ricchi.","why":"Una promessa non è un risultato documentato.","fix":"Scrivi previsione e cerca dati successivi."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Leggi l'affermazione","difficulty":"Le parole della fonte e il mio commento si confondono.","categories":["trasversale"],"signal":"Presenti la richiesta come dato già verificato.","aid":"Usa due riquadri: la fonte dice e posso concludere con questi dati.","preserve":"Analizzare una fonte distinguendo provenienza, contenuto, punto di vista e limite.","verify":"Verifica se il limite compare nel secondo riquadro."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Le fonti sono fittizie e non vanno citate come archivi; su documenti reali preserva provenienza e lacune.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M06-08","goal":"Costruire schema, mappa o tabella storica con relazioni nominate e informazioni selezionate.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Forma adeguata alla relazione","how":"Scegli schema per sequenza, mappa per nessi e tabella per confronto.","why":"Evita un formato unico."},{"name":"Lettura delle relazioni","how":"Trasforma frecce e celle in frasi complete.","why":"Controlla il senso del prodotto."}],"example":{"task":"Dossier inventato: «Nel1900 il sentiero è allagato, il consiglio apre una strada alta e le consegne riprendono. Prima si usa il sentiero, dopo la strada». Rappresenta con schema, mappa e tabella.","work":["Schema: allagamento→apertura strada→ripresa consegne.","Mappa: consiglio→apre→strada alta; strada→permette→consegne.","Tabella confronto percorso: prima sentiero, dopo strada alta."],"result":"Schema cronologico in tre passaggi; mappa con verbi apre/permette; tabella con criterio percorso e colonne prima/dopo. Tutti rappresentano i dati, ma mettono in evidenza relazioni diverse."},"steps":[{"title":"Scegli la forma","do":"Leggi se la consegna richiede schema, mappa o tabella.","help":"Per date usa una sequenza, per confronti una tabella."},{"title":"Inserisci nuclei e legami","do":"Scrivi parole chiave, date utili e verbi sulle frecce.","help":"Una linea senza etichetta non chiarisce la relazione."},{"title":"Spiega e correggi","do":"Leggi il prodotto come frasi e verifica ogni nesso.","help":"Controlla se hai aggiunto una causa assente."}],"transfer":{"task":"Dossier inventato: «Nel1910 il paese apre una scuola. Prima le lezioni sono in case private; dopo nella scuola. Il maestro resta lo stesso». Crea tabella e mappa.","check":"Tabella: luogo prima case private/dopo scuola; maestro uguale. Mappa: paese→apre→scuola; lezioni→si trasferiscono→scuola. Non inventare altri cambiamenti."},"checks":["La forma risponde allo scopo.","Ogni freccia è spiegabile.","I dati sono completi e fedeli."],"error":{"wrong":"Collego consiglio e strada senza dire il rapporto.","why":"La freccia può voler dire molte cose.","fix":"Scrivi apre sulla freccia e verifica sul dossier."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Inserisci nuclei e legami","difficulty":"Disegnare molti nodi mi affatica e perdo il senso.","categories":["disgrafia"],"signal":"Il disegno occupa tutto il tempo e mancano relazioni.","aid":"Usa tre riquadri già pronti o una tabella con poche celle, scrivendo solo nuclei e verbi.","preserve":"Costruire schema, mappa o tabella storica con relazioni nominate e informazioni selezionate.","verify":"Verifica se il prodotto consente una spiegazione completa con meno copia."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Confronta il formato con una scaletta; la mappa non è automaticamente lo strumento migliore.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M06-09","goal":"Rispondere e spiegare un argomento storico usando domanda, dati e nessi.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Risposta centrata","how":"Trasforma la domanda in una frase iniziale con dati pertinenti.","why":"Evita risposte fuori tema."},{"name":"Esposizione a nuclei","how":"Prepara periodo, evento e conseguenza in parole chiave.","why":"Sostiene spiegazione orale."}],"example":{"task":"Dossier inventato: «Nel1888 Boscoalto costruisce un acquedotto perché i pozzi si seccano d'estate. L'acqua arriva a una fontana pubblica; le famiglie continuano a trasportarla a casa». Rispondi perché? ed esponi il cambiamento.","work":["La causa dichiarata è il prosciugarsi estivo dei pozzi.","Il cambiamento è l'acqua alla fontana grazie all'acquedotto.","Limite: non sono documentate tubature nelle case; il trasporto domestico continua."],"result":"Risposta: «Boscoalto costruisce l'acquedotto nel1888 perché i pozzi si seccano d'estate». Esposizione: «Il paese affronta la scarsità estiva costruendo un acquedotto. L'acqua raggiunge una fontana pubblica, ma le famiglie devono ancora portarla a casa»."},"steps":[{"title":"Scomponi la domanda","do":"Distingui quando, perché e che cosa cambia.","help":"Rispondi prima a ciò che è chiesto."},{"title":"Seleziona prove e nessi","do":"Prepara tre nuclei con dati del testo.","help":"Anno, problema, soluzione con limite."},{"title":"Rispondi o esponi","do":"Per scritto formula una risposta; per orale collega i nuclei e verifica con una domanda.","help":"Non aggiungere progresso generico al posto dei dati."}],"transfer":{"task":"Dossier inventato: «Nel1925 Roccapiana apre una cooperativa per vendere insieme il raccolto. I soci condividono il magazzino ma coltivano campi propri». Perché nasce e che cosa resta individuale?","check":"Nasce per vendere il raccolto insieme; magazzino condiviso, campi propri. Risposta o esposizione deve distinguere vendita e coltivazione."},"checks":["Rispondi a tutte le richieste.","Usi il nesso dichiarato.","Mantieni i limiti del cambiamento."],"error":{"wrong":"Tutte le case di Boscoalto ricevono acqua corrente.","why":"Il dossier indica una fontana e trasporto a casa.","fix":"Correggi luogo di arrivo e permanenza del trasporto."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Rispondi o esponi","difficulty":"Durante l'esposizione dimentico il nesso fra fatti.","categories":["trasversale"],"signal":"Elenchi acquedotto, pozzi e fontana senza spiegazione.","aid":"Usa tre parole con frecce perché e quindi.","preserve":"Rispondere e spiegare un argomento storico usando domanda, dati e nessi.","verify":"Verifica se sai spiegare il motivo senza suggerimento dell'adulto."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. L'esposizione non richiede la ripetizione letterale; correttezza e qualità dei nessi prevalgono sulla rapidità.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M06-10","goal":"Impostare una ricerca storica locale con domanda, fonti e conclusioni limitate.","materials":["Compito o testo assegnato","Foglio, matita e gomma","Questa guida con esempio e controllo"],"techniques":[{"name":"Domanda delimitata","how":"Scegli luogo, periodo e cambiamento da ricercare.","why":"Rende gestibile la ricerca."},{"name":"Incrocio delle fonti","how":"Confronta due documenti e registra accordi e lacune.","why":"Evita conclusioni da una sola traccia."}],"example":{"task":"Archivio fittizio per esercizio: fonteA, verbale comunale1950: «Si approva una sala lettura nell'ex scuola». FonteB, locandina1952: «Apertura della sala lettura, domenica3 febbraio». Ricerca: quando passa da progetto ad apertura?","work":["A documenta approvazione nel1950, non apertura.","B annuncia apertura nel1952.","Le fonti indicano due fasi; non provano da sole uso effettivo o durata del servizio."],"result":"Il progetto è approvato nel1950 e l'apertura è annunciata per il3 febbraio1952. Per verificare l'effettiva apertura e attività servirebbero registri o cronaca dell'evento."},"steps":[{"title":"Definisci la domanda","do":"Scrivi luogo, periodo e fatto da accertare.","help":"Non cercare tutta la storia del paese in una volta."},{"title":"Registra le fonti","do":"Annota provenienza, data, autore se noto e affermazione utile.","help":"In una ricerca reale conserva riferimento per ritrovare il documento."},{"title":"Confronta e concludi","do":"Distingui approvazione, annuncio ed evento verificato.","help":"Scrivi che cosa resta da cercare."},{"title":"Prepara il prodotto","do":"Organizza testo, scheda o esposizione con riferimenti.","help":"La presentazione deve mostrare come arrivi alla conclusione."}],"transfer":{"task":"Archivio fittizio: cartolina1960 mostra un edificio con scritta cinema; verbale1958 autorizza un cinema nello stesso edificio. Che cosa puoi concludere e che cosa no?","check":"Autorizzazione nel1958; scritta cinema visibile nella cartolina1960. Non determinano data esatta d'apertura né continuità di funzionamento; servono annunci, programmi o registri."},"checks":["La domanda è delimitata.","Ogni conclusione ha una fonte.","Segnali una lacuna o verifica futura."],"error":{"wrong":"La sala fu certamente usata dal1950 perché il consiglio la approvò.","why":"Approvazione e uso non sono lo stesso fatto.","fix":"Separa progetto1950 e annuncio1952, cercando prova dell'uso."},"home":["Applica i passaggi al compito scolastico e conserva il foglio con il tuo controllo.","Il giorno dopo e poi dopo tre giorni rifai un piccolo compito dello stesso tipo prima di riaprire il modello; confronta l'esito.","Se il passaggio resta bloccato dopo una correzione, segna il punto preciso e chiedi aiuto al docente o al professionista."],"adaptations":[{"stage":"Registra le fonti","difficulty":"Perdo da quale documento viene un dato.","categories":["trasversale"],"signal":"Mescoli approvazione e apertura senza riferimenti.","aid":"Usa una riga per fonte con codiceA/B e riporta il codice accanto a ogni dato.","preserve":"Impostare una ricerca storica locale con domanda, fonti e conclusioni limitate.","verify":"Verifica che la conclusione abbia riferimenti recuperabili."}],"coach":"Mostra un passaggio pensando ad alta voce; poi chiedi al ragazzo di scegliere il successivo e riduci domande e dimostrazioni quando sa motivarlo su una prova nuova. Mantieni gli strumenti compensativi concordati e osserva separatamente precisione, fatica e autonomia. Non usare archivi o testimonianze personali senza contesto e permessi appropriati; l'esercizio non richiede raccogliere dati personali.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M08-01","goal":"Calcolare scegliendo un procedimento e controllarne il risultato.","materials":["carta a quadretti","matita","calcolatrice o formulario se utili al tuo compito"],"techniques":[{"name":"Scomposizione e valore posizionale","how":"Separa le decine dalle unità nel calcolo mentale e usa colonne U-D-C nello scritto.","why":"Rende visibile il valore delle cifre e i cambi."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Le cifre sono nella colonna giusta; I cambi sono annotati; L’operazione inversa restituisce il dato iniziale. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Calcola 48 + 27 mentalmente e 326 − 178 in colonna. Spiega un controllo per ciascun risultato.","work":["Scompongo 27 in 20 + 7: 48 + 20 = 68; 68 + 7 = 75.","Scrivo 326 − 178 allineando unità, decine e centinaia. Cambio una decina: 16 − 8 = 8; cambio una centinaia: 11 − 7 = 4; 2 − 1 = 1.","Controllo 75 − 27 = 48 e 148 + 178 = 326."],"result":"48 + 27 = 75; 326 − 178 = 148. Scomposizione e incolonnamento producono risultati verificati dalle operazioni inverse."},"steps":[{"title":"Scegli il metodo","do":"Sul tuo esercizio indica se conviene scomporre o incolonnare.","help":"Per 48 + 27 puoi aggiungere prima le decine."},{"title":"Registra i cambi","do":"Scrivi un passaggio per riga e, in colonna, annota ogni cambio.","help":"Lo zero non impedisce il cambio: puoi cambiare una centinaia in dieci decine."},{"title":"Controlla con l’inversa","do":"Esegui l’operazione inversa sul risultato.","help":"Per una sottrazione somma risultato e numero sottratto."}],"transfer":{"task":"Calcola 59 + 36 mentalmente e 402 − 185 in colonna. Scrivi anche i controlli.","check":"59 + 30 + 6 = 95; 402 − 185 = 217. Controlli: 95 − 36 = 59; 217 + 185 = 402. Nel secondo calcolo lo zero delle decine richiede due cambi."},"checks":["Le cifre sono nella colonna giusta","I cambi sono annotati","L’operazione inversa restituisce il dato iniziale"],"error":{"wrong":"326 − 178 = 252 perché sottraggo sempre la cifra più piccola dalla più grande.","why":"La sottrazione ha un ordine: 6 − 8 richiede un cambio.","fix":"Riscrivi 326 come 2 centinaia, 11 decine e 16 unità: ottieni 148."},"home":["Sui calcoli assegnati scegli un esempio mentale e uno scritto; conserva anche il controllo inverso.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Scegli il metodo","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa tre colonne già tracciate U-D-C; evidenzia solo la cifra che stai elaborando e registra il cambio vicino a essa.","preserve":"Calcolare scegliendo un procedimento e controllarne il risultato.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Mostra una riga, poi fai scegliere al ragazzo il prossimo passaggio e chiedi di spiegarlo. Riduci i suggerimenti sulla procedura; mantieni calcolatrice, formulario e altri strumenti compensativi utili. Correttezza di un esempio non dimostra padronanza di ogni problema.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M08-02","goal":"Risolvere un’espressione rispettando parentesi e precedenze.","materials":["carta a quadretti","matita","calcolatrice o formulario se utili al tuo compito"],"techniques":[{"name":"Esempio commentato","how":"Accanto a ogni riga scrivi “parentesi”, “moltiplicazioni/divisioni” o “addizioni/sottrazioni”.","why":"Collega la regola al passaggio effettivo."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: La parentesi è svolta prima; Ogni numero non elaborato è riportato; L’ultima riga è un unico valore. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Risolvi 18 − 2 × (3 + 4) + 12 ÷ 3.","work":["Calcolo la parentesi: 3 + 4 = 7. Riscrivo 18 − 2 × 7 + 12 ÷ 3.","Calcolo moltiplicazione e divisione: 18 − 14 + 4.","Eseguo addizione e sottrazione da sinistra: 4 + 4 = 8."],"result":"Il valore dell’espressione è 8."},"steps":[{"title":"Segna le priorità","do":"Cerchia le parentesi e sottolinea moltiplicazioni e divisioni nella tua espressione.","help":"Lavora prima all’interno delle parentesi."},{"title":"Riscrivi la riga","do":"Sostituisci solo le operazioni appena risolte; ricopia gli altri simboli.","help":"Non saltare da 18 − 14 + 4 alla risposta senza una riga di controllo."},{"title":"Leggi i segni","do":"Confronta riga per riga segni e numeri prima di continuare.","help":"Tra operazioni della stessa priorità procedi da sinistra."}],"transfer":{"task":"Risolvi 30 − (8 + 2) × 2 + 18 ÷ 6.","check":"30 − 10 × 2 + 3 = 30 − 20 + 3 = 13."},"checks":["La parentesi è svolta prima","Ogni numero non elaborato è riportato","L’ultima riga è un unico valore"],"error":{"wrong":"18 − 2 × 7 = 16 × 7.","why":"Hai eseguito la sottrazione prima della moltiplicazione.","fix":"Calcola 2 × 7 = 14 e scrivi 18 − 14."},"home":["Su una tua espressione scrivi tre etichette di priorità e controlla una ricopiatura.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Segna le priorità","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Tieni la riga precedente visibile sopra quella nuova e usa un segnalino per confrontare un termine alla volta.","preserve":"Risolvere un’espressione rispettando parentesi e precedenze.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Mostra una riga, poi fai scegliere al ragazzo il prossimo passaggio e chiedi di spiegarlo. Riduci i suggerimenti sulla procedura; mantieni calcolatrice, formulario e altri strumenti compensativi utili. Correttezza di un esempio non dimostra padronanza di ogni problema.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M08-03","goal":"Riconoscere multipli e divisori e calcolare semplici potenze e radici.","materials":["carta a quadretti","matita","calcolatrice o formulario se utili al tuo compito"],"techniques":[{"name":"Confronto di concetti","how":"Affianca “multiplo di 6: 6 × 4 = 24” e “divisore di 18: 18 ÷ 6 = 3”.","why":"Evita di scambiare le due relazioni."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: I divisori non lasciano resto; La potenza ha il numero corretto di fattori; La radice principale è non negativa. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Scrivi i multipli positivi di 6 fino a 30, i divisori positivi di 18, 3³ e √81.","work":["Aggiungo 6 ogni volta: 6, 12, 18, 24, 30.","Cerco coppie con prodotto 18: 1 × 18, 2 × 9, 3 × 6.","3³ = 3 × 3 × 3 = 27. Per √81 cerco il numero non negativo il cui quadrato è 81: 9."],"result":"Multipli: 6, 12, 18, 24, 30. Divisori: 1, 2, 3, 6, 9, 18. 3³ = 27; √81 = 9."},"steps":[{"title":"Distingui le richieste","do":"Dividi il foglio in multipli, divisori, potenza e radice per il tuo compito.","help":"Multipli: prodotti; divisori: divisioni senza resto."},{"title":"Espandi i calcoli","do":"Scrivi tutti i fattori della potenza e le coppie dei divisori.","help":"L’esponente conta quante volte compare la base come fattore."},{"title":"Controlla il quadrato","do":"Eleva al quadrato la radice trovata.","help":"9 × 9 deve restituire 81."}],"transfer":{"task":"Scrivi i multipli positivi di 4 fino a 20, i divisori positivi di 12, 2⁴ e √49.","check":"Multipli: 4, 8, 12, 16, 20. Divisori: 1, 2, 3, 4, 6, 12. 2⁴ = 16; √49 = 7."},"checks":["I divisori non lasciano resto","La potenza ha il numero corretto di fattori","La radice principale è non negativa"],"error":{"wrong":"3³ = 3 × 3 = 9.","why":"Hai usato due fattori invece di tre.","fix":"Scrivi tre caselle con 3 e moltiplica: 27."},"home":["Per la tua pagina di esercizi separa i quattro tipi prima di calcolare.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Distingui le richieste","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa caselle separate per i fattori e una tabella di coppie per i divisori; il formulario delle potenze resta disponibile.","preserve":"Riconoscere multipli e divisori e calcolare semplici potenze e radici.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Mostra una riga, poi fai scegliere al ragazzo il prossimo passaggio e chiedi di spiegarlo. Riduci i suggerimenti sulla procedura; mantieni calcolatrice, formulario e altri strumenti compensativi utili. Correttezza di un esempio non dimostra padronanza di ogni problema.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M08-04","goal":"Usare rapporti, proporzioni e percentuali indicando la base del confronto.","materials":["carta a quadretti","matita","calcolatrice o formulario se utili al tuo compito"],"techniques":[{"name":"Tabella di proporzionalità","how":"Usa due righe, succo e acqua, con una freccia ×3 per entrambe.","why":"Mostra che cambia la quantità, non il rapporto."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: L’ordine dei rapporti resta uguale; La percentuale si riferisce al totale corretto; La risposta ha unità e significato. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Una miscela contiene 2 bicchieri di succo e 3 di acqua. Mantieni il rapporto usando 6 bicchieri di succo. Poi calcola il 25% di 80 euro.","work":["Il rapporto succo:acqua è 2:3. Da 2 a 6 moltiplico per 3, quindi acqua = 3 × 3 = 9 bicchieri.","La proporzione è 2:3 = 6:9; i prodotti incrociati sono entrambi 18.","25% di 80 = 25/100 × 80 = 20 euro; è anche un quarto di 80."],"result":"Servono 9 bicchieri di acqua. Il 25% di 80 euro è 20 euro."},"steps":[{"title":"Etichetta i termini","do":"Scrivi sopra ogni termine a che cosa si riferisce: succo o acqua, quota o totale.","help":"Conserva lo stesso ordine in entrambi i rapporti."},{"title":"Trova il fattore","do":"Cerca per quanto cambia la quantità nota e applicalo all’altra.","help":"Da 2 a 6 il fattore è 3."},{"title":"Calcola e interpreta","do":"Per la percentuale scrivi p/100 × totale e l’unità.","help":"Il totale dell’esempio è 80 euro, non 25."}],"transfer":{"task":"La ricetta usa 3 parti di avena e 2 di yogurt. Con 9 parti di avena, quanto yogurt serve? Calcola anche il 10% di 70 euro.","check":"Yogurt: 6 parti; 3:2 = 9:6, prodotti incrociati 18. Il 10% di 70 euro è 7 euro."},"checks":["L’ordine dei rapporti resta uguale","La percentuale si riferisce al totale corretto","La risposta ha unità e significato"],"error":{"wrong":"Con 6 bicchieri di succo servono 7 di acqua, perché aggiungo 4 a entrambi.","why":"L’aggiunta non mantiene il rapporto 2:3.","fix":"Moltiplica entrambe le quantità per 3: 6 e 9."},"home":["Sulla tua ricetta o problema percentuale scrivi prima il totale e i nomi delle quantità.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Etichetta i termini","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Prepara una tabella con nomi delle quantità e frecce; lascia visibile il totale prima di usare la calcolatrice.","preserve":"Usare rapporti, proporzioni e percentuali indicando la base del confronto.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Mostra una riga, poi fai scegliere al ragazzo il prossimo passaggio e chiedi di spiegarlo. Riduci i suggerimenti sulla procedura; mantieni calcolatrice, formulario e altri strumenti compensativi utili. Correttezza di un esempio non dimostra padronanza di ogni problema.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M08-05","goal":"Tradurre un testo in simboli rispettando l’ordine delle operazioni.","materials":["carta a quadretti","matita","calcolatrice o formulario se utili al tuo compito"],"techniques":[{"name":"Confronto di coppie minime","how":"Affianca i due testi quasi uguali e sottolinea “della somma”.","why":"Fa emergere il ruolo delle parole che cambiano il significato."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: La lettera ha una definizione; Le parentesi seguono il testo; La prova numerica rispetta lo stesso ordine. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Indica con x un numero. Traduci “il doppio della somma del numero e 3” e “la somma del doppio del numero e 3”. Verifica con x = 4.","work":["Nel primo testo sommo prima x e 3, poi raddoppio: 2(x + 3).","Nel secondo raddoppio x, poi aggiungo 3: 2x + 3.","Per x = 4 ottengo rispettivamente 2 × 7 = 14 e 8 + 3 = 11."],"result":"Le traduzioni sono 2(x + 3) e 2x + 3; non significano la stessa cosa."},"steps":[{"title":"Nomina l’incognita","do":"Scrivi che cosa rappresenta la lettera nel tuo testo.","help":"x è il numero intero della richiesta, non una cifra."},{"title":"Disegna il raggruppamento","do":"Racchiudi la somma o differenza che viene moltiplicata.","help":"“Il doppio della somma” richiede parentesi."},{"title":"Prova un valore","do":"Sostituisci un numero semplice e racconta le operazioni nell’ordine.","help":"Confronta 14 e 11 per vedere la differenza."}],"transfer":{"task":"Traduci “il triplo della differenza fra un numero y e 2” e “il triplo di y diminuito di 2”. Calcola con y = 5.","check":"3(y − 2) = 9; 3y − 2 = 13. Le parentesi rendono diverso l’ordine."},"checks":["La lettera ha una definizione","Le parentesi seguono il testo","La prova numerica rispetta lo stesso ordine"],"error":{"wrong":"“Il doppio della somma di x e 3” diventa 2x + 3.","why":"Così solo x è raddoppiato.","fix":"Raggruppa x + 3: 2(x + 3)."},"home":["Nel tuo problema scrivi a parole l’ordine prima della formula.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Nomina l’incognita","difficulty":"Perdo il punto mentre leggo","categories":["dislessia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Leggi un blocco di parole alla volta e disegna due caselle per le azioni “somma” e “raddoppia”.","preserve":"Tradurre un testo in simboli rispettando l’ordine delle operazioni.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Mostra una riga, poi fai scegliere al ragazzo il prossimo passaggio e chiedi di spiegarlo. Riduci i suggerimenti sulla procedura; mantieni calcolatrice, formulario e altri strumenti compensativi utili. Correttezza di un esempio non dimostra padronanza di ogni problema.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M08-06","goal":"Costruire e controllare un problema con procedimento aritmetico o algebrico.","materials":["carta a quadretti","matita","calcolatrice o formulario se utili al tuo compito"],"techniques":[{"name":"Doppia rappresentazione","how":"Affianca il disegno delle quote e l’equazione 3x + 2 = 11.","why":"Collega il calcolo ai dati e permette due vie di soluzione."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: La quantità incognita è definita; Il costo fisso compare una volta; Il prezzo trovato ricostruisce il totale. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Tre quaderni uguali e una penna da 2 euro costano 11 euro. Quanto costa un quaderno? Risolvi prima aritmeticamente, poi con un’equazione.","work":["Tolgo il costo della penna: 11 − 2 = 9 euro per i quaderni.","Divido 9 per 3: ogni quaderno costa 3 euro.","Definisco x = costo di un quaderno in euro. 3x + 2 = 11; 3x = 9; x = 3. Controllo 3 × 3 + 2 = 11."],"result":"Un quaderno costa 3 euro; i due procedimenti rappresentano la stessa situazione."},"steps":[{"title":"Separa dati e domanda","do":"Scrivi costi noti, quantità e ciò che devi trovare.","help":"La penna è una sola: i 2 euro non vanno moltiplicati per 3."},{"title":"Rappresenta il totale","do":"Disegna tre caselle uguali e una da 2; poi scrivi l’equazione.","help":"Le caselle uguali rappresentano quaderni dello stesso prezzo."},{"title":"Rientra nel testo","do":"Sostituisci il risultato nel totale e rispondi con l’unità.","help":"La domanda è un prezzo, non il numero di quaderni."}],"transfer":{"task":"Quattro biglietti uguali e una commissione unica di 3 euro costano 23 euro. Trova il prezzo di un biglietto con due procedimenti.","check":"Aritmetica: (23 − 3)/4 = 5 euro. Algebra: 4x + 3 = 23, quindi x = 5. Controllo 4 × 5 + 3 = 23."},"checks":["La quantità incognita è definita","Il costo fisso compare una volta","Il prezzo trovato ricostruisce il totale"],"error":{"wrong":"11/3 = prezzo di un quaderno.","why":"Il totale include anche la penna.","fix":"Sottrai prima 2, poi dividi per 3."},"home":["Su un tuo problema di acquisto disegna le quote uguali e una quota fissa.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Separa dati e domanda","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa una scheda con “quantità”, “costo fisso”, “totale”, “domanda”; indica ciascun dato nel testo prima di copiarlo.","preserve":"Costruire e controllare un problema con procedimento aritmetico o algebrico.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Mostra una riga, poi fai scegliere al ragazzo il prossimo passaggio e chiedi di spiegarlo. Riduci i suggerimenti sulla procedura; mantieni calcolatrice, formulario e altri strumenti compensativi utili. Correttezza di un esempio non dimostra padronanza di ogni problema.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M08-07","goal":"Ridurre termini simili e verificare una semplice espressione letterale.","materials":["carta a quadretti","matita","calcolatrice o formulario se utili al tuo compito"],"techniques":[{"name":"Raggruppamento per caratteristiche","how":"Metti i termini in colonne a e b e conserva i segni.","why":"Rende visibile ciò che può essere sommato."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Sono uniti solo termini simili; Ogni segno è conservato; Il controllo numerico coincide. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Riduci 3a + 2b − a + 4b. Poi calcola il valore per a = 2 e b = 1.","work":["Raggruppo i termini in a: 3a − a = 2a.","Raggruppo i termini in b: 2b + 4b = 6b.","La forma ridotta è 2a + 6b. Sostituendo: 2 × 2 + 6 × 1 = 10; anche l’originale vale 6 + 2 − 2 + 4 = 10."],"result":"3a + 2b − a + 4b = 2a + 6b; per i valori assegnati vale 10."},"steps":[{"title":"Segna la parte letterale","do":"Nel tuo esercizio collega solo termini con lettere ed esponenti uguali.","help":"a e b non sono termini simili."},{"title":"Somma i coefficienti","do":"Mantieni la lettera e calcola sui numeri con i loro segni.","help":"Davanti a −a il coefficiente è −1."},{"title":"Sostituisci due valori","do":"Controlla la forma originale e quella ridotta con gli stessi numeri.","help":"Un controllo numerico aiuta a trovare errori, ma non prova ogni identità."}],"transfer":{"task":"Riduci 5x − 2y − 3x + y e controlla per x = 3, y = 2.","check":"2x − y; il valore è 6 − 2 = 4. Originale: 15 − 4 − 9 + 2 = 4."},"checks":["Sono uniti solo termini simili","Ogni segno è conservato","Il controllo numerico coincide"],"error":{"wrong":"3a + 2b = 5ab.","why":"Hai sommato termini diversi e cambiato l’operazione in prodotto.","fix":"Lascia 3a + 2b come somma; riduci solo con altri termini in a o b."},"home":["Su una tua espressione indica i gruppi di termini e verifica con valori piccoli.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Segna la parte letterale","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa due colonne etichettate per le lettere, con uno spazio davanti a ogni termine per il segno.","preserve":"Ridurre termini simili e verificare una semplice espressione letterale.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Mostra una riga, poi fai scegliere al ragazzo il prossimo passaggio e chiedi di spiegarlo. Riduci i suggerimenti sulla procedura; mantieni calcolatrice, formulario e altri strumenti compensativi utili. Correttezza di un esempio non dimostra padronanza di ogni problema.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M08-08","goal":"Risolvere un’equazione di primo grado e verificarne la soluzione.","materials":["carta a quadretti","matita","calcolatrice o formulario se utili al tuo compito"],"techniques":[{"name":"Bilancia delle operazioni","how":"Scrivi esplicitamente 3x + 5 − 5 = 20 − 5 prima della riga ridotta.","why":"Spiega perché l’uguaglianza è conservata."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: Ogni operazione riguarda entrambi i membri; L’incognita è isolata; La soluzione rende vera l’equazione iniziale. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Risolvi 3x + 5 = 20 e verifica.","work":["Sottraggo 5 a entrambi i membri: 3x = 15.","Divido entrambi i membri per 3: x = 5.","Sostituisco nel testo iniziale: 3 × 5 + 5 = 20."],"result":"La soluzione è x = 5."},"steps":[{"title":"Individua le operazioni","do":"Sul membro con l’incognita segna moltiplicazione e termine aggiunto o sottratto.","help":"Qui x è moltiplicato per 3 e poi si aggiunge 5."},{"title":"Mantieni l’uguaglianza","do":"Scrivi la stessa operazione sotto entrambi i membri.","help":"Prima −5, poi ÷3."},{"title":"Verifica nell’originale","do":"Sostituisci il numero nell’equazione iniziale.","help":"Verificare solo l’ultima riga non rileva gli errori precedenti."}],"transfer":{"task":"Risolvi 4y − 7 = 13 e verifica.","check":"Aggiungo 7 a entrambi i membri: 4y = 20. Divido per 4: y = 5. Verifica: 4 × 5 − 7 = 13."},"checks":["Ogni operazione riguarda entrambi i membri","L’incognita è isolata","La soluzione rende vera l’equazione iniziale"],"error":{"wrong":"3x + 5 = 20 diventa 3x = 25.","why":"Per eliminare +5 serve sottrarre 5, non aggiungerlo.","fix":"Scrivi −5 su entrambi i membri: 3x = 15."},"home":["Su un’equazione assegnata conserva tutte le operazioni sui due membri e la verifica.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Individua le operazioni","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Usa due colonne separate dal segno = e annota l’operazione in entrambe; tieni disponibile il modello della bilancia.","preserve":"Risolvere un’equazione di primo grado e verificarne la soluzione.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Mostra una riga, poi fai scegliere al ragazzo il prossimo passaggio e chiedi di spiegarlo. Riduci i suggerimenti sulla procedura; mantieni calcolatrice, formulario e altri strumenti compensativi utili. Correttezza di un esempio non dimostra padronanza di ogni problema.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M08-09","goal":"Stimare un risultato e riconoscere risposte implausibili.","materials":["carta a quadretti","matita","calcolatrice o formulario se utili al tuo compito"],"techniques":[{"name":"Stima prima del calcolo","how":"Scrivi 1000 prima di elaborare 198 × 5 e poi confronta.","why":"Dà un riferimento indipendente dal risultato ottenuto."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: La stima usa numeri vicini; È distinta dal valore esatto; La plausibilità è motivata. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Senza calcolare subito, stima 198 × 5. Poi calcola e valuta se 9900 potrebbe essere corretto.","work":["Arrotondo 198 a 200: 200 × 5 = 1000.","Calcolo 198 × 5 = (200 − 2) × 5 = 1000 − 10 = 990.","990 è vicino a 1000; 9900 è circa dieci volte la stima e richiede un controllo."],"result":"Risultato esatto 990. La stima 1000 permette di escludere 9900."},"steps":[{"title":"Arrotonda i dati","do":"Scegli numeri vicini facili per il tuo calcolo.","help":"Non cambiare 198 in 20: perderesti l’ordine di grandezza."},{"title":"Calcola l’esatto","do":"Esegui il procedimento scritto o usa lo strumento previsto.","help":"Conserva la stima per confrontarla."},{"title":"Spiega la distanza","do":"Scrivi se il risultato è vicino, molto maggiore o molto minore della stima.","help":"La stima segnala un errore possibile, non sostituisce l’esatto."}],"transfer":{"task":"Stima 49 × 21 usando 50 × 20, poi calcola. Valuta la risposta 102,9.","check":"Stima 1000; esatto 49 × (20 + 1) = 980 + 49 = 1029. 102,9 non è plausibile per due fattori vicini a 50 e 20."},"checks":["La stima usa numeri vicini","È distinta dal valore esatto","La plausibilità è motivata"],"error":{"wrong":"9900 è giusto perché l’ho letto sulla calcolatrice.","why":"Anche un inserimento sbagliato produce una risposta.","fix":"Confronta con 1000 e reinserisci i fattori controllando le cifre."},"home":["Prima di un calcolo lungo del tuo compito registra una stima ragionata.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Arrotonda i dati","difficulty":"Confondo i dati mentre li ricopio","categories":["discalculia"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi.","aid":"Scrivi stima ed esatto in due riquadri; usa una linea dei numeri o valori di riferimento per vedere la dimensione.","preserve":"Stimare un risultato e riconoscere risposte implausibili.","verify":"Confronta due tentativi simili: conta i passaggi svolti correttamente e i richiami necessari. Mantieni l’aiuto se rende accessibile il compito."}],"coach":"Mostra una riga, poi fai scegliere al ragazzo il prossimo passaggio e chiedi di spiegarlo. Riduci i suggerimenti sulla procedura; mantieni calcolatrice, formulario e altri strumenti compensativi utili. Correttezza di un esempio non dimostra padronanza di ogni problema.","sources":["dunlosky2013","ies2007","eef2025","aid"]},{"id":"M08-10","goal":"Spiegare e confrontare due procedimenti corretti per lo stesso calcolo.","materials":["carta a quadretti","matita","calcolatrice o formulario se utili al tuo compito"],"techniques":[{"name":"Auto-spiegazione","how":"Dopo ogni riga spiega che cosa hai scomposto e quale operazione hai conservato.","why":"Fa controllare il senso della trasformazione."},{"name":"Autoverifica con criteri","how":"Prima di guardare la soluzione, controlla: I passaggi sono ricostruibili; La regola corrisponde alla trasformazione; Il confronto include un vantaggio concreto. Segna il punto da correggere.","why":"Ti fa trovare il passaggio da rivedere invece di ripetere tutto senza sapere dove intervenire."}],"example":{"task":"Calcola 25 × 16 in due modi: 25 × (10 + 6) e (25 × 4) × 4. Confronta vantaggi e risultato.","work":["Distribuisco: 25 × 10 + 25 × 6 = 250 + 150 = 400.","Scrivo 16 = 4 × 4: (25 × 4) × 4 = 100 × 4 = 400.","Entrambi valgono 400; il secondo crea subito 100, il primo usa la scomposizione in decine e unità."],"result":"400 in entrambi i casi. La scelta dipende da quali prodotti sai gestire con più chiarezza."},"steps":[{"title":"Nomina le regole","do":"Per i tuoi due procedimenti indica distributiva o associativa.","help":"Dividere 16 in una somma non è lo stesso che dividerlo in fattori."},{"title":"Esplicita le righe","do":"Mostra i prodotti intermedi e scrivi perché sono equivalenti.","help":"Non basta dire “ho fatto a mente”."},{"title":"Confronta la scelta","do":"Scrivi un vantaggio concreto e verifica che il risultato sia comune.","help":"Conta i passaggi che devi mantenere in mente."}],"transfer":{"task":"Calcola 12 × 15 usando 12 × (10 + 5) e (12 × 3) × 5. Spiega un vantaggio per ciascun metodo.","check":"120 + 60 = 180; 36 × 5 = 180. Il primo usa decine e metà di dieci; il secondo scompone 15 in 3 × 5. I risultati coincidono."},"checks":["I passaggi sono ricostruibili","La regola corrisponde alla trasformazione","Il confronto include un vantaggio concreto"],"error":{"wrong":"25 × (10 + 6) = 250 + 6.","why":"La moltiplicazione per 25 riguarda entrambi gli addendi.","fix":"Scrivi 25 × 10 + 25 × 6."},"home":["Per un calcolo della tua pagina presenta due metodi e spiega quale ti aiuta di più.","Dopo due giorni riprova la prova nuova coprendo la soluzione; confronta e correggi un punto. Riprendila più avanti se resta incerto.","Se l’errore indicato ricompare o non capisci un passaggio, mostra al docente o al professionista la riga precisa e l’aiuto già provato."],"adaptations":[{"stage":"Nomina le regole","difficulty":"Perdo l’ordine dei passaggi","categories":["trasversale"],"signal":"Osserva se durante questo passaggio servono riletture, ricopie o richiami ripetuti; non basta questo per attribuire una diagnosi
