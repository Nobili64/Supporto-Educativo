<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Un passo alla volta — cinque percorsi guidati</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#203638;background:#f5f4ee;font-synthesis:none;--accent:#165c54;--ink:#203638;--paper:#fff;--line:#c7d2ce;--muted:#4d6262;font-size:20px}*{box-sizing:border-box}body{margin:0}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;border:1px solid #78958e;background:white;color:var(--ink);border-radius:10px;padding:.65rem 1rem;min-height:48px;text-align:left;line-height:1.3}button:hover{border-color:var(--accent);background:#edf5f0}button:focus-visible,a:focus-visible{outline:3px solid #b75216;outline-offset:4px}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.primary:hover{background:#10443e}button:disabled{opacity:.4;cursor:default}p{line-height:1.6;margin:.65rem 0 1rem}h1,h2,h3{line-height:1.25;color:var(--ink)}h1{font-size:1.8rem;letter-spacing:-.025em;margin:.35rem 0 1.1rem}h2{font-size:1.35rem;margin:1.2rem 0 .7rem}h3{font-size:1.12rem}a{color:#15564f;text-underline-offset:3px}strong{font-weight:700}ul,ol{padding-left:1.35rem}li{line-height:1.55;margin:.5rem 0}main{font-size:1rem}.large{font-size:24px}.skip{position:absolute;top:-100px;padding:10px;background:white;z-index:10}.skip:focus{top:0}.topbar{max-width:1040px;margin:auto;padding:1.1rem 1.6rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}.brand{font-size:.85rem;letter-spacing:.02em}.brand strong{display:block}.brand span{display:block;font-size:.7rem;color:var(--muted);margin-top:4px}.topbar button{font-size:.85rem;padding:.45rem .9rem}.shell{max-width:1000px;margin:0 auto;padding:0 1.6rem 7rem}.paper{background:white;border:1px solid #dce1db;border-radius:18px;padding:2rem 2.4rem;box-shadow:0 5px 22px #20363808;min-height:440px}.kicker{font-size gn:center}.simple-back{margin-top:1.2rem}.menu-list{max-width:32rem}.note-sheet{background:white;border:2px solid #4b6660;border-radius:2px;font-size:.86rem;line-height:1.5}.note-heading{font-weight:bold;padding:.55rem .7rem;border-bottom:1px solid #6c837d}.note-columns{display:grid;grid-template-columns:34% 66%;min-height:155px}.note-col{padding:.7rem;border-right:1px solid #6c837d}.note-col:last-child{border-right:0}.note-col b,.note-summary b{font-size:.72rem;display:block;margin-bottom:.6rem}.note-col p{font-size:.85rem;line-height:1.5;margin:.65rem 0}.note-summary{border-top:1px solid #6c837d;padding:.7rem;min-height:70px}.note-summary p{margin:0;font-size:.85rem}.note-active{background:#ecf5ed}.note-line{min-height:1.6rem;border-bottom:1px solid #d9e1dc}.map-wrap{padding:.7rem .3rem}.map-wrap svg{display:block;width:100%;height:auto;max-height:425px}.map-mobile{display:none}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.coach-section{border-top:1px solid #d5dfd9;margin:1.4rem 0;padding-top:.3rem}.coach-section .small{color:#3a5650}.script{background:#f2f6f3;padding:1rem;border-left:4px solid #45695f}.coach-adapt{margin:1.4rem 0}.source-list{font-size:.85rem}.source-list a{overflow-wrap:anywhere}.print-view{max-width:900px;margin:auto;padding:1rem}.print-tools{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1rem}.print-page{background:white;padding:14mm;width:210mm;min-height:280mm;margin:1rem auto;border:1px solid #b8c6c0;font-size:11pt;line-height:1.4;color:#111}.print-page h1{font-size:21pt;color:#111;letter-spacing:0}.print-page h2{font-size:15pt;color:#111}.print-page h3{font-size:12pt;color:#111}.print-page p,.print-page li{font-size:11pt;line-height:1.45}.print-page .map-wrap svg{max-height:62mm}.print-page .visual{background:white;color:#111;padding:8px;border-color:#777}.print-page .visual-label{color:#111;font-size:10pt}.print-page .note-sheet{font-size:10pt}.print-page .note-col p,.print-page .note-summary p{font-size:10pt}.print-page .note-col b,.print-page .note-summary b{font-size:9pt}.print-page .note-columns{min-height:35mm}.print-page .note-summary{min-height:15mm}.print-page .small{font-size:9pt;color:#333}.writing-space{height:29mm;background:repeating-linear-gradient(white,white 7mm,#aaa 7.1mm,white 7.3mm);margin:5mm 0}.page-id{font-size:9pt;color:#333;border-bottom:1px solid #999;padding-bottom:3mm}.observation{border-collapse:collapse;width:100%;font-size:10pt}.observation td,.observation th{border:1px solid #777;padding:5px;text-align:left;font-weight:normal}.print-page .note-line{min-height:5mm}.coach-print{max-width:760px;margin:auto;background:white;padding:2rem}.screen-only{display:block}

</style></head><body><a class="skip" href="#main">Vai al contenuto</a><div id="app"></div><noscript>Per aprire i percorsi, abilita JavaScript nel browser. Il file funziona senza Internet.</noscript><script id="data" type="application/json">{"courses":[{"id":"M02-02","title":"Fare la parafrasi","subject":"Italiano","area":"Poesia","intro":"Riscrivi una poesia con parole più comuni, mantenendo il significato.","slides":[{"phase":"Preparazione","title":"Riscrivere, mantenendo il significato","text":["Una poesia può usare un ordine insolito delle parole o espressioni che non vanno prese alla lettera. La parafrasi serve a riscrivere quel testo con parole più comuni.","Scriverai in prosa: frasi come quelle di un racconto, senza dover rispettare le righe della poesia. Alla fine controllerai di non aver cambiato il significato."],"visual":{"type":"list","label":"Prepara","items":["Il testo da riscrivere","Un foglio e una penna","Un dizionario o l’aiuto di chi ti accompagna"]},"action":"Scrivi sul foglio il titolo “Parafrasi”. Lascia spazio per il testo originale e per la tua riscrittura.","hint":"Non devi inventare un’altra storia. Immagina di spiegare le stesse informazioni a una persona che fatica a capire le parole della poesia."},{"phase":"Esempio spiegato","title":"Leggiamo due versi","text":["Queste due righe di poesia sono due versi. Le useremo come esempio. Il colle è una collina.","Qui “oro” richiama il colore giallo della luce del sole. Questa informazione ci aiuta a capire l’immagine scelta nella poesia."],"visual":{"type":"quote","label":"Testo originale","text":"D’oro si veste\nil colle al mattino."},"action":"Leggi o ascolta i due versi una volta. Per ora cerca soltanto di immaginare la scena.","hint":"Puoi chiedere all’adulto di leggere. Immagina una collina al mattino: il sole la illumina. Non serve imparare i versi a memoria."},{"phase":"Esempio spiegato","title":"Troviamo di chi si parla","text":["In questa frase, il colle è ciò di cui si dice che “si veste”. In grammatica è il soggetto. Nella poesia arriva dopo il verbo, ma possiamo metterlo all’inizio per rendere la frase più facile da seguire."],"visual":{"type":"quote","label":"Versi da osservare","text":"D’oro si veste\nil colle al mattino."},"action":"Indica le parole “il colle” nel testo. Sono le parole che metteremo all’inizio.","hint":"Chiediti: che cosa “si veste”? La risposta è “il colle”. In altre frasi questa domanda va adattata al verbo: qui serve a seguire questo esempio."},{"phase":"Esempio spiegato","title":"Rimettiamo in ordine le parole","text":["Mettiamo prima “Il colle”, poi “si veste”, poi “d’oro” e infine “al mattino”. Abbiamo cambiato l’ordine; non abbiamo ancora spiegato l’immagine dell’oro."],"visual":{"type":"quote","label":"Prima e dopo","text":"D’oro si veste / il colle al mattino.\n\nIl colle si veste d’oro al mattino."},"action":"Segui con il dito le quattro parti della frase riordinata. Ritrova ciascuna parte nei versi.","hint":"Le parole “al mattino” indicano quando accade la scena. Devono restare anche nella parafrasi: cambiare l’ordine non significa eliminare informazioni."},{"phase":"Esempio spiegato","title":"Spieghiamo l’immagine dell’oro","text":["“Si veste d’oro” è un’espressione figurata: usa l’immagine di un vestito dorato per descrivere l’aspetto del colle. Qui significa che il colle viene illuminato dalla luce dorata del sole."],"visual":{"type":"quote","label":"Espressione e significato","text":"Il colle si veste d’oro.\n\nIl colle è illuminato dalla luce dorata del sole."},"action":"Leggi il significato. Immagina se descrive la stessa scena dei versi.","hint":"Per scegliere il significato di un’immagine, usa il contesto: le parole vicine e la scena descritta. Un dizionario può aiutare, ma la prima definizione trovata non è sempre quella adatta."},{"phase":"Esempio spiegato","title":"Ricomponiamo una frase completa","text":["Ora uniamo il significato dell’immagine e l’informazione sul tempo. Possiamo mettere “al mattino” all’inizio: rende subito chiaro quando il colle è illuminato."],"visual":{"type":"quote","label":"Originale e parafrasi","text":"D’oro si veste\nil colle al mattino.\n\nAl mattino il colle è illuminato dalla luce dorata del sole."},"action":"Scrivi la parafrasi sotto i versi. Confronta: ci sono ancora il colle, la luce dorata e il mattino?","hint":"Una parafrasi può avere più parole dell’originale: servono a rendere esplicito il significato. “Il colle è bello” aggiungerebbe invece un giudizio che nei versi non c’è."},{"phase":"Prova guidata","title":"Quale frase mantiene lo stesso significato?","text":["Prima di riscrivere da solo, confronta queste due possibilità. Cambiare le parole va bene; cambiare un’informazione del testo cambia invece il significato."],"visual":{"type":"quote","label":"Originale e due possibilità","text":"D’oro si veste\nil colle al mattino.\n\nA. Al mattino la luce dorata del sole illumina il colle.\nB. Al tramonto la luce dorata del sole illumina il colle."},"action":"Sul foglio scrivi A oppure B. Indica nei versi la parola che ti ha aiutato a scegliere. Avanza per controllare.","hint":"Cerca l’informazione sul momento della giornata. Devi poterla ritrovare anche nella frase che scegli."},{"phase":"Controllo guidato","title":"La parola “mattino” decide il confronto","text":["La frase A mantiene il momento della giornata indicato dal testo. La B lo cambia: “tramonto” è il momento in cui il sole scende sotto l’orizzonte, non il mattino."],"visual":{"type":"quote","label":"Confronto con il testo","text":"D’oro si veste\nil colle al mattino.\n\nA. Al mattino la luce dorata del sole illumina il colle."},"action":"Se avevi scelto B, correggi soltanto l’indicazione del tempo. Hai usato una parola del testo per controllare il significato.","hint":"Due frasi possono descrivere scene simili e non significare la stessa cosa. Nella parafrasi anche un dettaglio come il tempo o il luogo va conservato."},{"phase":"Prova guidata","title":"Proviamo con un altro testo","text":["Adesso userai gli stessi passaggi su questi versi. “Manto” può indicare una copertura; qui è la neve che copre il villaggio.","Quando il testo dice che il villaggio “dorme”, descrive la quiete del luogo: non significa che le case dormano davvero."],"visual":{"type":"quote","label":"La tua prova","text":"Dorme il villaggio\nsotto un manto di neve."},"action":"Copia i versi sul foglio, oppure usa una copia già pronta. Lascia una riga sotto per la parafrasi.","hint":"Se copiare ti fa perdere il filo, chiedi un testo già stampato. Il lavoro da imparare qui è capire e riscrivere il significato."},{"phase":"Prova guidata","title":"Mettiamo il villaggio all’inizio","text":["Questa volta le parole da mettere all’inizio sono “Il villaggio”. Dopo vengono “dorme” e “sotto un manto di neve”. Prima di spiegare le immagini, rendiamo chiaro l’ordine."],"visual":{"type":"quote","label":"Testo da riordinare","text":"Dorme il villaggio\nsotto un manto di neve."},"action":"Completa sul foglio: “Il villaggio …”. Usa tutte le informazioni dei due versi.","hint":"La frase riordinata è “Il villaggio dorme sotto un manto di neve”. Se avevi scritto un ordine diverso, controlla che il significato sia lo stesso."},{"phase":"Prova guidata","title":"Sostituisci le immagini con il significato","text":["Ora trasforma “dorme” in un’espressione che dica che il villaggio è quieto. Trasforma “sotto un manto di neve” in parole che dicano che è coperto di neve."],"visual":{"type":"quote","label":"Informazioni da mantenere","text":"Il villaggio dorme sotto un manto di neve.\n\n“Dorme” → è quieto.\n“Manto di neve” → copertura di neve."},"action":"Scrivi una frase completa sul villaggio. Puoi iniziare con “Il villaggio è …”.","hint":"Prova a unire “è quieto” e “coperto di neve”. Non aggiungere dettagli come l’ora o il numero delle case: i versi non li indicano."},{"phase":"Controllo guidato","title":"Confronta il significato, non le singole parole","text":["Questa è una possibile parafrasi. Anche “Il villaggio è tranquillo e la neve lo ricopre” mantiene il significato. Non è necessario aver scelto le stesse parole del modello."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"Il villaggio è quieto e coperto di neve."},"action":"Controlla la tua frase: parla del villaggio, della quiete e della neve che lo copre? Se manca un’informazione, aggiungila.","hint":"Se hai scritto soltanto “C’è la neve”, manca la quiete del villaggio. Torna all’espressione “dorme” e inserisci anche il suo significato."},{"phase":"Compito nuovo","title":"Adesso scegli tu i passaggi","text":["Usa questo testo nuovo. “Sussurra” significa “parla a voce molto bassa”; qui descrive il rumore leggero del vento tra i rami.","Puoi tenere aperti il testo e questa spiegazione mentre lavori."],"visual":{"type":"quote","label":"Nuovi versi","text":"Tra i rami sussurra\nil vento della sera."},"action":"Sul foglio scrivi la parafrasi. Prima riordina la frase; poi spiega “sussurra”. Vai avanti quando vuoi confrontare il tuo lavoro.","hint":"Chiediti: che cosa produce il suono? Dove? In quale momento? Nel testo trovi “il vento”, “tra i rami” e “della sera”. Conserva queste informazioni."},{"phase":"Controllo","title":"Leggiamo una soluzione possibile","text":["Il soggetto è “il vento della sera”. L’espressione “sussurra” viene spiegata come un rumore leggero. L’indicazione “tra i rami” rimane nella frase."],"visual":{"type":"quote","label":"Originale e parafrasi","text":"Tra i rami sussurra\nil vento della sera.\n\nIl vento della sera produce un rumore leggero tra i rami."},"action":"Confronta la tua parafrasi con i versi. Se hai scritto “soffia piano tra i rami”, chiediti se risulta chiaro anche il suono leggero descritto dal testo.","hint":"Puoi correggere solo il punto che manca. Per esempio, a “Il vento passa tra i rami” puoi aggiungere “la sera, producendo un rumore leggero”."},{"phase":"Controllo","title":"Riconosci un’aggiunta non presente nel testo","text":["“Il vento spaventoso spezza i rami” cambia la scena: nei versi non si parla né di paura né di rami spezzati. Nella parafrasi spieghiamo le parole del testo, senza inventare altri eventi."],"visual":{"type":"quote","label":"Il testo a cui tornare","text":"Tra i rami sussurra\nil vento della sera."},"action":"Rileggi la tua frase. Cerca eventuali informazioni che non puoi ritrovare o ricavare dai versi. Toglile o discutile con chi ti accompagna.","hint":"Non tutto ciò che immagini leggendo deve entrare nella parafrasi. Le tue impressioni possono servire in un commento personale, che è un lavoro diverso."},{"phase":"Ripresa a casa","title":"Riprendi il metodo sul tuo compito","text":["A casa affronta pochi versi per volta. Tieni sempre davanti l’originale mentre riscrivi.","Se un’immagine resta poco chiara, segnala la parola e chiedi aiuto sul suo significato prima di proseguire."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Leggi o ascolta i versi e chiarisci le parole difficili.","Ricostruisci una frase con un ordine che riesci a seguire.","Spiega le immagini usando il contesto.","Confronta ogni informazione con il testo originale."]},"action":"Scegli i primi versi del compito assegnato e applica la sequenza. Nel Menu trovi la scheda da stampare.","hint":"Per verificare se il metodo aiuta, prova a spiegare perché hai scelto una parola nella parafrasi. Se sai collegarla al testo, stai controllando il significato e non solo copiando un modello."}],"coach":{"goal":"Osservare se lo studente ricostruisce e conserva il significato, distinguendo parafrasi e commento. Non richiedere una formulazione identica al modello.","prepare":"Usare i testi originali di questo prototipo, letti insieme. Chiarire prima il lessico necessario. I versi sono stati scritti per l’esercitazione; non sono citazioni di un autore.","observe":"Chiedere “Quale parola dei versi ti ha fatto scrivere questo?”. Se lo studente non risponde, tornare al punto del testo e modellare un solo collegamento, poi proporne un altro allo studente.","adaptations":[["Lettura dei versi — possibile difficoltà con dislessia","Lettura lenta o errori che fanno perdere la scena.","Offrire lettura dell’adulto o sintesi vocale già abituale e mantenere il testo visibile. Verificare se lo studente individua le informazioni ascoltate."],["Scrittura — possibile difficoltà con disgrafia o disortografia","Il significato è spiegato oralmente, ma la scrittura assorbe tutto lo sforzo.","Accettare inizialmente una parafrasi orale o scritta dall’adulto sotto dettatura. Separare il controllo del significato da quello ortografico; mantenere disponibili gli strumenti consueti."]],"sources":[0,3,4]},"print":{"modelTitle":"Esempio commentato","model":["D’oro si veste\nil colle al mattino.","1. Individuo il colle: è ciò di cui si dice che “si veste”.","2. Riordino: “Il colle si veste d’oro al mattino”.","3. Spiego l’immagine: il colle è illuminato dalla luce dorata del sole.","4. Scrivo: “Al mattino il colle è illuminato dalla luce dorata del sole”.","5. Controllo che ci siano il colle, la luce dorata e il mattino."],"practice":[["Prova guidata","Dorme il villaggio\nsotto un manto di neve.\nQui “dorme” indica quiete e “manto” indica copertura. Riordina la frase e spiega le due immagini."],["Compito nuovo","Tra i rami sussurra\nil vento della sera.\nQui “sussurra” descrive il rumore leggero del vento. Riscrivi mantenendo chi, dove e quando."]],"answers":["Prova guidata: “Il villaggio è quieto e coperto di neve”.","Compito nuovo: “Il vento della sera produce un rumore leggero tra i rami”.","Sono possibili parole diverse. Controlla le informazioni, non la corrispondenza parola per parola."],"home":["Leggi pochi versi e chiarisci il lessico.","Riordina la frase; spiega le immagini usando il contesto.","Confronta la riscrittura con l’originale e togli le aggiunte non giustificate."]}},{"id":"M08-08","title":"Risolvere un’equazione","subject":"Matematica","area":"Algebra","intro":"Trova il numero nascosto e controlla se rende vera l’uguaglianza.","slides":[{"phase":"Preparazione","title":"Troviamo un numero che non conosciamo","text":["Un’equazione è un’uguaglianza che contiene un numero da trovare. Quel numero è indicato con una lettera, chiamata incognita. In questo esempio la lettera è x: cerchiamo il suo valore."],"visual":{"type":"math","label":"Il nostro esempio","lines":["3x + 5 = 20"]},"action":"Prepara foglio, penna e gli strumenti di calcolo che usi di solito. Copia l’equazione lasciando una riga libera sotto.","hint":"Il segno = dice che il valore a sinistra deve essere uguale a quello a destra. Risolvere significa trovare il numero che, messo al posto di x, rende vera questa uguaglianza."},{"phase":"Esempio spiegato","title":"Che cosa vuol dire 3x?","text":["In algebra, 3x significa 3 × x: tre volte il numero x. Il simbolo della moltiplicazione può essere sottinteso quando un numero è vicino a una lettera."],"visual":{"type":"math","label":"Due modi di scrivere la stessa cosa","lines":["3x = 3 × x","Se x fosse 2: 3 × 2 = 6"]},"action":"Indica nell’equazione “3x + 5 = 20” la moltiplicazione e l’addizione. Per ora non devi trovare x.","hint":"“Se x fosse 2” è solo un esempio per leggere 3x. Non è la soluzione della nostra equazione: 3 × 2 + 5 fa 11, non 20."},{"phase":"Esempio spiegato","title":"Leggiamo i due lati dell’uguaglianza","text":["La parte a sinistra di = si chiama primo membro; quella a destra si chiama secondo membro. Qui il primo membro è “3x + 5” e il secondo è “20”."],"visual":{"type":"math","label":"I due membri","lines":["3x + 5     =     20"]},"action":"Sul foglio segna una piccola linea sotto ciascun membro. Il segno = deve restare tra le due parti.","hint":"Un “membro” è semplicemente uno dei due lati dell’equazione. Non devi imparare una procedura diversa: questi nomi servono a parlare delle due parti."},{"phase":"Esempio spiegato","title":"Manteniamo uguali i due lati","text":["Se due quantità sono uguali e togliamo la stessa quantità da entrambe, restano uguali. Useremo questa idea per eliminare il +5 vicino a 3x."],"visual":{"type":"math","label":"Prima osserva con numeri noti","lines":["12 = 12","12 − 5 = 12 − 5","7 = 7"]},"action":"Guarda che −5 è scritto su entrambi i lati. Nell’equazione faremo la stessa operazione ai due membri.","hint":"Se togliessi 5 soltanto da uno dei due 12, avresti 7 = 12, che è falso. Cambiare un solo lato non conserva l’uguaglianza."},{"phase":"Esempio spiegato","title":"Togliamo 5 da entrambi i membri","text":["Vogliamo lasciare 3x senza il +5. Sottrarre 5 elimina quel +5, perché +5 −5 dà zero. Scriviamo −5 anche a destra per mantenere l’uguaglianza."],"visual":{"type":"math","label":"Operazione completa","lines":["3x + 5 = 20","3x + 5 − 5 = 20 − 5"]},"action":"Copia la seconda riga sotto l’equazione. Controlla che ci sia −5 sia a sinistra sia a destra.","hint":"Sottrarre 5 significa togliere 5. L’operazione che annulla un’aggiunta di 5 è proprio una sottrazione di 5."},{"phase":"Esempio spiegato","title":"Semplifichiamo la riga","text":["A sinistra, +5 −5 dà zero e rimane 3x. A destra, 20 −5 dà 15. Ora sappiamo che tre volte x vale 15."],"visual":{"type":"math","label":"Dalla riga completa a quella più semplice","lines":["3x + 5 − 5 = 20 − 5","3x = 15"]},"action":"Scrivi “3x = 15” su una nuova riga, mantenendo il segno = sotto quello precedente.","hint":"Non abbiamo cambiato 3x: abbiamo solo calcolato le parti numeriche che potevamo calcolare. Usare una riga per passaggio aiuta a ritrovare il punto se ti interrompi."},{"phase":"Esempio spiegato","title":"Da tre volte x a una volta x","text":["Per sapere quanto vale una sola x, dividiamo per 3. Dividiamo entrambi i membri per lo stesso numero: il 3 è diverso da zero, quindi questa divisione conserva l’uguaglianza."],"visual":{"type":"math","label":"Divisione su entrambi i lati","lines":["3x = 15","3x ÷ 3 = 15 ÷ 3","x = 5"]},"action":"Scrivi la divisione e poi il risultato. Ora la lettera è da sola: abbiamo trovato x = 5.","hint":"3x è x + x + x. Se queste tre parti uguali valgono in tutto 15, ogni parte vale 15 ÷ 3 = 5. Puoi usare la calcolatrice se il calcolo ostacola il ragionamento."},{"phase":"Esempio spiegato","title":"Controlliamo nell’equazione iniziale","text":["Per verificare il risultato, torniamo all’equazione da cui siamo partiti e mettiamo 5 al posto di x. Prima eseguiamo la moltiplicazione, poi l’addizione."],"visual":{"type":"math","label":"Sostituzione e controllo","lines":["3x + 5 = 20","3 × 5 + 5 = 20","15 + 5 = 20","20 = 20"]},"action":"Controlla che il valore a sinistra sia uguale a quello a destra. Qui 20 = 20 conferma la soluzione.","hint":"Non verificare soltanto l’ultima riga x = 5: devi tornare a 3x + 5 = 20. È l’equazione iniziale a dire se il numero trovato funziona."},{"phase":"Prova guidata","title":"Ora prova con z","text":["La lettera può cambiare: z indica ancora un numero da trovare. Qui abbiamo due volte z, poi aggiungiamo 4.","Prima vogliamo lasciare soltanto 2z a sinistra."],"visual":{"type":"math","label":"La tua equazione","lines":["2z + 4 = 18"]},"action":"Scrivi sotto l’equazione la stessa sottrazione su entrambi i lati, in modo da eliminare +4. Non fare ancora la divisione.","hint":"Per eliminare +4, scrivi −4 a sinistra e −4 a destra. Puoi completare: 2z + 4 − 4 = 18 − 4."},{"phase":"Controllo guidato","title":"Dopo aver tolto 4","text":["Il +4 e il −4 si annullano a sinistra. A destra 18 −4 fa 14. Ora l’equazione dice che due volte z vale 14."],"visual":{"type":"math","label":"Confronta con il tuo passaggio","lines":["2z + 4 − 4 = 18 − 4","2z = 14"]},"action":"Se il tuo passaggio è diverso, controlla prima i due −4, poi il calcolo 18 −4. Correggi il punto che non coincide.","hint":"Se avevi scritto 2z = 18, hai tolto 4 soltanto a sinistra. Scrivi l’operazione anche a destra e calcola di nuovo."},{"phase":"Prova guidata","title":"Lascia z da sola","text":["Da “due volte z” vogliamo arrivare a “una volta z”. Scegli la divisione che lo permette e applicala anche al numero 14."],"visual":{"type":"math","label":"Parti da qui","lines":["2z = 14"]},"action":"Scrivi la divisione su entrambi i membri e poi il valore di z.","hint":"Dividi per 2: 2z ÷ 2 = 14 ÷ 2. A sinistra resta z. A destra puoi calcolare 14 ÷ 2 con il tuo strumento abituale."},{"phase":"Controllo guidato","title":"Verifica il numero trovato","text":["La divisione dà z = 7. Mettiamo 7 al posto di z nell’equazione iniziale. I due lati valgono 18, quindi il risultato funziona."],"visual":{"type":"math","label":"Il controllo completo","lines":["2z + 4 = 18","2 × 7 + 4 = 18","14 + 4 = 18","18 = 18"]},"action":"Confronta il tuo risultato con questo controllo. Indica dove compare il 7 che ha sostituito z.","hint":"Se avevi trovato un numero diverso, sostituiscilo nell’originale. Se i lati non coincidono, torna alla prima riga in cui il tuo lavoro è diverso dal modello."},{"phase":"Compito nuovo","title":"Questa volta c’è una sottrazione","text":["Qui dopo quattro volte y togliamo 7. Per lasciare 4y da solo, scegli l’operazione che annulla −7. Poi continua fino a trovare y."],"visual":{"type":"math","label":"Compito nuovo","lines":["4y − 7 = 13"]},"action":"Risolvi sul foglio, una riga per volta, e verifica nell’equazione iniziale. Vai avanti quando vuoi confrontare il procedimento.","hint":"Per annullare −7 devi aggiungere 7, perché −7 +7 dà zero. Aggiungi 7 a entrambi i membri; poi chiediti come passare da quattro volte y a una volta y."},{"phase":"Controllo","title":"Confronta le operazioni","text":["Aggiungiamo 7 da entrambe le parti. Poi dividiamo entrambi i membri per 4. In questo modo la lettera rimane da sola."],"visual":{"type":"math","label":"Soluzione del compito nuovo","lines":["4y − 7 + 7 = 13 + 7","4y = 20","4y ÷ 4 = 20 ÷ 4","y = 5"]},"action":"Confronta una riga alla volta. Se trovi una differenza, controlla l’operazione scelta e il suo calcolo prima di copiare il risultato.","hint":"Il fatto che anche qui la soluzione sia 5 non dipende dal nome della lettera. Dipende dai numeri di questa equazione: ogni nuova equazione va risolta e controllata."},{"phase":"Controllo","title":"Controlla anche la sottrazione finale","text":["Sostituiamo y con 5 nell’originale. Prima 4 ×5 dà 20. Poi 20 −7 dà 13, uguale al secondo membro."],"visual":{"type":"math","label":"Verifica del compito nuovo","lines":["4y − 7 = 13","4 × 5 − 7 = 13","20 − 7 = 13","13 = 13"]},"action":"Confronta questa verifica con la tua. Se avevi sommato 7 anche qui, torna all’originale: nella verifica rimane il suo −7.","hint":"Le operazioni usate per risolvere non sostituiscono l’equazione da verificare. Il controllo usa sempre la riga iniziale, con tutti i suoi segni."},{"phase":"Controllo","title":"Un errore da riconoscere","text":["Da 3x +5 =20 non possiamo passare a 3x =20 togliendo il +5 solo a sinistra. Nel nuovo passaggio il lato destro dovrebbe diventare 15."],"visual":{"type":"math","label":"Il passaggio da correggere","lines":["3x + 5 = 20","ERRORE: 3x = 20","CORREZIONE: 3x + 5 − 5 = 20 − 5"]},"action":"Spiega sul foglio o a voce quale operazione mancava a destra.","hint":"Riguarda l’esempio numerico: 12 −5 non è uguale a 12. Per lasciare uguali i lati devi togliere la stessa quantità anche al secondo."},{"phase":"Ripresa a casa","title":"Usa una riga per ogni passaggio","text":["Questo percorso riguarda equazioni semplici come quelle viste: una lettera moltiplicata per un numero, con un numero aggiunto o sottratto.","Se trovi parentesi, frazioni o lettere nei due membri, riprendi prima la spiegazione specifica dell’insegnante."],"visual":{"type":"list","label":"Il tuo promemoria","items":["Copia l’equazione e leggi le operazioni vicino alla lettera.","Annulla l’aggiunta o la sottrazione con la stessa operazione sui due membri.","Dividi entrambi i membri per il numero che moltiplica la lettera.","Sostituisci la soluzione nell’originale e confronta i due valori."]},"action":"Scegli un’equazione dello stesso tipo dal compito. Nel Menu puoi stampare esempio, prove e promemoria per casa.","hint":"Puoi tenere aperto il modello e usare formulari o strumenti di calcolo concordati. L’obiettivo è scegliere e controllare i passaggi, non dimostrare di saper fare tutto a memoria."}],"coach":{"goal":"Osservare scelta dell’operazione, applicazione ai due membri e verifica nell’originale. Gli esempi riguardano ax+b=c con a positivo e soluzioni intere; non costituiscono un corso completo sulle equazioni.","prepare":"Verificare il significato di moltiplicazione e divisione con un esempio concreto. Se questi prerequisiti non sono disponibili, lavorarci prima di proseguire. Non introdurre la regola “sposta e cambia segno” come scorciatoia priva di spiegazione.","observe":"Far indicare l’operazione sul membro sinistro e su quello destro. Chiedere “Perché questa operazione?”. Distinguere un errore nella scelta da un errore nel calcolo.","adaptations":[["Lettura e allineamento — possibile difficoltà con dislessia o disgrafia","Perdita di un segno, salti di riga, cifre difficili da rileggere.","Fornire l’equazione già scritta, una riga per passaggio e spazio ampio. Leggere a voce i segni. Verificare che la copia resti coerente prima di interpretare un errore come concettuale."],["Calcolo — possibile difficoltà con discalculia","Operazione scelta correttamente, ma calcoli o fatti aritmetici rallentano il procedimento.","Lasciare calcolatrice e tavole già in uso. Far spiegare quale calcolo inserire. Controllare separatamente il ragionamento sui membri e l’esecuzione aritmetica."],["Ortografia — possibile disortografia","Una spiegazione scritta contiene errori di parole ma il procedimento è corretto.","Accogliere anche la spiegazione orale; non usare l’ortografia come indicatore della comprensione dell’uguaglianza."]],"sources":[0,3]},"print":{"modelTitle":"Equazione commentata","model":["3x + 5 = 20. La scrittura 3x significa 3 × x.","1. Tolgo 5 da entrambi i membri: 3x + 5 − 5 = 20 − 5.","2. Calcolo: 3x = 15.","3. Divido entrambi per 3: 3x ÷ 3 = 15 ÷ 3. Quindi x = 5.","4. Verifico nell’originale: 3 × 5 + 5 = 15 + 5 = 20. Il secondo membro è 20: coincidono.","Fare la stessa operazione ai due membri mantiene l’uguaglianza; qui dividiamo per un numero diverso da zero."],"practice":[["Prova guidata","2z + 4 = 18\nPrima annulla +4 sui due membri. Poi dividi entrambi per il numero che moltiplica z. Verifica nell’originale."],["Compito nuovo","4y − 7 = 13\nScegli come annullare −7. Applica l’operazione ai due membri, continua e verifica."]],"answers":["2z + 4 − 4 = 18 − 4 → 2z = 14 → 2z ÷ 2 = 14 ÷ 2 → z = 7. Verifica: 2 × 7 + 4 = 18.","4y − 7 + 7 = 13 + 7 → 4y = 20 → 4y ÷ 4 = 20 ÷ 4 → y = 5. Verifica: 4 × 5 − 7 = 13.","Se il risultato non funziona, controlla una riga alla volta: operazione scelta, presenza sui due membri, calcolo."],"home":["Una riga per passaggio; conserva l’equazione iniziale.","Scegli l’operazione che annulla il numero aggiunto o sottratto.","Applica ogni operazione a entrambi i membri.","Quando la lettera è da sola, verifica nell’originale."]}},{"id":"M21-04","title":"Prendere appunti a due colonne","subject":"In tutte le materie","area":"Lezione in classe","intro":"Ascolta un’idea, annota poche parole utili e completa gli appunti dopo.","slides":[{"phase":"Preparazione","title":"Appunti che ti aiutino a ritrovare la lezione","text":["Gli appunti servono a conservare le idee della spiegazione. Non occorre scrivere tutte le parole pronunciate dall’insegnante.","In questo percorso preparerai un foglio con due colonne e uno spazio finale. Vedrai prima un esempio; poi farai una breve prova di ascolto con chi ti accompagna."],"visual":{"type":"list","label":"Prepara","items":["Un foglio abbastanza grande e una penna","Una persona che legga la breve spiegazione","Se scrivere è faticoso, una traccia già divisa in colonne"]},"action":"Scrivi in alto “Appunti della lezione”. Chi ti accompagna trova i testi da leggere in Menu → Guida per il professionista.","hint":"In classe puoi usare anche uno schema fornito dall’insegnante. Qui impariamo una possibilità: il formato va adattato alla velocità della lezione e al modo in cui riesci a scrivere."},{"phase":"Preparazione","title":"Dividi il foglio in due colonne","text":["Traccia una linea verticale: lascia circa un terzo del foglio a sinistra e due terzi a destra. La colonna più larga servirà per annotare mentre ascolti. Lascia anche qualche riga libera in basso."],"visual":{"type":"notes","stage":"blank"},"action":"Sul foglio scrivi “Domande — dopo” a sinistra, “Appunti — durante” a destra e “In poche parole — dopo” in basso.","hint":"Le misure non devono essere precise. Serve più spazio per gli appunti che per le domande. Puoi stampare la traccia dal Menu se tracciare le linee assorbe troppo tempo."},{"phase":"Esempio spiegato","title":"Durante la spiegazione usa la colonna larga","text":["Nella colonna larga scrivi le informazioni che vuoi conservare. Le domande e la frase finale arriveranno dopo: mentre ascolti non devi riempire tutte le zone del foglio."],"visual":{"type":"notes","stage":"during"},"action":"Indica sul tuo foglio dove scriverai mentre ascolti. Lascia vuote, per ora, la colonna delle domande e le righe finali.","hint":"Separare i momenti riduce le cose da fare insieme. “Durante” significa mentre qualcuno spiega; “dopo” significa quando la spiegazione è terminata o c’è una pausa concordata."},{"phase":"Esempio spiegato","title":"Ascolta le parole che annunciano un’idea","text":["A volte chi spiega segnala che cosa sta per dire: “La definizione è…”, “Un esempio è…” oppure “Ci sono due aspetti da ricordare”. Queste parole possono aiutarti a preparare lo spazio per gli appunti."],"visual":{"type":"quote","label":"Un segnale da riconoscere","text":"“Ora vediamo due tipi di fonti storiche: le fonti scritte e le fonti materiali”."},"action":"Sul foglio prepara due righe distinte, una per ciascun tipo di fonte. Non devi annotare anche “Ora vediamo”.","hint":"Il segnale orienta l’ascolto, ma non sostituisce il contenuto. Se l’insegnante non annuncia le parti, cerca comunque di distinguere un’idea dal suo esempio e chiedi chiarimenti nella pausa."},{"phase":"Esempio spiegato","title":"Prima ascolta una piccola idea","text":["Immagina che l’insegnante pronunci questa frase. Prima ascoltiamo il suo significato; poi scegliamo che cosa annotare."],"visual":{"type":"quote","label":"Esempio di spiegazione","text":"Le fonti scritte sono testi che danno informazioni sul passato. Una lettera è un esempio di fonte scritta."},"action":"Leggi o ascolta la frase. Individua il nome importante: “fonti scritte”.","hint":"Una fonte storica è una traccia che aiuta a ricostruire il passato. Una lettera scritta da una persona può dare informazioni su ciò che viveva o raccontava."},{"phase":"Esempio spiegato","title":"Conserva nome, significato ed esempio","text":["Per questi appunti teniamo tre cose: il nome “fonti scritte”, il significato “testi sul passato” e un esempio, “lettera”. Scriviamo meno parole, ma manteniamo il collegamento tra le idee."],"visual":{"type":"notes","stage":"one"},"action":"Confronta la frase precedente, riportata qui: “Le fonti scritte sono testi che danno informazioni sul passato. Una lettera è un esempio”. Ritrova le tre informazioni negli appunti.","hint":"Una parola chiave è una parola che ti aiuta a ritrovare un’idea. Scrivere soltanto “lettera” sarebbe poco chiaro: dopo potresti non ricordare a quale argomento appartiene."},{"phase":"Esempio spiegato","title":"Se perdi un pezzo, lascia un segno","text":["Mentre scrivi potresti non sentire un esempio. Metti un punto interrogativo nel punto mancante e torna ad ascoltare: lo completerai quando ci sarà una pausa."],"visual":{"type":"notes","stage":"gap"},"action":"Guarda “fonti materiali → oggetti → esempio: ?”. Il ? segnala proprio l’esempio da chiedere, non tutta la lezione.","hint":"Le fonti materiali sono oggetti che danno informazioni sul passato. Se non senti quale oggetto è stato citato, puoi comunque conservare “oggetti” e segnare il punto mancante."},{"phase":"Esempio spiegato","title":"Chiedi il pezzo che manca","text":["Nella pausa puoi fare una domanda precisa: “Qual era l’esempio di fonte materiale?”. Nell’esempio l’insegnante risponde “un vaso”. Sostituiamo il ? con quella parola."],"visual":{"type":"notes","stage":"two"},"action":"Individua la parola “vaso” aggiunta negli appunti. Le due righe ora conservano il tipo di fonte, il significato e un esempio.","hint":"Se non c’è una pausa adatta, lascia il ? e chiedi dopo. Puoi confrontare quel punto con il materiale dell’insegnante o con un compagno, senza ricopiare tutta la pagina."},{"phase":"Esempio spiegato","title":"Dopo, costruisci una domanda","text":["La spiegazione è finita. Leggi una riga di appunti e chiediti: “A quale domanda risponde?”. Per la prima riga possiamo scrivere “Che cosa sono le fonti scritte? Un esempio?”."],"visual":{"type":"notes","stage":"questions"},"action":"Scrivi nella colonna stretta una domanda sulla seconda riga: deve chiedere che cosa sono le fonti materiali e un loro esempio.","hint":"Una domanda utile ti fa recuperare un’informazione, non soltanto rispondere sì o no. “Ho capito?” non ti dice che cosa ricordare della lezione."},{"phase":"Esempio spiegato","title":"Scrivi il senso generale in una frase","text":["Nello spazio in basso metti insieme le due idee principali. La frase serve a capire di che cosa parlava questa parte di lezione, senza rileggere ogni dettaglio."],"visual":{"type":"notes","stage":"complete"},"action":"Leggi la frase finale: contiene sia i testi sia gli oggetti. Non serve riscrivere anche tutti gli esempi.","hint":"“In poche parole” significa una sintesi: una frase breve che conserva l’idea principale. La frase può essere semplice e non deve usare parole difficili."},{"phase":"Prova guidata","title":"Preparati ad ascoltare una nuova spiegazione","text":["Ora prepara un’altra pagina con le stesse zone. Il tema sarà la legenda di una carta geografica: la legenda spiega il significato dei simboli usati sulla carta.","Chi ti accompagna leggerà due brevi parti e farà una pausa tra l’una e l’altra. Il testo “Prova guidata” è nella Guida per il professionista."],"visual":{"type":"notes","stage":"blank"},"action":"Scrivi il titolo “La legenda”. Tieni la penna pronta nella colonna larga. Quando siete pronti, chiedi la lettura della prima parte.","hint":"Puoi concordare una rilettura o una pausa più lunga. Stai imparando a scegliere le informazioni: non è una gara di velocità né una prova di memoria."},{"phase":"Prova guidata","title":"Ascolta e annota la prima idea","text":["Ascolta la prima parte letta dall’adulto. Cerca che cosa fa la legenda. Dopo aver ascoltato, scrivi poche parole nella colonna larga, come negli esempi precedenti."],"visual":{"type":"quote","label":"La domanda da tenere presente","text":"A che cosa serve la legenda di una carta?"},"action":"Annota la risposta con parole tue. Se perdi una parola, lascia un ? e chiedi una rilettura nella pausa.","hint":"Puoi iniziare con “legenda → …”. Non serve una frase elegante: deve restare chiaro a te quale informazione hai ascoltato."},{"phase":"Prova guidata","title":"Aggiungi gli esempi ascoltati","text":["Ora ascolta la seconda parte. Conserva ciascun simbolo insieme al suo significato. La spiegazione si riferisce a una carta precisa: altre carte possono usare simboli differenti."],"visual":{"type":"quote","label":"Che cosa collegare negli appunti","text":"Simbolo → significato in questa carta"},"action":"Aggiungi due righe nella colonna larga. Poi chiedi di chiarire gli eventuali punti segnati con ?.","hint":"Non scrivere soltanto il nome del simbolo. Dopo “linea blu” lascia spazio per dire che cosa indica in questa carta. Fai lo stesso per l’altro simbolo."},{"phase":"Controllo guidato","title":"Confronta le informazioni annotate","text":["Queste sono possibili note della spiegazione. Puoi aver usato altre parole: controlla soprattutto che ogni simbolo sia collegato al significato corretto."],"visual":{"type":"quote","label":"Appunti possibili","text":"legenda → spiega i simboli della carta\nlinea blu → fiume\ntriangolo → cima di un monte"},"action":"Confronta le tue righe. Completa soltanto i collegamenti mancanti, senza ricopiare la pagina intera.","hint":"“Triangolo = monte” può bastare nei tuoi appunti se sai spiegare che indica la cima del monte. Chiedi chiarimento se non ricordi che cosa intendevi."},{"phase":"Prova guidata","title":"Completa le zone da usare dopo","text":["La lettura è terminata. Ora puoi aggiungere nella colonna stretta una domanda sulla funzione della legenda e una sui simboli. In basso scrivi l’idea generale in una frase."],"visual":{"type":"quote","label":"Tieni davanti le informazioni","text":"legenda → spiega i simboli della carta\nlinea blu → fiume\ntriangolo → cima di un monte"},"action":"Scrivi domande e frase finale. Poi copri solo gli appunti a destra e prova a rispondere a una domanda. Riapri la colonna per controllare.","hint":"Domanda possibile: “A che cosa serve la legenda?”. Frase finale possibile: “La legenda aiuta a capire che cosa rappresentano i simboli sulla carta”. Non serve coprire nulla se prima hai bisogno di rileggere."},{"phase":"Compito nuovo","title":"Prova con un breve contenuto di scienze","text":["Prepara una nuova pagina: “L’acqua e i suoi stati”. L’adulto leggerà il testo “Compito nuovo” nella propria guida. Questa volta decidi tu dove fare spazio agli esempi.","Dopo l’ascolto potrai chiedere i pezzi mancanti e completare domande e frase finale."],"visual":{"type":"notes","stage":"blank"},"action":"Ascolta, annota le informazioni utili, poi completa le zone “dopo”. Avanza quando vuoi confrontare il risultato.","hint":"Puoi chiedere all’adulto di leggere una frase per volta. Cerca i nomi dei tre stati dell’acqua e un esempio per ciascuno. Mantieni gli strumenti e gli aiuti di scrittura che ti servono."},{"phase":"Controllo","title":"Controlla le coppie, poi usa una domanda","text":["Nei tuoi appunti devono essere riconoscibili tre stati e i rispettivi esempi. Le domande possono chiedere gli stati dell’acqua e un esempio per ciascuno."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"solido → ghiaccio\nliquido → acqua nel bicchiere\naeriforme → vapore acqueo\n\nIn poche parole: l’acqua può presentarsi in tre stati."},"action":"Controlla che nessun esempio sia collegato allo stato sbagliato. Poi usa una tua domanda per spiegare una riga senza leggerla parola per parola.","hint":"“Aeriforme” significa che l’acqua è allo stato di gas. Se la parola è difficile, negli appunti puoi scrivere “gas → vapore acqueo” e aggiungere il termine della lezione dopo."},{"phase":"Ripresa a casa","title":"Rendi gli appunti leggibili prima di studiare","text":["Dopo la scuola, riprendi una breve parte di appunti. Chiarisci i ?, completa i collegamenti mancanti e aggiungi una o due domande utili.","Quando studi, prova a rispondere a una domanda e poi riapri gli appunti per controllare. Se non riesci, rileggi quel punto e riprova."],"visual":{"type":"list","label":"Prima, durante, dopo","items":["Prima: titolo e pagina già preparata.","Durante: ascolta un’idea, annota parole collegate e segnala i vuoti.","Dopo: chiarisci i vuoti, scrivi domande e una frase sul senso generale."]},"action":"Scegli una lezione reale per provare questo formato. Concorda con il professionista quanta parte annotare, senza pretendere subito un’ora intera.","hint":"Se ascoltare e scrivere insieme è troppo faticoso, riduci ciò che devi annotare: per esempio completa solo gli esempi in una traccia pronta. L’aiuto serve a mantenere l’ascolto, non a moltiplicare il lavoro."}],"coach":{"goal":"Insegnare separatamente selezione delle informazioni, scrittura durante l’ascolto e rielaborazione successiva. Il formato è un adattamento didattico a due colonne ispirato a Cornell, non un formato obbligatorio.","prepare":"Concordare pause e riletture. Non mostrare il testo completo allo studente prima della prova di ascolto, se l’ascolto è l’obiettivo; se la lettura di supporto è necessaria, mantenerla e documentare l’aiuto. Aprire questa guida prima della lettura o stamparla; tornando al percorso si mantiene il passaggio.","observe":"Osservare se le note conservano relazioni (nome → significato → esempio), se il ? è collocato dove serve, se le domande permettono di recuperare un’informazione. Non valutare la quantità scritta o la velocità come indicatori unici.","scripts":[{"title":"Prova guidata — parte 1","text":"La legenda di una carta geografica spiega che cosa significano i simboli usati nella carta.","instruction":"Leggere quando il ragazzo è alla schermata “Ascolta e annota la prima idea”. Fare una pausa e rileggere se richiesto."},{"title":"Prova guidata — parte 2","text":"Ci sono due simboli da ricordare. Nella carta che stiamo usando, una linea blu indica un fiume. Un triangolo indica la cima di un monte.","instruction":"Leggere alla schermata “Aggiungi gli esempi ascoltati”. Fare una pausa dopo ogni frase, poi rispondere alle richieste di chiarimento."},{"title":"Compito nuovo — scienze","text":"L’acqua può presentarsi in tre stati: solido, liquido e aeriforme. Il ghiaccio è acqua allo stato solido. L’acqua nel bicchiere è allo stato liquido. Il vapore acqueo è acqua allo stato aeriforme, cioè un gas.","instruction":"Leggere alla schermata “Prova con un breve contenuto di scienze”. Concordare pause in base al carico. Chiarire, se emerge, che il vapore acqueo come gas è invisibile: la nuvoletta visibile contiene piccole gocce."}],"adaptations":[["Scrivere mentre si ascolta — possibile difficoltà con disgrafia o disortografia","Lo studente perde la spiegazione mentre tenta di completare o correggere una parola.","Fornire una traccia parziale, ridurre le parole richieste e rimandare il controllo ortografico. Consentire i supporti consueti. Osservare se conserva più informazioni ascoltate."],["Rilettura — possibile difficoltà con dislessia","Le note molto abbreviate non risultano decifrabili dopo la lezione.","Usare abbreviazioni poche e condivise, parole complete per i termini nuovi, spaziatura ampia. Provare la rilettura subito e dopo una pausa."],["Selezione delle idee — difficoltà trasversale","Annota tutto o solo parole isolate senza collegamenti.","Modellare un’idea alla volta; usare una domanda guida e accettare anche due parole collegate. Non attribuire automaticamente questo comportamento a un DSA."],["Numeri in lezioni future — possibile difficoltà con discalculia","Dati numerici o sequenze di calcolo vengono persi durante la copia.","Fornire dati o passaggi già scritti e far annotare il significato. Questa prova non misura abilità di calcolo."]],"sources":[0,2,3,4]},"print":{"modelTitle":"Un esempio di pagina completata","visual":{"type":"notes","stage":"complete"},"model":["Durante: nella colonna larga, conserva nome, significato ed esempio.","Se manca qualcosa: scrivi ? nel punto preciso e chiedi nella pausa.","Dopo: scrivi domande nella colonna stretta e una frase sul senso generale in basso."],"practice":[["Prova guidata — La legenda","Chiedi all’adulto la lettura in due parti. Annota la funzione della legenda e i simboli con i loro significati. Poi aggiungi domande e sintesi."],["Compito nuovo — L’acqua","Chiedi all’adulto la lettura sugli stati dell’acqua. Prepara sul quaderno un’altra pagina a due colonne. Conserva stato ed esempio."]],"blankNotes":true,"answers":["Legenda → spiega i simboli; linea blu → fiume; triangolo → cima di un monte (nella carta descritta).","Acqua: solido → ghiaccio; liquido → acqua nel bicchiere; aeriforme → vapore acqueo.","Una domanda deve permettere di recuperare un’informazione: “Quali sono i tre stati dell’acqua?”."],"home":["Prepara il foglio prima della lezione.","Durante, ascolta una piccola idea e annota parole collegate.","Dopo, completa i ?, le domande e la sintesi.","A casa, prova a rispondere alle domande e controlla negli appunti."]}},{"id":"MC-01","title":"Mappa concettuale: la favola","subject":"Italiano","area":"Mappe concettuali","mapType":"Mappa concettuale","intro":"Collega idee con parole che spieghino la relazione.","slides":[{"phase":"Preparazione","title":"Una mappa per spiegare i collegamenti","text":["Una mappa concettuale mostra idee e relazioni. Le idee sono scritte nei riquadri; le parole sulle frecce spiegano come si collegano.","Costruiremo una piccola mappa sulla favola. Ti serviranno il testo, un foglio e una penna. Puoi usare un foglio in orizzontale per avere spazio."],"visual":{"type":"quote","label":"Che cosa imparerai a fare","text":"Leggere due riquadri e una freccia come una frase che ha senso."},"action":"Scrivi sul foglio “Mappa concettuale — la favola”. Lascia spazio sotto.","hint":"Un concetto è un’idea che vogliamo rappresentare, come “favola” o “personaggi”. Non serve mettere ogni parola del testo in un riquadro."},{"phase":"Preparazione","title":"Prima capiamo il testo","text":["Leggi o ascolta questo testo. La morale è l’insegnamento che una storia suggerisce sul modo di comportarsi. Può essere scritto oppure ricavato dagli eventi."],"visual":{"type":"quote","label":"Il testo di partenza","text":"La favola è un racconto breve. I personaggi sono spesso animali che parlano e si comportano come persone. La storia contiene un insegnamento sui comportamenti: questo insegnamento si chiama morale. A volte la morale è scritta chiaramente; altre volte il lettore la ricava da ciò che accade."},"action":"Indica nel testo che cosa si dice sulla lunghezza, sui personaggi e sulla morale. Per ora non disegnare i collegamenti.","hint":"“Spesso” non significa “sempre”: molte favole hanno animali come personaggi, ma non tutte. Questa differenza deve restare riconoscibile nella mappa."},{"phase":"Preparazione","title":"Scegli parole che conservano l’idea","text":["Osserva la frase “La favola è un racconto breve”. Per ricordare che tipo di testo è, teniamo “racconto”. Per ricordare la sua lunghezza, teniamo “breve”. Sono parole chiave perché ci aiutano a ricostruire l’informazione."],"visual":{"type":"quote","label":"Dalla frase alle parole utili","text":"La favola è un racconto breve.\n\nTipo di testo → racconto\nLunghezza → breve"},"action":"Scrivi “racconto breve” sul foglio. Poi prova a usarlo per dire la frase completa.","hint":"Scegliere parole chiave non vuol dire eliminare tutte le altre parole per sempre. Nella mappa concettuale useremo parole anche sulle frecce; nella mappa mentale le aggiungeremo a voce per spiegare."},{"phase":"Preparazione","title":"Distingui il gruppo dal suo dettaglio","text":["In questa frase, “personaggi” è il gruppo di cui si parla. Le parole successive dicono qualcosa di più su quel gruppo. Prima di disegnare la mappa, cerca l’informazione da conservare."],"visual":{"type":"quote","label":"La frase da esaminare","text":"I personaggi sono spesso animali che parlano e si comportano come persone."},"action":"Sul foglio scrivi “Personaggi”. Accanto, annota poche parole che dicano chi sono spesso. Tieni davanti la frase e poi avanza per controllare.","hint":"Chiediti: che tipo di personaggi descrive questa frase? C’è una parola che evita di dire “tutti” o “sempre”? Conservala nella tua nota."},{"phase":"Controllo della preparazione","title":"“Spesso animali” mantiene una precisazione","text":["Una nota possibile è “Personaggi → spesso animali”. “Personaggi” indica il gruppo; “spesso animali” aggiunge un dettaglio. La parola “spesso” conserva il significato del testo."],"visual":{"type":"quote","label":"Frase e nota","text":"I personaggi sono spesso animali che parlano e si comportano come persone.\n\nPersonaggi → spesso animali"},"action":"Confronta la tua nota. Se hai scritto solo “animali”, aggiungi “spesso”. Potrai aggiungere in seguito anche il dettaglio su come parlano e agiscono.","hint":"Non serve mettere tutte le informazioni in una sola etichetta. Puoi aggiungere un dettaglio dopo l’altro, lasciandoli collegati al gruppo a cui si riferiscono."},{"phase":"Esempio spiegato","title":"Scegliamo a quale domanda rispondere","text":["Una domanda aiuta a decidere quali informazioni mettere nella mappa. Qui vogliamo spiegare le caratteristiche generali della favola, senza raccontare una storia particolare."],"visual":{"type":"quote","label":"La domanda della nostra mappa","text":"Quali caratteristiche ha una favola?"},"action":"Scrivi questa domanda sopra lo spazio della mappa. Ti servirà per controllare se i collegamenti rispondono al compito.","hint":"Se la domanda fosse “Che cosa accade nella favola letta oggi?”, servirebbero invece gli eventi di quella storia. Prima di scegliere i riquadri, chiarisci quale domanda hai davanti."},{"phase":"Esempio spiegato","title":"Partiamo dall’idea principale","text":["Il testo comincia con “La favola è un racconto breve”. La prima idea è “favola”: sarà il punto da cui partire per leggere gli altri collegamenti."],"visual":{"type":"map","kind":"concept","stage":0},"action":"Disegna un riquadro con la parola “Favola” nella parte alta del foglio.","hint":"Un riquadro aiuta a vedere dove finisce un’idea e comincia un’altra. Basta una forma semplice: non serve decorarlo."},{"phase":"Esempio spiegato","title":"La freccia deve dire qualcosa","text":["Dal testo ricaviamo due idee, “favola” e “racconto”. La parola “è” scritta sulla freccia esprime il collegamento. Leggendo tutto otteniamo: “La favola è un racconto”."],"visual":{"type":"map","kind":"concept","stage":1},"action":"Sotto “Favola”, disegna “Racconto”. Traccia una freccia dal primo riquadro al secondo e scrivi “è” vicino alla freccia.","hint":"Una freccia senza parole non spiega se un’idea è un esempio, una parte o una causa dell’altra. Qui “è” permette di leggere una frase precisa."},{"phase":"Esempio spiegato","title":"Aggiungiamo il dettaglio “breve”","text":["La stessa frase del testo dice che il racconto è breve. Aggiungiamo questa informazione sotto “Racconto”, con un’altra freccia e un’altra parola “è”."],"visual":{"type":"map","kind":"concept","stage":2},"action":"Disegna “Breve” sotto “Racconto” e collega con “è”. Leggi: “Il racconto è breve”.","hint":"Puoi scegliere anche un solo riquadro “Racconto breve”. Qui li separiamo per imparare a esprimere una relazione. Una mappa non deve avere un numero obbligatorio di riquadri."},{"phase":"Esempio spiegato","title":"Costruiamo il ramo dei personaggi","text":["Il testo dice: “I personaggi sono spesso animali”. Dal riquadro “Favola” parte un nuovo collegamento: la favola ha personaggi. Da “Personaggi” continuiamo con “sono spesso” verso “Animali”."],"visual":{"type":"map","kind":"concept","stage":4},"action":"Aggiungi questo ramo accanto a quello sul racconto. Mantieni la parola “spesso” sulla seconda freccia.","hint":"Un ramo è una parte della mappa che parte da un punto e sviluppa un’informazione. Se scrivessimo soltanto “sono animali”, renderemmo l’affermazione troppo generale."},{"phase":"Esempio spiegato","title":"Colleghiamo morale e insegnamento","text":["La storia contiene una morale, cioè un insegnamento sui comportamenti. Aggiungiamo due relazioni: “La favola contiene una morale” e “La morale esprime un insegnamento”."],"visual":{"type":"map","kind":"concept","stage":6},"action":"Aggiungi il ramo della morale. Poi leggilo come due frasi complete.","hint":"Una morale può essere lasciata da ricavare al lettore: “contiene” non significa che nel libro ci sia sempre una frase finale già scritta. Il testo di partenza lo precisa."},{"phase":"Controllo dell’esempio","title":"Leggiamo la mappa completa","text":["Ora puoi seguire tre percorsi. Ogni volta parti da “Favola” e leggi riquadri e parole sulle frecce. La mappa riassume alcune caratteristiche: il testo resta disponibile per i dettagli."],"visual":{"type":"map","kind":"concept","stage":6},"action":"Scegli un ramo e spiegalo a voce. Controlla nel testo: “favola = racconto breve; personaggi spesso animali; morale = insegnamento sui comportamenti”.","hint":"Se riesci solo a elencare “favola, personaggi, animali”, prova a inserire le parole delle frecce: “La favola ha personaggi. I personaggi sono spesso animali”."},{"phase":"Prova guidata","title":"Ricostruisci un collegamento sul foglio","text":["Ora prova a costruire tu il ramo della morale senza copiare la mappa completa. Hai qui la frase del testo che ti serve e le idee da collegare."],"visual":{"type":"quote","label":"La frase da usare","text":"La storia contiene un insegnamento sui comportamenti: questo insegnamento si chiama morale.\n\nIdee disponibili: Favola — Morale — Insegnamento."},"action":"Su una parte libera del foglio disegna i tre riquadri. Scrivi sulle due frecce parole che permettano di leggere frasi sensate.","hint":"Puoi iniziare con “La favola contiene …”. Poi chiediti che cosa esprime la morale. Le parole-legame non devono essere indovinate a memoria: devono dire una relazione coerente con il testo."},{"phase":"Controllo guidato","title":"Controlla le tue due frasi","text":["Un possibile collegamento è questo. Se hai scritto “La favola propone una morale” oppure “La morale è un insegnamento”, discutine il significato: conta che la relazione sia chiara e coerente."],"visual":{"type":"quote","label":"Un ramo possibile","text":"Favola → contiene → Morale\nMorale → esprime → Insegnamento"},"action":"Leggi il tuo ramo, includendo le parole sulle frecce. Se una frase resta incompleta, modifica la parola-legame.","hint":"“Favola → morale → insegnamento”, senza parole sulle frecce, lascia al lettore il compito di indovinare i collegamenti. Aggiungi ciò che diresti a voce tra le idee."},{"phase":"Compito nuovo","title":"Costruisci una mappa da un testo diverso","text":["Ora cambia l’argomento. La domanda è: “Quali caratteristiche ha il racconto d’avventura?”.","Leggi il testo e scegli tre aspetti da rappresentare: impresa, protagonista e luoghi. Puoi tenere il testo davanti mentre lavori."],"visual":{"type":"quote","label":"Testo per il compito nuovo","text":"Il racconto d’avventura racconta un’impresa rischiosa. Il protagonista affronta pericoli e ostacoli. I luoghi possono essere lontani o sconosciuti. Gli eventi creano attesa: il lettore vuole scoprire come finirà l’impresa."},"action":"Scrivi in alto la domanda e disegna il primo riquadro “Racconto d’avventura”.","hint":"Un’impresa è un’azione impegnativa da portare a termine. Il protagonista è il personaggio principale. Un ostacolo è qualcosa che rende difficile proseguire."},{"phase":"Compito nuovo","title":"Ora collega le idee scelte","text":["Parti da “Racconto d’avventura” e costruisci i tre rami. Per ogni freccia, cerca parole che facciano leggere una frase completa. Aggiungi almeno un dettaglio per ramo."],"visual":{"type":"quote","label":"Tieni a disposizione il testo","text":"Il racconto d’avventura racconta un’impresa rischiosa. Il protagonista affronta pericoli e ostacoli. I luoghi possono essere lontani o sconosciuti. Gli eventi creano attesa: il lettore vuole scoprire come finirà l’impresa."},"action":"Disegna la mappa sul foglio. Quando hai finito, leggi ogni collegamento e confrontalo con il testo. Avanza per vedere un possibile controllo.","hint":"Per il primo ramo puoi chiederti: che cosa racconta il racconto d’avventura? Un’impresa. Com’è l’impresa? Rischiosa. Usa lo stesso ragionamento sugli altri due aspetti."},{"phase":"Controllo","title":"Confronta le relazioni della tua mappa","text":["Queste sono relazioni possibili, non un’unica disposizione obbligatoria. Nella tua mappa possono esserci riquadri uniti o separati, purché il significato sia chiaro."],"visual":{"type":"list","label":"Frasi da ritrovare","items":["Il racconto d’avventura racconta un’impresa rischiosa.","Il racconto d’avventura ha un protagonista che affronta pericoli e ostacoli.","Il racconto d’avventura può svolgersi in luoghi lontani o sconosciuti."]},"action":"Controlla un ramo alla volta. Conserva parole come “può”: il testo non dice che i luoghi siano sempre sconosciuti.","hint":"Per questa prova abbiamo scelto tre aspetti. Il testo parla anche dell’attesa creata dagli eventi: puoi aggiungere un quarto ramo se serve alla tua spiegazione, senza riempire la mappa di dettagli inutili."},{"phase":"Ripresa a casa","title":"Parti dalla domanda, poi costruisci un ramo","text":["Sul compito di casa scrivi prima a quale domanda vuoi rispondere. Leggi un breve tratto di testo e costruisci un ramo; poi passa al successivo.","Una mappa funziona se ti aiuta a spiegare collegamenti e a ritrovare informazioni. Se non riesci a leggerla, riduci o riorganizza quel punto."],"visual":{"type":"list","label":"Il metodo da riprendere","items":["Scegli la domanda e tieni davanti il testo.","Individua poche idee utili alla domanda.","Collegale con parole che formino frasi.","Controlla ogni relazione nel testo e prova a spiegarla."]},"action":"Prova su un breve paragrafo del tuo libro. Nel Menu trovi la scheda da stampare con esempio e traccia.","hint":"Una mappa concettuale può avere anche collegamenti tra rami diversi. Aggiungili quando sai spiegare una relazione utile: non servono per forza in una prima mappa piccola."}],"coach":{"prepare":"Tenere disponibile il testo mentre si costruisce la mappa. Leggerlo insieme e verificare “morale” come insegnamento sui comportamenti. La disposizione proposta è un esempio, non uno schema da imporre a tutti i testi.","adaptations":[["Leggere e scegliere informazioni — possibile difficoltà con dislessia","Il carico di lettura impedisce di ritrovare la frase a cui collegare un nodo.","Leggere ad alta voce o usare la sintesi vocale abituale, una frase per volta. Lasciare il testo visibile e far indicare quale informazione viene rappresentata."],["Scrivere e disporre i nodi — possibile difficoltà con disgrafia","Lo studente sa spiegare i collegamenti ma perde spazio o non riesce a rileggere le etichette.","Offrire riquadri già pronti o cartellini mobili. Chiedere allo studente di scegliere e collegare; non sostituirsi nella decisione sul significato."],["Ortografia — possibile difficoltà con disortografia","La ricerca della grafia corretta interrompe ogni scelta concettuale.","Consentire copia del termine dal testo o etichette predisposte. Controllare prima i collegamenti e poi, separatamente, l’ortografia."],["Sovraccarico visivo — difficoltà trasversale","Molti rami rendono difficile ritrovare il punto di partenza.","Costruire un ramo alla volta, distanziare le parti e verificare se lo studente riesce a spiegare un percorso. La difficoltà non implica un DSA specifico."]],"sources":[0,1,3,4],"goal":"Osservare se le parole-legame esprimono relazioni controllabili nel testo. Non confondere la qualità della mappa con la somiglianza grafica al modello.","observe":"Far leggere una proposizione completa per ramo e indicare la frase del testo che la sostiene. Il collegamento “sono spesso” conserva una qualificazione importante. La mappa semplificata non rappresenta ogni dettaglio né introduce obbligatoriamente legami trasversali."},"print":{"modelTitle":"Mappa concettuale — esempio","visual":{"type":"map","kind":"concept","stage":6},"model":["Domanda: quali caratteristiche ha una favola?","La favola è un racconto breve. I personaggi sono spesso animali che parlano e si comportano come persone. La storia contiene un insegnamento sui comportamenti: questo insegnamento si chiama morale. A volte la morale è scritta chiaramente; altre volte il lettore la ricava da ciò che accade.","Leggi ogni coppia di riquadri con la parola sulla freccia: “La favola è un racconto”. Poi: “Il racconto è breve”."],"practice":[["Prova guidata","Ricostruisci il ramo Favola — Morale — Insegnamento. Scegli parole sulle frecce che formino frasi coerenti: la favola contiene una morale, cioè un insegnamento."],["Compito nuovo","Il racconto d’avventura racconta un’impresa rischiosa. Il protagonista affronta pericoli e ostacoli. I luoghi possono essere lontani o sconosciuti. Gli eventi creano attesa: il lettore vuole scoprire come finirà l’impresa.\nDomanda: quali caratteristiche ha il racconto d’avventura? Disegna tre rami: impresa, protagonista, luoghi. Aggiungi parole-legame e dettagli."]],"answers":["Ramo guidato: Favola → contiene → Morale → esprime → Insegnamento.","Avventura: racconta un’impresa rischiosa; ha un protagonista che affronta pericoli e ostacoli; può svolgersi in luoghi lontani o sconosciuti.","Sono possibili altre disposizioni. Controlla che ogni collegamento si possa leggere come una frase e sia sostenuto dal testo."],"home":["Scrivi la domanda a cui vuoi rispondere.","Scegli idee pertinenti e collega un ramo alla volta.","Metti parole sulle frecce; conserva precisazioni come “spesso” o “può”.","Rileggi nel testo e spiega i collegamenti a voce."]}},{"id":"MM-01","title":"Mappa mentale: la favola","subject":"Italiano","area":"Mappe mentali","mapType":"Mappa mentale","intro":"Metti un tema al centro e organizza le informazioni in rami.","slides":[{"phase":"Preparazione","title":"Una mappa per organizzare le informazioni","text":["Una mappa mentale parte da un tema al centro. I rami raccolgono aspetti del tema, come cartelline in cui mettere informazioni vicine per significato.","Costruiremo una mappa sulla favola con parole brevi ma comprensibili. Prepara un foglio in orizzontale e una penna. I colori sono facoltativi."],"visual":{"type":"quote","label":"Che cosa imparerai a fare","text":"Trovare il ramo giusto e usarlo per ricordare e spiegare un’informazione."},"action":"Scrivi sul foglio “Mappa mentale — la favola” e lascia libero il centro.","hint":"Qui i rami raggruppano informazioni. Non occorre scrivere parole su ogni collegamento come nella mappa concettuale; quando spieghi, però, devi saper dire che cosa significano le parole che hai scelto."},{"phase":"Preparazione","title":"Leggiamo prima di disegnare","text":["Leggi o ascolta questo testo. La morale è l’insegnamento sui comportamenti suggerito dalla storia. Può essere dichiarato oppure lasciato da ricavare al lettore."],"visual":{"type":"quote","label":"Il testo di partenza","text":"La favola è un racconto breve. I personaggi sono spesso animali che parlano e si comportano come persone. La storia contiene un insegnamento sui comportamenti: questo insegnamento si chiama morale. A volte la morale è scritta chiaramente; altre volte il lettore la ricava da ciò che accade."},"action":"Trova nel testo un’informazione sulla storia, una sui personaggi e una sul messaggio.","hint":"Il messaggio è ciò che la storia vuole farci capire. In questo testo coincide con la morale. Prima di usare una parola nella mappa, verifica di sapere che cosa significa."},{"phase":"Preparazione","title":"Scegli parole che conservano l’idea","text":["Osserva la frase “La favola è un racconto breve”. Per ricordare che tipo di testo è, teniamo “racconto”. Per ricordare la sua lunghezza, teniamo “breve”. Sono parole chiave perché ci aiutano a ricostruire l’informazione."],"visual":{"type":"quote","label":"Dalla frase alle parole utili","text":"La favola è un racconto breve.\n\nTipo di testo → racconto\nLunghezza → breve"},"action":"Scrivi “racconto breve” sul foglio. Poi prova a usarlo per dire la frase completa.","hint":"Scegliere parole chiave non vuol dire eliminare tutte le altre parole per sempre. Nella mappa concettuale useremo parole anche sulle frecce; nella mappa mentale le aggiungeremo a voce per spiegare."},{"phase":"Preparazione","title":"Distingui il gruppo dal suo dettaglio","text":["In questa frase, “personaggi” è il gruppo di cui si parla. Le parole successive dicono qualcosa di più su quel gruppo. Prima di disegnare la mappa, cerca l’informazione da conservare."],"visual":{"type":"quote","label":"La frase da esaminare","text":"I personaggi sono spesso animali che parlano e si comportano come persone."},"action":"Sul foglio scrivi “Personaggi”. Accanto, annota poche parole che dicano chi sono spesso. Tieni davanti la frase e poi avanza per controllare.","hint":"Chiediti: che tipo di personaggi descrive questa frase? C’è una parola che evita di dire “tutti” o “sempre”? Conservala nella tua nota."},{"phase":"Controllo della preparazione","title":"“Spesso animali” mantiene una precisazione","text":["Una nota possibile è “Personaggi → spesso animali”. “Personaggi” indica il gruppo; “spesso animali” aggiunge un dettaglio. La parola “spesso” conserva il significato del testo."],"visual":{"type":"quote","label":"Frase e nota","text":"I personaggi sono spesso animali che parlano e si comportano come persone.\n\nPersonaggi → spesso animali"},"action":"Confronta la tua nota. Se hai scritto solo “animali”, aggiungi “spesso”. Potrai aggiungere in seguito anche il dettaglio su come parlano e agiscono.","hint":"Non serve mettere tutte le informazioni in una sola etichetta. Puoi aggiungere un dettaglio dopo l’altro, lasciandoli collegati al gruppo a cui si riferiscono."},{"phase":"Esempio spiegato","title":"Mettiamo il tema al centro","text":["Il tema è “Favola”. Scriviamolo al centro: da qui partiranno i rami. Il centro deve farti capire subito di che cosa parla la mappa."],"visual":{"type":"map","kind":"mental","stage":0},"action":"Scrivi “Favola” al centro del foglio e circonda la parola con una forma semplice.","hint":"Non serve un disegno elaborato. Se ti aiuta puoi aggiungere una piccola immagine, ma la parola deve restare leggibile e riconoscibile."},{"phase":"Esempio spiegato","title":"Il primo ramo raccoglie la storia","text":["Nel testo leggiamo che la favola è un racconto breve. Apriamo un ramo “Storia”: è il nome della categoria in cui metteremo le caratteristiche del racconto."],"visual":{"type":"map","kind":"mental","stage":1},"action":"Dal centro traccia una linea verso “Storia”. Lascia spazio dopo questa parola per aggiungere un dettaglio.","hint":"Una categoria è un gruppo di informazioni che hanno qualcosa in comune. “Storia” raggruppa qui le informazioni sul racconto; gli animali andranno invece nel ramo dei personaggi."},{"phase":"Esempio spiegato","title":"Aggiungiamo una parola che ci faccia ricordare","text":["Sul ramo “Storia” aggiungiamo “Breve”. È una parola chiave: poche lettere ci aiutano a ritrovare l’informazione “la favola è un racconto breve”."],"visual":{"type":"map","kind":"mental","stage":2},"action":"Aggiungi “Breve” alla fine di un piccolo ramo che parte da “Storia”. Poi spiega a voce che cosa significa.","hint":"Una parola chiave funziona se per te richiama un’informazione precisa. Se “breve” da sola non basta, puoi scrivere “racconto breve”. La mappa non deve diventare un indovinello."},{"phase":"Esempio spiegato","title":"Un secondo ramo per i personaggi","text":["Ora creiamo il ramo “Personaggi”. Il testo dice che sono spesso animali: usiamo proprio le parole “Spesso animali”, perché non tutte le favole devono avere animali."],"visual":{"type":"map","kind":"mental","stage":4},"action":"Aggiungi “Personaggi” partendo dal centro e poi il dettaglio “Spesso animali”.","hint":"Dal tema centrale partono i rami principali. I dettagli partono dal ramo a cui appartengono: “Spesso animali” deve essere vicino a “Personaggi”, non vicino a “Storia”."},{"phase":"Esempio spiegato","title":"Un terzo ramo per il messaggio","text":["Il ramo “Messaggio” raccoglie l’insegnamento della favola. Aggiungiamo “Morale”, il nome che il testo usa per quell’insegnamento."],"visual":{"type":"map","kind":"mental","stage":6},"action":"Aggiungi “Messaggio” e poi “Morale”. Spiega a voce: “La morale è l’insegnamento sui comportamenti suggerito dalla storia”.","hint":"Se il termine “morale” ti resta poco chiaro, nella tua mappa puoi scrivere “Morale: insegnamento”. Scegli parole che ti permettano di spiegare, non solo di copiare."},{"phase":"Controllo dell’esempio","title":"Usiamo la mappa completa","text":["Dal centro puoi scegliere tre rami. Per parlare della lunghezza vai a “Storia”. Per dire chi compare vai a “Personaggi”. Per spiegare l’insegnamento vai a “Messaggio”."],"visual":{"type":"map","kind":"mental","stage":6},"action":"Scegli un ramo e usalo per spiegare una caratteristica della favola. Poi controlla il significato: racconto breve; personaggi spesso animali; morale come insegnamento.","hint":"La mappa raccoglie una selezione di informazioni. Se il compito richiede anche come si ricava la morale, aggiungi un dettaglio a quel ramo usando il testo."},{"phase":"Prova guidata","title":"Scegli in quale ramo mettere un dettaglio","text":["Adesso aggiungiamo un’informazione che nel primo modello non avevamo rappresentato: nel testo gli animali parlano e si comportano come persone."],"visual":{"type":"quote","label":"Il dettaglio da collocare","text":"“I personaggi sono spesso animali che parlano e si comportano come persone”.\n\nRami disponibili: Storia — Personaggi — Messaggio."},"action":"Scegli il ramo adatto. Aggiungi sul foglio il dettaglio “Parlano e agiscono come persone” nel punto che hai scelto. Avanza per confrontarlo.","hint":"Chiediti a chi si riferisce il dettaglio. Parla degli animali che fanno da personaggi: per questo va nello stesso ramo, non in quello sulla lunghezza della storia."},{"phase":"Controllo guidato","title":"Controlla perché hai scelto quel ramo","text":["Il dettaglio appartiene ai personaggi. Una possibile organizzazione parte da “Personaggi”, continua con “Spesso animali” e aggiunge “Parlano e agiscono come persone”."],"visual":{"type":"quote","label":"Il collegamento da controllare","text":"Personaggi → Spesso animali → Parlano e agiscono come persone"},"action":"Guarda il tuo foglio e spiega perché quelle informazioni stanno insieme. Se serve, sposta il dettaglio nel ramo dei personaggi.","hint":"Non basta che una parola “stia bene” graficamente. Deve stare vicino alle informazioni a cui si riferisce, altrimenti quando studi potresti collegarla all’idea sbagliata."},{"phase":"Compito nuovo","title":"Organizza un altro argomento","text":["Ora il tema è “Racconto d’avventura”. Leggi il testo e scegli tre categorie per organizzarlo: impresa, protagonista e luoghi.","Il protagonista è il personaggio principale. Un’impresa è un’azione impegnativa da portare a termine."],"visual":{"type":"quote","label":"Testo per il compito nuovo","text":"Il racconto d’avventura racconta un’impresa rischiosa. Il protagonista affronta pericoli e ostacoli. I luoghi possono essere lontani o sconosciuti. Gli eventi creano attesa: il lettore vuole scoprire come finirà l’impresa."},"action":"Scrivi il tema al centro di un foglio nuovo. Da lì fai partire i tre rami con i nomi delle categorie.","hint":"Puoi modificare la posizione dei rami per avere spazio. La posizione sulla pagina non cambia il significato; cambierebbe invece il significato se un dettaglio finisse nella categoria sbagliata."},{"phase":"Compito nuovo","title":"Scegli dettagli che ti aiutino a spiegare","text":["Per ciascuna categoria scegli una o poche parole dal testo. Tieni le precisazioni che evitano errori: i luoghi possono essere lontani o sconosciuti, non lo sono obbligatoriamente."],"visual":{"type":"quote","label":"Tieni davanti il testo","text":"Il racconto d’avventura racconta un’impresa rischiosa. Il protagonista affronta pericoli e ostacoli. I luoghi possono essere lontani o sconosciuti. Gli eventi creano attesa: il lettore vuole scoprire come finirà l’impresa."},"action":"Aggiungi almeno un dettaglio per ramo e prova a spiegare la mappa. Avanza quando vuoi confrontare l’organizzazione.","hint":"Per “Impresa” puoi scegliere “rischiosa”. Cerca poi che cosa fa il protagonista e quali caratteristiche possono avere i luoghi."},{"phase":"Controllo","title":"Confronta i gruppi di informazioni","text":["Questa è un’organizzazione possibile. La tua può avere altre parole o una disposizione diversa: controlla che tu riesca a ritrovare le informazioni del testo."],"visual":{"type":"list","label":"Tre rami possibili","items":["Impresa → rischiosa.","Protagonista → affronta pericoli e ostacoli.","Luoghi → possono essere lontani o sconosciuti."]},"action":"Scegli una tua parola chiave e spiega l’intera informazione che richiama. Se non ci riesci, rendi l’etichetta più chiara.","hint":"Il testo dice anche che gli eventi creano attesa. Se serve al tuo compito, puoi aggiungere un ramo “Eventi” con “creano attesa”. Non è necessario far entrare tutto in tre rami."},{"phase":"Ripresa a casa","title":"Controlla se la mappa ti fa ritrovare le idee","text":["A casa comincia da un testo breve e tienilo davanti. Scrivi il tema al centro, scegli i rami e aggiungi i dettagli uno alla volta.","Poi usa la mappa per spiegare. Se una parola non ti ricorda niente, riaprila al testo e sostituiscila con una più chiara."],"visual":{"type":"list","label":"Il tuo promemoria","items":["Tema al centro.","Un ramo per ciascun aspetto scelto.","Dettagli vicino all’aspetto a cui si riferiscono.","Una spiegazione a voce per controllare se le parole aiutano."]},"action":"Prova con un breve paragrafo del tuo libro. Nel Menu puoi stampare esempio, prova e promemoria per casa.","hint":"Colori e piccoli disegni possono aiutare a distinguere i rami, ma non sono obbligatori. Prima controlla significato e leggibilità: la mappa deve servirti per studiare."}],"coach":{"prepare":"Tenere disponibile il testo mentre si costruisce la mappa. Leggerlo insieme e verificare “morale” come insegnamento sui comportamenti. La disposizione proposta è un esempio, non uno schema da imporre a tutti i testi.","adaptations":[["Leggere e scegliere informazioni — possibile difficoltà con dislessia","Il carico di lettura impedisce di ritrovare la frase a cui collegare un nodo.","Leggere ad alta voce o usare la sintesi vocale abituale, una frase per volta. Lasciare il testo visibile e far indicare quale informazione viene rappresentata."],["Scrivere e disporre i nodi — possibile difficoltà con disgrafia","Lo studente sa spiegare i collegamenti ma perde spazio o non riesce a rileggere
