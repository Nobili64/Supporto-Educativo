a scrittura.","adaptations":[["Scrivere il riassunto — possibile difficoltà con disgrafia o disortografia","Perde eventi durante la stesura lunga o riduce il testo per evitare di scrivere.","Tenere visibili gli appunti con una riga per parte e scrivere una frase alla volta; consentire dettatura o videoscrittura. Verificare se tutti i fatti principali restano presenti."],["Lettura del testo — possibile difficoltà con dislessia","Il testo è letto con fatica e la storia non è chiara prima di riassumere.","Leggere il testo ad alta voce o con la sintesi vocale e chiedere il racconto orale in una frase prima di dividerlo. Osservare se la divisione in parti diventa più sicura."],["Tenere insieme la storia — difficoltà trasversale (memoria di lavoro)","Scrive le prime frasi con cura e dimentica il finale.","Scrivere prima tutti gli appunti, poi le frasi; spuntare ogni appunto usato. Osservare se il riassunto arriva fino al finale."]],"sources":["ies2007","eef2025","w3c-coga","aiddsa","ciu"],"checks":"Testi originali. Verificate le trasformazioni in discorso indiretto (“Non aspettarmi!” → gli disse di non aspettarlo; “È salatissimo!” → si accorse che era salatissimo; “restate fermi e fischiate” → il consiglio di restare ferma e fischiare) e la coerenza tra desiderio (primi dieci) e risultato (quindicesimo)."},"print":{"modelTitle":"Riassunto commentato","model":["Era il giorno della corsa campestre. Giorgio si era allenato per un mese e voleva arrivare tra i primi dieci. Dopo la partenza, però, una scarpa gli si slacciò e lui cadde nel fango. Un ragazzo di un’altra scuola si fermò e lo aiutò a rialzarsi. “Grazie! Corri, non aspettarmi!” gli disse Giorgio. Giorgio si allacciò la scarpa e ripartì. Arrivò quindicesimo, tutto sporco di fango. Al traguardo cercò il ragazzo che lo aveva aiutato e gli strinse la mano.","1. Divido in quattro parti: la gara, la caduta, l’arrivo, il saluto.","2. Fatti principali: vuole arrivare tra i primi dieci; cade, un ragazzo lo aiuta; arriva quindicesimo; gli stringe la mano.","3. Lascio i dettagli: allenamento di un mese, scarpa allacciata, fango sui vestiti.","4. Trasformo la battuta: Giorgio lo ringraziò.","5. Riassunto: Giorgio partecipò a una corsa campestre: voleva arrivare tra i primi dieci. Durante la gara gli si slacciò una scarpa e lui cadde nel fango, ma un ragazzo di un’altra scuola lo aiutò a rialzarsi. Giorgio lo ringraziò, ripartì e arrivò quindicesimo. Al traguardo cercò il ragazzo e gli strinse la mano."],"practice":[["Prova guidata","Sofia voleva preparare una torta per la festa di classe. Seguì la ricetta della nonna, ma per sbaglio mise il sale al posto dello zucchero. Quando assaggiò l’impasto, fece una smorfia. “È salatissimo!” esclamò. Non c’era più tempo per rifare la torta. Allora Sofia comprò della frutta e preparò una macedonia. A scuola la macedonia finì in pochi minuti.\nDividi in parti, scrivi i fatti principali, poi il riassunto in tre o quattro frasi."],["Compito nuovo","Durante la gita in montagna, Alice si allontanò dal gruppo per fotografare una marmotta. Quando si voltò, non vide più nessuno. Per un attimo ebbe paura. Poi ricordò il consiglio della guida: “Se vi perdete, restate fermi e fischiate”. Alice si sedette su un sasso e soffiò nel fischietto che aveva al collo. Dopo pochi minuti arrivò la guida, seguita dai compagni. Da quel giorno, nelle gite, Alice restò sempre vicina al gruppo.\nScrivi il riassunto in quattro frasi al massimo."]],"answers":["Sofia voleva preparare una torta per la festa di classe, ma per sbaglio mise il sale al posto dello zucchero. Assaggiando l’impasto, si accorse che era salatissimo. Non c’era tempo per rifare la torta, perciò preparò una macedonia. A scuola la macedonia finì in pochi minuti.","Durante una gita in montagna, Alice si allontanò dal gruppo per fotografare una marmotta e si perse. Ricordò il consiglio della guida di restare ferma e fischiare, e soffiò nel suo fischietto. Dopo pochi minuti la guida e i compagni la ritrovarono. Da allora, nelle gite, Alice restò sempre vicina al gruppo.","Sono possibili parole diverse. Controlla: stessi fatti, stesso ordine, nessuna battuta tra virgolette, nessuna aggiunta."],"home":["Leggi tutto il testo e dividilo in parti.","Scrivi il fatto principale di ogni parte.","Lascia i dettagli e trasforma le battute.","Scrivi le frasi e collegale.","Confronta con il testo e togli le aggiunte."]},"maps":{},"kind":"task","subject":"Italiano","area":"Antologia e comprensione"},{"id":"M01-10","title":"Raccontare a voce una storia","intro":"Prepara una scaletta di parole chiave e racconta una storia in ordine, perché chi ascolta capisca.","slides":[{"phase":"Preparazione","title":"Raccontare a chi non conosce la storia","text":["Quando racconti una storia a voce, chi ascolta non l’ha letta. Deve capire chi è il personaggio, quale problema ha e come finisce.","Imparerai a preparare una scaletta e a raccontare seguendola, con parole tue."],"visual":{"type":"list","label":"Prepara","items":["La storia da raccontare","Un foglio piccolo o alcuni cartoncini","Una matita","Una persona che ascolti"]},"action":"Chiedi a chi ti accompagna di fare da ascoltatore. Prepara il foglio per la scaletta.","hint":"Raccontare una storia è utile anche a scuola. Ti aiuta nelle interrogazioni, quando devi esporre un argomento in ordine e con parole tue."},{"phase":"Preparazione","title":"La scaletta: poche parole, in ordine","text":["Una scaletta è un elenco numerato di parole chiave, nell’ordine della storia. Una parola chiave è una parola che ti fa tornare in mente un fatto.","Nella scaletta non scrivi frasi intere. Guardi una parola, ricordi il fatto e lo racconti con parole tue."],"visual":{"type":"list","label":"Esempio: la mia mattina","items":["1. sveglia","2. colazione","3. autobus","4. scuola"]},"action":"Prova: scrivi una scaletta di quattro parole su ciò che hai fatto stamattina. Poi racconta a voce guardando solo la scaletta.","hint":"Con frasi intere ti verrebbe voglia di leggerle. Ma leggere non è raccontare. Le parole chiave ti lasciano libero di parlare e ti aiutano a non perdere il filo."},{"phase":"Esempio spiegato","title":"Leggi la storia e trova i punti importanti","text":["Ecco la storia dell’esempio. Leggila e cerca tre cose: chi è il protagonista, quale problema ha, come finisce.","L’appello è il momento in cui l’insegnante legge i nomi degli alunni, per vedere chi c’è."],"visual":{"type":"quote","label":"La storia dell’esempio","text":"Il primo giorno di scuola, Kevin entrò nell’aula sbagliata. Non se ne accorse: si sedette all’ultimo banco e aspettò. Quando l’insegnante fece l’appello, Kevin non sentì il suo nome. Allora alzò la mano e mostrò il foglio con il numero della sua aula. L’insegnante sorrise: “La tua classe è la porta accanto”. Kevin la raggiunse proprio mentre cominciava la prima lezione."},"action":"Leggi o ascolta la storia. Poi rispondi a voce: chi è il protagonista? Quale problema ha? Come finisce?","hint":"Il protagonista è Kevin. Il problema è l’aula sbagliata. Alla fine Kevin arriva nella sua classe in tempo. Se hai capito questi tre punti, puoi preparare la scaletta."},{"phase":"Esempio spiegato","title":"Scrivi la scaletta","text":["Ora scriviamo la scaletta. Per ogni fatto importante scegliamo una o due parole chiave. Le numeriamo nell’ordine della storia.","Cinque punti bastano per una storia breve."],"visual":{"type":"list","label":"La scaletta della storia","items":["1. primo giorno – aula sbagliata","2. appello – nome assente","3. mano alzata – foglio","4. “porta accanto”","5. arriva in tempo"]},"action":"Scrivi questa scaletta sul tuo foglio o su cinque cartoncini, uno per punto.","hint":"Se scrivere è faticoso, puoi fare un piccolo disegno per ogni punto: una porta, una mano alzata, un orologio. Conta che il segno ti ricordi il fatto."},{"phase":"Esempio spiegato","title":"Comincia presentando il personaggio","text":["Chi ascolta non sa chi è Kevin. Per questo la prima frase dice chi è e dove si trova.","Usa il nome del personaggio prima di dire “lui” o “lei”. Se cominci con “lui”, chi ascolta si chiede: “Lui chi?”."],"visual":{"type":"quote","label":"Due inizi a confronto","text":"Inizio poco chiaro: “Lui entra in un’aula e si siede…”\n\nInizio chiaro: “Questa storia parla di Kevin, un ragazzo al suo primo giorno di scuola.”"},"action":"Di’ a voce la prima frase del racconto, presentando Kevin. Puoi usare l’inizio chiaro o parole tue.","hint":"Un buon inizio risponde a due domande: chi? e dove, o quando? Per esempio: “C’era una volta…”, “Un giorno…”, “Questa storia parla di…”."},{"phase":"Esempio spiegato","title":"Collega i fatti con le parole-legame","text":["Le parole-legame uniscono un fatto al successivo. Aiutano chi ascolta a seguire l’ordine e a capire perché succedono le cose.","Scegli il tempo del racconto, presente o passato, e usa sempre quello."],"visual":{"type":"table","label":"Parole-legame","columns":["Parola","Quando usarla"],"rows":[["All’inizio","Per il primo fatto"],["Poi","Per il fatto che viene dopo"],["Ma","Quando arriva un problema o una sorpresa"],["Allora","Quando un personaggio reagisce"],["Così","Per una conseguenza"],["Alla fine","Per l’ultimo fatto"]]},"action":"Accanto a ogni punto della scaletta scrivi una parola-legame. Per esempio: “1. All’inizio”, “3. Allora”.","hint":"Senza parole-legame il racconto diventa un elenco: “Entra. Si siede. Fanno l’appello”. Con le parole-legame diventa una storia: “All’inizio entra… Poi l’insegnante fa l’appello…”."},{"phase":"Esempio spiegato","title":"Ascolta un racconto completo","text":["Ecco come può suonare il racconto, seguendo la scaletta. Le parole-legame sono quelle all’inizio delle frasi. Non devi impararlo a memoria: ognuno racconta con parole proprie."],"visual":{"type":"quote","label":"Un racconto possibile","text":"Questa storia parla di Kevin, un ragazzo al primo giorno di scuola. All’inizio Kevin entra nell’aula sbagliata, ma non se ne accorge. Poi l’insegnante fa l’appello e Kevin non sente il suo nome. Allora alza la mano e mostra il foglio con il numero della sua aula. L’insegnante gli dice che la sua classe è la porta accanto. Così, alla fine, Kevin arriva nella sua classe proprio in tempo per la prima lezione."},"action":"Leggi a voce questo racconto. Mentre leggi, segui con il dito i punti della scaletta.","hint":"Nota che la battuta dell’insegnante è raccontata senza virgolette: “gli dice che la sua classe è la porta accanto”. Raccontando, è più facile così."},{"phase":"Controllo dell’esempio","title":"Racconta tu e chiedi a chi ascolta","text":["Ora racconta tu la storia di Kevin, guardando solo la scaletta. Poi chi ascolta risponde a tre domande. Se risponde bene, il racconto era chiaro."],"visual":{"type":"list","label":"Domande per chi ascolta","items":["Chi è il protagonista?","Qual era il problema?","Come finisce la storia?"]},"action":"Racconta la storia a chi ti accompagna. Poi fai le tre domande. Se una risposta manca, racconta di nuovo solo quella parte.","hint":"Se ti blocchi, non ricominciare da capo. Guarda il numero della scaletta in cui sei arrivato e riparti da lì. Puoi dire: “Allora…” e prendere un attimo per pensare."},{"phase":"Prova guidata","title":"Prova tu: prepara la scaletta","text":["Ora prepara tu la scaletta per una storia nuova. Prima trova protagonista, problema e finale. Poi scegli cinque punti con poche parole ciascuno."],"visual":{"type":"quote","label":"La tua storia","text":"Durante una partita al parco, il pallone di Lucia finì tra i rami di un albero. Lucia e i suoi amici provarono a farlo cadere lanciando una scarpa. Ma anche la scarpa rimase impigliata tra i rami! Allora chiamarono il giardiniere del parco. Lui prese una scala lunga e recuperò il pallone e la scarpa. La partita ricominciò tra le risate."},"action":"Scrivi la scaletta con cinque punti numerati. Accanto a ogni punto aggiungi una parola-legame. Poi vai avanti per confrontare.","hint":"Impigliata vuol dire bloccata, incastrata. Questa storia ha due problemi: prima il pallone, poi anche la scarpa. Mettili tutti e due nella scaletta."},{"phase":"Controllo guidato","title":"Confronta la scaletta, poi racconta","text":["Ecco una scaletta possibile. Le tue parole possono essere diverse. Controlla che ci siano tutti e due i problemi e il finale.","Poi racconta la storia a chi ti accompagna, guardando solo la tua scaletta."],"visual":{"type":"list","label":"Una scaletta possibile","items":["1. All’inizio: partita – pallone sull’albero","2. Poi: scarpa lanciata","3. Ma: anche la scarpa bloccata","4. Allora: giardiniere – scala","5. Alla fine: tutto recuperato – partita"]},"action":"Correggi la tua scaletta se serve. Poi racconta e fai a chi ascolta le tre domande: protagonista, problema, finale.","hint":"Ricorda di presentare Lucia all’inizio: “Questa storia parla di Lucia, che gioca a pallone al parco con gli amici”. La scarpa che resta sull’albero è la parte divertente: falla capire bene."},{"phase":"Compito nuovo","title":"Ascolta una storia e raccontala","text":["Questa volta non leggi la storia: la ascolti. Chi ti accompagna trova il testo nel Menu → Guida per il professionista.","Puoi chiedere di ascoltarla due volte. Durante l’ascolto o subito dopo, scrivi la scaletta. Poi racconta la storia."],"visual":{"type":"list","label":"I passaggi","items":["Ascolta la storia una prima volta.","Alla seconda volta, scrivi le parole chiave.","Metti in ordine la scaletta e aggiungi le parole-legame.","Racconta e fai le tre domande a chi ascolta."]},"action":"Chiedi a chi ti accompagna di leggere la storia. Prepara la scaletta e racconta. Poi vai avanti per confrontare.","hint":"Durante l’ascolto pensa alle tre domande: chi è il protagonista? Quale problema ha? Come finisce? Un abbonamento è un biglietto che vale per molti viaggi."},{"phase":"Controllo","title":"Confronta la tua scaletta","text":["Ecco la storia che hai ascoltato e una scaletta possibile. Nella tua scaletta controlla due cose. C’è il problema? Giulio ha dimenticato l’abbonamento. C’è la soluzione? L’autista riapre le porte."],"visual":{"type":"quote","label":"La storia e una scaletta possibile","text":"Una mattina d’inverno Giulio aspettava l’autobus per andare a scuola. Mentre aspettava, controllò lo zaino: l’abbonamento non c’era. L’aveva lasciato sul tavolo della cucina. Giulio corse a casa, prese l’abbonamento e tornò di corsa alla fermata. L’autobus stava ripartendo, ma l’autista lo vide nello specchietto e riaprì le porte. Giulio salì senza fiato e ringraziò l’autista.\n\n1. fermata – abbonamento dimenticato\n2. corsa a casa\n3. autobus che riparte\n4. autista – porte riaperte\n5. ringrazia"},"action":"Confronta la tua scaletta con questa. Se manca un punto, aggiungilo e racconta di nuovo solo quella parte.","hint":"Se nel racconto hai saltato il motivo della corsa a casa, chi ascolta non capisce perché Giulio torna indietro. Il problema va sempre detto prima della soluzione."},{"phase":"Controllo","title":"Un errore da riconoscere: chi fa che cosa?","text":["Quando parli in fretta, puoi confondere chi fa un’azione. Per esempio: “L’autista aveva dimenticato l’abbonamento”. Ma è Giulio che l’ha dimenticato.","Per evitarlo, ripeti il nome del personaggio quando cambia chi agisce."],"visual":{"type":"quote","label":"Da correggere","text":"Confuso: “Lui corre a casa, poi lui lo vede e lui riapre le porte.”\n\nChiaro: “Giulio corre a casa. Poi l’autista lo vede nello specchietto e riapre le porte.”"},"action":"Racconta di nuovo la parte finale della storia di Giulio. Usa il nome “Giulio” e la parola “l’autista” ogni volta che cambia chi agisce.","hint":"Chi ascolta non vede la storia: vede solo le parole che dici. Se due personaggi sono uomini, “lui” può voler dire tutti e due. Il nome toglie il dubbio."},{"phase":"Ripresa a casa","title":"Usa la scaletta per raccontare e ripetere","text":["A casa prova a raccontare un brano del libro di lettura a una persona di famiglia. Prepara prima la scaletta.","La scaletta funziona anche per studiare: prima di un’interrogazione, scrivi i punti dell’argomento in ordine e ripetili a voce."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Trova protagonista, problema e finale.","Scrivi una scaletta di cinque punti con parole chiave.","Aggiungi una parola-legame a ogni punto.","Comincia presentando il personaggio.","Racconta e chiedi a chi ascolta: chi, quale problema, come finisce?"]},"action":"Scegli un racconto breve del tuo libro e prova la sequenza con una persona di casa. Nel Menu trovi la scheda da stampare.","hint":"Se ti blocchi spesso, usa cartoncini: uno per punto. Quando hai raccontato un punto, giri il cartoncino. Così sai sempre dove sei arrivato."}],"coach":{"goal":"Insegnare a preparare una scaletta di parole chiave e a raccontare oralmente una vicenda in ordine comprensibile: presentazione del personaggio, problema, eventi collegati da parole-legame, finale. Valutare ordine, collegamenti e comprensibilità per chi ascolta, non la ripetizione del modello.","prepare":"Leggere in anticipo il testo per il compito nuovo, che lo studente non deve vedere prima dell’ascolto. Preparare cartoncini bianchi per la scaletta. Concordare che l’adulto risponda alle tre domande dopo ogni racconto solo in base a ciò che ha ascoltato.","observe":"Osservare se il racconto comincia presentando il personaggio, se il problema precede la soluzione, se i pronomi hanno un riferimento chiaro. Distinguere la difficoltà di recupero delle parole (pause, giri di parole) dalla difficoltà di ordine degli eventi. Annotare se la scaletta permette di riprendere dopo un blocco senza ricominciare.","scripts":[{"title":"Compito nuovo — la storia di Giulio","text":"Una mattina d’inverno Giulio aspettava l’autobus per andare a scuola. Mentre aspettava, controllò lo zaino: l’abbonamento non c’era. L’aveva lasciato sul tavolo della cucina. Giulio corse a casa, prese l’abbonamento e tornò di corsa alla fermata. L’autobus stava ripartendo, ma l’autista lo vide nello specchietto e riaprì le porte. Giulio salì senza fiato e ringraziò l’autista.","instruction":"Leggere quando lo studente è alla schermata “Ascolta una storia e raccontala”, a velocità normale e con una breve pausa tra le frasi. Rileggere una seconda volta se richiesto. Dopo il racconto rispondere alle tre domande (protagonista, problema, finale) solo in base a ciò che si è ascoltato."}],"adaptations":[["Raccontare seguendo l’ordine — difficoltà trasversale (memoria e organizzazione)","Si blocca e ricomincia dall’inizio a ogni esitazione.","Usare cinque cartoncini con parole chiave, da girare dopo ogni evento raccontato. Verificare se riprende dal punto interrotto senza ricominciare."],["Leggere la storia di partenza — possibile difficoltà con dislessia","La lettura assorbe l’attenzione e la storia non resta in mente.","Proporre la storia in ascolto (adulto o sintesi vocale) anche negli esempi. Osservare se protagonista, problema e finale vengono individuati più facilmente."],["Scrivere la scaletta — possibile difficoltà con disgrafia o disortografia","La scrittura delle parole chiave richiede troppo tempo durante l’ascolto.","Accettare disegni, sigle personali o parole chiave dettate all’adulto. Controllare che la scaletta permetta il recupero, non la sua correttezza ortografica."],["Trovare le parole mentre si parla — possibile difficoltà con dislessia","Pause lunghe, parole generiche (“quella cosa”), frasi lasciate a metà.","Concordare parole-legame da usare come “ponte” mentre si cerca la parola; accettare giri di parole. Valutare la chiarezza della storia, non la scelta lessicale."]],"sources":["ies2007","dunlosky2013","w3c-coga","aiddsa"],"checks":"Testi originali. Verificata la coerenza della storia del compito nuovo: Giulio scopre la mancanza dell’abbonamento prima dell’arrivo dell’autobus, torna a casa e rientra mentre l’autobus riparte."},"print":{"modelTitle":"Scaletta e racconto — esempio","model":["Il primo giorno di scuola, Kevin entrò nell’aula sbagliata. Non se ne accorse: si sedette all’ultimo banco e aspettò. Quando l’insegnante fece l’appello, Kevin non sentì il suo nome. Allora alzò la mano e mostrò il foglio con il numero della sua aula. L’insegnante sorrise: “La tua classe è la porta accanto”. Kevin la raggiunse proprio mentre cominciava la prima lezione.","Scaletta: 1. All’inizio: primo giorno – aula sbagliata. 2. Poi: appello – nome assente. 3. Allora: mano alzata – foglio. 4. “Porta accanto”. 5. Alla fine: arriva in tempo.","Prima frase: “Questa storia parla di Kevin, un ragazzo al primo giorno di scuola.”","Racconto: All’inizio Kevin entra nell’aula sbagliata, ma non se ne accorge. Poi l’insegnante fa l’appello e Kevin non sente il suo nome. Allora alza la mano e mostra il foglio. L’insegnante gli dice che la sua classe è la porta accanto. Così, alla fine, Kevin arriva in tempo per la prima lezione.","Controllo: chi ascolta sa dire chi è il protagonista, qual era il problema e come finisce."],"practice":[["Prova guidata","Durante una partita al parco, il pallone di Lucia finì tra i rami di un albero. Lucia e i suoi amici provarono a farlo cadere lanciando una scarpa. Ma anche la scarpa rimase impigliata tra i rami! Allora chiamarono il giardiniere del parco. Lui prese una scala lunga e recuperò il pallone e la scarpa. La partita ricominciò tra le risate.\nScrivi una scaletta di cinque punti con le parole-legame. Poi racconta la storia a voce."],["Compito nuovo","Chiedi a chi ti accompagna di leggere la storia di Giulio. Ascoltala, anche due volte. Scrivi la scaletta, poi racconta la storia e fai le tre domande a chi ascolta."]],"answers":["Lucia: 1. All’inizio: partita – pallone sull’albero. 2. Poi: scarpa lanciata. 3. Ma: anche la scarpa bloccata. 4. Allora: giardiniere – scala. 5. Alla fine: tutto recuperato – partita.","Giulio: 1. fermata – abbonamento dimenticato. 2. corsa a casa. 3. autobus che riparte. 4. autista – porte riaperte. 5. ringrazia.","Un racconto è chiaro se comincia presentando il personaggio, dice il problema prima della soluzione e usa i nomi quando cambia chi agisce."],"home":["Trova protagonista, problema e finale.","Scrivi una scaletta di cinque parole chiave.","Aggiungi le parole-legame.","Comincia presentando il personaggio.","Racconta e chiedi a chi ascolta che cosa ha capito."]},"maps":{},"kind":"task","subject":"Italiano","area":"Antologia e comprensione"},{"id":"M01-11","title":"Cambiare finale, narratore o forma di un racconto","intro":"Riscrivi un racconto cambiando solo ciò che chiede la consegna e tenendo uguale il resto.","slides":[{"phase":"Preparazione","title":"Riscrivere un racconto seguendo una regola","text":["A volte la consegna chiede di trasformare un racconto. La consegna è la richiesta dell’esercizio. Devi riscrivere la storia cambiando una sola cosa: il finale, chi racconta oppure la forma del testo.","Il resto deve restare uguale. Per ricordarlo userai un foglio diviso in due colonne."],"visual":{"type":"list","label":"Prepara","items":["Il racconto da trasformare","La consegna dell’insegnante","Un foglio e una penna"]},"action":"Dividi il foglio in due colonne con una linea. Scrivi in alto a sinistra “Cambia” e a destra “Resta uguale”.","hint":"Una consegna può essere: “Riscrivi il racconto con un altro finale”. Le due colonne ti aiutano a ricordare che cosa puoi toccare e che cosa devi lasciare com’è."},{"phase":"Preparazione","title":"Tre richieste diverse","text":["Il narratore è chi racconta la storia. In prima persona dice “io”: “Io aprii la porta”. In terza persona parla di un altro: “Lei aprì la porta”.","La forma è il tipo di testo: un racconto, un dialogo, un diario, una lettera."],"visual":{"type":"table","label":"Che cosa può chiedere la consegna","columns":["Consegna","Che cosa cambia"],"rows":[["Finale","come finisce la storia"],["Narratore","chi racconta: io, oppure lui o lei"],["Forma","il tipo di testo, per esempio un dialogo"]]},"action":"Leggi la tabella una riga alla volta. Per ogni riga, ripeti a voce che cosa cambia.","hint":"Pensa a un film. Un altro finale vuol dire che la storia finisce in un altro modo. Un altro narratore vuol dire che la stessa storia la racconta un’altra persona."},{"phase":"Esempio spiegato","title":"Leggiamo il racconto di partenza","text":["Ecco il racconto che useremo come esempio. Prima di cambiarlo, capiamo chi racconta.","Il testo dice “Giulia salì”, non “io salii”. Chi racconta parla di Giulia come di un’altra persona. È un narratore in terza persona."],"visual":{"type":"quote","label":"Racconto di partenza","text":"Giulia salì sul treno per andare dalla nonna. Si sedette vicino al finestrino e aprì il suo quaderno di disegni. Quando scese alla stazione, si accorse che il quaderno non c’era più."},"action":"Leggi o ascolta il racconto. Sottolinea il nome Giulia e le parole “si” e “suo”, che parlano di lei.","hint":"Per capire chi racconta, cerca le parole “io”, “mi”, “mio”. Qui non ci sono. Ci sono invece il nome Giulia e le parole “si” e “suo”: il narratore parla di lei."},{"phase":"Esempio spiegato","title":"Scriviamo che cosa cambia e che cosa resta","text":["La consegna è: “Riscrivi il racconto come se fosse Giulia a raccontare”. Quindi cambia il narratore: ora Giulia dice “io”.","I fatti invece restano uguali: il treno, la nonna, il quaderno e il finale con il quaderno sparito."],"visual":{"type":"table","label":"Le due colonne","columns":["Colonna","Che cosa scrivo"],"rows":[["Cambia","chi racconta: Giulia, con “io”"],["Resta uguale","treno, nonna, finestrino, quaderno sparito"]]},"action":"Copia queste parole nelle due colonne del tuo foglio.","hint":"Chiediti: che cosa chiede la consegna? Solo quello va nella colonna “Cambia”. Le persone, i luoghi e le cose che succedono vanno in “Resta uguale”."},{"phase":"Esempio spiegato","title":"Trasformiamo la prima frase","text":["Ora è Giulia a raccontare. Di solito chi parla di sé non dice il proprio nome: dice “io”. Per questo il nome Giulia sparisce.","Il verbo “salì” diventa “salii”: è la forma che usiamo con “io”. Il resto della frase non cambia."],"visual":{"type":"quote","label":"Prima e dopo","text":"Giulia salì sul treno per andare dalla nonna.\n\nSalii sul treno per andare dalla nonna."},"action":"Scrivi la nuova frase sul foglio. Per controllare il verbo, mettici davanti “io”: “io salii”.","hint":"Se non sei sicuro della forma del verbo, prova con un verbo che conosci bene: lei andò, io andai. Allo stesso modo: lei salì, io salii. Puoi usare la tabella dei verbi."},{"phase":"Esempio spiegato","title":"Trasformiamo la seconda frase","text":["Qui cambiano quattro parole. “Si” diventa “mi” e “suo” diventa “mio”. I due verbi passano alla forma con “io”: “sedette” diventa “sedetti”, “aprì” diventa “aprii”."],"visual":{"type":"table","label":"Seconda frase: le parole che cambiano","columns":["Prima (lei)","Dopo (io)"],"rows":[["si sedette","mi sedetti"],["aprì","aprii"],["il suo quaderno","il mio quaderno"]]},"action":"Scrivi sul foglio: “Mi sedetti vicino al finestrino e aprii il mio quaderno di disegni”. Cerchia le quattro parole cambiate.","hint":"“Aprii” si scrive con due i. È come “dormii” e “sentii”: con “io”, questi verbi finiscono in “ii”. Se hai scritto una sola i, rileggi con “io” davanti."},{"phase":"Esempio spiegato","title":"Trasformiamo la terza frase","text":["“Scese” diventa “scesi” e “si accorse” diventa “mi accorsi”. La parte “il quaderno non c’era più” resta identica: parla del quaderno, non di Giulia.","Anche il finale resta lo stesso. Abbiamo cambiato chi racconta, non quello che succede."],"visual":{"type":"quote","label":"Prima e dopo","text":"Quando scese alla stazione, si accorse che il quaderno non c’era più.\n\nQuando scesi alla stazione, mi accorsi che il quaderno non c’era più."},"action":"Scrivi la terza frase sul foglio. Guarda la colonna “Resta uguale”: il quaderno è ancora sparito?","hint":"Davanti a ogni verbo chiediti: chi fa questa azione? Se la fa Giulia, il verbo cambia. Se il verbo parla di un’altra cosa, come il quaderno, resta uguale."},{"phase":"Esempio spiegato","title":"Confrontiamo la versione nuova","text":["Ora leggiamo la versione nuova intera. Usiamo le due colonne per controllare.","Cerca le parole che parlano ancora di Giulia come di un’altra persona: il nome “Giulia”, “si”, “suo”, verbi come “salì”. Se ne trovi una, cambiala."],"visual":{"type":"quote","label":"La versione nuova","text":"Salii sul treno per andare dalla nonna. Mi sedetti vicino al finestrino e aprii il mio quaderno di disegni. Quando scesi alla stazione, mi accorsi che il quaderno non c’era più."},"action":"Rileggi la tua versione. Fai una spunta su ogni parola della colonna “Resta uguale” che ritrovi.","hint":"Leggi la tua versione ad alta voce, oppure chiedi a qualcuno di leggerla. Se senti “io” in una frase e “lei” in quella dopo, c’è un verbo da sistemare."},{"phase":"Esempio spiegato","title":"Se la consegna chiede un altro finale","text":["Con un altro finale le colonne cambiano. In “Cambia” va solo la fine della storia. In “Resta uguale” vanno i personaggi, i luoghi e le prime frasi.","Il nuovo finale ha bisogno di una ragione: il lettore deve capire come è successo."],"visual":{"type":"quote","label":"Stesso inizio, nuovo finale","text":"Giulia salì sul treno per andare dalla nonna. Si sedette vicino al finestrino e aprì il suo quaderno di disegni.\n\nNuovo finale: Quando scese alla stazione, un controllore la chiamò. Aveva trovato il quaderno sul sedile e glielo restituì."},"action":"Trova nel nuovo finale la ragione per cui Giulia riavrà il quaderno. Sottolineala.","hint":"Un finale senza ragione sarebbe: “Il quaderno tornò da solo”. Il lettore non capirebbe come. Il controllore che trova il quaderno spiega come torna a Giulia."},{"phase":"Esempio spiegato","title":"Se la consegna chiede un dialogo","text":["Un dialogo è fatto di battute: le parole dette dai personaggi, tra virgolette. Accanto si scrive chi parla, con verbi come “disse” o “chiese”.","In “Cambia” va la forma: da racconto a dialogo. In “Resta uguale” vanno i fatti. Qui Giulia li racconta alla nonna."],"visual":{"type":"quote","label":"Lo stesso racconto come dialogo","text":"«Nonna, sono arrivata!» disse Giulia. «Però ho perso il quaderno di disegni.»\n«Dove l’avevi messo?» chiese la nonna.\n«L’avevo aperto sul treno, vicino al finestrino.»"},"action":"Leggi il dialogo. Ritrova i fatti del racconto: il treno, il finestrino, il quaderno perso.","hint":"Con un diario o una lettera vale la stessa regola. Cambia il modo di scrivere: in un diario c’è la data e chi scrive dice “io”. I fatti della storia restano gli stessi."},{"phase":"Prova guidata","title":"Prova tu: un racconto in prima persona","text":["Questa volta chi racconta dice “io”: il racconto è in prima persona. La consegna chiede la terza persona. La protagonista, cioè il personaggio principale, si chiama Anna."],"visual":{"type":"quote","label":"Racconto e consegna","text":"Entrai in cucina e vidi una torta sul tavolo. Presi un coltello per tagliarne una fetta. In quel momento mio fratello gridò: «Ferma! È per il compleanno della mamma!»\n\nConsegna: riscrivi il racconto in terza persona. La protagonista si chiama Anna."},"action":"Prepara un nuovo foglio con le due colonne. Scrivi che cosa cambia e che cosa resta uguale.","hint":"Rileggi la consegna: che cosa chiede di cambiare? Scrivilo in “Cambia”. Poi elenca i luoghi, le persone e le cose della storia: vanno in “Resta uguale”."},{"phase":"Prova guidata","title":"Riscrivi una frase alla volta","text":["Qui sotto trovi il racconto e le colonne già complete. Ora riscrivi le tre frasi. Metti “Anna” nella prima frase, così il lettore sa di chi si parla.","Davanti a ogni verbo chiediti chi fa l’azione. Se la fa Anna, il verbo cambia."],"visual":{"type":"quote","label":"Il racconto e le tue colonne","text":"Entrai in cucina e vidi una torta sul tavolo. Presi un coltello per tagliarne una fetta. In quel momento mio fratello gridò: «Ferma! È per il compleanno della mamma!»\n\nCambia: chi racconta. Ora è un narratore che parla di Anna.\nResta uguale: cucina, torta, coltello, fratello, compleanno."},"action":"Scrivi sul foglio la versione nuova, una frase alla volta. Poi vai avanti per confrontare.","hint":"I verbi di Anna: “entrai” diventa “entrò”, “vidi” diventa “vide”, “presi” diventa “prese”. Guarda “gridò”: chi grida? Il fratello. Allora quel verbo resta così."},{"phase":"Controllo guidato","title":"Confronta con una soluzione","text":["Questa è una soluzione possibile. I verbi di Anna sono in terza persona. “Mio fratello” diventa “suo fratello”.","Le parole tra virgolette restano uguali. Le dice il fratello, non chi racconta."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"Anna entrò in cucina e vide una torta sul tavolo. Prese un coltello per tagliarne una fetta. In quel momento suo fratello gridò: «Ferma! È per il compleanno della mamma!»"},"action":"Confronta la tua versione frase per frase. Cerchia ogni parola diversa e chiediti se il senso è lo stesso.","hint":"Se hai scritto “Anna entrò in cucina e vidi una torta”, hai mescolato lei e io. Prova a mettere “lei” davanti a ogni verbo di Anna: “lei vide”."},{"phase":"Compito nuovo","title":"Ora cambia il finale","text":["Ecco un nuovo racconto. Questa volta la consegna chiede un altro finale.","Prepara da solo le due colonne. Poi scrivi il nuovo finale e mettici una ragione."],"visual":{"type":"quote","label":"Racconto e consegna","text":"Sara preparò lo zaino per la gita al lago. La mattina dopo il cielo era grigio. Alla fermata, l’insegnante annunciò che la gita era rimandata.\n\nConsegna: cambia il finale. La gita si fa lo stesso."},"action":"Scrivi le colonne e il nuovo finale sul foglio. Vai avanti quando vuoi confrontare.","hint":"Quali frasi devono restare uguali? Quale frase puoi cambiare? Poi chiediti: che cosa può succedere al cielo grigio perché la gita si faccia?"},{"phase":"Controllo","title":"Controlla il tuo finale","text":["Ecco una soluzione possibile. Le prime due frasi sono identiche. Cambia solo la fine, e c’è una ragione: le nuvole si stanno allontanando.","Il tuo finale può essere diverso, ma deve rispettare la consegna."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"Sara preparò lo zaino per la gita al lago. La mattina dopo il cielo era grigio. Alla fermata, l’insegnante guardò il cielo: le nuvole si stavano allontanando. «Si parte!» disse."},"action":"Controlla sul foglio tre cose. Le prime due frasi sono uguali? La gita si fa? Si capisce perché? Aggiungi la parte che manca.","hint":"Va bene anche un’altra ragione, se si capisce. Per esempio: “Il meteo prevedeva sole per tutto il giorno”. La ragione serve a far credere il finale al lettore."},{"phase":"Controllo","title":"Un errore da riconoscere","text":["In questa versione la gita si fa. Però sono cambiate anche le prime due frasi: Sara non prepara lo zaino e c’è il sole. La consegna chiedeva di cambiare solo il finale."],"visual":{"type":"quote","label":"Versione da correggere","text":"Sara non aveva preparato niente per la gita. La mattina dopo c’era il sole. Alla fermata, l’insegnante disse che si partiva."},"action":"Scrivi sul foglio quali frasi vanno rimesse come nell’originale. Poi controlla anche la tua versione con la colonna “Resta uguale”.","hint":"Metti l’originale e la versione nuova uno accanto all’altro. Confronta la prima frase con la prima, la seconda con la seconda. Solo l’ultima può essere diversa."},{"phase":"Ripresa a casa","title":"Usa le due colonne nel tuo compito","text":["A casa prepara sempre le due colonne prima di riscrivere. Poi lavora una frase alla volta.","Se la consegna non è chiara, chiedi all’insegnante che cosa devi cambiare. Il giorno dopo ripassa il metodo su un racconto breve."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Leggi la consegna e sottolinea che cosa cambia.","Scrivi le colonne “Cambia” e “Resta uguale”.","Riscrivi una frase alla volta.","Se cambia il narratore, controlla ogni verbo.","Rileggi e spunta la colonna “Resta uguale”."]},"action":"Prendi il racconto del tuo compito e prepara le due colonne. Nel Menu trovi la scheda da stampare.","hint":"Per capire se il metodo funziona, mostra a qualcuno le due versioni. Chiedi: “È la stessa storia?”. Se la risposta è sì e la consegna è rispettata, hai lavorato bene."}],"coach":{"goal":"Insegnare a separare ciò che la consegna chiede di cambiare da ciò che va mantenuto, prima di riscrivere. Osservare il rispetto del vincolo e la coerenza della persona verbale; la creatività del finale non è oggetto di valutazione.","prepare":"Avere il racconto stampato a caratteri grandi e un foglio già diviso in due colonne, se tracciarle rallenta. Tenere a disposizione la tabella dei verbi che lo studente usa di solito. I racconti sono stati scritti per l’esercitazione.","observe":"Chiedere “Che cosa ti chiede di cambiare la consegna?” prima della riscrittura e “Chi fa questa azione?” davanti a ogni verbo. Distinguere l’errore di metodo (cambia anche i fatti, mescola io e lei) dall’errore ortografico sulla forma verbale (per esempio “apri” per “aprii”): il secondo si corregge con la tabella dei verbi, senza considerarlo un errore di comprensione.","adaptations":[["Riscrivere i verbi — possibile difficoltà con disortografia","La persona del verbo è scelta bene, ma la forma è scritta male (“aprì” al posto di “aprii”, doppie mancanti).","Tenere visibile una tabella del passato remoto con le forme di “io” e di “lui/lei”. Far leggere ogni verbo con il pronome davanti. Verificare se gli errori di persona diminuiscono anche quando restano errori ortografici."],["Lettura del racconto — possibile difficoltà con dislessia","Salta parole come “si”, “mi”, “suo” e non riconosce chi racconta.","Offrire lettura dell’adulto o sintesi vocale e far evidenziare con due colori le parole di “io” e quelle di “lei”. Verificare se riconosce il narratore senza aiuto su un secondo testo."],["Tenere a mente i vincoli — difficoltà trasversale","Mentre riscrive, cambia anche fatti che dovevano restare uguali.","Lasciare le due colonne accanto al testo e far spuntare ogni elemento di “Resta uguale” alla fine. Osservare se il numero di elementi persi si riduce nella prova successiva."]],"sources":["ies2007","eef2025","w3c-coga","aiddsa"],"checks":"Forme del passato remoto controllate: salire (salì/salii), sedersi (si sedette/mi sedetti), aprire (aprì/aprii), scendere (scese/scesi), accorgersi (si accorse/mi accorsi), entrare (entrai/entrò), vedere (vidi/vide), prendere (presi/prese). Nella prova guidata “Ferma!” è rivolto a una protagonista femminile e resta invariato nel discorso diretto."},"print":{"modelTitle":"Esempio commentato: cambio di narratore","visual":{"type":"table","label":"Le due colonne","columns":["Colonna","Che cosa scrivo"],"rows":[["Cambia","chi racconta: Giulia, con “io”"],["Resta uguale","treno, nonna, finestrino, quaderno sparito"]]},"model":["Originale: Giulia salì sul treno per andare dalla nonna. Si sedette vicino al finestrino e aprì il suo quaderno di disegni. Quando scese alla stazione, si accorse che il quaderno non c’era più.","1. Leggo la consegna: “Racconta come se fossi Giulia”. Cambia solo chi racconta.","2. Scrivo le due colonne: “Cambia” e “Resta uguale”.","3. Riscrivo una frase alla volta: salì → salii; si sedette → mi sedetti; aprì → aprii; suo → mio; scese → scesi; si accorse → mi accorsi.","4. Lascio uguale “il quaderno non c’era più”: parla del quaderno, non di Giulia.","5. Versione nuova: Salii sul treno per andare dalla nonna. Mi sedetti vicino al finestrino e aprii il mio quaderno di disegni. Quando scesi alla stazione, mi accorsi che il quaderno non c’era più.","Altro finale: tengo le prime frasi e cambio solo la fine, con una ragione. Dialogo: tengo i fatti e li faccio dire ai personaggi."],"practice":[["Prova guidata — cambio di narratore","Entrai in cucina e vidi una torta sul tavolo. Presi un coltello per tagliarne una fetta. In quel momento mio fratello gridò: «Ferma! È per il compleanno della mamma!»\nConsegna: riscrivi in terza persona. La protagonista si chiama Anna. Prepara prima le due colonne."],["Compito nuovo — altro finale","Sara preparò lo zaino per la gita al lago. La mattina dopo il cielo era grigio. Alla fermata, l’insegnante annunciò che la gita era rimandata.\nConsegna: cambia il finale. La gita si fa lo stesso. Scrivi una ragione."]],"answers":["Prova guidata: Anna entrò in cucina e vide una torta sul tavolo. Prese un coltello per tagliarne una fetta. In quel momento suo fratello gridò: «Ferma! È per il compleanno della mamma!» Le parole tra virgolette non cambiano.","Compito nuovo, soluzione possibile: le prime due frasi restano uguali. Poi: Alla fermata, l’insegnante guardò il cielo: le nuvole si stavano allontanando. «Si parte!» disse.","Controlla: hai cambiato solo ciò che chiede la consegna? Ritrovi tutto ciò che hai scritto in “Resta uguale”? Il nuovo finale ha una ragione?"],"home":["Leggi la consegna e sottolinea che cosa cambia.","Scrivi le colonne “Cambia” e “Resta uguale”.","Riscrivi una frase alla volta; se cambia il narratore, controlla ogni verbo.","Rileggi e spunta ogni elemento di “Resta uguale”."]},"maps":{},"kind":"task","subject":"Italiano","area":"Antologia e comprensione"},{"id":"M01-12","title":"Motivazioni dei personaggi e tema del racconto","intro":"Spiega perché un personaggio fa una scelta e qual è il tema, usando prove prese dal testo.","slides":[{"phase":"Preparazione","title":"Perché lo fa? Che cosa ci fa capire la storia?","text":["Spesso la consegna chiede: “Perché il personaggio fa questa scelta?” e “Qual è il tema del racconto?”. Per rispondere servono prove: parole e azioni che trovi nel testo.","Userai una scheda con quattro righe. Ti aiuterà a ricordare le prove."],"visual":{"type":"list","label":"La scheda","items":["Scelta: che cosa fa il personaggio","Motivazione: perché lo fa","Tema: l’idea generale della storia","Prove: le parole del testo che lo mostrano"]},"action":"Scrivi sul foglio, una sotto l’altra, le quattro parole: Scelta, Motivazione, Tema, Prove. Lascia due righe vuote sotto ciascuna.","hint":"Una prova è una parte del testo che puoi indicare con il dito. “Secondo me è gentile” è un’opinione. “Le presta la penna” è una prova, se lo trovi scritto nel testo."},{"phase":"Preparazione","title":"Motivazione e indizi","text":["La motivazione è la ragione per cui un personaggio fa qualcosa. A volte il testo la scrive: “Prese l’ombrello perché pioveva”.","Altre volte devi capirla dagli indizi. Un indizio è un dettaglio del testo che ti fa capire qualcosa. “Aveva gli occhi rossi” è un indizio: forse ha pianto."],"visual":{"type":"table","label":"Ragione scritta e ragione da capire","columns":["Nel testo","Che cosa capisco"],"rows":[["“Prese l’ombrello perché pioveva”","La ragione è scritta: pioveva."],["“Aveva gli occhi rossi”","È un indizio: forse ha pianto."]]},"action":"Leggi le due righe della tabella. Indica la parola “perché”: lì il testo scrive la ragione.","hint":"Fai come un investigatore. Il testo non dice sempre tutto. Tu metti insieme i dettagli e fai un’ipotesi, cioè una spiegazione possibile. Per questo usi parole come “forse” o “sembra”."},{"phase":"Preparazione","title":"Il tema è diverso dall’argomento","text":["L’argomento è di che cosa parla la storia: una gara, una gita, un cane. Il tema è l’idea che la storia ci fa capire sulle persone.","Il tema si scrive con poche parole: “il coraggio”, “l’amicizia”, “l’onestà”. Puoi aggiungere una precisazione: “l’amicizia nei momenti difficili”."],"visual":{"type":"table","label":"Una storia, argomento e tema","columns":["Storia","Argomento","Tema"],"rows":[["Una ragazza si ferma ad aiutare un’amica caduta durante una gara.","una gara di corsa","l’amicizia vale più della vittoria"]]},"action":"Leggi la tabella. Ripeti a voce la differenza: l’argomento dice di che cosa si parla, il tema dice quale idea.","hint":"Prova questa domanda: “È un’idea sulle persone o una cosa che succede?”. “L’amicizia” è un’idea sulle persone: può essere un tema. “La gara” è una cosa che succede: è l’argomento."},{"phase":"Esempio spiegato","title":"Leggiamo il racconto","text":["Useremo questo racconto come esempio. Leggilo tutto una volta, per capire che cosa succede."],"visual":{"type":"quote","label":"Racconto","text":"Tommaso aveva paura dei cani, anche di quelli piccoli. Un pomeriggio il cane della vicina scappò dal cancello e corse verso la strada. La signora, che era anziana, non riusciva a corrergli dietro. Tommaso si fece forza, chiamò il cane e lo prese per il collare. Poi lo riportò alla signora, con le mani che ancora tremavano."},"action":"Leggi o ascolta il racconto. Poi racconta a voce, in due frasi, che cosa succede.","hint":"Puoi chiedere all’adulto di leggere. Per raccontare in due frasi, rispondi a queste domande: chi c’è? Che cosa succede alla fine?"},{"phase":"Esempio spiegato","title":"Troviamo la scelta importante","text":["La scelta importante è l’azione del personaggio che cambia la storia. Qui Tommaso prende il cane per il collare.","È una scelta importante perché Tommaso ha paura dei cani. Fa una cosa difficile per lui."],"visual":{"type":"quote","label":"Racconto","text":"Tommaso aveva paura dei cani, anche di quelli piccoli. Un pomeriggio il cane della vicina scappò dal cancello e corse verso la strada. La signora, che era anziana, non riusciva a corrergli dietro. Tommaso si fece forza, chiamò il cane e lo prese per il collare. Poi lo riportò alla signora, con le mani che ancora tremavano."},"action":"Sottolinea nel racconto la frase della scelta. Poi scrivila nella riga “Scelta” con parole tue.","hint":"Chiediti: in quale momento il personaggio decide di fare qualcosa? Prima di quel momento la storia va in un modo, dopo va in un altro. Qui, senza Tommaso, il cane arriverebbe in strada."},{"phase":"Esempio spiegato","title":"Cerchiamo la ragione negli indizi","text":["Il testo non scrive perché Tommaso prende il cane. Allora cerchiamo gli indizi.","Il cane corre verso la strada. La signora non riesce a corrergli dietro. Questi dettagli ci fanno capire che il cane è in pericolo e che la signora ha bisogno di aiuto."],"visual":{"type":"quote","label":"Indizi nel racconto","text":"Il cane della vicina scappò dal cancello e corse verso la strada.\n\nLa signora, che era anziana, non riusciva a corrergli dietro."},"action":"Sottolinea nel racconto i due indizi. Scrivili nella riga “Prove”.","hint":"Fai finta di essere Tommaso. Che cosa vedi? Un cane che corre verso le macchine e una signora che non riesce a fermarlo. Che cosa pensi in quel momento?"},{"phase":"Esempio spiegato","title":"Scriviamo la motivazione","text":["Ora uniamo la scelta e gli indizi. La ragione non è scritta, quindi usiamo “forse”: è la nostra ipotesi.","Una buona risposta ha tre parti: che cosa fa il personaggio, perché lo fa, da che cosa lo capisci."],"visual":{"type":"quote","label":"Motivazione","text":"Tommaso prende il cane, forse perché vuole aiutare la signora e tenere il cane lontano dalla strada.\n\nLo capisco perché il cane corre verso la strada e la signora non riesce a corrergli dietro."},"action":"Scrivi la motivazione nella riga “Motivazione”. Controlla che ci siano le tre parti.","hint":"Puoi usare questo schema: “[Personaggio] fa … forse perché … Lo capisco da …”. Se la ragione è scritta nel testo, togli “forse”."},{"phase":"Esempio spiegato","title":"Dal racconto all’idea: il tema","text":["Per trovare il tema, pensa a che cosa ci fa capire la storia sulle persone. Tommaso ha paura, ma la supera per aiutare qualcuno.","Un tema possibile è: “il coraggio di superare una paura per aiutare gli altri”. È un’idea che vale anche per altre storie."],"visual":{"type":"table","label":"Argomento e tema del racconto","columns":["Domanda","Risposta"],"rows":[["Di che cosa parla? (argomento)","un cane che scappa"],["Quale idea ci fa capire? (tema)","il coraggio di superare una paura per aiutare gli altri"]]},"action":"Scrivi il tema nella riga “Tema”. Usa poche parole.","hint":"Domanda guida: “Che cosa ha mostrato il personaggio?”. Tommaso mostra che si può avere paura e fare lo stesso la cosa giusta. Questo si chiama coraggio."},{"phase":"Esempio spiegato","title":"Sosteniamo il tema con due prove","text":["Un tema senza prove resta un’etichetta. Per sostenerlo, scegli due parti del testo che lo mostrano.","Per il coraggio servono due cose: la paura e l’azione che la supera."],"visual":{"type":"quote","label":"Tema con due prove","text":"Tema: il coraggio di superare una paura per aiutare gli altri.\n\nProva 1: “Tommaso aveva paura dei cani”.\nProva 2: “si fece forza, chiamò il cane e lo prese per il collare”."},"action":"Copia le due prove nella riga “Prove”, tra virgolette. Ora la tua scheda è completa.","hint":"Le virgolette mostrano che quelle parole vengono dal testo. Una sola prova è poca: con “aveva paura” sappiamo della paura, ma non sappiamo se Tommaso l’ha superata."},{"phase":"Prova guidata","title":"Prova tu: scelta e motivazione","text":["Leggi questo racconto. Questa volta il personaggio dice qualcosa sulla sua ragione. Cerca le sue parole tra le virgolette."],"visual":{"type":"quote","label":"Racconto","text":"Luca comprò la frutta al mercato. Il fruttivendolo, distratto, gli diede troppi soldi di resto. Luca se ne accorse solo davanti a casa. Per un momento pensò al videogioco che poteva comprare. Poi tornò al mercato e restituì i soldi. «Non sono miei» disse."},"action":"Prepara una scheda nuova. Scrivi la scelta di Luca e la sua motivazione. Ricorda le tre parti: che cosa fa, perché, da che cosa lo capisci.","hint":"La scelta è l’azione che cambia la storia: che cosa decide Luca alla fine? Per la motivazione, rileggi le parole tra virgolette. Qui la ragione la dice il personaggio: puoi togliere “forse”."},{"phase":"Controllo guidato","title":"Confronta scelta e motivazione","text":["La scelta è restituire i soldi. La ragione la dice Luca: «Non sono miei». Quindi non serve “forse”.","Anche il videogioco è un indizio importante. Mostra che Luca ha avuto la tentazione di tenere i soldi. La tentazione è la voglia di fare una cosa sbagliata."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"Scelta: Luca torna al mercato e restituisce i soldi.\n\nMotivazione: Luca restituisce i soldi perché sa che non sono suoi. Lo capisco dalle sue parole: «Non sono miei»."},"action":"Confronta la tua scheda. Se manca la prova, aggiungi le parole di Luca.","hint":"Se avevi scritto “Luca compra la frutta”, quella è l’azione dell’inizio. Non cambia la storia. Cerca il momento in cui Luca decide di fare una cosa difficile."},{"phase":"Prova guidata","title":"Prova tu: tema e prove","text":["Ora passa dall’azione all’idea. Chiediti: che cosa ci fa capire questa storia sulle persone?","Poi cerca due prove: una mostra la tentazione, l’altra mostra la scelta."],"visual":{"type":"quote","label":"Racconto","text":"Luca comprò la frutta al mercato. Il fruttivendolo, distratto, gli diede troppi soldi di resto. Luca se ne accorse solo davanti a casa. Per un momento pensò al videogioco che poteva comprare. Poi tornò al mercato e restituì i soldi. «Non sono miei» disse."},"action":"Scrivi il tema nella riga “Tema”. Copia due prove tra virgolette nella riga “Prove”.","hint":"Il tema può essere una parola come “l’onestà”. L’onestà è dire la verità e lasciare agli altri ciò che è loro. Puoi aggiungere una precisazione: “l’onestà anche quando nessuno ti vede”."},{"phase":"Controllo guidato","title":"Confronta tema e prove","text":["Un tema possibile è l’onestà, anche quando si potrebbe tenere qualcosa. Le prove mostrano la tentazione e la scelta.","Se hai scritto “essere onesti” o “restituire ciò che è degli altri”, va bene lo stesso: l’idea è la stessa."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"Tema: l’onestà, anche quando si potrebbe tenere qualcosa.\n\nProva 1: “pensò al videogioco che poteva comprare”.\nProva 2: “tornò al mercato e restituì i soldi”."},"action":"Controlla la tua scheda. Hai una prova per la tentazione e una per la scelta? Se ne manca una, aggiungila.","hint":"Se hai scritto “Il tema è il mercato”, hai scritto il luogo della storia. Chiediti quale idea sulle persone mostra Luca con la sua scelta."},{"phase":"Compito nuovo","title":"Ora tutta la scheda da solo","text":["Ecco un nuovo racconto. Completa tutta la scheda: scelta, motivazione, tema e prove.","Questa volta la ragione non è scritta. Cerca gli indizi."],"visual":{"type":"quote","label":"Racconto","text":"Alla festa di classe tutti ballavano in gruppo. Marta era arrivata in città da poco. Stava seduta da sola vicino alla porta. Giada lasciò il gruppo, le portò un bicchiere di aranciata e si sedette accanto a lei. Le chiese da dove veniva. Poco dopo ballavano insieme."},"action":"Scrivi la scheda sul foglio. Vai avanti quando vuoi confrontare.","hint":"Parti dalla scelta di Giada. Poi chiediti: che cosa vede Giada prima di decidere? Quali parole mostrano che Marta è nuova e sola?"},{"phase":"Controllo","title":"Confronta la tua scheda","text":["Ecco una soluzione possibile. La ragione non è scritta, quindi usiamo “forse”. Il tema è un’idea sulle persone, con due prove.","Puoi aver scritto parole diverse, come “l’amicizia” o “aiutare chi è solo”. Vanno bene se hai le prove."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"Scelta: Giada lascia il gruppo e va da Marta.\nMotivazione: forse vuole che Marta si senta parte della festa. Lo capisco perché Marta è nuova e sta seduta da sola.\nTema: accogliere chi è nuovo.\nProve: “era arrivata in città da poco”; “si sedette accanto a lei”."},"action":"Confronta riga per riga. Per ogni riga della tua scheda, indica nel testo la prova che la sostiene.","hint":"Se una tua idea non ha una prova nel testo, chiediti da dove viene. Per esempio “Giada lo fa perché la maestra glielo chiede”: nel racconto la maestra non c’è."},{"phase":"Controllo","title":"Un errore da riconoscere","text":["Guarda questa risposta: “Il tema è la festa di classe”. La festa è l’occasione della storia: è l’argomento.","Il tema invece è un’idea sulle persone. Per correggere, chiediti che cosa mostra Giada con la sua scelta."],"visual":{"type":"quote","label":"Risposta da correggere","text":"Errore: Il tema è la festa di classe.\n\nCorrezione: Il tema è accogliere chi è nuovo. Lo mostra Giada, che va da Marta e si siede accanto a lei."},"action":"Rileggi la riga “Tema” della tua scheda. Chiediti: è un’idea sulle persone o una cosa che succede? Se serve, correggila.","hint":"Un trucco: prova a dire “Questa storia ci fa capire che…”. “…che la festa di classe” non ha senso. “…che è importante accogliere chi è nuovo” invece funziona."},{"phase":"Ripresa a casa","title":"Usa la scheda sul tuo libro","text":["A casa usa la scheda su un racconto dell’antologia, il libro di letture. Parti sempre dalla scelta importante del personaggio.","Se non trovi prove per un’idea, cambiala o chiedi aiuto. Il giorno dopo prova la scheda su un altro racconto."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Trova la scelta importante del personaggio.","Cerca la ragione: è scritta o va capita dagli indizi?","Scrivi la motivazione in tre parti.","Trasforma la storia in un’idea sulle persone: il tema.","Sostieni il tema con due prove tra virgolette."]},"action":"Scegli un racconto del tuo compito e prepara la scheda con quattro righe. Nel Menu trovi la scheda da stampare.","hint":"Per capire se hai lavorato bene, leggi le tue righe a qualcuno. Poi chiedi: “Ti ho convinto?”. Se ti chiede “Da dove lo capisci?”, aggiungi una prova."}],"coach":{"goal":"Insegnare a collegare ogni interpretazione (motivazione e tema) a prove del testo, distinguendo la ragione scritta da quella ricavata dagli indizi e il tema dall’argomento. Si accettano interpretazioni diverse da quelle proposte, se sostenute da prove.","prepare":"Stampare i racconti a caratteri grandi, con spazio tra le righe. Preparare la scheda a quattro righe se scriverla rallenta. I racconti sono stati scritti per l’esercitazione.","observe":"Chiedere “Da quale parola lo capisci?” dopo ogni affermazione. Distinguere un dettaglio letto male (errore di lettura: si corregge rileggendo insieme) da un’idea senza prova (errore di metodo: si torna al testo). Non attribuire allo studente le motivazioni del personaggio e non chiedere che cosa avrebbe fatto lui, se non è richiesto.","adaptations":[["Trovare gli indizi — possibile difficoltà con dislessia","Legge lentamente, perde dettagli come “che era anziana” e non trova le prove.","Offrire lettura dell’adulto o sintesi vocale e numerare le righe del racconto. Verificare se, dopo l’ascolto, lo studente indica da solo le righe con gli indizi."],["Scrivere la motivazione — possibile difficoltà con disgrafia o disortografia","A voce spiega bene la ragione, ma per iscritto scrive solo poche parole.","Dare la frase-schema già stampata (“… fa … forse perché … Lo capisco da …”) o accettare prima la risposta orale. Verificare se nella scrittura compaiono le tre parti."],["Passare all’idea generale — difficoltà trasversale","Scrive come tema un luogo o un oggetto della storia, oppure un’etichetta senza prove.","Usare la frase “Questa storia ci fa capire che…” e, all’inizio, far scegliere tra tre temi possibili motivando la scelta. Osservare se la scelta è sostenuta da almeno una prova."]],"sources":["ies2007","eef2025","w3c-coga","aiddsa"],"checks":"Verificato che in ogni racconto le prove citate compaiano parola per parola nel testo e che le motivazioni proposte come ipotesi siano segnalate con “forse”. Il racconto di Luca non contiene cifre, per non introdurre calcoli."},"print":{"modelTitle":"Esempio commentato: Tommaso e il cane","model":["Tommaso aveva paura dei cani, anche di quelli piccoli. Un pomeriggio il cane della vicina scappò dal cancello e corse verso la strada. La signora, che era anziana, non riusciva a corrergli dietro. Tommaso si fece forza, chiamò il cane e lo prese per il collare. Poi lo riportò alla signora, con le mani che ancora tremavano.","1. Scelta: Tommaso prende il cane per il collare, anche se ha paura.","2. Motivazione: forse vuole aiutare la signora e tenere il cane lontano dalla strada. Lo capisco perché il cane corre verso la strada e la signora non riesce a corrergli dietro.","3. Tema: il coraggio di superare una paura per aiutare gli altri.","4. Prove: “Tommaso aveva paura dei cani”; “si fece forza, chiamò il cane e lo prese per il collare”.","Ricorda: l’argomento è di che cosa parla la storia (un cane che scappa); il tema è l’idea sulle persone."],"practice":[["Prova guidata — Luca al mercato","Luca comprò la frutta al mercato. Il fruttivendolo, distratto, gli diede troppi soldi di resto. Luca se ne accorse solo davanti a casa. Per un momento pensò al videogioco che poteva comprare. Poi tornò al mercato e restituì i soldi. «Non sono miei» disse.\nCompleta la scheda: Scelta, Motivazione, Tema, Prove. Cerca le parole di Luca tra le virgolette."],["Compito nuovo — La festa di classe","Alla festa di classe tutti ballavano in gruppo. Marta era arrivata in città da poco. Stava seduta da sola vicino alla porta. Giada lasciò il gruppo, le portò un bicchiere di aranciata e si sedette accanto a lei. Le chiese da dove veniva. Poco dopo ballavano insieme.\nCompleta la scheda sulla scelta di Giada."]],"answers":["Luca: sceglie di restituire i soldi perché non sono suoi; lo dice lui: «Non sono miei». Tema possibile: l’onestà, anche quando si potrebbe tenere qualcosa. Prove: “pensò al videogioco”; “restituì i soldi”.","Giada: lascia il gruppo e va da Marta, forse perché vuole che si senta parte della festa. Indizi: Marta è nuova e sta da sola. Tema possibile: accogliere chi è nuovo. Prove: “era arrivata in città da poco”; “si sedette accanto a lei”.","Sono possibili altre parole e altri temi, se ogni idea ha una prova nel testo. “La festa” o “il mercato” sono argomenti, non temi."],"home":["Trova la scelta importante del personaggio.","Cerca la ragione: è scritta o va capita dagli indizi?","Scrivi la motivazione in tre parti: che cosa fa, perché, da che cosa lo capisci.","Trasforma la storia in un’idea sulle persone e sostienila con due prove tra virgolette."]},"maps":{},"kind":"task","subject":"Italiano","area":"Antologia e comprensione"},{"id":"M01-13","title":"Capire una parola nuova: sinonimi e contrari","intro":"Capisci una parola nuova dalla frase in cui si trova e scegli un sinonimo e un contrario adatti.","slides":[{"phase":"Preparazione","title":"Capire una parola che non conosci","text":["Nei testi trovi parole che non conosci. Spesso puoi capirle dalla frase in cui si trovano. Poi puoi cercare un sinonimo e un contrario.","Il dizionario serve per controllare. Lo apri dopo aver fatto un’ipotesi, cioè dopo aver pensato a un significato possibile."],"visual":{"type":"list","label":"Prepara","items":["Il testo con la parola da capire","Un dizionario, di carta o digitale","Un foglio e una penna"]},"action":"Scrivi sul foglio quattro parole, una per riga: Parola, Significato, Sinonimo, Contrario. Lascia spazio accanto a ognuna.","hint":"Con un dizionario digitale puoi anche ascoltare le definizioni con la sintesi vocale. Usa lo strumento che usi già a scuola."},{"phase":"Preparazione","title":"Contesto, sinonimo e contrario","text":["Il contesto è il testo intorno alla parola: la sua frase e le frasi vicine.","Un sinonimo è una parola con un significato uguale o molto simile. Un contrario è una parola con il significato opposto."],"visual":{"type":"table","label":"Tre parole da conoscere","columns":["Parola","Che cosa vuol dire","Esempio"],"rows":[["Contesto","le frasi intorno alla parola","“Il cane era enorme: più alto di me”"],["Sinonimo","significato simile","contento → felice"],["Contrario","significato opposto","alto → basso"]]},"action":"Leggi la tabella. Poi trova a voce un sinonimo e un contrario di “veloce”.","hint":"Un sinonimo di “veloce” è “rapido”. Un contrario è “lento”. Mettili nella frase “Il treno è veloce”: “Il treno è rapido” dice la stessa cosa, “Il treno è lento” dice l’opposto."},{"phase":"Esempio spiegato","title":"Leggiamo la frase intera","text":["Ecco la frase dell’esempio. La parola nuova è “gremita”.","Leggi tutta la frase, anche la parte dopo la parola. Spesso la spiegazione arriva dopo."],"visual":{"type":"quote","label":"Frase","text":"La piazza era gremita: non si riusciva a passare tra la gente."},"action":"Copia la frase sul foglio e sottolinea “gremita”. Scrivi la parola anche nella riga “Parola”.","hint":"Se copiare ti fa perdere tempo, scrivi solo la parola e tieni la frase sullo schermo. L’importante è leggere tutta la frase prima di decidere."},{"phase":"Esempio spiegato","title":"Cerchiamo gli indizi","text":["Gli indizi sono le parole vicine che ci aiutano a capire. Qui dopo i due punti c’è una spiegazione: “non si riusciva a passare tra la gente”.","Se non si passa, vuol dire che c’è tanta gente. I due punti spesso introducono una spiegazione."],"visual":{"type":"quote","label":"Frase con l’indizio","text":"La piazza era gremita: non si riusciva a passare tra la gente."},"action":"Sottolinea con un altro colore le parole che ti aiutano: “non si riusciva a passare tra la gente”.","hint":"Altri indizi utili sono “cioè”, “come”, “ma”, “invece”. “Cioè” e “come” spiegano o danno un esempio. “Ma” e “invece” mostrano un contrasto tra due cose."},{"phase":"Esempio spiegato","title":"Facciamo un’ipotesi e proviamo","text":["Ora diciamo il significato con parole nostre: “gremita” vuol dire “piena di gente”.","Per controllare, mettiamo la nostra spiegazione al posto della parola. Se la frase ha senso, l’ipotesi funziona."],"visual":{"type":"quote","label":"Prova di sostituzione","text":"La piazza era gremita: non si riusciva a passare tra la gente.\n\nLa piazza era piena di gente: non si riusciva a passare tra la gente."},"action":"Leggi la seconda frase. Ha senso? Se sì, scrivi “piena di gente” nella riga “Significato”.","hint":"Prova anche un’ipotesi sbagliata: “La piazza era vuota: non si riusciva a passare”. Suona strano. Così capisci che “vuota” è il significato sbagliato."},{"phase":"Esempio spiegato","title":"Controlliamo nel dizionario","text":["Nel dizionario gli aggettivi sono scritti al maschile singolare. Quindi cerca “gremito”, con la o finale.","Leggi le definizioni e scegli quella adatta alla frase. Qui la definizione conferma la nostra ipotesi."],"visual":{"type":"quote","label":"Dal dizionario, in forma semplice","text":"gremito: pieno di persone o di cose; affollato.\nEsempio: un teatro gremito."},"action":"Cerca “gremito” nel tuo dizionario. Confronta la definizione con la tua riga “Significato”.","hint":"Per i verbi c’è una regola simile: il dizionario usa l’infinito. Se trovi “correvano”, cerca “correre”. Per i nomi cerca il singolare: per “alberi”, cerca “albero”."},{"phase":"Esempio spiegato","title":"Scegliamo un sinonimo","text":["Un sinonimo di “gremito” è “affollato”. Lo mettiamo nella frase al posto della parola.","Attenzione all’accordo: “piazza” è femminile singolare. Quindi scriviamo “affollata”, con la a finale."],"visual":{"type":"quote","label":"Prova con il sinonimo","text":"La piazza era gremita.\nLa piazza era affollata."},"action":"Scrivi “affollata” nella riga “Sinonimo”. Rileggi la frase nuova: dice la stessa cosa?","hint":"Un sinonimo deve stare bene nella frase. “Piena” va bene. “Rumorosa” dice un’altra cosa: una piazza può essere rumorosa anche con poche persone."},{"phase":"Esempio spiegato","title":"Scegliamo un contrario","text":["Il contrario di “affollata” è “deserta”, oppure “vuota”. Anche qui lo mettiamo nella frase e controlliamo l’accordo.","La frase nuova deve dire l’opposto: una piazza dove non c’è nessuno."],"visual":{"type":"quote","label":"Prova con il contrario","text":"La piazza era gremita.\nLa piazza era deserta."},"action":"Scrivi “deserta” o “vuota” nella riga “Contrario”. Ora la tua scheda è completa.","hint":"Per trovare un contrario, immagina la scena opposta. La piazza piena diventa una piazza senza nessuno. Quale parola la descrive?"},{"phase":"Prova guidata","title":"Prova tu: che cosa vuol dire “esausto”?","text":["Leggi la frase. Cerca gli indizi dopo i due punti. Poi scrivi un’ipotesi e mettila al posto della parola."],"visual":{"type":"quote","label":"Frase","text":"Dopo la lunga camminata in montagna, il nonno era esausto: si sedette sul divano e chiuse subito gli occhi."},"action":"Su una scheda nuova scrivi “esausto” e il suo significato. Rileggi la frase con la tua spiegazione al posto della parola.","hint":"Che cosa fa il nonno dopo la camminata? Si siede e chiude subito gli occhi. Come si sente una persona che fa così dopo tanta strada?"},{"phase":"Controllo guidato","title":"Confronta il significato","text":["“Esausto” vuol dire “stanchissimo”, cioè molto stanco. Gli indizi sono la lunga camminata, il divano e gli occhi chiusi.","Se hai scritto “molto stanco” o “senza forze”, va bene lo stesso."],"visual":{"type":"quote","label":"Prova di sostituzione","text":"Il nonno era esausto.\nIl nonno era stanchissimo."},"action":"Confronta con la tua riga “Significato”. Se avevi scritto “annoiato”, rileggi gli indizi: parlano di fatica.","hint":"“Esausto” è già al maschile singolare: puoi cercarlo così nel dizionario. Leggi la prima definizione e controlla se parla di stanchezza."},{"phase":"Prova guidata","title":"Prova tu: sinonimo e contrario","text":["Ora cerca un sinonimo e un contrario di “esausto”. Mettili nella frase e controlla l’accordo: “nonno” è maschile singolare."],"visual":{"type":"quote","label":"Frase","text":"Dopo la lunga camminata in montagna, il nonno era esausto: si sedette sul divano e chiuse subito gli occhi."},"action":"Scrivi sinonimo e contrario nella scheda. Rileggi la frase due volte: una con il sinonimo, una con il contrario.","hint":"Per il contrario immagina il nonno dopo una notte di sonno. Come si sente? Ha di nuovo tante energie. Quale parola lo dice?"},{"phase":"Controllo guidato","title":"Confronta sinonimo e contrario","text":["Un sinonimo è “sfinito”. Un contrario è “riposato”. Tutte e due sono al maschile singolare, come “nonno”.","Con il contrario la frase cambia senso. È giusto così: il contrario deve dire l’opposto."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"Sinonimo: Il nonno era sfinito.\nContrario: Il nonno era riposato."},"action":"Confronta con la tua scheda. Se hai una parola diversa, mettila nella frase. Chiediti: dice la stessa cosa, oppure l’opposto?","hint":"Altri sinonimi possibili: “stanchissimo”, “senza forze”. Altri contrari: “pieno di energia”, “in forma”. Anche un gruppo di parole può fare da sinonimo o da contrario."},{"phase":"Compito nuovo","title":"Una parola nuova: “taciturna”","text":["Ecco una frase nuova. Fai tutto il percorso da solo: indizi, significato, prova nella frase, sinonimo e contrario.","Qui nell’indizio c’è la parola “ma”: segnala un contrasto."],"visual":{"type":"quote","label":"Frase","text":"Mia sorella è taciturna: a cena ascolta tutti, ma dice solo poche parole."},"action":"Completa una scheda nuova per “taciturna”. Usa il dizionario solo per controllare. Poi vai avanti.","hint":"Leggi che cosa fa la sorella a cena: ascolta e dice poche parole. Ricorda l’accordo: “sorella” è femminile singolare. Nel dizionario cerca “taciturno”."},{"phase":"Controllo","title":"Confronta la tua scheda","text":["“Taciturna” vuol dire “che parla poco”. L’indizio è “dice solo poche parole”.","Un sinonimo è “silenziosa”. Un contrario è “chiacchierona”. Sono tutte al femminile, come “sorella”."],"visual":{"type":"table","label":"Una soluzione possibile","columns":["Riga","Soluzione"],"rows":[["Parola","taciturna"],["Significato","che parla poco"],["Sinonimo","silenziosa"],["Contrario","chiacchierona"]]},"action":"Confronta riga per riga. Rileggi la frase con il tuo sinonimo e con il tuo contrario per controllare l’accordo.","hint":"Va bene anche “di poche parole” come sinonimo, o “loquace” come contrario. Se hai scritto “silenzioso”, la parola è giusta: cambia solo la o finale in a."},{"phase":"Controllo","title":"Attenzione alle parole con più significati","text":["Alcune parole hanno più significati. “Fresco” può voler dire “un po’ freddo”, come l’acqua fresca. Può voler dire anche “fatto da poco”, come il pane fresco.","Il contrario cambia secondo il significato nella frase."],"visual":{"type":"quote","label":"Un errore da riconoscere","text":"Il pane era fresco: il fornaio lo aveva appena sfornato.\n\nErrore: contrario “caldo”.\nCorrezione: contrario “raffermo”, cioè vecchio e duro."},"action":"Metti “caldo” nella frase: dice l’opposto di “appena sfornato”? Poi controlla allo stesso modo il tuo contrario di “taciturna”.","hint":"Nel dizionario, le parole con più significati hanno definizioni numerate: 1, 2, 3. Leggile una alla volta e scegli quella che sta bene nella tua frase."},{"phase":"Ripresa a casa","title":"Usa la scheda quando trovi una parola nuova","text":["A casa, quando trovi una parola nuova, leggi prima tutta la frase. Il dizionario serve dopo, per controllare.","Puoi tenere un quaderno delle parole nuove. Ripassale dopo qualche giorno: prova a ricordare il significato prima di guardare."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Leggi tutta la frase e sottolinea la parola.","Cerca gli indizi vicini: due punti, “cioè”, “ma”.","Scrivi un’ipotesi e mettila al posto della parola.","Controlla nel dizionario la definizione adatta alla frase.","Prova sinonimo e contrario nella frase e controlla l’accordo."]},"action":"Scegli una parola nuova dal tuo libro e completa la scheda. Nel Menu trovi la scheda da stampare.","hint":"Se una parola resta poco chiara anche dopo il dizionario, segna la frase con un punto interrogativo. Chiedi all’insegnante il significato in quella frase."}],"coach":{"goal":"Insegnare a ricavare il significato dal contesto prima del dizionario, a verificarlo con la sostituzione nella frase e a scegliere sinonimi e contrari adatti a quel contesto, con l’accordo corretto.","prepare":"Avere un dizionario che lo studente sa già usare, meglio se digitale con sintesi vocale. Stampare le frasi a caratteri grandi. Le frasi sono state scritte per l’esercitazione.","observe":"Chiedere “Quali parole della frase ti hanno aiutato?” e “Rileggi la frase con la tua parola: funziona?”. Distinguere l’errore di significato (sceglie un sinonimo di un altro senso della parola) dall’errore di accordo (“silenzioso” per “sorella”): il secondo non indica che la parola non sia stata capita.","adaptations":[["Consultare il dizionario — possibile difficoltà con dislessia","Si perde nella voce, legge tutte le definizioni senza scegliere o abbandona la ricerca.","Usare il dizionario digitale con sintesi vocale e far leggere una definizione alla volta, provando ciascuna nella frase. Verificare se lo studente sceglie la definizione adatta senza copiare l’intera voce."],["Forma di base della parola — possibile difficoltà con disortografia","Cerca “gremita” o “correvano” e non trova la voce, oppure scrive il sinonimo con l’accordo sbagliato.","Tenere visibile il promemoria “aggettivi al maschile singolare, verbi all’infinito, nomi al singolare”. Verificare se nella prova successiva trova la voce al primo tentativo."],["Tenere a mente più passaggi — difficoltà trasversale","Salta la prova di sostituzione e passa subito al dizionario.","Usare la scheda a quattro righe e far leggere ad alta voce la frase con l’ipotesi prima di aprire il dizionario. Osservare se le ipotesi diventano più vicine al significato."]],"sources":["ies2007","eef2025","w3c-coga","aid"],"checks":"Significati verificati su dizionari dell’uso: gremito (affollato, pieno di persone), esausto (sfinito, stanchissimo), taciturno (che parla poco; contrario loquace), fresco (fatto da poco, detto del pane; contrario raffermo). Le definizioni sullo schermo sono semplificate e indicate come tali."},"print":{"modelTitle":"Esempio commentato: “gremita”","visual":{"type":"table","label":"La scheda completa","columns":["Riga","Che cosa scrivo"],"rows":[["Parola","gremita (nel dizionario: gremito)"],["Significato","piena di gente"],["Sinonimo","affollata"],["Contrario","deserta, vuota"]]},"model":["Frase: La piazza era gremita: non si riusciva a passare tra la gente.","1. Leggo tutta la frase e sottolineo “gremita”.","2. Cerco gli indizi: dopo i due punti, “non si riusciva a passare tra la gente”.","3. Faccio un’ipotesi: “piena di gente”. La metto nella frase: ha senso.","4. Controllo nel dizionario la forma “gremito”: pieno di persone, affollato.","5. Provo sinonimo e contrario nella frase: “affollata” dice la stessa cosa, “deserta” dice l’opposto. Accordo al femminile, come “piazza”."],"practice":[["Prova guidata — “esausto”","Dopo la lunga camminata in montagna, il nonno era esausto: si sedette sul divano e chiuse subito gli occhi.\nCompleta la scheda: Parola, Significato, Sinonimo, Contrario. Cerca gli indizi dopo i due punti."],["Compito nuovo — “taciturna”","Mia sorella è taciturna: a cena ascolta tutti, ma dice solo poche parole.\nCompleta la scheda. Usa il dizionario solo per controllare."]],"answers":["Esausto: stanchissimo, senza forze. Sinonimo: sfinito. Contrario: riposato, pieno di energia.","Taciturna: che parla poco. Sinonimo: silenziosa, di poche parole. Contrario: chiacchierona, loquace. Accordo al femminile.","Altre parole vanno bene se, messe nella frase, dicono la stessa cosa (sinonimo) o l’opposto (contrario)."],"home":["Leggi tutta la frase e sottolinea la parola nuova.","Cerca gli indizi vicini e scrivi un’ipotesi.","Metti l’ipotesi al posto della parola e rileggi.","Controlla nel dizionario la definizione adatta alla frase.","Prova sinonimo e contrario nella frase e controlla l’accordo."]},"maps":{},"kind":"task","subject":"Italiano","area":"Antologia e comprensione"},{"id":"M01-14","title":"Scheda del libro, recensione e presentazione","intro":"Prepara la scheda di un libro, una breve recensione e una presentazione, separando dati e opinioni.","slides":[{"phase":"Preparazione","title":"Tre lavori su un libro","text":["A scuola ti possono chiedere tre lavori su un libro. La scheda raccoglie le informazioni. La recensione dà un giudizio. La presentazione racconta il libro a voce alla classe.","Per tutti e tre c’è una regola: tieni separati i dati del libro e le tue opinioni."],"visual":{"type":"list","label":"Prepara","items":["Il libro letto","Un foglio e una penna","Due evidenziatori di colori diversi"]},"action":"Scrivi in alto sul foglio: “D = dato” e “G = giudizio”. Colora le due lettere con evidenziatori diversi.","hint":"Una recensione è un breve testo che dice se un libro ti è piaciuto e perché. Le trovi anche sui giornali o in internet, per libri e film."},{"phase":"Preparazione","title":"Dato o giudizio?","text":["Un dato è un’informazione che si può controllare nel libro: il titolo, il nome dell’autore, che cosa succede.","Un giudizio è un’opinione: dice che cosa pensa qualcuno. Altre persone possono pensarla in un altro modo."],"visual":{"type":"table","label":"Tre frasi su un libro","columns":["Frase","D o G","Perché"],"rows":[["Il libro ha 36 capitoli.","D","si possono contare"],["Il protagonista è un burattino.","D","è scritto nel libro"],["La storia è divertente.","G","è un’opinione"]]},"action":"Copri con la mano le due colonne a destra. Per ogni frase, di’ a voce D o G. Poi scopri e controlla.","hint":"Domanda guida: “Posso controllarlo nel libro?”. Se sì, è un dato. Se dipende da chi legge, è un giudizio. Un libro “divertente” per te può essere “noioso” per un altro."},{"phase":"Preparazione","title":"Dove trovi i dati del libro","text":["La copertina ha titolo e autore. Il frontespizio è la prima pagina interna: ha titolo, autore ed editore. L’editore è la casa che pubblica il libro.","La quarta di copertina è il retro del libro: presenta la storia in poche righe."],"visual":{"type":"table","label":"Tre punti del libro","columns":["Dove","Che cosa trovi"],"rows":[["Copertina","titolo e autore"],["Frontespizio","titolo, autore, editore; spesso, vicino, anche l’anno"],["Quarta di copertina","una breve presentazione della storia"]]},"action":"Prendi il tuo libro. Trova la copertina, il frontespizio e la quarta di copertina. Tocca ognuno con il dito.","hint":"Copia i dati dal libro che hai in mano: l’editore e l’anno cambiano da una copia all’altra. Se un dato manca, scrivi “non indicato”. Scrivi solo quello che trovi."},{"phase":"Esempio spiegato","title":"La scheda: i dati","text":["Come esempio usiamo un libro famoso: “Le avventure di Pinocchio”. Lo ha scritto Carlo Collodi più di cento anni fa.","Nella scheda scriviamo solo dati: cose che si possono controllare nel libro. La prima edizione è la prima volta che il libro è stato stampato."],"visual":{"type":"table","label":"Scheda: i dati","columns":["Voce","Dato"],"rows":[["Titolo","Le avventure di Pinocchio"],["Autore","Carlo Collodi"],["Prima edizione","1883"],["Genere","romanzo per ragazzi"],["Protagonista","Pinocchio, un burattino di legno"],["Altri personaggi","Geppetto, il Grillo parlante, la Fata, il Gatto e la Volpe"]]},"action":"Copia sul foglio le voci della scheda, una per riga: Titolo, Autore, Genere, Protagonista, Altri personaggi. Ti serviranno per il tuo libro.","hint":"Il genere è il tipo di libro: romanzo per ragazzi, giallo, fantasy, avventura. Se non sei sicuro del genere, guarda la quarta di copertina o chiedi all’insegnante."},{"phase":"Esempio spiegato","title":"La scheda: la trama in tre frasi","text":["La trama è il riassunto di che cosa succede. Nella scheda bastano tre frasi: l’inizio, le avventure principali, la fine.","Usiamo solo fatti del libro, senza giudizi."],"visual":{"type":"qu
