<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Un passo alla volta — metodo di studio</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#203638;background:#f5f4ee;font-synthesis:none;--accent:#165c54;--ink:#203638;--paper:#fff;--line:#c7d2ce;--muted:#4d6262;font-size:20px}*{box-sizing:border-box}body{margin:0}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;border:1px solid #78958e;background:white;color:var(--ink);border-radius:10px;padding:.65rem 1rem;min-height:48px;text-align:left;line-height:1.3}button:hover{border-color:var(--accent);background:#edf5f0}button:focus-visible,a:focus-visible{outline:3px solid #b75216;outline-offset:4px}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.primary:hover{background:#10443e}button:disabled{opacity:.4;cursor:default}p{line-height:1.6;margin:.65rem 0 1rem}h1,h2,h3{line-height:1.25;color:var(--ink)}h1{font-size:1.8rem;letter-spacing:-.025em;margin:.35rem 0 1.1rem}h2{font-size:1.35rem;margin:1.2rem 0 .7rem}h3{font-size:1.12rem}a{color:#15564f;text-underline-offset:3px}strong{font-weight:700}ul,ol{padding-left:1.35rem}li{line-height:1.55;margin:.5rem 0}main{font-size:1rem}.large{font-size:24px}.skip{position:absolute;top:-100px;padding:10px;background:white;z-index:10}.skip:focus{top:0}.topbar{max-width:1040px;margin:auto;padding:1.1rem 1.6rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}.brand{font-size:.85rem;letter-spacing:.02em}.brand strong{display:block}.brand span{display:block;font-size:.7rem;color:var(--muted);margin-top:4px}.topbar button{font-size:.85rem;padding:.45rem .9rem}.shell{max-width:1000px;margin:0 auto;padding:0 1.6rem 7rem}.paper{background:white;border:1px solid #dce1db;border-radius:18px;padding:2rem 2.4rem;box-shadow:0 5px 22px #20363808;min-height:440px}.kicker{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:bold;margin:0 0 .6rem}.route-label{font-size:.8rem;color:var(--muted);margin:0 0 .7rem}.intro{max-width:36rem}.choices{display:grid;gap:.85rem;margin-top:1.7rem}.choice{padding:1.05rem 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;border:1px solid #c5d4ce}.choice-title{font-size:1.08rem;font-weight:bold}.choice-sub{display:block;font-size:.85rem;font-weight:normal;color:var(--muted);margin-top:.4rem;line-height:1.45}.choice-arrow{font-size:1.2rem;color:var(--accent)}.small{font-size:.82rem;color:var(--muted);line-height:1.55}.copy p:last-child{margin-bottom:1.2rem}.visual{margin:1.2rem 0;padding:1.05rem 1.2rem;background:#f2f6f3;border-radius:12px;border:1px solid #d4e1da}.visual-label{font-size:.76rem;letter-spacing:.03em;color:#365650;font-weight:bold;margin:0 0 .8rem}.quote{white-space:pre-line;line-height:1.65;margin:0;font-size:1.04rem}.math-lines{display:grid;gap:.5rem;font-size:1.3rem;line-height:1.55;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.math-lines div+div{border-top:1px solid #d9e3df;padding-top:.4rem}.action{border-left:4px solid var(--accent);padding:.1rem 0 .1rem 1rem;margin:1.4rem 0 .8rem}.action-label{display:block;font-size:.78rem;font-weight:bold;color:var(--accent);margin-bottom:.3rem}.help-link{border:0;background:transparent;text-decoration:underline;text-underline-offset:4px;color:#285c55;font-size:.86rem;padding:.4rem 0;margin-top:.5rem}.help-link:hover{background:transparent}.navigation{position:fixed;bottom:0;left:0;width:100%;z-index:5;background:#f5f4eef5;border-top:1px solid #d1d9d4}.navigation-inner{max-width:1000px;margin:auto;padding:.7rem 1.6rem;display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center}.navigation button:first-child{justify-self:start}.navigation button:last-child{justify-self:end;min-width:125px;text-align:center}.counter{font-size:.76rem;color:var(--muted);text-align:center}.simple-back{margin-top:1.2rem}.menu-list{max-width:32rem}.note-sheet{background:white;border:2px solid #4b6660;border-radius:2px;font-size:.86rem;line-height:1.5}.note-heading{font-weight:bold;padding:.55rem .7rem;border-bottom:1px solid #6c837d}.note-columns{display:grid;grid-template-columns:34% 66%;min-height:155px}.note-col{padding:.7rem;border-right:1px solid #6c837d}.note-col:last-child{border-right:0}.note-col b,.note-summary b{font-size:.72rem;display:block;margin-bottom:.6rem}.note-col p{font-size:.85rem;line-height:1.5;margin:.65rem 0}.note-summary{border-top:1px solid #6c837d;padding:.7rem;min-height:70px}.note-summary p{margin:0;font-size:.85rem}.note-active{background:#ecf5ed}.note-line{min-height:1.6rem;border-bottom:1px solid #d9e1dc}.map-wrap{padding:.7rem .3rem}.map-wrap svg{display:block;width:100%;height:auto;max-height:425px}.map-mobile{display:none}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.coach-section{border-top:1px solid #d5dfd9;margin:1.4rem 0;padding-top:.3rem}.coach-section .small{color:#3a5650}.script{background:#f2f6f3;padding:1rem;border-left:4px solid #45695f}.coach-adapt{margin:1.4rem 0}.source-list{font-size:.85rem}.source-list a{overflow-wrap:anywhere}.print-view{max-width:900px;margin:auto;padding:1rem}.print-tools{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1rem}.print-page{background:white;padding:14mm;width:210mm;min-height:280mm;margin:1rem auto;border:1px solid #b8c6c0;font-size:11pt;line-height:1.4;color:#111}.print-page h1{font-size:21pt;color:#111;letter-spacing:0}.print-page h2{font-size:15pt;color:#111}.print-page h3{font-size:12pt;color:#111}.print-page p,.print-page li{font-size:11pt;line-height:1.45}.print-page .map-wrap svg{max-height:62mm}.print-page .visual{background:white;color:#111;padding:8px;border-color:#777}.print-page .visual-label{color:#111;font-size:10pt}.print-page .note-sheet{font-size:10pt}.print-page .note-col p,.print-page .note-summary p{font-size:10pt}.print-page .note-col b,.print-page .note-summary b{font-size:9pt}.print-page .note-columns{min-height:35mm}.print-page .note-summary{min-height:15mm}.print-page .small{font-size:9pt;color:#333}.writing-space{height:29mm;background:repeating-linear-gradient(white,white 7mm,#aaa 7.1mm,white 7.3mm);margin:5mm 0}.page-id{font-size:9pt;color:#333;border-bottom:1px solid #999;padding-bottom:3mm}.observation{border-collapse:collapse;width:100%;font-size:10pt}.observation td,.observation th{border:1px solid #777;padding:5px;text-align:left;font-weight:normal}.print-page .note-line{min-height:5mm}.coach-print{max-width:760px;margin:auto;background:white;padding:2rem}.screen-only{display:block}
@media(max-width:700px){.topbar{padding:1rem}.shell{padding:0 .65rem 7rem}.paper{padding:1.25rem 1rem;border-radius:12px;min-height:300px}h1{font-size:1.5rem}.navigation-inner{padding:.65rem .8rem;gap:.5rem}.navigation button{padding:.65rem .8rem}.navigation button:last-child{min-width:100px}.visual{padding:.85rem}.math-lines{font-size:1.12rem}.note-columns{grid-template-columns:37% 63%}.note-col{padding:.5rem}.note-col p{overflow-wrap:anywhere}.map-wrap svg{display:none}.map-mobile{display:block}.map-mobile .root{font-weight:bold;border:2px solid #396c60;display:inline-block;padding:.5rem 1rem;background:#e5f0e7;border-radius:12px}.mobile-branch{margin:.8rem 0;padding:.5rem .7rem;border-left:3px solid #4c7164;line-height:1.6;background:white}.print-page{width:auto;min-height:0;padding:1rem;margin:1rem 0}.print-page .map-wrap svg{display:block}.print-page .map-mobile{display:none}.counter{font-size:.68rem}.choice{padding:.9rem}.coach-print{padding:1rem}}
/* Keep controls outside the reading area, including when text is enlarged. */
.map-wrap svg.map-narrow{display:none}
@media(max-width:700px){.map-wrap svg.map-wide{display:none}.map-wrap svg.map-narrow{display:block;max-height:none;height:auto}}
@media print{.map-wrap svg.map-narrow{display:none!important}.map-wrap svg.map-wide{display:block!important}}
#app{height:100dvh;display:flex;flex-direction:column}.topbar{width:100%;flex:none}.shell{width:100%;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:.6rem}main{flex:1;min-height:0;overflow:auto;scrollbar-gutter:stable;padding:2px}.paper{padding:1.3rem 1.8rem;min-height:0}.navigation{position:relative;flex:none;background:#f5f4ee}.paper h1{font-size:1.6rem}.paper p{line-height:1.5}.map-wrap svg{max-height:290px}.map-wrap{margin:.8rem 0}.visual{margin:.9rem 0}.note-columns{min-height:110px}.note-summary{min-height:55px}.action{margin:1rem 0 .5rem}.print-view{width:100%}.print-page,.print-page p,.print-page li{font-size:12pt;line-height:1.5}
@media(max-width:700px){.paper{padding:1.1rem .85rem}.shell{padding-left:.55rem;padding-right:.55rem}.paper h1{font-size:1.4rem}.navigation-inner{grid-template-columns:1fr auto 1fr}.print-view{padding:.6rem}.print-page{padding:.7rem}}
@media print{@page{size:A4;margin:10mm}body{background:white;color:#000}#app{height:auto;display:block}.topbar,.navigation,.print-tools,.skip,.screen-only{display:none!important}.shell{max-width:none;padding:0;display:block;overflow:visible}.paper{border:0;box-shadow:none;padding:0;min-height:0}main{overflow:visible;display:block;padding:0}.print-view{max-width:none;padding:0}.print-page{width:100%;min-height:0;margin:0;padding:0;border:0;break-after:page}.print-page:last-child{break-after:auto}.print-page .map-wrap svg{display:block}.print-page .map-mobile{display:none}.print-page .visual{background:white}.print-page .note-active{background:white}.print-page li,.print-page .practice-item,.print-page .observation,.print-page .visual{break-inside:avoid}.coach-print{padding:0;font-size:12pt}.coach-print h1{font-size:20pt}.coach-print h2{font-size:14pt}.coach-print h3{font-size:12pt}.coach-print p,.coach-print li{font-size:12pt}.coach-print .script{break-inside:avoid;background:white}.coach-print a{color:black}.print-page .writing-space{border-bottom:1px solid #999}.print-page svg text{fill:black}.print-page svg rect{fill:white;stroke:black}.print-page svg path,.print-page svg line{stroke:black}.print-page .small{color:#222}}

/* Versione completa: ricerca, tabelle, linee del tempo, testo delle mappe. */
.search-label{display:block;font-size:.95rem;line-height:1.5;margin:.4rem 0 .6rem;max-width:36rem}
.search-input{font:inherit;font-size:1.05rem;width:100%;max-width:32rem;min-height:48px;padding:.6rem .8rem;border:2px solid #78958e;border-radius:10px;background:white;color:var(--ink)}
.search-input:focus-visible{outline:3px solid #b75216;outline-offset:3px}
.table-wrap{overflow-x:auto}
.data-table{border-collapse:collapse;width:100%;font-size:.95rem;background:white}
.data-table th,.data-table td{border:1px solid #9fb3ac;padding:.45rem .6rem;text-align:left;vertical-align:top;line-height:1.45}
.data-table thead th{background:#e5efe8;font-size:.85rem}
.data-table tbody th{font-weight:bold}
.timeline{list-style:none;padding:0;margin:0;border-left:3px solid #4c7164}
.timeline li{display:grid;grid-template-columns:minmax(5.5rem,auto) 1fr;gap:.8rem;margin:.55rem 0;padding-left:.9rem;position:relative}
.timeline li::before{content:"";position:absolute;left:-.5rem;top:.55rem;width:.7rem;height:.7rem;border-radius:50%;background:#4c7164}
.timeline .when{font-weight:bold;font-variant-numeric:tabular-nums}
.map-text{margin-top:.6rem;font-size:.9rem}
.map-text summary{cursor:pointer;color:#285c55;text-decoration:underline;text-underline-offset:4px;padding:.3rem 0}
.map-text summary:focus-visible{outline:3px solid #b75216;outline-offset:3px}
.map-text ul{margin:.4rem 0}
@media print{.map-text{display:none}.data-table thead th{background:white}.timeline li::before{background:black}}
@media(max-width:700px){.timeline li{grid-template-columns:1fr;gap:.1rem}}
.map-wrap svg.map-wide{max-height:min(420px,58vh)}
@media(max-width:700px){.data-table{font-size:.85rem}.data-table th,.data-table td{padding:.35rem .4rem}}
</style></head><body><a class="skip" href="#main">Vai al contenuto</a><div id="app"></div><noscript>Per aprire i percorsi, abilita JavaScript nel browser. Il file funziona senza Internet.</noscript><script id="data" type="application/json">{"subjects":[{"name":"Italiano","areas":["Antologia e comprensione","Poesia","Epica e letteratura","Grammatica","Scrittura e comunicazione"]},{"name":"Storia","areas":["Studiare e ricostruire il passato"]},{"name":"Geografia","areas":["Orientarsi e comprendere i territori"]},{"name":"Matematica","areas":["Aritmetica e algebra","Geometria, dati e probabilità"]},{"name":"Scienze","areas":["Osservare, sperimentare e spiegare"]},{"name":"Inglese","areas":["Comprendere e comunicare"]},{"name":"Seconda lingua comunitaria","areas":["Francese, spagnolo e tedesco"]},{"name":"Tecnologia","areas":["Oggetti, progetti e rappresentazioni"]},{"name":"Arte e immagine","areas":["Osservare, creare e interpretare"]},{"name":"Musica","areas":["Ascoltare, eseguire e conoscere"]},{"name":"Educazione fisica","areas":["Movimento, gioco e conoscenze"]},{"name":"Educazione civica","areas":["Comprendere, discutere e partecipare"]},{"name":"Religione","areas":["Testi, tradizioni e domande"]},{"name":"Attività alternative","areas":["Leggere, confrontarsi e collaborare"]},{"name":"Strumento musicale","areas":["Preparare e suonare un brano"]},{"name":"In tutte le materie","areas":["Organizzare il lavoro e lo studio","Seguire la lezione e prendere appunti"]}],"courses":[{"id":"M02-02","title":"Fare la parafrasi","intro":"Riscrivi una poesia con parole più comuni, mantenendo il significato.","slides":[{"phase":"Preparazione","title":"Riscrivere, mantenendo il significato","text":["Una poesia può usare un ordine insolito delle parole o espressioni che non vanno prese alla lettera. La parafrasi serve a riscrivere quel testo con parole più comuni.","Scriverai in prosa: frasi come quelle di un racconto, senza dover rispettare le righe della poesia. Alla fine controllerai di non aver cambiato il significato."],"visual":{"type":"list","label":"Prepara","items":["Il testo da riscrivere","Un foglio e una penna","Un dizionario o l’aiuto di chi ti accompagna"]},"action":"Scrivi sul foglio il titolo “Parafrasi”. Lascia spazio per il testo originale e per la tua riscrittura.","hint":"Non devi inventare un’altra storia. Immagina di spiegare le stesse informazioni a una persona che fatica a capire le parole della poesia."},{"phase":"Esempio spiegato","title":"Leggiamo due versi","text":["Queste due righe di poesia sono due versi. Le useremo come esempio. Il colle è una collina.","Qui “oro” richiama il colore giallo della luce del sole. Questa informazione ci aiuta a capire l’immagine scelta nella poesia."],"visual":{"type":"quote","label":"Testo originale","text":"D’oro si veste\nil colle al mattino."},"action":"Leggi o ascolta i due versi una volta. Per ora cerca soltanto di immaginare la scena.","hint":"Puoi chiedere all’adulto di leggere. Immagina una collina al mattino: il sole la illumina. Non serve imparare i versi a memoria."},{"phase":"Esempio spiegato","title":"Troviamo di chi si parla","text":["In questa frase, il colle è ciò di cui si dice che “si veste”. In grammatica è il soggetto. Nella poesia arriva dopo il verbo, ma possiamo metterlo all’inizio per rendere la frase più facile da seguire."],"visual":{"type":"quote","label":"Versi da osservare","text":"D’oro si veste\nil colle al mattino."},"action":"Indica le parole “il colle” nel testo. Sono le parole che metteremo all’inizio.","hint":"Chiediti: che cosa “si veste”? La risposta è “il colle”. In altre frasi questa domanda va adattata al verbo: qui serve a seguire questo esempio."},{"phase":"Esempio spiegato","title":"Rimettiamo in ordine le parole","text":["Mettiamo prima “Il colle”, poi “si veste”, poi “d’oro” e infine “al mattino”. Abbiamo cambiato l’ordine; non abbiamo ancora spiegato l’immagine dell’oro."],"visual":{"type":"quote","label":"Prima e dopo","text":"D’oro si veste / il colle al mattino.\n\nIl colle si veste d’oro al mattino."},"action":"Segui con il dito le quattro parti della frase riordinata. Ritrova ciascuna parte nei versi.","hint":"Le parole “al mattino” dicono quando succede la scena. Anche nella parafrasi devono esserci. Puoi spostare le parole, ma tienile tutte."},{"phase":"Esempio spiegato","title":"Spieghiamo l’immagine dell’oro","text":["“Si veste d’oro” è un’espressione figurata. Un’espressione figurata usa un’immagine per dire un’altra cosa. Qui l’immagine è un vestito d’oro. Vuol dire che la luce dorata del sole illumina il colle."],"visual":{"type":"quote","label":"Espressione e significato","text":"Il colle si veste d’oro.\n\nIl colle è illuminato dalla luce dorata del sole."},"action":"Leggi il significato. Immagina se descrive la stessa scena dei versi.","hint":"Per capire un’immagine, guarda le parole vicine. Chiediti: che scena descrive la poesia? Anche il dizionario aiuta. Leggi tutte le definizioni e scegli quella giusta per la scena."},{"phase":"Esempio spiegato","title":"Ricomponiamo una frase completa","text":["Ora mettiamo insieme due cose: il significato dell’immagine e il momento della giornata. Mettiamo “al mattino” all’inizio. Così si capisce subito quando il colle è illuminato."],"visual":{"type":"quote","label":"Originale e parafrasi","text":"D’oro si veste\nil colle al mattino.\n\nAl mattino il colle è illuminato dalla luce dorata del sole."},"action":"Scrivi la parafrasi sotto i versi. Confronta: ci sono ancora il colle, la luce dorata e il mattino?","hint":"La parafrasi può essere più lunga dei versi. Le parole in più servono a spiegare. Aggiungi solo spiegazioni. “Il colle è bello” è un’opinione: nei versi non c’è."},{"phase":"Prova guidata","title":"Quale frase mantiene lo stesso significato?","text":["Prima di scrivere da solo, guarda queste due frasi. Puoi usare parole diverse dai versi. Le informazioni, però, devono restare le stesse."],"visual":{"type":"quote","label":"Originale e due possibilità","text":"D’oro si veste\nil colle al mattino.\n\nA. Al mattino la luce dorata del sole illumina il colle.\nB. Al tramonto la luce dorata del sole illumina il colle."},"action":"Sul foglio scrivi A oppure B. Indica nei versi la parola che ti ha aiutato a scegliere. Avanza per controllare.","hint":"Cerca l’informazione sul momento della giornata. Devi poterla ritrovare anche nella frase che scegli."},{"phase":"Controllo guidato","title":"La parola “mattino” decide il confronto","text":["La frase A mantiene il momento della giornata indicato dal testo. La B lo cambia: “tramonto” è il momento in cui il sole scende sotto l’orizzonte, non il mattino."],"visual":{"type":"quote","label":"Confronto con il testo","text":"D’oro si veste\nil colle al mattino.\n\nA. Al mattino la luce dorata del sole illumina il colle."},"action":"Se avevi scelto B, correggi soltanto l’indicazione del tempo. Hai usato una parola del testo per controllare il significato.","hint":"Due frasi possono sembrare simili e dire cose diverse. Nella parafrasi tieni anche i piccoli dettagli, come il momento o il luogo."},{"phase":"Prova guidata","title":"Proviamo con un altro testo","text":["Adesso userai gli stessi passaggi su questi versi. “Manto” può indicare una copertura; qui è la neve che copre il villaggio.","Quando il testo dice che il villaggio “dorme”, descrive la quiete del luogo: non significa che le case dormano davvero."],"visual":{"type":"quote","label":"La tua prova","text":"Dorme il villaggio\nsotto un manto di neve."},"action":"Copia i versi sul foglio, oppure usa una copia già pronta. Lascia una riga sotto per la parafrasi.","hint":"Se copiare ti fa perdere il filo, chiedi un testo già stampato. Il lavoro da imparare qui è capire e riscrivere il significato."},{"phase":"Prova guidata","title":"Mettiamo il villaggio all’inizio","text":["Questa volta le parole da mettere all’inizio sono “Il villaggio”. Dopo vengono “dorme” e “sotto un manto di neve”. Prima di spiegare le immagini, rendiamo chiaro l’ordine."],"visual":{"type":"quote","label":"Testo da riordinare","text":"Dorme il villaggio\nsotto un manto di neve."},"action":"Completa sul foglio: “Il villaggio …”. Usa tutte le informazioni dei due versi.","hint":"La frase riordinata è “Il villaggio dorme sotto un manto di neve”. Se avevi scritto un ordine diverso, controlla che il significato sia lo stesso."},{"phase":"Prova guidata","title":"Sostituisci le immagini con il significato","text":["Ora trasforma “dorme” in un’espressione che dica che il villaggio è quieto. Trasforma “sotto un manto di neve” in parole che dicano che è coperto di neve."],"visual":{"type":"quote","label":"Informazioni da mantenere","text":"Il villaggio dorme sotto un manto di neve.\n\n“Dorme” → è quieto.\n“Manto di neve” → copertura di neve."},"action":"Scrivi una frase completa sul villaggio. Puoi iniziare con “Il villaggio è …”.","hint":"Prova a unire “è quieto” e “coperto di neve”. Non aggiungere dettagli come l’ora o il numero delle case: i versi non li indicano."},{"phase":"Controllo guidato","title":"Confronta il significato, non le singole parole","text":["Questa è una possibile parafrasi. Anche “Il villaggio è tranquillo e la neve lo ricopre” mantiene il significato. Non è necessario aver scelto le stesse parole del modello."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"Il villaggio è quieto e coperto di neve."},"action":"Controlla la tua frase: parla del villaggio, della quiete e della neve che lo copre? Se manca un’informazione, aggiungila.","hint":"Se hai scritto soltanto “C’è la neve”, manca la quiete del villaggio. Torna all’espressione “dorme” e inserisci anche il suo significato."},{"phase":"Compito nuovo","title":"Adesso scegli tu i passaggi","text":["Usa questo testo nuovo. “Sussurra” significa “parla a voce molto bassa”; qui descrive il rumore leggero del vento tra i rami.","Puoi tenere aperti il testo e questa spiegazione mentre lavori."],"visual":{"type":"quote","label":"Nuovi versi","text":"Tra i rami sussurra\nil vento della sera."},"action":"Sul foglio scrivi la parafrasi. Prima riordina la frase; poi spiega “sussurra”. Vai avanti quando vuoi confrontare il tuo lavoro.","hint":"Chiediti: che cosa produce il suono? Dove? In quale momento? Nel testo trovi “il vento”, “tra i rami” e “della sera”. Tienile tutte nella parafrasi."},{"phase":"Controllo","title":"Leggiamo una soluzione possibile","text":["Il soggetto è “il vento della sera”. L’espressione “sussurra” viene spiegata come un rumore leggero. L’indicazione “tra i rami” rimane nella frase."],"visual":{"type":"quote","label":"Originale e parafrasi","text":"Tra i rami sussurra\nil vento della sera.\n\nIl vento della sera produce un rumore leggero tra i rami."},"action":"Confronta la tua parafrasi con i versi. Se hai scritto “soffia piano tra i rami”, chiediti se risulta chiaro anche il suono leggero descritto dal testo.","hint":"Puoi correggere solo il punto che manca. Per esempio, a “Il vento passa tra i rami” puoi aggiungere “la sera, producendo un rumore leggero”."},{"phase":"Controllo","title":"Riconosci un’aggiunta non presente nel testo","text":["“Il vento spaventoso spezza i rami” cambia la scena: nei versi non si parla né di paura né di rami spezzati. Nella parafrasi spieghiamo le parole del testo, senza inventare altri eventi."],"visual":{"type":"quote","label":"Il testo a cui tornare","text":"Tra i rami sussurra\nil vento della sera."},"action":"Rileggi la tua frase. Cerca eventuali informazioni che non puoi ritrovare o ricavare dai versi. Toglile o discutile con chi ti accompagna.","hint":"Non tutto ciò che immagini leggendo deve entrare nella parafrasi. Le tue impressioni possono servire in un commento personale, che è un lavoro diverso."},{"phase":"Ripresa a casa","title":"Riprendi il metodo sul tuo compito","text":["A casa affronta pochi versi per volta. Tieni sempre davanti l’originale mentre riscrivi.","Se un’immagine resta poco chiara, segnala la parola e chiedi aiuto sul suo significato prima di proseguire."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Leggi o ascolta i versi e chiarisci le parole difficili.","Ricostruisci una frase con un ordine che riesci a seguire.","Spiega le immagini usando il contesto.","Confronta ogni informazione con il testo originale."]},"action":"Scegli i primi versi del compito assegnato e applica la sequenza. Nel Menu trovi la scheda da stampare.","hint":"Per capire se il metodo funziona, scegli una parola della tua parafrasi. Spiega perché l’hai scelta. Se ritrovi nei versi la parola che te l’ha fatta scegliere, stai lavorando bene."}],"coach":{"goal":"Osservare se lo studente ricostruisce e conserva il significato, distinguendo parafrasi e commento. Non richiedere una formulazione identica al modello.","prepare":"Usare i testi originali di questo prototipo, letti insieme. Chiarire prima il lessico necessario. I versi sono stati scritti per l’esercitazione; non sono citazioni di un autore.","observe":"Chiedere “Quale parola dei versi ti ha fatto scrivere questo?”. Se lo studente non risponde, tornare al punto del testo e modellare un solo collegamento, poi proporne un altro allo studente.","adaptations":[["Lettura dei versi — possibile difficoltà con dislessia","Lettura lenta o errori che fanno perdere la scena.","Offrire lettura dell’adulto o sintesi vocale già abituale e mantenere il testo visibile. Verificare se lo studente individua le informazioni ascoltate."],["Scrittura — possibile difficoltà con disgrafia o disortografia","Il significato è spiegato oralmente, ma la scrittura assorbe tutto lo sforzo.","Accettare inizialmente una parafrasi orale o scritta dall’adulto sotto dettatura. Separare il controllo del significato da quello ortografico; mantenere disponibili gli strumenti consueti."]],"sources":["w3c-coga","aiddsa","ciu"]},"print":{"modelTitle":"Esempio commentato","model":["D’oro si veste\nil colle al mattino.","1. Individuo il colle: è ciò di cui si dice che “si veste”.","2. Riordino: “Il colle si veste d’oro al mattino”.","3. Spiego l’immagine: il colle è illuminato dalla luce dorata del sole.","4. Scrivo: “Al mattino il colle è illuminato dalla luce dorata del sole”.","5. Controllo che ci siano il colle, la luce dorata e il mattino."],"practice":[["Prova guidata","Dorme il villaggio\nsotto un manto di neve.\nQui “dorme” indica quiete e “manto” indica copertura. Riordina la frase e spiega le due immagini."],["Compito nuovo","Tra i rami sussurra\nil vento della sera.\nQui “sussurra” descrive il rumore leggero del vento. Riscrivi mantenendo chi, dove e quando."]],"answers":["Prova guidata: “Il villaggio è quieto e coperto di neve”.","Compito nuovo: “Il vento della sera produce un rumore leggero tra i rami”.","Sono possibili parole diverse. Controlla le informazioni, non la corrispondenza parola per parola."],"home":["Leggi pochi versi e chiarisci il lessico.","Riordina la frase; spiega le immagini usando il contesto.","Confronta la riscrittura con l’originale e togli le aggiunte non giustificate."]},"maps":{},"kind":"task","subject":"Italiano","area":"Poesia"},{"id":"M08-08","title":"Risolvere un’equazione","intro":"Trova il numero nascosto e controlla se rende vera l’uguaglianza.","slides":[{"phase":"Preparazione","title":"Troviamo un numero che non conosciamo","text":["Un’equazione è un’uguaglianza che contiene un numero da trovare. Quel numero è indicato con una lettera, chiamata incognita. In questo esempio la lettera è x: cerchiamo il suo valore."],"visual":{"type":"math","label":"Il nostro esempio","lines":["3x + 5 = 20"]},"action":"Prepara foglio, penna e gli strumenti di calcolo che usi di solito. Copia l’equazione lasciando una riga libera sotto.","hint":"Il segno = dice che il valore a sinistra deve essere uguale a quello a destra. Risolvere significa trovare il numero che, messo al posto di x, rende vera questa uguaglianza."},{"phase":"Esempio spiegato","title":"Che cosa vuol dire 3x?","text":["In algebra, 3x significa 3 × x: tre volte il numero x. Quando un numero è attaccato a una lettera, il segno × non si scrive. La moltiplicazione però c’è."],"visual":{"type":"math","label":"Due modi di scrivere la stessa cosa","lines":["3x = 3 × x","Se x fosse 2: 3 × 2 = 6"]},"action":"Indica nell’equazione “3x + 5 = 20” la moltiplicazione e l’addizione. Per ora non devi trovare x.","hint":"“Se x fosse 2” è solo un esempio per leggere 3x. Non è la soluzione della nostra equazione: 3 × 2 + 5 fa 11, non 20."},{"phase":"Esempio spiegato","title":"Leggiamo i due lati dell’uguaglianza","text":["La parte a sinistra di = si chiama primo membro; quella a destra si chiama secondo membro. Qui il primo membro è “3x + 5” e il secondo è “20”."],"visual":{"type":"math","label":"I due membri","lines":["3x + 5     =     20"]},"action":"Sul foglio segna una piccola linea sotto ciascun membro. Il segno = deve restare tra le due parti.","hint":"Un “membro” è semplicemente uno dei due lati dell’equazione. Non devi imparare una procedura diversa: questi nomi servono a parlare delle due parti."},{"phase":"Esempio spiegato","title":"Manteniamo uguali i due lati","text":["Se due quantità sono uguali e togliamo la stessa quantità da entrambe, restano uguali. Useremo questa idea per eliminare il +5 vicino a 3x."],"visual":{"type":"math","label":"Prima osserva con numeri noti","lines":["12 = 12","12 − 5 = 12 − 5","7 = 7"]},"action":"Guarda che −5 è scritto su entrambi i lati. Nell’equazione faremo la stessa operazione ai due membri.","hint":"Se togliessi 5 soltanto da uno dei due 12, avresti 7 = 12, che è falso. Per restare uguali, i due lati devono cambiare allo stesso modo."},{"phase":"Esempio spiegato","title":"Togliamo 5 da entrambi i membri","text":["Vogliamo lasciare 3x senza il +5. Sottrarre 5 elimina quel +5, perché +5 −5 dà zero. Scriviamo −5 anche a destra per mantenere l’uguaglianza."],"visual":{"type":"math","label":"Operazione completa","lines":["3x + 5 = 20","3x + 5 − 5 = 20 − 5"]},"action":"Copia la seconda riga sotto l’equazione. Controlla che ci sia −5 sia a sinistra sia a destra.","hint":"Sottrarre 5 significa togliere 5. L’operazione che annulla un’aggiunta di 5 è proprio una sottrazione di 5."},{"phase":"Esempio spiegato","title":"Semplifichiamo la riga","text":["A sinistra, +5 −5 dà zero e rimane 3x. A destra, 20 −5 dà 15. Ora sappiamo che tre volte x vale 15."],"visual":{"type":"math","label":"Dalla riga completa a quella più semplice","lines":["3x + 5 − 5 = 20 − 5","3x = 15"]},"action":"Scrivi “3x = 15” su una nuova riga, mantenendo il segno = sotto quello precedente.","hint":"Non abbiamo cambiato 3x: abbiamo solo calcolato le parti numeriche che potevamo calcolare. Usare una riga per passaggio aiuta a ritrovare il punto se ti interrompi."},{"phase":"Esempio spiegato","title":"Da tre volte x a una volta x","text":["Per sapere quanto vale una sola x, dividiamo per 3. Dividiamo entrambi i membri per lo stesso numero: così i due lati restano uguali. Si può dividere per qualsiasi numero, tranne lo zero."],"visual":{"type":"math","label":"Divisione su entrambi i lati","lines":["3x = 15","3x ÷ 3 = 15 ÷ 3","x = 5"]},"action":"Scrivi la divisione e poi il risultato. Ora la lettera è da sola: abbiamo trovato x = 5.","hint":"3x è x + x + x. Se queste tre parti uguali valgono in tutto 15, ogni parte vale 15 ÷ 3 = 5. Puoi usare la calcolatrice se il calcolo ostacola il ragionamento."},{"phase":"Esempio spiegato","title":"Controlliamo nell’equazione iniziale","text":["Per verificare il risultato, torniamo all’equazione da cui siamo partiti e mettiamo 5 al posto di x. Prima eseguiamo la moltiplicazione, poi l’addizione."],"visual":{"type":"math","label":"Sostituzione e controllo","lines":["3x + 5 = 20","3 × 5 + 5 = 20","15 + 5 = 20","20 = 20"]},"action":"Controlla che il valore a sinistra sia uguale a quello a destra. Qui 20 = 20 conferma la soluzione.","hint":"Non verificare soltanto l’ultima riga x = 5: devi tornare a 3x + 5 = 20. È l’equazione iniziale a dire se il numero trovato funziona."},{"phase":"Prova guidata","title":"Ora prova con z","text":["La lettera può cambiare: z indica ancora un numero da trovare. Qui abbiamo due volte z, poi aggiungiamo 4.","Prima vogliamo lasciare soltanto 2z a sinistra."],"visual":{"type":"math","label":"La tua equazione","lines":["2z + 4 = 18"]},"action":"Scrivi sotto l’equazione la stessa sottrazione su entrambi i lati, in modo da eliminare +4. Non fare ancora la divisione.","hint":"Per eliminare +4, scrivi −4 a sinistra e −4 a destra. Puoi completare: 2z + 4 − 4 = 18 − 4."},{"phase":"Controllo guidato","title":"Dopo aver tolto 4","text":["Il +4 e il −4 si annullano a sinistra. A destra 18 −4 fa 14. Ora l’equazione dice che due volte z vale 14."],"visual":{"type":"math","label":"Confronta con il tuo passaggio","lines":["2z + 4 − 4 = 18 − 4","2z = 14"]},"action":"Se il tuo passaggio è diverso, controlla prima i due −4, poi il calcolo 18 −4. Correggi il punto che non coincide.","hint":"Se avevi scritto 2z = 18, hai tolto 4 soltanto a sinistra. Scrivi l’operazione anche a destra e calcola di nuovo."},{"phase":"Prova guidata","title":"Lascia z da sola","text":["Da “due volte z” vogliamo arrivare a “una volta z”. Scegli la divisione che lo permette e applicala anche al numero 14."],"visual":{"type":"math","label":"Parti da qui","lines":["2z = 14"]},"action":"Scrivi la divisione su entrambi i membri e poi il valore di z.","hint":"Dividi per 2: 2z ÷ 2 = 14 ÷ 2. A sinistra resta z. A destra puoi calcolare 14 ÷ 2 con il tuo strumento abituale."},{"phase":"Controllo guidato","title":"Verifica il numero trovato","text":["La divisione dà z = 7. Mettiamo 7 al posto di z nell’equazione iniziale. I due lati valgono 18, quindi il risultato funziona."],"visual":{"type":"math","label":"Il controllo completo","lines":["2z + 4 = 18","2 × 7 + 4 = 18","14 + 4 = 18","18 = 18"]},"action":"Confronta il tuo risultato con questo controllo. Indica dove compare il 7 che ha sostituito z.","hint":"Se avevi trovato un numero diverso, sostituiscilo nell’originale. Se i lati non coincidono, torna alla prima riga in cui il tuo lavoro è diverso dal modello."},{"phase":"Compito nuovo","title":"Questa volta c’è una sottrazione","text":["Qui dopo quattro volte y togliamo 7. Per lasciare 4y da solo, scegli l’operazione che annulla −7. Poi continua fino a trovare y."],"visual":{"type":"math","label":"Compito nuovo","lines":["4y − 7 = 13"]},"action":"Risolvi sul foglio, una riga per volta, e verifica nell’equazione iniziale. Vai avanti quando vuoi confrontare il procedimento.","hint":"Per annullare −7 devi aggiungere 7, perché −7 +7 dà zero. Aggiungi 7 a entrambi i membri; poi chiediti come passare da quattro volte y a una volta y."},{"phase":"Controllo","title":"Confronta le operazioni","text":["Aggiungiamo 7 da entrambe le parti. Poi dividiamo entrambi i membri per 4. In questo modo la lettera rimane da sola."],"visual":{"type":"math","label":"Soluzione del compito nuovo","lines":["4y − 7 + 7 = 13 + 7","4y = 20","4y ÷ 4 = 20 ÷ 4","y = 5"]},"action":"Confronta una riga alla volta. Se trovi una differenza, controlla l’operazione scelta e il suo calcolo prima di copiare il risultato.","hint":"Il fatto che anche qui la soluzione sia 5 non dipende dal nome della lettera. Dipende dai numeri di questa equazione: ogni nuova equazione va risolta e controllata."},{"phase":"Controllo","title":"Controlla anche la sottrazione finale","text":["Sostituiamo y con 5 nell’originale. Prima 4 ×5 dà 20. Poi 20 −7 dà 13, uguale al secondo membro."],"visual":{"type":"math","label":"Verifica del compito nuovo","lines":["4y − 7 = 13","4 × 5 − 7 = 13","20 − 7 = 13","13 = 13"]},"action":"Confronta questa verifica con la tua. Se avevi sommato 7 anche qui, torna all’originale: nella verifica rimane il suo −7.","hint":"Le operazioni usate per risolvere non sostituiscono l’equazione da verificare. Il controllo usa sempre la riga iniziale, con tutti i suoi segni."},{"phase":"Controllo","title":"Un errore da riconoscere","text":["Da 3x +5 =20 non possiamo passare a 3x =20 togliendo il +5 solo a sinistra. Nel nuovo passaggio il lato destro dovrebbe diventare 15."],"visual":{"type":"math","label":"Il passaggio da correggere","lines":["3x + 5 = 20","ERRORE: 3x = 20","CORREZIONE: 3x + 5 − 5 = 20 − 5"]},"action":"Spiega sul foglio o a voce quale operazione mancava a destra.","hint":"Riguarda l’esempio numerico: 12 −5 non è uguale a 12. Per lasciare uguali i lati devi togliere la stessa quantità anche al secondo."},{"phase":"Ripresa a casa","title":"Usa una riga per ogni passaggio","text":["Questo metodo funziona con equazioni come quelle che hai visto. C’è una lettera moltiplicata per un numero. Poi c’è un numero aggiunto o tolto.","Alcune equazioni sono diverse: hanno parentesi, frazioni o la lettera da tutte e due le parti. Per quelle, riguarda prima la spiegazione dell’insegnante."],"visual":{"type":"list","label":"Il tuo promemoria","items":["Copia l’equazione e leggi le operazioni vicino alla lettera.","Annulla l’aggiunta o la sottrazione con la stessa operazione sui due membri.","Dividi entrambi i membri per il numero che moltiplica la lettera.","Sostituisci la soluzione nell’originale e confronta i due valori."]},"action":"Scegli un’equazione dello stesso tipo dal compito. Nel Menu puoi stampare esempio, prove e promemoria per casa.","hint":"Puoi tenere aperto il modello. Puoi usare calcolatrice, tavole o formulario, se li usi già a scuola. Quello che conta è scegliere i passaggi e controllarli. Non serve sapere tutto a memoria."}],"coach":{"goal":"Osservare scelta dell’operazione, applicazione ai due membri e verifica nell’originale. Gli esempi riguardano ax+b=c con a positivo e soluzioni intere; non costituiscono un corso completo sulle equazioni.","prepare":"Verificare il significato di moltiplicazione e divisione con un esempio concreto. Se questi prerequisiti non sono disponibili, lavorarci prima di proseguire. Non introdurre la regola “sposta e cambia segno” come scorciatoia priva di spiegazione.","observe":"Far indicare l’operazione sul membro sinistro e su quello destro. Chiedere “Perché questa operazione?”. Distinguere un errore nella scelta da un errore nel calcolo.","adaptations":[["Lettura e allineamento — possibile difficoltà con dislessia o disgrafia","Perdita di un segno, salti di riga, cifre difficili da rileggere.","Fornire l’equazione già scritta, una riga per passaggio e spazio ampio. Leggere a voce i segni. Verificare che la copia resti coerente prima di interpretare un errore come concettuale."],["Calcolo — possibile difficoltà con discalculia","Operazione scelta correttamente, ma calcoli o fatti aritmetici rallentano il procedimento.","Lasciare calcolatrice e tavole già in uso. Far spiegare quale calcolo inserire. Controllare separatamente il ragionamento sui membri e l’esecuzione aritmetica."],["Ortografia — possibile disortografia","Una spiegazione scritta contiene errori di parole ma il procedimento è corretto.","Accogliere anche la spiegazione orale; non usare l’ortografia come indicatore della comprensione dell’uguaglianza."]],"sources":["w3c-coga","aiddsa"],"checks":"I calcoli di questo percorso sono stati controllati con Wolfram e con un calcolo separato. Questo controllo non misura la comprensibilità."},"print":{"modelTitle":"Equazione commentata","model":["3x + 5 = 20. La scrittura 3x significa 3 × x.","1. Tolgo 5 da entrambi i membri: 3x + 5 − 5 = 20 − 5.","2. Calcolo: 3x = 15.","3. Divido entrambi per 3: 3x ÷ 3 = 15 ÷ 3. Quindi x = 5.","4. Verifico nell’originale: 3 × 5 + 5 = 15 + 5 = 20. Il secondo membro è 20: coincidono.","Fare la stessa operazione ai due membri mantiene l’uguaglianza; qui dividiamo per un numero diverso da zero."],"practice":[["Prova guidata","2z + 4 = 18\nPrima annulla +4 sui due membri. Poi dividi entrambi per il numero che moltiplica z. Verifica nell’originale."],["Compito nuovo","4y − 7 = 13\nScegli come annullare −7. Applica l’operazione ai due membri, continua e verifica."]],"answers":["2z + 4 − 4 = 18 − 4 → 2z = 14 → 2z ÷ 2 = 14 ÷ 2 → z = 7. Verifica: 2 × 7 + 4 = 18.","4y − 7 + 7 = 13 + 7 → 4y = 20 → 4y ÷ 4 = 20 ÷ 4 → y = 5. Verifica: 4 × 5 − 7 = 13.","Se il risultato non funziona, controlla una riga alla volta: operazione scelta, presenza sui due membri, calcolo."],"home":["Una riga per passaggio; tieni sempre l’equazione iniziale.","Scegli l’operazione che annulla il numero aggiunto o sottratto.","Applica ogni operazione a entrambi i membri.","Quando la lettera è da sola, verifica nell’originale."]},"maps":{},"kind":"task","subject":"Matematica","area":"Aritmetica e algebra"},{"id":"M21-04","title":"Prendere appunti a due colonne","intro":"Ascolta un’idea, annota poche parole utili e completa gli appunti dopo.","slides":[{"phase":"Preparazione","title":"Appunti che ti aiutino a ritrovare la lezione","text":["Gli appunti servono a ricordare le idee della spiegazione. Basta scrivere le parole più importanti.","In questo percorso preparerai un foglio con due colonne e uno spazio finale. Vedrai prima un esempio; poi farai una breve prova di ascolto con chi ti accompagna."],"visual":{"type":"list","label":"Prepara","items":["Un foglio abbastanza grande e una penna","Una persona che legga la breve spiegazione","Se scrivere è faticoso, una traccia già divisa in colonne"]},"action":"Scrivi in alto “Appunti della lezione”. Chi ti accompagna trova i testi da leggere in Menu → Guida per il professionista.","hint":"Se l’insegnante ti dà uno schema, puoi usare quello. Qui impari un modo possibile. Puoi cambiarlo in base alla velocità della lezione e a quanto riesci a scrivere."},{"phase":"Preparazione","title":"Dividi il foglio in due colonne","text":["Traccia una linea verticale: lascia circa un terzo del foglio a sinistra e due terzi a destra. La colonna più larga servirà per annotare mentre ascolti. Lascia anche qualche riga libera in basso."],"visual":{"type":"notes","questions":[],"notes":[],"focus":null},"action":"Sul foglio scrivi “Domande — dopo” a sinistra, “Appunti — durante” a destra e “In poche parole — dopo” in basso.","hint":"Le misure non devono essere precise. Serve più spazio per gli appunti che per le domande. Puoi stampare la traccia dal Menu se tracciare le linee assorbe troppo tempo."},{"phase":"Esempio spiegato","title":"Durante la spiegazione usa la colonna larga","text":["Mentre ascolti, scrivi solo nella colonna larga. Lì metti le informazioni che vuoi ricordare. Le domande e la frase finale le scrivi dopo."],"visual":{"type":"notes","questions":[],"notes":[],"focus":"notes"},"action":"Indica sul tuo foglio dove scriverai mentre ascolti. Lascia vuote, per ora, la colonna delle domande e le righe finali.","hint":"Così fai una cosa alla volta. “Durante” vuol dire mentre l’insegnante spiega. “Dopo” vuol dire quando la spiegazione è finita, oppure durante una pausa."},{"phase":"Esempio spiegato","title":"Ascolta le parole che annunciano un’idea","text":["A volte chi spiega segnala che cosa sta per dire: “La definizione è…”, “Un esempio è…” oppure “Ci sono due aspetti da ricordare”. Queste parole possono aiutarti a preparare lo spazio per gli appunti."],"visual":{"type":"quote","label":"Un segnale da riconoscere","text":"“Ora vediamo due tipi di fonti storiche: le fonti scritte e le fonti materiali”."},"action":"Sul foglio prepara due righe distinte, una per ciascun tipo di fonte. Non devi annotare anche “Ora vediamo”.","hint":"Queste parole ti dicono che cosa sta per arrivare. Subito dopo, ascolta bene il contenuto. A volte l’insegnante non le usa. Allora chiediti: è un’idea o un esempio? Se non è chiaro, chiedi nella pausa."},{"phase":"Esempio spiegato","title":"Prima ascolta una piccola idea","text":["Immagina che l’insegnante pronunci questa frase. Prima ascoltiamo il suo significato; poi scegliamo che cosa annotare."],"visual":{"type":"quote","label":"Esempio di spiegazione","text":"Le fonti scritte sono testi che danno informazioni sul passato. Una lettera è un esempio di fonte scritta."},"action":"Leggi o ascolta la frase. Individua il nome importante: “fonti scritte”.","hint":"Una fonte storica è una traccia che aiuta a ricostruire il passato. Una lettera scritta da una persona può dare informazioni su ciò che viveva o raccontava."},{"phase":"Esempio spiegato","title":"Scrivi nome, significato ed esempio","text":["Negli appunti scriviamo tre cose. Il nome: “fonti scritte”. Il significato: “testi sul passato”. Un esempio: “lettera”. Usiamo poche parole, unite da frecce. Le frecce mostrano che le tre cose vanno insieme."],"visual":{"type":"notes","title":"Le fonti storiche","questions":[],"notes":["fonti scritte → testi sul passato → lettera"],"focus":null},"action":"Confronta la frase precedente, riportata qui: “Le fonti scritte sono testi che danno informazioni sul passato. Una lettera è un esempio”. Ritrova le tre informazioni negli appunti.","hint":"Una parola chiave è una parola che ti fa tornare in mente un’idea. Se scrivi solo “lettera”, dopo potresti non ricordare di che cosa parlava. Per questo la scriviamo vicino a “fonti scritte”."},{"phase":"Esempio spiegato","title":"Se perdi un pezzo, lascia un segno","text":["Mentre scrivi potresti non sentire un esempio. Metti un punto interrogativo nel punto mancante e torna ad ascoltare: lo completerai quando ci sarà una pausa."],"visual":{"type":"notes","title":"Le fonti storiche","questions":[],"notes":["fonti scritte → testi sul passato → lettera","fonti materiali → oggetti → esempio: ?"],"focus":null},"action":"Guarda “fonti materiali → oggetti → esempio: ?”. Il ? segnala proprio l’esempio da chiedere, non tutta la lezione.","hint":"Le fonti materiali sono oggetti che ci parlano del passato. Se non hai sentito l’esempio, scrivi comunque “oggetti”. Poi metti un ? al posto dell’esempio."},{"phase":"Esempio spiegato","title":"Chiedi il pezzo che manca","text":["Nella pausa puoi fare una domanda precisa: “Qual era l’esempio di fonte materiale?”. Nell’esempio l’insegnante risponde “un vaso”. Sostituiamo il ? con quella parola."],"visual":{"type":"notes","title":"Le fonti storiche","questions":[],"notes":["fonti scritte → testi sul passato → lettera","fonti materiali → oggetti → vaso"],"focus":null},"action":"Individua la parola “vaso” aggiunta negli appunti. Ora ogni riga ha il tipo di fonte, il significato e un esempio.","hint":"Se non c’è una pausa adatta, lascia il ? e chiedi dopo. Puoi confrontare quel punto con il materiale dell’insegnante o con un compagno, senza ricopiare tutta la pagina."},{"phase":"Esempio spiegato","title":"Dopo, costruisci una domanda","text":["La spiegazione è finita. Leggi una riga di appunti e chiediti: “A quale domanda risponde?”. Per la prima riga possiamo scrivere “Che cosa sono le fonti scritte? Un esempio?”."],"visual":{"type":"notes","title":"Le fonti storiche","questions":["Che cosa sono le fonti scritte? Un esempio?"],"notes":["fonti scritte → testi sul passato → lettera","fonti materiali → oggetti → vaso"],"focus":"questions"},"action":"Ora tocca a te. Guarda la seconda riga degli appunti. Scrivi nella colonna stretta una domanda su quella riga. La domanda chiede che cosa sono le fonti materiali e un esempio.","hint":"Una domanda utile ti fa recuperare un’informazione, non soltanto rispondere sì o no. “Ho capito?” non ti dice che cosa ricordare della lezione."},{"phase":"Esempio spiegato","title":"Scrivi il senso generale in una frase","text":["Nello spazio in basso metti insieme le due idee principali. La frase serve a capire di che cosa parlava questa parte di lezione, senza rileggere ogni dettaglio."],"visual":{"type":"notes","title":"Le fonti storiche","questions":["Che cosa sono le fonti scritte? Un esempio?","Che cosa sono le fonti materiali? Un esempio?"],"notes":["fonti scritte → testi sul passato → lettera","fonti materiali → oggetti → vaso"],"summary":"Le fonti storiche possono essere testi oppure oggetti che danno informazioni sul passato.","focus":"summary"},"action":"Leggi la frase finale: contiene sia i testi sia gli oggetti. Non serve riscrivere anche tutti gli esempi.","hint":"“In poche parole” significa una sintesi: una frase breve con l’idea principale. Usa parole semplici."},{"phase":"Prova guidata","title":"Preparati ad ascoltare una nuova spiegazione","text":["Ora prepara un’altra pagina con le stesse zone. Il tema sarà la legenda di una carta geografica: la legenda spiega il significato dei simboli usati sulla carta.","Chi ti accompagna leggerà due brevi parti e farà una pausa tra l’una e l’altra. Il testo “Prova guidata” è nella Guida per il professionista."],"visual":{"type":"notes","questions":[],"notes":[],"focus":null},"action":"Scrivi il titolo “La legenda”. Tieni la penna pronta nella colonna larga. Quando siete pronti, chiedi la lettura della prima parte.","hint":"Puoi concordare una rilettura o una pausa più lunga. Stai imparando a scegliere le informazioni: non è una gara di velocità né una prova di memoria."},{"phase":"Prova guidata","title":"Ascolta e annota la prima idea","text":["Ascolta la prima parte letta dall’adulto. Cerca che cosa fa la legenda. Dopo aver ascoltato, scrivi poche parole nella colonna larga, come negli esempi precedenti."],"visual":{"type":"quote","label":"La domanda da tenere presente","text":"A che cosa serve la legenda di una carta?"},"action":"Annota la risposta con parole tue. Se perdi una parola, lascia un ? e chiedi una rilettura nella pausa.","hint":"Puoi iniziare con “legenda → …”. Non serve una frase elegante: deve restare chiaro a te quale informazione hai ascoltato."},{"phase":"Prova guidata","title":"Aggiungi gli esempi ascoltati","text":["Ora ascolta la seconda parte. Scrivi ogni simbolo insieme al suo significato. La spiegazione si riferisce a una carta precisa: altre carte possono usare simboli differenti."],"visual":{"type":"quote","label":"Che cosa collegare negli appunti","text":"Simbolo → significato in questa carta"},"action":"Aggiungi due righe nella colonna larga. Poi chiedi di chiarire gli eventuali punti segnati con ?.","hint":"Non scrivere soltanto il nome del simbolo. Dopo “linea blu” lascia spazio per dire che cosa indica in questa carta. Fai lo stesso per l’altro simbolo."},{"phase":"Controllo guidato","title":"Confronta le informazioni annotate","text":["Ecco un esempio di appunti per questa spiegazione. Le tue parole possono essere diverse. Controlla una cosa: ogni simbolo è vicino al suo significato?"],"visual":{"type":"quote","label":"Appunti possibili","text":"legenda → spiega i simboli della carta\nlinea blu → fiume\ntriangolo → cima di un monte"},"action":"Confronta le tue righe. Completa soltanto i collegamenti mancanti, senza ricopiare la pagina intera.","hint":"“Triangolo = monte” può bastare nei tuoi appunti se sai spiegare che indica la cima del monte. Chiedi chiarimento se non ricordi che cosa intendevi."},{"phase":"Prova guidata","title":"Completa le zone da usare dopo","text":["La lettura è terminata. Ora puoi aggiungere nella colonna stretta una domanda sulla funzione della legenda e una sui simboli. In basso scrivi l’idea generale in una frase."],"visual":{"type":"quote","label":"Tieni davanti le informazioni","text":"legenda → spiega i simboli della carta\nlinea blu → fiume\ntriangolo → cima di un monte"},"action":"Scrivi domande e frase finale. Poi copri solo gli appunti a destra e prova a rispondere a una domanda. Riapri la colonna per controllare.","hint":"Domanda possibile: “A che cosa serve la legenda?”. Frase finale possibile: “La legenda aiuta a capire che cosa rappresentano i simboli sulla carta”. Non serve coprire nulla se prima hai bisogno di rileggere."},{"phase":"Compito nuovo","title":"Prova con un breve contenuto di scienze","text":["Prepara una nuova pagina: “L’acqua e i suoi stati”. L’adulto leggerà il testo “Compito nuovo” nella propria guida. Questa volta decidi tu dove fare spazio agli esempi.","Dopo l’ascolto potrai chiedere i pezzi mancanti e completare domande e frase finale."],"visual":{"type":"notes","questions":[],"notes":[],"focus":null},"action":"Ascolta, annota le informazioni utili, poi completa le zone “dopo”. Avanza quando vuoi confrontare il risultato.","hint":"Puoi chiedere all’adulto di leggere una frase per volta. Cerca i nomi dei tre stati dell’acqua e un esempio per ciascuno. Mantieni gli strumenti e gli aiuti di scrittura che ti servono."},{"phase":"Controllo","title":"Controlla le coppie, poi usa una domanda","text":["Nei tuoi appunti devono essere riconoscibili tre stati e i rispettivi esempi. Le domande possono chiedere gli stati dell’acqua e un esempio per ciascuno."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"solido → ghiaccio\nliquido → acqua nel bicchiere\naeriforme → vapore acqueo\n\nIn poche parole: l’acqua può presentarsi in tre stati."},"action":"Controlla che nessun esempio sia collegato allo stato sbagliato. Poi usa una tua domanda per spiegare una riga senza leggerla parola per parola.","hint":"“Aeriforme” significa che l’acqua è allo stato di gas. Se la parola è difficile, negli appunti puoi scrivere “gas → vapore acqueo” e aggiungere il termine della lezione dopo."},{"phase":"Ripresa a casa","title":"Rendi gli appunti leggibili prima di studiare","text":["Dopo la scuola, riprendi una breve parte di appunti. Chiarisci i ?, completa i collegamenti mancanti e aggiungi una o due domande utili.","Quando studi, prova a rispondere a una domanda e poi riapri gli appunti per controllare. Se non riesci, rileggi quel punto e riprova."],"visual":{"type":"list","label":"Prima, durante, dopo","items":["Prima: titolo e pagina già preparata.","Durante: ascolta un’idea, annota parole collegate e segnala i vuoti.","Dopo: chiarisci i vuoti, scrivi domande e una frase sul senso generale."]},"action":"Prova questo metodo in una vera lezione a scuola. Decidi con chi ti accompagna quanto scrivere. Inizia da una parte breve della lezione.","hint":"Ascoltare e scrivere insieme può essere faticoso. Allora scrivi di meno. Per esempio, usa una traccia già pronta e aggiungi solo gli esempi. Così riesci a seguire la spiegazione."}],"coach":{"goal":"Insegnare separatamente selezione delle informazioni, scrittura durante l’ascolto e rielaborazione successiva. Il formato è un adattamento didattico a due colonne ispirato a Cornell, non un formato obbligatorio.","prepare":"Concordare pause e riletture. Non mostrare il testo completo allo studente prima della prova di ascolto, se l’ascolto è l’obiettivo; se la lettura di supporto è necessaria, mantenerla e documentare l’aiuto. Aprire questa guida prima della lettura o stamparla; tornando al percorso si mantiene il passaggio.","observe":"Osservare se le note conservano relazioni (nome → significato → esempio), se il ? è collocato dove serve, se le domande permettono di recuperare un’informazione. Non valutare la quantità scritta o la velocità come indicatori unici.","scripts":[{"title":"Prova guidata — parte 1","text":"La legenda di una carta geografica spiega che cosa significano i simboli usati nella carta.","instruction":"Leggere quando il ragazzo è alla schermata “Ascolta e annota la prima idea”. Fare una pausa e rileggere se richiesto."},{"title":"Prova guidata — parte 2","text":"Ci sono due simboli da ricordare. Nella carta che stiamo usando, una linea blu indica un fiume. Un triangolo indica la cima di un monte.","instruction":"Leggere alla schermata “Aggiungi gli esempi ascoltati”. Fare una pausa dopo ogni frase, poi rispondere alle richieste di chiarimento."},{"title":"Compito nuovo — scienze","text":"L’acqua può presentarsi in tre stati: solido, liquido e aeriforme. Il ghiaccio è acqua allo stato solido. L’acqua nel bicchiere è allo stato liquido. Il vapore acqueo è acqua allo stato aeriforme, cioè un gas.","instruction":"Leggere alla schermata “Prova con un breve contenuto di scienze”. Concordare pause in base al carico. Chiarire, se emerge, che il vapore acqueo come gas è invisibile: la nuvoletta visibile contiene piccole gocce."}],"adaptations":[["Scrivere mentre si ascolta — possibile difficoltà con disgrafia o disortografia","Lo studente perde la spiegazione mentre tenta di completare o correggere una parola.","Fornire una traccia parziale, ridurre le parole richieste e rimandare il controllo ortografico. Consentire i supporti consueti. Osservare se conserva più informazioni ascoltate."],["Rilettura — possibile difficoltà con dislessia","Le note molto abbreviate non risultano decifrabili dopo la lezione.","Usare abbreviazioni poche e condivise, parole complete per i termini nuovi, spaziatura ampia. Provare la rilettura subito e dopo una pausa."],["Selezione delle idee — difficoltà trasversale","Annota tutto o solo parole isolate senza collegamenti.","Modellare un’idea alla volta; usare una domanda guida e accettare anche due parole collegate. Non attribuire automaticamente questo comportamento a un DSA."],["Numeri in lezioni future — possibile difficoltà con discalculia","Dati numerici o sequenze di calcolo vengono persi durante la copia.","Fornire dati o passaggi già scritti e far annotare il significato. Questa prova non misura abilità di calcolo."]],"sources":["w3c-coga","cornell","aiddsa","ciu"]},"print":{"modelTitle":"Un esempio di pagina completata","visual":{"type":"notes","title":"Le fonti storiche","questions":["Che cosa sono le fonti scritte? Un esempio?","Che cosa sono le fonti materiali? Un esempio?"],"notes":["fonti scritte → testi sul passato → lettera","fonti materiali → oggetti → vaso"],"summary":"Le fonti storiche possono essere testi oppure oggetti che danno informazioni sul passato.","focus":"summary"},"model":["Durante: nella colonna larga, scrivi nome, significato ed esempio.","Se manca qualcosa: scrivi ? nel punto preciso e chiedi nella pausa.","Dopo: scrivi domande nella colonna stretta e una frase sul senso generale in basso."],"practice":[["Prova guidata — La legenda","Chiedi all’adulto la lettura in due parti. Annota la funzione della legenda e i simboli con i loro significati. Poi aggiungi domande e sintesi."],["Compito nuovo — L’acqua","Chiedi all’adulto la lettura sugli stati dell’acqua. Prepara sul quaderno un’altra pagina a due colonne. Scrivi ogni stato con il suo esempio."]],"blankNotes":true,"answers":["Legenda → spiega i simboli; linea blu → fiume; triangolo → cima di un monte (nella carta descritta).","Acqua: solido → ghiaccio; liquido → acqua nel bicchiere; aeriforme → vapore acqueo.","Una domanda deve permettere di recuperare un’informazione: “Quali sono i tre stati dell’acqua?”."],"home":["Prepara il foglio prima della lezione.","Durante, ascolta una piccola idea e annota parole collegate.","Dopo, completa i ?, le domande e la sintesi.","A casa, prova a rispondere alle domande e controlla negli appunti."]},"maps":{},"kind":"task","subject":"In tutte le materie","area":"Seguire la lezione e prendere appunti"},{"id":"MC-01","title":"Mappa concettuale: la favola","intro":"Collega idee con parole che spieghino la relazione.","maps":{"favola":{"type":"concettuale","nodes":[{"id":"favola","label":"Favola"},{"id":"racconto","label":"Racconto","parent":"favola","link":"è"},{"id":"breve","label":"Breve","parent":"racconto","link":"è"},{"id":"personaggi","label":"Personaggi","parent":"favola","link":"ha"},{"id":"animali","label":"Animali","parent":"personaggi","link":"sono spesso"},{"id":"morale","label":"Morale","parent":"favola","link":"contiene"},{"id":"insegnamento","label":"Insegnamento","parent":"morale","link":"esprime"}],"id":"MC-01-favola"}},"slides":[{"phase":"Preparazione","title":"Una mappa per spiegare i collegamenti","text":["Una mappa concettuale mostra idee e relazioni. Le idee sono scritte nei riquadri; le parole sulle frecce spiegano come si collegano.","Costruiremo una piccola mappa sulla favola. Ti serviranno il testo, un foglio e una penna. Puoi usare un foglio in orizzontale per avere spazio."],"visual":{"type":"quote","label":"Che cosa imparerai a fare","text":"Leggere due riquadri e una freccia come una frase che ha senso."},"action":"Scrivi sul foglio “Mappa concettuale — la favola”. Lascia spazio sotto.","hint":"Un concetto è un’idea che vogliamo rappresentare, come “favola” o “personaggi”. Non serve mettere ogni parola del testo in un riquadro."},{"phase":"Preparazione","title":"Prima capiamo il testo","text":["Leggi o ascolta questo testo. La morale è l’insegnamento che una storia suggerisce sul modo di comportarsi. Può essere scritto oppure ricavato dagli eventi."],"visual":{"type":"quote","label":"Il testo di partenza","text":"La favola è un racconto breve. I personaggi sono spesso animali che parlano e si comportano come persone. La storia contiene un insegnamento sui comportamenti: questo insegnamento si chiama morale. A volte la morale è scritta chiaramente; altre volte il lettore la ricava da ciò che accade."},"action":"Indica nel testo che cosa si dice sulla lunghezza, sui personaggi e sulla morale. Per ora non disegnare i collegamenti.","hint":"“Spesso” vuol dire “molte volte”. Molte favole hanno animali come personaggi, ma alcune no. Per questo nella mappa scriveremo anche la parola “spesso”."},{"phase":"Preparazione","title":"Scegli parole che ti ricordano l’idea","text":["Osserva la frase “La favola è un racconto breve”. Per ricordare che tipo di testo è, teniamo “racconto”. Per ricordare la sua lunghezza, teniamo “breve”. Sono parole chiave perché ci aiutano a ricostruire l’informazione."],"visual":{"type":"quote","label":"Dalla frase alle parole utili","text":"La favola è un racconto breve.\n\nTipo di testo → racconto\nLunghezza → breve"},"action":"Scrivi “racconto breve” sul foglio. Poi prova a usarlo per dire la frase completa.","hint":"Le altre parole della frase servono ancora. Nella mappa concettuale le scriviamo sulle frecce. Nella mappa mentale le diciamo a voce quando spieghiamo."},{"phase":"Preparazione","title":"Distingui il gruppo dal suo dettaglio","text":["In questa frase, “personaggi” è il gruppo di cui si parla. Le parole successive dicono qualcosa di più su quel gruppo. Prima di disegnare la mappa, cerca l’informazione da tenere."],"visual":{"type":"quote","label":"La frase da esaminare","text":"I personaggi sono spesso animali che parlano e si comportano come persone."},"action":"Sul foglio scrivi “Personaggi”. Accanto, annota poche parole che dicano chi sono spesso. Tieni davanti la frase e poi avanza per controllare.","hint":"Chiediti: che tipo di personaggi descrive questa frase? C’è una parola che evita di dire “tutti” o “sempre”? Scrivila anche nella tua nota."},{"phase":"Controllo della preparazione","title":"“Spesso animali” mantiene una precisazione","text":["Una nota possibile è “Personaggi → spesso animali”. “Personaggi” indica il gruppo; “spesso animali” aggiunge un dettaglio. La parola “spesso” tiene il significato del testo: molte volte, non sempre."],"visual":{"type":"quote","label":"Frase e nota","text":"I personaggi sono spesso animali che parlano e si comportano come persone.\n\nPersonaggi → spesso animali"},"action":"Confronta la tua nota. Se hai scritto solo “animali”, aggiungi “spesso”. Potrai aggiungere in seguito anche il dettaglio su come parlano e agiscono.","hint":"In ogni riquadro bastano poche parole. Aggiungi i dettagli uno alla volta. Mettili sempre vicino al gruppo di cui parlano."},{"phase":"Esempio spiegato","title":"Scegliamo a quale domanda rispondere","text":["Una domanda ti aiuta a scegliere che cosa mettere nella mappa. La nostra domanda riguarda tutte le favole. Vogliamo dire come sono fatte: le loro caratteristiche."],"visual":{"type":"quote","label":"La domanda della nostra mappa","text":"Quali caratteristiche ha una favola?"},"action":"Scrivi questa domanda sopra lo spazio della mappa. Ti servirà per controllare se i collegamenti rispondono al compito.","hint":"Se la domanda fosse “Che cosa accade nella favola letta oggi?”, servirebbero invece gli eventi di quella storia. Prima di scegliere i riquadri, chiarisci quale domanda hai davanti."},{"phase":"Esempio spiegato","title":"Partiamo dall’idea principale","text":["Il testo comincia con “La favola è un racconto breve”. La prima idea è “favola”: sarà il punto da cui partire per leggere gli altri collegamenti."],"visual":{"type":"map","map":"favola","show":1},"action":"Disegna un riquadro con la parola “Favola” nella parte alta del foglio.","hint":"Un riquadro aiuta a vedere dove finisce un’idea e comincia un’altra. Basta una forma semplice: non serve decorarlo."},{"phase":"Esempio spiegato","title":"La freccia deve dire qualcosa","text":["Dal testo ricaviamo due idee, “favola” e “racconto”. La parola “è” scritta sulla freccia esprime il collegamento. Leggendo tutto otteniamo: “La favola è un racconto”."],"visual":{"type":"map","map":"favola","show":2},"action":"Sotto “Favola”, disegna “Racconto”. Traccia una freccia dal primo riquadro al secondo e scrivi “è” vicino alla freccia.","hint":"Una freccia senza parole non spiega se un’idea è un esempio, una parte o una causa dell’altra. Qui “è” permette di leggere una frase precisa."},{"phase":"Esempio spiegato","title":"Aggiungiamo il dettaglio “breve”","text":["La stessa frase del testo dice che il racconto è breve. Aggiungiamo questa informazione sotto “Racconto”, con un’altra freccia e un’altra parola “è”."],"visual":{"type":"map","map":"favola","show":3},"action":"Disegna “Breve” sotto “Racconto” e collega con “è”. Leggi: “Il racconto è breve”.","hint":"Puoi scegliere anche un solo riquadro “Racconto breve”. Qui li separiamo per imparare a esprimere una relazione. Una mappa non deve avere un numero obbligatorio di riquadri."},{"phase":"Esempio spiegato","title":"Costruiamo il ramo dei personaggi","text":["Il testo dice: “I personaggi sono spesso animali”. Dal riquadro “Favola” parte un nuovo collegamento: la favola ha personaggi. Da “Personaggi” continuiamo con “sono spesso” verso “Animali”."],"visual":{"type":"map","map":"favola","show":5},"action":"Aggiungi questo ramo accanto a quello sul racconto. Mantieni la parola “spesso” sulla seconda freccia.","hint":"Un ramo è una parte della mappa che parte da un riquadro e aggiunge informazioni. Sulla freccia scriviamo “sono spesso”, come nel testo. “Sono animali” direbbe che tutti i personaggi sono animali: non è vero."},{"phase":"Esempio spiegato","title":"Colleghiamo morale e insegnamento","text":["La favola ha una morale. La morale è un insegnamento su come comportarsi. Aggiungiamo due collegamenti. Il primo: “La favola contiene una morale”. Il secondo: “La morale esprime un insegnamento”."],"visual":{"type":"map","map":"favola","show":7},"action":"Aggiungi il ramo della morale. Poi leggilo come due frasi complete.","hint":"Una morale può essere lasciata da ricavare al lettore: “contiene” non significa che nel libro ci sia sempre una frase finale già scritta. Il testo di partenza lo precisa."},{"phase":"Controllo dell’esempio","title":"Leggiamo la mappa completa","text":["Ora puoi seguire tre percorsi. Ogni volta parti da “Favola” e leggi riquadri e parole sulle frecce. La mappa riassume alcune caratteristiche: il testo resta disponibile per i dettagli."],"visual":{"type":"map","map":"favola","show":7},"action":"Scegli un ramo e spiegalo a voce. Controlla nel testo: “favola = racconto breve; personaggi spesso animali; morale = insegnamento sui comportamenti”.","hint":"Se riesci solo a elencare “favola, personaggi, animali”, prova a inserire le parole delle frecce: “La favola ha personaggi. I personaggi sono spesso animali”."},{"phase":"Prova guidata","title":"Ricostruisci un collegamento sul foglio","text":["Ora prova a costruire tu il ramo della morale senza copiare la mappa completa. Hai qui la frase del testo che ti serve e le idee da collegare."],"visual":{"type":"quote","label":"La frase da usare","text":"La storia contiene un insegnamento sui comportamenti: questo insegnamento si chiama morale.\n\nIdee disponibili: Favola — Morale — Insegnamento."},"action":"Su una parte libera del foglio disegna i tre riquadri. Scrivi sulle due frecce parole che permettano di leggere frasi sensate.","hint":"Puoi iniziare con “La favola contiene …”. Poi chiediti che cosa esprime la morale. Le parole sulle frecce si chiamano parole-legame. Sceglile pensando al testo: devono dire come sono collegate le due idee."},{"phase":"Controllo guidato","title":"Controlla le tue due frasi","text":["Ecco un ramo possibile. Anche altre parole vanno bene, per esempio “La favola propone una morale” o “La morale è un insegnamento”. Controlla che ogni freccia si legga come una frase vera per il testo."],"visual":{"type":"quote","label":"Un ramo possibile","text":"Favola → contiene → Morale\nMorale → esprime → Insegnamento"},"action":"Leggi il tuo ramo, includendo le parole sulle frecce. Se una frase resta incompleta, modifica la parola-legame.","hint":"“Favola → morale → insegnamento”, senza parole sulle frecce, lascia al lettore il compito di indovinare i collegamenti. Aggiungi ciò che diresti a voce tra le idee."},{"phase":"Compito nuovo","title":"Costruisci una mappa da un testo diverso","text":["Ora cambia l’argomento. La domanda è: “Quali caratteristiche ha il racconto d’avventura?”.","Leggi il testo e scegli tre aspetti da rappresentare: impresa, protagonista e luoghi. Puoi tenere il testo davanti mentre lavori."],"visual":{"type":"quote","label":"Testo per il compito nuovo","text":"Il racconto d’avventura racconta un’impresa rischiosa. Il protagonista affronta pericoli e ostacoli. I luoghi possono essere lontani o sconosciuti. Gli eventi creano attesa: il lettore vuole scoprire come finirà l’impresa."},"action":"Scrivi in alto la domanda e disegna il primo riquadro “Racconto d’avventura”.","hint":"Un’impresa è un’azione impegnativa da portare a termine. Il protagonista è il personaggio principale. Un ostacolo è qualcosa che rende difficile proseguire."},{"phase":"Compito nuovo","title":"Ora collega le idee scelte","text":["Parti da “Racconto d’avventura” e costruisci i tre rami. Per ogni freccia, cerca parole che facciano leggere una frase completa. Aggiungi almeno un dettaglio per ramo."],"visual":{"type":"quote","label":"Tieni a disposizione il testo","text":"Il racconto d’avventura racconta un’impresa rischiosa. Il protagonista affronta pericoli e ostacoli. I luoghi possono essere lontani o sconosciuti. Gli eventi creano attesa: il lettore vuole scoprire come finirà l’impresa."},"action":"Disegna la mappa sul foglio. Quando hai finito, leggi ogni collegamento e confrontalo con il testo. Avanza per vedere un possibile controllo.","hint":"Per il primo ramo puoi chiederti: che cosa racconta il racconto d’avventura? Un’impresa. Com’è l’impresa? Rischiosa. Usa lo stesso ragionamento sugli altri due aspetti."},{"phase":"Controllo","title":"Confronta le relazioni della tua mappa","text":["Ecco alcune frasi da ritrovare nella tua mappa. La tua mappa può essere disegnata in modo diverso. Puoi unire due riquadri o tenerli separati. L’importante è che il significato sia chiaro."],"visual":{"type":"list","label":"Frasi da ritrovare","items":["Il racconto d’avventura racconta un’impresa rischiosa.","Il racconto d’avventura ha un protagonista che affronta pericoli e ostacoli.","Il racconto d’avventura può svolgersi in luoghi lontani o sconosciuti."]},"action":"Controlla un ramo alla volta. Tieni parole come “può”. Il testo dice che i luoghi possono essere sconosciuti, non che lo sono sempre.","hint":"In questa prova abbiamo scelto tre aspetti. Il testo dice anche che gli eventi creano attesa. Se ti serve, puoi aggiungere un quarto ramo. Aggiungi solo ciò che ti aiuta a spiegare."},{"phase":"Ripresa a casa","title":"Parti dalla domanda, poi costruisci un ramo","text":["Sul compito di casa scrivi prima a quale domanda vuoi rispondere. Leggi un breve tratto di testo e costruisci un ramo; poi passa al successivo.","Una mappa funziona se ti aiuta a spiegare collegamenti e a ritrovare informazioni. Se non riesci a leggerla, riduci o riorganizza quel punto."],"visual":{"type":"list","label":"Il metodo da riprendere","items":["Scegli la domanda e tieni davanti il testo.","Individua poche idee utili alla domanda.","Collegale con parole che formino frasi.","Controlla ogni relazione nel testo e prova a spiegarla."]},"action":"Prova su un breve paragrafo del tuo libro. Nel Menu trovi la scheda da stampare con esempio e traccia.","hint":"A volte una freccia può unire due rami diversi. Aggiungila solo se sai spiegare il collegamento. In una mappa piccola puoi farne a meno."}],"coach":{"prepare":"Tenere disponibile il testo mentre si costruisce la mappa. Leggerlo insieme e verificare “morale” come insegnamento sui comportamenti. La disposizione proposta è un esempio, non uno schema da imporre a tutti i testi.","adaptations":[["Leggere e scegliere informazioni — possibile difficoltà con dislessia","Il carico di lettura impedisce di ritrovare la frase a cui collegare un nodo.","Leggere ad alta voce o usare la sintesi vocale abituale, una frase per volta. Lasciare il testo visibile e far indicare quale informazione viene rappresentata."],["Scrivere e disporre i nodi — possibile difficoltà con disgrafia","Lo studente sa spiegare i collegamenti ma perde spazio o non riesce a rileggere le etichette.","Offrire riquadri già pronti o cartellini mobili. Chiedere allo studente di scegliere e collegare; non sostituirsi nella decisione sul significato."],["Ortografia — possibile difficoltà con disortografia","La ricerca della grafia corretta interrompe ogni scelta concettuale.","Consentire copia del termine dal testo o etichette predisposte. Controllare prima i collegamenti e poi, separatamente, l’ortografia."],["Sovraccarico visivo — difficoltà trasversale","Molti rami rendono difficile ritrovare il punto di partenza.","Costruire un ramo alla volta, distanziare le parti e verificare se lo studente riesce a spiegare un percorso. La difficoltà non implica un DSA specifico."]],"sources":["w3c-coga","novak","aiddsa","ciu"],"goal":"Osservare se le parole-legame esprimono relazioni controllabili nel testo. Non confondere la qualità della mappa con la somiglianza grafica al modello.","observe":"Far leggere una proposizione completa per ramo e indicare la frase del testo che la sostiene. Il collegamento “sono spesso” conserva una qualificazione importante. La mappa semplificata non rappresenta ogni dettaglio né introduce obbligatoriamente legami trasversali."},"print":{"modelTitle":"Mappa concettuale — esempio","visual":{"type":"map","map":"favola","show":7},"model":["Domanda: quali caratteristiche ha una favola?","La favola è un racconto breve. I personaggi sono spesso animali che parlano e si comportano come persone. La storia contiene un insegnamento sui comportamenti: questo insegnamento si chiama morale. A volte la morale è scritta chiaramente; altre volte il lettore la ricava da ciò che accade.","Leggi ogni coppia di riquadri con la parola sulla freccia: “La favola è un racconto”. Poi: “Il racconto è breve”."],"practice":[["Prova guidata","Ricostruisci il ramo Favola — Morale — Insegnamento. Scegli parole sulle frecce che formino frasi coerenti: la favola contiene una morale, cioè un insegnamento."],["Compito nuovo","Il racconto d’avventura racconta un’impresa rischiosa. Il protagonista affronta pericoli e ostacoli. I luoghi possono essere lontani o sconosciuti. Gli eventi creano attesa: il lettore vuole scoprire come finirà l’impresa.\nDomanda: quali caratteristiche ha il racconto d’avventura? Disegna tre rami: impresa, protagonista, luoghi. Aggiungi parole-legame e dettagli."]],"answers":["Ramo guidato: Favola → contiene → Morale → esprime → Insegnamento.","Avventura: racconta un’impresa rischiosa; ha un protagonista che affronta pericoli e ostacoli; può svolgersi in luoghi lontani o sconosciuti.","Sono possibili altre disposizioni. Controlla che ogni collegamento si possa leggere come una frase e sia sostenuto dal testo."],"home":["Scrivi la domanda a cui vuoi rispondere.","Scegli le idee utili per la domanda e collega un ramo alla volta.","Metti parole sulle frecce; tieni parole come “spesso” o “può”.","Rileggi nel testo e spiega i collegamenti a voce."]},"kind":"map","subject":"Italiano","area":"Mappa concettuale","mapType":"Mappa concettuale","topic":"La favola","language":null},{"id":"MM-01","title":"Mappa mentale: la favola","intro":"Metti un tema al centro e organizza le informazioni in rami.","maps":{"favola":{"type":"mentale","nodes":[{"id":"favola","label":"Favola"},{"id":"storia","label":"Storia","parent":"favola"},{"id":"breve","label":"Breve","parent":"storia"},{"id":"personaggi","label":"Personaggi","parent":"favola"},{"id":"animali","label":"Spesso animali","parent":"personaggi"},{"id":"messaggio","label":"Messaggio","parent":"favola"},{"id":"morale","label":"Morale","parent":"messaggio"}],"id":"MM-01-favola"}},"slides":[{"phase":"Preparazione","title":"Una mappa per organizzare le informazioni","text":["Una mappa mentale parte da un tema al centro. I rami raccolgono aspetti del tema, come cartelline in cui mettere informazioni vicine per significato.","Costruiremo una mappa sulla favola con parole brevi ma comprensibili. Prepara un foglio in orizzontale e una penna. I colori sono facoltativi."],"visual":{"type":"quote","label":"Che cosa imparerai a fare","text":"Trovare il ramo giusto e usarlo per ricordare e spiegare un’informazione."},"action":"Scrivi sul foglio “Mappa mentale — la favola” e lascia libero il centro.","hint":"Nella mappa mentale i rami mettono insieme informazioni simili. Sulle linee non scrivi parole. Quando spieghi la mappa, però, devi saper dire che cosa vuol dire ogni parola."},{"phase":"Preparazione","title":"Leggiamo prima di disegnare","text":["Leggi o ascolta questo testo. La morale è l’insegnamento sui comportamenti suggerito dalla storia. Può essere dichiarato oppure lasciato da ricavare al lettore."],"visual":{"type":"quote","label":"Il testo di partenza","text":"La favola è un racconto breve. I personaggi sono spesso animali che parlano e si compo
