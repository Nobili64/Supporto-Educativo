i di una poesia","intro":"Raccogli le immagini di una poesia e usale per proporre un tema e un’emozione, con prove dal testo.","slides":[{"phase":"Preparazione","title":"Che cosa ti fa vedere e sentire una poesia","text":["Una poesia crea immagini: cose che ti fa vedere, sentire, toccare, perfino annusare. Le immagini sono gli indizi per capire il tema e l’emozione della poesia.","In questo percorso parti sempre dalle immagini. Solo dopo proponi un tema e un’emozione, con le prove."],"visual":{"type":"list","label":"Prepara","items":["La poesia stampata","Una matita e alcuni colori","Un foglio diviso in tre parti: Immagini, Tema, Emozione"]},"action":"Dividi il foglio in tre parti con due linee. Scrivi i titoli: Immagini, Tema, Emozione.","hint":"Partire dalle immagini ti aiuta a restare vicino al testo. Ogni idea che scrivi avrà una prova: una parola della poesia."},{"phase":"Preparazione","title":"Le immagini passano dai sensi","text":["Per trovare le immagini, usa i cinque sensi. Per ogni verso chiediti: che cosa vedo? Che cosa sento? Che cosa tocco o annuso?","Anche un movimento è un’immagine: qualcosa che corre, cade, vola."],"visual":{"type":"table","label":"I cinque sensi","columns":["Senso","Domanda","Esempio"],"rows":[["Vista","Che cosa vedo? Che colori?","un cielo rosso"],["Udito","Che suoni sento?","una campana lontana"],["Tatto","È caldo, freddo, ruvido?","la sabbia che scotta"],["Olfatto","Che profumo o odore c’è?","l’odore dell’erba tagliata"],["Gusto","Che sapore c’è?","il sale sulle labbra"]]},"action":"Leggi la tabella. Per ogni senso, pensa a voce a un’immagine della tua giornata.","hint":"Spesso una poesia usa soprattutto la vista e l’udito. Se un senso manca, lascia vuota quella riga."},{"phase":"Esempio spiegato","title":"Leggiamo la poesia","text":["Ecco la poesia dell’esempio. Leggila una volta, o ascoltala, e immagina la scena come in un film."],"visual":{"type":"quote","label":"Poesia","text":"Sulla spiaggia ormai deserta\nrestano gli ombrelloni chiusi.\nIl vento porta via le orme\ndei giochi di agosto.\nSolo un gabbiano grida\nsopra il mare grigio."},"action":"Leggi o ascolta la poesia. Poi chiudi gli occhi e racconta a voce che cosa vedi.","hint":"Le orme sono i segni lasciati dai piedi sulla sabbia. Il gabbiano è un uccello di mare. Se una parola non è chiara, chiedila prima di continuare."},{"phase":"Esempio spiegato","title":"Raccogliamo le immagini per senso","text":["Rileggiamo verso per verso e mettiamo ogni immagine accanto al suo senso. Scriviamo le parole della poesia tra virgolette.","In questa poesia ci sono soprattutto immagini da vedere, poi un suono e un movimento."],"visual":{"type":"table","label":"Le immagini della poesia","columns":["Senso","Immagini"],"rows":[["Vista","“spiaggia ormai deserta”, “ombrelloni chiusi”, “mare grigio”"],["Udito","“un gabbiano grida”"],["Movimento","“Il vento porta via le orme”"]]},"action":"Scrivi le immagini nella parte Immagini del tuo foglio. Usa un colore diverso per ogni senso.","hint":"Copia solo le parole che servono, non tutto il verso. Per “ombrelloni chiusi” bastano queste due parole: dicono che cosa vedi e com’è."},{"phase":"Esempio spiegato","title":"Cerchiamo che cosa hanno in comune","text":["Ora guardiamo tutte le immagini insieme. Vanno nella stessa direzione? Qui molte parlano di qualcosa che è finito o che se ne va.","La spiaggia è deserta, gli ombrelloni sono chiusi, il vento porta via le orme. Anche il mare è grigio, senza i colori dell’estate."],"visual":{"type":"list","label":"Parole che vanno nella stessa direzione","items":["deserta","chiusi","porta via","grigio"]},"action":"Cerchia con lo stesso colore le immagini che parlano di fine o di vuoto.","hint":"Domanda guida: se dovessi dare un titolo a tutte queste immagini insieme, quale sarebbe? Per esempio: “Tutto è finito”."},{"phase":"Esempio spiegato","title":"Proponiamo il tema","text":["Il tema è l’idea generale della poesia. Si scrive con poche parole: “l’amicizia”, “la paura del buio”, “il passare del tempo”.","Qui le immagini parlano di una spiaggia vuota dopo “i giochi di agosto”. Un tema possibile è la fine dell’estate."],"visual":{"type":"quote","label":"Tema e prove","text":"Tema: la fine dell’estate.\n\nProve: “spiaggia ormai deserta”, “ombrelloni chiusi”, “i giochi di agosto”."},"action":"Scrivi il tema nella parte Tema. Sotto, copia almeno due prove tra virgolette.","hint":"La parola “ormai” è un indizio importante: vuol dire che qualcosa è già successo. “Agosto” ci dice di quale stagione si parla."},{"phase":"Esempio spiegato","title":"Proponiamo l’emozione","text":["L’emozione della poesia è l’atmosfera che le immagini creano: allegria, malinconia, paura, calma. La malinconia è una tristezza leggera, per qualcosa che è passato.","Qui l’emozione è la malinconia. La mostrano il vuoto, il mare grigio e il grido del gabbiano solo."],"visual":{"type":"quote","label":"Emozione e prove","text":"Emozione: malinconia.\n\nProve: “mare grigio”, “Solo un gabbiano grida”, “porta via le orme”."},"action":"Scrivi l’emozione nella sua parte del foglio. Sotto, copia due prove tra virgolette.","hint":"L’emozione della poesia può essere diversa dalla tua. A te la fine dell’estate può piacere, perché rivedi gli amici. Qui però scrivi l’emozione che creano le immagini del testo."},{"phase":"Esempio spiegato","title":"Scriviamo la frase finale","text":["Ora uniamo tutto in una o due frasi. Dentro ci sono il tema, l’emozione e le prove.","Usiamo parole come “sembra” o “può”: è la nostra interpretazione, cioè la nostra spiegazione del testo."],"visual":{"type":"quote","label":"Frase finale","text":"La poesia parla della fine dell’estate. Le immagini della spiaggia deserta e degli ombrelloni chiusi creano un’atmosfera malinconica. Il mare grigio la rende ancora più forte."},"action":"Scrivi la tua frase finale in fondo al foglio. Controlla che ci siano tema, emozione e almeno due prove.","hint":"Puoi usare questo schema: “La poesia parla di … Le immagini … e … creano un’atmosfera …”. Riempi gli spazi con quello che hai già scritto nelle tre parti."},{"phase":"Prova guidata","title":"Prova tu: raccogli le immagini","text":["Ecco una nuova poesia. Questa volta ci sono anche un profumo e qualcosa da toccare. Raccogli le immagini per senso."],"visual":{"type":"quote","label":"Poesia","text":"Nella cucina della nonna\nil forno è caldo e profuma di pane.\nSulla tavola, piatti e bicchieri\naspettano tutta la famiglia.\nDalla porta arrivano voci e risate."},"action":"Sul foglio fai una tabella con i sensi. Scrivi le immagini tra virgolette accanto al senso giusto.","hint":"Leggi un verso alla volta. “Profuma” riguarda il naso: è olfatto. “Caldo” si sente con la pelle: è tatto. Poi cerca che cosa si vede e che cosa si sente."},{"phase":"Controllo guidato","title":"Confronta le immagini","text":["Ecco le immagini divise per senso. Puoi averle scritte con meno parole: va bene, se il senso è giusto."],"visual":{"type":"table","label":"Le immagini della poesia","columns":["Senso","Immagini"],"rows":[["Vista","“piatti e bicchieri” sulla tavola"],["Tatto","“il forno è caldo”"],["Olfatto","“profuma di pane”"],["Udito","“voci e risate”"]]},"action":"Confronta con la tua tabella. Se manca un’immagine, aggiungila con il colore del suo senso.","hint":"“Aspettano tutta la famiglia” è una personificazione: i piatti non aspettano davvero. Però ci fa immaginare una tavola pronta. Puoi metterla nella vista."},{"phase":"Prova guidata","title":"Prova tu: tema ed emozione","text":["Ora guarda le immagini insieme. Che cosa hanno in comune? Poi proponi un tema e un’emozione, con due prove ciascuno."],"visual":{"type":"quote","label":"Poesia","text":"Nella cucina della nonna\nil forno è caldo e profuma di pane.\nSulla tavola, piatti e bicchieri\naspettano tutta la famiglia.\nDalla porta arrivano voci e risate."},"action":"Scrivi tema, emozione e prove nelle parti del foglio. Poi scrivi una frase finale.","hint":"Calore, profumo di pane, tavola pronta, voci e risate. Di che momento si tratta? Chi sta arrivando? Come ci si sente in un momento così?"},{"phase":"Controllo guidato","title":"Confronta tema ed emozione","text":["Un tema possibile è la famiglia che si ritrova. Un’emozione possibile è la gioia, o un senso di calore e di festa.","Le tue parole possono essere diverse. Controlla che ci siano almeno due prove per ciascuno."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"Tema: la famiglia che si ritrova.\nProve: “aspettano tutta la famiglia”, “voci e risate”.\n\nEmozione: gioia, calore.\nProve: “il forno è caldo”, “profuma di pane”, “risate”."},"action":"Confronta il tuo lavoro. Per ogni idea, indica nella poesia le parole che la sostengono.","hint":"Se hai scritto come tema “la cucina”, hai scritto il luogo. Il tema è un’idea: che cosa succede di importante in quella cucina?"},{"phase":"Compito nuovo","title":"Ora una poesia tutta da interpretare","text":["Ecco l’ultima poesia. Fai tutto da solo: immagini per senso, che cosa hanno in comune, tema, emozione e frase finale.","Leggi fino all’ultimo verso prima di decidere."],"visual":{"type":"quote","label":"Poesia","text":"Il temporale è passato.\nDalle grondaie cadono\nle ultime gocce, una alla volta.\nTra le nuvole si apre\nuna striscia di azzurro."},"action":"Completa le tre parti del foglio e la frase finale. Vai avanti quando vuoi confrontare.","hint":"Le grondaie sono i canali sul bordo del tetto, dove scorre l’acqua della pioggia. Guarda le parole “passato” e “ultime”: che cosa dicono del temporale?"},{"phase":"Controllo","title":"Confronta il tuo lavoro","text":["Le immagini dicono che la pioggia sta finendo: “è passato”, “le ultime gocce”. Poi arriva il colore: “una striscia di azzurro”.","Un tema possibile è la calma che torna dopo il temporale. Un’emozione possibile è il sollievo, o una serenità che ritorna."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"Immagini: “le ultime gocce, una alla volta” (movimento); “una striscia di azzurro” (vista).\n\nFrase finale: La poesia parla della calma che torna dopo il temporale. Le ultime gocce e la striscia di azzurro creano un’atmosfera serena, di sollievo."},"action":"Confronta la tua frase finale. Controlla che tema ed emozione abbiano almeno due prove.","hint":"Il sollievo è la sensazione di quando finisce una cosa difficile o paurosa. Anche “speranza” va bene, se la colleghi alla striscia di azzurro."},{"phase":"Controllo","title":"Un errore da riconoscere","text":["Guarda questa risposta: “La poesia è triste perché parla di pioggia”. Usa una sola immagine e lascia fuori le altre.","La pioggia c’è, però sta finendo. Alla fine si apre l’azzurro. Le immagini, tutte insieme, vanno verso la calma."],"visual":{"type":"quote","label":"Risposta da correggere","text":"Errore: La poesia è triste perché parla di pioggia.\n\nCorrezione: La poesia parla della fine di un temporale. “Le ultime gocce” e “una striscia di azzurro” creano un’atmosfera di calma."},"action":"Rileggi la tua frase finale. Hai usato immagini di tutta la poesia, anche dell’ultimo verso? Se mancano, aggiungile.","hint":"Prima di decidere l’emozione, rileggi l’ultimo verso. Spesso la fine di una poesia cambia o chiarisce l’atmosfera."},{"phase":"Ripresa a casa","title":"Prima le immagini, poi le idee","text":["A casa usa sempre lo stesso ordine: prima le immagini, poi che cosa hanno in comune, infine tema ed emozione.","Ogni idea ha bisogno di una prova tra virgolette. Se non trovi prove, cambia idea o chiedi aiuto."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Leggi la poesia e immagina la scena.","Raccogli le immagini per senso.","Cerca che cosa hanno in comune.","Proponi tema ed emozione, con due prove ciascuno.","Scrivi una frase finale."]},"action":"Prendi la poesia del tuo compito e raccogli le immagini per senso. Nel Menu trovi la scheda da stampare.","hint":"Per capire le parole difficili puoi usare il percorso “Fare la parafrasi”. Per le figure, il percorso “Riconoscere le figure retoriche”."}],"coach":{"goal":"Insegnare a partire dalle immagini sensoriali, a cercare che cosa hanno in comune e solo dopo a proporre tema ed emozione con prove. Si accettano interpretazioni diverse da quelle proposte, se sostenute da più immagini del testo.","prepare":"Stampare le poesie a caratteri grandi e preparare colori diversi per i sensi. Le poesie sono state scritte per l’esercitazione. Chiarire prima, se servono, “orme”, “gabbiano”, “grondaie”.","observe":"Chiedere “Quali parole ti fanno pensare a questa emozione?” e “Questa idea vale anche per l’ultimo verso?”. Distinguere un’interpretazione costruita su una sola immagine (errore di metodo) da una parola letta o capita male (si chiarisce il lessico e si riprova). Non chiedere allo studente di provare l’emozione del testo né di raccontare esperienze personali.","adaptations":[["Raccogliere le immagini — possibile difficoltà con dislessia","Legge con fatica e perde le immagini degli ultimi versi.","Leggere la poesia ad alta voce o con sintesi vocale e lavorare un verso alla volta, con un segnariga. Verificare se lo studente ritrova le immagini anche dell’ultimo verso."],["Dare un nome a tema ed emozione — difficoltà trasversale","Le idee astratte restano vaghe o diventano etichette senza prove.","Offrire una breve lista di emozioni (allegria, malinconia, paura, calma, sollievo) da cui scegliere motivando con due prove. Osservare se la scelta è sostenuta da immagini diverse."],["Scrivere la frase finale — possibile difficoltà con disgrafia o disortografia","L’interpretazione è chiara a voce, ma la frase scritta resta incompleta.","Dare lo schema “La poesia parla di … Le immagini … e … creano un’atmosfera …” o accettare la frase detta a voce. Verificare se compaiono tema, emozione e due prove."]],"sources":["ies2007","eef2025","w3c-coga","aiddsa"],"checks":"Verificato che ogni prova citata compaia parola per parola nella poesia corrispondente e che i sensi assegnati siano coerenti (profumo = olfatto, caldo = tatto, risate = udito). Il tema proposto per l’ultima poesia è sostenuto da più versi, compreso l’ultimo."},"print":{"modelTitle":"Esempio commentato: la spiaggia a fine estate","model":["Sulla spiaggia ormai deserta / restano gli ombrelloni chiusi. / Il vento porta via le orme / dei giochi di agosto. / Solo un gabbiano grida / sopra il mare grigio.","1. Immagini per senso. Vista: “spiaggia ormai deserta”, “ombrelloni chiusi”, “mare grigio”. Udito: “un gabbiano grida”. Movimento: “Il vento porta via le orme”.","2. Che cosa hanno in comune: parlano di qualcosa che è finito o che se ne va.","3. Tema: la fine dell’estate. Prove: “ormai deserta”, “i giochi di agosto”.","4. Emozione: malinconia. Prove: “mare grigio”, “Solo un gabbiano grida”.","5. Frase finale: La poesia parla della fine dell’estate. La spiaggia deserta e gli ombrelloni chiusi creano un’atmosfera malinconica."],"practice":[["Prova guidata — la cucina della nonna","Nella cucina della nonna\nil forno è caldo e profuma di pane.\nSulla tavola, piatti e bicchieri\naspettano tutta la famiglia.\nDalla porta arrivano voci e risate.\nRaccogli le immagini per senso. Proponi tema ed emozione con due prove ciascuno."],["Compito nuovo — dopo il temporale","Il temporale è passato.\nDalle grondaie cadono\nle ultime gocce, una alla volta.\nTra le nuvole si apre\nuna striscia di azzurro.\nRaccogli le immagini, proponi tema ed emozione e scrivi una frase finale."]],"answers":["Cucina: vista “piatti e bicchieri”; tatto “il forno è caldo”; olfatto “profuma di pane”; udito “voci e risate”. Tema possibile: la famiglia che si ritrova. Emozione: gioia, calore.","Temporale: “è passato”, “le ultime gocce”, “una striscia di azzurro”. Tema possibile: la calma che torna dopo il temporale. Emozione: sollievo, serenità.","Sono possibili altre parole, se ogni idea ha almeno due prove e tiene conto anche degli ultimi versi."],"home":["Leggi la poesia e immagina la scena.","Raccogli le immagini per senso, tra virgolette.","Cerca che cosa hanno in comune.","Proponi tema ed emozione con due prove ciascuno e scrivi una frase finale."]},"maps":{},"kind":"task","subject":"Italiano","area":"Poesia"},{"id":"M08-08","title":"Risolvere un’equazione","intro":"Trova il numero nascosto e controlla se rende vera l’uguaglianza.","slides":[{"phase":"Preparazione","title":"Troviamo un numero che non conosciamo","text":["Un’equazione è un’uguaglianza che contiene un numero da trovare. Quel numero è indicato con una lettera, chiamata incognita. In questo esempio la lettera è x: cerchiamo il suo valore."],"visual":{"type":"math","label":"Il nostro esempio","lines":["3x + 5 = 20"]},"action":"Prepara foglio, penna e gli strumenti di calcolo che usi di solito. Copia l’equazione lasciando una riga libera sotto.","hint":"Il segno = dice che il valore a sinistra deve essere uguale a quello a destra. Risolvere significa trovare il numero che, messo al posto di x, rende vera questa uguaglianza."},{"phase":"Esempio spiegato","title":"Che cosa vuol dire 3x?","text":["In algebra, 3x significa 3 × x: tre volte il numero x. Quando un numero è attaccato a una lettera, il segno × non si scrive. La moltiplicazione però c’è."],"visual":{"type":"math","label":"Due modi di scrivere la stessa cosa","lines":["3x = 3 × x","Se x fosse 2: 3 × 2 = 6"]},"action":"Indica nell’equazione “3x + 5 = 20” la moltiplicazione e l’addizione. Per ora non devi trovare x.","hint":"“Se x fosse 2” è solo un esempio per leggere 3x. Non è la soluzione della nostra equazione: 3 × 2 + 5 fa 11, non 20."},{"phase":"Esempio spiegato","title":"Leggiamo i due lati dell’uguaglianza","text":["La parte a sinistra di = si chiama primo membro; quella a destra si chiama secondo membro. Qui il primo membro è “3x + 5” e il secondo è “20”."],"visual":{"type":"math","label":"I due membri","lines":["3x + 5     =     20"]},"action":"Sul foglio segna una piccola linea sotto ciascun membro. Il segno = deve restare tra le due parti.","hint":"Un “membro” è semplicemente uno dei due lati dell’equazione. Non devi imparare una procedura diversa: questi nomi servono a parlare delle due parti."},{"phase":"Esempio spiegato","title":"Manteniamo uguali i due lati","text":["Se due quantità sono uguali e togliamo la stessa quantità da entrambe, restano uguali. Useremo questa idea per eliminare il +5 vicino a 3x."],"visual":{"type":"math","label":"Prima osserva con numeri noti","lines":["12 = 12","12 − 5 = 12 − 5","7 = 7"]},"action":"Guarda che −5 è scritto su entrambi i lati. Nell’equazione faremo la stessa operazione ai due membri.","hint":"Se togliessi 5 soltanto da uno dei due 12, avresti 7 = 12, che è falso. Per restare uguali, i due lati devono cambiare allo stesso modo."},{"phase":"Esempio spiegato","title":"Togliamo 5 da entrambi i membri","text":["Vogliamo lasciare 3x senza il +5. Sottrarre 5 elimina quel +5, perché +5 −5 dà zero. Scriviamo −5 anche a destra per mantenere l’uguaglianza."],"visual":{"type":"math","label":"Operazione completa","lines":["3x + 5 = 20","3x + 5 − 5 = 20 − 5"]},"action":"Copia la seconda riga sotto l’equazione. Controlla che ci sia −5 sia a sinistra sia a destra.","hint":"Sottrarre 5 significa togliere 5. L’operazione che annulla un’aggiunta di 5 è proprio una sottrazione di 5."},{"phase":"Esempio spiegato","title":"Semplifichiamo la riga","text":["A sinistra, +5 −5 dà zero e rimane 3x. A destra, 20 −5 dà 15. Ora sappiamo che tre volte x vale 15."],"visual":{"type":"math","label":"Dalla riga completa a quella più semplice","lines":["3x + 5 − 5 = 20 − 5","3x = 15"]},"action":"Scrivi “3x = 15” su una nuova riga, mantenendo il segno = sotto quello precedente.","hint":"Non abbiamo cambiato 3x: abbiamo solo calcolato le parti numeriche che potevamo calcolare. Usare una riga per passaggio aiuta a ritrovare il punto se ti interrompi."},{"phase":"Esempio spiegato","title":"Da tre volte x a una volta x","text":["Per sapere quanto vale una sola x, dividiamo per 3. Dividiamo entrambi i membri per lo stesso numero: così i due lati restano uguali. Si può dividere per qualsiasi numero, tranne lo zero."],"visual":{"type":"math","label":"Divisione su entrambi i lati","lines":["3x = 15","3x ÷ 3 = 15 ÷ 3","x = 5"]},"action":"Scrivi la divisione e poi il risultato. Ora la lettera è da sola: abbiamo trovato x = 5.","hint":"3x è x + x + x. Se queste tre parti uguali valgono in tutto 15, ogni parte vale 15 ÷ 3 = 5. Puoi usare la calcolatrice se il calcolo ostacola il ragionamento."},{"phase":"Esempio spiegato","title":"Controlliamo nell’equazione iniziale","text":["Per verificare il risultato, torniamo all’equazione da cui siamo partiti e mettiamo 5 al posto di x. Prima eseguiamo la moltiplicazione, poi l’addizione."],"visual":{"type":"math","label":"Sostituzione e controllo","lines":["3x + 5 = 20","3 × 5 + 5 = 20","15 + 5 = 20","20 = 20"]},"action":"Controlla che il valore a sinistra sia uguale a quello a destra. Qui 20 = 20 conferma la soluzione.","hint":"Non verificare soltanto l’ultima riga x = 5: devi tornare a 3x + 5 = 20. È l’equazione iniziale a dire se il numero trovato funziona."},{"phase":"Prova guidata","title":"Ora prova con z","text":["La lettera può cambiare: z indica ancora un numero da trovare. Qui abbiamo due volte z, poi aggiungiamo 4.","Prima vogliamo lasciare soltanto 2z a sinistra."],"visual":{"type":"math","label":"La tua equazione","lines":["2z + 4 = 18"]},"action":"Scrivi sotto l’equazione la stessa sottrazione su entrambi i lati, in modo da eliminare +4. Non fare ancora la divisione.","hint":"Per eliminare +4, scrivi −4 a sinistra e −4 a destra. Puoi completare: 2z + 4 − 4 = 18 − 4."},{"phase":"Controllo guidato","title":"Dopo aver tolto 4","text":["Il +4 e il −4 si annullano a sinistra. A destra 18 −4 fa 14. Ora l’equazione dice che due volte z vale 14."],"visual":{"type":"math","label":"Confronta con il tuo passaggio","lines":["2z + 4 − 4 = 18 − 4","2z = 14"]},"action":"Se il tuo passaggio è diverso, controlla prima i due −4, poi il calcolo 18 −4. Correggi il punto che non coincide.","hint":"Se avevi scritto 2z = 18, hai tolto 4 soltanto a sinistra. Scrivi l’operazione anche a destra e calcola di nuovo."},{"phase":"Prova guidata","title":"Lascia z da sola","text":["Da “due volte z” vogliamo arrivare a “una volta z”. Scegli la divisione che lo permette e applicala anche al numero 14."],"visual":{"type":"math","label":"Parti da qui","lines":["2z = 14"]},"action":"Scrivi la divisione su entrambi i membri e poi il valore di z.","hint":"Dividi per 2: 2z ÷ 2 = 14 ÷ 2. A sinistra resta z. A destra puoi calcolare 14 ÷ 2 con il tuo strumento abituale."},{"phase":"Controllo guidato","title":"Verifica il numero trovato","text":["La divisione dà z = 7. Mettiamo 7 al posto di z nell’equazione iniziale. I due lati valgono 18, quindi il risultato funziona."],"visual":{"type":"math","label":"Il controllo completo","lines":["2z + 4 = 18","2 × 7 + 4 = 18","14 + 4 = 18","18 = 18"]},"action":"Confronta il tuo risultato con questo controllo. Indica dove compare il 7 che ha sostituito z.","hint":"Se avevi trovato un numero diverso, sostituiscilo nell’originale. Se i lati non coincidono, torna alla prima riga in cui il tuo lavoro è diverso dal modello."},{"phase":"Compito nuovo","title":"Questa volta c’è una sottrazione","text":["Qui dopo quattro volte y togliamo 7. Per lasciare 4y da solo, scegli l’operazione che annulla −7. Poi continua fino a trovare y."],"visual":{"type":"math","label":"Compito nuovo","lines":["4y − 7 = 13"]},"action":"Risolvi sul foglio, una riga per volta, e verifica nell’equazione iniziale. Vai avanti quando vuoi confrontare il procedimento.","hint":"Per annullare −7 devi aggiungere 7, perché −7 +7 dà zero. Aggiungi 7 a entrambi i membri; poi chiediti come passare da quattro volte y a una volta y."},{"phase":"Controllo","title":"Confronta le operazioni","text":["Aggiungiamo 7 da entrambe le parti. Poi dividiamo entrambi i membri per 4. In questo modo la lettera rimane da sola."],"visual":{"type":"math","label":"Soluzione del compito nuovo","lines":["4y − 7 + 7 = 13 + 7","4y = 20","4y ÷ 4 = 20 ÷ 4","y = 5"]},"action":"Confronta una riga alla volta. Se trovi una differenza, controlla l’operazione scelta e il suo calcolo prima di copiare il risultato.","hint":"Il fatto che anche qui la soluzione sia 5 non dipende dal nome della lettera. Dipende dai numeri di questa equazione: ogni nuova equazione va risolta e controllata."},{"phase":"Controllo","title":"Controlla anche la sottrazione finale","text":["Sostituiamo y con 5 nell’originale. Prima 4 ×5 dà 20. Poi 20 −7 dà 13, uguale al secondo membro."],"visual":{"type":"math","label":"Verifica del compito nuovo","lines":["4y − 7 = 13","4 × 5 − 7 = 13","20 − 7 = 13","13 = 13"]},"action":"Confronta questa verifica con la tua. Se avevi sommato 7 anche qui, torna all’originale: nella verifica rimane il suo −7.","hint":"Le operazioni usate per risolvere non sostituiscono l’equazione da verificare. Il controllo usa sempre la riga iniziale, con tutti i suoi segni."},{"phase":"Controllo","title":"Un errore da riconoscere","text":["Da 3x +5 =20 non possiamo passare a 3x =20 togliendo il +5 solo a sinistra. Nel nuovo passaggio il lato destro dovrebbe diventare 15."],"visual":{"type":"math","label":"Il passaggio da correggere","lines":["3x + 5 = 20","ERRORE: 3x = 20","CORREZIONE: 3x + 5 − 5 = 20 − 5"]},"action":"Spiega sul foglio o a voce quale operazione mancava a destra.","hint":"Riguarda l’esempio numerico: 12 −5 non è uguale a 12. Per lasciare uguali i lati devi togliere la stessa quantità anche al secondo."},{"phase":"Ripresa a casa","title":"Usa una riga per ogni passaggio","text":["Questo metodo funziona con equazioni come quelle che hai visto. C’è una lettera moltiplicata per un numero. Poi c’è un numero aggiunto o tolto.","Alcune equazioni sono diverse: hanno parentesi, frazioni o la lettera da tutte e due le parti. Per quelle, riguarda prima la spiegazione dell’insegnante."],"visual":{"type":"list","label":"Il tuo promemoria","items":["Copia l’equazione e leggi le operazioni vicino alla lettera.","Annulla l’aggiunta o la sottrazione con la stessa operazione sui due membri.","Dividi entrambi i membri per il numero che moltiplica la lettera.","Sostituisci la soluzione nell’originale e confronta i due valori."]},"action":"Scegli un’equazione dello stesso tipo dal compito. Nel Menu puoi stampare esempio, prove e promemoria per casa.","hint":"Puoi tenere aperto il modello. Puoi usare calcolatrice, tavole o formulario, se li usi già a scuola. Quello che conta è scegliere i passaggi e controllarli. Non serve sapere tutto a memoria."}],"coach":{"goal":"Osservare scelta dell’operazione, applicazione ai due membri e verifica nell’originale. Gli esempi riguardano ax+b=c con a positivo e soluzioni intere; non costituiscono un corso completo sulle equazioni.","prepare":"Verificare il significato di moltiplicazione e divisione con un esempio concreto. Se questi prerequisiti non sono disponibili, lavorarci prima di proseguire. Non introdurre la regola “sposta e cambia segno” come scorciatoia priva di spiegazione.","observe":"Far indicare l’operazione sul membro sinistro e su quello destro. Chiedere “Perché questa operazione?”. Distinguere un errore nella scelta da un errore nel calcolo.","adaptations":[["Lettura e allineamento — possibile difficoltà con dislessia o disgrafia","Perdita di un segno, salti di riga, cifre difficili da rileggere.","Fornire l’equazione già scritta, una riga per passaggio e spazio ampio. Leggere a voce i segni. Verificare che la copia resti coerente prima di interpretare un errore come concettuale."],["Calcolo — possibile difficoltà con discalculia","Operazione scelta correttamente, ma calcoli o fatti aritmetici rallentano il procedimento.","Lasciare calcolatrice e tavole già in uso. Far spiegare quale calcolo inserire. Controllare separatamente il ragionamento sui membri e l’esecuzione aritmetica."],["Ortografia — possibile disortografia","Una spiegazione scritta contiene errori di parole ma il procedimento è corretto.","Accogliere anche la spiegazione orale; non usare l’ortografia come indicatore della comprensione dell’uguaglianza."]],"sources":["w3c-coga","aiddsa"],"checks":"I calcoli di questo percorso sono stati controllati con Wolfram e con un calcolo separato. Questo controllo non misura la comprensibilità."},"print":{"modelTitle":"Equazione commentata","model":["3x + 5 = 20. La scrittura 3x significa 3 × x.","1. Tolgo 5 da entrambi i membri: 3x + 5 − 5 = 20 − 5.","2. Calcolo: 3x = 15.","3. Divido entrambi per 3: 3x ÷ 3 = 15 ÷ 3. Quindi x = 5.","4. Verifico nell’originale: 3 × 5 + 5 = 15 + 5 = 20. Il secondo membro è 20: coincidono.","Fare la stessa operazione ai due membri mantiene l’uguaglianza; qui dividiamo per un numero diverso da zero."],"practice":[["Prova guidata","2z + 4 = 18\nPrima annulla +4 sui due membri. Poi dividi entrambi per il numero che moltiplica z. Verifica nell’originale."],["Compito nuovo","4y − 7 = 13\nScegli come annullare −7. Applica l’operazione ai due membri, continua e verifica."]],"answers":["2z + 4 − 4 = 18 − 4 → 2z = 14 → 2z ÷ 2 = 14 ÷ 2 → z = 7. Verifica: 2 × 7 + 4 = 18.","4y − 7 + 7 = 13 + 7 → 4y = 20 → 4y ÷ 4 = 20 ÷ 4 → y = 5. Verifica: 4 × 5 − 7 = 13.","Se il risultato non funziona, controlla una riga alla volta: operazione scelta, presenza sui due membri, calcolo."],"home":["Una riga per passaggio; tieni sempre l’equazione iniziale.","Scegli l’operazione che annulla il numero aggiunto o sottratto.","Applica ogni operazione a entrambi i membri.","Quando la lettera è da sola, verifica nell’originale."]},"maps":{},"kind":"task","subject":"Matematica","area":"Aritmetica e algebra"},{"id":"M21-04","title":"Prendere appunti a due colonne","intro":"Ascolta un’idea, annota poche parole utili e completa gli appunti dopo.","slides":[{"phase":"Preparazione","title":"Appunti che ti aiutino a ritrovare la lezione","text":["Gli appunti servono a ricordare le idee della spiegazione. Basta scrivere le parole più importanti.","In questo percorso preparerai un foglio con due colonne e uno spazio finale. Vedrai prima un esempio; poi farai una breve prova di ascolto con chi ti accompagna."],"visual":{"type":"list","label":"Prepara","items":["Un foglio abbastanza grande e una penna","Una persona che legga la breve spiegazione","Se scrivere è faticoso, una traccia già divisa in colonne"]},"action":"Scrivi in alto “Appunti della lezione”. Chi ti accompagna trova i testi da leggere in Menu → Guida per il professionista.","hint":"Se l’insegnante ti dà uno schema, puoi usare quello. Qui impari un modo possibile. Puoi cambiarlo in base alla velocità della lezione e a quanto riesci a scrivere."},{"phase":"Preparazione","title":"Dividi il foglio in due colonne","text":["Traccia una linea verticale: lascia circa un terzo del foglio a sinistra e due terzi a destra. La colonna più larga servirà per annotare mentre ascolti. Lascia anche qualche riga libera in basso."],"visual":{"type":"notes","questions":[],"notes":[],"focus":null},"action":"Sul foglio scrivi “Domande — dopo” a sinistra, “Appunti — durante” a destra e “In poche parole — dopo” in basso.","hint":"Le misure non devono essere precise. Serve più spazio per gli appunti che per le domande. Puoi stampare la traccia dal Menu se tracciare le linee assorbe troppo tempo."},{"phase":"Esempio spiegato","title":"Durante la spiegazione usa la colonna larga","text":["Mentre ascolti, scrivi solo nella colonna larga. Lì metti le informazioni che vuoi ricordare. Le domande e la frase finale le scrivi dopo."],"visual":{"type":"notes","questions":[],"notes":[],"focus":"notes"},"action":"Indica sul tuo foglio dove scriverai mentre ascolti. Lascia vuote, per ora, la colonna delle domande e le righe finali.","hint":"Così fai una cosa alla volta. “Durante” vuol dire mentre l’insegnante spiega. “Dopo” vuol dire quando la spiegazione è finita, oppure durante una pausa."},{"phase":"Esempio spiegato","title":"Ascolta le parole che annunciano un’idea","text":["A volte chi spiega segnala che cosa sta per dire: “La definizione è…”, “Un esempio è…” oppure “Ci sono due aspetti da ricordare”. Queste parole possono aiutarti a preparare lo spazio per gli appunti."],"visual":{"type":"quote","label":"Un segnale da riconoscere","text":"“Ora vediamo due tipi di fonti storiche: le fonti scritte e le fonti materiali”."},"action":"Sul foglio prepara due righe distinte, una per ciascun tipo di fonte. Non devi annotare anche “Ora vediamo”.","hint":"Queste parole ti dicono che cosa sta per arrivare. Subito dopo, ascolta bene il contenuto. A volte l’insegnante non le usa. Allora chiediti: è un’idea o un esempio? Se non è chiaro, chiedi nella pausa."},{"phase":"Esempio spiegato","title":"Prima ascolta una piccola idea","text":["Immagina che l’insegnante pronunci questa frase. Prima ascoltiamo il suo significato; poi scegliamo che cosa annotare."],"visual":{"type":"quote","label":"Esempio di spiegazione","text":"Le fonti scritte sono testi che danno informazioni sul passato. Una lettera è un esempio di fonte scritta."},"action":"Leggi o ascolta la frase. Individua il nome importante: “fonti scritte”.","hint":"Una fonte storica è una traccia che aiuta a ricostruire il passato. Una lettera scritta da una persona può dare informazioni su ciò che viveva o raccontava."},{"phase":"Esempio spiegato","title":"Scrivi nome, significato ed esempio","text":["Negli appunti scriviamo tre cose. Il nome: “fonti scritte”. Il significato: “testi sul passato”. Un esempio: “lettera”. Usiamo poche parole, unite da frecce. Le frecce mostrano che le tre cose vanno insieme."],"visual":{"type":"notes","title":"Le fonti storiche","questions":[],"notes":["fonti scritte → testi sul passato → lettera"],"focus":null},"action":"Confronta la frase precedente, riportata qui: “Le fonti scritte sono testi che danno informazioni sul passato. Una lettera è un esempio”. Ritrova le tre informazioni negli appunti.","hint":"Una parola chiave è una parola che ti fa tornare in mente un’idea. Se scrivi solo “lettera”, dopo potresti non ricordare di che cosa parlava. Per questo la scriviamo vicino a “fonti scritte”."},{"phase":"Esempio spiegato","title":"Se perdi un pezzo, lascia un segno","text":["Mentre scrivi potresti non sentire un esempio. Metti un punto interrogativo nel punto mancante e torna ad ascoltare: lo completerai quando ci sarà una pausa."],"visual":{"type":"notes","title":"Le fonti storiche","questions":[],"notes":["fonti scritte → testi sul passato → lettera","fonti materiali → oggetti → esempio: ?"],"focus":null},"action":"Guarda “fonti materiali → oggetti → esempio: ?”. Il ? segnala proprio l’esempio da chiedere, non tutta la lezione.","hint":"Le fonti materiali sono oggetti che ci parlano del passato. Se non hai sentito l’esempio, scrivi comunque “oggetti”. Poi metti un ? al posto dell’esempio."},{"phase":"Esempio spiegato","title":"Chiedi il pezzo che manca","text":["Nella pausa puoi fare una domanda precisa: “Qual era l’esempio di fonte materiale?”. Nell’esempio l’insegnante risponde “un vaso”. Sostituiamo il ? con quella parola."],"visual":{"type":"notes","title":"Le fonti storiche","questions":[],"notes":["fonti scritte → testi sul passato → lettera","fonti materiali → oggetti → vaso"],"focus":null},"action":"Individua la parola “vaso” aggiunta negli appunti. Ora ogni riga ha il tipo di fonte, il significato e un esempio.","hint":"Se non c’è una pausa adatta, lascia il ? e chiedi dopo. Puoi confrontare quel punto con il materiale dell’insegnante o con un compagno, senza ricopiare tutta la pagina."},{"phase":"Esempio spiegato","title":"Dopo, costruisci una domanda","text":["La spiegazione è finita. Leggi una riga di appunti e chiediti: “A quale domanda risponde?”. Per la prima riga possiamo scrivere “Che cosa sono le fonti scritte? Un esempio?”."],"visual":{"type":"notes","title":"Le fonti storiche","questions":["Che cosa sono le fonti scritte? Un esempio?"],"notes":["fonti scritte → testi sul passato → lettera","fonti materiali → oggetti → vaso"],"focus":"questions"},"action":"Ora tocca a te. Guarda la seconda riga degli appunti. Scrivi nella colonna stretta una domanda su quella riga. La domanda chiede che cosa sono le fonti materiali e un esempio.","hint":"Una domanda utile ti fa recuperare un’informazione, non soltanto rispondere sì o no. “Ho capito?” non ti dice che cosa ricordare della lezione."},{"phase":"Esempio spiegato","title":"Scrivi il senso generale in una frase","text":["Nello spazio in basso metti insieme le due idee principali. La frase serve a capire di che cosa parlava questa parte di lezione, senza rileggere ogni dettaglio."],"visual":{"type":"notes","title":"Le fonti storiche","questions":["Che cosa sono le fonti scritte? Un esempio?","Che cosa sono le fonti materiali? Un esempio?"],"notes":["fonti scritte → testi sul passato → lettera","fonti materiali → oggetti → vaso"],"summary":"Le fonti storiche possono essere testi oppure oggetti che danno informazioni sul passato.","focus":"summary"},"action":"Leggi la frase finale: contiene sia i testi sia gli oggetti. Non serve riscrivere anche tutti gli esempi.","hint":"“In poche parole” significa una sintesi: una frase breve con l’idea principale. Usa parole semplici."},{"phase":"Prova guidata","title":"Preparati ad ascoltare una nuova spiegazione","text":["Ora prepara un’altra pagina con le stesse zone. Il tema sarà la legenda di una carta geografica: la legenda spiega il significato dei simboli usati sulla carta.","Chi ti accompagna leggerà due brevi parti e farà una pausa tra l’una e l’altra. Il testo “Prova guidata” è nella Guida per il professionista."],"visual":{"type":"notes","questions":[],"notes":[],"focus":null},"action":"Scrivi il titolo “La legenda”. Tieni la penna pronta nella colonna larga. Quando siete pronti, chiedi la lettura della prima parte.","hint":"Puoi concordare una rilettura o una pausa più lunga. Stai imparando a scegliere le informazioni: non è una gara di velocità né una prova di memoria."},{"phase":"Prova guidata","title":"Ascolta e annota la prima idea","text":["Ascolta la prima parte letta dall’adulto. Cerca che cosa fa la legenda. Dopo aver ascoltato, scrivi poche parole nella colonna larga, come negli esempi precedenti."],"visual":{"type":"quote","label":"La domanda da tenere presente","text":"A che cosa serve la legenda di una carta?"},"action":"Annota la risposta con parole tue. Se perdi una parola, lascia un ? e chiedi una rilettura nella pausa.","hint":"Puoi iniziare con “legenda → …”. Non serve una frase elegante: deve restare chiaro a te quale informazione hai ascoltato."},{"phase":"Prova guidata","title":"Aggiungi gli esempi ascoltati","text":["Ora ascolta la seconda parte. Scrivi ogni simbolo insieme al suo significato. La spiegazione si riferisce a una carta precisa: altre carte possono usare simboli differenti."],"visual":{"type":"quote","label":"Che cosa collegare negli appunti","text":"Simbolo → significato in questa carta"},"action":"Aggiungi due righe nella colonna larga. Poi chiedi di chiarire gli eventuali punti segnati con ?.","hint":"Non scrivere soltanto il nome del simbolo. Dopo “linea blu” lascia spazio per dire che cosa indica in questa carta. Fai lo stesso per l’altro simbolo."},{"phase":"Controllo guidato","title":"Confronta le informazioni annotate","text":["Ecco un esempio di appunti per questa spiegazione. Le tue parole possono essere diverse. Controlla una cosa: ogni simbolo è vicino al suo significato?"],"visual":{"type":"quote","label":"Appunti possibili","text":"legenda → spiega i simboli della carta\nlinea blu → fiume\ntriangolo → cima di un monte"},"action":"Confronta le tue righe. Completa soltanto i collegamenti mancanti, senza ricopiare la pagina intera.","hint":"“Triangolo = monte” può bastare nei tuoi appunti se sai spiegare che indica la cima del monte. Chiedi chiarimento se non ricordi che cosa intendevi."},{"phase":"Prova guidata","title":"Completa le zone da usare dopo","text":["La lettura è terminata. Ora puoi aggiungere nella colonna stretta una domanda sulla funzione della legenda e una sui simboli. In basso scrivi l’idea generale in una frase."],"visual":{"type":"quote","label":"Tieni davanti le informazioni","text":"legenda → spiega i simboli della carta\nlinea blu → fiume\ntriangolo → cima di un monte"},"action":"Scrivi domande e frase finale. Poi copri solo gli appunti a destra e prova a rispondere a una domanda. Riapri la colonna per controllare.","hint":"Domanda possibile: “A che cosa serve la legenda?”. Frase finale possibile: “La legenda aiuta a capire che cosa rappresentano i simboli sulla carta”. Non serve coprire nulla se prima hai bisogno di rileggere."},{"phase":"Compito nuovo","title":"Prova con un breve contenuto di scienze","text":["Prepara una nuova pagina: “L’acqua e i suoi stati”. L’adulto leggerà il testo “Compito nuovo” nella propria guida. Questa volta decidi tu dove fare spazio agli esempi.","Dopo l’ascolto potrai chiedere i pezzi mancanti e completare domande e frase finale."],"visual":{"type":"notes","questions":[],"notes":[],"focus":null},"action":"Ascolta, annota le informazioni utili, poi completa le zone “dopo”. Avanza quando vuoi confrontare il risultato.","hint":"Puoi chiedere all’adulto di leggere una frase per volta. Cerca i nomi dei tre stati dell’acqua e un esempio per ciascuno. Mantieni gli strumenti e gli aiuti di scrittura che ti servono."},{"phase":"Controllo","title":"Controlla le coppie, poi usa una domanda","text":["Nei tuoi appunti devono essere riconoscibili tre stati e i rispettivi esempi. Le domande possono chiedere gli stati dell’acqua e un esempio per ciascuno."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"solido → ghiaccio\nliquido → acqua nel bicchiere\naeriforme → vapore acqueo\n\nIn poche parole: l’acqua può presentarsi in tre stati."},"action":"Controlla che nessun esempio sia collegato allo stato sbagliato. Poi usa una tua domanda per spiegare una riga senza leggerla parola per parola.","hint":"“Aeriforme” significa che l’acqua è allo stato di gas. Se la parola è difficile, negli appunti puoi scrivere “gas → vapore acqueo” e aggiungere il termine della lezione dopo."},{"phase":"Ripresa a casa","title":"Rendi gli appunti leggibili prima di studiare","text":["Dopo la scuola, riprendi una breve parte di appunti. Chiarisci i ?, completa i collegamenti mancanti e aggiungi una o due domande utili.","Quando studi, prova a rispondere a una domanda e poi riapri gli appunti per controllare. Se non riesci, rileggi quel punto e riprova."],"visual":{"type":"list","label":"Prima, durante, dopo","items":["Prima: titolo e pagina già preparata.","Durante: ascolta un’idea, annota parole collegate e segnala i vuoti.","Dopo: chiarisci i vuoti, scrivi domande e una frase sul senso generale."]},"action":"Prova questo metodo in una vera lezione a scuola. Decidi con chi ti accompagna quanto scrivere. Inizia da una parte breve della lezione.","hint":"Ascoltare e scrivere insieme può essere faticoso. Allora scrivi di meno. Per esempio, usa una traccia già pronta e aggiungi solo gli esempi. Così riesci a seguire la spiegazione."}],"coach":{"goal":"Insegnare separatamente selezione delle informazioni, scrittura durante l’ascolto e rielaborazione successiva. Il formato è un adattamento didattico a due colonne ispirato a Cornell, non un formato obbligatorio.","prepare":"Concordare pause e riletture. Non mostrare il testo completo allo studente prima della prova di ascolto, se l’ascolto è l’obiettivo; se la lettura di supporto è necessaria, mantenerla e documentare l’aiuto. Aprire questa guida prima della lettura o stamparla; tornando al percorso si mantiene il passaggio.","observe":"Osservare se le note conservano relazioni (nome → significato → esempio), se il ? è collocato dove serve, se le domande permettono di recuperare un’informazione. Non valutare la quantità scritta o la velocità come indicatori unici.","scripts":[{"title":"Prova guidata — parte 1","text":"La legenda di una carta geografica spiega che cosa significano i simboli usati nella carta.","instruction":"Leggere quando il ragazzo è alla schermata “Ascolta e annota la prima idea”. Fare una pausa e rileggere se richiesto."},{"title":"Prova guidata — parte 2","text":"Ci sono due simboli da ricordare. Nella carta che stiamo usando, una linea blu indica un fiume. Un triangolo indica la cima di un monte.","instruction":"Leggere alla schermata “Aggiungi gli esempi ascoltati”. Fare una pausa dopo ogni frase, poi rispondere alle richieste di chiarimento."},{"title":"Compito nuovo — scienze","text":"L’acqua può presentarsi in tre stati: solido, liquido e aeriforme. Il ghiaccio è acqua allo stato solido. L’acqua nel bicchiere è allo stato liquido. Il vapore acqueo è acqua allo stato aeriforme, cioè un gas.","instruction":"Leggere alla schermata “Prova con un breve contenuto di scienze”. Concordare pause in base al carico. Chiarire, se emerge, che il vapore acqueo come gas è invisibile: la nuvoletta visibile contiene piccole gocce."}],"adaptations":[["Scrivere mentre si ascolta — possibile difficoltà con disgrafia o disortografia","Lo studente perde la spiegazione mentre tenta di completare o correggere una parola.","Fornire una traccia parziale, ridurre le parole richieste e rimandare il controllo ortografico. Consentire i supporti consueti. Osservare se conserva più informazioni ascoltate."],["Rilettura — possibile difficoltà con dislessia","Le note molto abbreviate non risultano decifrabili dopo la lezione.","Usare abbreviazioni poche e condivise, parole complete per i termini nuovi, spaziatura ampia. Provare la rilettura subito e dopo una pausa."],["Selezione delle idee — difficoltà trasversale","Annota tutto o solo parole isolate senza collegamenti.","Modellare un’idea alla volta; usare una domanda guida e accettare anche due parole collegate. Non attribuire automaticamente questo comportamento a un DSA."],["Numeri in lezioni future — possibile difficoltà con discalculia","Dati numerici o sequenze di calcolo vengono persi durante la copia.","Fornire dati o passaggi già scritti e far annotare il significato. Questa prova non misura abilità di calcolo."]],"sources":["w3c-coga","cornell","aiddsa","ciu"]},"print":{"modelTitle":"Un esempio di pagina completata","visual":{"type":"notes","title":"Le fonti storiche","questions":["Che cosa sono le fonti scritte? Un esempio?","Che cosa sono le fonti materiali? Un esempio?"],"notes":["fonti scritte → testi sul passato → lettera","fonti materiali → oggetti → vaso"],"summary":"Le fonti storiche possono essere testi oppure oggetti che danno informazioni sul passato.","focus":"summary"},"model":["Durante: nella colonna larga, scrivi nome, significato ed esempio.","Se manca qualcosa: scrivi ? nel punto preciso e chiedi nella pausa.","Dopo: scrivi domande nella colonna stretta e una frase sul senso generale in basso."],"practice":[["Prova guidata — La legenda","Chiedi all’adulto la lettura in due parti. Annota la funzione della legenda e i simboli con i loro significati. Poi aggiungi domande e sintesi."],["Compito nuovo — L’acqua","Chiedi all’adulto la lettura sugli stati dell’acqua. Prepara sul quaderno un’altra pagina a due colonne. Scrivi ogni stato con il suo esempio."]],"blankNotes":true,"answers":["Legenda → spiega i simboli; linea blu → fiume; triangolo → cima di un monte (nella carta descritta).","Acqua: solido → ghiaccio; liquido → acqua nel bicchiere; aeriforme → vapore acqueo.","Una domanda deve permettere di recuperare un’informazione: “Quali sono i tre stati dell’acqua?”."],"home":["Prepara il foglio prima della lezione.","Durante, ascolta una piccola idea e annota parole collegate.","Dopo, completa i ?, le domande e la sintesi.","A casa, prova a rispondere alle domande e controlla negli appunti."]},"maps":{},"kind":"task","subject":"In tutte le materie","area":"Seguire la lezione e prendere appunti"},{"id":"MC-01","title":"Mappa concettuale: la favola","intro":"Collega idee con parole che spieghino la relazione.","maps":{"favola":{"type":"concettuale","nodes":[{"id":"favola","label":"Favola"},{"id":"racconto","label":"Racconto","parent":"favola","link":"è"},{"id":"breve","label":"Breve","parent":"racconto","link":"è"},{"id":"personaggi","label":"Personaggi","parent":"favola","link":"ha"},{"id":"animali","label":"Animali","parent":"personaggi","link":"sono spesso"},{"id":"morale","label":"Morale","parent":"favola","link":"contiene"},{"id":"insegnamento","label":"Insegnamento","parent":"morale","link":"esprime"}],"id":"MC-01-favola"}},"slides":[{"phase":"Preparazione","title":"Una mappa per spiegare i collegamenti","text":["Una mappa concettuale mostra idee e relazioni. Le idee sono scritte nei riquadri; le parole sulle frecce spiegano come si collegano.","Costruiremo una piccola mappa sulla favola. Ti serviranno il testo, un foglio e una penna. Puoi usare un foglio in orizzontale per avere spazio."],"visual":{"type":"quote","label":"Che cosa imparerai a fare","text":"Leggere due riquadri e una freccia come una frase che ha senso."},"action":"Scrivi sul foglio “Mappa concettuale — la favola”. Lascia spazio sotto.","hint":"Un concetto è un’idea che vogliamo rappresentare, come “favola” o “personaggi”. Non serve mettere ogni parola del testo in un riquadro."},{"phase":"Preparazione","title":"Prima capiamo il testo","text":["Leggi o ascolta questo testo. La morale è l’insegnamento che una storia suggerisce sul modo di comportarsi. Può essere scritto oppure ricavato dagli eventi."],"visual":{"type":"quote","label":"Il testo di partenza","text":"La favola è un racconto breve. I personaggi sono spesso animali che parlano e si comportano come persone. La storia contiene un insegnamento sui comportamenti: questo insegnamento si chiama morale. A volte la morale è scritta chiaramente; altre volte il lettore la ricava da ciò che accade."},"action":"Indica nel testo che cosa si dice sulla lunghezza, sui personaggi e sulla morale. Per ora non disegnare i collegamenti.","hint":"“Spesso” vuol dire “molte volte”. Molte favole hanno animali come personaggi, ma alcune no. Per questo nella mappa scriveremo anche la parola “spesso”."},{"phase":"Preparazione","title":"Scegli parole che ti ricordano l’idea","text":["Osserva la frase “La favola è un racconto breve”. Per ricordare che tipo di testo è, teniamo “racconto”. Per ricordare la sua lunghezza, teniamo “breve”. Sono parole chiave perché ci aiutano a ricostruire l’informazione."],"visual":{"type":"quote","label":"Dalla frase alle parole utili","text":"La favola è un racconto breve.\n\nTipo di testo → racconto\nLunghezza → breve"},"action":"Scrivi “racconto breve” sul foglio. Poi prova a usarlo per dire la frase completa.","hint":"Le altre parole della frase servono ancora. Nella mappa concettuale le scriviamo sulle frecce. Nella mappa mentale le diciamo a voce quando spieghiamo."},{"phase":"Preparazione","title":"Distingui il gruppo dal suo dettaglio","text":["In questa frase, “personaggi” è il gruppo di cui si parla. Le parole successive dicono qualcosa di più su quel gruppo. Prima di disegnare la mappa, cerca l’informazione da tenere."],"visual":{"type":"quote","label":"La frase da esaminare","text":"I personaggi sono spesso animali che parlano e si comportano come persone."},"action":"Sul foglio scrivi “Personaggi”. Accanto, annota poche parole che dicano chi sono spesso. Tieni davanti la frase e poi avanza per controllare.","hint":"Chiediti: che tipo di personaggi descrive questa frase? C’è una parola che evita di dire “tutti” o “sempre”? Scrivila anche nella tua nota."},{"phase":"Controllo della preparazione","title":"“Spesso animali” mantiene una precisazione","text":["Una nota possibile è “Personaggi → spesso animali”. “Personaggi” indica il gruppo; “spesso animali” aggiunge un dettaglio. La parola “spesso” tiene il significato del testo: molte volte, non sempre."],"visual":{"type":"quote","label":"Frase e nota","text":"I personaggi sono spesso animali che parlano e si comportano come persone.\n\nPersonaggi → spesso animali"},"action":"Confronta la tua nota. Se hai scritto solo “animali”, aggiungi “spesso”. Potrai aggiungere in seguito anche il dettaglio su come parlano e agiscono.","hint":"In ogni riquadro bastano poche parole. Aggiungi i dettagli uno alla volta. Mettili sempre vicino al gruppo di cui parlano."},{"phase":"Esempio spiegato","title":"Scegliamo a quale domanda rispondere","text":["Una domanda ti aiuta a scegliere che cosa mettere nella mappa. La nostra domanda riguarda tutte le favole. Vogliamo dire come sono fatte: le loro caratteristiche."],"visual":{"type":"quote","label":"La domanda della nostra mappa","text":"Quali caratteristiche ha una favola?"},"action":"Scrivi questa domanda sopra lo spazio della mappa. Ti servirà per controllare se i collegamenti rispondono al compito.","hint":"Se la domanda fosse “Che cosa accade nella favola letta oggi?”, servirebbero invece gli eventi di quella storia. Prima di scegliere i riquadri, chiarisci quale domanda hai davanti."},{"phase":"Esempio spiegato","title":"Partiamo dall’idea principale","text":["Il testo comincia con “La favola è un racconto breve”. La prima idea è “favola”: sarà il punto da cui partire per leggere gli altri collegamenti."],"visual":{"type":"map","map":"favola","show":1},"action":"Disegna un riquadro con la parola “Favola” nella parte alta del foglio.","hint":"Un riquadro aiuta a vedere dove finisce un’idea e comincia un’altra. Basta una forma semplice: non serve decorarlo."},{"phase":"Esempio spiegato","title":"La freccia deve dire qualcosa","text":["Dal testo ricaviamo due idee, “favola” e “racconto”. La parola “è” scritta sulla freccia esprime il collegamento. Leggendo tutto otteniamo: “La favola è un racconto”."],"visual":{"type":"map","map":"favola","show":2},"action":"Sotto “Favola”, disegna “Racconto”. Traccia una freccia dal primo riquadro al secondo e scrivi “è” vicino alla freccia.","hint":"Una freccia senza parole non spiega se un’idea è un esempio, una parte o una causa dell’altra. Qui “è” permette di leggere una frase precisa."},{"phase":"Esempio spiegato","title":"Aggiungiamo il dettaglio “breve”","text":["La stessa frase del testo dice che il racconto è breve. Aggiungiamo questa informazione sotto “Racconto”, con un’altra freccia e un’altra parola “è”."],"visual":{"type":"map","map":"favola","show":3},"action":"Disegna “Breve” sotto “Racconto” e collega con “è”. Leggi: “Il racconto è breve”.","hint":"Puoi scegliere anche un solo riquadro “Racconto breve”. Qui li separiamo per imparare a esprimere una relazione. Una mappa non deve avere un numero obbligatorio di riquadri."},{"phase":"Esempio spiegato","title":"Costruiamo il ramo dei personaggi","text":["Il testo dice: “I personaggi sono spesso animali”. Dal riquadro “Favola” parte un nuovo collegamento: la favola ha personaggi. Da “Personaggi” continuiamo con “sono spesso” verso “Animali”."],"visual":{"type":"map","map":"favola","show":5},"action":"Aggiungi questo ramo accanto a quello sul racconto. Mantieni la parola “spesso” sulla seconda freccia.","hint":"Un ramo è una parte della mappa che parte da un riquadro e aggiunge informazioni. Sulla freccia scriviamo “sono spesso”, come nel testo. “Sono animali” direbbe che tutti i personaggi sono animali: non è vero."},{"phase":"Esempio spiegato","title":"Colleghiamo morale e insegnamento","text":["La favola ha una morale. La morale è un insegnamento su come comportarsi. Aggiungiamo due collegamenti. Il primo: “La favola contiene una morale”. Il secondo: “La morale esprime un insegnamento”."],"visual":{"type":"map","map":"favola","show":7},"action":"Aggiungi il ramo della morale. Poi leggilo come due frasi complete.","hint":"Una morale può essere lasciata da ricavare al lettore: “contiene” non significa che nel libro ci sia sempre una frase finale già scritta. Il testo di partenza lo precisa."},{"phase":"Controllo dell’esempio","title":"Leggiamo la mappa completa","text":["Ora puoi seguire tre percorsi. Ogni volta parti da “Favola” e leggi riquadri e parole sulle frecce. La mappa riassume alcune caratteristiche: il testo resta disponibile per i dettagli."],"visual":{"type":"map","map":"favola","show":7},"action":"Scegli un ramo e spiegalo a voce. Controlla nel testo: “favola = racconto breve; personaggi spesso animali; morale = insegnamento sui comportamenti”.","hint":"Se riesci solo a elencare “favola, personaggi, animali”, prova a inserire le parole delle frecce: “La favola ha personaggi. I personaggi sono spesso animali”."},{"phase":"Prova guidata","title":"Ricostruisci un collegamento sul foglio","text":["Ora prova a costruire tu il ramo della morale senza copiare la mappa completa. Hai qui la frase del testo che ti serve e le idee da collegare."],"visual":{"type":"quote","label":"La frase da usare","text":"La storia contiene un insegnamento sui comportamenti: questo insegnamento si chiama morale.\n\nIdee disponibili: Favola — Morale — Insegnamento."},"action":"Su una parte libera del foglio disegna i tre riquadri. Scrivi sulle due frecce parole che permettano di leggere frasi sensate.","hint":"Puoi iniziare con “La favola contiene …”. Poi chiediti che cosa esprime la morale. Le parole sulle frecce si chiamano parole-legame. Sceglile pensando al testo: devono dire come sono collegate le due idee."},{"phase":"Controllo guidato","title":"Controlla le tue due frasi","text":["Ecco un ramo possibile. Anche altre parole vanno bene, per esempio “La favola propone una morale” o “La morale è un insegnamento”. Controlla che ogni freccia si legga come una frase vera per il testo."],"visual":{"type":"quote","label":"Un ramo possibile","text":"Favola → contiene → Morale\nMorale → esprime → Insegnamento"},"action":"Leggi il tuo ramo, includendo le parole sulle frecce. Se una frase resta incompleta, modifica la parola-legame.","hint":"“Favola → morale → insegnamento”, senza parole sulle frecce, lascia al lettore il compito di indovinare i collegamenti. Aggiungi ciò che diresti a voce tra le idee."},{"phase":"Compito nuovo","title":"Costruisci una mappa da un testo diverso","text":["Ora cambia l’argomento. La domanda è: “Quali caratteristiche ha il racconto d’avventura?”.","Leggi il testo e scegli tre aspetti da rappresentare: impresa, protagonista e luoghi. Puoi tenere il testo davanti mentre lavori."],"visual":{"type":"quote","label":"Testo per il compito nuovo","text":"Il racconto d’avventura racconta un’impresa rischiosa. Il protagonista affronta pericoli e ostacoli. I luoghi possono essere lontani o sconosciuti. Gli eventi creano attesa: il lettore vuole scoprire come finirà l’impresa."},"action":"Scrivi in alto la domanda e disegna il primo riquadro “Racconto d’avventura”.","hint":"Un’impresa è un’azione impegnativa da portare a termine. Il protagonista è il personaggio principale. Un ostacolo è qualcosa che rende difficile proseguire."},{"phase":"Compito nuovo","title":"Ora collega le idee scelte","text":["Parti da “Racconto d’avventura” e costruisci i tre rami. Per ogni freccia, cerca parole che facciano leggere una frase completa. Aggiungi almeno un dettaglio per ramo."],"visual":{"type":"quote","label":"Tieni a disposizione il testo","text":"Il racconto d’avventura racconta un’impresa rischiosa. Il protagonista affronta pericoli e ostacoli. I luoghi possono essere lontani o sconosciuti. Gli eventi creano attesa: il lettore vuole scoprire come finirà l’impresa."},"action":"Disegna la mappa sul foglio. Quando hai finito, leggi ogni collegamento e confrontalo con il testo. Avanza per vedere un possibile controllo.","hint":"Per il primo ramo puoi chiederti: che cosa racconta il racconto d’avventura? Un’impresa. Com’è l’impresa? Rischiosa. Usa lo stesso ragionamento sugli altri due aspetti."},{"phase":"Controllo","title":"Confronta le relazioni della tua mappa","text":["Ecco alcune frasi da ritrovare nella tua mappa. La tua mappa può essere disegnata in modo diverso. Puoi unire due riquadri o tenerli separati. L’importante è che il significato sia chiaro."],"visual":{"type":"list","label":"Frasi da ritrovare","items":["Il racconto d’avventura racconta un’impresa rischiosa.","Il racconto d’avventura ha un protagonista che affronta pericoli e ostacoli.","Il racconto d’avventura può svolgersi in luoghi lontani o sconosciuti."]},"action":"Controlla un ramo alla volta. Tieni parole come “può”. Il testo dice che i luoghi possono essere sconosciuti, non che lo sono sempre.","hint":"In questa prova abbiamo scelto tre aspetti. Il testo dice anche che gli eventi creano attesa. Se ti serve, puoi aggiungere un quarto ramo. Aggiungi solo ciò che ti aiuta a spiegare."},{"phase":"Ripresa a casa","title":"Parti dalla domanda, poi costruisci un ramo","text":["Sul compito di casa scrivi prima a quale domanda vuoi rispondere. Leggi un breve tratto di testo e costruisci un ramo; poi passa al successivo.","Una mappa funziona se ti aiuta a spiegare collegamenti e a ritrovare informazioni. Se non riesci a leggerla, riduci o riorganizza quel punto."],"visual":{"type":"list","label":"Il metodo da riprendere","items":["Scegli la domanda e tieni davanti il testo.","Individua poche idee utili alla domanda.","Collegale con parole che formino frasi.","Controlla ogni relazione nel testo e prova a spiegarla."]},"action":"Prova su un breve paragrafo del tuo libro. Nel Menu trovi la scheda da stampare con esempio e traccia.","hint":"A volte una freccia può unire due rami diversi. Aggiungila solo se sai spiegare il collegamento. In una mappa piccola puoi farne a meno."}],"coach":{"prepare":"Tenere disponibile il testo mentre si costruisce la mappa. Leggerlo insieme e verificare “morale” come insegnamento sui comportamenti. La disposizione proposta è un esempio, non uno schema da imporre a tutti i testi.","adaptations":[["Leggere e scegliere informazioni — possibile difficoltà con dislessia","Il carico di lettura impedisce di ritrovare la frase a cui collegare un nodo.","Leggere ad alta voce o usare la sintesi vocale abituale, una frase per volta. Lasciare il testo visibile e far indicare quale informazione viene rappresentata."],["Scrivere e disporre i nodi — possibile difficoltà con disgrafia","Lo studente sa spiegare i collegamenti ma perde spazio o non riesce a rileggere le etichette.","Offrire riquadri già pronti o cartellini mobili. Chiedere allo studente di scegliere e collegare; non sostituirsi nella decisione sul significato."],["Ortografia — possibile difficoltà con disortografia","La ricerca della grafia corretta interrompe ogni scelta concettuale.","Consentire copia del termine dal testo o etichette predisposte. Controllare prima i collegamenti e poi, separatamente, l’ortografia."],["Sovraccarico visivo — difficoltà trasversale","Molti rami rendono difficile ritrovare il punto di partenza.","Costruire un ramo alla volta, distanziare le parti e verificare se lo studente riesce a spiegare un percorso. La difficoltà non implica un DSA specifico."]],"sources":["w3c-coga","novak","aiddsa","ciu"],"goal":"Osservare se le parole-legame esprimono relazioni controllabili nel testo. Non confondere la qualità della mappa con la somiglianza grafica al modello.","observe":"Far leggere una proposizione completa per ramo e indicare la frase del testo che la sostiene. Il collegamento “sono spesso” conserva una qualificazione importante. La mappa semplificata non rappresenta ogni dettaglio né introduce obbligatoriamente legami trasversali."},"print":{"modelTitle":"Mappa concettuale — esempio","visual":{"type":"map","map":"favola","show":7},"model":["Domanda: quali caratteristiche ha una favola?","La favola è un racconto breve. I personaggi sono spesso animali che parlano e si comportano come persone. La storia contiene un insegnamento sui comportamenti: questo insegnamento si chiama morale. A volte la morale è scritta chiaramente; altre volte il lettore la ricava da ciò che accade.","Leggi ogni coppia di riquadri con la parola sulla freccia: “La favola è un racconto”. Poi: “Il racconto è breve”."],"practice":[["Prova guidata","Ricostruisci il ramo Favola — Morale — Insegnamento. Scegli parole sulle frecce che formino frasi coerenti: la favola contiene una morale, cioè un insegnamento."],["Compito nuovo","Il racconto d’avventura racconta un’impresa rischiosa. Il protagonista affronta pericoli e ostacoli. I luoghi possono essere lontani o sconosciuti. Gli eventi creano attesa: il lettore vuole scoprire come finirà l’impresa.\nDomanda: quali caratteristiche ha il racconto d’avventura? Disegna tre rami: impresa, protagonista, luoghi. Aggiungi parole-legame e dettagli."]],"answers":["Ramo guidato: Favola → contiene → Morale → esprime → Insegnamento.","Avventura: racconta un’impresa rischiosa; ha un protagonista che affronta pericoli e ostacoli; può svolgersi in luoghi lontani o sconosciuti.","Sono possibili altre disposizioni. Controlla che ogni collegamento si possa leggere come una frase e sia sostenuto dal testo."],"home":["Scrivi la domanda a cui vuoi rispondere.","Scegli le idee utili per la domanda e collega un ramo alla volta.","Metti parole sulle frecce; tieni parole come “spesso” o “può”.","Rileggi nel testo e spiega i collegamenti a voce."]},"kind":"map","subject":"Italiano","area":"Mappa concettuale","mapType":"Mappa concettuale","topic":"La favola","language":null},{"id":"MM-01","title":"Mappa mentale: la favola","intro":"Metti un tema al centro e organizza le informazioni in rami.","maps":{"favola":{"type":"mentale","nodes":[{"id":"favola","label":"Favola"},{"id":"storia","label":"Storia","parent":"favola"},{"id":"breve","label":"Breve","parent":"storia"},{"id":"personaggi","label":"Personaggi","parent":"favola"},{"id":"animali","label":"Spesso animali","parent":"personaggi"},{"id":"messaggio","label":"Messaggio","parent":"favola"},{"id":"morale","label":"Morale","parent":"messaggio"}],"id":"MM-01-favola"}},"slides":[{"phase":"Preparazione","title":"Una mappa per organizzare le informazioni","text":["Una mappa mentale parte da un tema al centro. I rami raccolgono aspetti del tema, come cartelline in cui mettere informazioni vicine per significato.","Costruiremo una mappa sulla favola con parole brevi ma comprensibili. Prepara un foglio in orizzontale e una penna. I colori sono facoltativi."],"visual":{"type":"quote","label":"Che cosa imparerai a fare","text":"Trovare il ramo giusto e usarlo per ricordare e spiegare un’informazione."},"action":"Scrivi sul foglio “Mappa mentale — la favola” e lascia libero il centro.","hint":"Nella mappa mentale i rami mettono insieme informazioni simili. Sulle linee non scrivi parole. Quando spieghi la mappa, però, devi saper dire che cosa vuol dire ogni parola."},{"phase":"Preparazione","title":"Leggiamo prima di disegnare","text":["Leggi o ascolta questo testo. La morale è l’insegnamento sui comportamenti suggerito dalla storia. Può essere dichiarato oppure lasciato da ricavare al lettore."],"visual":{"type":"quote","label":"Il testo di partenza","text":"La favola è un racconto breve. I personaggi sono spesso animali che parlano e si comportano come persone. La storia contiene un insegnamento sui comportamenti: questo insegnamento si chiama morale. A volte la morale è scritta chiaramente; altre volte il lettore la ricava da ciò che accade."},"action":"Cerca nel testo tre cose: com’è la storia, chi sono i personaggi, qual è il messaggio.","hint":"Il messaggio è ciò che la storia vuole farci capire. In questo testo coincide con la morale. Prima di usare una parola nella mappa, verifica di sapere che cosa significa."},{"phase":"Preparazione","title":"Scegli parole che ti ricordano l’idea","text":["Osserva la frase “La favola è un racconto breve”. Per ricordare che tipo di testo è, teniamo “racconto”. Per ricordare la sua lunghezza, teniamo “breve”. Sono parole chiave perché ci aiutano a ricostruire l’informazione."],"visual":{"type":"quote","label":"Dalla frase alle parole utili","text":"La favola è un racconto breve.\n\nTipo di testo → racconto\nLunghezza → breve"},"action":"Scrivi “racconto breve” sul foglio. Poi prova a usarlo per dire la frase completa.","hint":"Le altre parole della frase servono ancora. Nella mappa concettuale le scriviamo sulle frecce. Nella mappa mentale le diciamo a voce quando spieghiamo."},{"phase":"Preparazione","title":"Distingui il gruppo dal suo dettaglio","text":["In questa frase, “personaggi” è il gruppo di cui si parla. Le parole successive dicono qualcosa di più su quel gruppo. Prima di disegnare la mappa, cerca l’informazione da tenere."],"visual":{"type":"quote","label":"La frase da esaminare","text":"I personaggi sono spesso animali che parlano e si comportano come persone."},"action":"Sul foglio scrivi “Personaggi”. Accanto, annota poche parole che dicano chi sono spesso. Tieni davanti la frase e poi avanza per controllare.","hint":"Chiediti: che tipo di personaggi descrive questa frase? C’è una parola che evita di dire “tutti” o “sempre”? Scrivila anche nella tua nota."},{"phase":"Controllo della preparazione","title":"“Spesso animali” mantiene una precisazione","text":["Una nota possibile è “Personaggi → spesso animali”. “Personaggi” indica il gruppo; “spesso animali” aggiunge un dettaglio. La parola “spesso” tiene il significato del testo: molte volte, non sempre."],"visual":{"type":"quote","label":"Frase e nota","text":"I personaggi sono spesso animali che parlano e si comportano come persone.\n\nPersonaggi → spesso animali"},"action":"Confronta la tua nota. Se hai scritto solo “animali”, aggiungi “spesso”. Potrai aggiungere in seguito anche il dettaglio su come parlano e agiscono.","hint":"In ogni riquadro bastano poche parole. Aggiungi i dettagli uno alla volta. Mettili sempre vicino al gruppo di cui parlano."},{"phase":"Esempio spiegato","title":"Mettiamo il tema al centro","text":["Il tema è “Favola”. Scriviamolo al centro: da qui partiranno i rami. Il centro deve farti capire subito di che cosa parla la mappa."],"visual":{"type":"map","map":"favola","show":1},"action":"Scrivi “Favola” al centro del foglio e circonda la parola con una forma semplice.","hint":"Non serve un disegno elaborato. Se ti aiuta puoi aggiungere una piccola immagine, ma la parola deve restare leggibile e riconoscibile."},{"phase":"Esempio spiegato","title":"Il primo ramo raccoglie la storia","text":["Nel testo leggiamo che la favola è un racconto breve. Apriamo un ramo “Storia”: è il nome della categoria in cui metteremo le caratteristiche del racconto."],"visual":{"type":"map","map":"favola","show":2},"action":"Dal centro traccia una linea verso “Storia”. Lascia spazio dopo questa parola per aggiungere un dettaglio.","hint":"Una categoria è un gruppo di informazioni simili. “Storia” è il gruppo delle informazioni sul racconto. Gli animali andranno in un altro gruppo: quello dei personaggi."},{"phase":"Esempio spiegato","title":"Aggiungiamo una parola che ci faccia ricordare","text":["Sul ramo “Storia” aggiungiamo “Breve”. È una parola chiave: poche lettere ci aiutano a ritrovare l’informazione “la favola è un racconto breve”."],"visual":{"type":"map","map":"favola","show":3},"action":"Aggiungi “Breve” alla fine di un piccolo ramo che parte da “Storia”. Poi spiega a voce che cosa significa.","hint":"Una parola chiave funziona se per te richiama un’informazione precisa. Se “breve” da sola non basta, puoi scrivere “racconto breve”. La mappa non deve diventare un indovinello."},{"phase":"Esempio spiegato","title":"Un secondo ramo per i personaggi","text":["Ora creiamo il ramo “Personaggi”. Il testo dice che sono spesso animali: usiamo proprio le parole “Spesso animali”, perché non tutte le favole devono avere animali."],"visual":{"type":"map","map":"favola","show":5},"action":"Dal centro, traccia un ramo e scrivi “Personaggi”. Poi aggiungi un ramo più piccolo con “Spesso animali”.","hint":"Dal tema centrale partono i rami principali. I dettagli partono dal ramo a cui appartengono: “Spesso animali” deve essere vicino a “Personaggi”, non vicino a “Storia”."},{"phase":"Esempio spiegato","title":"Un terzo ramo per il messaggio","text":["Il ramo “Messaggio” raccoglie l’insegnamento della favola. Aggiungiamo “Morale”, il nome che il testo usa per quell’insegnamento."],"visual":{"type":"map","map":"favola","show":7},"action":"Aggiungi “Messaggio” e poi “Morale”. Spiega a voce: “La morale è l’insegnamento sui comportamenti suggerito dalla storia”.","hint":"Se il termine “morale” ti resta poco chiaro, nella tua mappa puoi scrivere “Morale: insegnamento”. Scegli parole che ti permettano di spiegare, non solo di copiare."},{"phase":"Controllo dell’esempio","title":"Usiamo la mappa completa","text":["Dal centro puoi scegliere tre rami. Per parlare della lunghezza vai a “Storia”. Per dire chi compare vai a “Personaggi”. Per spiegare l’insegnamento vai a “Messaggio”."],"visual":{"type":"map","map":"favola","show":7},"action":"Scegli un ramo. Usalo per dire a voce una cosa sulla favola. Poi controlla nel testo. La favola è un racconto breve. I personaggi sono spesso animali. La morale è un insegnamento.","hint":"La mappa raccoglie una selezione di informazioni. Se il compito richiede anche come si ricava la morale, aggiungi un dettaglio a quel ramo usando il testo."},{"phase":"Prova guidata","title":"Scegli in quale ramo mettere un dettaglio","text":["Ora aggiungiamo un’informazione nuova. Il testo dice che gli animali parlano e si comportano come persone. Nella mappa non c’era ancora."],"visual":{"type":"quote","label":"Il dettaglio da collocare","text":"“I personaggi sono spesso animali che parlano e si comportano come persone”.\n\nRami disponibili: Storia — Personaggi — Messaggio."},"action":"Scegli il ramo adatto. Aggiungi sul foglio il dettaglio “Parlano e agiscono come persone” nel punto che hai scelto. Avanza per confrontarlo.","hint":"Chiediti a chi si riferisce il dettaglio. Parla degli animali che fanno da personaggi: per questo va nello stesso ramo, non in quello sulla lunghezza della storia."},{"phase":"Controllo guidato","title":"Controlla perché hai scelto quel ramo","text":["Questo dettaglio parla dei personaggi. Si può mettere così: prima “Personaggi”, poi “Spesso animali”, poi “Parlano e agiscono come persone”."],"visual":{"type":"quote","label":"Il collegamento da controllare","text":"Personaggi → Spesso animali → Parlano e agiscono come persone"},"action":"Guarda il tuo foglio e spiega perché quelle informazioni stanno insieme. Se serve, sposta il dettaglio nel ramo dei personaggi.","hint":"Metti ogni parola vicino all’idea di cui parla. Così, quando studi, la colleghi all’idea giusta."},{"phase":"Compito nuovo","title":"Organizza un altro argomento","text":["Ora il tema è “Racconto d’avventura”. Leggi il testo e scegli tre categorie per organizzarlo: impresa, protagonista e luoghi.","Il protagonista è il personaggio principale. Un’impresa è un’azione impegnativa da portare a termine."],"visual":{"type":"quote","label":"Testo per il compito nuovo","text":"Il racconto d’avventura racconta un’impresa rischiosa. Il protagonista affronta pericoli e ostacoli. I luoghi possono essere lontani o sconosciuti. Gli eventi creano attesa: il lettore vuole scoprire come finirà l’impresa."},"action":"Scrivi il tema al centro di un foglio nuovo. Da lì fai partire i tre rami con i nomi delle categorie.","hint":"Puoi spostare i rami dove c’è più spazio. Il posto sul foglio conta poco. Conta che ogni dettaglio stia nel ramo giusto."},{"phase":"Compito nuovo","title":"Scegli dettagli che ti aiutino a spiegare","text":["Per ogni ramo scegli poche parole dal testo. Tieni anche le parole piccole che cambiano il senso, come “possono”. Il testo dice che i luoghi possono essere lontani o sconosciuti. Non dice che lo sono sempre."],"visual":{"type":"quote","label":"Tieni davanti il testo","text":"Il racconto d’avventura racconta un’impresa rischiosa. Il protagonista affronta pericoli e ostacoli. I luoghi possono essere lontani o sconosciuti. Gli eventi creano attesa: il lettore vuole scoprire come finirà l’impresa."},"action":"Aggiungi almeno un dettaglio per ramo e prova a spiegare la mappa. Vai avanti quando vuoi confrontare la tua mappa.","hint":"Per “Impresa” puoi scegliere “rischiosa”. Cerca poi che cosa fa il protagonista e quali caratteristiche possono avere i luoghi."},{"phase":"Controllo","title":"Confronta i gruppi di informazioni","text":["Ecco un modo possibile di fare la mappa. La tua può avere altre parole o i rami in altri posti. Controlla una cosa: con la tua mappa ritrovi le informazioni del testo?"],"visual":{"type":"list","label":"Tre rami possibili","items":["Impresa → rischiosa.","Protagonista → affronta pericoli e ostacoli.","Luoghi → possono essere lontani o sconosciuti."]},"action":"Scegli una tua parola chiave e spiega l’intera informazione che richiama. Se non ci riesci, rendi l’etichetta più chiara.","hint":"Il testo dice anche che gli eventi creano attesa. Se serve al tuo compito, puoi aggiungere un ramo “Eventi” con “creano attesa”. Non è necessario far entrare tutto in tre rami."},{"phase":"Ripresa a casa","title":"Controlla se la mappa ti fa ritrovare le idee","text":["A casa comincia da un testo breve e tienilo davanti. Scrivi il tema al centro, scegli i rami e aggiungi i dettagli uno alla volta.","Poi usa la mappa per spiegare. Se una parola non ti ricorda niente, riaprila al testo e sostituiscila con una più chiara."],"visual":{"type":"list","label":"Il tuo promemoria","items":["Tema al centro.","Un ramo per ciascun aspetto scelto.","Dettagli vicino all’aspetto a cui si riferiscono.","Una spiegazione a voce per controllare se le parole aiutano."]},"action":"Prova con un breve paragrafo del tuo libro. Nel Menu puoi stampare esempio, prova e promemoria per casa.","hint":"Colori e piccoli disegni possono aiutarti a riconoscere i rami. Usali se ti servono. Prima però controlla che la mappa si legga bene e che ti aiuti a studiare."}],"coach":{"prepare":"Tenere disponibile il testo mentre si costruisce la mappa. Leggerlo insieme e verificare “morale” come insegnamento sui comportamenti. La disposizione proposta è un esempio, non uno schema da imporre a tutti i testi.","adaptations":[["Leggere e scegliere informazioni — possibile difficoltà con dislessia","Il carico di lettura impedisce di ritrovare la frase a cui collegare un nodo.","Leggere ad alta voce o usare la sintesi vocale abituale, una frase per volta. Lasciare il testo visibile e far indicare quale informazione viene rappresentata."],["Scrivere e disporre i nodi — possibile difficoltà con disgrafia","Lo studente sa spiegare i collegamenti ma perde spazio o non riesce a rileggere le etichette.","Offrire riquadri già pronti o cartellini mobili. Chiedere allo studente di scegliere e collegare; non sostituirsi nella decisione sul significato."],["Ortografia — possibile difficoltà con disortografia","La ricerca della grafia corretta interrompe ogni scelta concettuale.","Consentire copia del termine dal testo o etichette predisposte. Controllare prima i collegamenti e poi, separatamente, l’ortografia."],["Sovraccarico visivo — difficoltà trasversale","Molti rami rendono difficile ritrovare il punto di partenza.","Costruire un ramo alla volta, distanziare le parti e verificare se lo studente riesce a spiegare un percorso. La difficoltà non implica un DSA specifico."]],"sources":["w3c-coga","novak","aiddsa","ciu"],"goal":"Osservare se lo studente raggruppa informazioni per significato e usa le parole chiave per ricostruire una spiegazione. Non valutare decorazione, quantità di colori o somiglianza estetica al modello.","observe":"Chiedere “Perché questo dettaglio sta in questo ramo?” e “Quale frase ti ricorda questa parola?”. Distinguere mappa mentale come organizzazione radiale da mappa concettuale con relazioni esplicite. Il formato mentale qui proposto è un adattamento editoriale, non una prescrizione universale."},"print":{"modelTitle":"Mappa mentale — esempio","visual":{"type":"map","map":"favola","show":7},"model":["La favola è
