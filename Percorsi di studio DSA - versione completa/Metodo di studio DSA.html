<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light"><title>Un passo alla volta — metodo di studio</title><style>:root{font-family:Arial,Helvetica,sans-serif;color:#203638;background:#f5f4ee;font-synthesis:none;--accent:#165c54;--ink:#203638;--paper:#fff;--line:#c7d2ce;--muted:#4d6262;font-size:20px}*{box-sizing:border-box}body{margin:0}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;border:1px solid #78958e;background:white;color:var(--ink);border-radius:10px;padding:.65rem 1rem;min-height:48px;text-align:left;line-height:1.3}button:hover{border-color:var(--accent);background:#edf5f0}button:focus-visible,a:focus-visible{outline:3px solid #b75216;outline-offset:4px}button.primary{background:var(--accent);border-color:var(--accent);color:white}button.primary:hover{background:#10443e}button:disabled{opacity:.4;cursor:default}p{line-height:1.6;margin:.65rem 0 1rem}h1,h2,h3{line-height:1.25;color:var(--ink)}h1{font-size:1.8rem;letter-spacing:-.025em;margin:.35rem 0 1.1rem}h2{font-size:1.35rem;margin:1.2rem 0 .7rem}h3{font-size:1.12rem}a{color:#15564f;text-underline-offset:3px}strong{font-weight:700}ul,ol{padding-left:1.35rem}li{line-height:1.55;margin:.5rem 0}main{font-size:1rem}.large{font-size:24px}.skip{position:absolute;top:-100px;padding:10px;background:white;z-index:10}.skip:focus{top:0}.topbar{max-width:1040px;margin:auto;padding:1.1rem 1.6rem;display:flex;justify-content:space-between;align-items:center;gap:1rem}.brand{font-size:.85rem;letter-spacing:.02em}.brand strong{display:block}.brand span{display:block;font-size:.7rem;color:var(--muted);margin-top:4px}.topbar button{font-size:.85rem;padding:.45rem .9rem}.shell{max-width:1000px;margin:0 auto;padding:0 1.6rem 7rem}.paper{background:white;border:1px solid #dce1db;border-radius:18px;padding:2rem 2.4rem;box-shadow:0 5px 22px #20363808;min-height:440px}.kicker{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);font-weight:bold;margin:0 0 .6rem}.route-label{font-size:.8rem;color:var(--muted);margin:0 0 .7rem}.intro{max-width:36rem}.choices{display:grid;gap:.85rem;margin-top:1.7rem}.choice{padding:1.05rem 1.2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;border:1px solid #c5d4ce}.choice-title{font-size:1.08rem;font-weight:bold}.choice-sub{display:block;font-size:.85rem;font-weight:normal;color:var(--muted);margin-top:.4rem;line-height:1.45}.choice-arrow{font-size:1.2rem;color:var(--accent)}.small{font-size:.82rem;color:var(--muted);line-height:1.55}.copy p:last-child{margin-bottom:1.2rem}.visual{margin:1.2rem 0;padding:1.05rem 1.2rem;background:#f2f6f3;border-radius:12px;border:1px solid #d4e1da}.visual-label{font-size:.76rem;letter-spacing:.03em;color:#365650;font-weight:bold;margin:0 0 .8rem}.quote{white-space:pre-line;line-height:1.65;margin:0;font-size:1.04rem}.math-lines{display:grid;gap:.5rem;font-size:1.3rem;line-height:1.55;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.math-lines div+div{border-top:1px solid #d9e3df;padding-top:.4rem}.action{border-left:4px solid var(--accent);padding:.1rem 0 .1rem 1rem;margin:1.4rem 0 .8rem}.action-label{display:block;font-size:.78rem;font-weight:bold;color:var(--accent);margin-bottom:.3rem}.help-link{border:0;background:transparent;text-decoration:underline;text-underline-offset:4px;color:#285c55;font-size:.86rem;padding:.4rem 0;margin-top:.5rem}.help-link:hover{background:transparent}.navigation{position:fixed;bottom:0;left:0;width:100%;z-index:5;background:#f5f4eef5;border-top:1px solid #d1d9d4}.navigation-inner{max-width:1000px;margin:auto;padding:.7rem 1.6rem;display:grid;grid-template-columns:1fr auto 1fr;gap:1rem;align-items:center}.navigation button:first-child{justify-self:start}.navigation button:last-child{justify-self:end;min-width:125px;text-align:center}.counter{font-size:.76rem;color:var(--muted);text-align:center}.simple-back{margin-top:1.2rem}.menu-list{max-width:32rem}.note-sheet{background:white;border:2px solid #4b6660;border-radius:2px;font-size:.86rem;line-height:1.5}.note-heading{font-weight:bold;padding:.55rem .7rem;border-bottom:1px solid #6c837d}.note-columns{display:grid;grid-template-columns:34% 66%;min-height:155px}.note-col{padding:.7rem;border-right:1px solid #6c837d}.note-col:last-child{border-right:0}.note-col b,.note-summary b{font-size:.72rem;display:block;margin-bottom:.6rem}.note-col p{font-size:.85rem;line-height:1.5;margin:.65rem 0}.note-summary{border-top:1px solid #6c837d;padding:.7rem;min-height:70px}.note-summary p{margin:0;font-size:.85rem}.note-active{background:#ecf5ed}.note-line{min-height:1.6rem;border-bottom:1px solid #d9e1dc}.map-wrap{padding:.7rem .3rem}.map-wrap svg{display:block;width:100%;height:auto;max-height:425px}.map-mobile{display:none}.sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}.coach-section{border-top:1px solid #d5dfd9;margin:1.4rem 0;padding-top:.3rem}.coach-section .small{color:#3a5650}.script{background:#f2f6f3;padding:1rem;border-left:4px solid #45695f}.coach-adapt{margin:1.4rem 0}.source-list{font-size:.85rem}.source-list a{overflow-wrap:anywhere}.print-view{max-width:900px;margin:auto;padding:1rem}.print-tools{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:1rem}.print-page{background:white;padding:14mm;width:210mm;min-height:280mm;margin:1rem auto;border:1px solid #b8c6c0;font-size:11pt;line-height:1.4;color:#111}.print-page h1{font-size:21pt;color:#111;letter-spacing:0}.print-page h2{font-size:15pt;color:#111}.print-page h3{font-size:12pt;color:#111}.print-page p,.print-page li{font-size:11pt;line-height:1.45}.print-page .map-wrap svg{max-height:62mm}.print-page .visual{background:white;color:#111;padding:8px;border-color:#777}.print-page .visual-label{color:#111;font-size:10pt}.print-page .note-sheet{font-size:10pt}.print-page .note-col p,.print-page .note-summary p{font-size:10pt}.print-page .note-col b,.print-page .note-summary b{font-size:9pt}.print-page .note-columns{min-height:35mm}.print-page .note-summary{min-height:15mm}.print-page .small{font-size:9pt;color:#333}.writing-space{height:29mm;background:repeating-linear-gradient(white,white 7mm,#aaa 7.1mm,white 7.3mm);margin:5mm 0}.page-id{font-size:9pt;color:#333;border-bottom:1px solid #999;padding-bottom:3mm}.observation{border-collapse:collapse;width:100%;font-size:10pt}.observation td,.observation th{border:1px solid #777;padding:5px;text-align:left;font-weight:normal}.print-page .note-line{min-height:5mm}.coach-print{max-width:760px;margin:auto;background:white;padding:2rem}.screen-only{display:block}

.map-wrap svg.map-narrow{display:none}

/* Versione completa: ricerca, tabelle, linee del tempo, testo delle mappe. */
.search-label{display:block;font-size:.95rem;line-height:1.5;margin:.4rem 0 .6rem;max-width:36rem}
.search-input{font:inherit;font-size:1.05rem;width:100%;max-width:32rem;min-height:48px;padding:.6rem .8rem;border:2px solid #78958e;border-radius:10px;background:white;color:var(--ink)}
.search-input:focus-visible{outline:3px solid #b75216;outline-offset:3px}
.table-wrap{overflow-x:auto}
.data-table{border-collapse:collapse;width:100%;font-size:.95rem;background:white}
.data-table th,.data-table td{border:1px solid #9fb3ac;padding:.45rem .6rem;text-align:left;vertical-align:top;line-height:1.45}
.data-table thead th{background:#e5efe8;font-size:.85rem}
.data-table tbody th{font-weight:bold}
.timeline{list-style:none;padding:0;margin:0;border-left:3px solid #4c7164}
.timeline li{display:grid;grid-template-columns:minmax(5.5rem,auto) 1fr;gap:.8rem;margin:.55rem 0;padding-left:.9rem;position:relative}
.timeline li::before{content:"";position:absolute;left:-.5rem;top:.55rem;width:.7rem;height:.7rem;border-radius:50%;background:#4c7164}
.timeline .when{font-weight:bold;font-variant-numeric:tabular-nums}
.map-text{margin-top:.6rem;font-size:.9rem}
.map-text summary{cursor:pointer;color:#285c55;text-decoration:underline;text-underline-offset:4px;padding:.3rem 0}
.map-text summary:focus-visible{outline:3px solid #b75216;outline-offset:3px}
.map-text ul{margin:.4rem 0}
@media print{.map-text{display:none}.data-table thead th{background:white}.timeline li::before{background:black}}
@media(max-width:700px){.timeline li{grid-template-columns:1fr;gap:.1rem}}
.map-wrap svg.map-wide{max-height:min(420px,58vh)}
@media(max-width:700px){.data-table{font-size:.85rem}.data-table th,.data-table td{padding:.35rem .4rem}}
</style></head><body><a class="skip" href="#main">Vai al contenuto</a><div id="app"></div><noscript>Per aprire i percorsi, abilita JavaScript nel browser. Il file funziona senza Internet.</noscript><script id="data" type="application/json">{"subjects":[{"name":"Italiano","areas":["Antologia e comprensione","Poesia","Epica e letteratura","Grammatica","Scrittura e comunicazione"]},{"name":"Storia","areas":["Studiare e ricostruire il passato"]},{"name":"Geografia","areas":["Orientarsi e comprendere i territori"]},{"name":"Matematica","areas":["Aritmetica e algebra","Geometria, dati e probabilità"]},{"name":"Scienze","areas":["Osservare, sperimentare e spiegare"]},{"name":"Inglese","areas":["Comprendere e comunicare"]},{"name":"Seconda lingua comunitaria","areas":["Francese, spagnolo e tedesco"]},{"name":"Tecnologia","areas":["Oggetti, progetti e rappresentazioni"]},{"name":"Arte e immagine","areas":["Osservare, creare e interpretare"]},{"name":"Musica","areas":["Ascoltare, eseguire e conoscere"]},{"name":"Educazione fisica","areas":["Movimento, gioco e conoscenze"]},{"name":"Educazione civica","areas":["Comprendere, discutere e partecipare"]},{"name":"Religione","areas":["Testi, tradizioni e domande"]},{"name":"Attività alternative","areas":["Leggere, confrontarsi e collaborare"]},{"name":"Strumento musicale","areas":["Preparare e suonare un brano"]},{"name":"In tutte le materie","areas":["Organizzare il lavoro e lo studio","Seguire la lezione e prendere appunti"]}],"courses":[{"id":"M01-01","title":"Leggere in silenzio e capire","intro":"Leggi un testo breve un pezzo alla volta e controlla che cosa hai capito.","slides":[{"phase":"Preparazione","title":"Leggere in silenzio per capire","text":["Leggere in silenzio vuol dire leggere con gli occhi, senza voce. Lo scopo è capire la storia. Non serve leggere in fretta.","Imparerai a leggere un pezzo alla volta. Dopo ogni pezzo ti fermerai a pensare. Alla fine controllerai che cosa ricordi."],"visual":{"type":"list","label":"Prepara","items":["Il testo da leggere","Un cartoncino o un righello per seguire la riga","Un foglio e una matita"]},"action":"Prepara il materiale. Scrivi in alto sul foglio: “Lettura silenziosa”.","hint":"Il cartoncino copre le righe che non stai leggendo. Così l’occhio segue una riga alla volta. Se di solito usi la sintesi vocale, puoi usarla anche qui. Conta capire la storia."},{"phase":"Preparazione","title":"Prima di leggere, sai che cosa cercare","text":["Prima di leggere, decidi che cosa vuoi scoprire. Così, mentre leggi, sai dove guardare.","Per un racconto breve bastano tre domande. Di chi parla la storia? Quale problema c’è? Come finisce?"],"visual":{"type":"list","label":"Le tre domande","items":["Di chi parla la storia?","Quale problema c’è?","Come finisce?"]},"action":"Scrivi le tre domande sul foglio, una sotto l’altra. Lascia una riga vuota sotto ogni domanda.","hint":"Un problema è qualcosa che non va e che qualcuno deve risolvere. Per esempio: piove e hai dimenticato l’ombrello. Il finale dice come si risolve."},{"phase":"Esempio spiegato","title":"Leggi solo il primo pezzo","text":["Ecco il primo pezzo del testo. Un pezzo è formato da una o due frasi. Copri il resto del testo con il cartoncino.","Dopo il pezzo, fermati. Chiediti: che cosa è successo? Rispondi con poche parole."],"visual":{"type":"quote","label":"Primo pezzo","text":"In piazza, Pietro vide un cane da solo. Il cane correva tra le panchine e annusava per terra."},"action":"Leggi il pezzo con gli occhi. Poi scrivi sul foglio una nota breve: “cane da solo in piazza”.","hint":"Se perdi la riga, appoggia il cartoncino sotto la riga che stai leggendo. Scendi di una riga solo quando l’hai finita. Puoi rileggere il pezzo una seconda volta."},{"phase":"Esempio spiegato","title":"Un pezzo, poi una nota","text":["Ora leggi il secondo pezzo. Poi fermati e scrivi un’altra nota. Fai lo stesso con il terzo pezzo.","Ogni nota ricorda un fatto della storia. Le note ti serviranno tra poco."],"visual":{"type":"quote","label":"Secondo e terzo pezzo","text":"Sul collare c’era una medaglietta con il nome Briciola. Pietro chiamò il cane per nome e il cane si fermò.\n\nPoco dopo arrivò di corsa una signora con un guinzaglio. Era la padrona di Briciola. Ringraziò Pietro e agganciò il guinzaglio al collare."},"action":"Leggi un pezzo alla volta. Dopo ogni pezzo scrivi una nota. Note possibili: “medaglietta: Briciola” e “arriva la padrona”.","hint":"Una nota è breve: due o tre parole bastano. Scegli parole che ti fanno tornare in mente il fatto. La parola “signora” da sola non basta: scrivi anche che cosa fa."},{"phase":"Esempio spiegato","title":"Copri il testo e rispondi","text":["Ora copri tutto il testo. Guarda solo le tue note e le tre domande.","Prova a rispondere senza rileggere. In questo momento scopri che cosa hai capito davvero."],"visual":{"type":"list","label":"Le tue note","items":["cane da solo in piazza","medaglietta: Briciola","arriva la padrona"]},"action":"Sotto ogni domanda scrivi una risposta breve. Usa le note per ricordare.","hint":"Se una risposta non ti viene, lascia lo spazio vuoto e vai avanti. La completerai quando riapri il testo. Anche sapere che cosa non ricordi ti aiuta."},{"phase":"Controllo dell’esempio","title":"Riapri il testo e controlla","text":["Ora riapri il testo e confronta. Qui sotto trovi le risposte possibili.","Ogni risposta si deve ritrovare nel testo. Se una tua risposta è diversa, cerca la frase che ti serve e correggi."],"visual":{"type":"table","label":"Risposte possibili","columns":["Domanda","Risposta"],"rows":[["Di chi parla la storia?","Di Pietro e di un cane."],["Quale problema c’è?","Il cane è da solo in piazza, senza la sua padrona."],["Come finisce?","Pietro chiama il cane per nome. Arriva la padrona e gli mette il guinzaglio."]]},"action":"Controlla le tue risposte una per una. Correggi con un colore diverso.","hint":"Un errore frequente è scambiare chi fa l’azione. Per esempio: “La signora vede il cane in piazza”. Nel testo, chi vede il cane? Pietro. Cerca sempre chi fa ogni azione."},{"phase":"Prova guidata","title":"Prova tu con un nuovo testo","text":["Ora leggi questo testo nello stesso modo. È diviso in due pezzi.","Dopo ogni pezzo fermati e scrivi una nota. Poi copri il testo e rispondi alle tre domande."],"visual":{"type":"quote","label":"La tua prova","text":"Ivan colorava un cartellone per la mostra di scienze. Il gatto saltò sul tavolo e rovesciò l’acqua dei pennelli.\n\nUn angolo del cartellone si bagnò. Ivan lo asciugò con il phon e coprì la macchia con il disegno di un sole."},"action":"Scrivi una nota dopo ogni pezzo. Poi copri il testo. Sul foglio rispondi: di chi parla la storia, quale problema c’è, come finisce.","hint":"Per il primo pezzo chiediti: che cosa ha fatto il gatto? Per il secondo: che cosa ha fatto Ivan per rimediare? Le risposte sono le tue note."},{"phase":"Controllo guidato","title":"Confronta le tue risposte","text":["Riapri il testo e confronta. Le tue parole possono essere diverse. Conta che le informazioni siano le stesse."],"visual":{"type":"table","label":"Risposte possibili","columns":["Domanda","Risposta"],"rows":[["Di chi parla la storia?","Di Ivan e del suo gatto."],["Quale problema c’è?","Il gatto rovescia l’acqua e un angolo del cartellone si bagna."],["Come finisce?","Ivan asciuga il cartellone con il phon. Poi copre la macchia con un sole."]]},"action":"Controlla ogni risposta. Se nel finale mancano il phon o il sole, aggiungili: sono il modo in cui Ivan risolve il problema.","hint":"Se avevi scritto “Il gatto rovina il cartellone”, è vero solo in parte. Il cartellone si bagna in un angolo. Poi Ivan lo sistema. Il finale cambia la storia: tienilo nella risposta."},{"phase":"Compito nuovo","title":"Adesso leggi da solo","text":["Ecco un testo nuovo, diviso in tre pezzi. Usa il metodo da solo. Prima scrivi le tre domande. Poi leggi un pezzo alla volta e scrivi una nota. Alla fine rispondi con il testo coperto."],"visual":{"type":"quote","label":"Compito nuovo","text":"La partita di pallavolo stava per cominciare. Ma la rete era troppo bassa: la corda che la teneva si era rotta.\n\nBea prese dalla borsa un laccio da scarpe di ricambio. Con il laccio legò insieme i due pezzi della corda.\n\nLa rete tornò all’altezza giusta. La partita cominciò con dieci minuti di ritardo."},"action":"Leggi, scrivi le note e rispondi alle tre domande con il testo coperto. Poi vai avanti per controllare.","hint":"Se ti perdi, torna alle tre domande: di chi parla la storia, quale problema c’è, come finisce. Una nota per ogni pezzo basta."},{"phase":"Controllo","title":"Controlla le risposte e togli le aggiunte","text":["La storia parla di Bea. Il problema è la rete troppo bassa, perché la corda si è rotta. Alla fine Bea lega la corda con un laccio e la partita comincia.","Controlla anche se hai aggiunto qualcosa. Ogni informazione deve essere nel testo."],"visual":{"type":"quote","label":"Un’aggiunta da riconoscere","text":"Risposta con un’aggiunta: “Alla fine Bea vince la partita”.\n\nNel testo c’è scritto: “La partita cominciò con dieci minuti di ritardo”."},"action":"Riapri il testo e confronta le tue risposte. Cancella ogni fatto che nel testo non c’è.","hint":"Mentre leggi, la mente immagina il seguito. È normale. Ma il testo finisce quando la partita comincia. Chi vince, non lo sappiamo."},{"phase":"Ripresa a casa","title":"Usa il metodo sui tuoi testi","text":["A casa usa il metodo con i brani dell’antologia. L’antologia è il libro di lettura di italiano.","Il giorno dopo, prova a ripetere le tre risposte senza guardare. Se un pezzo resta poco chiaro, segnalo con un punto interrogativo e chiedi aiuto."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Scrivi le domande: di chi parla, quale problema, come finisce.","Leggi un pezzo alla volta con il cartoncino.","Dopo ogni pezzo scrivi una nota breve.","Copri il testo e rispondi.","Riapri il testo e controlla."]},"action":"Scegli un brano breve del tuo libro e prova la sequenza. Nel Menu trovi la scheda da stampare.","hint":"Con un brano lungo, fai pezzi più grandi: un paragrafo alla volta. Un paragrafo è un gruppo di frasi che comincia andando a capo. Se ti stanchi, fai una pausa alla fine di un pezzo."}],"coach":{"goal":"Insegnare una lettura silenziosa a pezzi, con una pausa per fissare ogni evento e un recupero a testo coperto. Osservare se lo studente ricostruisce personaggio, problema e finale senza aggiungere eventi. La velocità di lettura non è un obiettivo di questo percorso.","prepare":"Avere i tre testi sullo schermo o stampati con carattere grande e interlinea ampia. Preparare un cartoncino o un righello come segnariga. Se lo studente usa abitualmente la sintesi vocale, lasciarla disponibile e annotarlo: qui si osserva la comprensione, non la decodifica.","observe":"Dopo ogni pezzo chiedere “Che cosa è successo adesso?”. Distinguere un errore di decodifica (una parola letta male) da un errore di comprensione (chi fa l’azione, ordine degli eventi, aggiunte). Nel recupero a testo coperto annotare che cosa emerge senza aiuto e che cosa solo dopo la rilettura.","adaptations":[["Lettura del pezzo — possibile difficoltà con dislessia","Salta una riga o la rilegge senza accorgersene; perde il filo a metà pezzo.","Usare il segnariga e pezzi di una sola frase. Confrontare omissioni e fatica su due pezzi, con e senza segnariga, e tenere l’aiuto che riduce gli errori."],["Nota dopo ogni pezzo — possibile difficoltà con disgrafia o disortografia","La scrittura della nota interrompe la lettura e lo studente dimentica il pezzo.","Accettare una nota di una o due parole, un piccolo disegno o una nota detta a voce all’adulto. Verificare se il recupero a testo coperto migliora."],["Recupero a testo coperto — difficoltà trasversale (memoria e fatica)","Ricorda solo l’ultimo pezzo o si blocca quando il testo è coperto.","Ridurre il testo a due pezzi e chiedere una domanda alla volta, con le note visibili. Osservare se recupera anche il problema iniziale."]],"sources":["dunlosky2013","w3c-coga","aiddsa","aid"],"checks":"Testi originali scritti per l’esercitazione. Verificato che ogni risposta delle soluzioni sia ricavabile da una frase del testo e che le aggiunte da riconoscere non lo siano."},"print":{"modelTitle":"Lettura a pezzi — esempio","model":["Domande: Di chi parla la storia? Quale problema c’è? Come finisce?","Pezzo 1: In piazza, Pietro vide un cane da solo. Il cane correva tra le panchine e annusava per terra.\nNota: cane da solo in piazza.","Pezzo 2: Sul collare c’era una medaglietta con il nome Briciola. Pietro chiamò il cane per nome e il cane si fermò.\nNota: medaglietta: Briciola.","Pezzo 3: Poco dopo arrivò di corsa una signora con un guinzaglio. Era la padrona di Briciola. Ringraziò Pietro e agganciò il guinzaglio al collare.\nNota: arriva la padrona.","Con il testo coperto rispondo alle domande usando le note. Poi riapro il testo e controllo ogni risposta."],"practice":[["Prova guidata","Pezzo 1: Ivan colorava un cartellone per la mostra di scienze. Il gatto saltò sul tavolo e rovesciò l’acqua dei pennelli.\nPezzo 2: Un angolo del cartellone si bagnò. Ivan lo asciugò con il phon e coprì la macchia con il disegno di un sole.\nScrivi una nota dopo ogni pezzo. Poi copri il testo e rispondi alle tre domande."],["Compito nuovo","Pezzo 1: La partita di pallavolo stava per cominciare. Ma la rete era troppo bassa: la corda che la teneva si era rotta.\nPezzo 2: Bea prese dalla borsa un laccio da scarpe di ricambio. Con il laccio legò insieme i due pezzi della corda.\nPezzo 3: La rete tornò all’altezza giusta. La partita cominciò con dieci minuti di ritardo.\nScrivi le domande, leggi un pezzo alla volta, prendi una nota, poi rispondi con il testo coperto."]],"answers":["Prova guidata: la storia parla di Ivan e del suo gatto. Problema: il gatto rovescia l’acqua e un angolo del cartellone si bagna. Finale: Ivan lo asciuga con il phon e copre la macchia con un sole.","Compito nuovo: la storia parla di Bea. Problema: la rete è troppo bassa perché la corda si è rotta. Finale: Bea lega la corda con un laccio e la partita comincia con dieci minuti di ritardo.","Le tue parole possono essere diverse. Ogni informazione deve trovarsi nel testo: “Bea vince la partita” è un’aggiunta."],"home":["Prima di leggere scrivi le tre domande.","Leggi un pezzo alla volta e scrivi una nota breve.","Copri il testo e rispondi usando le note.","Riapri il testo, controlla e togli le aggiunte."]},"maps":{},"kind":"task","subject":"Italiano","area":"Antologia e comprensione"},{"id":"M01-02","title":"Leggere ad alta voce con espressione","intro":"Prepara un testo con segni per pause e tono, poi leggilo in modo che chi ascolta capisca.","slides":[{"phase":"Preparazione","title":"Leggere perché chi ascolta capisca","text":["Leggere con espressione vuol dire usare pause e tono di voce giusti. Così chi ascolta capisce chi parla e che cosa prova.","Prima di leggere a voce, preparerai il testo con alcuni segni a matita. Leggere un testo preparato è più facile."],"visual":{"type":"list","label":"Prepara","items":["Il testo stampato, con spazio tra le righe","Una matita","Una persona che ti ascolti"]},"action":"Chiedi a chi ti accompagna di ascoltarti. Tieni pronti il testo stampato e la matita. Nel Menu trovi la scheda con i testi.","hint":"Anche gli attori preparano il testo prima di leggerlo in pubblico. Preparare non è barare: ti aiuta a leggere meglio e con meno fatica."},{"phase":"Preparazione","title":"La punteggiatura guida la voce","text":["La punteggiatura è l’insieme dei segni tra le parole: virgola, punto, punto interrogativo e altri. Ogni segno dice qualcosa alla voce. Dopo il punto interrogativo e il punto esclamativo fai anche una pausa lunga."],"visual":{"type":"table","label":"Segni e voce","columns":["Segno","Che cosa fa la voce"],"rows":[[", virgola","Pausa breve. Segna /"],[": due punti","Pausa breve. Segna /"],[". punto","Pausa lunga e voce che scende. Segna //"],["? punto interrogativo","Domanda: la voce sale alla fine. Segna ↗"],["! punto esclamativo","Voce più forte o più vivace"],["“ ” virgolette","Parole dette da un personaggio"]]},"action":"Prova a voce: di’ “Piove.” e poi “Piove?”. Ascolta come cambia la voce sull’ultima parola.","hint":"I segni sono come i cartelli per strada. La virgola dice: rallenta un attimo. Il punto dice: fermati. Il punto interrogativo dice: stai facendo una domanda."},{"phase":"Esempio spiegato","title":"Prima leggi in silenzio e capisci la scena","text":["Prima di leggere a voce, leggi il testo in silenzio. Cerca chi parla e che cosa prova.","Le parole tra virgolette sono le battute. Una battuta è ciò che dice un personaggio. Qui ci sono due battute: una di Sara e una del nonno."],"visual":{"type":"quote","label":"Il testo dell’esempio","text":"Il nonno aprì una vecchia scatola. Dentro c’era una fotografia. Sara la guardò e chiese: “Chi è questo bambino?” Il nonno rise: “Sono io, a otto anni!”"},"action":"Leggi il testo in silenzio. Indica con il dito la battuta di Sara e poi quella del nonno.","hint":"Prima delle virgolette spesso c’è un verbo come “chiese” o “disse”. Ti dice chi sta parlando. Qui “chiese” va con Sara e “rise” va con il nonno."},{"phase":"Esempio spiegato","title":"Prepara le parole lunghe","text":["Una parola lunga può farti fermare a metà frase. Per questo la prepari prima. Dividila in sillabe e leggila piano, a pezzi. Poi leggila intera, due volte.","In questo testo la parola più lunga è “fotografia”."],"visual":{"type":"quote","label":"Una parola a pezzi","text":"fo – to – gra – fi – a\n\nfotografia"},"action":"Cerchia nel testo le parole che ti sembrano difficili. Leggi ognuna a pezzi, poi intera, due volte.","hint":"Puoi chiedere a chi ti accompagna di dire prima la parola. Poi la ripeti tu. Sentire la parola giusta ti aiuta a riconoscerla quando la leggi."},{"phase":"Esempio spiegato","title":"Segna le pause","text":["Ora segniamo le pause. Una barra / indica una pausa breve: la mettiamo dopo virgole e due punti. Due barre // indicano una pausa lunga: le mettiamo dopo punto, punto interrogativo e punto esclamativo."],"visual":{"type":"quote","label":"Il testo con le pause","text":"Il nonno aprì una vecchia scatola. //\nDentro c’era una fotografia. //\nSara la guardò e chiese: / “Chi è questo bambino?” //\nIl nonno rise: / “Sono io, / a otto anni!” //"},"action":"Sul tuo testo segna con la matita le stesse barre. Controlla di averne messa una dopo ogni segno di punteggiatura.","hint":"Durante una pausa breve, conta nella mente “uno”. Durante una pausa lunga, conta “uno, due”. Nella pausa lunga puoi anche prendere fiato."},{"phase":"Esempio spiegato","title":"Segna il tono delle battute","text":["La battuta di Sara è una domanda: la voce sale sull’ultima parola. Segniamo una freccia verso l’alto accanto a “bambino”.","Il testo dice che il nonno “rise”. Quindi la sua battuta va letta con voce allegra. Scriviamo “allegro” accanto alla battuta."],"visual":{"type":"quote","label":"Il testo con il tono","text":"Sara la guardò e chiese: / “Chi è questo bambino ↗?” //\nIl nonno rise: / “Sono io, / a otto anni!” // (allegro)"},"action":"Sul tuo testo disegna la freccia accanto a “bambino”. Accanto alla battuta del nonno scrivi “allegro”.","hint":"Prova a dire “Sono io!” sorridendo, poi con la faccia seria. Senti che la voce cambia? Il verbo prima della battuta ti dice quale voce usare."},{"phase":"Esempio spiegato","title":"Narratore e personaggi","text":["Il narratore è la voce che racconta la storia. Le sue parti si leggono con voce calma. Le battute si leggono con un tono un po’ diverso, adatto al personaggio. Così chi ascolta capisce quando parla qualcuno."],"visual":{"type":"table","label":"Come leggere ogni parte","columns":["Parte del testo","Voce"],"rows":[["Il nonno aprì una vecchia scatola.","Calma: parla il narratore"],["“Chi è questo bambino?”","Curiosa, che sale alla fine"],["“Sono io, a otto anni!”","Allegra"]]},"action":"Leggi a voce solo le due battute, una alla volta. Poi leggi solo le parti del narratore.","hint":"Non serve fare voci buffe o imitare un nonno. Basta cambiare un poco il tono. Pensa a come parleresti tu, se fossi curioso o allegro."},{"phase":"Esempio spiegato","title":"Leggi tutto il testo a voce","text":["Ora metti insieme tutto: parole preparate, pause e tono. Leggi una frase alla volta, guardando i segni a matita.","Chi ascolta non guarda il testo. Così può dirti se ha capito solo ascoltando."],"visual":{"type":"quote","label":"Il testo preparato","text":"Il nonno aprì una vecchia scatola. //\nDentro c’era una fotografia. //\nSara la guardò e chiese: / “Chi è questo bambino ↗?” //\nIl nonno rise: / “Sono io, / a otto anni!” // (allegro)"},"action":"Leggi tutto il testo a voce alta a chi ti accompagna. Rispetta le pause e il tono che hai segnato.","hint":"Se ti blocchi su una parola, fermati e leggila a pezzi. Poi riprendi dall’inizio della frase. Non serve ricominciare tutto il testo."},{"phase":"Controllo dell’esempio","title":"Chiedi a chi ti ha ascoltato","text":["Ora controlla se la lettura ha funzionato. Chi ti ha ascoltato risponde a due domande. Se risponde bene, pause e tono hanno fatto capire la scena."],"visual":{"type":"list","label":"Domande per chi ascolta","items":["Chi ha fatto la domanda?","Il nonno ha risposto con voce allegra o arrabbiata?"]},"action":"Fai le due domande a chi ti ha ascoltato. Se una risposta è sbagliata, rileggi solo la frase che riguarda quella domanda.","hint":"Chi ascolta non giudica te. Ti dice se la lettura ha fatto capire la scena. Così sai quale frase preparare meglio."},{"phase":"Prova guidata","title":"Prepara tu un nuovo testo","text":["Ora prepara questo testo con gli stessi passaggi. Leggilo prima in silenzio e trova chi parla.","Poi segna le pause, la freccia sopra la domanda e l’emozione accanto all’ultima battuta."],"visual":{"type":"quote","label":"La tua prova","text":"La mamma cercava qualcosa in tutta la casa. Poi chiese a Luca: “Hai visto le mie chiavi?” Luca rispose: “Sono sul tavolo, vicino al pane”. La mamma sorrise: “Eccole! Grazie!”"},"action":"Sul testo stampato segna / e //, la freccia e l’emozione. Poi vai avanti per confrontare.","hint":"Le pause seguono la punteggiatura, come nell’esempio. La domanda è la battuta con il punto interrogativo. Per l’emozione, guarda il verbo prima dell’ultima battuta: “sorrise”."},{"phase":"Controllo guidato","title":"Confronta i segni, poi leggi","text":["Ecco il testo preparato. Confronta i tuoi segni con questi e aggiungi quelli che mancano.","Poi leggi a voce alta. Alla fine chiedi a chi ascolta: chi ha fatto la domanda? Dove sono le chiavi?"],"visual":{"type":"quote","label":"Una preparazione possibile","text":"La mamma cercava qualcosa in tutta la casa. //\nPoi chiese a Luca: / “Hai visto le mie chiavi ↗?” //\nLuca rispose: / “Sono sul tavolo, / vicino al pane”. //\nLa mamma sorrise: / “Eccole! // Grazie!” // (contenta)"},"action":"Correggi i tuoi segni. Poi leggi il testo a chi ti accompagna e fai le due domande.","hint":"La risposta di Luca finisce con un punto: la voce scende. La domanda della mamma finisce con il punto interrogativo: la voce sale. Prova a leggere le due battute una dopo l’altra."},{"phase":"Compito nuovo","title":"Prepara e leggi da solo","text":["Ecco un testo nuovo. Fai tutti i passaggi da solo: lettura in silenzio, parole lunghe, pause, tono. Poi leggi a voce alta.","Attenzione: qui le righe vanno a capo in mezzo alle frasi."],"visual":{"type":"quote","label":"Compito nuovo","text":"Il temporale arrivò all’improvviso e tutti corsero\nsotto il portico della scuola. Elena guardò il cielo\nnero e gridò: “Che acquazzone!” Il maestro\nrispose con calma: “Aspettiamo qui. Tra poco smette”."},"action":"Prepara il testo e leggilo a chi ti accompagna. Poi chiedi: chi ha gridato? Il maestro era agitato o calmo?","hint":"Un acquazzone è una pioggia forte e improvvisa. Per il tono, guarda le parole prima delle battute: “gridò” e “con calma”."},{"phase":"Controllo","title":"Confronta la tua preparazione","text":["Ecco una preparazione possibile. Elena grida per la sorpresa: la sua battuta è vivace. Il maestro risponde con calma: la sua voce è tranquilla.","Le pause sono solo dove c’è la punteggiatura."],"visual":{"type":"quote","label":"Una preparazione possibile","text":"Il temporale arrivò all’improvviso e tutti corsero\nsotto il portico della scuola. // Elena guardò il cielo\nnero e gridò: / “Che acquazzone!” // (sorpresa) Il maestro\nrispose con calma: / “Aspettiamo qui. // Tra poco smette”. // (calmo)"},"action":"Confronta i tuoi segni con questi. Aggiungi quelli che mancano e rileggi le due battute.","hint":"Se la battuta di Elena ti è venuta piatta, prova a dirla più forte, come se ti stupissi davvero. Poi di’ quella del maestro piano e con calma. Senti la differenza tra le due voci?"},{"phase":"Controllo","title":"Un errore da riconoscere: la pausa a fine riga","text":["Un errore frequente è fermarsi alla fine di ogni riga. Così “il cielo” resta lontano da “nero” e la frase perde il suo senso.","La fine della riga dipende dalla pagina. Le pause, invece, dipendono dalla punteggiatura."],"visual":{"type":"quote","label":"Dove non fare la pausa","text":"Elena guardò il cielo\nnero e gridò…\n\nLeggi senza fermarti: “Elena guardò il cielo nero e gridò”."},"action":"Guarda il tuo testo. Se hai una pausa a fine riga senza punteggiatura, cancellala. Poi rileggi quella frase tutta di seguito.","hint":"Prima di andare a capo, guarda se c’è un segno. Se non c’è, passa subito alla riga sotto, come se la frase continuasse sulla stessa riga. Il cartoncino segnariga ti aiuta."},{"phase":"Ripresa a casa","title":"Prepara il testo prima di leggerlo","text":["Quando devi leggere ad alta voce, prepara il testo prima. Comincia con un pezzo breve, di quattro o cinque righe.","Leggi a una persona di casa e chiedile che cosa ha capito. Se a scuola devi leggere, puoi chiedere all’insegnante di preparare il brano a casa."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Leggi in silenzio e trova chi parla e che cosa prova.","Prepara le parole lunghe: a pezzi, poi intere.","Segna / e // seguendo la punteggiatura.","Segna la freccia sulle domande e l’emozione delle battute.","Leggi a voce e chiedi a chi ascolta che cosa ha capito."]},"action":"Scegli un brano breve del tuo libro con almeno una battuta. Preparalo con la sequenza. Nel Menu trovi la scheda da stampare.","hint":"Se leggere e dare il tono insieme è troppo faticoso, fai due letture. Nella prima pensa solo alle parole. Nella seconda aggiungi pause e tono."}],"coach":{"goal":"Insegnare a preparare un breve testo prima della lettura ad alta voce: comprensione della scena, parole lunghe, pause guidate dalla punteggiatura, tono delle battute. Valutare l’efficacia con domande a chi ascolta, non con la velocità o con l’assenza totale di errori.","prepare":"Stampare i tre testi dalla scheda, con carattere grande e interlinea ampia, perché lo studente deve scriverci sopra a matita. Leggere ad alta voce davanti ad altri può essere fonte di disagio: lavorare in un contesto riservato e concordare se l’adulto legge prima come modello.","observe":"Distinguere gli errori di decodifica (parole lette male, sillabe invertite) dagli errori di prosodia (pause a fine riga, domanda letta come affermazione). Chiedere “Dove hai visto che serviva una pausa?” per capire se usa la punteggiatura. Nel compito nuovo osservare soprattutto le pause a fine riga.","adaptations":[["Lettura delle parole — possibile difficoltà con dislessia","La decodifica assorbe tutta l’attenzione: quando aggiunge il tono, lo studente si blocca sulle parole.","Separare le due cose: prima ascolto del modello (adulto o sintesi vocale) e lettura delle sole parole, poi una seconda lettura con pause e tono. Verificare se le interruzioni diminuiscono."],["Segni sul testo — possibile difficoltà con disgrafia","Barre e frecce diventano illeggibili o finiscono sulle parole.","Usare un testo con interlinea doppia, matite colorate o evidenziatori di due colori (uno per le pause, uno per le battute). Osservare se lo studente ritrova i segni durante la lettura."],["Lettura davanti ad altri — difficoltà trasversale (ansia di prestazione)","Lo studente rifiuta di leggere o accelera per finire presto.","Partire da testi di quattro righe e da un solo ascoltatore; non imporre la lettura pubblica. Concordare con la scuola, quando è previsto, la lettura di brani preparati prima. Osservare se il disagio diminuisce con la preparazione."]],"sources":["ies2007","w3c-coga","aiddsa","aid"],"checks":"Testi originali. Verificati l’uso della punteggiatura con le virgolette e le corrispondenze tra segni e pause; le pause indicate seguono solo la punteggiatura."},"print":{"modelTitle":"Testo preparato — esempio","visual":{"type":"table","label":"Segni e voce","columns":["Segno","Che cosa fa la voce"],"rows":[[", oppure :","Pausa breve. Segna /"],[". oppure ? oppure !","Pausa lunga. Segna //"],["?","La voce sale alla fine. Segna ↗"],["!","Voce più forte o più vivace"],["“ ”","Parole dette da un personaggio"]]},"model":["Il nonno aprì una vecchia scatola. Dentro c’era una fotografia. Sara la guardò e chiese: “Chi è questo bambino?” Il nonno rise: “Sono io, a otto anni!”","1. Leggo in silenzio: Sara fa una domanda, il nonno risponde ridendo.","2. Preparo la parola lunga: fo – to – gra – fi – a.","3. Segno le pause: Il nonno aprì una vecchia scatola. // Dentro c’era una fotografia. // Sara la guardò e chiese: / “Chi è questo bambino ↗?” // Il nonno rise: / “Sono io, / a otto anni!” //","4. Accanto alla battuta del nonno scrivo “allegro”.","5. Leggo a voce e chiedo: chi ha fatto la domanda? Il nonno era allegro o arrabbiato?"],"practice":[["Prova guidata","La mamma cercava qualcosa in tutta la casa. Poi chiese a Luca: “Hai visto le mie chiavi?” Luca rispose: “Sono sul tavolo, vicino al pane”. La mamma sorrise: “Eccole! Grazie!”\nSegna pause, freccia sulla domanda ed emozione dell’ultima battuta. Poi leggi a voce."],["Compito nuovo","Il temporale arrivò all’improvviso e tutti corsero\nsotto il portico della scuola. Elena guardò il cielo\nnero e gridò: “Che acquazzone!” Il maestro\nrispose con calma: “Aspettiamo qui. Tra poco smette”.\nPrepara il testo da solo e leggilo a voce. Attenzione alle righe che vanno a capo in mezzo alle frasi."]],"answers":["Prova guidata: La mamma cercava qualcosa in tutta la casa. // Poi chiese a Luca: / “Hai visto le mie chiavi ↗?” // Luca rispose: / “Sono sul tavolo, / vicino al pane”. // La mamma sorrise: / “Eccole! // Grazie!” // (contenta)","Compito nuovo: pausa lunga dopo “scuola”, “acquazzone!”, “qui” e “smette”; pausa breve dopo “gridò:” e “calma:”. Nessuna pausa a fine riga dopo “corsero”, “cielo” e “maestro”. Elena: sorpresa, voce vivace. Maestro: calmo.","La lettura funziona se chi ascolta sa dire chi parla e che cosa prova."],"home":["Leggi in silenzio e trova chi parla e che cosa prova.","Prepara le parole lunghe.","Segna le pause seguendo la punteggiatura, non la fine della riga.","Segna il tono delle domande e delle battute.","Leggi a una persona e chiedile che cosa ha capito."]},"maps":{},"kind":"task","subject":"Italiano","area":"Antologia e comprensione"},{"id":"M01-03","title":"Leggere un libro intero","intro":"Dividi il libro in tappe, scrivi un diario di lettura e riprendi il filo fino alla fine.","slides":[{"phase":"Preparazione","title":"Un libro intero, una tappa alla volta","text":["Un libro intero non si legge in una volta. Lo dividi in tappe: una tappa è la parte che leggi in un giorno.","Imparerai tre cose. Dividere il libro in tappe. Scrivere poche righe dopo ogni tappa. Ricordare la tappa prima, quando riprendi a leggere."],"visual":{"type":"list","label":"Prepara","items":["Il libro, oppure l’audiolibro","Un quaderno per il diario di lettura","Un segnalibro","Il diario di scuola o un calendario"]},"action":"Prepara il quaderno. Sulla prima pagina scrivi: “Diario di lettura”.","hint":"Ascoltare un audiolibro, o usare la sintesi vocale, è un modo valido di leggere un libro. Anche con l’audio il metodo è lo stesso: tappe, diario, ripresa del filo."},{"phase":"Preparazione","title":"Guarda com’è fatto il libro","text":["Per dividere il libro, ti servono due dati. Quanti capitoli ha. Entro quando devi finirlo.","I capitoli sono le parti in cui è diviso il libro. Li trovi nell’indice: l’elenco dei capitoli con la pagina in cui comincia ognuno. L’indice di solito è all’inizio o alla fine del libro."],"visual":{"type":"quote","label":"Il libro dell’esempio","text":"Capitoli: 10\nDa finire in: 3 settimane"},"action":"Scrivi sul quaderno i dati dell’esempio. Se hai con te il tuo libro, cerca l’indice e scrivi accanto anche i suoi dati.","hint":"Se il libro non ha l’indice, sfoglialo e conta i titoli dei capitoli. Spesso i capitoli cominciano su una pagina nuova, con un numero o un titolo grande."},{"phase":"Esempio spiegato","title":"Conta gli appuntamenti di lettura","text":["Un appuntamento di lettura è un giorno in cui leggi una tappa. Scegli quanti giorni a settimana leggere. Nell’esempio sono 4.","In 3 settimane gli appuntamenti sono 3 × 4 = 12. I capitoli sono 10: ne leggi uno per appuntamento. Restano 2 appuntamenti di riserva."],"visual":{"type":"math","label":"Il calcolo delle tappe","lines":["3 settimane × 4 giorni = 12 appuntamenti","12 appuntamenti − 10 capitoli = 2 di riserva"]},"action":"Scrivi i due calcoli sul quaderno. Controlla i risultati: 12 appuntamenti in tutto, di cui 2 di riserva.","hint":"Un giorno di riserva è un giorno in più. Ti serve se salti un giorno o se un capitolo è molto lungo: puoi dividerlo in due. Puoi usare la calcolatrice."},{"phase":"Esempio spiegato","title":"Il diario di lettura: tre righe per tappa","text":["Dopo ogni tappa scrivi tre righe nel diario di lettura. Bastano poche parole per riga.","Il diario ti aiuta a non ricominciare da capo. Quando riprendi il libro, sai già dove eri arrivato."],"visual":{"type":"table","label":"Le tre righe del diario","columns":["Riga","Che cosa scrivi"],"rows":[["Succede","Il fatto più importante della tappa"],["Personaggio","Che cosa fa o prova un personaggio"],["Domanda","Che cosa vuoi scoprire nella tappa dopo"]]},"action":"Nel quaderno scrivi “Capitolo 1” e sotto le tre parole: Succede, Personaggio, Domanda. Lascia spazio accanto a ognuna.","hint":"La domanda è una curiosità: che cosa succederà dopo? Ti aiuta a ricordare dove si era fermata la storia. Nella tappa successiva cercherai la risposta."},{"phase":"Esempio spiegato","title":"Leggi il capitolo 1","text":["Per imparare usiamo un libro inventato e molto breve: “Il cortile segreto”. Ha quattro capitoli di poche righe. In un libro vero i capitoli sono più lunghi, ma il metodo è lo stesso."],"visual":{"type":"quote","label":"Il cortile segreto — capitolo 1","text":"Tommaso si era appena trasferito in una nuova città con la sua famiglia. Non conosceva nessuno. Dal balcone guardava il cortile del palazzo. In un angolo c’era una porta di legno, chiusa con un vecchio lucchetto."},"action":"Leggi o ascolta il capitolo 1. Poi pensa: qual è il fatto più importante? Chi è il personaggio principale?","hint":"Trasferirsi vuol dire andare a vivere in un altro posto. Il lucchetto è un piccolo oggetto di metallo che tiene chiusa una porta. Si apre con una chiave."},{"phase":"Esempio spiegato","title":"Scrivi il diario del capitolo 1","text":["Ecco le tre righe per il capitolo 1. Il fatto è l’arrivo in città e la porta chiusa. Il personaggio è Tommaso, che non conosce nessuno. La domanda nasce dalla porta: che cosa nasconde?"],"visual":{"type":"table","label":"Diario — capitolo 1","columns":["Riga","Nel diario"],"rows":[["Succede","Tommaso arriva in una città nuova. Nel cortile vede una porta chiusa."],["Personaggio","Tommaso è solo: non conosce nessuno."],["Domanda","Che cosa c’è dietro la porta?"]]},"action":"Copia o completa le tre righe nel tuo quaderno. Poi metti il segnalibro alla fine del capitolo 1.","hint":"Puoi scrivere ancora meno: “arriva — porta chiusa”, “solo”, “dietro la porta?”. Basta che tu riesca a rileggere e capire le tue parole il giorno dopo."},{"phase":"Esempio spiegato","title":"Prima di riprendere, ricorda la tappa prima","text":["Il giorno dopo, prima di leggere il capitolo 2, chiudi il diario. Racconta a voce che cosa è successo nel capitolo 1, in due o tre frasi.","Poi apri il diario e controlla. Così la storia di ieri si collega a quella di oggi."],"visual":{"type":"quote","label":"Un racconto possibile del capitolo 1","text":"Tommaso è arrivato in una città nuova e non conosce nessuno. Nel cortile del palazzo c’è una porta chiusa con un lucchetto."},"action":"Racconta a voce il capitolo 1 senza guardare. Poi apri il diario e controlla se hai detto anche la porta chiusa.","hint":"Ricordare senza guardare è più faticoso che rileggere. Ma è proprio questo sforzo che fissa la storia nella memoria. Se non ricordi qualcosa, il diario è lì per aiutarti."},{"phase":"Esempio spiegato","title":"Leggi il capitolo 2 e aggiorna il diario","text":["Ora leggi il capitolo 2. La domanda del capitolo 1 trova una risposta: dietro la porta c’è una serra. Una serra è una piccola casa di vetro dove crescono le piante.","La portinaia è la persona che si occupa dell’ingresso del palazzo."],"visual":{"type":"quote","label":"Il cortile segreto — capitolo 2","text":"Un pomeriggio Tommaso chiese alla portinaia che cosa c’era dietro la porta. “È una vecchia serra”, rispose lei. “Nessuno la usa da anni.” Irene, una ragazza del terzo piano, stava ascoltando. “Potremmo sistemarla noi”, disse a Tommaso."},"action":"Leggi il capitolo 2. Scrivi le tre righe. Poi confronta: Succede: dietro la porta c’è una serra. Personaggio: Irene vuole sistemarla con Tommaso. Domanda: ci riusciranno?","hint":"Nel capitolo 2 compare un personaggio nuovo: Irene. Quando arriva un personaggio nuovo, scrivi il suo nome nel diario e una cosa che fa."},{"phase":"Prova guidata","title":"Riprendi il filo e leggi il capitolo 3","text":["Ora tocca a te. Prima di leggere, chiudi il diario e racconta a voce i capitoli 1 e 2. Poi controlla nel diario.","Dopo, leggi il capitolo 3 e scrivi le tre righe."],"visual":{"type":"quote","label":"Il cortile segreto — capitolo 3","text":"La portinaia diede a Tommaso e Irene la chiave del lucchetto. Dentro la serra c’erano vasi rotti e piante secche. Mentre pulivano, arrivarono due ragazzi del palazzo, Samir e Giada. All’inizio guardavano soltanto. Poi presero una scopa e li aiutarono."},"action":"Racconta i capitoli 1 e 2. Poi leggi il capitolo 3 e scrivi nel diario: Succede, Personaggio, Domanda.","hint":"Per “Succede”, chiediti: che cosa fanno Tommaso e Irene in questo capitolo? Per “Personaggio”, guarda i due nomi nuovi: che cosa fanno prima e che cosa fanno dopo?"},{"phase":"Controllo guidato","title":"Confronta il diario del capitolo 3","text":["Ecco un diario possibile per il capitolo 3. Le tue parole possono essere diverse. Controlla che ci siano i fatti importanti.","Samir e Giada cambiano nel capitolo: prima guardano, poi aiutano. Questo cambiamento è importante per la storia."],"visual":{"type":"table","label":"Diario — capitolo 3","columns":["Riga","Nel diario"],"rows":[["Succede","Tommaso e Irene entrano nella serra e cominciano a pulirla."],["Personaggio","Samir e Giada prima guardano, poi aiutano."],["Domanda","La serra tornerà verde?"]]},"action":"Confronta le tue tre righe. Se manca un fatto, aggiungilo con un colore diverso.","hint":"Se avevi scritto solo “puliscono la serra”, aggiungi chi arriva. I personaggi nuovi spesso servono più avanti nella storia."},{"phase":"Compito nuovo","title":"Leggi l’ultimo capitolo","text":["Questo è l’ultimo capitolo del libro. Fai tutto da solo. Prima racconta a voce il capitolo 3. Poi leggi il capitolo 4 e scrivi le tre righe del diario."],"visual":{"type":"quote","label":"Il cortile segreto — capitolo 4","text":"Per tutto il mese i quattro ragazzi lavorarono nella serra. Piantarono basilico, pomodori e fragole. Alla fine dell’estate la serra era di nuovo verde. Tommaso guardò il cortile dal balcone, come il primo giorno. Ma adesso, in quel cortile, aveva tre amici."},"action":"Racconta il capitolo 3, leggi il capitolo 4 e scrivi il diario. Nella riga Domanda scrivi se la domanda del capitolo 3 ha trovato risposta.","hint":"Nell’ultimo capitolo spesso la storia risponde alle domande che hai scritto prima. Rileggi la domanda del capitolo 3 e cerca la risposta nel capitolo 4."},{"phase":"Compito nuovo","title":"Collega l’inizio e la fine del libro","text":["Finito il libro, scrivi tre frasi sulla storia intera. L’inizio: com’era la situazione. La svolta: il momento in cui la storia cambia direzione. Il finale: come va a finire.","Poi chiediti: il finale risponde al problema dell’inizio?"],"visual":{"type":"list","label":"Le tre frasi","items":["Inizio: …","Svolta: …","Finale: …"]},"action":"Rileggi tutto il diario. Poi scrivi le tre frasi sul quaderno. Vai avanti per confrontare.","hint":"Per l’inizio, guarda il diario del capitolo 1: com’era Tommaso? Per la svolta, cerca il momento in cui qualcuno propone di fare qualcosa insieme."},{"phase":"Controllo","title":"Confronta il diario e le tre frasi","text":["All’inizio Tommaso è solo. Alla fine ha tre amici. Il finale risponde al problema dell’inizio: la solitudine di Tommaso.","La svolta è la proposta di Irene. Da quel momento Tommaso non è più solo."],"visual":{"type":"table","label":"Soluzione possibile","columns":["Parte","Nel diario"],"rows":[["Capitolo 4","I ragazzi piantano basilico, pomodori e fragole. La serra torna verde. Tommaso ha tre amici."],["Inizio","Tommaso è solo in una città nuova. Vede una porta chiusa nel cortile."],["Svolta","Irene propone di sistemare la serra insieme."],["Finale","La serra torna verde e Tommaso ha tre amici."]]},"action":"Confronta le tue frasi. Controlla soprattutto il collegamento tra inizio e finale: solo, poi con tre amici.","hint":"Se per la svolta hai scelto l’arrivo di Samir e Giada, puoi spiegare perché. Ma la storia cambia già prima, quando Irene dice: “Potremmo sistemarla noi”."},{"phase":"Controllo","title":"Un errore da riconoscere: solo un giudizio","text":["Un giudizio è un’opinione su un libro, per esempio “È bello”. Va bene dirlo, ma da solo non racconta la storia. Tra un mese non ti ricorderà che cosa succede."],"visual":{"type":"quote","label":"Da completare","text":"Diario: “Capitolo 3: bello.”\n\nMeglio: “Capitolo 3: entrano nella serra e la puliscono. Arrivano Samir e Giada e aiutano. Mi è piaciuto.”"},"action":"Rileggi il tuo diario. Se una riga contiene solo un giudizio, aggiungi un fatto del capitolo.","hint":"Il tuo parere è utile: puoi aggiungerlo come quarta riga, “Mi è piaciuto perché…”. Prima, però, scrivi i fatti."},{"phase":"Ripresa a casa","title":"Usa le tappe con il tuo libro","text":["Con il libro che devi leggere, comincia dal calcolo delle tappe. Segna i giorni sul calendario.","Dopo ogni tappa scrivi le tre righe. Prima della tappa dopo, racconta a voce quella prima. Se salti un giorno, usa un giorno di riserva."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Conta capitoli e giorni, poi calcola gli appuntamenti.","Segna le tappe sul calendario, con giorni di riserva.","Prima di ogni tappa, racconta la tappa prima senza guardare.","Dopo ogni tappa, scrivi Succede, Personaggio, Domanda.","A fine libro, scrivi inizio, svolta e finale."]},"action":"Fai oggi il calcolo per il tuo libro e segna la prima tappa. Nel Menu trovi la scheda da stampare.","hint":"Se dopo due tappe sei indietro, non arrenderti: cambia il piano. Puoi leggere tappe più brevi o aggiungere un giorno a settimana. Chiedi aiuto a chi ti segue per rifare il calcolo."}],"coach":{"goal":"Insegnare a pianificare la lettura di un libro intero in tappe, a registrare ogni tappa in un diario di tre righe e a recuperare la tappa precedente prima di proseguire. Il libro dell’esempio è un modello breve: mostra la procedura, non misura la capacità di sostenere un romanzo lungo.","prepare":"Chiedere in anticipo quale libro è assegnato, con scadenza e numero di capitoli, per fare la pianificazione reale nel primo incontro. Verificare se è disponibile l’audiolibro o un formato digitale per la sintesi vocale. Il calcolo delle tappe può essere svolto con la calcolatrice.","observe":"Nel racconto prima della tappa osservare che cosa lo studente recupera senza guardare e che cosa recupera solo con il diario. Distinguere il problema di pianificazione (piano irrealistico, nessuna riserva) da quello di comprensione (eventi confusi) e da quello di lettura (fatica, tempi lunghi). Rivedere il piano dopo le prime due tappe.","adaptations":[["Lettura delle tappe — possibile difficoltà con dislessia","Il tempo di lettura supera quello previsto e lo studente arriva stanco a metà capitolo.","Usare l’audiolibro o la sintesi vocale, anche in alternanza con la lettura; ridurre la lunghezza delle tappe e ricalcolare il piano. Verificare se il racconto della tappa resta completo."],["Diario di lettura — possibile difficoltà con disgrafia o disortografia","Le tre righe diventano un compito di scrittura lungo e vengono saltate.","Accettare parole chiave, un messaggio vocale o una tabella già pronta da completare. Controllare che il diario permetta il recupero, non la sua correttezza ortografica."],["Continuità tra le tappe — difficoltà trasversale (organizzazione e memoria)","Interrompe spesso senza segnare il punto o ricomincia il capitolo da capo.","Usare segnalibro, data accanto a ogni voce del diario e promemoria sul calendario. Osservare se alla tappa successiva riprende il filo con meno rilettura."]],"sources":["dunlosky2013","eef2025","aid","w3c-coga"],"checks":"Calcoli verificati con Python: 3 × 4 = 12 appuntamenti; 12 − 10 = 2 appuntamenti di riserva. Il libro “Il cortile segreto” è un testo originale scritto per l’esercitazione."},"print":{"modelTitle":"Tappe e diario di lettura — esempio","model":["Libro di 10 capitoli, da finire in 3 settimane, leggendo 4 giorni a settimana.","1. Calcolo: 3 × 4 = 12 appuntamenti. 12 − 10 = 2 appuntamenti di riserva.","2. Capitolo 1: Tommaso si era appena trasferito in una nuova città con la sua famiglia. Non conosceva nessuno. Dal balcone guardava il cortile del palazzo. In un angolo c’era una porta di legno, chiusa con un vecchio lucchetto.","3. Diario. Succede: Tommaso arriva in una città nuova e vede una porta chiusa. Personaggio: Tommaso è solo. Domanda: che cosa c’è dietro la porta?","4. Il giorno dopo racconto il capitolo 1 senza guardare, poi controllo il diario.","5. Capitolo 2: Un pomeriggio Tommaso chiese alla portinaia che cosa c’era dietro la porta. “È una vecchia serra”, rispose lei. “Nessuno la usa da anni.” Irene, una ragazza del terzo piano, stava ascoltando. “Potremmo sistemarla noi”, disse a Tommaso.\nDiario. Succede: dietro la porta c’è una serra. Personaggio: Irene vuole sistemarla con Tommaso. Domanda: ci riusciranno?"],"practice":[["Prova guidata — capitolo 3","Prima racconta a voce i capitoli 1 e 2.\nLa portinaia diede a Tommaso e Irene la chiave del lucchetto. Dentro la serra c’erano vasi rotti e piante secche. Mentre pulivano, arrivarono due ragazzi del palazzo, Samir e Giada. All’inizio guardavano soltanto. Poi presero una scopa e li aiutarono.\nScrivi nel diario: Succede, Personaggio, Domanda."],["Compito nuovo — capitolo 4 e libro intero","Prima racconta a voce il capitolo 3.\nPer tutto il mese i quattro ragazzi lavorarono nella serra. Piantarono basilico, pomodori e fragole. Alla fine dell’estate la serra era di nuovo verde. Tommaso guardò il cortile dal balcone, come il primo giorno. Ma adesso, in quel cortile, aveva tre amici.\nScrivi il diario del capitolo 4. Poi scrivi tre frasi: inizio, svolta, finale."],["Il tuo libro","Titolo: ______________ Capitoli: ____ Settimane: ____ Giorni a settimana: ____\nAppuntamenti: ____ × ____ = ____ Giorni di riserva: ____"]],"answers":["Capitolo 3. Succede: Tommaso e Irene entrano nella serra e cominciano a pulirla. Personaggio: Samir e Giada prima guardano, poi aiutano. Domanda: la serra tornerà verde?","Capitolo 4. Succede: i ragazzi piantano basilico, pomodori e fragole; la serra torna verde. Personaggio: Tommaso ora ha tre amici. La domanda del capitolo 3 ha una risposta: sì.","Inizio: Tommaso è solo in una città nuova. Svolta: Irene propone di sistemare la serra insieme. Finale: la serra torna verde e Tommaso ha tre amici.","Un giudizio come “bello” va bene, ma solo dopo i fatti del capitolo."],"home":["Calcola gli appuntamenti e lascia giorni di riserva.","Segna le tappe sul calendario.","Prima di ogni tappa, racconta quella prima senza guardare.","Dopo ogni tappa, scrivi Succede, Personaggio, Domanda.","A fine libro, collega inizio, svolta e finale."]},"maps":{},"kind":"task","subject":"Italiano","area":"Antologia e comprensione"},{"id":"M01-04","title":"Rispondere alle domande di comprensione","intro":"Capisci che cosa chiede la domanda, trova la frase nel testo e scrivi una risposta completa.","slides":[{"phase":"Preparazione","title":"La risposta si trova nel testo","text":["Le domande di comprensione servono a controllare se hai capito un testo. In questo percorso la risposta è scritta nel testo. Il tuo lavoro è trovarla e scriverla bene.","Imparerai a capire che cosa chiede la domanda, a trovare la frase giusta e a controllare la risposta."],"visual":{"type":"list","label":"Prepara","items":["Il testo e le domande","Una matita e un evidenziatore","Un foglio per le risposte"]},"action":"Prepara il materiale. Scrivi in alto sul foglio: “Domande di comprensione”.","hint":"Alcune domande chiedono cose che il testo non scrive con parole precise. Per quelle c’è un altro percorso: “Ricavare informazioni dagli indizi”."},{"phase":"Preparazione","title":"Le parole-domanda dicono che cosa cercare","text":["Molte domande cominciano con una parola-domanda, come “chi” o “dove”. Questa parola ti dice che tipo di informazione cercare nel testo."],"visual":{"type":"table","label":"Parole-domanda","columns":["Parola","Che cosa cerchi nel testo"],"rows":[["Chi?","Una persona o un animale"],["Che cosa?","Un oggetto o un’azione"],["Dove?","Un luogo"],["Quando?","Un momento: un giorno, un’ora, una stagione"],["Perché?","Il motivo di un fatto"],["Come?","Il modo in cui succede qualcosa"]]},"action":"Leggi la tabella. Poi rispondi a voce: se una domanda comincia con “Dove”, che cosa cerchi nel testo?","hint":"Prova con una domanda di tutti i giorni: “Quando parte il treno?”. Cerchi un’ora, per esempio “alle otto”. Se ti rispondono “in stazione”, la risposta non va bene: dice un luogo."},{"phase":"Esempio spiegato","title":"Leggi il testo una volta","text":["Prima di guardare le domande, leggi tutto il testo una volta. Non cercare niente di preciso. Serve a capire di che cosa parla."],"visual":{"type":"quote","label":"Il testo dell’esempio","text":"Sabato mattina la classe di Nadia andò al museo di scienze. All’ingresso la guida diede a ognuno una cuffia. Le cuffie servivano per sentire le spiegazioni anche nelle sale piene di gente. Alle undici il gruppo entrò nella sala dei fossili. Nadia restò a lungo davanti allo scheletro di un dinosauro, perché voleva disegnarlo sul suo quaderno."},"action":"Leggi o ascolta il testo. Poi di’ a voce, in una frase, di che cosa parla.","hint":"Per esempio: “Parla di una classe che visita un museo”. Basta l’idea generale. I dettagli li cercherai dopo, una domanda alla volta."},{"phase":"Esempio spiegato","title":"Cerchia le parole-domanda","text":["Ecco la prima domanda. Contiene due parole-domanda: “dove” e “quando”. Quindi chiede due informazioni: un luogo e un momento.","Per non dimenticarne una, prepara due caselle."],"visual":{"type":"quote","label":"Domanda 1","text":"Dove andò la classe e quando?\n\nCasella 1 — Dove: …\nCasella 2 — Quando: …"},"action":"Copia la domanda sul foglio. Cerchia “Dove” e “quando”. Sotto, disegna le due caselle.","hint":"La parola “e” spesso unisce due richieste. Se rispondi solo a una, la risposta è incompleta. Le caselle ti ricordano quante informazioni servono."},{"phase":"Esempio spiegato","title":"Trova la frase con la risposta","text":["Ora cerca nel testo le parole della domanda: “classe” e “andò”. Le trovi nella prima frase.","In quella frase, “sabato mattina” dice quando. “Al museo di scienze” dice dove."],"visual":{"type":"quote","label":"La frase che ti serve","text":"Sabato mattina la classe di Nadia andò al museo di scienze.\n\nQuando → sabato mattina\nDove → al museo di scienze"},"action":"Sottolinea nel testo “sabato mattina” e “al museo di scienze”. Scrivi ognuna nella sua casella.","hint":"Le parole della domanda funzionano come una calamita. Cercale nel testo: vicino a loro, di solito, c’è la risposta. Se usi un testo al computer, puoi anche usare la ricerca."},{"phase":"Esempio spiegato","title":"Scrivi una risposta completa","text":["Una risposta completa è una frase intera. Si capisce anche da sola, senza leggere la domanda.","Per cominciare, riprendi le parole della domanda: “La classe andò…”. Poi aggiungi le informazioni delle due caselle."],"visual":{"type":"quote","label":"Corta e completa","text":"Risposta corta: Al museo, sabato.\n\nRisposta completa: La classe andò al museo di scienze sabato mattina."},"action":"Scrivi sul foglio la risposta completa. Controlla che ci siano sia il luogo sia il momento.","hint":"La risposta corta ha le informazioni giuste. Però chi la legge non sa di chi parli. La frase intera si capisce anche tra una settimana, quando la rileggi per studiare."},{"phase":"Esempio spiegato","title":"A volte la risposta è nella frase dopo","text":["Seconda domanda: “Perché la guida diede una cuffia a ognuno?”. Le parole “guida” e “cuffia” sono nella seconda frase. Ma il motivo non c’è.","Il motivo è nella frase dopo: “Le cuffie servivano per sentire le spiegazioni”. Per questo leggi sempre anche la frase prima e quella dopo."],"visual":{"type":"quote","label":"Due frasi vicine","text":"All’ingresso la guida diede a ognuno una cuffia. Le cuffie servivano per sentire le spiegazioni anche nelle sale piene di gente."},"action":"Sottolinea la frase con il motivo. Scrivi: “La guida diede una cuffia a ognuno perché…” e completa.","hint":"“Perché” chiede il motivo. Nel testo, però, non sempre c’è la parola “perché”. Il motivo può essere scritto con altre parole, come “servivano per” o “così”."},{"phase":"Controllo dell’esempio","title":"Controlla ogni risposta","text":["Prima di passare alla domanda dopo, controlla la risposta con tre domande. Ho risposto a tutte le parti? La risposta si trova nel testo? Si capisce da sola?"],"visual":{"type":"list","label":"Le risposte dell’esempio","items":["1. La classe andò al museo di scienze sabato mattina.","2. La guida diede una cuffia a ognuno perché le cuffie servivano per sentire le spiegazioni anche nelle sale piene di gente."]},"action":"Confronta le tue due risposte con queste. Usa le tre domande di controllo e correggi con un colore diverso.","hint":"Le tue parole possono essere un po’ diverse. Per esempio, “per ascoltare” va bene al posto di “per sentire”. Conta che l’informazione sia la stessa del testo."},{"phase":"Prova guidata","title":"Prova tu con la terza domanda","text":["Ora rispondi tu a questa domanda. Segui gli stessi passaggi: parole-domanda, caselle, frase sottolineata, risposta completa."],"visual":{"type":"quote","label":"Testo e domanda 3","text":"Sabato mattina la classe di Nadia andò al museo di scienze. All’ingresso la guida diede a ognuno una cuffia. Le cuffie servivano per sentire le spiegazioni anche nelle sale piene di gente. Alle undici il gruppo entrò nella sala dei fossili. Nadia restò a lungo davanti allo scheletro di un dinosauro, perché voleva disegnarlo sul suo quaderno.\n\nDomanda 3: Che cosa guardò a lungo Nadia, e perché?"},"action":"Cerchia le parole-domanda e prepara le caselle. Sottolinea la frase giusta. Poi scrivi la risposta completa.","hint":"Le parole-domanda sono due: “che cosa” e “perché”. Cerca il nome “Nadia” nel testo: la frase che ti serve è l’ultima. Il motivo arriva dopo la parola “perché”."},{"phase":"Controllo guidato","title":"Confronta la risposta alla domanda 3","text":["Una risposta completa ha due parti: che cosa guardava Nadia e perché.","Nel testo c’è “disegnarlo”. Il pezzo “lo” sta al posto di “lo scheletro”. Nella risposta puoi scrivere “disegnarlo”, ma prima devi aver nominato lo scheletro."],"visual":{"type":"quote","label":"Una risposta possibile","text":"Nadia guardò a lungo lo scheletro di un dinosauro, perché voleva disegnarlo sul suo quaderno."},"action":"Confronta la tua risposta. Se hai scritto solo “Perché voleva disegnarlo”, aggiungi che cosa guardava.","hint":"Leggi la tua risposta come se non conoscessi il testo. Capisci che cosa voleva disegnare Nadia? Se no, aggiungi il nome della cosa."},{"phase":"Compito nuovo","title":"Un testo nuovo e due domande","text":["Ora lavora da solo su un testo nuovo. Usa tutti i passaggi e alla fine controlla ogni risposta con le tre domande di controllo.","Una serratura elettrica è una serratura che funziona con la corrente."],"visual":{"type":"quote","label":"Compito nuovo","text":"Il negozio di biciclette di Ugo apre ogni giorno alle nove. Lunedì, però, aprì alle undici. Durante la notte era mancata la corrente e la serratura elettrica della porta si era bloccata. Ugo chiamò un tecnico. Il tecnico arrivò alle dieci e riparò la serratura in un’ora. Quel giorno Ugo regalò un campanello a ogni cliente, per scusarsi del ritardo.\n\nDomanda A: A che ora aprì il negozio lunedì, e perché?\nDomanda B: Che cosa fece Ugo per scusarsi con i clienti?"},"action":"Rispondi sul foglio alle due domande, con risposte complete. Poi vai avanti per confrontare.","hint":"La domanda A ha due parole-domanda: “a che ora” chiede un momento, “perché” chiede un motivo. Per la domanda B, cerca nel testo la parola “scusarsi”."},{"phase":"Controllo","title":"Confronta le tue risposte","text":["Ecco due risposte possibili. Nella domanda A il motivo è una catena: manca la corrente, la serratura si blocca, serve il tecnico. Basta scrivere la parte principale: la serratura bloccata."],"visual":{"type":"list","label":"Risposte possibili","items":["A. Lunedì il negozio aprì alle undici, perché la serratura elettrica si era bloccata e il tecnico la riparò solo alle undici.","B. Per scusarsi, Ugo regalò un campanello a ogni cliente."]},"action":"Confronta le tue risposte. Controlla che nella risposta A ci siano sia l’ora sia il motivo.","hint":"Il testo dice che il tecnico arriva alle dieci e lavora un’ora. Dieci più un’ora fa undici: è proprio l’ora in cui il negozio apre."},{"phase":"Controllo","title":"Un errore da riconoscere: la risposta inventata","text":["A volte una risposta sembra giusta, ma nel testo non c’è. Per esempio: “Il negozio aprì tardi perché Ugo si era svegliato tardi”. Nel testo questa frase non esiste.","Per correggere, torna alla frase che hai sottolineato e usa le sue informazioni."],"visual":{"type":"quote","label":"Risposta da correggere","text":"Inventata: perché Ugo si era svegliato tardi.\n\nNel testo: era mancata la corrente e la serratura elettrica della porta si era bloccata."},"action":"Rileggi le tue risposte. Per ognuna, indica la frase del testo che la conferma. Se non la trovi, correggi la risposta.","hint":"Chiediti: “Dove l’ho letto?”. Se la risposta è “Me lo sono immaginato”, torna al testo. Una risposta di comprensione deve sempre avere una frase del testo che la conferma."},{"phase":"Ripresa a casa","title":"Usa i passaggi sui tuoi compiti","text":["A casa, prima di rispondere, leggi tutto il testo una volta. Poi lavora una domanda alla volta.","Se non trovi la risposta, rileggi la frase prima e quella dopo. Se ancora non la trovi, forse la domanda chiede di ricavarla dagli indizi: segna la domanda e chiedi aiuto."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Leggi tutto il testo una volta.","Cerchia le parole-domanda e prepara una casella per ognuna.","Cerca nel testo le parole della domanda e sottolinea la frase.","Scrivi una risposta completa, che si capisce da sola.","Controlla: tutte le parti? È nel testo? Si capisce da sola?"]},"action":"Scegli un esercizio di comprensione del tuo libro e usa la sequenza sulle prime due domande. Nel Menu trovi la scheda da stampare.","hint":"Se scrivere le risposte ti stanca molto, prova prima a dirle a voce. Poi scrivile. Puoi chiedere di usare la videoscrittura o di dettare, se lo fai già a scuola."}],"coach":{"goal":"Insegnare a trasformare la domanda in una ricerca (parole-domanda e caselle), a localizzare la frase che sostiene la risposta, a scrivere una risposta completa e a verificarla nel testo. Il percorso riguarda domande con risposta letterale; le domande inferenziali sono trattate nel percorso “Ricavare informazioni dagli indizi”.","prepare":"Avere il testo sullo schermo o stampato, con lo spazio per sottolineare. Se lo studente usa la sintesi vocale o un testo digitale, mostrare la funzione di ricerca delle parole. Concordare se le risposte saranno scritte, dettate o dette a voce.","observe":"Chiedere “Dove l’hai letto?” per ogni risposta. Distinguere: errore di lettura della domanda (una parte dimenticata), errore di localizzazione (frase sbagliata), errore di formulazione (risposta corretta ma incompleta o con pronomi ambigui), aggiunte non presenti nel testo. Gli errori ortografici non indicano mancata comprensione.","adaptations":[["Lettura della domanda — difficoltà trasversale (attenzione e memoria)","Lo studente risponde solo alla prima parte delle domande doppie.","Far cerchiare le parole-domanda e disegnare una casella per ciascuna, da spuntare. Verificare se le domande doppie ricevono entrambe le risposte senza richiamo dell’adulto."],["Ricerca nel testo — possibile difficoltà con dislessia","Rilegge tutto il testo per ogni domanda e si stanca prima di finire.","Insegnare la ricerca delle parole della domanda; numerare le frasi del testo; usare la ricerca nel testo digitale o la sintesi vocale. Confrontare il tempo e la precisione con e senza questi aiuti."],["Scrittura della risposta — possibile difficoltà con disgrafia o disortografia","La risposta orale è completa, quella scritta è ridotta a poche parole.","Accettare prima la risposta orale, poi una scrittura con avvio dato (“La classe andò…”), la dettatura o la videoscrittura. Valutare la comprensione separatamente dall’ortografia."]],"sources":["ies2007","eef2025","w3c-coga","aiddsa"],"checks":"Testi originali. Verificata la coerenza dei dati del compito nuovo: tecnico alle dieci più un’ora di lavoro = apertura alle undici. Ogni risposta delle soluzioni è sostenuta da una frase del testo."},"print":{"modelTitle":"Domande di comprensione — esempio","visual":{"type":"table","label":"Parole-domanda","columns":["Parola","Che cosa cerchi"],"rows":[["Chi?","Una persona o un animale"],["Che cosa?","Un oggetto o un’azione"],["Dove?","Un luogo"],["Quando?","Un momento"],["Perché?","Il motivo"],["Come?","Il modo"]]},"model":["Sabato mattina la classe di Nadia andò al museo di scienze. All’ingresso la guida diede a ognuno una cuffia. Le cuffie servivano per sentire le spiegazioni anche nelle sale piene di gente. Alle undici il gruppo entrò nella sala dei fossili. Nadia restò a lungo davanti allo scheletro di un dinosauro, perché voleva disegnarlo sul suo quaderno.","Domanda: Dove andò la classe e quando?","1. Cerchio “Dove” e “quando”: servono due informazioni. Preparo due caselle.","2. Cerco “classe” e “andò” nel testo: prima frase. Sottolineo “sabato mattina” e “al museo di scienze”.","3. Scrivo: “La classe andò al museo di scienze sabato mattina”.","4. Controllo: tutte le parti? È nel testo? Si capisce da sola?"],"practice":[["Prova guidata","Usa il testo dell’esempio.\nDomanda: Che cosa guardò a lungo Nadia, e perché?"],["Compito nuovo","Il negozio di biciclette di Ugo apre ogni giorno alle nove. Lunedì, però, aprì alle undici. Durante la notte era mancata la corrente e la serratura elettrica della porta si era bloccata. Ugo chiamò un tecnico. Il tecnico arrivò alle dieci e riparò la serratura in un’ora. Quel giorno Ugo regalò un campanello a ogni cliente, per scusarsi del ritardo.\nDomanda A: A che ora aprì il negozio lunedì, e perché?\nDomanda B: Che cosa fece Ugo per scusarsi con i clienti?"]],"answers":["Prova guidata: Nadia guardò a lungo lo scheletro di un dinosauro, perché voleva disegnarlo sul suo quaderno.","Compito nuovo A: Lunedì il negozio aprì alle undici, perché la serratura elettrica si era bloccata e il tecnico la riparò solo alle undici.","Compito nuovo B: Per scusarsi, Ugo regalò un campanello a ogni cliente.","Ogni risposta deve avere una frase del testo che la conferma. “Ugo si era svegliato tardi” è inventato."],"home":["Leggi tutto il testo una volta.","Cerchia le parole-domanda e prepara una casella per ognuna.","Cerca le parole della domanda nel testo e sottolinea la frase.","Scrivi una risposta completa.","Controlla: tutte le parti, nel testo, chiara da sola."]},"maps":{},"kind":"task","subject":"Italiano","area":"Antologia e comprensione"},{"id":"M01-05","title":"Ricavare informazioni dagli indizi","intro":"Usa gli indizi del testo per capire ciò che non è scritto, senza inventare.","slides":[{"phase":"Preparazione","title":"Capire anche ciò che non è scritto","text":["A volte un testo non scrive un’informazione con parole precise. Te la fa capire con alcuni dettagli. Questa si chiama informazione implicita.","Esempio: “Marco aprì l’ombrello”. Il testo non dice che piove. Ma probabilmente piove."],"visual":{"type":"list","label":"Prepara","items":["Il testo e la domanda","Un foglio e una matita"]},"action":"Sul foglio disegna due colonne. A sinistra scrivi “Nel testo”, a destra “Mi fa pensare”.","hint":"Lo fai ogni giorno. Se un amico arriva con i capelli bagnati, pensi che fuori piova, anche se lui non lo dice. Con i testi funziona allo stesso modo."},{"phase":"Preparazione","title":"Indizi e conclusione","text":["Un indizio è un dettaglio scritto nel testo. Ti aiuta a capire qualcosa che il testo non dice.","La conclusione è ciò che capisci mettendo insieme gli indizi. Quando non sei sicuro del tutto, usa la parola “probabilmente”."],"visual":{"type":"quote","label":"Un indizio, una conclusione","text":"Indizio: Marco aprì l’ombrello.\n\nConclusione: probabilmente piove."},"action":"Prova a voce. Indizio: “Luisa sbadigliò tre volte”. Quale conclusione puoi ricavare?","hint":"Pensa a quando sbadigli tu. Di solito hai sonno o sei stanco. Puoi dire: “Probabilmente Luisa ha sonno”. Il testo non lo scrive, ma lo fa capire."},{"phase":"Esempio spiegato","title":"Leggi il testo e la domanda","text":["Ecco il testo dell’esempio e la domanda. La domanda chiede com’era il tempo fuori.","Nel testo non trovi parole come “pioggia” o “freddo”. Quindi la risposta va ricavata dagli indizi."],"visual":{"type":"quote","label":"Testo e domanda","text":"Matteo entrò in casa e lasciò sulla porta gli stivali pieni di fango. Appese l’impermeabile, che gocciolava sul pavimento. Poi si sedette vicino alla stufa e si strofinò le mani.\n\nDomanda: Com’era il tempo fuori?"},"action":"Leggi o ascolta il testo. Cerca se c’è una frase che risponde subito alla domanda.","hint":"Un impermeabile è una giacca che non lascia passare l’acqua. La stufa è un apparecchio che scalda la stanza. Strofinarsi le mani vuol dire sfregarle una contro l’altra."},{"phase":"Esempio spiegato","title":"Scrivi solo ciò che è scritto","text":["Nella colonna “Nel testo” scrivi i dettagli che possono aiutarti. Copia solo ciò che il testo dice, senza spiegarlo.","Per esempio, scrivi “impermeabile che gocciolava”. Per ora non scrivere “pioveva”: quella è già una conclusione."],"visual":{"type":"list","label":"Nel testo","items":["stivali pieni di fango","impermeabile che gocciolava","si sedette vicino alla stufa","si strofinò le mani"]},"action":"Scrivi questi quattro dettagli nella colonna di sinistra, uno per riga.","hint":"Chiediti per ogni frase: questo dettaglio dice qualcosa sul tempo fuori? “Entrò in casa” non dice niente sul tempo. “Stivali pieni di fango” sì."},{"phase":"Esempio spiegato","title":"Che cosa ti fa pensare ogni indizio","text":["Ora, accanto a ogni indizio, scrivi che cosa ti fa pensare. Guarda un indizio alla volta."],"visual":{"type":"table","label":"Indizi e pensieri","columns":["Nel testo","Mi fa pensare"],"rows":[["stivali pieni di fango","il terreno era bagnato"],["impermeabile che gocciolava","l’acqua cadeva dal cielo"],["si sedette vicino alla stufa","voleva scaldarsi"],["si strofinò le mani","aveva le mani fredde"]]},"action":"Completa la colonna di destra sul foglio. Usa parole tue: il senso deve essere simile.","hint":"Prova a immaginare la scena come in un film. Matteo entra con gli stivali sporchi e la giacca bagnata. Poi va subito vicino alla stufa. Che tempo c’è secondo te?"},{"phase":"Esempio spiegato","title":"Unisci gli indizi nella conclusione","text":["Ora metti insieme gli indizi. Il fango e l’impermeabile bagnato fanno pensare alla pioggia. La stufa e le mani fanno pensare al freddo.","Scrivi la conclusione con “probabilmente” e aggiungi gli indizi dopo “perché”."],"visual":{"type":"quote","label":"La conclusione","text":"Probabilmente fuori pioveva e faceva freddo, perché Matteo aveva gli stivali pieni di fango e l’impermeabile bagnato, e appena entrato si scaldò vicino alla stufa."},"action":"Scrivi la conclusione sotto le colonne. Controlla che ci siano almeno due indizi.","hint":"Un solo indizio può ingannare. Due o più indizi che portano alla stessa idea rendono la conclusione più sicura."},{"phase":"Esempio spiegato","title":"Cerca un’altra spiegazione","text":["Prima di decidere, chiediti: c’
