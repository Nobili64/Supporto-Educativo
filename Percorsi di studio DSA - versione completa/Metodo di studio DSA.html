ote","label":"Trama","text":"1. Geppetto, un uomo povero, costruisce con un pezzo di legno un burattino: Pinocchio.\n2. Pinocchio scappa spesso e si mette nei guai: il Gatto e la Volpe lo ingannano, e nel Paese dei Balocchi diventa un asino.\n3. Alla fine salva Geppetto dalla pancia di un enorme pesce e diventa un ragazzo vero."},"action":"Indica in ogni frase chi fa l’azione. Poi controlla: in tutta la trama ci sono solo dati?","hint":"Per la trama del tuo libro, rispondi a tre domande: come comincia? Quali sono due fatti importanti nel mezzo? Come finisce? Scrivi una frase per ogni domanda."},{"phase":"Esempio spiegato","title":"Il giudizio con una ragione","text":["Nella recensione scrivi il tuo giudizio. Un giudizio senza ragione, come “È bello”, dice poco a chi legge.","Un giudizio utile ha tre parti: che cosa pensi, perché lo pensi e un esempio preso dal libro."],"visual":{"type":"quote","label":"Due giudizi con la ragione","text":"Pregio: secondo me il libro è avventuroso, perché Pinocchio passa da un pericolo all’altro. Per esempio, finisce nel Paese dei Balocchi.\n\nLimite: alcune parole sono difficili, perché sono antiche. Per esempio “balocchi”, che vuol dire giocattoli."},"action":"Trova in ogni giudizio le tre parti: che cosa penso, perché, un esempio dal libro. Scrivi 1, 2 e 3 sopra le tre parti.","hint":"Un pregio è una cosa che ti è piaciuta. Un limite è una cosa che ti è piaciuta meno. Anche un limite è un buon giudizio, se lo spieghi."},{"phase":"Esempio spiegato","title":"La recensione tiene nascosta la fine","text":["La recensione è scritta per chi non ha ancora letto il libro. Per questo racconta la storia senza la fine: così il lettore ha voglia di scoprirla.","Alla fine c’è un consiglio: a chi può piacere il libro?"],"visual":{"type":"quote","label":"Recensione breve","text":"“Le avventure di Pinocchio” di Carlo Collodi racconta di un burattino di legno che scappa spesso e si mette nei guai.\nSecondo me il libro è avventuroso, perché Pinocchio passa da un pericolo all’altro: per esempio, finisce nel Paese dei Balocchi.\nLo consiglio a chi ama le storie piene di colpi di scena."},"action":"Confronta la recensione con la trama della scheda. Trova la parte della trama che nella recensione manca.","hint":"La parte che manca è la fine: Pinocchio salva Geppetto e diventa un ragazzo vero. Nella scheda la scrivi. Nella recensione la tieni nascosta."},{"phase":"Esempio spiegato","title":"La presentazione a voce: una scaletta","text":["Per presentare il libro alla classe, prepara una scaletta. Una scaletta è un elenco di punti brevi da seguire mentre parli.","Usi gli stessi materiali: dati, trama senza la fine, giudizio. All’inizio aggiungi una domanda che incuriosisce."],"visual":{"type":"list","label":"Scaletta","items":["Domanda: “Vi è mai capitato di dire una bugia e di essere scoperti subito?”","Titolo e autore: Le avventure di Pinocchio, Carlo Collodi","Di che cosa parla: un burattino che si mette nei guai","Il mio giudizio: avventuroso, perché…","Consiglio: a chi ama i colpi di scena"]},"action":"Prova a dire la presentazione a voce, guardando solo la scaletta. Bastano un paio di minuti.","hint":"Nella scaletta scrivi poche parole, non frasi intere: ti servono per ricordare. La domanda iniziale funziona perché a Pinocchio cresce il naso quando dice una bugia."},{"phase":"Prova guidata","title":"Prova tu: dati e giudizi nella quarta di copertina","text":["Questa è la quarta di copertina di un libro inventato per l’esercizio. Ci sono dati sulla storia, ma anche un giudizio dell’editore."],"visual":{"type":"quote","label":"Quarta di copertina","text":"Il segreto del faro — Ada Corallo\n\n1. Teo passa l’estate dai nonni, in un paese di pescatori.\n2. Una notte vede una luce accendersi nel vecchio faro abbandonato.\n3. Insieme all’amica Nina decide di scoprire chi la accende.\n4. Un romanzo emozionante, che ti terrà sveglio fino all’ultima pagina!"},"action":"Sul foglio scrivi i numeri da 1 a 4. Accanto a ogni numero scrivi D oppure G.","hint":"Per ogni frase chiediti: “Posso controllarlo leggendo il libro?”. Se la frase dice che cosa succede, è un dato. Se dice com’è il libro, è un giudizio."},{"phase":"Controllo guidato","title":"Confronta: tre dati e un giudizio","text":["Le prime tre frasi dicono che cosa succede: sono dati. L’ultima dice com’è il libro: è un giudizio dell’editore.","L’editore scrive la quarta di copertina anche per vendere il libro. Il suo giudizio è un’opinione: nella scheda copi solo i dati."],"visual":{"type":"table","label":"Soluzione","columns":["Frase","D o G"],"rows":[["1. Teo passa l’estate dai nonni…","D"],["2. Una notte vede una luce…","D"],["3. Insieme all’amica Nina…","D"],["4. Un romanzo emozionante…","G"]]},"action":"Confronta con le tue lettere. Se una è diversa, rileggi la frase e fai di nuovo la domanda guida.","hint":"“Emozionante” è un’opinione: un libro emoziona alcuni lettori e altri no. “Vede una luce nel faro” invece succede nella storia: puoi trovarlo nel libro."},{"phase":"Prova guidata","title":"Prova tu: compila la scheda","text":["Ora usa solo i dati della quarta di copertina e compila una scheda. Scrivi titolo, autrice, protagonisti, luogo e una trama breve."],"visual":{"type":"quote","label":"Quarta di copertina","text":"Il segreto del faro — Ada Corallo\n\n1. Teo passa l’estate dai nonni, in un paese di pescatori.\n2. Una notte vede una luce accendersi nel vecchio faro abbandonato.\n3. Insieme all’amica Nina decide di scoprire chi la accende.\n4. Un romanzo emozionante, che ti terrà sveglio fino all’ultima pagina!"},"action":"Scrivi la scheda sul foglio. Usa le frasi 1, 2 e 3; lascia da parte la frase 4.","hint":"La quarta di copertina non dice come finisce la storia. Nella trama scrivi solo l’inizio e il problema. La fine la scriverai dopo aver letto il libro."},{"phase":"Controllo guidato","title":"Confronta la tua scheda","text":["Ecco una scheda possibile. Ci sono solo dati presi dalla quarta di copertina.","Nella trama manca la fine, perché la quarta di copertina non la dice. Con il libro intero, la aggiungeresti."],"visual":{"type":"table","label":"Scheda possibile","columns":["Voce","Dato"],"rows":[["Titolo","Il segreto del faro"],["Autrice","Ada Corallo"],["Protagonisti","Teo e la sua amica Nina"],["Luogo","un paese di pescatori, d’estate"],["Trama","Teo vede una luce nel faro abbandonato e, con Nina, cerca chi la accende."]]},"action":"Confronta riga per riga. Se nella tua scheda c’è “emozionante”, cancellalo: è un giudizio.","hint":"Per i protagonisti, cerca i nomi delle persone che la storia segue: Teo e Nina. Anche i nonni compaiono, ma sono personaggi secondari, cioè meno importanti."},{"phase":"Compito nuovo","title":"Ora scrivi una recensione breve","text":["Ecco un racconto completo, inventato per l’esercizio. Scrivi una recensione di tre frasi.","Prima frase: di che cosa parla, senza la fine. Seconda: il tuo giudizio con ragione ed esempio. Terza: un consiglio."],"visual":{"type":"quote","label":"La bicicletta rossa — Lia Pervinca","text":"Pietro voleva imparare ad andare in bicicletta, ma cadeva sempre. I ragazzi del cortile ridevano di lui. Sua cugina Irene gli propose di allenarsi ogni sera, quando il cortile era vuoto. Per due settimane Pietro cadde e si rialzò. Una sera Irene lasciò andare il sellino senza dirlo. Pietro pedalò da solo fino al cancello."},"action":"Scrivi la recensione sul foglio. Segna D o G accanto a ogni frase. Poi vai avanti per confrontare.","hint":"Puoi iniziare così: “Il racconto parla di…”. Poi: “Secondo me è … perché …”. Infine: “Lo consiglio a chi…”. Per l’esempio, cerca nel racconto una frase da citare."},{"phase":"Controllo","title":"Confronta la tua recensione","text":["Ecco una recensione possibile. La prima frase dice di che cosa parla e tiene nascosta la fine. La seconda ha giudizio, ragione ed esempio. La terza è un consiglio."],"visual":{"type":"quote","label":"Una recensione possibile","text":"Il racconto parla di Pietro, che vuole imparare ad andare in bicicletta e si allena ogni sera con la cugina Irene.\nSecondo me è un racconto incoraggiante, perché Pietro cade tante volte e si rialza sempre: “Per due settimane Pietro cadde e si rialzò”.\nLo consiglio a chi sta imparando una cosa difficile."},"action":"Confronta frase per frase. Il tuo giudizio può essere diverso: controlla che abbia una ragione e un esempio dal racconto.","hint":"Se nella prima frase hai scritto che Pietro alla fine pedala da solo, hai svelato la fine. Toglila e scrivi solo il problema: Pietro cade sempre."},{"phase":"Controllo","title":"Un errore da riconoscere","text":["Guarda questo giudizio: “Il racconto è bello perché mi è piaciuto”. La ragione ripete il giudizio con altre parole. Chi legge non sa che cosa ti è piaciuto.","Per correggere, cerca nel racconto il momento che ti ha colpito e citalo."],"visual":{"type":"quote","label":"Giudizio da correggere","text":"Da correggere: Il racconto è bello perché mi è piaciuto.\n\nCorretto: Il racconto mi è piaciuto perché Irene aiuta Pietro con pazienza: si allenano “ogni sera, quando il cortile era vuoto”."},"action":"Rileggi il giudizio della tua recensione. Sottolinea la ragione e l’esempio. Se ne manca uno, aggiungilo.","hint":"Prova il test del “cioè?”. Dopo “perché mi è piaciuto”, chiediti: “Cioè? Che cosa mi è piaciuto?”. La risposta è la ragione da scrivere."},{"phase":"Ripresa a casa","title":"Lavora sul tuo libro","text":["A casa prepara la scheda mentre leggi o subito dopo. Tieni separati i dati e i giudizi con D e G.","Per la recensione e la presentazione riparti dalla scheda: hai già quasi tutto. Se un dato manca nel libro, scrivi “non indicato”."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Raccogli i dati da copertina e frontespizio.","Scrivi la trama in tre frasi: inizio, fatti importanti, fine.","Scrivi un giudizio con ragione ed esempio.","Recensione: trama senza la fine, giudizio, consiglio.","Presentazione: una scaletta di cinque punti da dire a voce."]},"action":"Prendi il libro che stai leggendo e compila i dati della scheda. Nel Menu trovi la scheda da stampare.","hint":"Per capire se la recensione funziona, falla leggere a chi non conosce il libro. Chiedi: “Sai perché mi è piaciuto? Sai come finisce?”. Le risposte giuste sono sì e no."}],"coach":{"goal":"Insegnare a separare dati verificabili, sintesi della trama e giudizio motivato, e a riusare la stessa scheda per la recensione (senza finale, con consiglio) e per la presentazione orale (scaletta).","prepare":"Avere il libro che lo studente sta leggendo, per far trovare copertina, frontespizio e quarta di copertina. “Il segreto del faro” (Ada Corallo) e “La bicicletta rossa” (Lia Pervinca) sono titoli e autrici inventati per l’esercizio: non sono riferimenti bibliografici.","observe":"Chiedere “Si può controllare nel libro?” davanti a ogni frase della scheda e “Cioè? Che cosa ti è piaciuto?” davanti a un giudizio. Distinguere la difficoltà nel separare dati e opinioni (errore di metodo) dalla difficoltà nel ricordare la trama (memoria o lettura): nel secondo caso far scorrere i capitoli o l’indice.","adaptations":[["Trovare i dati nel libro — possibile difficoltà con dislessia","Si perde tra frontespizio e pagine con dati editoriali scritti in piccolo.","Far cercare una voce per volta con un segnariga e, se serve, fotografare e ingrandire la pagina. Verificare se lo studente ritrova da solo titolo, autore ed editore in un secondo libro."],["Scrivere la recensione — possibile difficoltà con disgrafia o disortografia","A voce motiva bene il giudizio, ma per iscritto scrive solo “mi è piaciuto”.","Offrire i tre inizi di frase stampati e la videoscrittura con correttore, se già in uso; accettare prima una versione orale. Verificare se nella versione scritta compaiono ragione ed esempio."],["Presentazione orale — difficoltà trasversale","Legge un testo intero, perde il filo o parla troppo a lungo.","Usare una scaletta di cinque punti con poche parole e provarla una volta con l’adulto. Osservare se, alla seconda prova, segue la scaletta senza leggere frasi intere."]],"sources":["ies2007","eef2025","w3c-coga","aid"],"checks":"Dati su Pinocchio verificati: autore Carlo Collodi (pseudonimo di Carlo Lorenzini), prima edizione in volume nel 1883, 36 capitoli; episodi citati presenti nel romanzo (inganno del Gatto e della Volpe, Paese dei Balocchi e trasformazione in asino, salvataggio di Geppetto dal ventre del Pesce-cane, naso che cresce con le bugie, “balocchi” = giocattoli). Nella trama Geppetto è descritto come “uomo povero”, senza indicarne il mestiere."},"print":{"modelTitle":"Esempio commentato: Le avventure di Pinocchio","model":["1. Dati (D): Le avventure di Pinocchio; Carlo Collodi; prima edizione 1883; romanzo per ragazzi; protagonista Pinocchio, un burattino di legno.","2. Trama in tre frasi: Geppetto costruisce un burattino. Pinocchio scappa e si mette nei guai: il Gatto e la Volpe lo ingannano, nel Paese dei Balocchi diventa un asino. Alla fine salva Geppetto e diventa un ragazzo vero.","3. Giudizio (G) con ragione ed esempio: il libro è avventuroso, perché Pinocchio passa da un pericolo all’altro, per esempio nel Paese dei Balocchi.","4. Recensione: di che cosa parla, senza la fine; giudizio; consiglio (“a chi ama i colpi di scena”).","5. Presentazione: scaletta di cinque punti. Domanda iniziale, titolo e autore, di che cosa parla, giudizio, consiglio."],"practice":[["Prova guidata — Il segreto del faro (libro inventato)","Quarta di copertina: 1. Teo passa l’estate dai nonni, in un paese di pescatori. 2. Una notte vede una luce accendersi nel vecchio faro abbandonato. 3. Insieme all’amica Nina decide di scoprire chi la accende. 4. Un romanzo emozionante, che ti terrà sveglio fino all’ultima pagina!\nScrivi D o G accanto a ogni numero. Poi compila la scheda con i soli dati."],["Compito nuovo — La bicicletta rossa (racconto inventato)","Pietro voleva imparare ad andare in bicicletta, ma cadeva sempre. I ragazzi del cortile ridevano di lui. Sua cugina Irene gli propose di allenarsi ogni sera, quando il cortile era vuoto. Per due settimane Pietro cadde e si rialzò. Una sera Irene lasciò andare il sellino senza dirlo. Pietro pedalò da solo fino al cancello.\nScrivi una recensione di tre frasi: di che cosa parla senza la fine, giudizio con ragione ed esempio, consiglio."]],"answers":["Quarta di copertina: 1 D, 2 D, 3 D, 4 G. Scheda: Il segreto del faro; Ada Corallo; protagonisti Teo e Nina; un paese di pescatori, d’estate; trama: Teo vede una luce nel faro abbandonato e, con Nina, cerca chi la accende.","Recensione possibile: Il racconto parla di Pietro, che vuole imparare ad andare in bicicletta e si allena ogni sera con la cugina Irene. Secondo me è incoraggiante, perché Pietro cade tante volte e si rialza sempre. Lo consiglio a chi sta imparando una cosa difficile.","Controlla: nella scheda solo dati; nella recensione la fine resta nascosta; ogni giudizio ha una ragione e un esempio."],"home":["Raccogli i dati da copertina e frontespizio; se un dato manca, scrivi “non indicato”.","Scrivi la trama in tre frasi: inizio, fatti importanti, fine.","Scrivi un giudizio con ragione ed esempio; segna D e G.","Per la recensione togli la fine e aggiungi un consiglio; per la presentazione fai una scaletta di cinque punti."]},"maps":{},"kind":"task","subject":"Italiano","area":"Antologia e comprensione"},{"id":"M02-01","title":"Leggere una poesia ad alta voce","intro":"Leggi una poesia ad alta voce con le pause giuste e il tono adatto, per far capire il senso.","slides":[{"phase":"Preparazione","title":"Leggere perché chi ascolta capisca","text":["Leggere una poesia ad alta voce serve a far capire il senso a chi ascolta. Conta più capire che correre.","Per farlo servono il ritmo e l’intonazione. Il ritmo è il modo in cui si alternano parole e pause. L’intonazione è il modo in cui la voce sale, scende e mostra un’emozione."],"visual":{"type":"list","label":"Prepara","items":["La poesia stampata, con spazio tra le righe","Una matita","Una persona che ascolti"]},"action":"Prepara la matita. Chi ti accompagna trova i testi da leggere nel Menu → Guida per il professionista.","hint":"Prima di leggere ad alta voce, puoi sempre leggere in silenzio o ascoltare qualcuno che legge. Prepararsi fa parte del lavoro. Anche gli attori provano prima di leggere in pubblico."},{"phase":"Preparazione","title":"Versi e frasi: due cose diverse","text":["Un verso è una riga della poesia. Una frase invece finisce con un punto, un punto interrogativo o un punto esclamativo.","In poesia una frase può continuare su più versi. Alla fine di quei versi la voce prosegue, senza fermarsi a lungo. Sul foglio lo segniamo con una freccia: →."],"visual":{"type":"quote","label":"Una frase su due versi","text":"Un gatto nero dorme →\nal sole di aprile."},"action":"Leggi a bassa voce i due versi come un’unica frase. Alla freccia, passa subito alla riga sotto.","hint":"Pensa a una frase scritta su un foglio stretto: va a capo, ma la frase continua. Anche nella poesia, andare a capo non sempre vuol dire “fermati”."},{"phase":"Esempio spiegato","title":"Prima capiamo la poesia","text":["Ecco la poesia dell’esempio. Prima di leggerla ad alta voce, leggila in silenzio o ascoltala. Chiediti che cosa succede.","Un gatto dorme al sole su un muro. Passa un uccellino, il passero. Il gatto apre un occhio e lo richiude: ha voglia di restare dov’è."],"visual":{"type":"quote","label":"Poesia","text":"Sul muro del cortile\nun gatto nero dorme\nal sole di aprile.\nPassa un passero. Il gatto\napre un occhio… e lo richiude."},"action":"Leggi la poesia in silenzio, oppure chiedi all’adulto di leggerla. Racconta a voce la scena in una frase.","hint":"Se una parola ti blocca, chiedi aiuto prima di leggere ad alta voce. Capire la scena ti aiuta a leggerla meglio: sai già che cosa sta per succedere."},{"phase":"Esempio spiegato","title":"Troviamo dove finiscono le frasi","text":["Cerchiamo i punti. La prima frase va dall’inizio fino ad “aprile”: occupa tre versi. Poi c’è una frase breve: “Passa un passero.”","L’ultima frase comincia a metà verso, con “Il gatto”, e continua sotto. Mettiamo una freccia alla fine dei versi che continuano."],"visual":{"type":"quote","label":"Poesia con le frecce","text":"Sul muro del cortile →\nun gatto nero dorme →\nal sole di aprile.\nPassa un passero. Il gatto →\napre un occhio… e lo richiude."},"action":"Sul tuo foglio cerchia i punti. Poi disegna le tre frecce alla fine dei versi che continuano.","hint":"Per ogni a capo chiediti: “La frase è finita?”. Se non c’è un punto, di solito continua. “Il gatto” da solo non dice che cosa fa il gatto: la risposta è nel verso sotto."},{"phase":"Esempio spiegato","title":"Segniamo le pause","text":["Ora segniamo le pause. Dopo un punto facciamo una pausa lunga: due barre, //. Ai puntini facciamo una pausa breve, di attesa: una barra, /.","Dove c’è la freccia la voce continua: al massimo prendiamo fiato in fretta."],"visual":{"type":"quote","label":"Poesia con le pause","text":"Sul muro del cortile →\nun gatto nero dorme →\nal sole di aprile. //\nPassa un passero. // Il gatto →\napre un occhio… / e lo richiude. //"},"action":"Copia le barre sulla tua poesia. Controlla che ci siano due barre dopo ogni punto.","hint":"Anche la virgola e i due punti chiedono una pausa breve, /. Qui non ci sono virgole: per questo le barre sono poche. Le pause vengono dalla punteggiatura e dal senso."},{"phase":"Esempio spiegato","title":"Ascoltiamo due letture","text":["Chi ti accompagna leggerà la poesia due volte. Nella lettura A si ferma a lungo alla fine di ogni verso. Nella lettura B segue le frecce e le barre.","Ascolta e chiediti: in quale lettura capisco meglio che cosa fa il gatto?"],"visual":{"type":"quote","label":"Poesia con frecce e pause","text":"Sul muro del cortile →\nun gatto nero dorme →\nal sole di aprile. //\nPassa un passero. // Il gatto →\napre un occhio… / e lo richiude. //"},"action":"Ascolta le due letture. Poi di’ a voce quale è più chiara e perché. Il testo è nel Menu → Guida per il professionista.","hint":"Nella lettura A, dopo “Il gatto” c’è una pausa lunga. Chi ascolta si chiede: “Il gatto che cosa?”. Nella lettura B la risposta arriva subito: il gatto apre un occhio."},{"phase":"Esempio spiegato","title":"Scegliamo il tono","text":["Il tono è l’emozione della voce. Per sceglierlo, chiediti com’è la scena. Qui è calma e un po’ buffa: il gatto è così pigro che lascia andare il passero.","Allora leggiamo piano, con voce tranquilla. Ai puntini aspettiamo un attimo, poi diciamo “e lo richiude” con un sorriso nella voce."],"visual":{"type":"table","label":"Che cosa fa la voce","columns":["Segno o scena","La voce"],"rows":[["Scena calma","va piano, è morbida"],["…","si ferma un attimo e crea attesa"],["?","sale alla fine, come in una domanda"],["!","diventa più forte e decisa"]]},"action":"Leggi tu la poesia ad alta voce, con i segni e il tono calmo. Chiedi a chi ascolta se ha capito la scena.","hint":"Prova a dire “Sei arrivato.” e poi “Sei arrivato?”. Le parole sono uguali, ma nella domanda la voce sale alla fine. Questa è l’intonazione."},{"phase":"Prova guidata","title":"Prova tu: segna frecce e pause","text":["Ecco una nuova poesia. Prima leggila in silenzio e capisci la scena. Poi cerca dove finiscono le frasi."],"visual":{"type":"quote","label":"Poesia","text":"Le onde arrivano piano\nsulla sabbia bagnata\ne tornano indietro. Un bambino\nle insegue con un secchiello.\nChi vincerà questa gara?"},"action":"Sul foglio cerchia i punti. Metti le frecce alla fine dei versi che continuano e due barre dopo ogni punto. Poi vai avanti.","hint":"Leggi un verso alla volta e chiediti: “La frase è finita?”. Attenzione a “Un bambino”: che cosa fa il bambino? Lo scopri nel verso sotto."},{"phase":"Controllo guidato","title":"Confronta i segni","text":["La prima frase occupa tre versi: va fino a “indietro”. La seconda comincia a metà verso, con “Un bambino”, e continua sotto. L’ultima frase è una domanda."],"visual":{"type":"quote","label":"Poesia con i segni","text":"Le onde arrivano piano →\nsulla sabbia bagnata →\ne tornano indietro. // Un bambino →\nle insegue con un secchiello. //\nChi vincerà questa gara? //"},"action":"Confronta i tuoi segni con questi. Se ti manca una freccia, aggiungila e rileggi quei due versi insieme.","hint":"Se avevi messo due barre dopo “Un bambino”, prova a leggere così. Chi ascolta sente “Un bambino” e poi silenzio: non sa che cosa fa. Per questo la voce deve proseguire."},{"phase":"Prova guidata","title":"Prova tu: scegli il tono e leggi","text":["Ora scegli il tono. Chiediti com’è la scena: le onde vanno e vengono, un bambino gioca a rincorrerle.","L’ultimo verso è una domanda: la voce sale alla fine."],"visual":{"type":"quote","label":"Poesia con i segni","text":"Le onde arrivano piano →\nsulla sabbia bagnata →\ne tornano indietro. // Un bambino →\nle insegue con un secchiello. //\nChi vincerà questa gara? //"},"action":"Scrivi sul foglio il tono che scegli, con una parola. Poi leggi la poesia ad alta voce a chi ti accompagna.","hint":"Una scena di gioco può avere un tono allegro o leggero. Per la domanda finale, prova prima a dirla come se la chiedessi davvero a un amico."},{"phase":"Controllo guidato","title":"Controlla la tua lettura","text":["Un tono possibile è allegro e leggero, perché c’è un gioco. Anche “calmo” va bene, se pensi alle onde lente.","Chi ti ascolta controlla tre cose, scritte qui sotto."],"visual":{"type":"list","label":"Tre controlli per chi ascolta","items":["Le frasi si sentono intere, anche quando vanno a capo.","Le pause lunghe sono dopo i punti.","La voce sale alla fine della domanda."]},"action":"Chiedi a chi ti ascolta di dirti sì o no per ogni controllo. Rileggi solo la parte con il no.","hint":"Se vuoi, chiedi all’adulto di leggere prima lui la poesia, come modello. Il testo è nella Guida per il professionista. Poi prova tu, imitando le pause."},{"phase":"Compito nuovo","title":"Una poesia piena di energia","text":["Ecco l’ultima poesia. Questa volta fai tutto da solo: capisci la scena, segna frecce e pause, scegli il tono e leggi.","C’è un punto esclamativo: la voce diventa più forte."],"visual":{"type":"quote","label":"Poesia","text":"Suona la campanella!\nLe porte si spalancano\ne cento voci corrono\ngiù per le scale. Fuori\nil sole aspetta tutti."},"action":"Segna la poesia sul foglio. Leggila ad alta voce a chi ti accompagna. Poi vai avanti per confrontare.","hint":"Immagina l’ultima ora di scuola che finisce. Come ti senti quando suona la campanella? Prova a mettere quell’emozione nella voce."},{"phase":"Controllo","title":"Confronta segni e tono","text":["La prima frase è breve ed esclamativa: voce forte e allegra. La seconda va da “Le porte” fino a “scale”. L’ultima comincia con “Fuori” e continua sotto.","Il tono può essere allegro ed energico: le lezioni sono finite."],"visual":{"type":"quote","label":"Poesia con i segni","text":"Suona la campanella! //\nLe porte si spalancano →\ne cento voci corrono →\ngiù per le scale. // Fuori →\nil sole aspetta tutti. //"},"action":"Confronta i tuoi segni. Rileggi ad alta voce i versi dove i tuoi segni sono diversi.","hint":"Il tono si sceglie guardando la scena. Qui ci sono porte che si spalancano e voci che corrono: tutto è veloce. Un tono triste andrebbe contro queste parole."},{"phase":"Controllo","title":"Un errore da riconoscere","text":["In questa lettura ci si ferma a lungo dopo “Fuori”, alla fine del verso. Chi ascolta sente “Fuori” da solo e non capisce.","“Fuori” fa parte della frase sotto: “Fuori il sole aspetta tutti”. Per correggere, metti una freccia e leggi i due versi insieme."],"visual":{"type":"quote","label":"Lettura da correggere","text":"Errore:\ngiù per le scale. // Fuori //\nil sole aspetta tutti.\n\nCorrezione:\ngiù per le scale. // Fuori →\nil sole aspetta tutti. //"},"action":"Leggi a voce le due versioni. Poi controlla la tua lettura: ti sei fermato a lungo alla fine di un verso, dove la frase continuava?","hint":"Quando una frase comincia a metà verso, è facile fermarsi all’a capo. Le frecce servono proprio a questo: ti ricordano di proseguire."},{"phase":"Ripresa a casa","title":"Prepara la lettura a casa","text":["Quando devi leggere una poesia in classe, preparala a casa. Prima capisci la scena, poi segna la poesia con la matita.","Prova la lettura due o tre volte, in giorni diversi. Se una parola ti blocca sempre, chiedi aiuto o ascolta un modello."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Leggi in silenzio o ascolta, e capisci la scena.","Cerchia i punti: lì finiscono le frasi.","Metti → alla fine dei versi che continuano.","Metti // dopo i punti e / alle virgole.","Scegli il tono con una parola e prova a voce."]},"action":"Prendi la poesia del tuo libro e segna sul testo frecce e barre. Nel Menu trovi la scheda da stampare.","hint":"Puoi registrare la tua lettura con il telefono e riascoltarla. Chiediti: si capisce chi fa che cosa? Se sì, il metodo funziona."}],"coach":{"goal":"Insegnare a preparare la lettura espressiva: capire la scena, distinguere verso e frase, segnare pause e continuazioni, scegliere il tono. L’obiettivo è la comprensibilità per chi ascolta, non la velocità né la correttezza della decodifica.","prepare":"Stampare le poesie a caratteri grandi, con interlinea ampia. Leggere in anticipo i testi qui sotto. Le poesie sono state scritte per l’esercitazione; non sono citazioni di un autore. Non chiedere la lettura davanti alla classe senza preparazione.","observe":"Osservare se lo studente lega i versi che continuano e fa le pause lunghe ai punti. Distinguere un errore di decodifica (parola letta male, poi corretta) da un errore di ritmo (frase spezzata all’a capo): solo il secondo riguarda questo percorso. Chiedere “Chi fa che cosa in questo verso?” quando una frase viene spezzata.","scripts":[{"title":"Esempio — lettura A (da non imitare)","text":"Sul muro del cortile //\nun gatto nero dorme //\nal sole di aprile. //\nPassa un passero. Il gatto //\napre un occhio… e lo richiude. //","instruction":"Leggere alla schermata “Ascoltiamo due letture”. Fare una pausa lunga alla fine di ogni verso, anche dove la frase continua, con voce piatta."},{"title":"Esempio — lettura B","text":"Sul muro del cortile →\nun gatto nero dorme →\nal sole di aprile. //\nPassa un passero. // Il gatto →\napre un occhio… / e lo richiude. //","instruction":"Leggere subito dopo la lettura A. Seguire frecce e barre, con tono calmo; breve attesa ai puntini e “e lo richiude” con un sorriso nella voce."},{"title":"Prova guidata — modello","text":"Le onde arrivano piano →\nsulla sabbia bagnata →\ne tornano indietro. // Un bambino →\nle insegue con un secchiello. //\nChi vincerà questa gara? //","instruction":"Leggere solo se lo studente lo chiede alla schermata “Controlla la tua lettura”, oppure prima della sua lettura se decifrare il testo è molto faticoso. Tono leggero; voce che sale nella domanda finale."}],"adaptations":[["Lettura ad alta voce — possibile difficoltà con dislessia","La decodifica lenta o con errori assorbe l’attenzione e le pause si perdono.","Far precedere sempre la lettura silenziosa o l’ascolto del modello; permettere di leggere un verso alla volta. Valutare il ritmo separatamente dagli errori di lettura: verificare se le frasi restano intere anche quando una parola viene corretta."],["Seguire i versi — possibile difficoltà con dislessia","All’a capo salta una riga o perde il punto in cui era.","Usare un segnariga, testo ingrandito e frecce colorate. Verificare se i salti di riga diminuiscono rispetto alla prima lettura."],["Leggere davanti agli altri — difficoltà trasversale","Rifiuta di leggere o legge con voce molto bassa e veloce.","Proporre prima la lettura al solo adulto, poi una registrazione da riascoltare; concordare quando e davanti a chi leggere. Osservare se accetta di leggere una seconda volta."]],"sources":["ies2007","w3c-coga","aiddsa","aid"],"checks":"Verificata la punteggiatura delle tre poesie inventate e la posizione delle frecce: ogni freccia segna un verso senza punto finale la cui frase prosegue nel verso successivo."},"print":{"modelTitle":"Esempio commentato: il gatto sul muro","visual":{"type":"quote","label":"Poesia segnata","text":"Sul muro del cortile →\nun gatto nero dorme →\nal sole di aprile. //\nPassa un passero. // Il gatto →\napre un occhio… / e lo richiude. //"},"model":["1. Leggo in silenzio e capisco la scena: un gatto pigro al sole lascia andare un passero.","2. Cerchio i punti: lì finiscono le frasi.","3. Metto → alla fine dei versi che continuano: dopo “cortile”, “dorme” e “Il gatto”.","4. Metto // dopo i punti e / ai puntini, per un attimo di attesa.","5. Scelgo il tono: calmo e un po’ buffo. Leggo piano, con un sorriso nella voce alla fine."],"practice":[["Prova guidata — le onde","Le onde arrivano piano\nsulla sabbia bagnata\ne tornano indietro. Un bambino\nle insegue con un secchiello.\nChi vincerà questa gara?\nSegna punti, frecce e pause. Scegli il tono e leggi a voce."],["Compito nuovo — la campanella","Suona la campanella!\nLe porte si spalancano\ne cento voci corrono\ngiù per le scale. Fuori\nil sole aspetta tutti.\nSegna punti, frecce e pause. Scegli il tono e leggi a voce."]],"answers":["Le onde: frecce dopo “piano”, “bagnata” e “Un bambino”; // dopo “indietro”, “secchiello” e “gara?”. Tono possibile: allegro e leggero; la voce sale nella domanda finale.","La campanella: // dopo “campanella!”, “scale” e “tutti”; frecce dopo “spalancano”, “corrono” e “Fuori”. Tono possibile: allegro ed energico; voce più forte all’inizio.","Controllo di chi ascolta: le frasi si sentono intere? Le pause lunghe sono dopo i punti? La domanda sale alla fine?"],"home":["Leggi in silenzio o ascolta, e capisci la scena.","Cerchia i punti e metti → alla fine dei versi che continuano.","Metti // dopo i punti e / alle virgole.","Scegli il tono con una parola e prova a voce due o tre volte, in giorni diversi."]},"maps":{},"kind":"task","subject":"Italiano","area":"Poesia"},{"id":"M02-02","title":"Fare la parafrasi","intro":"Riscrivi una poesia con parole più comuni, mantenendo il significato.","slides":[{"phase":"Preparazione","title":"Riscrivere, mantenendo il significato","text":["Una poesia può usare un ordine insolito delle parole o espressioni che non vanno prese alla lettera. La parafrasi serve a riscrivere quel testo con parole più comuni.","Scriverai in prosa: frasi come quelle di un racconto, senza dover rispettare le righe della poesia. Alla fine controllerai di non aver cambiato il significato."],"visual":{"type":"list","label":"Prepara","items":["Il testo da riscrivere","Un foglio e una penna","Un dizionario o l’aiuto di chi ti accompagna"]},"action":"Scrivi sul foglio il titolo “Parafrasi”. Lascia spazio per il testo originale e per la tua riscrittura.","hint":"Non devi inventare un’altra storia. Immagina di spiegare le stesse informazioni a una persona che fatica a capire le parole della poesia."},{"phase":"Esempio spiegato","title":"Leggiamo due versi","text":["Queste due righe di poesia sono due versi. Le useremo come esempio. Il colle è una collina.","Qui “oro” richiama il colore giallo della luce del sole. Questa informazione ci aiuta a capire l’immagine scelta nella poesia."],"visual":{"type":"quote","label":"Testo originale","text":"D’oro si veste\nil colle al mattino."},"action":"Leggi o ascolta i due versi una volta. Per ora cerca soltanto di immaginare la scena.","hint":"Puoi chiedere all’adulto di leggere. Immagina una collina al mattino: il sole la illumina. Non serve imparare i versi a memoria."},{"phase":"Esempio spiegato","title":"Troviamo di chi si parla","text":["In questa frase, il colle è ciò di cui si dice che “si veste”. In grammatica è il soggetto. Nella poesia arriva dopo il verbo, ma possiamo metterlo all’inizio per rendere la frase più facile da seguire."],"visual":{"type":"quote","label":"Versi da osservare","text":"D’oro si veste\nil colle al mattino."},"action":"Indica le parole “il colle” nel testo. Sono le parole che metteremo all’inizio.","hint":"Chiediti: che cosa “si veste”? La risposta è “il colle”. In altre frasi questa domanda va adattata al verbo: qui serve a seguire questo esempio."},{"phase":"Esempio spiegato","title":"Rimettiamo in ordine le parole","text":["Mettiamo prima “Il colle”, poi “si veste”, poi “d’oro” e infine “al mattino”. Abbiamo cambiato l’ordine; non abbiamo ancora spiegato l’immagine dell’oro."],"visual":{"type":"quote","label":"Prima e dopo","text":"D’oro si veste / il colle al mattino.\n\nIl colle si veste d’oro al mattino."},"action":"Segui con il dito le quattro parti della frase riordinata. Ritrova ciascuna parte nei versi.","hint":"Le parole “al mattino” dicono quando succede la scena. Anche nella parafrasi devono esserci. Puoi spostare le parole, ma tienile tutte."},{"phase":"Esempio spiegato","title":"Spieghiamo l’immagine dell’oro","text":["“Si veste d’oro” è un’espressione figurata. Un’espressione figurata usa un’immagine per dire un’altra cosa. Qui l’immagine è un vestito d’oro. Vuol dire che la luce dorata del sole illumina il colle."],"visual":{"type":"quote","label":"Espressione e significato","text":"Il colle si veste d’oro.\n\nIl colle è illuminato dalla luce dorata del sole."},"action":"Leggi il significato. Immagina se descrive la stessa scena dei versi.","hint":"Per capire un’immagine, guarda le parole vicine. Chiediti: che scena descrive la poesia? Anche il dizionario aiuta. Leggi tutte le definizioni e scegli quella giusta per la scena."},{"phase":"Esempio spiegato","title":"Ricomponiamo una frase completa","text":["Ora mettiamo insieme due cose: il significato dell’immagine e il momento della giornata. Mettiamo “al mattino” all’inizio. Così si capisce subito quando il colle è illuminato."],"visual":{"type":"quote","label":"Originale e parafrasi","text":"D’oro si veste\nil colle al mattino.\n\nAl mattino il colle è illuminato dalla luce dorata del sole."},"action":"Scrivi la parafrasi sotto i versi. Confronta: ci sono ancora il colle, la luce dorata e il mattino?","hint":"La parafrasi può essere più lunga dei versi. Le parole in più servono a spiegare. Aggiungi solo spiegazioni. “Il colle è bello” è un’opinione: nei versi non c’è."},{"phase":"Prova guidata","title":"Quale frase mantiene lo stesso significato?","text":["Prima di scrivere da solo, guarda queste due frasi. Puoi usare parole diverse dai versi. Le informazioni, però, devono restare le stesse."],"visual":{"type":"quote","label":"Originale e due possibilità","text":"D’oro si veste\nil colle al mattino.\n\nA. Al mattino la luce dorata del sole illumina il colle.\nB. Al tramonto la luce dorata del sole illumina il colle."},"action":"Sul foglio scrivi A oppure B. Indica nei versi la parola che ti ha aiutato a scegliere. Avanza per controllare.","hint":"Cerca l’informazione sul momento della giornata. Devi poterla ritrovare anche nella frase che scegli."},{"phase":"Controllo guidato","title":"La parola “mattino” decide il confronto","text":["La frase A mantiene il momento della giornata indicato dal testo. La B lo cambia: “tramonto” è il momento in cui il sole scende sotto l’orizzonte, non il mattino."],"visual":{"type":"quote","label":"Confronto con il testo","text":"D’oro si veste\nil colle al mattino.\n\nA. Al mattino la luce dorata del sole illumina il colle."},"action":"Se avevi scelto B, correggi soltanto l’indicazione del tempo. Hai usato una parola del testo per controllare il significato.","hint":"Due frasi possono sembrare simili e dire cose diverse. Nella parafrasi tieni anche i piccoli dettagli, come il momento o il luogo."},{"phase":"Prova guidata","title":"Proviamo con un altro testo","text":["Adesso userai gli stessi passaggi su questi versi. “Manto” può indicare una copertura; qui è la neve che copre il villaggio.","Quando il testo dice che il villaggio “dorme”, descrive la quiete del luogo: non significa che le case dormano davvero."],"visual":{"type":"quote","label":"La tua prova","text":"Dorme il villaggio\nsotto un manto di neve."},"action":"Copia i versi sul foglio, oppure usa una copia già pronta. Lascia una riga sotto per la parafrasi.","hint":"Se copiare ti fa perdere il filo, chiedi un testo già stampato. Il lavoro da imparare qui è capire e riscrivere il significato."},{"phase":"Prova guidata","title":"Mettiamo il villaggio all’inizio","text":["Questa volta le parole da mettere all’inizio sono “Il villaggio”. Dopo vengono “dorme” e “sotto un manto di neve”. Prima di spiegare le immagini, rendiamo chiaro l’ordine."],"visual":{"type":"quote","label":"Testo da riordinare","text":"Dorme il villaggio\nsotto un manto di neve."},"action":"Completa sul foglio: “Il villaggio …”. Usa tutte le informazioni dei due versi.","hint":"La frase riordinata è “Il villaggio dorme sotto un manto di neve”. Se avevi scritto un ordine diverso, controlla che il significato sia lo stesso."},{"phase":"Prova guidata","title":"Sostituisci le immagini con il significato","text":["Ora trasforma “dorme” in un’espressione che dica che il villaggio è quieto. Trasforma “sotto un manto di neve” in parole che dicano che è coperto di neve."],"visual":{"type":"quote","label":"Informazioni da mantenere","text":"Il villaggio dorme sotto un manto di neve.\n\n“Dorme” → è quieto.\n“Manto di neve” → copertura di neve."},"action":"Scrivi una frase completa sul villaggio. Puoi iniziare con “Il villaggio è …”.","hint":"Prova a unire “è quieto” e “coperto di neve”. Non aggiungere dettagli come l’ora o il numero delle case: i versi non li indicano."},{"phase":"Controllo guidato","title":"Confronta il significato, non le singole parole","text":["Questa è una possibile parafrasi. Anche “Il villaggio è tranquillo e la neve lo ricopre” mantiene il significato. Non è necessario aver scelto le stesse parole del modello."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"Il villaggio è quieto e coperto di neve."},"action":"Controlla la tua frase: parla del villaggio, della quiete e della neve che lo copre? Se manca un’informazione, aggiungila.","hint":"Se hai scritto soltanto “C’è la neve”, manca la quiete del villaggio. Torna all’espressione “dorme” e inserisci anche il suo significato."},{"phase":"Compito nuovo","title":"Adesso scegli tu i passaggi","text":["Usa questo testo nuovo. “Sussurra” significa “parla a voce molto bassa”; qui descrive il rumore leggero del vento tra i rami.","Puoi tenere aperti il testo e questa spiegazione mentre lavori."],"visual":{"type":"quote","label":"Nuovi versi","text":"Tra i rami sussurra\nil vento della sera."},"action":"Sul foglio scrivi la parafrasi. Prima riordina la frase; poi spiega “sussurra”. Vai avanti quando vuoi confrontare il tuo lavoro.","hint":"Chiediti: che cosa produce il suono? Dove? In quale momento? Nel testo trovi “il vento”, “tra i rami” e “della sera”. Tienile tutte nella parafrasi."},{"phase":"Controllo","title":"Leggiamo una soluzione possibile","text":["Il soggetto è “il vento della sera”. L’espressione “sussurra” viene spiegata come un rumore leggero. L’indicazione “tra i rami” rimane nella frase."],"visual":{"type":"quote","label":"Originale e parafrasi","text":"Tra i rami sussurra\nil vento della sera.\n\nIl vento della sera produce un rumore leggero tra i rami."},"action":"Confronta la tua parafrasi con i versi. Se hai scritto “soffia piano tra i rami”, chiediti se risulta chiaro anche il suono leggero descritto dal testo.","hint":"Puoi correggere solo il punto che manca. Per esempio, a “Il vento passa tra i rami” puoi aggiungere “la sera, producendo un rumore leggero”."},{"phase":"Controllo","title":"Riconosci un’aggiunta non presente nel testo","text":["“Il vento spaventoso spezza i rami” cambia la scena: nei versi non si parla né di paura né di rami spezzati. Nella parafrasi spieghiamo le parole del testo, senza inventare altri eventi."],"visual":{"type":"quote","label":"Il testo a cui tornare","text":"Tra i rami sussurra\nil vento della sera."},"action":"Rileggi la tua frase. Cerca eventuali informazioni che non puoi ritrovare o ricavare dai versi. Toglile o discutile con chi ti accompagna.","hint":"Non tutto ciò che immagini leggendo deve entrare nella parafrasi. Le tue impressioni possono servire in un commento personale, che è un lavoro diverso."},{"phase":"Ripresa a casa","title":"Riprendi il metodo sul tuo compito","text":["A casa affronta pochi versi per volta. Tieni sempre davanti l’originale mentre riscrivi.","Se un’immagine resta poco chiara, segnala la parola e chiedi aiuto sul suo significato prima di proseguire."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Leggi o ascolta i versi e chiarisci le parole difficili.","Ricostruisci una frase con un ordine che riesci a seguire.","Spiega le immagini usando il contesto.","Confronta ogni informazione con il testo originale."]},"action":"Scegli i primi versi del compito assegnato e applica la sequenza. Nel Menu trovi la scheda da stampare.","hint":"Per capire se il metodo funziona, scegli una parola della tua parafrasi. Spiega perché l’hai scelta. Se ritrovi nei versi la parola che te l’ha fatta scegliere, stai lavorando bene."}],"coach":{"goal":"Osservare se lo studente ricostruisce e conserva il significato, distinguendo parafrasi e commento. Non richiedere una formulazione identica al modello.","prepare":"Usare i testi originali di questo prototipo, letti insieme. Chiarire prima il lessico necessario. I versi sono stati scritti per l’esercitazione; non sono citazioni di un autore.","observe":"Chiedere “Quale parola dei versi ti ha fatto scrivere questo?”. Se lo studente non risponde, tornare al punto del testo e modellare un solo collegamento, poi proporne un altro allo studente.","adaptations":[["Lettura dei versi — possibile difficoltà con dislessia","Lettura lenta o errori che fanno perdere la scena.","Offrire lettura dell’adulto o sintesi vocale già abituale e mantenere il testo visibile. Verificare se lo studente individua le informazioni ascoltate."],["Scrittura — possibile difficoltà con disgrafia o disortografia","Il significato è spiegato oralmente, ma la scrittura assorbe tutto lo sforzo.","Accettare inizialmente una parafrasi orale o scritta dall’adulto sotto dettatura. Separare il controllo del significato da quello ortografico; mantenere disponibili gli strumenti consueti."]],"sources":["w3c-coga","aiddsa","ciu"]},"print":{"modelTitle":"Esempio commentato","model":["D’oro si veste\nil colle al mattino.","1. Individuo il colle: è ciò di cui si dice che “si veste”.","2. Riordino: “Il colle si veste d’oro al mattino”.","3. Spiego l’immagine: il colle è illuminato dalla luce dorata del sole.","4. Scrivo: “Al mattino il colle è illuminato dalla luce dorata del sole”.","5. Controllo che ci siano il colle, la luce dorata e il mattino."],"practice":[["Prova guidata","Dorme il villaggio\nsotto un manto di neve.\nQui “dorme” indica quiete e “manto” indica copertura. Riordina la frase e spiega le due immagini."],["Compito nuovo","Tra i rami sussurra\nil vento della sera.\nQui “sussurra” descrive il rumore leggero del vento. Riscrivi mantenendo chi, dove e quando."]],"answers":["Prova guidata: “Il villaggio è quieto e coperto di neve”.","Compito nuovo: “Il vento della sera produce un rumore leggero tra i rami”.","Sono possibili parole diverse. Controlla le informazioni, non la corrispondenza parola per parola."],"home":["Leggi pochi versi e chiarisci il lessico.","Riordina la frase; spiega le immagini usando il contesto.","Confronta la riscrittura con l’originale e togli le aggiunte non giustificate."]},"maps":{},"kind":"task","subject":"Italiano","area":"Poesia"},{"id":"M02-03","title":"Versi, strofe, rime e metrica","intro":"Conta versi e strofe, trova lo schema delle rime e conta le sillabe di un verso.","slides":[{"phase":"Preparazione","title":"Guardare come è costruita una poesia","text":["Una poesia ha una forma: righe, gruppi di righe, suoni che si ripetono. In questo percorso impari a contarli e a dar loro un nome.","Lavorerai un livello alla volta: prima i versi e le strofe, poi le rime, infine le sillabe di un verso."],"visual":{"type":"list","label":"Le parole che userai","items":["Verso: una riga della poesia","Strofa: un gruppo di versi","Rima: due versi che finiscono con lo stesso suono","Sillaba metrica: la sillaba come si conta in poesia"]},"action":"Prepara una matita e due colori. Scrivi sul foglio quattro titoli, uno sotto l’altro: Versi, Strofe, Rime, Sillabe.","hint":"Ogni parola verrà spiegata con un esempio quando la userai. Puoi tornare a questa schermata quando vuoi, con il pulsante “Indietro”."},{"phase":"Esempio spiegato","title":"Contiamo versi e strofe","text":["Ogni riga della poesia è un verso. Un gruppo di versi, separato dagli altri da una riga vuota, è una strofa.","Questa poesia ha quattro versi. La riga vuota la divide in due strofe di due versi."],"visual":{"type":"quote","label":"Poesia","text":"Sopra il tetto della scuola\nuna rondine che vola\n\nfa tre giri sul cortile\ne poi torna al campanile."},"action":"Numera i versi da 1 a 4. Poi disegna una parentesi accanto a ogni strofa. Scrivi: 4 versi, 2 strofe.","hint":"Quando numeri, salta la riga vuota: non è un verso. Conta solo le righe con le parole. Le strofe le riconosci dagli spazi bianchi tra un gruppo e l’altro."},{"phase":"Esempio spiegato","title":"Cerchiamo le rime","text":["Due versi fanno rima quando le ultime parole sono uguali dalla vocale con l’accento in poi. In “scuòla” e “vòla” l’accento è sulla o. Da lì in poi c’è “-ola” in tutte e due.","Anche “cortìle” e “campanìle” fanno rima: “-ile”."],"visual":{"type":"table","label":"Le ultime parole","columns":["Ultima parola","Dalla vocale con l’accento"],"rows":[["scuòla","-ola"],["vòla","-ola"],["cortìle","-ile"],["campanìle","-ile"]]},"action":"Cerchia le ultime parole dei quattro versi. Sottolinea la parte uguale: “-ola” e “-ile”.","hint":"“Casa” e “sera” finiscono con la stessa lettera, a. Però dalla vocale con l’accento sono diverse: “-asa” ed “-era”. Quindi la rima manca. Per trovare l’accento, pronuncia la parola lentamente."},{"phase":"Esempio spiegato","title":"Diamo una lettera a ogni rima","text":["Per scrivere lo schema delle rime usiamo le lettere. Il primo suono è A, il secondo suono diverso è B. I versi che fanno rima tra loro hanno la stessa lettera.","Qui lo schema è AABB. Quando rimano due versi vicini, la rima si chiama baciata."],"visual":{"type":"table","label":"Tre schemi di rime","columns":["Schema","Nome","Come funziona"],"rows":[["AABB","rima baciata","rimano due versi vicini"],["ABAB","rima alternata","rima un verso sì e uno no"],["ABBA","rima incrociata","il primo rima con il quarto, il secondo con il terzo"]]},"action":"Scrivi le lettere A, A, B, B accanto ai quattro versi. Poi scrivi: rima baciata.","hint":"Scrivi le lettere in ordine, dall’alto in basso. Quando trovi un suono nuovo, usa la lettera dopo nell’alfabeto. Se un suono è già comparso, riusa la sua lettera."},{"phase":"Esempio spiegato","title":"Dividiamo il primo verso in sillabe","text":["Ora contiamo le sillabe del primo verso. Prima lo dividiamo come a scuola, in sillabe normali. Si chiamano sillabe grammaticali.","“Sopra il tetto della scuola” ha nove sillabe grammaticali."],"visual":{"type":"math","label":"Sillabe grammaticali","lines":["So | pra | il | tet | to | del | la | scuo | la","So(1) pra(2) il(3) tet(4) to(5) del(6) la(7) scuo(8) la(9)"]},"action":"Scrivi il verso sul foglio, staccando le sillabe con una barra. Sotto ogni sillaba scrivi un numero.","hint":"“Scuola” ha due sillabe: scuo-la. Le vocali u e o stanno nella stessa sillaba. Batti le mani a ogni sillaba mentre la dici: ti aiuta a non saltarne."},{"phase":"Esempio spiegato","title":"Uniamo le vocali vicine: la sinalefe","text":["In poesia una parola può finire con una vocale e la parola dopo può cominciare con una vocale. Allora di solito le due sillabe si uniscono. Questa unione si chiama sinalefe.","Qui “sopra” finisce con a e “il” comincia con i. “Pra” e “il” diventano una sillaba sola."],"visual":{"type":"math","label":"Sillabe metriche","lines":["sopra il → so | pra_il","So(1) pra_il(2) tet(3) to(4) del(5) la(6) scuo(7) la(8)"]},"action":"Sul foglio unisci “pra” e “il” con un archetto. Conta di nuovo: ora le sillabe sono 8.","hint":"Leggi il verso ad alta voce senza fermarti: “soprail tetto”. La voce unisce le due vocali da sola. Il trattino basso _ nel conteggio mostra proprio questa unione."},{"phase":"Esempio spiegato","title":"Guardiamo l’ultima parola e diamo un nome","text":["L’ultima parola è “scuola”. L’accento è sulla penultima sillaba: scuò-la. Una parola così si chiama piana, e il numero resta 8.","Un verso di 8 sillabe si chiama ottonario."],"visual":{"type":"table","label":"I nomi dei versi","columns":["Sillabe","Nome del verso"],"rows":[["5","quinario"],["6","senario"],["7","settenario"],["8","ottonario"],["9","novenario"],["10","decasillabo"],["11","endecasillabo"]]},"action":"Scrivi accanto al primo verso: 8 sillabe, ottonario. Se vuoi, conta anche gli altri tre versi: sono tutti di 8.","hint":"Molti nomi vengono dai numeri: “otto” e ottonario, “sette” e settenario. Puoi tenere questa tabella vicino a te mentre lavori, invece di impararla a memoria."},{"phase":"Esempio spiegato","title":"Parole tronche e parole sdrucciole","text":["Se l’ultima parola ha l’accento sull’ultima sillaba, come “va”, è tronca: aggiungi 1. Se ha l’accento sulla terzultima, come “tàvolo”, è sdrucciola: togli 1.","In questi due versi il risultato è 8."],"visual":{"type":"math","label":"Due esempi","lines":["Quando il sole se ne va","Quan(1) do_il(2) so(3) le(4) se(5) ne(6) va(7) → tronca: 7 + 1 = 8","Corre un gatto sopra il tavolo","Cor(1) re_un(2) gat(3) to(4) so(5) pra_il(6) ta(7) vo(8) lo(9) → sdrucciola: 9 − 1 = 8"]},"action":"Leggi i due esempi. In ognuno indica le sinalefi e l’ultima parola.","hint":"C’è anche una regola unica: conta fino all’ultima sillaba con l’accento, poi aggiungi 1. In “va” l’accento è sulla settima: 7 + 1 = 8. In “scuola”, scuò è la settima: 7 + 1 = 8."},{"phase":"Prova guidata","title":"Prova tu: versi, strofe e rime","text":["Ecco una nuova poesia. Lavora come nell’esempio: prima versi e strofe, poi le rime e le lettere dello schema."],"visual":{"type":"quote","label":"Poesia","text":"Quando arriva primavera\nnel giardino nasce un fiore:\napre i petali di sera\ne regala un bel colore."},"action":"Sul foglio scrivi quanti versi e quante strofe ci sono. Poi scrivi le lettere accanto ai versi e il nome della rima.","hint":"Confronta l’ultima parola del primo verso con quelle sotto: con quale fa rima? Ricorda gli schemi: AABB rima baciata, ABAB rima alternata, ABBA rima incrociata."},{"phase":"Controllo guidato","title":"Confronta versi, strofe e rime","text":["Ci sono 4 versi e 1 strofa: non ci sono righe vuote. “Primavera” fa rima con “sera”: “-era”. “Fiore” fa rima con “colore”: “-ore”.","Lo schema è ABAB: la rima si chiama alternata."],"visual":{"type":"table","label":"Soluzione","columns":["Verso","Ultima parola","Lettera"],"rows":[["1","primavèra","A"],["2","fiòre","B"],["3","sèra","A"],["4","colòre","B"]]},"action":"Confronta il tuo lavoro. Se hai scritto AABB, rileggi le ultime parole del primo e del secondo verso: fanno rima?","hint":"“Primavera” e “fiore” hanno suoni diversi: “-era” e “-ore”. Quindi il secondo verso prende una lettera nuova, B. Il terzo verso torna al suono “-era”: lettera A."},{"phase":"Prova guidata","title":"Prova tu: conta le sillabe","text":["Ora conta le sillabe del primo verso: “Quando arriva primavera”. Segui i tre passi dell’esempio."],"visual":{"type":"list","label":"I tre passi","items":["1. Dividi il verso in sillabe grammaticali e numerale.","2. Unisci le vocali vicine tra due parole: la sinalefe.","3. Guarda l’ultima parola: piana, tronca o sdrucciola?"]},"action":"Scrivi il verso sul foglio e fai i tre passi. Alla fine scrivi il numero e il nome del verso.","hint":"Cerca una parola che finisce con una vocale, seguita da una parola che comincia con una vocale. Qui c’è “Quando arriva”: la o di “quando” e la a di “arriva”."},{"phase":"Controllo guidato","title":"Confronta il conteggio","text":["Le sillabe grammaticali sono 9. Con la sinalefe “do_ar” diventano 8. L’ultima parola, “primavèra”, è piana: il numero resta 8.","Il verso è un ottonario, come quelli della rondine."],"visual":{"type":"math","label":"Il conteggio","lines":["Quan | do | ar | ri | va | pri | ma | ve | ra → 9","Quan(1) do_ar(2) ri(3) va(4) pri(5) ma(6) ve(7) ra(8) → 8","primavèra è piana → ottonario"]},"action":"Confronta il tuo conteggio riga per riga. Se hai 9, cerca la sinalefe che ti manca.","hint":"Se hai contato 7, forse hai unito due sillabe dentro la stessa parola. La sinalefe unisce solo la fine di una parola e l’inizio della parola dopo."},{"phase":"Compito nuovo","title":"Adesso tutta la poesia da solo","text":["Ecco l’ultima poesia. Questa volta fai tutto da solo: versi, strofe, rime e schema.","Poi conta le sillabe del terzo verso: “lo osserva un ragazzino”."],"visual":{"type":"quote","label":"Poesia","text":"La sera, in riva al mare,\nsi accende un lumicino:\nlo osserva un ragazzino\nche sogna di salpare."},"action":"Fai tutto il lavoro sul foglio. Vai avanti quando vuoi confrontare.","hint":"“Salpare” vuol dire partire con una barca. Per lo schema, confronta il primo verso con l’ultimo. Nel terzo verso cerca due punti in cui una vocale finale incontra una vocale iniziale."},{"phase":"Controllo","title":"Confronta schema e conteggio","text":["Ci sono 4 versi e 1 strofa. “Mare” fa rima con “salpare”, “lumicino” con “ragazzino”. Lo schema è ABBA: rima incrociata.","Il terzo verso ha 9 sillabe grammaticali e due sinalefi. Le sillabe diventano 7: è un settenario."],"visual":{"type":"math","label":"Soluzione","lines":["mare A · lumicino B · ragazzino B · salpare A → ABBA","lo_os(1) ser(2) va_un(3) ra(4) gaz(5) zi(6) no(7)","ragazzìno è piana → settenario"]},"action":"Confronta schema e conteggio. Se una parte è diversa, rifai solo quel passo.","hint":"Anche gli altri versi di questa poesia sono settenari. Per un controllo in più, conta “che sogna di salpare”: lì le sinalefi mancano e le sillabe sono 7."},{"phase":"Controllo","title":"Un errore da riconoscere","text":["Guarda questo conteggio: “lo osserva un ragazzino” ha 9 sillabe, quindi è un novenario. L’errore è contare le sillabe grammaticali e fermarsi lì.","Mancano le due sinalefi: “lo_os” e “va_un”. Con le sinalefi le sillabe diventano 7."],"visual":{"type":"math","label":"Conteggio da correggere","lines":["Errore: lo(1) os(2) ser(3) va(4) un(5) ra(6) gaz(7) zi(8) no(9) → novenario","Correzione: lo_os(1) ser(2) va_un(3) ra(4) gaz(5) zi(6) no(7) → settenario"]},"action":"Ricontrolla i tuoi conteggi. Prima di scrivere il numero finale, cerca sempre le vocali che si incontrano tra due parole.","hint":"Leggi il verso ad alta voce, di seguito: “loosserva un ragazzino”. Senti che “lo” e “os” escono quasi insieme. Ogni sinalefe toglie 1 al conteggio."},{"phase":"Ripresa a casa","title":"Un livello alla volta","text":["A casa lavora un livello alla volta, sempre nello stesso ordine. Tieni vicine le tabelle degli schemi e dei nomi dei versi.","Alcuni insegnanti usano anche altre regole per contare. Se il tuo libro ne usa altre, segui quelle e chiedi un esempio."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Numera i versi e conta le strofe.","Cerchia le ultime parole e cerca la rima dalla vocale con l’accento.","Scrivi le lettere e il nome dello schema.","Dividi un verso in sillabe e cerca le sinalefi.","Guarda l’ultima parola e scrivi il nome del verso."]},"action":"Prendi la poesia del tuo libro e fai il primo livello: versi e strofe. Nel Menu trovi la scheda da stampare.","hint":"Per ripassare, il giorno dopo conta di nuovo un verso senza guardare le soluzioni. Poi controlla. Se sbagli sempre lo stesso passo, chiedi aiuto proprio su quello."}],"coach":{"goal":"Insegnare a separare tre livelli di analisi (versi e strofe, rime e schema, conteggio delle sillabe metriche) e a eseguirli in ordine. Il conteggio usa solo la sinalefe e la regola dell’ultima parola (piana, tronca, sdrucciola).","prepare":"Stampare le poesie a caratteri grandi, con spazio tra le sillabe se serve. Le poesie sono state scritte per l’esercitazione e hanno conteggi regolari. Dieresi, sineresi e dialefe non sono trattate: se l’insegnante le usa, seguire le sue convenzioni e un esempio del libro.","observe":"Chiedere “Da quale vocale parte la rima?” e “Dove si incontrano due vocali tra due parole?”. Distinguere l’errore di metodo (dimentica la sinalefe, confronta solo l’ultima lettera) dall’errore di divisione in sillabe o di conteggio: il secondo si controlla con le caselle numerate, senza ripartire da capo.","adaptations":[["Contare le sillabe — possibile difficoltà con discalculia","Perde il conto, ricomincia o salta un numero mentre segue il verso.","Far scrivere una casella numerata per ogni sillaba e segnare la sinalefe con un archetto dentro la stessa casella. Verificare se il numero finale coincide con le caselle."],["Dividere in sillabe — possibile difficoltà con dislessia","Divide male le parole con gruppi di vocali (“scuola”, “fiore”) o salta sillabe brevi.","Far battere le mani a ogni sillaba e leggere il verso ad alta voce prima di scriverlo. Verificare se la divisione è corretta quando lo studente la dice a voce."],["Riconoscere le rime — difficoltà trasversale","Confronta solo l’ultima lettera e assegna la stessa lettera a parole che non rimano.","Far pronunciare lentamente la parola e sottolineare la parte dalla vocale accentata, con un colore per ogni suono. Osservare se lo schema esce corretto senza aiuto nella poesia successiva."]],"sources":["ies2007","w3c-coga","aiddsa"],"checks":"Conteggi verificati con Python a partire dalla divisione in sillabe: “Sopra il tetto della scuola” 9 − 1 sinalefe = 8; gli altri versi della rondine 8; “Quando il sole se ne va” 8 − 1 + 1 (tronca) = 8; “Corre un gatto sopra il tavolo” 11 − 2 − 1 (sdrucciola) = 8; “Quando arriva primavera” 9 − 1 = 8 (tutta la strofa in ottonari); “lo osserva un ragazzino” 9 − 2 = 7 (tutta la strofa in settenari). Rime controllate dalla vocale tonica: -ola, -ile, -era, -ore, -are, -ino; “casa”/“sera” non rimano."},"print":{"modelTitle":"Esempio commentato: la rondine","visual":{"type":"quote","label":"Poesia","text":"Sopra il tetto della scuola   A\nuna rondine che vola   A\n\nfa tre giri sul cortile   B\ne poi torna al campanile.   B"},"model":["1. Versi e strofe: 4 versi, 2 strofe (la riga vuota le separa).","2. Rime dalla vocale con l’accento: scuòla / vòla (-ola), cortìle / campanìle (-ile).","3. Schema: AABB, rima baciata. Altri schemi: ABAB alternata, ABBA incrociata.","4. Sillabe grammaticali del primo verso: So-pra-il-tet-to-del-la-scuo-la = 9.","5. Sinalefe: pra_il diventa una sillaba sola → 8. Ultima parola piana (scuòla) → 8: ottonario.","Parola tronca (va): aggiungi 1. Parola sdrucciola (tàvolo): togli 1."],"practice":[["Prova guidata — primavera","Quando arriva primavera\nnel giardino nasce un fiore:\napre i petali di sera\ne regala un bel colore.\nConta versi e strofe, scrivi lo schema delle rime e il suo nome. Conta le sillabe di “Quando arriva primavera”."],["Compito nuovo — la sera al mare","La sera, in riva al mare,\nsi accende un lumicino:\nlo osserva un ragazzino\nche sogna di salpare.\nConta versi e strofe, scrivi lo schema e il suo nome. Conta le sillabe di “lo osserva un ragazzino”."]],"answers":["Primavera: 4 versi, 1 strofa; ABAB, rima alternata. Quan-do_ar-ri-va-pri-ma-ve-ra: 9 − 1 sinalefe = 8, parola piana → ottonario.","Sera al mare: 4 versi, 1 strofa; ABBA, rima incrociata. lo_os-ser-va_un-ra-gaz-zi-no: 9 − 2 sinalefi = 7, parola piana → settenario.","Se il conteggio è diverso, controlla in ordine: divisione in sillabe, sinalefi, ultima parola."],"home":["Numera i versi e conta le strofe.","Cerca le rime dalla vocale con l’accento e scrivi lo schema con le lettere.","Dividi il verso in sillabe e segna le sinalefi.","Guarda l’ultima parola (piana, tronca, sdrucciola) e scrivi il nome del verso."]},"maps":{},"kind":"task","subject":"Italiano","area":"Poesia"},{"id":"M02-04","title":"Riconoscere le figure retoriche","intro":"Riconosci alcune figure retoriche in una poesia e spiega che effetto producono.","slides":[{"phase":"Preparazione","title":"Parole usate in modo speciale","text":["Nelle poesie le parole sono spesso usate in modo speciale. Servono a creare un’immagine, un suono o un’emozione. Questi modi speciali si chiamano figure retoriche.","Per ogni figura farai tre cose: trovi le parole, dai il nome, spieghi l’effetto. L’effetto è ciò che la figura ti fa immaginare o sentire."],"visual":{"type":"list","label":"Prepara","items":["La poesia da analizzare","Una matita e un evidenziatore","Un foglio per una tabella di tre colonne"]},"action":"Disegna sul foglio una tabella di tre colonne. In alto scrivi: Parole, Figura, Effetto.","hint":"La tabella ti aiuta ad andare oltre il nome. Dire “è una metafora” è solo l’inizio: servono anche le parole precise e che cosa ti fanno immaginare."},{"phase":"Preparazione","title":"Succede davvero?","text":["Una frase letterale dice le cose come sono: “Il vento soffia forte”. Una frase figurata usa un’immagine: “Il vento urla”. Il vento è aria e non ha una voce. La frase però ci fa sentire un rumore forte e spaventoso.","Per trovare le figure, fai questa domanda a ogni frase: succede davvero?"],"visual":{"type":"table","label":"Letterale o figurata?","columns":["Frase","Succede davvero?"],"rows":[["Il vento soffia forte.","Sì: è letterale."],["Il vento urla.","No: è figurata."]]},"action":"Leggi le due frasi. Poi inventa a voce una frase letterale e una figurata sul mare.","hint":"Un esempio sul mare. Letterale: “Il mare è mosso”. Figurata: “Il mare è arrabbiato”. Il mare non può arrabbiarsi: l’immagine ci fa vedere onde forti e scure."},{"phase":"Preparazione","title":"Tre figure da conoscere","text":["Ecco tre figure molto usate. Tutte e tre mettono vicine due cose diverse. Cambia il modo in cui lo fanno.","Guarda bene la parola “come”: la trovi solo nella similitudine."],"visual":{"type":"table","label":"Il promemoria delle figure","columns":["Figura","Che cosa fa","Esempio"],"rows":[["Similitudine","confronta due cose con “come”","“dura come una pietra”"],["Metafora","chiama una cosa con il nome di un’altra, senza “come”","“quel bambino è un fulmine”"],["Personificazione","fa fare a una cosa o a un animale azioni delle persone","“il vento urla”"]]},"action":"Copia le tre righe su un cartoncino o sul quaderno. Ti serviranno come promemoria.","hint":"La metafora è come una similitudine accorciata. “Veloce come un fulmine” diventa “è un fulmine”: la parola “come” sparisce e le due cose diventano una sola."},{"phase":"Esempio spiegato","title":"Leggiamo e cerchiamo le parole speciali","text":["Ecco la poesia dell’esempio. Leggila e fai la domanda a ogni verso: succede davvero?","Un prato fatto di stoffa? Margherite che sono stelle? Un sole che ride? Sono cose impossibili nella realtà. Queste sono le parole da analizzare."],"visual":{"type":"quote","label":"Poesia","text":"Il prato è un tappeto verde\ndove le margherite,\nbianche come stelle,\nspuntano qua e là.\nIl sole ride sulle foglie."},"action":"Leggi la poesia. Sottolinea le tre espressioni: “è un tappeto verde”, “bianche come stelle”, “ride”.","hint":"“Spuntano qua e là” invece succede davvero: i fiori spuntano dal terreno. Per questo resta senza sottolineatura. Le figure di questa poesia nascono da un’immagine diversa dalla realtà."},{"phase":"Esempio spiegato","title":"“Bianche come stelle”: una similitudine","text":["Qui ci sono due cose confrontate: le margherite e le stelle. C’è la parola “come”: è una similitudine.","L’effetto: le margherite sembrano piccole luci bianche sparse nel prato, come le stelle nel cielo."],"visual":{"type":"table","label":"La tabella: prima riga","columns":["Parole","Figura","Effetto"],"rows":[["“bianche come stelle”","similitudine","piccole luci bianche sparse nel prato"]]},"action":"Scrivi la prima riga nella tua tabella: le parole tra virgolette, il nome e l’effetto.","hint":"Per trovare l’effetto, chiediti: che cosa hanno in comune le due cose? Margherite e stelle sono piccole, chiare e ce ne sono tante. Questa somiglianza crea l’effetto."},{"phase":"Esempio spiegato","title":"“Il prato è un tappeto”: una metafora","text":["Anche qui ci sono due cose: il prato e il tappeto. Però manca “come”: il prato viene chiamato tappeto. È una metafora.","L’effetto: il prato sembra morbido, fitto e uniforme, come un tappeto steso a terra."],"visual":{"type":"table","label":"La tabella: seconda riga","columns":["Parole","Figura","Effetto"],"rows":[["“bianche come stelle”","similitudine","piccole luci bianche sparse nel prato"],["“Il prato è un tappeto verde”","metafora","un prato morbido, fitto e uniforme"]]},"action":"Aggiungi la seconda riga nella tua tabella.","hint":"Prova a rimettere “come”: “Il prato è come un tappeto verde”. Così diventa una similitudine. Nella poesia “come” manca: per questo è una metafora."},{"phase":"Esempio spiegato","title":"“Il sole ride”: una personificazione","text":["Ridere è un’azione delle persone. Qui la fa il sole: è una personificazione.","L’effetto: la luce del sole sembra allegra e calda. Tutta la scena diventa gioiosa."],"visual":{"type":"table","label":"La tabella completa","columns":["Parole","Figura","Effetto"],"rows":[["“bianche come stelle”","similitudine","piccole luci bianche sparse nel prato"],["“Il prato è un tappeto verde”","metafora","un prato morbido, fitto e uniforme"],["“Il sole ride”","personificazione","una luce allegra e calda"]]},"action":"Aggiungi la terza riga. Ora la tua tabella è completa: tre espressioni, tre nomi, tre effetti.","hint":"Per riconoscere una personificazione, chiediti: chi fa di solito questa azione? Se la risposta è “una persona” e nel testo la fa una cosa, è una personificazione."},{"phase":"Esempio spiegato","title":"Altre figure: suoni e ripetizioni","text":["Alcune figure lavorano sul suono o sulla ripetizione. Il metodo è lo stesso: trovi le parole, dai il nome, spieghi l’effetto.","Per queste figure, leggere ad alta voce aiuta molto."],"visual":{"type":"table","label":"Altre tre figure","columns":["Figura","Che cosa fa","Esempio"],"rows":[["Onomatopea","imita un suono","“chiù”, il verso dell’assiuolo, un uccello notturno, in una poesia di Pascoli"],["Allitterazione","ripete lo stesso suono in parole vicine","“il vento vola via veloce”"],["Anafora","ripete la stessa parola all’inizio di più versi","“Ogni mattina…” / “Ogni sera…”"]]},"action":"Leggi a voce gli esempi. In quale senti un suono imitato? In quale un suono che torna? In quale una parola ripetuta all’inizio?","hint":"Onomatopea: parole come “bum”, “tic tac”, “miao”. Allitterazione: senti la stessa lettera che torna, come la v. Anafora: guarda l’inizio dei versi, dove una parola si ripete."},{"phase":"Prova guidata","title":"Prova tu: trova le figure e dai il nome","text":["Ecco una nuova poesia. Ci sono tre figure: una similitudine, una metafora e una personificazione. Trovale e scrivile nella tabella con il loro nome."],"visual":{"type":"quote","label":"Poesia","text":"Le nuvole sono pecore bianche\nche pascolano nel cielo;\nla pioggia bussa alla finestra\ne il tuono rimbomba come un tamburo."},"action":"Prepara una tabella nuova. Per ora compila solo le colonne Parole e Figura.","hint":"Cerca prima la parola “come”. Poi una cosa chiamata con il nome di un’altra. Poi un’azione delle persone fatta da una cosa. “Rimbomba” vuol dire che fa un rumore forte, che risuona."},{"phase":"Controllo guidato","title":"Confronta parole e nomi","text":["“Come un tamburo” confronta il tuono con un tamburo usando “come”: è una similitudine. “Le nuvole sono pecore” chiama le nuvole con un altro nome: è una metafora. “Bussa” è un’azione delle persone: è una personificazione."],"visual":{"type":"table","label":"Soluzione","columns":["Parole","Figura"],"rows":[["“Le nuvole sono pecore bianche”","metafora"],["“la pioggia bussa alla finestra”","personificazione"],["“il tuono rimbomba come un tamburo”","similitudine"]]},"action":"Confronta con la tua tabella. Se un nome è diverso, rileggi nel promemoria la riga di quella figura.","hint":"“Pascolano” continua la metafora: le pecore pascolano, cioè mangiano l’erba nei prati. Pascolare è un’azione degli animali. Per questo è parte della metafora e non una personificazione."},{"phase":"Prova guidata","title":"Prova tu: spiega l’effetto","text":["Ora scrivi l’effetto di ogni figura. Chiediti: che cosa hanno in comune le due cose? Che cosa mi fa immaginare o sentire?"],"visual":{"type":"quote","label":"Poesia","text":"Le nuvole sono pecore bianche\nche pascolano nel cielo;\nla pioggia bussa alla finestra\ne il tuono rimbomba come un tamburo."},"action":"Completa la colonna Effetto per le tre righe. Bastano poche parole per riga.","hint":"Nuvole e pecore: che colore hanno? Come si muovono? Pioggia che bussa: che rumore fa sui vetri? Tuono e tamburo: che suono hanno in comune?"},{"phase":"Controllo guidato","title":"Confronta gli effetti","text":["Ecco alcuni effetti possibili. Le tue parole possono essere diverse. Controlla che ogni effetto nasca da qualcosa che le due cose hanno in comune."],"visual":{"type":"table","label":"Effetti possibili","columns":["Figura","Effetto possibile"],"rows":[["metafora: nuvole = pecore","nuvole bianche e soffici che si muovono piano"],["personificazione: la pioggia bussa","il rumore delle gocce sui vetri, come colpi leggeri"],["similitudine: come un tamburo","un rumore forte, profondo e ritmato"]]},"action":"Confronta i tuoi effetti. Se hai scritto solo “è bello”, aggiungi che cosa vedi o senti.","hint":"“È bello” è un giudizio. L’effetto invece dice che cosa la figura ti fa vedere o sentire: un colore, un suono, un movimento, un’emozione."},{"phase":"Compito nuovo","title":"Ora una poesia tutta da analizzare","text":["Ecco l’ultima poesia. Fai tutto da solo: trova le figure, dai il nome e scrivi l’effetto."],"visual":{"type":"quote","label":"Poesia","text":"Il treno è un serpente di ferro\nche attraversa la valle;\nle case, piccole come dadi,\nlo guardano passare in silenzio."},"action":"Compila una tabella nuova con tre righe. Vai avanti quando vuoi confrontare.","hint":"Ricorda le tre domande: c’è “come”? Una cosa ha il nome di un’altra? Una cosa fa un’azione delle persone? Fai le domande verso per verso."},{"phase":"Controllo","title":"Confronta la tua tabella","text":["Il treno è chiamato serpente: metafora. Le case sono piccole “come dadi”: similitudine. Le case “guardano”: personificazione.","Gli effetti possono avere parole diverse dalle tue. Contano le somiglianze tra le due cose."],"visual":{"type":"table","label":"Una soluzione possibile","columns":["Parole","Figura","Effetto possibile"],"rows":[["“Il treno è un serpente di ferro”","metafora","un treno lungo che avanza curvando"],["“piccole come dadi”","similitudine","case piccole e squadrate, viste da lontano"],["“lo guardano passare”","personificazione","le case sembrano spettatori fermi e silenziosi"]]},"action":"Confronta riga per riga. Correggi i nomi sbagliati e completa gli effetti troppo brevi.","hint":"Se hai trovato solo due figure, rileggi l’ultimo verso: chi “guarda”? Le case. Guardare è un’azione delle persone."},{"phase":"Controllo","title":"Un errore da riconoscere","text":["Guarda questa riga: “Il treno è un serpente di ferro → similitudine”. È un errore frequente: c’è un confronto, però manca la parola “come”.","Quando una cosa viene chiamata con il nome di un’altra, è una metafora."],"visual":{"type":"quote","label":"Riga da correggere","text":"Errore: “Il treno è un serpente di ferro” → similitudine\n\nCorrezione: “Il treno è un serpente di ferro” → metafora\n\nSarebbe una similitudine così: “Il treno è come un serpente”."},"action":"Rileggi la colonna Figura della tua tabella. Per ogni riga, cerca se c’è “come” e controlla il nome.","hint":"Attenzione: “come” fa una similitudine solo se confronta due cose. In “Come ti chiami?” c’è “come”, ma nessun confronto."},{"phase":"Ripresa a casa","title":"Usa la tabella sulle tue poesie","text":["A casa usa la tabella a tre colonne per ogni poesia. Tieni vicino il promemoria delle figure.","Cerca prima le immagini che non succedono davvero. Poi dai il nome e spiega l’effetto. Se una figura manca nel promemoria, cercala nel libro di testo."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Leggi e chiediti a ogni verso: succede davvero?","Sottolinea le parole speciali.","Dai il nome: c’è “come”? Un nome di un’altra cosa? Un’azione delle persone?","Scrivi l’effetto: che cosa vedi o senti?"]},"action":"Prendi la poesia del tuo compito e compila la tabella. Nel Menu trovi la scheda da stampare.","hint":"Se non sei sicuro del nome, scrivi comunque le parole e l’effetto. Poi chiedi all’insegnante il nome giusto. L’effetto è la parte più importante."}],"coach":{"goal":"Insegnare un metodo in tre passi (trovare le parole, dare il nome con una prova, spiegare l’effetto) su tre figure di significato: similitudine, metafora, personificazione. Onomatopea, allitterazione e anafora sono presentate in una sola schermata come estensione.","prepare":"Preparare il promemoria delle figure su un cartoncino. Le poesie sono state scritte per l’esercitazione; “chiù” è il verso dell’assiuolo nella poesia “L’assiuolo” di Giovanni Pascoli (raccolta Myricae). Per figure non trattate qui, usare la definizione del manuale in uso e un esempio verificato.","observe":"Chiedere “Quali parole ti fanno dire che è una metafora?” e “Che cosa hanno in comune le due cose?”. Distinguere l’errore di classificazione (similitudine e metafora scambiate) dalla difficoltà di spiegare l’effetto: nel secondo caso far descrivere a voce che cosa si immagina, prima di scrivere.","adaptations":[["Dare il nome alla figura — difficoltà trasversale","Confonde i nomi o usa la stessa etichetta per casi diversi.","Tenere il promemoria con un esempio per figura e far rispondere alle tre domande (“come”, nome di un’altra cosa, azione umana) prima di dire il nome. Verificare se sa motivare la scelta anche senza ricordare subito il termine."],["Trovare le figure nel testo — possibile difficoltà con dislessia","Legge lentamente e perde le espressioni figurate nel mezzo del verso.","Leggere la poesia ad alta voce o usare la sintesi vocale, poi far porre la domanda “Succede davvero?” un verso alla volta. Verificare se trova le figure dopo l’ascolto."],["Scrivere l’effetto — possibile difficoltà con disgrafia o disortografia","A voce descrive bene l’immagine, ma nella tabella scrive solo una parola o lascia vuoto.","Accettare l’effetto detto a voce e scritto dall’adulto, oppure parole chiave al posto delle frasi. Verificare se l’effetto indica un colore, un suono o un movimento."]],"sources":["ies2007","eef2025","w3c-coga","aiddsa"],"checks":"Definizioni controllate al livello della scuola secondaria di primo grado: similitudine (confronto introdotto da “come” o simili), metafora (sostituzione o identificazione senza “come”), personificazione (azioni o caratteristiche umane attribuite a cose o animali), onomatopea, allitterazione, anafora. Verificato che “chiù” è il verso dell’assiuolo nell’omonima poesia di Pascoli. In “pecore che pascolano” il verbo continua la metafora e non è una personificazione."},"print":{"modelTitle":"Esempio commentato: il prato","visual":{"type":"table","label":"La tabella completa","columns":["Parole","Figura","Effetto"],"rows":[["“bianche come stelle”","similitudine","piccole luci bianche sparse nel prato"],["“Il prato è un tappeto verde”","metafora","un prato morbido, fitto e uniforme"],["“Il sole ride”","personificazione","una luce allegra e calda"]]},"model":["Il prato è un tappeto verde / dove le margherite, / bianche come stelle, / spuntano qua e là. / Il sole ride sulle foglie.","1. A ogni verso chiedo: succede davvero? Sottolineo le espressioni impossibili nella realtà.","2. Do il nome con tre domande: c’è “come”? (similitudine) Una cosa ha il nome di un’altra? (metafora) Una cosa fa un’azione delle persone? (personificazione)","3. Scrivo l’effetto: che cosa hanno in comune le due cose? Che cosa vedo o sento?","Altre figure: onomatopea (imita un suono), allitterazione (ripete un suono), anafora (ripete una parola all’inizio dei versi)."],"practice":[["Prova guidata — le nuvole","Le nuvole sono pecore bianche\nche pascolano nel cielo;\nla pioggia bussa alla finestra\ne il tuono rimbomba come un tamburo.\nTrova una similitudine, una metafora e una personificazione. Scrivi parole, figura ed effetto."],["Compito nuovo — il treno","Il treno è un serpente di ferro\nche attraversa la valle;\nle case, piccole come dadi,\nlo guardano passare in silenzio.\nCompila la tabella: Parole, Figura, Effetto."]],"answers":["Nuvole: “Le nuvole sono pecore bianche” metafora (nuvole bianche e soffici); “la pioggia bussa” personificazione (colpi leggeri delle gocce); “rimbomba come un tamburo” similitudine (rumore forte e ritmato).","Treno: “Il treno è un serpente di ferro” metafora (lungo, avanza curvando); “piccole come dadi” similitudine (case piccole e squadrate); “lo guardano passare” personificazione (case come spettatori silenziosi).","Gli effetti possono avere altre parole: devono dire che cosa si vede o si sente."],"home":["A ogni verso chiediti: succede davvero?","Sottolinea le parole speciali.","Dai il nome con le tre domande del promemoria.","Scrivi l’effetto: un colore, un suono, un movimento, un’emozione."]},"maps":{},"kind":"task","subject":"Italiano","area":"Poesia"},{"id":"M02-05","title":"Immagini, tema ed emozion
