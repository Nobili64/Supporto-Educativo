è un’altra spiegazione? Forse Matteo è caduto in una pozzanghera.","Questa idea spiega il fango. Ma non spiega bene il freddo. La pioggia e il freddo spiegano tutti gli indizi insieme: è la conclusione più probabile."],"visual":{"type":"table","label":"Due spiegazioni a confronto","columns":["Spiegazione","Quali indizi spiega"],"rows":[["È caduto in una pozzanghera","Il fango, forse l’impermeabile"],["Fuori piove e fa freddo","Fango, impermeabile, stufa, mani"]]},"action":"Rileggi la tua conclusione. Chiediti se spiega tutti gli indizi della colonna di sinistra.","hint":"Fai come un detective. Scegli la spiegazione che va d’accordo con più indizi. Se due spiegazioni vanno bene allo stesso modo, scrivile tutte e due con “forse”."},{"phase":"Controllo dell’esempio","title":"Separa ciò che sai da ciò che inventi","text":["Una conclusione deve venire dagli indizi. Ci sono cose che il testo non dice e che nessun indizio fa capire. Quelle non vanno scritte.","Per esempio: “Matteo tornava da scuola”. Nessun indizio parla della scuola."],"visual":{"type":"list","label":"Il testo non lo dice","items":["Dove era stato Matteo","Che ora era","Quanto aveva piovuto"]},"action":"Rileggi la tua conclusione. Per ogni informazione, indica l’indizio da cui viene. Se non lo trovi, cancellala.","hint":"Domanda di controllo: “Quale parola del testo me lo fa pensare?”. Se rispondi “nessuna”, quella informazione l’hai immaginata tu."},{"phase":"Prova guidata","title":"Prova tu: come si sente Davide?","text":["Ora lavora tu su questo testo. Usa le due colonne: prima i dettagli del testo, poi che cosa ti fanno pensare. Alla fine scrivi la conclusione con “probabilmente” e “perché”."],"visual":{"type":"quote","label":"Testo e domanda","text":"Davide si avvicinò alla lista appesa sulla porta della palestra. Cercò il suo nome e lo lesse due volte. Poi alzò le braccia, fece un salto e corse ad abbracciare il suo amico Nicola.\n\nDomanda: Come si sente Davide, e perché?"},"action":"Scrivi almeno tre indizi nella colonna di sinistra e completa quella di destra. Poi scrivi la conclusione.","hint":"Guarda che cosa fa il corpo di Davide: braccia, salto, abbraccio. Poi pensa alla lista: Davide cerca il suo nome. Che cosa può voler dire trovarlo?"},{"phase":"Controllo guidato","title":"Confronta le tue colonne","text":["Ecco una soluzione possibile. L’emozione è abbastanza sicura: molti indizi mostrano gioia. Il motivo è meno sicuro: per questo scriviamo “forse”.","Il testo non dice per che cosa è la lista. Dice solo che è appesa alla palestra."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"alza le braccia, fa un salto → è felice\ncorre ad abbracciare l’amico → vuole festeggiare\ncerca il suo nome nella lista → il suo nome c’è\n\nConclusione: Probabilmente Davide è felice perché ha trovato il suo nome nella lista. Forse è stato scelto per una squadra."},"action":"Confronta con il tuo lavoro. Se hai scritto “è stato scelto per la squadra di calcio”, togli “di calcio”: nessun indizio lo dice.","hint":"“Lo lesse due volte” può far pensare che Davide quasi non ci credesse. Va bene aggiungerlo, con “forse”. È un’idea che viene da un indizio."},{"phase":"Compito nuovo","title":"Adesso da solo: che momento è?","text":["Leggi questo testo e rispondi alla domanda da solo. Usa le colonne, unisci gli indizi, cerca un’altra spiegazione. Alla fine controlla di non avere inventato niente."],"visual":{"type":"quote","label":"Compito nuovo","text":"La nonna spense la televisione e chiuse le persiane. Diede un bacio sulla fronte a Chiara e le disse: “Domani mattina ti sveglio io”. Poi spense la luce del corridoio.\n\nDomanda: In quale momento della giornata siamo? Che cosa sta per fare Chiara?"},"action":"Lavora sul foglio con le due colonne e scrivi la conclusione. Poi vai avanti per confrontare.","hint":"Le persiane sono le ante di legno o di metallo davanti alle finestre. Pensa a quando si chiudono, di solito. E a quando qualcuno dice “domani mattina ti sveglio io”."},{"phase":"Controllo","title":"Confronta la tua conclusione","text":["Tutti gli indizi portano alla sera e al momento di andare a dormire. Il più forte è la frase della nonna: parla di svegliarsi domani mattina."],"visual":{"type":"quote","label":"Una soluzione possibile","text":"spegne la televisione → la giornata finisce\nchiude le persiane → fuori è buio, o sta per esserlo\n“domani mattina ti sveglio io” → Chiara dormirà fino a domani\nspegne la luce → si va a letto\n\nConclusione: Probabilmente è sera e Chiara sta per andare a dormire."},"action":"Confronta le tue colonne e la tua conclusione. Controlla di aver usato almeno due indizi.","hint":"Se hai scritto “è notte”, va bene lo stesso: è vicino a “sera”. Conta che la conclusione si possa spiegare con gli indizi del testo."},{"phase":"Controllo","title":"Un errore da riconoscere: troppo preciso","text":["Una conclusione può andare oltre gli indizi. Per esempio: “Sono le dieci di sera e Chiara è stanca”. Nessun indizio dice l’ora. Nessun indizio dice che Chiara è stanca.","Una conclusione corretta dice solo ciò che gli indizi permettono di capire."],"visual":{"type":"quote","label":"Da correggere","text":"Troppo preciso: Sono le dieci di sera e Chiara è stanca.\n\nCorretto: Probabilmente è sera e Chiara sta per andare a dormire."},"action":"Rileggi la tua conclusione. Togli i dettagli che nessun indizio sostiene, come un’ora precisa.","hint":"Il testo non dice nemmeno se Chiara vive con la nonna o se è in visita. Quando un’informazione manca, puoi scrivere “Il testo non lo dice”. Anche questa è una risposta."},{"phase":"Ripresa a casa","title":"Usa gli indizi nei tuoi compiti","text":["Le domande sulle informazioni implicite usano spesso parole come “secondo te”, “che cosa prova”, “che cosa si capisce”.","Quando le trovi, usa le due colonne. Se non trovi indizi, segna la domanda e chiedi aiuto."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Leggi la domanda: chiede qualcosa che il testo non scrive?","Nella colonna “Nel testo” scrivi i dettagli utili.","Nella colonna “Mi fa pensare” scrivi che cosa suggerisce ognuno.","Scrivi la conclusione con “probabilmente” e “perché”.","Cerca un’altra spiegazione e togli ciò che hai inventato."]},"action":"Scegli un brano del tuo libro con una domanda di questo tipo e prova la sequenza. Nel Menu trovi la scheda da stampare.","hint":"A volte la risposta è scritta nel testo. Allora non servono gli indizi. Per queste domande c’è un altro percorso: “Rispondere alle domande di comprensione”."}],"coach":{"goal":"Insegnare a formulare un’inferenza separando i dati del testo dall’interpretazione: raccolta di almeno due indizi, conclusione graduata (“probabilmente”, “forse”), confronto con una spiegazione alternativa e controllo di ciò che il testo non permette di dire.","prepare":"Avere i testi visibili per tutto il lavoro. Preparare un foglio con due colonne già tracciate se la scrittura è faticosa. Chiarire il lessico che può bloccare l’inferenza (impermeabile, stufa, persiane) prima di chiedere la conclusione.","observe":"Per ogni conclusione chiedere “Quale parola del testo te lo fa pensare?”. Distinguere: indizio non visto (lettura), indizio visto ma non interpretato (conoscenze del mondo o lessico), conclusione corretta ma troppo precisa o con aggiunte. Le emozioni dei personaggi sono inferenze sul testo, non letture del ragazzo.","adaptations":[["Raccolta degli indizi — possibile difficoltà con dislessia","Il testo è letto con fatica e alcuni dettagli utili non vengono notati.","Leggere il testo ad alta voce o con la sintesi vocale; far sottolineare i dettagli mentre si ascolta. Verificare se la colonna “Nel testo” diventa più completa."],["Collegare gli indizi — difficoltà trasversale (memoria di lavoro)","Usa un solo indizio e ignora gli altri, oppure perde la domanda mentre ragiona.","Tenere la domanda scritta in alto e collegare con frecce le righe delle due colonne. Osservare se la conclusione cita più dettagli."],["Scrittura delle colonne — possibile difficoltà con disgrafia","Il ragionamento orale è corretto, ma la tabella scritta resta incompleta.","Accettare le colonne dette a voce o compilate dall’adulto sotto dettatura; chiedere per scritto solo la conclusione. Valutare il ragionamento separatamente dalla scrittura."]],"sources":["ies2007","eef2025","w3c-coga","aiddsa"],"checks":"Testi originali. Verificato che ogni conclusione delle soluzioni sia sostenuta da almeno due indizi presenti nel testo e che gli esempi di errore contengano informazioni non ricavabili."},"print":{"modelTitle":"Indizi e conclusione — esempio","visual":{"type":"table","label":"Le due colonne","columns":["Nel testo","Mi fa pensare"],"rows":[["stivali pieni di fango","il terreno era bagnato"],["impermeabile che gocciolava","l’acqua cadeva dal cielo"],["si sedette vicino alla stufa","voleva scaldarsi"],["si strofinò le mani","aveva le mani fredde"]]},"model":["Matteo entrò in casa e lasciò sulla porta gli stivali pieni di fango. Appese l’impermeabile, che gocciolava sul pavimento. Poi si sedette vicino alla stufa e si strofinò le mani.","Domanda: Com’era il tempo fuori?","1. Nella colonna “Nel testo” scrivo solo i dettagli scritti.","2. Nella colonna “Mi fa pensare” scrivo che cosa suggerisce ogni dettaglio.","3. Conclusione: Probabilmente fuori pioveva e faceva freddo, perché Matteo aveva gli stivali pieni di fango e l’impermeabile bagnato, e si scaldò vicino alla stufa.","4. Altra spiegazione: una pozzanghera spiega il fango, ma non il freddo.","5. Il testo non dice dove era stato Matteo né che ora era."],"practice":[["Prova guidata","Davide si avvicinò alla lista appesa sulla porta della palestra. Cercò il suo nome e lo lesse due volte. Poi alzò le braccia, fece un salto e corse ad abbracciare il suo amico Nicola.\nDomanda: Come si sente Davide, e perché?\nUsa le due colonne, poi scrivi la conclusione con “probabilmente” e “perché”."],["Compito nuovo","La nonna spense la televisione e chiuse le persiane. Diede un bacio sulla fronte a Chiara e le disse: “Domani mattina ti sveglio io”. Poi spense la luce del corridoio.\nDomanda: In quale momento della giornata siamo? Che cosa sta per fare Chiara?"]],"answers":["Prova guidata: Probabilmente Davide è felice perché ha trovato il suo nome nella lista. Forse è stato scelto per una squadra. Indizi: alza le braccia, salta, abbraccia l’amico, cerca il suo nome.","Compito nuovo: Probabilmente è sera e Chiara sta per andare a dormire. Indizi: televisione spenta, persiane chiuse, “domani mattina ti sveglio io”, luce spenta.","Da togliere: un’ora precisa, “Chiara è stanca”, lo sport della squadra di Davide. Nessun indizio li sostiene."],"home":["Controlla se la domanda chiede qualcosa che il testo non scrive.","Scrivi i dettagli nella colonna “Nel testo”.","Scrivi che cosa suggerisce ognuno nella colonna “Mi fa pensare”.","Scrivi la conclusione con “probabilmente” e “perché”.","Cerca un’altra spiegazione e togli ciò che hai inventato."]},"maps":{},"kind":"task","subject":"Italiano","area":"Antologia e comprensione"},{"id":"M01-06","title":"Analizzare un racconto","intro":"Trova chi racconta, i personaggi, il luogo, il tempo e come cambia la storia.","slides":[{"phase":"Preparazione","title":"Analizzare vuol dire guardare le parti","text":["Analizzare un racconto vuol dire dividerlo in parti, per capire come è fatto. Cercherai quattro cose: chi racconta, chi agisce, dove e quando, come cambia la storia.","Per ogni risposta scriverai una prova: le parole del testo che la mostrano."],"visual":{"type":"table","label":"La griglia da preparare","columns":["Elemento","Nel racconto","Prova"],"rows":[["Narratore","",""],["Personaggi","",""],["Luogo","",""],["Tempo","",""],["Situazione iniziale","",""],["Problema","",""],["Soluzione e finale","",""]]},"action":"Disegna sul foglio questa griglia, con sette righe. Se disegnarla è faticoso, stampala dal Menu.","hint":"La prova serve quando qualcuno ti chiede: “Come lo sai?”. Tu indichi le parole del testo. Così la tua risposta non è un’impressione."},{"phase":"Preparazione","title":"Leggi il racconto dell’esempio","text":["Prima di analizzare, leggi tutto il racconto. Cerca di capire che cosa succede, senza pensare ancora alla griglia."],"visual":{"type":"quote","label":"Il racconto dell’esempio","text":"Quella domenica di ottobre andai al lago con mio zio Franco. Volevamo provare la sua canoa nuova. A metà del lago si alzò un vento forte e la canoa cominciò a girare su se stessa. Io avevo paura. Lo zio mi disse di remare insieme a lui, piano e allo stesso ritmo. Dopo dieci minuti arrivammo a riva. Lo zio rideva; io tremavo ancora un po’, ma ero fiero di me."},"action":"Leggi o ascolta il racconto. Poi di’ a voce, in una frase, che cosa succede.","hint":"Una canoa è una barca stretta e leggera. Si muove con i remi, cioè bastoni con una parte piatta che spinge l’acqua. Essere fiero vuol dire essere contento di ciò che hai fatto."},{"phase":"Esempio spiegato","title":"Chi racconta la storia?","text":["Il narratore è la voce che racconta la storia. Per trovarlo, guarda i verbi.","In questo racconto ci sono verbi come “andai”, “avevo paura”, “arrivammo”. Sono verbi in prima persona: chi parla dice “io” o “noi”. Quindi chi racconta ha fatto queste cose."],"visual":{"type":"quote","label":"Verbi da osservare","text":"andai al lago\nvolevamo provare\nio avevo paura\narrivammo a riva\nero fiero di me"},"action":"Sottolinea nel testo i verbi con “io” o “noi”. Ne trovi almeno quattro.","hint":"Prova a mettere “io” o “noi” davanti al verbo: “io andai”, “noi arrivammo”. Se la frase funziona, il verbo è in prima persona."},{"phase":"Esempio spiegato","title":"Narratore interno o esterno","text":["Il narratore interno è un personaggio della storia: racconta ciò che ha vissuto e usa “io”. Il narratore esterno non è un personaggio: racconta ciò che fanno gli altri e usa “lui”, “lei”, “loro”.","Qui chi racconta è sul lago, ha paura e rema. È un narratore interno."],"visual":{"type":"table","label":"Due tipi di narratore","columns":["Narratore","Esempio"],"rows":[["Interno: è nella storia","Andai al lago."],["Esterno: è fuori dalla storia","Andò al lago."]]},"action":"Nella griglia scrivi: Narratore — interno. Prova — “andai”, “io avevo paura”.","hint":"Chiediti: chi racconta era sul lago? Sì: ha remato e ha avuto paura. Allora fa parte della storia. Il narratore esterno, invece, guarda la storia da fuori, come una telecamera."},{"phase":"Esempio spiegato","title":"I personaggi","text":["I personaggi sono le persone, o gli animali, che fanno qualcosa nella storia. Il protagonista è il personaggio principale: la storia parla soprattutto di lui.","Qui il protagonista è il narratore. Non ha un nome: dice solo “io”. Lo zio Franco lo aiuta."],"visual":{"type":"table","label":"I personaggi del racconto","columns":["Personaggio","Che cosa fa"],"rows":[["Il narratore (io)","Protagonista: ha paura, rema, alla fine è fiero"],["Lo zio Franco","Aiuta: dice di remare insieme"]]},"action":"Nella griglia scrivi i due personaggi. Come prova scrivi: “mio zio Franco” e “mi disse di remare insieme”.","hint":"Il protagonista è spesso il personaggio che ha il problema e che cambia durante la storia. Qui il narratore ha paura all’inizio e alla fine è fiero."},{"phase":"Esempio spiegato","title":"Il luogo e il tempo della storia","text":["Il luogo è dove succede la storia. Qui è un lago.","Il tempo della storia è quando succede: un giorno, una stagione, un’ora. Qui è una domenica di ottobre. Attenzione: non è il tempo del verbo, come passato o presente."],"visual":{"type":"quote","label":"Dove e quando","text":"Quella domenica di ottobre → tempo\nandai al lago → luogo"},"action":"Nella griglia scrivi luogo e tempo. Come prova copia le parole del testo: “al lago” e “quella domenica di ottobre”.","hint":"Per il luogo chiediti “Dove?”. Per il tempo chiediti “Quando?”. Spesso le risposte sono nella prima frase del racconto."},{"phase":"Esempio spiegato","title":"Situazione iniziale e problema","text":["La situazione iniziale è com’è tutto all’inizio. Qui lo zio e il narratore vanno a provare la canoa.","Il problema è il fatto che cambia la situazione e crea una difficoltà. Qui arriva un vento forte e la canoa gira su se stessa."],"visual":{"type":"quote","label":"Dove comincia il problema","text":"Volevamo provare la sua canoa nuova. | A metà del lago si alzò un vento forte e la canoa cominciò a girare su se stessa."},"action":"Nel testo traccia una linea dove comincia il problema, prima di “A metà del lago”. Poi completa le due righe della griglia.","hint":"Il tuo libro può usare altri nomi: “esordio” per l’inizio, “complicazione” per il problema. Sono le stesse parti della storia."},{"phase":"Esempio spiegato","title":"Soluzione e finale","text":["La soluzione è ciò che i personaggi fanno per risolvere il problema. Qui remano insieme, piano e allo stesso ritmo.","Il finale dice come va a finire. Arrivano a riva e il narratore è fiero di sé. Il finale mostra anche come è cambiato il protagonista."],"visual":{"type":"quote","label":"Soluzione e finale","text":"Lo zio mi disse di remare insieme a lui, piano e allo stesso ritmo. → soluzione\n\nDopo dieci minuti arrivammo a riva. […] ero fiero di me. → finale"},"action":"Completa l’ultima riga della griglia. Come prova copia “remare insieme” e “arrivammo a riva”.","hint":"Per trovare la soluzione chiediti: che cosa fanno i personaggi contro il problema? Per il finale chiediti: com’è la situazione nell’ultima frase?"},{"phase":"Controllo dell’esempio","title":"La griglia completa","text":["Ecco la griglia completa del racconto. Ogni riga ha una risposta e una prova presa dal testo."],"visual":{"type":"table","label":"Griglia del racconto sul lago","columns":["Elemento","Nel racconto","Prova"],"rows":[["Narratore","Interno","“andai”, “io avevo paura”"],["Personaggi","Il narratore (protagonista), lo zio Franco","“mio zio Franco”"],["Luogo","Un lago","“al lago”"],["Tempo","Una domenica di ottobre","“quella domenica di ottobre”"],["Situazione iniziale","Vanno a provare la canoa","“provare la sua canoa nuova”"],["Problema","Il vento fa girare la canoa","“si alzò un vento forte”"],["Soluzione e finale","Remano insieme e arrivano a riva","“arrivammo a riva”"]]},"action":"Confronta la tua griglia riga per riga. Correggi con un colore diverso.","hint":"Le tue parole possono essere diverse. Controlla soprattutto che ogni prova sia copiata dal testo e che dimostri davvero la risposta della sua riga."},{"phase":"Prova guidata","title":"Prova tu: narratore e personaggi","text":["Ora analizza un racconto nuovo. Per cominciare, prepara una griglia vuota e completa solo due righe: narratore e personaggi.","Sottolinea i verbi e chiediti: chi racconta fa parte della storia?"],"visual":{"type":"quote","label":"Il tuo racconto","text":"Alle sei di sera il mercato stava chiudendo. Amira metteva le mele nelle cassette quando vide un bambino piangere vicino al suo banco. Il bambino aveva perso la mamma. Amira lo fece sedere su una cassa e gli diede una mela. Poi chiamò il vigile del mercato. Pochi minuti dopo la mamma arrivò di corsa e abbracciò il bambino."},"action":"Scrivi nella griglia narratore e personaggi, con le prove. Poi vai avanti per controllare.","hint":"Prova a mettere “io” davanti ai verbi: “io metteva”? “io vide”? Non funziona. Prova con “lei”: “lei metteva”, “lei vide”. Che cosa ti dice questo sul narratore?"},{"phase":"Controllo guidato","title":"Confronta narratore e personaggi","text":["I verbi sono in terza persona: “metteva”, “vide”, “chiamò”. Chi racconta non è un personaggio: è un narratore esterno.","La protagonista è Amira: la storia segue lei. Gli altri personaggi sono il bambino, il vigile e la mamma."],"visual":{"type":"table","label":"Prime due righe","columns":["Elemento","Nel racconto","Prova"],"rows":[["Narratore","Esterno","“Amira metteva”, “vide”, “chiamò”"],["Personaggi","Amira (protagonista), il bambino, il vigile, la mamma","“Amira lo fece sedere”"]]},"action":"Confronta le tue due righe. Se hai scritto “interno”, guarda di nuovo i verbi e correggi.","hint":"Il bambino ha il problema, ma è Amira che agisce dall’inizio alla fine. Per questo la protagonista è lei. Se hai scelto il bambino, controlla chi fa più azioni."},{"phase":"Prova guidata","title":"Completa luogo, tempo e storia","text":["Ora completa le altre cinque righe della griglia. Comincia da luogo e tempo. Poi passa alla storia: situazione iniziale, problema, soluzione e finale.","Nel testo traccia una linea dove comincia il problema."],"visual":{"type":"quote","label":"Il tuo racconto","text":"Alle sei di sera il mercato stava chiudendo. Amira metteva le mele nelle cassette quando vide un bambino piangere vicino al suo banco. Il bambino aveva perso la mamma. Amira lo fece sedere su una cassa e gli diede una mela. Poi chiamò il vigile del mercato. Pochi minuti dopo la mamma arrivò di corsa e abbracciò il bambino."},"action":"Completa le cinque righe con le prove. Poi vai avanti per confrontare.","hint":"Il tempo e il luogo sono nella prima frase. Il problema comincia con la parola “quando”. Per la soluzione chiediti: che cosa fa Amira per il bambino?"},{"phase":"Controllo guidato","title":"Confronta le altre righe","text":["Ecco le righe che mancavano. La soluzione ha due azioni di Amira: consola il bambino e chiama il vigile."],"visual":{"type":"table","label":"Le altre righe","columns":["Elemento","Nel racconto","Prova"],"rows":[["Luogo","Il mercato","“il mercato stava chiudendo”"],["Tempo","Alle sei di sera","“Alle sei di sera”"],["Situazione iniziale","Amira mette via le mele","“metteva le mele nelle cassette”"],["Problema","Un bambino ha perso la mamma","“aveva perso la mamma”"],["Soluzione e finale","Amira lo aiuta e chiama il vigile; arriva la mamma","“la mamma arrivò di corsa”"]]},"action":"Confronta riga per riga. Se nella soluzione manca il vigile, aggiungilo: è l’azione che fa arrivare la mamma.","hint":"Se hai scritto “Problema: il mercato chiude”, guarda bene: è la situazione all’inizio. La difficoltà comincia quando Amira vede il bambino che piange."},{"phase":"Compito nuovo","title":"Adesso analizza da solo","text":["Ecco un racconto nuovo. Prepara una griglia vuota e completa tutte le sette righe da solo, con le prove.","Una ricerca è un lavoro di scuola in cui raccogli informazioni su un argomento."],"visual":{"type":"quote","label":"Compito nuovo","text":"Ieri pomeriggio, in biblioteca, cercavo un libro sui castelli per una ricerca. Sullo scaffale di storia non c’era. Lo chiesi alla bibliotecaria, la signora Bruna. Lei controllò al computer: il libro non era in prestito, quindi doveva essere lì. Lo cercammo insieme e lo trovammo tra i libri di cucina! Tornai a casa contenta, con il libro nello zaino."},"action":"Completa la griglia sul foglio. Poi vai avanti per confrontare.","hint":"Comincia sempre dai verbi: chi dice “cercavo”, “chiesi”, “tornai”? Poi passa alle altre righe, una alla volta."},{"phase":"Controllo","title":"Confronta la tua griglia","text":["Ecco una griglia possibile. La parola “contenta” fa capire che chi racconta è una ragazza."],"visual":{"type":"table","label":"Griglia del racconto in biblioteca","columns":["Elemento","Nel racconto","Prova"],"rows":[["Narratore","Interno","“cercavo”, “chiesi”, “tornai”"],["Personaggi","La narratrice (protagonista), la signora Bruna","“la bibliotecaria, la signora Bruna”"],["Luogo","La biblioteca","“in biblioteca”"],["Tempo","Ieri pomeriggio","“Ieri pomeriggio”"],["Situazione iniziale","Cerca un libro sui castelli","“cercavo un libro sui castelli”"],["Problema","Il libro non è sullo scaffale","“non c’era”"],["Soluzione e finale","Lo trova con la bibliotecaria e torna a casa contenta","“lo trovammo tra i libri di cucina”"]]},"action":"Confronta la tua griglia riga per riga. Correggi le righe diverse con un colore diverso.","hint":"Nella situazione iniziale puoi aggiungere “per una ricerca”. Dice perché lei cerca il libro. Se la tua prova è diversa, va bene. Controlla solo che sia nel testo e che mostri la risposta."},{"phase":"Controllo","title":"Un errore da riconoscere: il nome non basta","text":["Un errore frequente è pensare che il narratore sia il personaggio con un nome. Per esempio: “Il narratore è la signora Bruna”.","La signora Bruna è un personaggio, ma non racconta. Chi racconta dice “io”: “cercavo”, “chiesi”. Il narratore interno, a volte, non dice mai il suo nome."],"visual":{"type":"quote","label":"Da correggere","text":"Sbagliato: Il narratore è la signora Bruna, perché ha un nome.\n\nCorretto: Il narratore è interno: è la ragazza che dice “cercavo” e “chiesi”."},"action":"Rileggi la riga del narratore nelle tue griglie. Controlla che la prova sia un verbo, non un nome.","hint":"Per trovare il narratore non cercare i nomi: cerca chi racconta. Se chi racconta usa sempre “lui” o “lei”, il narratore è esterno. Attenzione: nelle battute tra virgolette i personaggi possono dire “io”."},{"phase":"Ripresa a casa","title":"Usa la griglia sui racconti del libro","text":["A casa usa la griglia con i racconti della tua antologia, il libro di lettura di italiano. Comincia da racconti brevi.","Se un racconto è lungo, prima dividilo in parti. Poi cerca il problema e il finale. Se una riga resta vuota, segnala con un punto interrogativo e chiedi aiuto."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Leggi tutto il racconto e di’ che cosa succede.","Narratore: guarda i verbi, “io” o “lui, lei”.","Personaggi: chi agisce, chi è il protagonista.","Luogo e tempo: dove e quando.","Situazione iniziale, problema, soluzione e finale, con le prove."]},"action":"Scegli un racconto breve del tuo libro e completa la griglia. Nel Menu trovi la scheda da stampare con la griglia vuota.","hint":"Per dividere un racconto lungo in parti, c’è il percorso “Dividere un racconto in sequenze”. Una griglia completa ti aiuta anche a scrivere il riassunto."}],"coach":{"goal":"Insegnare a riconoscere narratore (interno/esterno), personaggi e protagonista, luogo e tempo della storia, situazione iniziale, problema, soluzione e finale, sempre con una prova testuale. Il percorso non tratta focalizzazione, analessi o fabula e intreccio: introdurli solo se richiesti dalla classe.","prepare":"Stampare la griglia vuota a tre colonne e i tre racconti. Verificare quali termini usa il libro di testo (per esempio esordio, complicazione, scioglimento) e collegarli alle righe della griglia.","observe":"Chiedere “Come lo sai?” per ogni riga: la prova deve essere una parola del testo. Distinguere la confusione tra termini (luogo nella riga dei personaggi) dall’errore di lettura dei verbi (prima/terza persona). Osservare se il narratore viene identificato con il personaggio che ha un nome.","adaptations":[["Riconoscere la persona del verbo — possibile difficoltà con dislessia","Legge “andò” per “andai” o confonde le desinenze, e sbaglia il tipo di narratore.","Far leggere ad alta voce i verbi sottolineati e provare a premettere “io” o “lei”. Verificare se, con la lettura ad alta voce, la scelta del narratore diventa corretta."],["Compilare la griglia — difficoltà trasversale (organizzazione)","Le informazioni finiscono nella riga sbagliata o la griglia resta incompleta.","Lavorare una riga per volta, con una domanda guida per riga (Chi racconta? Chi agisce? Dove? Quando?). Osservare se nel compito nuovo le righe sono compilate correttamente."],["Copiare le prove — possibile difficoltà con disgrafia o disortografia","La copia delle prove richiede molto tempo e lo studente salta le righe successive.","Accettare la prova come sottolineatura numerata sul testo (1, 2, 3…) da richiamare nella griglia. Controllare la scelta della prova, non la qualità della copia."]],"sources":["ies2007","eef2025","w3c-coga","aiddsa"],"checks":"Testi originali. Verificate le definizioni scolastiche di narratore interno ed esterno e la persona dei verbi citati come prova (andai, avevo, arrivammo: prima persona; metteva, vide, chiamò: terza persona; cercavo, chiesi, tornai: prima persona)."},"print":{"modelTitle":"Griglia di analisi — esempio","visual":{"type":"table","label":"Griglia del racconto sul lago","columns":["Elemento","Nel racconto","Prova"],"rows":[["Narratore","Interno","“andai”, “io avevo paura”"],["Personaggi","Il narratore (protagonista), lo zio Franco","“mio zio Franco”"],["Luogo","Un lago","“al lago”"],["Tempo","Una domenica di ottobre","“quella domenica di ottobre”"],["Situazione iniziale","Vanno a provare la canoa","“provare la sua canoa nuova”"],["Problema","Il vento fa girare la canoa","“si alzò un vento forte”"],["Soluzione e finale","Remano insieme e arrivano a riva","“arrivammo a riva”"]]},"model":["Quella domenica di ottobre andai al lago con mio zio Franco. Volevamo provare la sua canoa nuova. A metà del lago si alzò un vento forte e la canoa cominciò a girare su se stessa. Io avevo paura. Lo zio mi disse di remare insieme a lui, piano e allo stesso ritmo. Dopo dieci minuti arrivammo a riva. Lo zio rideva; io tremavo ancora un po’, ma ero fiero di me.","1. Narratore: guardo i verbi. “Andai”, “avevo”: prima persona. Narratore interno.","2. Personaggi: il narratore è il protagonista; lo zio Franco lo aiuta.","3. Luogo e tempo: un lago, una domenica di ottobre.","4. Struttura: provano la canoa; il vento la fa girare; remano insieme e arrivano a riva."],"practice":[["Prova guidata","Alle sei di sera il mercato stava chiudendo. Amira metteva le mele nelle cassette quando vide un bambino piangere vicino al suo banco. Il bambino aveva perso la mamma. Amira lo fece sedere su una cassa e gli diede una mela. Poi chiamò il vigile del mercato. Pochi minuti dopo la mamma arrivò di corsa e abbracciò il bambino.\nCompleta la griglia: Narratore, Personaggi, Luogo, Tempo, Situazione iniziale, Problema, Soluzione e finale. Per ogni riga scrivi una prova."],["Compito nuovo","Ieri pomeriggio, in biblioteca, cercavo un libro sui castelli per una ricerca. Sullo scaffale di storia non c’era. Lo chiesi alla bibliotecaria, la signora Bruna. Lei controllò al computer: il libro non era in prestito, quindi doveva essere lì. Lo cercammo insieme e lo trovammo tra i libri di cucina! Tornai a casa contenta, con il libro nello zaino.\nCompleta la griglia con le prove."]],"answers":["Prova guidata: narratore esterno (“metteva”, “vide”, “chiamò”). Personaggi: Amira (protagonista), il bambino, il vigile, la mamma. Luogo: il mercato. Tempo: alle sei di sera. Inizio: Amira mette via le mele. Problema: un bambino ha perso la mamma. Soluzione e finale: Amira lo aiuta e chiama il vigile; arriva la mamma.","Compito nuovo: narratore interno (“cercavo”, “chiesi”, “tornai”). Personaggi: la narratrice (protagonista), la signora Bruna. Luogo: la biblioteca. Tempo: ieri pomeriggio. Inizio: cerca un libro sui castelli. Problema: il libro non è sullo scaffale. Soluzione e finale: lo trova con la bibliotecaria tra i libri di cucina e torna a casa contenta.","Il narratore si trova dai verbi, non dai nomi: la signora Bruna è un personaggio, non la narratrice."],"home":["Leggi tutto il racconto e di’ che cosa succede.","Guarda i verbi per trovare il narratore.","Scrivi personaggi, luogo e tempo.","Trova situazione iniziale, problema, soluzione e finale.","Per ogni riga scrivi una prova presa dal testo."]},"maps":{},"kind":"task","subject":"Italiano","area":"Antologia e comprensione"},{"id":"M01-07","title":"Dividere un racconto in sequenze","intro":"Trova dove cambia qualcosa nel racconto, dividilo in parti e dai un titolo a ogni parte.","slides":[{"phase":"Preparazione","title":"Un racconto è fatto di parti","text":["Una sequenza è una parte di un racconto che narra un momento della storia. Pensa alle scene di un film. Quando cambia il luogo, il tempo o arriva un personaggio, spesso comincia una scena nuova.","Imparerai a trovare dove comincia ogni sequenza e a darle un titolo."],"visual":{"type":"list","label":"Prepara","items":["Il racconto, stampato o sullo schermo","Una matita","Un foglio"]},"action":"Prepara il materiale. Scrivi in alto sul foglio: “Sequenze”.","hint":"Dividere in sequenze aiuta a capire e a ricordare la storia. Ogni sequenza diventa un passo della storia. Ti servirà anche per fare il riassunto."},{"phase":"Preparazione","title":"I segnali di cambiamento","text":["Alcune parole segnalano che qualcosa cambia nella storia. Si chiamano segnali di cambiamento. Spesso stanno all’inizio di una frase."],"visual":{"type":"table","label":"Che cosa cambia e con quali parole","columns":["Che cosa cambia","Parole-segnale"],"rows":[["Il tempo (T)","“la sera”, “il giorno dopo”, “dopo un’ora”"],["Il luogo (L)","“andò al parco”, “entrò in casa”"],["I personaggi (P)","“arrivò la nonna”, “incontrò un amico”"],["L’azione (A)","“allora decise di…”, “cominciò a…”"]]},"action":"Leggi la tabella. Poi trova il segnale in questa frase: “La mattina dopo, Sara uscì presto”. Che cosa cambia?","hint":"“La mattina dopo” risponde alla domanda “Quando?”. Quindi cambia il tempo. Per riconoscere un segnale, chiediti: dice quando, dove, chi arriva o che cosa si comincia a fare?"},{"phase":"Esempio spiegato","title":"Numera le frasi","text":["Per prima cosa numera le frasi del racconto. Così, dopo, potrai scrivere solo i numeri, senza ricopiare il testo.","Una frase finisce con il punto, il punto interrogativo o il punto esclamativo."],"visual":{"type":"quote","label":"Il racconto dell’esempio","text":"1. Martina voleva fare una sorpresa alla mamma per il suo compleanno.\n2. Dopo la scuola, aprì il salvadanaio e contò i soldi.\n3. Poi andò nel negozio di fiori vicino a casa.\n4. La fioraia le mostrò tulipani, rose e margherite.\n5. Martina scelse un mazzo di margherite gialle.\n6. La sera, quando la mamma tornò dal lavoro, Martina le diede i fiori.\n7. La mamma la abbracciò forte."},"action":"Leggi il racconto. Sul tuo testo scrivi un numero piccolo all’inizio di ogni frase, da 1 a 7.","hint":"Qui le frasi sono già numerate e vanno a capo. Nei libri, di solito, le frasi sono una dopo l’altra. Il numero ti aiuta a ritrovarle."},{"phase":"Esempio spiegato","title":"Cerca i segnali di cambiamento","text":["Ora cerca i segnali. Nella frase 3 Martina “andò nel negozio di fiori”: cambia il luogo.","Nella frase 6 c’è “La sera”: cambia il tempo. Nella stessa frase arriva la mamma: cambiano anche i personaggi."],"visual":{"type":"quote","label":"I segnali trovati","text":"3. Poi andò nel negozio di fiori vicino a casa. → L\n6. La sera, quando la mamma tornò dal lavoro, Martina le diede i fiori. → T, P"},"action":"Cerchia nel tuo testo “andò nel negozio” e “La sera”. Accanto scrivi le lettere: L per la frase 3, T e P per la frase 6.","hint":"Anche “Dopo la scuola”, nella frase 2, è un segnale di tempo. Ma la frase 1 non racconta un’azione: dice che cosa vuole Martina. Per questo le frasi 1 e 2 stanno bene insieme."},{"phase":"Esempio spiegato","title":"Traccia i confini delle sequenze","text":["Dove c’è un segnale forte, comincia una nuova sequenza. Tracciamo una linea prima della frase 3 e una prima della frase 6.","Così abbiamo tre sequenze. Controlla che ogni frase stia in una sequenza, senza saltarne nessuna."],"visual":{"type":"quote","label":"Le tre sequenze","text":"Sequenza 1: frasi 1 e 2 — a casa\nSequenza 2: frasi 3, 4 e 5 — nel negozio\nSequenza 3: frasi 6 e 7 — la sera, con la mamma"},"action":"Traccia le due linee nel testo. Sul foglio scrivi le tre sequenze con i numeri delle frasi.","hint":"Le frasi 3, 4 e 5 sono tutte nel negozio, con la fioraia. Il luogo resta lo stesso, quindi stanno nella stessa sequenza."},{"phase":"Esempio spiegato","title":"Dai un titolo a ogni sequenza","text":["Il titolo di una sequenza dice in poche parole che cosa succede di importante. Bastano da tre a cinque parole.","Il titolo deve distinguere una sequenza dalle altre. “Martina” non basta: Martina c’è in tutte."],"visual":{"type":"table","label":"Sequenze e titoli","columns":["Sequenza","Frasi","Titolo"],"rows":[["1","1-2","Martina prepara la sorpresa"],["2","3-5","La scelta dei fiori"],["3","6-7","Il regalo alla mamma"]]},"action":"Scrivi sul foglio un titolo accanto a ogni sequenza. Puoi usare questi o scegliere parole tue.","hint":"Chiediti: che cosa fa il personaggio in questa parte? Rispondi con poche parole. Per esempio, nella sequenza 2 Martina sceglie i fiori: “La scelta dei fiori”."},{"phase":"Controllo dell’esempio","title":"Leggi solo i titoli","text":["Per controllare il lavoro, leggi solo i titoli, nell’ordine. Se raccontano la storia dall’inizio alla fine, la divisione funziona.","Se un titolo è troppo generico, la storia non si capisce. Allora rendilo più preciso."],"visual":{"type":"list","label":"La storia nei titoli","items":["1. Martina prepara la sorpresa","2. La scelta dei fiori","3. Il regalo alla mamma"]},"action":"Leggi a voce i tuoi titoli. Poi racconta la storia usando solo i titoli, senza guardare il testo.","hint":"Generico vuol dire che va bene per tutto, come “La storia” o “Un fatto”. Preciso vuol dire che va bene solo per quella parte, come “La scelta dei fiori”."},{"phase":"Prova guidata","title":"Prova tu: numeri e segnali","text":["Ora lavora su un racconto nuovo. Prima numera le frasi. Poi cerca i segnali di cambiamento e scrivi accanto la lettera: T, L, P oppure A."],"visual":{"type":"quote","label":"Il tuo racconto","text":"1. Sabato mattina Leo e il papà prepararono le valigie.\n2. Caricarono la macchina e partirono per il mare.\n3. In autostrada trovarono una lunga coda.\n4. Dopo tre ore arrivarono all’albergo.\n5. Leo corse subito in spiaggia.\n6. L’acqua era fredda, ma lui fece il bagno lo stesso."},"action":"Cerchia i segnali nel testo e scrivi la lettera accanto. Poi vai avanti per controllare.","hint":"Cerca parole che rispondono a “Dove?” e a “Quando?”. Nelle frasi 3, 4 e 5 ce n’è almeno una."},{"phase":"Controllo guidato","title":"Confronta i segnali","text":["Ecco i segnali principali. Nella frase 4 ci sono due segnali: un tempo e un luogo."],"visual":{"type":"quote","label":"I segnali del racconto","text":"3. In autostrada → L\n4. Dopo tre ore → T; all’albergo → L\n5. in spiaggia → L"},"action":"Confronta i tuoi segnali. Aggiungi quelli che mancano. Se ne hai trovati altri, chiediti se dicono davvero quando, dove o chi.","hint":"Anche “Sabato mattina”, nella frase 1, è un segnale di tempo. Ma è l’inizio della storia: lì comincia sempre la prima sequenza."},{"phase":"Prova guidata","title":"Traccia i confini e scrivi i titoli","text":["Ora decidi dove cominciano le sequenze. Non ogni segnale apre una sequenza nuova. Tieni insieme le frasi che raccontano lo stesso momento.","Poi scrivi un titolo per ogni sequenza."],"visual":{"type":"quote","label":"Il tuo racconto","text":"1. Sabato mattina Leo e il papà prepararono le valigie.\n2. Caricarono la macchina e partirono per il mare.\n3. In autostrada trovarono una lunga coda.\n4. Dopo tre ore arrivarono all’albergo.\n5. Leo corse subito in spiaggia.\n6. L’acqua era fredda, ma lui fece il bagno lo stesso."},"action":"Traccia le linee nel testo. Sul foglio scrivi le sequenze con i numeri delle frasi e un titolo per ognuna.","hint":"Prova a pensare a tre momenti: la partenza, il viaggio, il mare. In quale momento metti la coda? E l’arrivo all’albergo?"},{"phase":"Controllo guidato","title":"Confronta sequenze e titoli","text":["Ecco una divisione possibile. Si possono fare anche altre divisioni, se sai spiegare perché. Per esempio, l’arrivo all’albergo può essere una sequenza da sola."],"visual":{"type":"table","label":"Una divisione possibile","columns":["Sequenza","Frasi","Titolo"],"rows":[["1","1-2","La partenza per il mare"],["2","3-4","Il viaggio con la coda"],["3","5-6","Il primo bagno di Leo"]]},"action":"Confronta il tuo lavoro. Se la tua divisione è diversa, spiega a voce perché l’hai scelta. Controlla che ogni frase stia in una sequenza.","hint":"Una divisione funziona se ogni sequenza racconta un momento e se i titoli, letti di seguito, raccontano la storia. Non esiste un numero giusto di sequenze."},{"phase":"Compito nuovo","title":"Adesso dividi da solo","text":["Ecco un racconto nuovo. Fai tutti i passaggi da solo: numera, cerca i segnali, traccia i confini, scrivi i titoli. Alla fine leggi solo i titoli."],"visual":{"type":"quote","label":"Compito nuovo","text":"Quella mattina nevicava e la scuola era chiusa. Bianca e suo fratello Ettore uscirono in giardino con le slitte. Per tutta la mattina scesero dalla piccola collina dietro casa. A mezzogiorno la nonna li chiamò dalla finestra. In cucina li aspettava una minestra calda. Dopo pranzo, stanchi, si addormentarono sul divano."},"action":"Lavora sul testo e sul foglio. Quando hai finito, vai avanti per confrontare.","hint":"Qui le frasi non sono numerate: comincia tu. Poi cerca le parole che dicono quando: ce ne sono almeno tre."},{"phase":"Controllo","title":"Confronta la tua divisione","text":["Le frasi sono sei. I segnali più forti sono “A mezzogiorno”, che cambia il tempo e porta la nonna, e “Dopo pranzo”.","Ecco una divisione possibile. Anche quattro sequenze vanno bene, se sai spiegare perché."],"visual":{"type":"table","label":"Una divisione possibile","columns":["Sequenza","Frasi","Titolo"],"rows":[["1","1-3","I giochi sulla neve"],["2","4-5","Il pranzo dalla nonna"],["3","6","Il riposo sul divano"]]},"action":"Confronta il tuo lavoro. Poi leggi solo i tuoi titoli: raccontano la storia in ordine?","hint":"Se hai messo la frase 1 da sola, con un titolo come “Una giornata di neve”, va bene: descrive la situazione iniziale. Conta che tu sappia spiegare la tua scelta."},{"phase":"Controllo","title":"Un errore da riconoscere: troppe sequenze","text":["Un errore frequente è fare una sequenza per ogni frase. Così hai tanti titoli quante frasi e la storia non diventa più chiara.","Per correggere, unisci le frasi che raccontano lo stesso momento, nello stesso luogo."],"visual":{"type":"quote","label":"Da correggere","text":"Troppe sequenze: 1. Nevica  2. Escono  3. Scendono con le slitte  4. La nonna chiama  5. La minestra  6. Dormono\n\nMeglio: frasi 1-3 “I giochi sulla neve”."},"action":"Conta le tue sequenze. Se sono tante quante le frasi, unisci quelle che stanno nello stesso luogo e nello stesso momento.","hint":"Le frasi 2 e 3 sono tutte e due in giardino, con le slitte, nella stessa mattina. Raccontano lo stesso momento. Per questo stanno insieme."},{"phase":"Ripresa a casa","title":"Dividi i racconti del tuo libro","text":["A casa usa il metodo con i racconti dell’antologia, il libro di lettura di italiano. Con un racconto lungo, numera i paragrafi invece delle frasi. Un paragrafo è un gruppo di frasi che comincia andando a capo.","Se non sai dove mettere un confine, segnalo con un punto interrogativo e chiedi aiuto."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Numera le frasi o i paragrafi.","Cerca i segnali: tempo, luogo, personaggi, azione.","Traccia una linea dove comincia un momento nuovo.","Scrivi un titolo breve e preciso per ogni sequenza.","Leggi solo i titoli: raccontano la storia?"]},"action":"Scegli un racconto breve del tuo libro e prova la sequenza. Nel Menu trovi la scheda da stampare.","hint":"I titoli delle sequenze sono una buona base per il riassunto. Per continuare, puoi usare il percorso “Fare un riassunto”."}],"coach":{"goal":"Insegnare a segmentare un racconto in sequenze usando segnali di cambiamento (tempo, luogo, personaggi, azione) e a titolare ogni sequenza in modo breve e distintivo. Possono esistere più segmentazioni sensate: si chiede una motivazione, non un numero fisso di sequenze.","prepare":"Stampare i tre racconti con spazio per numerare e tracciare linee. Il percorso non tratta la classificazione delle sequenze (narrativa, descrittiva, dialogica, riflessiva): se la classe la richiede, aggiungerla dopo che la divisione è sicura.","observe":"Chiedere “Che cosa cambia qui?” davanti a ogni confine. Distinguere: segnale non visto (lettura), segnale visto ma confine non tracciato, confini corretti ma titoli generici. Verificare con la lettura dei soli titoli se la storia resta ricostruibile.","adaptations":[["Tracciare i confini — possibile difficoltà con disgrafia","La ricopiatura delle frasi interrompe il lavoro di divisione.","Numerare le frasi sul testo e annotare solo i numeri iniziali e finali di ogni sequenza. Osservare se i confini restano chiari con meno scrittura."],["Cercare i segnali — possibile difficoltà con dislessia","Rilegge più volte il testo e perde le parole-segnale a inizio frase.","Far leggere il testo ad alta voce o con la sintesi vocale, una frase per volta, chiedendo dopo ogni frase “Cambia qualcosa?”. Verificare se i segnali individuati aumentano."],["Scegliere i titoli — difficoltà trasversale","I titoli ripetono una frase intera oppure sono troppo generici.","Proporre la domanda “Che cosa fa il personaggio in questa parte?” e un limite di cinque parole. Osservare se i titoli, letti di seguito, raccontano la storia."]],"sources":["ies2007","eef2025","w3c-coga","aiddsa"],"checks":"Testi originali. Verificati il numero di frasi di ogni racconto (7, 6, 6) e la presenza di ogni segnale citato nelle soluzioni; le soluzioni indicano anche le divisioni alternative accettabili."},"print":{"modelTitle":"Sequenze e titoli — esempio","visual":{"type":"table","label":"Segnali di cambiamento","columns":["Che cosa cambia","Parole-segnale"],"rows":[["Tempo (T)","la sera, il giorno dopo, dopo un’ora"],["Luogo (L)","andò al parco, entrò in casa"],["Personaggi (P)","arrivò la nonna, incontrò un amico"],["Azione (A)","allora decise di…, cominciò a…"]]},"model":["1. Martina voleva fare una sorpresa alla mamma per il suo compleanno. 2. Dopo la scuola, aprì il salvadanaio e contò i soldi. 3. Poi andò nel negozio di fiori vicino a casa. 4. La fioraia le mostrò tulipani, rose e margherite. 5. Martina scelse un mazzo di margherite gialle. 6. La sera, quando la mamma tornò dal lavoro, Martina le diede i fiori. 7. La mamma la abbracciò forte.","Segnali: frase 3 “andò nel negozio” (L); frase 6 “La sera” (T) e arriva la mamma (P).","Sequenza 1, frasi 1-2: Martina prepara la sorpresa.","Sequenza 2, frasi 3-5: La scelta dei fiori.","Sequenza 3, frasi 6-7: Il regalo alla mamma.","Controllo: i titoli, letti di seguito, raccontano la storia."],"practice":[["Prova guidata","1. Sabato mattina Leo e il papà prepararono le valigie. 2. Caricarono la macchina e partirono per il mare. 3. In autostrada trovarono una lunga coda. 4. Dopo tre ore arrivarono all’albergo. 5. Leo corse subito in spiaggia. 6. L’acqua era fredda, ma lui fece il bagno lo stesso.\nCerchia i segnali, traccia i confini e scrivi un titolo per ogni sequenza."],["Compito nuovo","Quella mattina nevicava e la scuola era chiusa. Bianca e suo fratello Ettore uscirono in giardino con le slitte. Per tutta la mattina scesero dalla piccola collina dietro casa. A mezzogiorno la nonna li chiamò dalla finestra. In cucina li aspettava una minestra calda. Dopo pranzo, stanchi, si addormentarono sul divano.\nNumera le frasi, cerca i segnali, dividi in sequenze e scrivi i titoli."]],"answers":["Prova guidata: segnali in frase 3 (L), 4 (T, L), 5 (L). Divisione possibile: 1-2 La partenza per il mare; 3-4 Il viaggio con la coda; 5-6 Il primo bagno di Leo.","Compito nuovo: divisione possibile: 1-3 I giochi sulla neve; 4-5 Il pranzo dalla nonna; 6 Il riposo sul divano.","Sono accettabili altre divisioni, se sai spiegare che cosa cambia. Una sequenza per ogni frase è troppo: unisci le frasi dello stesso momento."],"home":["Numera le frasi o i paragrafi.","Cerca i segnali di tempo, luogo, personaggi e azione.","Traccia una linea dove comincia un momento nuovo.","Scrivi un titolo breve e preciso per ogni sequenza.","Leggi solo i titoli e controlla che raccontino la storia."]},"maps":{},"kind":"task","subject":"Italiano","area":"Antologia e comprensione"},{"id":"M01-08","title":"Distinguere informazioni principali e secondarie","intro":"Scegli le informazioni che servono a rispondere a una domanda e metti da parte i dettagli.","slides":[{"phase":"Preparazione","title":"Principale o secondaria?","text":["Un’informazione principale serve a rispondere alla domanda. Un’informazione secondaria aggiunge un dettaglio: se la togli, la risposta resta completa.","Esempio. Vuoi sapere a che ora parte il treno. L’orario è principale. Il colore del treno è secondario."],"visual":{"type":"list","label":"Prepara","items":["Il testo e la domanda","Una matita e due colori","Un foglio"]},"action":"Scrivi in alto sul foglio: “P = principale” e “S = secondaria”. Userai queste lettere accanto alle frasi.","hint":"Secondaria non vuol dire sbagliata o inutile. Vuol dire che, per questa domanda, non serve. È come fare lo zaino: metti solo ciò che serve per la lezione di oggi."},{"phase":"Preparazione","title":"Tutto dipende dalla domanda","text":["La stessa informazione può essere principale per una domanda e secondaria per un’altra. Per questo, prima di scegliere, devi sapere qual è la domanda.","Riprendiamo l’esempio del treno, con due domande diverse."],"visual":{"type":"table","label":"Stesso treno, due domande","columns":["Domanda","Informazione principale"],"rows":[["A che ora parte il treno?","L’orario: le 8:15"],["Come riconosco il mio treno?","Il colore: è rosso"]]},"action":"Rispondi a voce: per la domanda “Come riconosco il mio treno?”, l’orario è principale o secondario?","hint":"Per riconoscere il treno ti serve vederlo: il colore ti aiuta. L’orario ti dice quando parte, ma non com’è fatto. Quindi, per questa domanda, l’orario è secondario."},{"phase":"Esempio spiegato","title":"Leggi il testo e la domanda","text":["Ecco il testo dell’esempio, con le frasi numerate. La domanda chiede perché le api producono il miele.","Il nettare è il liquido dolce che si trova dentro i fiori. Le api operaie sono le api che lavorano per tutto il gruppo."],"visual":{"type":"quote","label":"Testo e domanda","text":"1. Le api vivono in gruppi numerosi, chiamati colonie.\n2. In ogni colonia c’è una regina, che depone le uova.\n3. Le api hanno sei zampe, come tutti gli insetti.\n4. Le api operaie raccolgono il nettare dei fiori e lo trasformano in miele.\n5. Il miele serve a nutrire la colonia durante l’inverno, quando i fiori sono pochi.\n6. Il miele di acacia è chiaro e molto dolce.\n\nDomanda: Perché le api producono il miele?"},"action":"Leggi o ascolta il testo. Poi copia la domanda in alto sul foglio.","hint":"Tieni la domanda sempre davanti. Ogni volta che decidi se una frase è principale, la confronti con la domanda."},{"phase":"Esempio spiegato","title":"Una frase alla volta: serve alla domanda?","text":["Ora guarda una frase alla volta e chiediti: questa frase aiuta a spiegare perché le api producono il miele?","Le prime tre frasi parlano delle api, ma non del miele. Per questa domanda sono secondarie."],"visual":{"type":"table","label":"Frasi 1-3","columns":["Frase","P o S","Perché"],"rows":[["1. Vivono in colonie","S","Dice dove vivono, non parla del miele"],["2. La regina depone le uova","S","Parla delle uova, non del miele"],["3. Hanno sei zampe","S","Descrive il corpo, non parla del miele"]]},"action":"Scrivi S accanto alle frasi 1, 2 e 3 del testo.","hint":"Le frasi secondarie sono vere e possono essere interessanti. Ma adesso cerchi solo ciò che risponde alla domanda sul miele."},{"phase":"Esempio spiegato","title":"Trova le frasi che rispondono","text":["La frase 4 dice da dove viene il miele: le api lo fanno con il nettare. La frase 5 dice a che cosa serve: è il motivo che cerchiamo. Sono principali.","La frase 6 parla di un tipo di miele. Non spiega perché le api lo producono: è secondaria."],"visual":{"type":"table","label":"Frasi 4-6","columns":["Frase","P o S","Perché"],"rows":[["4. Trasformano il nettare in miele","P","Dice da dove viene il miele"],["5. Il miele nutre la colonia in inverno","P","Dice a che cosa serve il miele"],["6. Il miele di acacia è chiaro","S","Descrive un tipo di miele"]]},"action":"Scrivi P accanto alle frasi 4 e 5. Scrivi S accanto alla frase 6. Sottolinea con un colore le frasi principali.","hint":"Prova a leggere la domanda e poi solo la frase 5: “Perché le api producono il miele? Il miele serve a nutrire la colonia durante l’inverno”. Funziona come risposta."},{"phase":"Esempio spiegato","title":"La prova di eliminazione","text":["Se hai un dubbio, fai la prova di eliminazione. Togli una frase e rileggi la risposta. Se la risposta resta completa, la frase era secondaria. Se manca qualcosa, era principale."],"visual":{"type":"quote","label":"Due prove","text":"Tolgo la frase 6 (miele di acacia): la risposta è ancora completa. → S\n\nTolgo la frase 5 (il miele nutre la colonia): manca il motivo. → P"},"action":"Fai tu la prova con la frase 2. Togli la regina che depone le uova: alla risposta sul miele manca qualcosa?","hint":"Copri la frase con un dito e rileggi solo le frasi rimaste. Chiediti: riesco ancora a rispondere alla domanda? Se sì, la frase coperta era secondaria."},{"phase":"Esempio spiegato","title":"Scrivi la risposta con le principali","text":["Ora scrivi la risposta usando solo le frasi principali, la 4 e la 5. Puoi usare parole tue, ma le informazioni devono restare le stesse."],"visual":{"type":"quote","label":"La risposta","text":"Le api operaie trasformano il nettare dei fiori in miele. Il miele serve a nutrire la colonia durante l’inverno, quando i fiori sono pochi."},"action":"Scrivi la risposta sul foglio. Controlla che ci siano il nettare e il motivo: nutrire la colonia in inverno.","hint":"Se la parola “colonia” ti sembra poco chiara, puoi scrivere “il gruppo di api”. La frase 1 ti aiuta a capire la parola, ma non serve copiarla nella risposta."},{"phase":"Controllo dell’esempio","title":"Cambia la domanda, cambiano le principali","text":["Ora immagina un’altra domanda sullo stesso testo: “Chi depone le uova nella colonia?”. Adesso la frase 2 diventa principale. Le frasi 4 e 5 diventano secondarie.","Ecco perché, prima di sottolineare, devi sempre sapere qual è la domanda."],"visual":{"type":"table","label":"Stesso testo, due domande","columns":["Domanda","Frasi principali"],"rows":[["Perché le api producono il miele?","4 e 5"],["Chi depone le uova nella colonia?","2"]]},"action":"Con un secondo colore, segna la frase principale per la nuova domanda. Poi rispondi a voce.","hint":"Risposta: la regina depone le uova. Hai bisogno solo della frase 2. Le frasi sul miele, per questa domanda, sono dettagli."},{"phase":"Prova guidata","title":"Prova tu: gli orari della piscina","text":["Ora lavora tu su questo testo. Segna P o S accanto a ogni frase. Se hai un dubbio, fai la prova di eliminazione. Poi scrivi la risposta solo con le frasi principali."],"visual":{"type":"quote","label":"Testo e domanda","text":"1. La piscina comunale è aperta dal lunedì al venerdì, dalle 14 alle 20.\n2. Il sabato apre solo la mattina, dalle 9 alle 13.\n3. La domenica è chiusa.\n4. All’ingresso si possono comprare le cuffie.\n5. L’acqua della vasca grande è a 27 gradi.\n\nDomanda: In quali giorni e a che ora si può andare in piscina?"},"action":"Scrivi P o S accanto alle cinque frasi. Poi scrivi la risposta sul foglio e vai avanti per controllare.","hint":"La domanda chiede due cose: i giorni e gli orari. Per ogni frase chiediti: dice un giorno o un orario della piscina?"},{"phase":"Controllo guidato","title":"Confronta le tue scelte","text":["Le frasi 1, 2 e 3 sono principali: dicono giorni e orari. Anche “la domenica è chiusa” serve: dice quando non puoi andare.","Le frasi 4 e 5 sono secondarie: parlano di cuffie e di acqua, non di orari."],"visual":{"type":"quote","label":"Una risposta possibile","text":"Principali: 1, 2, 3. Secondarie: 4, 5.\n\nRisposta: Si può andare in piscina dal lunedì al venerdì dalle 14 alle 20 e il sabato dalle 9 alle 13. La domenica è chiusa."},"action":"Confronta P e S e la tua risposta. Controlla di avere tutti gli orari.","hint":"Un errore frequente è togliere i numeri perché sembrano dettagli. Qui gli orari sono proprio la risposta. I numeri sono principali quando la domanda li chiede."},{"phase":"Compito nuovo","title":"Adesso scegli da solo","text":["Ecco un testo nuovo sul castoro. Lavora da solo: P o S per ogni frase, prova di eliminazione, risposta con le frasi principali.","Una diga è un muro che ferma l’acqua di un fiume o di un ruscello."],"visual":{"type":"quote","label":"Testo e domanda","text":"1. Il castoro è un animale che vive vicino ai fiumi e ai ruscelli.\n2. Ha denti molto forti, che crescono per tutta la vita.\n3. Con i denti taglia i tronchi degli alberi.\n4. Con tronchi, rami e fango costruisce una diga attraverso il ruscello.\n5. La diga ferma l’acqua e forma un piccolo lago.\n6. Nel lago il castoro costruisce la sua tana.\n7. L’ingresso della tana è sott’acqua: così per i nemici è difficile entrare.\n8. Un castoro adulto può pesare più di 20 chili.\n\nDomanda: Perché il castoro costruisce la diga?"},"action":"Segna P o S accanto alle otto frasi e scrivi la risposta. Poi vai avanti per controllare.","hint":"Cerca le frasi che dicono che cosa succede dopo la diga. Che cosa forma la diga? Che cosa costruisce il castoro lì? Perché è al sicuro?"},{"phase":"Controllo","title":"Controlla le scelte sul castoro","text":["Le frasi principali sono la 5, la 6 e la 7. Insieme spiegano il motivo: la diga forma un lago, dove il castoro fa una tana sicura.","Le frasi 1, 2 e 8 sono secondarie. Le frasi 3 e 4 dicono come costruisce la diga, non perché."],"visual":{"type":"quote","label":"Una risposta possibile","text":"Principali: 5, 6, 7. Secondarie: 1, 2, 3, 4, 8.\n\nRisposta: Il castoro costruisce la diga per formare un piccolo lago. Nel lago fa la sua tana, con l’ingresso sott’acqua, così per i nemici è difficile entrare."},"action":"Confronta le tue lettere e la tua risposta. Controlla che ci siano il lago e la tana sicura.","hint":"Se hai segnato P anche accanto alla frase 4, va bene come aiuto: dice che cos’è la diga. Ma la risposta deve contenere il motivo, cioè le frasi 5, 6 e 7."},{"phase":"Controllo","title":"Un errore da riconoscere: come o perché?","text":["Un errore frequente è rispondere “come” quando la domanda chiede “perché”. Per esempio: “Il castoro costruisce la diga con tronchi, rami e fango”. È vero, ma dice come, non perché.","Per correggere, rileggi la parola-domanda e cerca la frase con il motivo."],"visual":{"type":"quote","label":"Da correggere","text":"Risponde a “come”: Il castoro costruisce la diga con tronchi, rami e fango.\n\nRisponde a “perché”: Il castoro costruisce la diga per formare un lago dove fare una tana sicura."},"action":"Rileggi la tua risposta. Se dice solo come il castoro costruisce la diga, aggiungi il motivo.","hint":"Il motivo spesso si riconosce da parole come “per”, “così”, “perché”. Nella frase 7 c’è “così”: è un indizio che lì c’è una conseguenza importante."},{"phase":"Ripresa a casa","title":"Scegli le informazioni nei tuoi testi","text":["A casa usa il metodo quando studi o rispondi a una domanda. Scrivi sempre la domanda in alto, prima di sottolineare.","Se nel libro sottolinei quasi tutto, fermati. Rileggi la domanda e tieni solo le frasi che rispondono."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Scrivi la domanda in alto.","Numera le frasi del testo.","Segna P o S accanto a ogni frase.","Se hai un dubbio, fai la prova di eliminazione.","Scrivi la risposta solo con le frasi principali."]},"action":"Scegli un paragrafo del tuo libro di scienze o di storia e una domanda su quel paragrafo. Prova la sequenza. Nel Menu trovi la scheda da stampare.","hint":"Quando il libro non ti dà una domanda, puoi usare il titolo del paragrafo come domanda. Questo metodo ti aiuta anche a fare il riassunto: c’è il percorso “Fare un riassunto”."}],"coach":{"goal":"Insegnare a selezionare le informazioni in funzione di una domanda guida: classificazione principale/secondaria frase per frase, prova di eliminazione, risposta costruita solo con le informazioni principali. Far emergere che “principale” dipende dalla domanda.","prepare":"Stampare i testi con le frasi numerate. Tenere due colori per la schermata in cui cambia la domanda. Se lo studente sottolinea abitualmente tutto il testo, partire da testi di cinque o sei frasi.","observe":"Chiedere “Questa frase risponde alla domanda?” per ogni scelta. Distinguere: domanda non tenuta presente (sottolinea tutto), confusione tra “come” e “perché”, eliminazione automatica dei numeri. Un dettaglio escluso qui può diventare principale con un’altra domanda.","adaptations":[["Classificare le frasi — difficoltà trasversale (attenzione e memoria)","Sottolinea quasi tutto oppure perde di vista la domanda dopo poche frasi.","Scrivere la domanda in alto e rileggerla prima di ogni frase; lavorare con frasi numerate. Confrontare il numero di frasi segnate e la completezza della risposta."],["Lettura del testo — possibile difficoltà con dislessia","Il carico di lettura fa perdere il collegamento tra frase e domanda.","Leggere le frasi una per volta ad alta voce o con la sintesi vocale, con la domanda sempre visibile. Verificare se la classificazione migliora."],["Numeri e orari — possibile difficoltà con discalculia","Elimina i numeri come dettagli oppure li trascrive in modo scorretto nella risposta.","Chiarire che i numeri possono essere principali quando la domanda li richiede; consentire di indicare i numeri sul testo invece di ricopiarli. Controllare la scelta separatamente dalla trascrizione."]],"sources":["ies2007","eef2025","w3c-coga","aiddsa"],"checks":"Fatti verificati a livello di scuola media: le api operaie raccolgono il nettare e lo trasformano in miele, scorta di cibo per l’inverno; gli insetti hanno sei zampe; il miele di acacia è chiaro e dolce. Il castoro ha incisivi che crescono per tutta la vita, costruisce dighe che formano piccoli laghi e tane con ingresso sott’acqua; un adulto può superare i 20 kg. Gli orari della piscina sono inventati."},"print":{"modelTitle":"Principali e secondarie — esempio","model":["1. Le api vivono in gruppi numerosi, chiamati colonie. 2. In ogni colonia c’è una regina, che depone le uova. 3. Le api hanno sei zampe, come tutti gli insetti. 4. Le api operaie raccolgono il nettare dei fiori e lo trasformano in miele. 5. Il miele serve a nutrire la colonia durante l’inverno, quando i fiori sono pochi. 6. Il miele di acacia è chiaro e molto dolce.","Domanda: Perché le api producono il miele?","Frasi 1, 2, 3: S, non parlano del miele. Frasi 4 e 5: P, dicono da dove viene e a che cosa serve. Frase 6: S, descrive un tipo di miele.","Prova di eliminazione: senza la frase 6 la risposta è completa; senza la frase 5 manca il motivo.","Risposta: Le api operaie trasformano il nettare dei fiori in miele. Il miele serve a nutrire la colonia durante l’inverno, quando i fiori sono pochi.","Con la domanda “Chi depone le uova?” la frase principale diventa la 2."],"practice":[["Prova guidata","1. La piscina comunale è aperta dal lunedì al venerdì, dalle 14 alle 20. 2. Il sabato apre solo la mattina, dalle 9 alle 13. 3. La domenica è chiusa. 4. All’ingresso si possono comprare le cuffie. 5. L’acqua della vasca grande è a 27 gradi.\nDomanda: In quali giorni e a che ora si può andare in piscina?\nSegna P o S e scrivi la risposta."],["Compito nuovo","1. Il castoro è un animale che vive vicino ai fiumi e ai ruscelli. 2. Ha denti molto forti, che crescono per tutta la vita. 3. Con i denti taglia i tronchi degli alberi. 4. Con tronchi, rami e fango costruisce una diga attraverso il ruscello. 5. La diga ferma l’acqua e forma un piccolo lago. 6. Nel lago il castoro costruisce la sua tana. 7. L’ingresso della tana è sott’acqua: così per i nemici è difficile entrare. 8. Un castoro adulto può pesare più di 20 chili.\nDomanda: Perché il castoro costruisce la diga?"]],"answers":["Piscina: principali 1, 2, 3; secondarie 4, 5. Si può andare dal lunedì al venerdì dalle 14 alle 20 e il sabato dalle 9 alle 13; la domenica è chiusa.","Castoro: principali 5, 6, 7. Il castoro costruisce la diga per formare un piccolo lago, dove fa la tana con l’ingresso sott’acqua: così per i nemici è difficile entrare.","Le frasi 3 e 4 dicono come costruisce la diga, non perché. I numeri sono principali quando la domanda li chiede."],"home":["Scrivi la domanda in alto.","Numera le frasi e segna P o S.","Se hai un dubbio, togli la frase e rileggi la risposta.","Scrivi la risposta solo con le frasi principali."]},"maps":{},"kind":"task","subject":"Italiano","area":"Antologia e comprensione"},{"id":"M01-09","title":"Fare un riassunto","intro":"Racconta un testo in meno parole, con i fatti principali e nell’ordine giusto.","slides":[{"phase":"Preparazione","title":"Che cos’è un riassunto","text":["Un riassunto racconta lo stesso testo con meno parole. Chi lo legge deve capire la storia anche senza aver letto il testo.","Il riassunto deve essere fedele: stessi fatti, stesso ordine. Non si aggiungono fatti nuovi né opinioni."],"visual":{"type":"list","label":"Prepara","items":["Il testo da riassumere","Una matita e un evidenziatore","Un foglio"]},"action":"Scrivi in alto sul foglio: “Riassunto”. Lascia sotto due zone: una per gli appunti e una per il testo finale.","hint":"Un’opinione è ciò che pensi tu, per esempio “è una storia bella” o “il personaggio è simpatico”. Nel riassunto racconti solo ciò che dice il testo."},{"phase":"Preparazione","title":"Le regole del riassunto","text":["Queste regole ti guideranno in ogni passaggio. Le vedrai una alla volta nell’esempio.","La regola più importante è l’ultima: alla fine confronta sempre il riassunto con il testo."],"visual":{"type":"list","label":"Cinque regole","items":["Tieni solo le informazioni principali.","Rispetta l’ordine dei fatti.","Trasforma le battute tra virgolette in frasi raccontate.","Collega le frasi con parole come “ma”, “poi”, “perché”.","Confronta il riassunto con il testo: niente aggiunte."]},"action":"Leggi le cinque regole a voce. Copiale in fondo al foglio, oppure tieni questa schermata a portata di mano.","hint":"Le battute sono le parole dette da un personaggio, scritte tra virgolette. Per esempio: “Ho fame!” disse Luca. Nel riassunto diventano: Luca disse che aveva fame."},{"phase":"Esempio spiegato","title":"Leggi tutto il testo","text":["Prima di riassumere, leggi tutto il testo e capisci la storia. Una corsa campestre è una gara di corsa nei prati e nei sentieri, fuori dalla pista."],"visual":{"type":"quote","label":"Il testo dell’esempio","text":"Era il giorno della corsa campestre. Giorgio si era allenato per un mese e voleva arrivare tra i primi dieci. Dopo la partenza, però, una scarpa gli si slacciò e lui cadde nel fango. Un ragazzo di un’altra scuola si fermò e lo aiutò a rialzarsi. “Grazie! Corri, non aspettarmi!” gli disse Giorgio. Giorgio si allacciò la scarpa e ripartì. Arrivò quindicesimo, tutto sporco di fango. Al traguardo cercò il ragazzo che lo aveva aiutato e gli strinse la mano."},"action":"Leggi o ascolta il testo. Poi di’ a voce, in una frase, che cosa succede a Giorgio.","hint":"Per esempio: “Giorgio cade durante una gara, un ragazzo lo aiuta e lui lo ringrazia”. Questa frase non è ancora il riassunto. Serve a sapere dove va la storia."},{"phase":"Esempio spiegato","title":"Dividi il testo in parti","text":["Ora dividi il testo in parti. Ogni parte racconta un momento della storia. Questo testo ha quattro parti: la gara, la caduta, l’arrivo, il saluto finale.","Per imparare a dividere, c’è anche il percorso “Dividere un racconto in sequenze”."],"visual":{"type":"quote","label":"Le quattro parti","text":"1. Era il giorno della corsa campestre. Giorgio si era allenato per un mese e voleva arrivare tra i primi dieci.\n2. Dopo la partenza, però, una scarpa gli si slacciò e lui cadde nel fango. Un ragazzo di un’altra scuola si fermò e lo aiutò a rialzarsi. “Grazie! Corri, non aspettarmi!” gli disse Giorgio.\n3. Giorgio si allacciò la scarpa e ripartì. Arrivò quindicesimo, tutto sporco di fango.\n4. Al traguardo cercò il ragazzo che lo aveva aiutato e gli strinse la mano."},"action":"Sul tuo testo traccia una linea tra una parte e l’altra. Scrivi un numero all’inizio di ogni parte.","hint":"Cerca le parole che segnalano un cambiamento. “Dopo la partenza” dice che la gara è cominciata. “Al traguardo” indica un luogo nuovo."},{"phase":"Esempio spiegato","title":"Trova il fatto principale di ogni parte","text":["Per ogni parte chiediti: che cosa succede di importante? Scrivi la risposta in poche parole. Questi appunti saranno la base del riassunto."],"visual":{"type":"table","label":"Il fatto principale di ogni parte","columns":["Parte","Fatto principale"],"rows":[["1","Giorgio fa una corsa campestre, vuole arrivare tra i primi dieci"],["2","Cade per una scarpa slacciata, un ragazzo lo aiuta"],["3","Riparte e arriva quindicesimo"],["4","Al traguardo stringe la mano al ragazzo"]]},"action":"Nella zona degli appunti scrivi una riga per ogni parte. Usa poche parole, come nella tabella.","hint":"Per scegliere il fatto principale, prova a toglierlo. Se senza quel fatto la storia non si capisce, è principale. Senza la scarpa slacciata, per esempio, non sai perché Giorgio cade."},{"phase":"Esempio spiegato","title":"Lascia da parte i dettagli","text":["Alcune informazioni sono dettagli. Rendono il testo più vivo, ma la storia si capisce anche senza. Nel riassunto puoi lasciarle da parte.","Attenzione: tieni i dettagli che spiegano qualcosa. “Voleva arrivare tra i primi dieci” serve: fa capire che cosa significa arrivare quindicesimo."],"visual":{"type":"quote","label":"Dettagli da lasciare","text":"“si era allenato per un mese”\n“si allacciò la scarpa”\n“tutto sporco di fango”"},"action":"Nel testo metti tra parentesi questi tre dettagli. Non serve cancellarli: è utile rileggerli se hai un dubbio.","hint":"Chiediti: se tolgo questo dettaglio, chi legge il riassunto perde un pezzo della storia? Se la risposta è no, è un dettaglio da lasciare."},{"phase":"Esempio spiegato","title":"Le battute diventano frasi raccontate","text":["Nel riassunto non si scrivono le battute tra virgolette. Si raccontano con parole tue. Questo modo si chiama discorso indiretto: dici che cosa ha detto il personaggio, senza virgolette.","Spesso basta il verbo che riassume la battuta, come “lo ringraziò”."],"visual":{"type":"quote","label":"Dalla battuta alla frase raccontata","text":"Nel testo: “Grazie! Corri, non aspettarmi!” gli disse Giorgio.\n\nNel riassunto: Giorgio lo ringraziò e gli disse di non aspettarlo."},"action":"Nei tuoi appunti, accanto alla parte 2, scrivi la frase raccontata: “Giorgio lo ringraziò”.","hint":"“Grazie!” diventa “lo ringraziò”. Poi l’invito tra virgolette diventa “gli disse di non aspettarlo”. Le virgolette spariscono, ma il senso delle parole resta."},{"phase":"Esempio spiegato","title":"Scrivi le frasi e collegale","text":["Ora trasforma gli appunti in frasi complete. Usa parole che collegano i fatti: “ma” per un problema, “poi” per ciò che viene dopo, “perché” per una causa.","Usa lo stesso tempo del testo, oppure quello che chiede l’insegnante."],"visual":{"type":"quote","label":"Il riassunto","text":"Giorgio partecipò a una corsa campestre: voleva arrivare tra i primi dieci. Durante la gara gli si slacciò una scarpa e lui cadde nel fango, ma un ragazzo di un’altra scuola lo aiutò a rialzarsi. Giorgio lo ringraziò, ripartì e arrivò quindicesimo. Al traguardo cercò il ragazzo e gli strinse la mano."},"action":"Scrivi il riassunto nella zona del testo finale. Puoi usare queste frasi o parole tue. Segna con un colore le parole che collegano.","hint":"Il testo aveva otto frasi; il riassunto ne ha quattro. Non c’è una lunghezza fissa: se l’insegnante dà un numero di righe, rispettalo."},{"phase":"Controllo dell’esempio","title":"Controlla che il riassunto sia fedele","text":["Ora rileggi il riassunto accanto al testo. Ogni frase del riassunto deve corrispondere a qualcosa nel testo.","Due errori frequenti sono cambiare un fatto o aggiungere un’emozione che il testo non dice."],"visual":{"type":"quote","label":"Due frasi da correggere","text":"Cambia un fatto: “Giorgio vinse la gara grazie al ragazzo”. Nel testo arriva quindicesimo.\n\nAggiunge un’emozione: “Giorgio era deluso”. Il testo non lo dice."},"action":"Rileggi il tuo riassunto frase per frase. Per ognuna indica nel testo la parte da cui viene. Se non la trovi, correggi.","hint":"Arrivare tra i primi dieci era il desiderio di Giorgio. Arrivare quindicesimo è ciò che succede davvero. Nel riassunto tieni distinti il desiderio e il risultato."},{"phase":"Prova guidata","title":"Prova tu: parti e fatti principali","text":["Ora lavora su un testo nuovo. Prima dividilo in parti. Poi scrivi negli appunti il fatto principale di ogni parte.","Una macedonia è un insieme di frutta tagliata a pezzi."],"visual":{"type":"quote","label":"Il tuo testo","text":"Sofia voleva preparare una torta per la festa di classe. Seguì la ricetta della nonna, ma per sbaglio mise il sale al posto dello zucchero. Quando assaggiò l’impasto, fece una smorfia. “È salatissimo!” esclamò. Non c’era più tempo per rifare la torta. Allora Sofia comprò della frutta e preparò una macedonia. A scuola la macedonia finì in pochi minuti."},"action":"Traccia le linee tra le parti e scrivi un fatto principale per ogni parte. Poi vai avanti per confrontare.","hint":"Prova con quattro parti: che cosa vuole Sofia; che errore fa e come se ne accorge; che cosa fa per rimediare; come va a scuola."},{"phase":"Controllo guidato","title":"Confronta parti e fatti principali","text":["Ecco una divisione possibile. Le tue parole possono essere diverse. Controlla che ci siano l’errore del sale e la soluzione della macedonia."],"visual":{"type":"table","label":"Parti e fatti principali","columns":["Parte","Fatto principale"],"rows":[["1","Sofia vuole fare una torta per la festa di classe"],["2","Mette il sale al posto dello zucchero e se ne accorge assaggiando"],["3","Non c’è tempo: prepara una macedonia"],["4","A scuola la macedonia finisce subito"]]},"action":"Confronta i tuoi appunti con la tabella. Aggiungi i fatti che mancano.","hint":"“Seguì la ricetta della nonna” e “fece una smorfia” sono dettagli. La smorfia mostra che l’impasto è cattivo, ma basta dire che Sofia se ne accorge."},{"phase":"Prova guidata","title":"Scrivi il riassunto di Sofia","text":["Ora trasforma gli appunti in tre o quattro frasi. Ricorda: la battuta “È salatissimo!” diventa una frase raccontata. Collega i fatti con “ma”, “perciò”, “poi”."],"visual":{"type":"table","label":"I tuoi appunti","columns":["Parte","Fatto principale"],"rows":[["1","Sofia vuole fare una torta per la festa di classe"],["2","Mette il sale al posto dello zucchero e se ne accorge assaggiando"],["3","Non c’è tempo: prepara una macedonia"],["4","A scuola la macedonia finisce subito"]]},"action":"Scrivi il riassunto sul foglio. Poi rileggilo accanto al testo e vai avanti per confrontare.","hint":"Puoi cominciare così: “Sofia voleva preparare una torta per la festa di classe, ma…”. “Perciò” serve a dire una conseguenza: non c’è tempo, perciò fa altro."},{"phase":"Controllo guidato","title":"Confronta il riassunto di Sofia","text":["Ecco un riassunto possibile. La battuta “È salatissimo!” è diventata “si accorse che era salatissimo”. Le parole che collegano mostrano il problema e la conseguenza."],"visual":{"type":"quote","label":"Un riassunto possibile","text":"Sofia voleva preparare una torta per la festa di classe, ma per sbaglio mise il sale al posto dello zucchero. Assaggiando l’impasto, si accorse che era salatissimo. Non c’era tempo per rifare la torta, perciò preparò una macedonia. A scuola la macedonia finì in pochi minuti."},"action":"Confronta con il tuo riassunto. Controlla ordine dei fatti, battuta trasformata e parole che collegano.","hint":"Se nel tuo riassunto c’è “Sofia era disperata”, toglilo: il testo dice solo che fece una smorfia. Se hai scritto “la torta era buonissima”, rileggi: la torta non è mai stata cotta."},{"phase":"Compito nuovo","title":"Adesso riassumi da solo","text":["Ecco un testo nuovo. Fai tutti i passaggi da solo: parti, fatti principali, dettagli da lasciare, battuta raccontata, frasi collegate, controllo finale.","La marmotta è un animale di montagna, grande più o meno come un gatto."],"visual":{"type":"quote","label":"Compito nuovo","text":"Durante la gita in montagna, Alice si allontanò dal gruppo per fotografare una marmotta. Quando si voltò, non vide più nessuno. Per un attimo ebbe paura. Poi ricordò il consiglio della guida: “Se vi perdete, restate fermi e fischiate”. Alice si sedette su un sasso e soffiò nel fischietto che aveva al collo. Dopo pochi minuti arrivò la guida, seguita dai compagni. Da quel giorno, nelle gite, Alice restò sempre vicina al gruppo."},"action":"Scrivi il riassunto in quattro frasi al massimo. Poi vai avanti per confrontare.","hint":"Prova con quattro parti. Alice si allontana e si perde. Ricorda il consiglio e fischia. La guida la trova. Da quel giorno cambia il suo modo di fare le gite."},{"phase":"Controllo","title":"Confronta il tuo riassunto","text":["Ecco un riassunto possibile. La battuta della guida è diventata “il consiglio di restare ferma e fischiare”.","Controlla anche le aggiunte. “Alice fu sgridata dalla guida” non è nel testo: va tolto."],"visual":{"type":"quote","label":"Un riassunto possibile","text":"Durante una gita in montagna, Alice si allontanò dal gruppo per fotografare una marmotta e si perse. Ricordò il consiglio della guida di restare ferma e fischiare, e soffiò nel suo fischietto. Dopo pochi minuti la guida e i compagni la ritrovarono. Da allora, nelle gite, Alice restò sempre vicina al gruppo."},"action":"Confronta il tuo riassunto frase per frase. Controlla che ci siano il motivo per cui Alice si perde, il fischietto e il finale.","hint":"“Per un attimo ebbe paura” è un dettaglio: puoi tenerlo o lasciarlo. Invece il fischietto è principale: spiega come la guida ritrova Alice."},{"phase":"Ripresa a casa","title":"Riassumi i testi del tuo libro","text":["A casa comincia da testi brevi. Prima di scrivere, prepara sempre gli appunti: una riga per ogni parte.","Se il testo è raccontato con “io”, nel riassunto di solito si scrive “lui” o “lei”. Chiedi all’insegnante che cosa preferisce."],"visual":{"type":"list","label":"La sequenza da seguire","items":["Leggi tutto il testo e di’ che cosa succede.","Dividi il testo in parti.","Scrivi il fatto principale di ogni parte.","Trasforma le battute e collega le frasi.","Confronta con il testo: stessi fatti, stesso ordine, niente aggiunte."]},"action":"Scegli un racconto breve del tuo libro e prova la sequenza. Nel Menu trovi la scheda da stampare.","hint":"Se scrivere tutto il riassunto è faticoso, prova prima a dirlo a voce, seguendo gli appunti. Poi scrivilo, oppure dettalo, se lo fai già a scuola."}],"coach":{"goal":"Insegnare a costruire un riassunto fedele: divisione in parti, scelta del fatto principale per parte, eliminazione dei dettagli non necessari, trasformazione del discorso diretto, collegamenti tra le frasi e controllo finale di fedeltà. La lunghezza dipende dalla consegna e dai nuclei del testo, non da una percentuale fissa.","prepare":"Stampare i tre testi con spazio per tracciare le linee e per gli appunti. Chiedere quale tempo verbale preferisce l’insegnante (passato o presente) e se è richiesta la terza persona. Il percorso si collega a “Dividere un racconto in sequenze” e a “Distinguere informazioni principali e secondarie”.","observe":"Per ogni frase del riassunto chiedere “Da quale parte del testo viene?”. Distinguere: errore di selezione (manca il problema o il finale), errore di ordine, errore di fedeltà (fatti cambiati, emozioni aggiunte), difficoltà di scrittura. Se il riassunto orale è completo e quello scritto no, il nodo è l
